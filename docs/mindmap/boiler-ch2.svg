<text x="55.0" y="738.4" font-size="21" font-weight="700" fill="#ffffff" xml:space="preserve">第二章 煤粉制备</text>
<rect x="280.4" y="239.6" width="161.2" height="40.8" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="295.4" y="262.3" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第一节 煤粉的性质</text>
<rect x="574.6" y="68.0" width="283.4" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="89.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">一、一般特性：流动性 · 自燃与爆炸性 ·</text>
<text x="589.6" y="107.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">堆积特性</text>
<rect x="574.6" y="133.2" width="232.6" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="154.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">爆炸最危险浓度 1.2~2.0 kg/m³</text>
<rect x="574.6" y="180.3" width="199.4" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="201.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">二、煤粉细度及颗粒特性 ★</text>
<rect x="574.6" y="227.4" width="281.6" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="248.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">Rₓ = a/(a+b)×100% · 破碎公式 Rₓ =</text>
<text x="589.6" y="266.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">100e−ᵇˣⁿ</text>
<rect x="574.6" y="292.5" width="274.6" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="313.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">均匀性指数 n（0.8~1.2）· 经济细度 R</text>
<text x="589.6" y="331.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">₉₀ᵒᵖᵗ</text>
<rect x="574.6" y="357.7" width="227.2" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="378.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">三、煤的可磨性（HGI / Kgᵣ）</text>
<rect x="574.6" y="404.8" width="275.0" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="425.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">四、煤的磨损特性（冲刷磨损指数 Kₑ）</text>
<rect x="280.4" y="665.1" width="129.6" height="40.8" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="295.4" y="687.8" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第二节 磨煤机</text>
<rect x="574.6" y="451.9" width="232.4" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="473.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">按转速分类：低速 / 中速 / 高速</text>
<rect x="574.6" y="499.0" width="185.6" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="520.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">一、筒式钢球磨煤机 ★★</text>
<rect x="574.6" y="546.1" width="178.0" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="567.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">单进单出 · 双进双出</text>
<text x="589.6" y="585.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">（带/不带热风空心管）</text>
<rect x="574.6" y="611.3" width="277.7" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="632.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">影响因素：转速 ncⱼ · 护甲 · 钢球充满</text>
<text x="589.6" y="650.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">系数 ψ · 通风量 · 水分 · 钢球直径 ·</text>
<text x="589.6" y="668.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">存煤量</text>
<rect x="574.6" y="694.5" width="158.1" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="715.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">二、中速磨煤机 ★★</text>
<rect x="574.6" y="741.6" width="276.3" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="762.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">碗式(HP) · 轮式(MPS/ZGM) · 球环式</text>
<text x="589.6" y="780.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">(E型)</text>
<rect x="574.6" y="806.8" width="273.7" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="827.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">影响因素：转速 · 通风量 · 风环气流速</text>
<text x="589.6" y="846.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">度 · 研磨压力 · 燃料性质</text>
<rect x="574.6" y="872.0" width="275.7" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="893.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">三、磨煤机出力和功率（磨煤出力 Bₘ /</text>
<text x="589.6" y="911.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">干燥出力 Bg）</text>
<rect x="280.4" y="1038.1" width="145.4" height="40.8" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="295.4" y="1060.8" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第三节 制粉系统</text>
<rect x="574.6" y="937.2" width="186.3" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="958.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">一、中间储仓式</text>
<text x="589.6" y="976.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">（乏气送粉 / 热风送粉）</text>
<rect x="574.6" y="1002.3" width="268.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="1023.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">二、直吹式（正压：热一次风机 / 冷一</text>
<text x="589.6" y="1041.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">次风机）</text>
<rect x="574.6" y="1067.5" width="268.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="1088.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">三、煤粉分离器：粗粉分离器 · 细粉分</text>
<text x="589.6" y="1106.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">离器（旋风）</text>
<rect x="574.6" y="1132.7" width="200.1" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="1153.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">辅助设备：给煤机 · 给粉机</text>
<rect x="280.4" y="1179.8" width="240.3" height="61.5" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="295.4" y="1202.5" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第四节 磨煤机及制粉系统选型</text>
<text x="295.4" y="1223.3" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">（课件未覆盖）</text>
