<rect x="40.0" y="722.5" width="186.4" height="48.1" rx="11" fill="#e8590c" stroke="none" filter="url(#sh)"/>
<text x="55.0" y="749.7" font-size="21" font-weight="700" fill="#ffffff" xml:space="preserve">第二章 煤粉制备</text>
<rect x="280.4" y="244.1" width="161.2" height="40.8" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="295.4" y="266.8" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第一节 煤粉的性质</text>
<rect x="574.6" y="68.0" width="283.4" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="89.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">一、一般特性：流动性 · 自燃与爆炸性 ·</text>
<text x="589.6" y="107.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">堆积特性</text>
<rect x="574.6" y="133.2" width="232.6" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="154.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">爆炸最危险浓度 1.2~2.0 kg/m³</text>
<rect x="574.6" y="180.3" width="199.4" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="201.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">二、煤粉细度及颗粒特性 ★</text>
<rect x="574.6" y="227.4" width="251.0" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="248.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">R_x = a/(a+b)×100% · 破碎公式</text>
<text x="589.6" y="266.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">R_x = 100e^(−bxⁿ)</text>
<rect x="574.6" y="292.5" width="274.6" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="313.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">均匀性指数 n（0.8~1.2）· 经济细度 R</text>
<text x="589.6" y="331.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">₉₀^opt</text>
<rect x="574.6" y="357.7" width="235.7" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="378.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">三、煤的可磨性（HGI / K_gr）</text>
<rect x="574.6" y="404.8" width="173.3" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="425.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">四、煤的磨损特性</text>
<text x="589.6" y="444.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">（冲刷磨损指数 K_e）</text>
<rect x="280.4" y="683.2" width="129.6" height="40.8" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="295.4" y="705.9" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第二节 磨煤机</text>
<rect x="574.6" y="470.0" width="232.4" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="491.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">按转速分类：低速 / 中速 / 高速</text>
<rect x="574.6" y="517.1" width="185.6" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="538.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">一、筒式钢球磨煤机 ★★</text>
<rect x="574.6" y="564.2" width="178.0" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="585.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">单进单出 · 双进双出</text>
<text x="589.6" y="603.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">（带/不带热风空心管）</text>
<rect x="574.6" y="629.4" width="279.9" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="650.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">影响因素：转速 n_cj · 护甲 · 钢球充</text>
<text x="589.6" y="668.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">满系数 ψ · 通风量 · 水分 · 钢球直径 ·</text>
<text x="589.6" y="686.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">存煤量</text>
<rect x="574.6" y="712.6" width="158.1" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="733.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">二、中速磨煤机 ★★</text>
<rect x="574.6" y="759.7" width="276.3" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="780.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">碗式(HP) · 轮式(MPS/ZGM) · 球环式</text>
<text x="589.6" y="798.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">(E型)</text>
<rect x="574.6" y="824.9" width="273.7" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="846.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">影响因素：转速 · 通风量 · 风环气流速</text>
<text x="589.6" y="864.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">度 · 研磨压力 · 燃料性质</text>
<rect x="574.6" y="890.1" width="269.7" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="911.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">三、磨煤机出力和功率（磨煤出力 B_m</text>
<text x="589.6" y="929.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">/ 干燥出力 B_g）</text>
<rect x="280.4" y="1056.2" width="145.4" height="40.8" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="295.4" y="1078.9" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第三节 制粉系统</text>
<rect x="574.6" y="955.3" width="186.3" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="976.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">一、中间储仓式</text>
<text x="589.6" y="994.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">（乏气送粉 / 热风送粉）</text>
<rect x="574.6" y="1020.4" width="268.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="1041.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">二、直吹式（正压：热一次风机 / 冷一</text>
<text x="589.6" y="1059.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">次风机）</text>
<rect x="574.6" y="1085.6" width="268.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="1106.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">三、煤粉分离器：粗粉分离器 · 细粉分</text>
<text x="589.6" y="1124.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">离器（旋风）</text>
<rect x="574.6" y="1150.8" width="200.1" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="589.6" y="1171.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">辅助设备：给煤机 · 给粉机</text>
<rect x="280.4" y="1197.9" width="240.3" height="61.5" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="295.4" y="1220.6" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第四节 磨煤机及制粉系统选型</text>
<text x="295.4" y="1241.4" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">（课件未覆盖）</text>
