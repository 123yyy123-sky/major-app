<text x="55.0" y="988.5" font-size="21" font-weight="700" fill="#ffffff" xml:space="preserve">第九章 炉内辐射传热计算</text>
<rect x="366.0" y="228.7" width="256.1" height="40.8" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="381.0" y="251.4" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第一节 炉内辐射传热的基本概念</text>
<rect x="747.3" y="68.0" width="279.0" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.3" y="89.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">物体的辐射：E_b=σ₀T⁴、E=εσ₀T⁴</text>
<text x="762.3" y="107.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">=εE_b，σ₀=5.67×10⁻¹¹ kW/</text>
<text x="762.3" y="125.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">(m²·K⁴)</text>
<rect x="747.3" y="151.3" width="275.8" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.3" y="172.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">介质的吸收率和黑度：贝尔定律 I_λ,</text>
<text x="762.3" y="190.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">s/I_λ,0=e^(-k_λ·S)，τ=k_λS，</text>
<text x="762.3" y="208.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">a=1-e^(-k_a·S)，ε=a</text>
<rect x="747.3" y="234.5" width="291.6" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.3" y="255.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">炉内火焰黑度：由三原子气体、灰分颗粒、</text>
<text x="762.3" y="273.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">焦炭颗粒三部分组成</text>
<rect x="747.3" y="299.7" width="261.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.3" y="320.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">入射辐射和有效辐射：G、J=εE_b+</text>
<text x="762.3" y="338.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">(1-ε)G</text>
<rect x="747.3" y="364.9" width="269.0" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.3" y="386.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">两平行平面之间的辐射传热：q_R=σ₀</text>
<text x="762.3" y="404.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">(T₁⁴-T₂⁴)/(1/ε₁+1/ε₂-1)</text>
<rect x="366.0" y="552.7" width="208.7" height="40.8" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="381.0" y="575.4" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第二节 炉内辐射传热特点</text>
<rect x="747.3" y="430.1" width="277.9" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.3" y="451.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">基本任务：设计计算</text>
<text x="762.3" y="469.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">（定出口烟温求受热面）与校核计算（定</text>
<text x="762.3" y="487.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">受热面核算出口烟温）</text>
<rect x="747.3" y="513.4" width="277.9" height="92.4" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.3" y="534.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">复杂性：放热/吸热比例不同、烟气成分</text>
<text x="762.3" y="552.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">与介质浓度不同、辐射能力不同、多物体</text>
<text x="762.3" y="570.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">参与、燃烧与传热同时进行、并存对流传</text>
<text x="762.3" y="588.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">热</text>
<rect x="747.3" y="614.7" width="277.9" height="128.5" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.3" y="635.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">简化与假设（8条）：火焰当灰体、燃烧</text>
<text x="762.3" y="653.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">与辐射分开、平均温度替代真实温度、出</text>
<text x="762.3" y="672.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">口烟温作定性温度、略去对流、炉墙影响</text>
<text x="762.3" y="690.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">计入角系数、包围绕炉墙假想为等面积圆</text>
<text x="762.3" y="708.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">柱面、与水冷壁相切的假想柱面为火焰辐</text>
<text x="762.3" y="726.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">射面</text>
<rect x="366.0" y="959.1" width="271.9" height="40.8" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="381.0" y="981.8" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第四节 煤粉锅炉炉内传热计算方法</text>
<rect x="747.3" y="752.3" width="274.3" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.3" y="773.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">炉内辐射交换热流密度修正：分母加</text>
<text x="762.3" y="791.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">(1/4)kR，k=(1.25~1.30)k_a，煤粉炉</text>
<text x="762.3" y="809.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">k≈1.28k_a</text>
<rect x="747.3" y="835.5" width="271.8" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.3" y="856.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">炉内辐射传热量：Q_R=q_R·</text>
<text x="762.3" y="874.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">F/B_cal，Q̇_R=σ₀F(T₁⁴-T₂⁴)</text>
<text x="762.3" y="892.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">/(1/ε_syn+1/ε₂-1)</text>
<rect x="747.3" y="918.8" width="281.2" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.3" y="939.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">火焰综合黑度 ε_syn 与综合系数</text>
<text x="762.3" y="958.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">C_syn：1/ε_syn=0.32k_a R+1/ε₁</text>
<rect x="747.3" y="984.0" width="274.7" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.3" y="1005.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">火焰平均温度 T₁：θ₁=T₁/T_th，伯</text>
<text x="762.3" y="1023.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">劳赫理论近似公式，x_m≈x_B=</text>
<text x="762.3" y="1041.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">h_B/h_f</text>
<rect x="747.3" y="1067.2" width="271.3" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.3" y="1088.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">理论燃烧温度 T_th：Q_f^ef、Q_a、</text>
<text x="762.3" y="1106.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">烟气平均热容 VC_av</text>
<rect x="747.3" y="1132.4" width="275.1" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.3" y="1153.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">吸收减弱系数与火焰黑度：k_a=k_g·</text>
<text x="762.3" y="1171.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">r+k_ash·μ_ash+k_cok·μ_cok，</text>
<text x="762.3" y="1189.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">ε₁=1-e^(-k_a·S)</text>
<rect x="366.0" y="1275.0" width="303.5" height="40.8" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="381.0" y="1297.7" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第五节 炉内辐射传热计算的有效系数法</text>
<rect x="747.3" y="1215.7" width="252.2" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.3" y="1236.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">热有效系数 ψ 与炉膛黑度 ε_f^syn</text>
<rect x="747.3" y="1262.8" width="195.2" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.3" y="1283.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">炉内传热计算公式与热平衡</text>
<text x="762.3" y="1301.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">（Bo、θ₁、θ_f″）</text>
<rect x="747.3" y="1328.0" width="290.0" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.3" y="1349.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">炉膛出口烟气温度[方法一]：θ_f″=[Bo/</text>
<text x="762.3" y="1367.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">(3(1−x_m)ε_f^syn+Bo)]^(1/3)</text>
<rect x="366.0" y="1393.1" width="319.3" height="61.5" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="381.0" y="1415.9" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第六节 炉膛水冷壁结构特征（有效容积边</text>
<text x="381.0" y="1436.6" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">界、F=ΣF_i、S=3.6V_f/F）</text>
<rect x="366.0" y="1463.7" width="327.2" height="61.5" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="381.0" y="1486.4" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第七节 水冷壁热有效系数（ψ_i=xψ、ψ_</text>
<text x="381.0" y="1507.2" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">c=βψ、ψ_av=Σψ_iF_i/F）</text>
<rect x="366.0" y="1534.2" width="313.2" height="61.5" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="381.0" y="1556.9" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第八节 炉内热负荷的分布规律（q_av、</text>
<text x="381.0" y="1577.7" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">q_i=η_i q_av、图9-8）</text>
<rect x="366.0" y="1690.8" width="291.5" height="61.5" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="381.0" y="1713.5" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第九节 苏联1973年炉膛传热计算框架</text>
<text x="381.0" y="1734.3" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">（方法二、方法三）</text>
