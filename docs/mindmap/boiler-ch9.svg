<rect x="40.0" y="952.2" width="272.0" height="48.1" rx="11" fill="#e8590c" stroke="none" filter="url(#sh)"/>
<text x="55.0" y="979.4" font-size="21" font-weight="700" fill="#ffffff" xml:space="preserve">第九章 炉内辐射传热计算</text>
<rect x="366.0" y="228.7" width="256.1" height="40.8" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="381.0" y="251.4" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第一节 炉内辐射传热的基本概念</text>
<rect x="747.1" y="68.0" width="279.0" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.1" y="89.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">物体的辐射：Eb=σ₀T⁴、E=εσ₀T⁴=</text>
<text x="762.1" y="107.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">εEb，σ₀=5.67×10⁻¹¹ kW/</text>
<text x="762.1" y="125.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">(m²·K⁴)</text>
<rect x="747.1" y="151.3" width="286.0" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.1" y="172.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">介质的吸收率和黑度：贝尔定律 Iλ,s/I</text>
<text x="762.1" y="190.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">λ,0=e⁻ᵏλ·S，τ=kλS，a=1-e⁻ᵏₐ·</text>
<text x="762.1" y="208.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">S，ε=a</text>
<rect x="747.1" y="234.5" width="291.6" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.1" y="255.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">炉内火焰黑度：由三原子气体、灰分颗粒、</text>
<text x="762.1" y="273.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">焦炭颗粒三部分组成</text>
<rect x="747.1" y="299.7" width="251.6" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.1" y="320.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">入射辐射和有效辐射：G、J=εEb+</text>
<text x="762.1" y="338.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">(1-ε)G</text>
<rect x="747.1" y="364.9" width="258.7" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.1" y="386.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">两平行平面之间的辐射传热：qR=σ₀</text>
<text x="762.1" y="404.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">(T₁⁴-T₂⁴)/(1/ε₁+1/ε₂-1)</text>
<rect x="366.0" y="552.7" width="208.7" height="40.8" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="381.0" y="575.4" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第二节 炉内辐射传热特点</text>
<rect x="747.1" y="430.1" width="277.9" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.1" y="451.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">基本任务：设计计算</text>
<text x="762.1" y="469.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">（定出口烟温求受热面）与校核计算（定</text>
<text x="762.1" y="487.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">受热面核算出口烟温）</text>
<rect x="747.1" y="513.4" width="277.9" height="92.4" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.1" y="534.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">复杂性：放热/吸热比例不同、烟气成分</text>
<text x="762.1" y="552.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">与介质浓度不同、辐射能力不同、多物体</text>
<text x="762.1" y="570.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">参与、燃烧与传热同时进行、并存对流传</text>
<text x="762.1" y="588.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">热</text>
<rect x="747.1" y="614.7" width="277.9" height="128.5" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.1" y="635.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">简化与假设（8条）：火焰当灰体、燃烧</text>
<text x="762.1" y="653.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">与辐射分开、平均温度替代真实温度、出</text>
<text x="762.1" y="672.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">口烟温作定性温度、略去对流、炉墙影响</text>
<text x="762.1" y="690.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">计入角系数、包围绕炉墙假想为等面积圆</text>
<text x="762.1" y="708.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">柱面、与水冷壁相切的假想柱面为火焰辐</text>
<text x="762.1" y="726.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">射面</text>
<rect x="366.0" y="950.0" width="271.9" height="40.8" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="381.0" y="972.8" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第四节 煤粉锅炉炉内传热计算方法</text>
<rect x="747.1" y="752.3" width="278.4" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.1" y="773.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">炉内辐射交换热流密度修正：分母加</text>
<text x="762.1" y="791.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">(1/4)kR，k=(1.25~1.30)kₐ，煤粉炉 k</text>
<text x="762.1" y="809.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">≈1.28kₐ</text>
<rect x="747.1" y="835.5" width="273.6" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.1" y="856.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">炉内辐射传热量：QR=qR·F/Bcₐₗ，</text>
<text x="762.1" y="874.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">Q̇R=σ₀F(T₁⁴-T₂⁴)/</text>
<text x="762.1" y="892.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">(1/εₛyₙ+1/ε₂-1)</text>
<rect x="747.1" y="918.8" width="286.5" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.1" y="939.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">火焰综合黑度 εₛyₙ 与综合系数 Cₛyₙ：</text>
<text x="762.1" y="958.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">1/εₛyₙ=0.32kₐ R+1/ε₁</text>
<rect x="747.1" y="984.0" width="271.3" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.1" y="1005.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">火焰平均温度 T₁：θ₁=T₁/Tₜₕ，伯</text>
<text x="762.1" y="1023.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">劳赫理论近似公式，xₘ≈xB=hB/hf</text>
<rect x="747.1" y="1049.2" width="273.0" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.1" y="1070.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">理论燃烧温度 Tₜₕ：Qfᵉᶠ、Qₐ、烟气</text>
<text x="762.1" y="1088.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">平均热容 VCₐᵥ</text>
<rect x="747.1" y="1114.3" width="281.0" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.1" y="1135.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">吸收减弱系数与火焰黑度：kₐ=kg·ᵣ+k</text>
<text x="762.1" y="1153.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">ₐₛₕ·μₐₛₕ+kcₒₖ·μcₒₖ，ε₁=1-e</text>
<text x="762.1" y="1171.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">⁻ᵏₐ·S</text>
<rect x="366.0" y="1256.9" width="303.5" height="40.8" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="381.0" y="1279.6" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第五节 炉内辐射传热计算的有效系数法</text>
<rect x="747.1" y="1197.6" width="237.0" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.1" y="1218.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">热有效系数 ψ 与炉膛黑度 εfˢʸⁿ</text>
<rect x="747.1" y="1244.7" width="195.2" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.1" y="1265.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">炉内传热计算公式与热平衡</text>
<text x="762.1" y="1283.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">（Bo、θ₁、θf″）</text>
<rect x="747.1" y="1309.9" width="279.7" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="762.1" y="1330.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">炉膛出口烟气温度[方法一]：θf″=[Bo/</text>
<text x="762.1" y="1349.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">(3(1−xₘ)εfˢʸⁿ+Bo)]¹/³</text>
<rect x="366.0" y="1375.1" width="319.3" height="61.5" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="381.0" y="1397.8" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第六节 炉膛水冷壁结构特征（有效容积边</text>
<text x="381.0" y="1418.5" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">界、F=ΣFᵢ、S=3.6Vf/F）</text>
<rect x="366.0" y="1445.6" width="319.2" height="61.5" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="381.0" y="1468.3" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第七节 水冷壁热有效系数（ψᵢ=xψ、ψc</text>
<text x="381.0" y="1489.1" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">=βψ、ψₐᵥ=ΣψᵢFᵢ/F）</text>
<rect x="366.0" y="1516.1" width="327.1" height="61.5" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="381.0" y="1538.8" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第八节 炉内热负荷的分布规律（qₐᵥ、qᵢ</text>
<text x="381.0" y="1559.6" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">=ηᵢ qₐᵥ、图9-8）</text>
<rect x="366.0" y="1672.7" width="291.5" height="61.5" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="381.0" y="1695.4" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第九节 苏联1973年炉膛传热计算框架</text>
<text x="381.0" y="1716.2" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">（方法二、方法三）</text>
