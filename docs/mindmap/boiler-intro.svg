<rect x="40.0" y="745.5" width="72.8" height="48.1" rx="11" fill="#e8590c" stroke="none" filter="url(#sh)"/>
<text x="55.0" y="772.7" font-size="21" font-weight="700" fill="#ffffff" xml:space="preserve">绪论</text>
<rect x="166.8" y="169.9" width="116.0" height="40.8" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="181.8" y="192.6" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">1.1 基本定义</text>
<rect x="388.1" y="68.0" width="256.1" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="89.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">锅炉（boiler, steam generator）</text>
<rect x="388.1" y="115.1" width="280.6" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="136.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">＝燃料燃烧 → 化学能变热能 → 传给工质</text>
<text x="403.1" y="154.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">（主要是水）</text>
<rect x="388.1" y="180.3" width="254.5" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="201.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">→ 具有一定温度和压力的蒸汽或热水</text>
<rect x="388.1" y="227.4" width="234.5" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="248.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">炉：煤·空气·烟 → 炉膛·燃烧器</text>
<rect x="388.1" y="274.4" width="172.5" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="295.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">锅：水·汽 → 汽水系统</text>
<rect x="166.8" y="489.8" width="119.8" height="40.8" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="181.8" y="512.5" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">1.2 工作过程</text>
<rect x="388.1" y="321.5" width="231.0" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="342.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">燃：燃料燃烧（化学能 → 热能）</text>
<rect x="388.1" y="368.6" width="272.4" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="389.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">传：传热（辐射、对流；烟气热能 → 工</text>
<text x="403.1" y="407.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">质热能）</text>
<rect x="388.1" y="433.8" width="236.6" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="454.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">变：工质升温（热力学参数变化）</text>
<rect x="388.1" y="538.5" width="85.1" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="559.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">三条流程</text>
<rect x="733.7" y="480.9" width="186.2" height="36.8" rx="7" fill="#ffffff" stroke="#eef2f6" stroke-width="1.6"/>
<text x="748.7" y="501.1" font-size="12.5" font-weight="500" fill="#5a6878" xml:space="preserve">煤：输煤·制粉·除灰·除渣</text>
<rect x="733.7" y="526.6" width="256.3" height="53.5" rx="7" fill="#ffffff" stroke="#eef2f6" stroke-width="1.6"/>
<text x="748.7" y="546.9" font-size="12.5" font-weight="500" fill="#5a6878" xml:space="preserve">空气-烟气：送风机→炉膛→烟气→除尘</text>
<text x="748.7" y="563.6" font-size="12.5" font-weight="500" fill="#5a6878" xml:space="preserve">→引风机→FGD/SCR→烟囱</text>
<rect x="733.7" y="589.1" width="259.5" height="53.5" rx="7" fill="#ffffff" stroke="#eef2f6" stroke-width="1.6"/>
<text x="748.7" y="609.4" font-size="12.5" font-weight="500" fill="#5a6878" xml:space="preserve">水蒸汽：省煤器→水冷壁→汽包→过热器</text>
<text x="748.7" y="626.1" font-size="12.5" font-weight="500" fill="#5a6878" xml:space="preserve">→汽机</text>
<rect x="388.1" y="651.6" width="277.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="672.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">正常燃烧三条件：高温环境／必需空气量</text>
<text x="403.1" y="690.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">及良好混合／燃料供应与排放</text>
<rect x="166.8" y="878.4" width="167.2" height="40.8" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="181.8" y="901.2" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">1.3 系统及组成部件</text>
<rect x="388.1" y="716.8" width="277.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="737.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">制粉系统：破煤→原煤仓→给煤机→磨煤</text>
<text x="403.1" y="756.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">机→煤粉分离→送入炉内</text>
<rect x="388.1" y="782.0" width="291.6" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="803.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">燃烧系统：送风机→空预器→两路热风（一</text>
<text x="403.1" y="821.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">次风送粉／二次风助燃）</text>
<rect x="388.1" y="847.2" width="277.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="868.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">汽水系统：给水→水处理→除氧→给水泵</text>
<text x="403.1" y="886.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">→省煤器→水冷壁→过热器</text>
<rect x="388.1" y="912.4" width="253.1" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="933.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">除渣 5–10%／除灰 90–95%／吹灰</text>
<rect x="388.1" y="959.5" width="276.8" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="980.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">烟气排放：FGD 脱硫 SO₂ · SCR 脱硝</text>
<text x="403.1" y="998.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">NOx</text>
<rect x="388.1" y="1024.6" width="277.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="1045.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">本体（炉膛·燃烧器·空预器·水冷壁·省</text>
<text x="403.1" y="1063.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">煤器·炉墙·构架）／辅机</text>
<rect x="166.8" y="1328.4" width="156.2" height="40.8" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="181.8" y="1351.1" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">1.4 锅炉的分类 ★</text>
<rect x="388.1" y="1089.8" width="277.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="1110.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">按容量和参数：容量＝蒸发量；设计容量</text>
<text x="403.1" y="1129.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">＝BMCR；额定＝ECR(BRL)·THA</text>
<rect x="388.1" y="1155.0" width="274.6" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="1176.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">按蒸汽压力：常压/微压·低·中·高·超</text>
<text x="403.1" y="1194.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">高压·亚临界·超临界(&gt;22.1)·超超临界</text>
<text x="403.1" y="1212.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">(&gt;26) MPa</text>
<rect x="388.1" y="1238.3" width="226.2" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="1259.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">按用途：电站·工业·热水·船用</text>
<rect x="388.1" y="1285.4" width="267.5" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="1306.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">按燃烧方式：层燃·室燃·旋风·流化床</text>
<rect x="388.1" y="1381.7" width="158.1" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="1402.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">按水的循环方式 ★★</text>
<rect x="733.7" y="1332.5" width="241.8" height="36.8" rx="7" fill="#ffffff" stroke="#eef2f6" stroke-width="1.6"/>
<text x="748.7" y="1352.7" font-size="12.5" font-weight="500" fill="#5a6878" xml:space="preserve">自然循环：靠汽-水密度差，K=4~10</text>
<rect x="733.7" y="1378.2" width="252.9" height="36.8" rx="7" fill="#ffffff" stroke="#eef2f6" stroke-width="1.6"/>
<text x="748.7" y="1398.5" font-size="12.5" font-weight="500" fill="#5a6878" xml:space="preserve">控制循环：主要靠炉水循环泵，K=2~5</text>
<rect x="733.7" y="1424.0" width="259.5" height="53.5" rx="7" fill="#ffffff" stroke="#eef2f6" stroke-width="1.6"/>
<text x="748.7" y="1444.2" font-size="12.5" font-weight="500" fill="#5a6878" xml:space="preserve">直流：只靠给水泵，一次通过、无汽包，</text>
<text x="748.7" y="1461.0" font-size="12.5" font-weight="500" fill="#5a6878" xml:space="preserve">K=1</text>
<rect x="388.1" y="1486.5" width="251.0" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="1507.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">按排渣形式：固态（煤粉炉）· 液态</text>
<text x="403.1" y="1525.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">（旋风炉）</text>
<rect x="388.1" y="1551.6" width="233.8" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="403.1" y="1572.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">大容量布置：Π型（我国）· 塔形</text>
<text x="403.1" y="1590.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">（欧洲）· T型（俄制）</text>
</g>
</svg>
