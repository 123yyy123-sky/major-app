<rect x="40.0" y="1027.9" width="250.6" height="48.1" rx="11" fill="#e8590c" stroke="none" filter="url(#sh)"/>
<text x="55.0" y="1055.1" font-size="21" font-weight="700" fill="#ffffff" xml:space="preserve">第六章 过热器和再热器</text>
<rect x="344.6" y="255.4" width="319.3" height="61.5" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="359.6" y="278.1" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第一节 过热器和再热器的作用和工作特点</text>
<text x="359.6" y="298.9" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">（p007–p010）</text>
<rect x="717.9" y="68.0" width="277.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="89.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">过热器作用：饱和蒸汽→具有一定温度的</text>
<text x="732.9" y="107.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">过热蒸汽（p007）</text>
<rect x="717.9" y="133.2" width="277.9" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="154.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">再热器作用：高压缸排汽加热到与过热蒸</text>
<text x="732.9" y="172.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">汽温度相等（或相近）后再送中压缸、低</text>
<text x="732.9" y="190.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">压缸做功（p007）</text>
<rect x="717.9" y="216.5" width="281.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="237.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">再热压力约为过热蒸汽压力的 20%；再热</text>
<text x="732.9" y="255.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">使热经济性提高约 4%～5%（p007）</text>
<rect x="717.9" y="281.6" width="280.2" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="302.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">汽温波动不应超过 +5～-10℃；要有可靠</text>
<text x="732.9" y="320.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">的调温手段；减少并联管间热偏差</text>
<text x="732.9" y="338.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">（p008）</text>
<rect x="717.9" y="364.9" width="277.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="386.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">热偏差：并列管组中每根管工质焓增不同</text>
<text x="732.9" y="404.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">（p009）</text>
<rect x="717.9" y="430.1" width="277.9" height="92.4" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="451.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">减少热偏差措施：受热面分段串联、段间</text>
<text x="732.9" y="469.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">多管连接、均匀管束结构尺寸/减小管束</text>
<text x="732.9" y="487.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">前烟气空间深度/增大联箱直径/短接与</text>
<text x="732.9" y="505.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">交叉连接屏式过热器管子（p009）</text>
<rect x="344.6" y="1068.3" width="287.7" height="61.5" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="359.6" y="1091.0" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第二节 过热器和再热器的形式和结构</text>
<text x="359.6" y="1111.8" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">（p011–p024）</text>
<rect x="717.9" y="531.4" width="277.9" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="552.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">过热器分类：传热方式、流动方向、受热</text>
<text x="732.9" y="570.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">面放置方式、管子排列方式、管圈数、结</text>
<text x="732.9" y="588.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">构（p011）</text>
<rect x="717.9" y="614.7" width="277.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="635.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">对流式：水平烟道与尾部竖井烟道，蛇形</text>
<text x="732.9" y="653.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">管排（p012）</text>
<rect x="717.9" y="679.9" width="202.1" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="701.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">逆流/顺流/混合流布置判据</text>
<text x="732.9" y="719.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">（p012、p013）</text>
<rect x="717.9" y="745.1" width="287.5" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="766.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">顺列 s1/d=2.0～3.5；错列 s1/d=3.0～</text>
<text x="732.9" y="784.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">3.5（p014）</text>
<rect x="717.9" y="810.3" width="264.1" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="831.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">管圈数分类：单圈管、双圈管、多圈管</text>
<text x="732.9" y="849.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">（p015）</text>
<rect x="717.9" y="875.4" width="279.7" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="896.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">受热面结构：水平烟道 S1/d=2～3.5、</text>
<text x="732.9" y="914.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">S2/d=2.5～4；靠近炉膛 S1/d≥4.5、</text>
<text x="732.9" y="932.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">S2/d≥3.5（p016）</text>
<rect x="717.9" y="958.7" width="268.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="979.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">压降限值：过热器 ≤10% 工作压力；再</text>
<text x="732.9" y="997.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">热器 ≤0.2MPa（p016）</text>
<rect x="717.9" y="1023.9" width="272.2" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="1045.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">烟气流速：靠近炉膛出口 10～12m/s 以</text>
<text x="732.9" y="1063.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">上；烟温低区 &lt;9m/s；不宜低于 6m/s</text>
<text x="732.9" y="1081.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">（p016）</text>
<rect x="717.9" y="1107.2" width="281.9" height="74.3" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="1128.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">对流过热器的支吊结构：横梁—过渡梁—</text>
<text x="732.9" y="1146.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">吊钩—管夹（图 7-1，p017）；卧式吊挂</text>
<text x="732.9" y="1164.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">结构（图 7-2，p019）</text>
<rect x="717.9" y="1190.4" width="181.5" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="1211.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">高温对流过热器结构示意</text>
<text x="732.9" y="1229.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">（图 6-3，p018）</text>
<rect x="717.9" y="1255.6" width="268.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="1276.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">再热器结构示意 1160t/h 拔伯葛自然循</text>
<text x="732.9" y="1294.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">环锅炉（图 7-6，p020）</text>
<rect x="717.9" y="1320.8" width="277.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="1341.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">辐射式（壁式、墙式）：墙式、顶棚、前</text>
<text x="732.9" y="1359.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">屏过热器（p021）</text>
<rect x="717.9" y="1386.0" width="277.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="1407.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">辐射式特点及应用场合：中参数仅顶棚；</text>
<text x="732.9" y="1425.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">亚临界以上加前屏或墙式（p022）</text>
<rect x="717.9" y="1451.1" width="209.0" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="1472.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">前屏过热器变横向节距示意图</text>
<text x="732.9" y="1490.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">（图 7-10，p023）</text>
<rect x="717.9" y="1516.3" width="260.6" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="1537.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">三、半辐射式（屏式过热器/再热器）</text>
<rect x="717.9" y="1563.4" width="126.4" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="1584.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">四、包覆过热器</text>
<rect x="717.9" y="1610.5" width="98.8" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="732.9" y="1631.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">五、再热器</text>
<rect x="344.6" y="1657.6" width="240.3" height="40.8" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="359.6" y="1680.3" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第三节 过热器和再热器的系统</text>
<rect x="344.6" y="1707.4" width="271.9" height="40.8" rx="9" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
<text x="359.6" y="1730.1" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">第四节 过热器和再热器的汽温特性</text>
