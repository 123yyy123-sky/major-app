<text x="55.0" y="794.6" font-size="21" font-weight="700" fill="#ffffff" xml:space="preserve">第十六章 集成运算放大器及应</text>
<text x="55.0" y="822.7" font-size="21" font-weight="700" fill="#ffffff" xml:space="preserve">用</text>
<rect x="408.9" y="286.7" width="204.9" height="40.8" rx="9" fill="#ffffff" stroke="#2f9e44" stroke-width="1.6"/>
<text x="423.9" y="309.4" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">16.1 集成运算放大器概述</text>
<rect x="782.2" y="68.0" width="280.9" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="89.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">普通 741 组件级图含电流镜与差分放大器</text>
<rect x="782.2" y="115.1" width="277.9" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="136.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">内部由输入级、中间级、输出级三级组成</text>
<rect x="782.2" y="162.2" width="280.1" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="183.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">LM741 引脚 2 反相输入、3 同相输入、6</text>
<text x="797.2" y="201.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">输出</text>
<rect x="782.2" y="227.4" width="264.1" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="248.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">运放符号有国家标准与国内外常用两种</text>
<rect x="782.2" y="274.5" width="279.0" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="295.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">输入级差分放大 Aᵥ₁、中间级 Aᵥ₂、输</text>
<text x="797.2" y="313.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">出级 Aᵥ₃=1</text>
<rect x="782.2" y="339.6" width="251.4" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="360.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">输出输入关系 vO = Aᵥₒ(vP - vN)</text>
<rect x="782.2" y="386.7" width="277.9" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="407.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">电压传输特性分线性区、正饱和与负饱和</text>
<rect x="782.2" y="433.8" width="281.2" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="454.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">开环增益 Aᵥₒ ≥ 10⁵、输入电阻 ≥ 10⁶</text>
<text x="797.2" y="473.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">Ω</text>
<rect x="782.2" y="499.0" width="269.2" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="520.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">参数理想化得理想运放特点 vN = vP、</text>
<text x="797.2" y="538.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">iN = iP = 0</text>
<rect x="408.9" y="735.8" width="303.5" height="40.8" rx="9" fill="#ffffff" stroke="#2f9e44" stroke-width="1.6"/>
<text x="423.9" y="758.5" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">16.2 运算放大器在信号运算方面的应用</text>
<rect x="782.2" y="564.2" width="257.6" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="585.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">分析依据为 vN = vP 与 iN = iP = 0</text>
<rect x="782.2" y="611.3" width="277.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="632.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">解法三步：标电压电流、列电路方程、解</text>
<text x="797.2" y="650.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">方程</text>
<rect x="782.2" y="676.4" width="277.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="697.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">电压跟随器、同相放大电路、反相放大电</text>
<text x="797.2" y="715.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">路</text>
<rect x="782.2" y="741.6" width="236.6" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="762.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">反相放大相加电路与放大相减电路</text>
<rect x="782.2" y="788.7" width="112.6" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="809.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">电流放大电路</text>
<rect x="782.2" y="835.8" width="271.0" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="856.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">积分电路、微分电路、比例-积分-微分</text>
<text x="797.2" y="875.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">电路</text>
<rect x="782.2" y="901.0" width="277.9" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="922.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">闭环负反馈电路工作在电压传输特性线性</text>
<text x="797.2" y="940.1" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">区</text>
<rect x="408.9" y="1105.2" width="271.9" height="40.8" rx="9" fill="#ffffff" stroke="#2f9e44" stroke-width="1.6"/>
<text x="423.9" y="1127.9" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">16.3 集成运算放大器在非线性应用</text>
<rect x="782.2" y="966.2" width="270.1" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="987.2" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">电压比较器比较的是 v_+ 与 v_- 两个</text>
<text x="797.2" y="1005.3" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">量</text>
<rect x="782.2" y="1031.3" width="282.0" height="56.2" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="1052.4" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">v_+ &gt; v_- 输出 VOH，v_+ &lt; v_- 输</text>
<text x="797.2" y="1070.5" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">出 VOL</text>
<rect x="782.2" y="1096.5" width="277.9" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="1117.6" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">单门限电压比较器与过零比较器均为开环</text>
<rect x="782.2" y="1143.6" width="222.8" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="1164.7" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">迟滞电压比较器采用闭环正反馈</text>
<rect x="782.2" y="1190.7" width="255.3" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="1211.8" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">上门限电压 VT₊ 与下门限电压 VT₋</text>
<rect x="782.2" y="1237.8" width="277.9" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="1258.9" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">方波发生器是无外接输入的多谐振荡电路</text>
<rect x="408.9" y="1283.5" width="319.3" height="40.8" rx="9" fill="#ffffff" stroke="#2f9e44" stroke-width="1.6"/>
<text x="423.9" y="1306.3" font-size="15.5" font-weight="700" fill="#1b2430" xml:space="preserve">16.4 集成运算放大器的选择、使用和保护</text>
<rect x="782.2" y="1284.9" width="222.8" height="38.1" rx="8" fill="#f7f9fc" stroke="#e3e9f0" stroke-width="1.6"/>
<text x="797.2" y="1306.0" font-size="13.5" font-weight="600" fill="#33414f" xml:space="preserve">课件仅列小节框架，正文未展开</text>
