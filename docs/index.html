  .subj{
    flex:0 0 auto;border:1px solid #e8ebef;background:#fff;color:#6b7280;
    padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .subj.on{color:#fff;border-color:transparent}

  .tabs::-webkit-scrollbar{display:none}

       background:none;border:0;position:relative;cursor:pointer;white-space:nowrap}
  .tab.on{font-weight:800}
  .tab.on::after{content:"";position:absolute;left:22%;right:22%;bottom:0;height:2.5px;border-radius:2px;background:currentColor}

  main{flex:1;padding:14px;padding-bottom:48px}
  .card{background:#fff;border:1px solid #e8ebef;border-radius:12px;padding:16px;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .between{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:#f1f3f5;color:#6b7280}

  .scard .body{flex:1;padding:16px;min-width:0}

  .scard .mt{font-size:12.5px;color:#6b7280;margin-top:4px}
  .scard .chips{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}

  .ccard{background:#fff;border:1px solid #e8ebef;border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer;width:100%;text-align:left}

  }

  .trow .dot.leaf{width:6px;height:6px;border:0;background:var(--accent);border-radius:3px;flex:0 0 6px;margin:8px 6px 0 6px}

  .kp .k{background:#fff7ed;color:#b45309;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}

  .qbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}

易二分：**炉** 管「煤·空气·烟 → 炉膛·燃烧器」；**锅** 管「水·汽 → 汽水系统」。"]},{"id":"p-param","title":"1.4 基本参数（选择题主战场）","key":true,"source":"课件 slide 6–7","items":["**额定蒸发量** D（Q）：锅炉在**额定参数（压力、温度）**下、**保证一定热效率**时，每小时的**最大连续**蒸发量。单位 t/h（kJ/h、MW）。","**受热面蒸发率** D/H：每 m² **蒸发受热面**每小时的产汽量，单位 **kg/(m²·h)**。","**受热面发热率** Q/H：每 m² 受热面每小时的产热量，单位 kJ/(m²·h)。","**锅炉热效率 η**：燃料（全部完全燃烧时）发热量中**有百分之几被用来产生蒸汽或加热水** ＝ 有效利用热 ÷ 输入热量。","**蒸汽参数**：锅炉出口蒸汽的额定压力（**表压**）和温度，单位 MPa、℃。"]},{"id":"p-flow","title":"1.2 工作过程","key":true,"source":"课件 slide 29–31","items":["燃料的燃烧过程 → 传热过程（辐射、对流）→ 工质的升温。","**正常燃烧三条件**：高温环境 · 必需的空气量及空气与燃料的良好混合 · 燃料的供应及灰渣和烟气的排放。","**传热链**：高温烟气 →[辐射]水冷壁 →[辐射+对流]过热器 →[对流]对流管束 → 尾部受热面（省煤器·空预器）→ 除尘 → 引风机 → 脱硫 → 烟囱。","**工质链**：水→省煤器→汽锅；水循环 汽锅→下降管→下集箱→水冷壁→汽锅（闭式）；汽水分离。"]},{"id":"p-class","title":"1.4 分类：六种依据 + 补充三类 ★","key":true,"source":"课件 slide 21–24","items":["**按用途**：电站 / 工业 / 热水 / **船用**（体积小、参数低、一般烧油）。","**按燃料**：燃煤 / 燃油 / 燃气。**按容量**：大 / 中 / 小（无固定分界）。","**按蒸汽压力**：常压·微压 · 低压<2.45 · 中压 2.94–4.92 · 高压 7.84–10.80 · 超高压 11.8–14.71 · 亚临界 15.7–19.6 · 超临界>22.1 · 超超临界>26 MPa。","**按燃烧方式**：层燃（火床炉，最典型链条炉）/ 室燃（煤粉炉，悬浮燃烧）/ 旋风（液态排渣，NOx 多，采用不多）/ 流化床（850℃、煤种适应性好、床内脱硫、低 NOx 但有 N₂O）。","**按蒸发受热面内工质流动方式**：自然循环 / 控制循环 / 直流。","**按排渣形式**：固态（煤粉炉常用）/ 液态（旋风炉常用）。","**大容量布置**：Π型（我国主流）/ 塔形（欧洲）/ T型（俄制）。"]},{"id":"p-rest","title":"其余（一句话）","key":false,"source":"课件 slide 8 / 28 / 32–38","items":["**重要性**：供热系统热源设备 · 工矿企业动力及供热设备 · **火电站三大主机之一** · 节能环保。","**基本结构**：锅炉本体＝汽锅（汽水系统）＋炉子（燃烧设备）＋安全附件（水位计·压力表·安全阀）；另有钢架平台。","**要求**：①数量 ②质量 ③经济性（现代锅炉 90~92%，超临界 93~94%）④安全（连续运行≥5000h、可用率 90~95%）⑤适应性 ⑥环保。","**发展概况**：1949 装机 1849MW、煤耗 727g/(kW·h) → 四阶段 → 2011 首超美国、2012 世界最大、2010 煤耗 335g/(kW·h)。","**课程体系**：运行过程 → 所需设备 → 影响因素。"]}],"questions":[{"id":"bq-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 slide 9（1 分）","keyPoints":["基本参数","额定蒸发量","受热面蒸发率","锅炉热效率","表压"],"stem":"关于锅炉的基本参数，下列说法正确的是（　）","options":[{"k":"A","t":"锅炉的额定蒸发量是指锅炉在任意压力、温度下每小时产生的蒸汽量"},{"k":"B","t":"受热面蒸发率的单位是 kg/(m²·h)，表示每平方米蒸发受热面每小时产生的蒸汽量"},{"k":"C","t":"锅炉热效率 η 是指送进锅炉的燃料化学能全部转化为蒸汽内能的百分比"},{"k":"D","t":"蒸汽参数中的压力是指锅炉出口处蒸汽的绝对压力"}],"answer":"B","why":["A ✗ 额定蒸发量须在**额定参数（压力、温度）**下，不是「任意压力、温度」。","B ✓ 与课件 slide 7 原文完全一致。","C ✗ 热效率比的是**有效利用热 ÷ 输入热量**，不是「化学能全部转化」。","D ✗ 课件 slide 6 原文写「额定压力（**表压**）」，不是绝对压力。"],"basis":"课件 slide 6–7","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]},{"id":"bq-2","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 slide 27（1 分）","keyPoints":["锅炉分类","工质流动方式","三种循环"],"stem":"下列哪一项属于按锅炉蒸发受热面内工质流动方式进行的分类？（　）","options":[{"k":"A","t":"层燃炉和室燃炉"},{"k":"B","t":"电站锅炉和工业锅炉"},{"k":"C","t":"自然循环锅炉和直流锅炉"},{"k":"D","t":"超临界锅炉和超超临界锅炉"}],"answer":"C","why":["A ✗ 层燃炉/室燃炉 → 按**燃烧方式**。","B ✗ 电站/工业锅炉 → 按**用途**。","C ✓ 按**蒸发受热面内工质的流动方式**。","D ✗ 超临界/超超临界 → 按**蒸汽压力**。"],"basis":"课件 slide 21、24","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]}],"images":{"6":{"w":"img/boiler-intro/p006.webp","j":"img/boiler-intro/p006.jpg"},"7":{"w":"img/boiler-intro/p007.webp","j":"img/boiler-intro/p007.jpg"},"8":{"w":"img/boiler-intro/p008.webp","j":"img/boiler-intro/p008.jpg"},"9":{"w":"img/boiler-intro/p009.webp","j":"img/boiler-intro/p009.jpg"},"21":{"w":"img/boiler-intro/p021.webp","j":"img/boiler-intro/p021.jpg"},"22":{"w":"img/boiler-intro/p022.webp","j":"img/boiler-intro/p022.jpg"},"23":{"w":"img/boiler-intro/p023.webp","j":"img/boiler-intro/p023.jpg"},"24":{"w":"img/boiler-intro/p024.webp","j":"img/boiler-intro/p024.jpg"},"27":{"w":"img/boiler-intro/p027.webp","j":"img/boiler-intro/p027.jpg"},"28":{"w":"img/boiler-intro/p028.webp","j":"img/boiler-intro/p028.jpg"},"29":{"w":"img/boiler-intro/p029.webp","j":"img/boiler-intro/p029.jpg"},"30":{"w":"img/boiler-intro/p030.webp","j":"img/boiler-intro/p030.jpg"},"31":{"w":"img/boiler-intro/p031.webp","j":"img/boiler-intro/p031.jpg"},"32":{"w":"img/boiler-intro/p032.webp","j":"img/boiler-intro/p032.jpg"},"33":{"w":"img/boiler-intro/p033.webp","j":"img/boiler-intro/p033.jpg"},"34":{"w":"img/boiler-intro/p034.webp","j":"img/boiler-intro/p034.jp >70%），发热量主要来源，**1 kg 碳完全燃烧约放 32700 kJ**。","**氢 H**：含量 3~6%，发热量很高，**1 kg 氢燃烧约放 120000 kJ**。","**氧 O、氮 N**：不可燃成分；年代浅的煤含氧可达 40%，氮一般 0.5%~2.0%。","**硫 S**：**有害成分**，约占可燃成分 8%，三种形态（有机硫、黄铁矿硫、硫酸盐硫），前两种可燃，燃烧热 9040 kJ/kg。","**水分 M**：102~110 ℃ 干燥到恒重失去的重量；含量约 2~60%。","**灰分 A**：(815±25) ℃ 灼烧 2 小时后的剩余物；含量 10%~50%。","⚠️ **它们对锅炉工作的影响（p005，单选原题就在这）**：","　· **硫分**：SO₂ → 硫酸蒸汽腐蚀受热面；缺氧生成 H₂S 腐蚀高温区水冷壁；污染大气；硫化铁加剧磨煤机磨损。","　· **灰分**：妨碍可燃质与空气接触、燃烧困难、热损失增加；炉膛结渣、受热面积灰磨损；污染环境。","　· **水分**：**降低燃烧温度、不利燃烧**；降低锅炉效率；引风机耗能增加；**为低温受热面腐蚀提供环境**；造成堵煤、磨煤机出力下降。","　· **挥发分**：失去水分的煤样隔绝空气加热至 (900±10) ℃ 析出的气体产物；**含量高 → 煤易着火、燃尽、燃烧稳定**；也是**煤分类**的重要依据。"]},{"id":"p-ch1-basis","title":"成分基准及其换算 ★★（选择题考点）","key":true,"source":"课件 p007；单选题 p008","items":["煤中水分、灰分会随外界条件变化，其他成分百分含量随之改变 → **说明成分必须注明基准**。","**收到基（应用基）ar**：以**进入锅炉房的原煤**为基准 —— C+H+O+N+S+A+M = 100%。","**空气干燥基 ad**：经**自然干燥、除去外部水分** —— C+H+O+N+S+A+M = 100%。","**干燥基 d**：**除去全部水分** —— C+H+O+N+S+A = 100%；**常用来表示灰分**。","**干燥无灰基 daf**：**除去全部水分和灰分** —— C+H+O+N+S = 100%；常表示煤中有机物的元素成分和**挥发分**。","🔑 **换算口诀**：分母里**去掉谁**，就是哪个基准。收到基啥都不去；空气干燥基去外部水；干燥基去全水；干燥无灰基再额外去灰。","热力计算一律用**收到基**；灰分含量常用**干燥基**；挥发分/元素成分常用**干燥无灰基**。"]},{"id":"p-ch1-cv","title":"发热量：高位 vs 低位 ★★","key":true,"source":"课件 p009","items":["**发热量 Q**：单位质量固体/液体燃料完全燃烧放出的热量（kJ/kg）；气体燃料按单位容积（kJ/m³）。","**高位发热量 Q_gr**：完全燃烧放出的热量，**含**生成水蒸汽的汽化潜热。","**低位发热量 Q_net**：完全燃烧放出的热量，**扣除**随烟气带走的水蒸汽汽化潜热 —— **锅炉一律用 Q_net,ar**。","两者关系：`Q_net,ar = Q_gr,ar − r(9H_ar/100 + M_ar/100)`，其中 r 为水的汽化潜热。","**经验估算公式**（课件蓝色标注）：`Q_gr,ar = 339C_ar + 1256H_ar + 109S_ar − 109O_ar`。"]},{"id":"p-ch1-red","title":"燃料的折算成分与标准煤","key":false,"source":"课件 p010","items":["把各成分**折算到统一发热量 4187 kJ/kg** 下表示含量，下标 **red**：","`M_ar,red = 4187·M_ar / Q_net,ar`；`S_ar,red`、`A_ar,red` 同理。","判据：折算水分 **>8%** → 高水分；折算硫分 **>0.2%** → 高硫分；折算灰分 **>4%** → 高灰分。","**标准煤**：规定 `Q_net,ar = 29310 kJ/kg`（即 7000 kcal/kg）的煤。"]},{"id":"p-ch1-ash","title":"灰的性质：DT / ST / FT ★","key":true,"source":"课件 p011","items":["灰锥加热的三个特征温度：**DT 变形温度**（锥顶变圆或开始倾斜）→ **ST 软化温度**（锥顶弯至锥底或萎缩成球形）→ **FT 流化温度**（呈流体状态能沿平面流动）。","**固态排渣炉要求灰的软化温度 ST > 1350 ℃**（不易结渣）；**炉膛出口温度至少低于 ST 50~100 ℃**。","**烧结性**：影响对流受热面（尤其过热器）的积灰特性，**与熔融性无直接关系**。","影响因素：煤灰成分（碱性物质越多烧结性越强）、SO₂ 含量、温度、烧结时间。"]},{"id":"p-ch1-coal","title":"煤的分类与四种动力煤 ★（选择题考点）","key":true,"source":"课件 p012–p016；单选题 p017","items":["按**煤化程度**分三大类：**褐煤 → 烟煤 → 无烟煤**；分类指标含干燥无灰基挥发分、黏结指数等（GB 5751-86）。","**无烟煤**（白煤）：煤化程度最高，挥发分低，**着火和燃尽都比较困难**，发热量高（可达 21000~25000 kJ/kg 量级）。","**贫煤**：变质程度最高的烟煤，性质在无烟煤与烟煤之间，**挥发分 10%~20%**。","**烟煤**：煤化程度高于褐煤、低于无烟煤，**挥发分 20%~40%**，发热量较高，**燃烧时火焰高而有烟**。","**褐煤**：富含挥发分（**>37%**）易燃烧并冒烟，水分大、**空气中易风化碎裂**、燃点低（约 270 ℃）、**储存超两个月易自燃**，堆放不应超过两米。","🔑 记忆锚点：**挥发分**高低顺序 褐煤 > 烟煤 > 贫煤 > 无烟煤；**着火难易**则相反。"]},{"id":"p-ch1-liq","title":"液体燃料与气体燃料","key":false,"source":"课件 p018–p019","items":["锅炉液体燃料主要是**重油和渣油**（原油炼制后的残油）。特性指标：**粘度、凝固点、闪点、含硫量、灰分**。","**粘度**：温度↑粘度↓，压力↑粘度↑；重油粘度过大，**输送前必须加热**。","**闪点**：燃油挥发气体与空气混合达到一定浓度、可被火星点燃时的油温。","**灰分**：量少但常含**钒和钠**，燃烧生成熔点低的**钒酸钠** → 受热面**高温腐蚀**。","**气体燃料**：含低分子碳氢化合物、氢、一氧化碳等可燃气体；天然的有沼气、天然气；加工的有焦炉气、水煤气、发生炉煤气、石油气、高炉气。","优点：可管道远距离输送、不含灰分、着火温度低易控制、可调氧化/还原气氛、可预热、可利用低级固体燃料。"]},{"id":"p-ch1-air","title":"燃烧计算：空气量与过量空气系数 ★★","key":true,"source":"课件 p020–p023；例题 p023","items":["**燃烧化学式**：C+O₂=CO₂；2C+O₂=2CO（不完全燃烧）；2H₂+O₂=2H₂O；S+O₂=SO₂。","**理论氧气量**（1 kg 燃料完全燃烧）：`V⁰_O₂ = 1.866(C_ar/100) + 5.56(H_ar/100) + 0.7(S_ar/100) − 0.7(O_ar/100)` m³/kg","**理论空气量**：`V⁰ = V⁰_O₂/0.21 = 0.0889(C_ar + 0.375S_ar) + 0.265H_ar − 0.0333O_ar` m³/kg","　　（烟气分析时**硫和碳的燃烧产物一起测定**；所算空气量是**不含水蒸气的理论干空气量**。）","**过量空气系数 α**：实际空气量与理论空气量之比。","**推荐值**（固态排渣煤粉炉）：无烟煤/贫煤/劣质烟煤 **α″_f = 1.20~1.25**；烟煤/褐煤 **α″_f = 1.15~1.20**。","**漏风系数**：漏入的空气量与理论空气量之比 —— 使换热变差、排烟热损失和引风机能耗增加、**降低锅炉经济性**。","**实际空气量**：`V = αV⁰`。"]},{"id":"p-ch1-gas","title":"燃烧计算：烟气量与焓 ★★","key":true,"source":"课件 p024–p026","items":["**理论烟气（1 kg 燃料）**：","　`V_CO₂ = 1.866(C_ar/100)`；`V_SO₂ = 0.7(S_ar/100)` m³/kg","　`V⁰_N₂ = 0.79V⁰ + 0.8(N_ar/100)` m³/kg","　`V⁰_H₂O = 11.1(H_ar/100) + 1.24(M_ar/100) + 0.0161V⁰` m³/kg","　`V⁰_g = V_RO₂ + V⁰_N₂ + V⁰_H₂O` m³/kg","**实际烟气容积**：`V_g = V⁰_g + (α−1)V⁰ + 0.0161(α−1)V⁰` m³/kg","　不完全燃烧时：`V_g = V_CO + V_CO₂ + V_SO₂ + V_O₂ + V_N₂ + V_H₂O`","**烟气质量**：`G_g = 1 − (A_ar/100) + 1.306αV⁰` kg/kg","**焓计算**：`I⁰_a = V⁰(cθ)_a`；`I_a = βV⁰(cθ)_a = βI⁰_a`；`I_g = I⁰_g + (α−1)I⁰_a + I_fa`；`I_fa = (α_fa·A_ar/100)(cθ)_ash`"]}],"questions":[{"id":"bq-ch1-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p006（1 分）","keyPoints":["煤中成分的影响","硫分","灰分","水分","挥发分"],"stem":"关于煤中成分对锅炉工作的影响，下列说法正确的是","options":[{"k":"A","t":"煤中硫分含量越高越好，因为硫燃烧能释放较多热量，有助于提高锅炉效率"},{"k":"B","t":"灰分含量高有利于燃烧，因为灰分可以形成炉渣保护受热面，减少磨损"},{"k":"C","t":"水分含量高会降低燃烧温度，不利于燃烧，并可能增加低温受热面腐蚀风险"},{"k":"D","t":"挥发分含量越低，煤越容易着火和燃尽，燃烧越稳定"}],"answer":"C","why":["A ✗ 硫是**有害成分**：SO₂ 腐蚀受热面、H₂S 腐蚀水冷壁、硫化铁加剧磨煤机磨损 —— 绝非「越高越好」。","B ✗ 灰分**妨碍燃烧**、造成结渣积灰与磨损 —— 没有「保护受热面」的作用。","C ✓ 与课件 p005 原文一致：「水分：降低燃烧温度，不利于燃烧……低温受热面腐蚀提供环境」。","D ✗ 课件 p005 原文：「挥发分含量**高**，煤易于着火、燃尽、燃烧稳定」—— 说反了。"],"basis":"课件 p004–p005（原文）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]},{"id":"bq-ch1-2","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p008（1 分）","keyPoints":["成分基准","收到基","空气干燥基","干燥基","干燥无灰基"],"stem":"关于煤的成分基准，以下表述正确的是","options":[{"k":"A","t":"收到基（ar）是指除去全部水分后的煤作为基准"},{"k":"B","t":"空气干燥基（ad）是在隔绝空气条件下干燥后得到的基准"},{"k":"C","t":"干燥无灰基（daf）常用于表示煤中有机物的元素成分和挥发分含量"},{"k":"D","t":"干燥基（d）是除去全部水分和灰分后的基准"}],"answer":"C","why":["A ✗ 收到基是**以进入锅炉房的原煤为基准**，不除水分。","B ✗ 空气干燥基是**经自然干燥、除去外部水分**，不是「隔绝空气」。","C ✓ 与课件 p007 原文一致。","D ✗ 干燥基只**除去全部水分**；「除去水分和灰分」的是**干燥无灰基 daf**。"],"basis":"课件 p007（原文）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]},{"id":"bq-ch1-3","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p017（1 分）","keyPoints":["煤的分类","挥发分","无烟煤","烟煤","褐煤","贫煤"],"stem":"根据煤化程度和挥发分含量，我国将煤分为三大类。以下关于煤的分类及其特征描述，正确的是","options":[{"k":"A","t":"无烟煤挥发分高，着火容易，燃烧时火焰长且有烟"},{"k":"B","t":"褐煤挥发分高，易于燃烧，但水分大，易风化自燃"},{"k":"C","t":"烟煤挥发分低于10%，含碳量高，燃烧时无烟"},{"k":"D","t":"贫煤挥发分高于40%，属于典型的烟煤，适合炼焦"}],"answer":"B","why":["A ✗ 无烟煤煤化程度**最高、挥发分低**，着火和燃尽**都比较困难**。","B ✓ 与课件 p015 原文一致：褐煤挥发成分高（>37%）、水分大、空气中易风化碎裂、易自燃。","C ✗ 烟煤挥发分是 **20%~40%**（不是低于 10%），且「燃烧时火焰高而**有烟**」。","D ✗ 贫煤挥发分是 **10%~20%**（不是高于 40%），它是变质程度最高的**烟煤**，但并非「高于40%」。"],"basis":"课件 p013–p015（原文）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]},{"id":"bq-ch1-ex1","kind":"例题","priority":1,"source":"课件例题","sourceDetail":"课件 p023（有完整解答）","keyPoints":["理论空气量","实际空气量","过量空气系数"],"stem":"已知某电厂燃用烟煤，其收到基元素分析数据为：碳 C_ar=58.0%，氢 H_ar=4.0%，氧 O_ar=6.0%，硫 S_ar=0.8%，灰分 A_ar=20.0%，水分 M_ar=11.2%，锅炉为固态排渣煤粉炉，燃用烟煤时炉膛出口过量空气系数取 α=1.18。试求 1 kg 该煤完全燃烧所需的理论空气量 V⁰ 以及在实际过量空气系数 α=1.18 下所需的实际空气量 V（标准状态，m³/kg）。","given":["收到基碳 C_ar = 58.0%","收到基氢 H_ar = 4.0%","收到基氧 O_ar = 6.0%","收到基硫 S_ar = 0.8%","收到基灰分 A_ar = 20.0%","收到基水分 M_ar = 11.2%","锅炉型式：固态排渣煤粉炉；炉膛出口过量空气系数 α = 1.18"],"ask":["1 kg 该煤完全燃烧所需的理论空气量 V⁰（标准状态，m³/kg）","实际过量空气系数 α = 1.18 下所需的实际空气量 V（标准状态，m³/kg）"],"steps":["写出理论空气量计算公式：`V⁰ = 0.0889(C_ar + 0.375S_ar) + 0.265H_ar − 0.0333O_ar`","代入数据：`V⁰ = 0.0889×(58.0 + 0.375×0.8) + 0.265×4.0 − 0.0333×6.0`","　　`= 5.1829 + 1.06 − 0.1998 = 6.0431` m³/kg","取两位小数：**V⁰ ≈ 6.04 m³/kg**","实际空气量按 `V = αV⁰` 计算","`V = 1.18 × 6.0431 = 7.1309` m³/kg"],"result":"V⁰ ≈ **6.04 m³/kg**；V = **7.1309 m³/kg**（标准状态）","why":["🔑 先算 **理论空气量**（用收到基元素成分），再乘 **过量空气系数** 得实际空气量。","⚠️ 代入时注意系数：碳项 0.0889、硫项要乘 0.375 后并入碳项、氢项 0.265、氧项 **减** 0.0333。","⚠️ 元素成分给的是**百分数**，公式中直接代数值（如 C_ar 代 58.0），不要再多除一次 100。"],"basis":"课件 p021（公式）+ p023（例题解答）"},{"id":"bq-ch1-hw1","kind":"计算","priority":1,"source":"课件作业","sourceDetail":"课件 p027 课后作业第 1 题","keyPoints":["成分基准换算","收到基"],"stem":"某种煤收到基含碳量为 41%。由于受外界条件的影响，其收到基水分由 15% 减少到 10%，收到基灰分由 25% 增加到 35%，试求其水分和灰分变化后的收到基含碳量（要求先推导换算公式，后计算）。","given":["原收到基含碳量 C_ar = 41%","水分 M_ar：15% → 10%","灰分 A_ar：25% → 35%"],"ask":["水分和灰分变化后的收到基含碳量"],"steps":["关键认识：水分、灰分变化时，**可燃质（碳等）的绝对量不变**，只是基准的分母变了。","取 100 kg 原煤：其中碳 = 41 kg，水分 = 15 kg，灰分 = 25 kg，其余（氢氧氮硫）= 100 − 41 − 15 − 25 = 19 kg。","水分析出后：水分减少 5 kg，煤的总质量变为 100 − 5 = **95 kg**（碳、灰分、其余成分绝对量不变）。","再考虑灰分增加：题目说灰分由 25% 增到 35%——这一条需按「**折算到同一基准**」的思路处理，通常理解为干燥基灰分变化，须用基准换算公式计算。","⚠️ 本题核心是**基准换算**：`X_ar = X_d × (100 − M_ar)/100` 一类公式，先把原煤换算到不受水分影响的基准，再换回新的收到基。","标准解法：`C_ar,新 = C_ar,原 × (100 − M_ar,新)/(100 − M_ar,原)` 处理**只变水分**的情形；若灰分也变，则换算到**干燥无灰基**或**干燥基**再折回。"],"result":"需先推导换算公式再代入（课件只给题干，未给答案）","why":["🔑 基准换算的本质：**绝对质量不变，分母（总量）变**。","⚠️ 只变水分 → 用「收到基 ↔ 干燥基」换算；水分和灰分同时变 → 先换到**干燥无灰基（daf）**，该基准下可燃质比例恒定，再折回新收到基。","⚠️ 这是课件留的**手写作业题**，没有标准答案。建议算完对照 [[燃料成分基准换算法]]。"],"basis":"课件 p027（作业）；方法见 [[燃料成分基准换算法]]","answerNote":"课件未给答案；本题为标准基准换算题型，最终数值请自行演算后与同学/老师核对"},{"id":"bq-ch1-hw2","kind":"计算","priority":1,"source":"课件作业","sourceDetail":"课件 p027 课后作业第 2 题","keyPoints":["空气干燥基","收到基","成分基准换算"],"stem":"已知煤的空气干燥基成分：C_ad = 50.5%，H_ad = 4.2%，S_ad = 0.8%，A_ad = 15.5%，M_ad = 21%，和风干水分 M_ar^f = 3.5%，计算上述各种成分的收到基含量。","given":["C_ad = 50.5%","H_ad = 4.2%","S_ad = 0.8%","A_ad = 15.5%","M_ad = 21%","风干水分 M_ar^f = 3.5%"],"ask":["上述各成分的**收到基**含量"],"steps":["空气干燥基 → 收到基的换算系数：`k = (100 − M_ar)/(100 − M_ad)`","其中 `M_ar = M_ad + M_ar^f`（空气干燥基水分 + 风干水分）","本题：`M_ar = 21 + 3.5 = 24.5%`","换算系数 `k = (100 − 24.5)/(100 − 21) = 75.5/79 = 0.9557`","逐项换算：`C_ar = 50.5 × 0.9557 ≈ 48.26%`","　`H_ar = 4.2 × 0.9557 ≈ 4.01%`；`S_ar = 0.8 × 0.9557 ≈ 0.76%`；`A_ar = 15.5 × 0.9557 ≈ 14.81%`","校验：C+H+O+N+S+A+M = 100%（氧由差减求得）"],"result":"M_ar = 24.5%；换算系数 k ≈ 0.956；C_ar ≈ 48.3%，H_ar ≈ 4.0%，S_ar ≈ 0.76%，A_ar ≈ 14.8%","why":["🔑 记住方向：**空气干燥基 → 收到基，水分变多，所以数值要变小**（系数 <1）。","⚠️ 关键点是 **M_ar = M_ad + M_ar^f**：空气干燥基本身含 21% 水分，风干水分 3.5% 要加上去。","⚠️ 换算后要**校验总和 = 100%**，这是查错的好办法。"],"basis":"课件 p027（作业）；方法见 [[燃料成分基准换算法]]","answerNote":"课件未给答案；换算系数与结果按标准基准换算公式推得，请核对"}],"images":{"2":{"w":"img/boiler-ch1/p002.webp","j":"img/boiler-ch1/p002.jpg"},"3":{"w":"img/boiler-ch1/p003.webp","j":"img/boiler-ch1/p003.jpg"},"4":{"w":"img/boiler-ch1/p004.webp","j":"img/boiler-ch1/p004.jpg"},"5":{"w":"img/boiler-ch1/p005.webp","j":"img/boiler-ch1/p005.jpg"},"6":{"w":"img/boiler-ch1/p006.webp","j":"img/boiler-ch1/p006.jpg"},"7":{"w":"img/boiler-ch1/p007.webp","j":"img/boiler-ch1/p007.jpg"},"8":{"w":"img/boiler-ch1/p008.webp","j":"img/boiler-ch1/p008.jpg"},"9":{"w":"img/boiler-ch1/p009.webp","j":"img/boiler-ch1/p009.jpg"},"10":{"w":"img/boiler-ch1/p010.webp","j":"img/boiler-ch1/p010.jpg"},"11":{"w":"img/boiler-ch1/p011.webp","j":"img/boiler-ch1/p011.jpg"},"12":{"w":"img/boiler-ch1/p012.webp","j":"img/boiler-ch1/p012.jpg"},"13":{"w":"img/boiler-ch1/p013.webp","j":"img/boiler-ch1/p013.jpg"},"14":{"w":"img/boiler-ch1/p014.webp","j":"img/boiler-ch1/p014.jpg"},"15":{"w":"img/boiler-ch1/p015.webp","j":"img/boiler-ch1/p015.jpg"},"16":{"w":"img/boiler-ch1/p016.webp","j":"img/boiler-ch1/p016.jpg"},"17":{"w":"img/boiler-ch1/p017.webp","j":"img/boiler-ch1/p017.jpg"},"18":{"w":"img/boiler-ch1/p018.webp","j":"img/boiler-ch1/p018.jpg"},"19":{"w":"img/boiler-ch1/p019.webp","j":"img/boiler-ch1/p019.jpg"},"20":{"w":"img/boiler-ch1/p020.webp","j":"img/boiler-ch1/p020.jpg"},"21":{"w":"img/boiler-ch1/p021.webp","j":"img/boiler-ch1/p021.jpg"},"22":{"w":"img/boiler-ch1/p022.webp","j":"img/boiler-ch1/p022.jpg"},"23":{"w":"img/boiler-ch1/p023.webp","j":"img/boiler-ch1/p023.jpg"},"24":{"w":"img/boiler-ch1/p024.webp","j":"img/boiler-ch1/p024.jpg"},"25":{"w":"img/boiler-ch1/p025.webp","j":"img/boiler-ch1/p025.jpg"},"26":{"w":"img/boiler-ch1/p026.webp","j":"img/boiler-ch1/p026.jpg"},"27":{"w":"img/boiler-ch1/p027.webp","j":"img/boiler-ch1/p027.jpg"}}},{"id":"boiler-ch2","name":"第二章 煤粉制备","subtitle":"煤粉性质 · 细度 · 可磨性 · 磨煤机 · 制粉系统 · 分离器 · 选型","status":"在读","overview":"本章四节：煤粉的性质（一般特性/细度/可磨性/磨损性/水分）→ 磨煤机（筒式钢球磨、中速磨、出力和功率）→ 制粉系统（中间储仓式、直吹式、煤粉分离器）→ 磨煤机及制粉系统选型。课件覆盖前三节，第四节课件未讲。","mindmap":{"label":"第二章 煤粉制备","children":[{"label":"第一节 煤粉的性质","children":[{"label":"一、一般特性：流动性 · 自燃与爆炸性 · 堆积特性"},{"label":"　爆炸最危险浓度 1.2~2.0 kg/m³"},{"label":"二、煤粉细度及颗粒特性 ★"},{"label":"　R_x = a/(a+b)×100% · 破碎公式 R_x = 100e^(−bxⁿ)"},{"label":"　均匀性指数 n（0.8~1.2）· 经济细度 R₉₀^opt"},{"label":"三、煤的可磨性（HGI / K_gr）"},{"label":"四、煤的磨损特性（冲刷磨损指数 K_e）"}]},{"label":"第二节 磨煤机","children":[{"label":"按转速分类：低速 / 中速 / 高速"},{"label":"一、筒式钢球磨煤机 ★★"},{"label":"　单进单出 · 双进双出（带/不带热风空心管）"},{"label":"　影响因素：转速 n_cj · 护甲 · 钢球充满系数 ψ · 通风量 · 水分 · 钢球直径 · 存煤量"},{"label":"二、中速磨煤机 ★★"},{"label":"　碗式(HP) · 轮式(MPS/ZGM) · 球环式(E型)"},{"label":"　影响因素：转速 · 通风量 · 风环气流速度 · 研磨压力 · 燃料性质"},{"label":"三、磨煤机出力和功率（磨煤出力 B_m / 干燥出力 B_g）"}]},{"label":"第三节 制粉系统","children":[{"label":"一、中间储仓式（乏气送粉 / 热风送粉）"},{"label":"二、直吹式（正压：热一次风机 / 冷一次风机）"},{"label":"三、煤粉分离器：粗粉分离器 · 细粉分离器（旋风）"},{"label":"辅助设备：给煤机 · 给粉机"}]},{"label":"第四节 磨煤机及制粉系统选型（课件未覆盖）"}]},"points":[{"id":"p-ch2-prop","title":"煤粉的一般特性（选择题考点）","key":true,"source":"课件 p002–p005；单选题 p005","items":["**流动性**：刚磨制的煤粉干燥疏松，与空气混合物流动性好、便于管道输送；但设备不严密时容易泄漏污染环境。","**自燃与爆炸性**：煤粉沉积在管道中时间较长 → 积粉层内逐渐升温 → 达着火温度发生**自燃**；挥发分高的煤粉浓度达一定值时遇火源可能**爆炸**。","**堆积特性**：煤粉仓中自然压紧的堆积密度 **0.7 t/m³**；吸附水分后易结块。","⭐ **影响煤粉爆炸的因素**（课件 p003）：","　· **干燥无灰基挥发分**：含量**越高**越容易着火、爆炸；","　· **煤粉浓度**：**最危险浓度 1.2~2.0 kg/m³**；","　· **水分、颗粒细度、工质温度**：水分**越小**、颗粒**越细**，越容易着火爆炸。","**实践证明**（课件 p004）：","　· 挥发分 **<10%** 或粒径 **>100 μm** 时，煤粉**几乎不会爆炸**；","　· 温度低于 100 ℃、含氧浓度 **<15%~16%** 的煤粉气流基本不存在爆炸危险；","　· 水分太高流动性差、易搭桥；水分太低易自燃和爆炸。"]},{"id":"p-ch2-fineness","title":"煤粉细度与颗粒特性 ★★","key":true,"source":"课件 p006–p011","items":["**煤粉细度 R_x**：一定质量煤粉用一定尺寸筛孔筛分时，**筛子上剩余量占筛分总量的百分比**。`R_x = a/(a+b) × 100%`（a 筛上余量、b 过筛量）。**R_x 越大煤粉越粗**。","我国电厂常用 **30 号筛（R₂₀₀）和 70 号筛（R₉₀）** 表示煤粉细度。","**破碎公式（Rosin-Rammler）**：`R_x = 100·e^(−b·xⁿ)`","　· `b` 为煤粉细度系数，`b↑ → R₉₀↓ → 煤粉越细`；","　· `n` 为**煤粉均匀性指数**，`n = [lg ln(100/R₂₀₀) − lg ln(100/R₉₀)] / lg(200/90)`；","　· 不同粒径换算：`R_x2 = 100·(R_x1/100)^((x₂/x₁)ⁿ)`；`b = (1/90ⁿ)·lg(100/R₉₀)`。","⚠️ 分母口径：**按课件 p008 写作 `lg(100/90)`**。注意不同资料此处写法可能不同，考试以课件或题目给定值为准。","**n 的意义**：n 越大 → 过粗和过细的煤粉**都少** → 粒度分布**越均匀**。n 取决于磨煤机和粗粉分离器型式，一般取 **n = 0.8~1.2**。","**最佳（经济）煤粉细度**：使**不完全燃烧热损失 q₄** 与**制粉能耗 E_m** 之**和最小**时的煤粉细度。","　经验公式：`R₉₀^opt = a + 0.5·n·V_daf`（a 取决于煤种：**无烟煤 0、贫煤 2、烟煤 4**）。","**表2-1 常用筛子**：筛号 6/8/12/30/40/60/70/80 对应孔径 1000/750/500/200/150/100/90/75 μm，细度符号 R₁₀₀₀/R₇₅₀/R₅₀₀/R₂₀₀/R₁₅₀/R₁₀₀/R₉₀/R₇₅。"]},{"id":"p-ch2-grind","title":"煤的可磨性与磨损特性","key":true,"source":"课件 p012–p013","items":["**可磨性系数 K_gr（可磨性指数）**：煤磨成一定细度煤粉的**难易程度**。","**哈氏可磨性指数 HGI**（Hardgrove 法）：`HGI = 13 + 6.93·D₇₅`，D₇₅ 为通过 75 μm 筛的煤粉量。","**煤的磨损指数 K_e**：表征该煤种对磨煤机研磨部件**磨损的强烈程度**。按电力行业标准 **DL465-92**《煤的冲刷磨损指数试验方法》，用冲刷式磨损试验确定。","　按 K_e 大小分：**轻微 / 不强 / 较强 / 很强 / 极强**。"]},{"id":"p-ch2-moisture","title":"煤粉水分","key":false,"source":"课件未覆盖 · 教材补充（第二章第一节五）","items":["**水分过大的危害**：煤粉结块、着火推迟、排烟量增加、加剧低温腐蚀。","**煤粉磨制后的合理水分 M_pc**：","　· **无烟煤**：`M_pc ≤ M_ad`","　· **烟煤**：`0.5·M_ad ≤ M_pc ≤ M_ad`","　· **褐煤**：`M_ad ≤ M_pc ≤ M_ad + 8`"]},{"id":"p-ch2-mill-class","title":"磨煤机分类与工作原理","key":true,"source":"课件 p014","items":["**磨煤机的作用**：**制粉**和**干燥**。","**工作原理**：**撞击、压碎、研磨**。","⚠️ **口径冲突（转速分级，务必看）**：","　· **课件 p014**：低速 **15~25** r/min（筒式钢球磨）· 中速 **25~100**（碗式、轮式）· 高速 **425~1000**（风扇式）","　**考试以课件或题目给定值为准。**","国内电厂采用较多的是**筒式钢球磨煤机**和**中速磨煤机**。"]},{"id":"p-ch2-ball","title":"筒式钢球磨煤机 ★★","key":true,"source":"课件 p015–p034；单选题 p022","items":["**单进单出**：圆筒由齿轮带动低速转动，燃料和热空气从**一端**进入，磨好后由**另一端**带出。","**双进双出**：两端空心轴既是热风和原煤进口、又是煤粉气流出口，形成**两个对称独立的磨煤回路**。分**带热风空心管**（空心轴进风进煤）与**不带热风空心管**（两端各设隔开的进出口料斗）两种。","⭐ **（1）筒体转速 —— 三个工况**（课件 p019–p021，单选原题）：","　`n_c = 42.3/√D`（临界转速，D 为筒体直径 m）","　· **n ≪ n_c**：钢球提不到应有高度，磨煤作用很小、煤粉难分离 → **出力很小**；","　· **n ≥ n_c**：钢球和原煤**随筒体一同转动而不落下** → **磨煤出力几乎为零**；","　· **n < n_c**：钢球被提升到一定高度后落下，热风穿过筒体干燥并带出煤粉 → **出力最大、分离效果最好**。","　**最佳工作转速**：`n_zj / n_c = 0.74 ~ 0.8`。","**（2）钢球充满系数 ψ**：`ψ = G/(ρ_gq·V) × 100%`，G 钢球装载量(t)、V 筒体容积(m³)、ρ_gq 钢球堆积密度 **4.9 t/m³**。","　ψ = **10%~35%** 范围内：`B_m ∝ ψ^0.6`、`P_m ∝ ψ^0.9`、**单位电耗 `E_m ∝ ψ^0.3`**；最佳充满系数 `ψ_zj = 0.12/(n/n_c)^1.75`。","**（3）钢球直径 d**：一般 **30~40 mm**；磨硬煤用 **50~60 mm**。直径小 → 撞击次数多、作用面积大 → 出力↑但磨损↑；直径大 → 撞击力大但接触面积小。","**（4）护甲**：形状影响钢球提升高度。三种：**阶梯式 / 波浪式 / 齿式**（**齿形最佳**）。","**（5）通风量**：太小 → 煤粉集中进口端、筒内风速低 → 出力↓；太大 → 带出粗粉、回粉量↑、通风电耗↑。有**最佳通风量**。","**（6）筒内载煤量 G_m**：太少 → 无效碰撞多、出力↓；太多 → 钢球落差减小、甚至堵塞。**运行时通过磨煤机进出口压差和电流控制**。","**（7）水分 M_ar**：水分多 → 不好磨 → B_m 小。","**单进单出的优缺点**：优点＝煤种适应性强、单机容量大、对杂质不敏感、可靠性高；缺点＝金属消耗量大、电耗大、噪音大、煤粉均匀性差。","　⚠️ **关键结论**：球磨机**磨煤功率与磨煤出力几乎无关**，出力↓ → **单位电耗↑** → **满负荷运行最经济**，只适合带基本负荷。","**双进双出优点**：保持钢球磨煤种适应性广等优点，同时**体积大大缩小、能耗降低、适应负荷变化能力强**（响应快、储粉量大、运行灵活）；出力靠**一次风量**控制而非给煤机。"]},{"id":"p-ch2-medium","title":"中速磨煤机 ★★","key":true,"source":"课件 p035–p045；单选题 p045","items":["**三类中速磨**：**碗式（HP/RP/MBF）** · **轮式（MPS/ZGM）** · **球环式（E 型）**。","**结构沿高度分四部分**：① 驱动装置 ② 研磨部件 ③ 干燥分离空间 ④ 煤粉分离和分配装置。","**工作原理**：原煤经落煤管落到磨盘（或磨环）上，电机驱动磨盘转动，磨辊在弹簧/液压压力下**挤压、研磨**煤；热风经**风环**高速吹入，把磨好的煤粉**干燥并带起**进入分离器；粗粉返回重磨，合格煤粉送往炉膛；难磨杂质落入**石子煤箱**定期排出。","**碗式（HP）特点**：磨辊外表面与磨碗内表面接触面**呈直线状**，受力均匀、均处最大正压力；磨碗有**倾斜角**，煤块重力部分抵消离心力，**延长煤在研磨面上的停留时间**；维修方便，磨辊可直接翻出。","**轮式（MPS/ZGM）特点**：接触面**呈凹弧形**，相同压力下只有很小范围处于最大正压；磨轮尺寸大、研磨表面积大；**三个磨轮呈三点受力**，机体不受力、不影响密封；辊胎**对称**，一侧磨损严重可**翻身继续用**。","⭐ **影响中速磨工作的主要因素**（课件 p040–p044，★重点，单选原题）：","　· **（1）转速**：过高 → 煤离心力大，未磨碎就通过研磨件，大颗粒造成通风阻力、粗粉量、通风电耗增加；过低 → 磨好的煤粉不能及时带走，细粉量增加，电耗与金属磨耗增加。大容量磨有**降低转速**趋势。","　· **（2）通风量**：直接影响**煤粉细度、磨煤出力和石子煤排出量**；运行中允许在最低（不发生煤粉沉积）至最大之间随出力改变，**始终维持风煤比不变**，风煤比与磨煤出力成**线性关系**。","　· **（3）风环气流速度**：原则是**能把大部分煤粒托起，但只将少量煤粉带入分离器**，其余返回研磨区形成循环煤层。过高 → 煤粉变粗、阻力大、通风电耗↑；过低 → 煤粉变细、出力↓、石子煤排放量↑。可通过**风环间隙**控制。","　· **（4）研磨压力**：过小 → 出力↓、煤粉变粗；过大 → **研磨件磨损加剧**。随研磨件磨损承载减小，需**随时调整**维持压力不变。","　· **（5）燃料性质**：水分**较大** → 容易压成**煤饼** → 出力↓；水分**较低** → 发生**滑动** → 出力也下降。","**中速磨的优缺点（与筒式钢球磨相比）**：优点＝占地小、投资少、噪音与电耗小、煤粉粒度均匀、空载功率小、运行灵活更适合变负荷；缺点＝**结构复杂、检修要求高**、**对煤种变化适应能力较差**（适合烟煤）、干燥作用小、**受水分影响大**（水分大会压成饼状，一般要求 **M_ar<40%**、**HGI>50**）。","**高速磨（风扇磨）**：转速 >400 r/min，结构简单尺寸小、与粗粉分离器连成一体；原理为**撞击、磨擦**，干燥作用强；**本身即排粉机**，采用直吹式；适用**高水分褐煤**；缺点是**叶轮磨损严重、维护工作量大**。"]},{"id":"p-ch2-output","title":"磨煤出力与干燥出力","key":false,"source":"课件 p030","items":["**磨煤出力 B_m**：磨煤机在消耗一定能量的条件下，**单位时间内能磨制符合煤粉细度要求的原煤量**。","**干燥出力 B_g**：磨煤系统单位时间内，能把多少原煤从原有（收到基）水分 **M_ar** 干燥到要求的煤粉水分 **M_mf**。","**球磨机工作时应同时满足这两个出力。**"]},{"id":"p-ch2-system","title":"制粉系统：中间储仓式 vs 直吹式 ★","key":true,"source":"课件 p046–p047","items":["**制粉系统的任务**：安全可靠、经济地制造和运送锅炉所需的合格煤粉。","**中间储仓式**：磨好的合格煤粉**先存入煤粉仓**，再经给粉机按锅炉负荷送入炉膛。","　流程：原煤→给煤机→（下行干燥管预热）→磨煤机→**粗粉分离器**（粗粉返回重磨）→**细粉分离器**（约 90% 煤粉分离下来）→**煤粉仓**；分离后的**乏气**（带约 10% 煤粉）经**排粉机**提升压力。","　**两种送粉方式**：**乏气送粉**（乏气携煤粉作一次风）· **热风送粉**（用热风作一次风输送煤粉，乏气作三次风）——后者用于无烟煤、贫煤等着火温度高的煤。","　**特点**：磨煤机与锅炉相对独立，**低负荷时磨煤机仍可保持高负荷运行**；但系统复杂、初投资大、**制粉电耗高**、负压运行**漏风量大**（磨煤机入口约维持 200 Pa 负压，到排粉机入口负压可达 6000~8000 Pa），使排烟温度升高。","**直吹式**：**不设煤粉仓**，磨好的合格煤粉**直接送入炉膛**，磨煤量随锅炉负荷同步调节。","　**分负压系统与正压系统**：负压系统（磨煤机出口设排粉机）因高浓度煤粉严重磨损排粉机叶轮，**已很少采用**；现多用**正压直吹式**（磨煤机及其后设备处正压，须用**密封空气/密封风机**防漏粉）。","　**正压直吹式又分两种**：","　· **热一次风机系统**：热一次风机在空预器与磨煤机之间，抽取一次风送入磨煤机。缺点＝空气温度高、比容大 → 风机体积大、**电耗高**、易高温侵蚀、效率与可靠性低。","　· **冷一次风机系统**（大容量电站锅炉多采用）：一、二次风各由独立风机输送，风机在空预器**之前**，输送干净冷空气。**优点**：① 冷空气比容小 → 风机体积小、**电耗低、效率高**；② 高压头冷一次风机可**兼作密封风机**，简化系统；③ 热风温度不受一次风机限制，**可满足较高水分煤种**的要求；④ 负荷变化对独立一次风系统影响小。"]},{"id":"p-ch2-sep","title":"煤粉分离器","key":false,"source":"课件 p046–p047","items":["**粗粉分离器**：把气粉混合物中的**粗粉分离出来送回磨煤机**。工作原理：**重力、离心力（主要）、惯性力**。","　三种分离：**重力分离**（截面扩大、流速从 15~20 m/s 降至 4~6 m/s）· **离心力分离**（折向挡板或旋转式）· **惯性力分离**（气流拐弯）。","　调节煤粉细度：**挡板开度**、**圆锥帽拉杆（套环）**，旋转式则调**转速**。","　布置：低速单进单出磨——高位分开布置；双进双出磨——一体或分开（**分开更好**）；中速磨——**与磨煤机一体**。","**细粉分离器（旋风分离器）**：把气粉混合物中的**煤粉分离出来送到煤粉仓**，**仅中间储仓式才需要**。工作原理：**重力、离心力**。","　含粉气流**切向引入**：**外旋**——固体粒子靠离心力甩向外筒壁向下运动，由下部口排出；**内旋**——净化后的气流由顶部排气口排出。","**辅助设备**：**给煤机**（控制进入磨煤机的**原煤量**，大型机组多用刮板式和皮带式）· **给粉机**（控制进入炉膛的**煤粉量**，仅中间储仓式有）。","　⚠️ 炉膛燃烧稳定性在很大程度上取决于**给粉机给粉量的均匀性**及其**适应锅炉负荷变化的调节性能**。"]},{"id":"p-ch2-select","title":"磨煤机及制粉系统选型","key":false,"source":"课件未覆盖 · 教材补充（第二章第四节）","items":["选型影响机组运行的**经济性和可靠性**，受多种因素制约。","**首先是煤种及其挥发分含量 V_daf 和着火温度 IT**；其次是**对煤粉细度 R₉₀ 的要求**；其他因素有**煤的可磨性、磨损性和水分含量**等，应综合考虑。","教材表 2-3 给出各类磨煤机及制粉系统的适用范围（参考）。","注：煤的外在水分 `M_f = (M_ar − M_ad)/(100 − M_ad)`。"]}],"questions":[{"id":"bq-ch2-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p005（1 分）","keyPoints":["煤粉爆炸","挥发分","煤粉浓度","水分与细度"],"stem":"关于煤粉爆炸的影响因素，下列说法正确的是？","options":[{"k":"A","t":"干燥无灰基挥发分含量越低，越容易引起着火、爆炸"},{"k":"B","t":"煤粉最危险的爆炸浓度范围是 1.2 ～ 2.0 Kg/m³"},{"k":"C","t":"煤粉水分越小、颗粒越细，越不容易引起着火和爆炸"},{"k":"D","t":"当煤粉的挥发分 >10% 或粒径 >100μm 时，煤粉几乎不会发生爆炸"}],"answer":"B","why":["A ✗ 课件 p003 原文：干燥无灰基挥发分含量**越高**，越容易引起着火、爆炸 —— 说反了。","B ✓ 与课件 p003 原文完全一致：「煤粉浓度——最危险浓度：1.2～2.0 Kg/m³」。","C ✗ 课件 p003 原文：煤粉水分**越小**、颗粒**越细**，**越容易**引起着火、爆炸 —— 说反了。","D ✗ 课件 p004 原文：当挥发分 **<10%** 或粒径 **>100 μm** 时几乎不会爆炸；选项写成「挥发分 >10%」正好相反。"],"basis":"课件 p003–p004（原文）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]},{"id":"bq-ch2-2","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p022（1 分）","keyPoints":["钢球磨","临界转速","最佳工作转速"],"stem":"关于钢球筒式磨煤机的工作转速，下列说法正确的是？","options":[{"k":"A","t":"当工作转速 n 远小于临界转速 nc 时，磨煤出力最大"},{"k":"B","t":"当工作转速 n 大于等于临界转速 nc 时，钢球和原煤随筒体一同转动，磨煤出力几乎为零"},{"k":"C","t":"筒体的最佳工作转速与临界转速 nc 的比值通常为 0.5 ～ 0.6"},{"k":"D","t":"工作转速越高，磨煤出力越大，因此应尽量提高转速"}],"answer":"B","why":["A ✗ 课件 p020：n ≪ n_c 时钢球提不到应有高度，磨煤作用很小、出力**很小**（不是最大）。","B ✓ 与课件 p021 原文一致：「当磨煤机的工作转速 n≥n_c 时，钢球和原煤与筒体一同转动而不会落下，磨煤出力几乎为零」。","C ✗ 课件 p021 给出的是 `n_zj/n_c = 0.74 ~ 0.8`，不是 0.5~0.6。","D ✗ 转速达到临界转速后出力反而归零，绝非「越高越好」。"],"basis":"课件 p019–p021（原文）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]},{"id":"bq-ch2-3","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p045（1 分，问「错误的是」）","keyPoints":["中速磨","通风量","风环气流速度","研磨压力","燃料水分"],"stem":"关于中速磨煤机的运行因素，下列说法错误的是？","options":[{"k":"A","t":"通风量过大，会导致煤粉变粗，通风电耗增加"},{"k":"B","t":"研磨压力过小，会导致磨煤出力降低，煤粉变粗"},{"k":"C","t":"燃料水分较大时，容易压成煤饼，造成磨煤出力降低"},{"k":"D","t":"风环气流速度越高越好，可以保证将大部分煤粉带入分离器"}],"answer":"D","why":["A ✓ 课件 p042 原文：风环流速（通风）过高 → 煤粉变粗、阻力变大、通风电耗增加。","B ✓ 课件 p043 原文：研磨压力过小 → 磨煤出力降低、煤粉变粗。","C ✓ 课件 p044 原文：燃料水分较大 → 容易压成煤饼 → 磨煤出力降低。","D ✗ **错在「越高越好」**。课件 p042 原则是：「应能将**大部分煤粒托起**，但**只将少量煤粉**带入分离器，其余大部分煤粒返回研磨区形成循环煤层」；速度过高反而煤粉变粗、阻力变大、通风电耗增加。"],"basis":"课件 p041–p044（原文）","answerNote":"课件未标答案；本题问「错误的是」，故答案为 D。请以老师公布为准","steps":[],"given":[],"ask":[]},{"id":"bq-ch2-4","kind":"计算","priority":3,"source":"课件未覆盖 · 教材补充","sourceDetail":"教材第二章复习思考题 3","keyPoints":["煤粉细度换算","R90","R75","均匀性指数n"],"stem":"若已知 R₉₀ = 13%，试计算 R₇₅ 的值（假设 n = 1.1）。","given":["R₉₀ = 13%","均匀性指数 n = 1.1","要求换算到 x = 75 μm"],"ask":["R₇₅ 的值"],"steps":["用不同粒径煤粉细度的换算公式：`R_x2 = 100·(R_x1/100)^((x₂/x₁)ⁿ)`","这里 x₁ = 90 μm，R_x1 = R₉₀ = 13%；x₂ = 75 μm，求 R₇₅","代入：`R₇₅ = 100 × (13/100)^((75/90)^1.1)`","计算指数：`(75/90)^1.1 = (0.8333)^1.1 ≈ 0.8185`","计算幂：`0.13^0.8185 ≈ e^(0.8185 × ln0.13) = e^(0.8185 × (−2.0402)) = e^(−1.6699) ≈ 0.1881`","`R₇₅ ≈ 100 × 0.1881 ≈ 18.8%`"],"result":"R₇₅ ≈ **18.8%**","why":["🔑 关键是换算公式 `R_x2 = 100·(R_x1/100)^((x₂/x₁)ⁿ)`：**粒径变小 → 细度值变大**（75 μm 的筛上余量比 90 μm 多），结果 18.8% > 13% 符合直觉。","⚠️ 指数是 `(x₂/x₁)^n`，注意 n 作用在比值上，不是乘在外面。","⚠️ 教材原题（复习思考题第 3 题），教材未给答案，以上为按公式推导的结果。"],"basis":"教材第二章复习思考题 3；公式见课件 p007（破碎公式换算）","answerNote":"教材未给答案，本解答按课件给出的换算公式推得，请核对"},{"id":"bq-ch2-5","kind":"单选","priority":2,"source":"课件考点","sourceDetail":"","keyPoints":["经济细度","q4","制粉电耗"],"stem":"煤粉的经济细度（最佳煤粉细度）是指（　）","options":[{"k":"A","t":"煤粉越细越好时的细度"},{"k":"B","t":"使不完全燃烧热损失 q₄ 与制粉能耗 E_m 之和最小时的煤粉细度"},{"k":"C","t":"使磨煤机出力最大时的煤粉细度"},{"k":"D","t":"使制粉电耗最小时的煤粉细度"}],"answer":"B","why":["A ✗ 煤粉越细，制粉电耗和金属磨损越大，不是越细越好。","B ✓ 课件 p010 原文：「应选择使**燃烧不完全热损失 q₄ 和制粉能耗 E_m 之和最小**时的煤粉细度」。","C ✗ 出力最大不等于总成本最低。","D ✗ 只看制粉电耗会漏掉燃烧损失，是片面理解。"],"basis":"课件 p010","steps":[],"given":[],"ask":[]},{"id":"bq-ch2-6","kind":"单选","priority":2,"source":"课件考点","sourceDetail":"","keyPoints":["均匀性指数n","颗粒分布"],"stem":"关于煤粉均匀性指数 n，下列说法正确的是（　）","options":[{"k":"A","t":"n 越大，煤粉中过粗颗粒越多"},{"k":"B","t":"n 越大，煤粉中过细颗粒越多"},{"k":"C","t":"n 越大，煤粉中过粗和过细的颗粒都较少，粒度分布越均匀"},{"k":"D","t":"n 与煤粉粒度分布无关"}],"answer":"C","why":["A ✗ B ✗ 课件 p008 明确：R₉₀ 一定时 n 越大则 R₂₀₀ 越小（过粗少）；R₂₀₀ 一定时 n 越大则 R₉₀ 越大（过细少）。","C ✓ 与课件 p008 原文一致：「n 值越大，煤粉中过粗和过细的煤粉均较少，即煤粉粒度分布较均匀」。","D ✗ n 正是表征粒度分布均匀程度的参数，一般取 0.8~1.2。"],"basis":"课件 p008","steps":[],"given":[],"ask":[]},{"id":"bq-ch2-7","kind":"填空","priority":2,"source":"课件考点","sourceDetail":"","keyPoints":["磨煤机分类","转速"],"stem":"按磨煤部件的工作转速，磨煤机分为低速、中速、高速三类。按课件口径：低速为 ____ r/min，中速为 ____ r/min，高速为 ____ r/min。（填数值范围）","answer":"15~25 ； 25~100 ； 425~1000","why":["课件 p014 原文：低速 **15~25 r/min**（筒式钢球磨）· 中速 **25~100**（碗式、轮式）· 高速 **425~1000**（风扇式）。","⚠️ 不同教材对转速分级写法不同，考试以课件或题目给定值为准。"],"basis":"课件 p014（原文）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]}],"images":{"2":{"w":"img/boiler-ch2/p002.webp","j":"img/boiler-ch2/p002.jpg"},"3":{"w":"img/boiler-ch2/p003.webp","j":"img/boiler-ch2/p003.jpg"},"4":{"w":"img/boiler-ch2/p004.webp","j":"img/boiler-ch2/p004.jpg"},"5":{"w":"img/boiler-ch2/p005.webp","j":"img/boiler-ch2/p005.jpg"},"6":{"w":"img/boiler-ch2/p006.webp","j":"img/boiler-ch2/p006.jpg"},"7":{"w":"img/boiler-ch2/p007.webp","j":"img/boiler-ch2/p007.jpg"},"8":{"w":"img/boiler-ch2/p008.webp","j":"img/boiler-ch2/p008.jpg"},"9":{"w":"img/boiler-ch2/p009.webp","j":"img/boiler-ch2/p009.jpg"},"10":{"w":"img/boiler-ch2/p010.webp","j":"img/boiler-ch2/p010.jpg"},"11":{"w":"img/boiler-ch2/p011.webp","j":"img/boiler-ch2/p011.jpg"},"12":{"w":"img/boiler-ch2/p012.webp","j":"img/boiler-ch2/p012.jpg"},"13":{"w":"img/boiler-ch2/p013.webp","j":"img/boiler-ch2/p013.jpg"},"14":{"w":"img/boiler-ch2/p014.webp","j":"img/boiler-ch2/p014.jpg"},"15":{"w":"img/boiler-ch2/p015.webp","j":"img/boiler-ch2/p015.jpg"},"16":{"w":"img/boiler-ch2/p016.webp","j":"img/boiler-ch2/p016.jpg"},"17":{"w":"img/boiler-ch2/p017.webp","j":"img/boiler-ch2/p017.jpg"},"19":{"w":"img/boiler-ch2/p019.webp","j":"img/boiler-ch2/p019.jpg"},"20":{"w":"img/boiler-ch2/p020.webp","j":"img/boiler-ch2/p020.jpg"},"21":{"w":"img/boiler-ch2/p021.webp","j":"img/boiler-ch2/p021.jpg"},"22":{"w":"img/boiler-ch2/p022.webp","j":"img/boiler-ch2/p022.jpg"},"23":{"w":"img/boiler-ch2/p023.webp","j":"img/boiler-ch2/p023.jpg"},"24":{"w":"img/boiler-ch2/p024.webp","j":"img/boiler-ch2/p024.jpg"},"25":{"w":"img/boiler-ch2/p025.webp","j":"img/boiler-ch2/p025.jpg"},"26":{"w":"img/boiler-ch2/p026.webp","j":"img/boiler-ch2/p026.jpg"},"27":{"w":"img/boiler-ch2/p027.webp","j":"img/boiler-ch2/p027.jpg"},"28":{"w":"img/boiler-ch2/p028.webp","j":"img/boiler-ch2/p028.jpg"},"29":{"w":"img/boiler-ch2/p029.webp","j":"img/boiler-ch2/p029.jpg"},"30":{"w" 影响"},{"label":"一次风煤粉气流的偏斜"},{"label":"假想切圆直径 d_im（防结渣宜取小）"},{"label":"内侧 α₁ / 外侧 α₂ 补气条件与静压差"}]},{"label":"第三节 旋转射流和旋流煤粉燃烧器射流特点","children":[{"label":"旋流器与旋转射流产生"},{"label":"内回流区 / 外回流区"},{"label":"旋转射流 5 条特点"},{"label":"旋流强度 n = M/(KL)"},{"label":"封闭式火焰"},{"label":"开放式火焰"},{"label":"飞边火焰（扩散角 180°）"},{"label":"旋转煤粉燃烧器：蜗壳式、切向叶片式、轴向叶片式"},{"label":"旋流燃烧器的布置：前墙、前后墙对冲、前后墙交错"}]},{"label":"第五节 低NOx燃烧","children":[{"label":"NOx成分（NO占90%）与危害"},{"label":"一、NOx生成机理","children":[{"label":"热力NOx（火焰温度、氧浓度、高温区范围；>1500℃每升100℃增大6～7倍；1600℃时约占20%）"},{"label":"快速型NOx（CH自由基+氮→HCN和N→NOx；占5%）"},{"label":"燃料NOx（占75%，挥发分燃烧占70%；30～50ms内析出）"}]},{"label":"二、低NOx原理与燃烧技术","children":[{"label":"1、低过量空气燃烧（低氧燃烧，可降15～20%）"},{"label":"2、浓淡偏差燃烧（浓相/淡相）"},{"label":"3、空气分级（80%理论空气量；两级燃烧法；可降40%～50%）"}]}]},{"label":"第六节 典型直流煤粉燃烧器","children":[{"label":"1、WR型燃烧器（V形/波形扩流锥；弯头浓淡分离）"},{"label":"2、浓淡燃烧器（PM型）"}]},{"label":"第七节 典型旋流煤粉燃烧器","children":[{"label":"1、双调风燃烧器（内二次风/外二次风；火焰核心、富燃料区、富氧区）"},{"label":"2、三并-巴布科克的LNASB燃烧器"}]},{"label":"第八节 煤粉锅炉炉膛","children":[{"label":"炉膛三项要求（空气动力特性／足够受热面／合适热强度）"},{"label":"固态排渣煤粉炉与液态排渣煤粉炉"},{"label":"二、炉膛的设计计算","children":[{"label":"1、炉膛容积热强度 q_V = B_cal Q_net,ar / V_f（kW/m³）"},{"label":"2、炉膛断面热强度 q_A = B_cal Q_net,ar / A（kW/m²）"},{"label":"3、燃烧器区域壁面热强度 q_B = B_cal Q_net,ar / A_B，A_B = 2(W+D)(h₂+3)"},{"label":"4、燃尽区容积热强度 q_bo = B_cal Q_net,ar / V_bo，V_bo = W D h₁"},{"label":"5、炉膛壁面热强度 q_f^w = B_cal Q_f^re / F（kW/m²）"},{"label":"旋流燃烧器布置方式：(a)前墙 (b)两面墙 (c)炉底 (d)炉顶 (e)两面墙交错 (f)两面墙对冲"}]}]}]},"points":[{"id":"p-ch4a-1","title":"燃烧设备组成与三大部件作用","key":true,"source":"课件 p002","items":["**煤粉锅炉燃烧设备组成：点火装置、煤粉燃烧器、炉膛等**","锅炉点火装置：主要用于**锅炉启动时点燃主燃烧器的煤粉气流**；当锅炉**低负荷运行或燃用劣质煤**时，可用点火装置来**稳定燃烧或作为辅助燃烧设备**","煤粉燃烧器：将携带煤粉的**一次风**和助燃的**二次风**送入炉膛，并**组织一定的气流结构**，使煤粉**迅速稳定地着火**；同时使煤粉和空气**合理混合**，达到煤粉在炉内**迅速完全燃烧**的目的","炉膛也称为**燃烧室**：供煤粉燃烧的**空间**"]},{"id":"p-ch4a-2","title":"性能良好的燃烧设备应满足的 5 项要求与燃烧器分类","key":true,"source":"课件 p003","items":["1、将燃料和燃烧所需空气送入炉膛，在炉内形成**良好的空气动力场**，使**燃料能迅速稳定地着火**","2、**及时供应空气**，与燃料**适时混合**，造成必须的**燃烧强度**，使**燃料在炉内达到完全燃烧**","3、**燃烧可靠稳定，炉内不结焦**，保证**锅炉安全经济地运行**","4、有较好的**燃料适应性**，具有良好的**调节性能和较大的调节范围**，以适应**煤种和负荷变化**的要求","5、**NOx 的生成量控制在允许范围内**，以达到**环保**的要求","燃烧器按射流是否旋转分类：**直流燃烧器**、**旋流燃烧器**"]},{"id":"p-ch4a-3","title":"直流射流：卷吸、射程与喷口尺寸的影响","key":true,"source":"课件 p004–p006","items":["直流煤粉燃烧器出口由一组**圆形、矩形或多边形**的喷口组成；煤粉和燃烧所需空气分别由不同喷口以**直流射流形式**喷进炉膛，射流在炉膛的发展**基本决定了燃料的着火条件和燃烧强度**","**卷吸**：射流横向运动，带动周围静止的气体一起前进","从**外边界**卷吸高温烟气，是**着火热的来源**，**着火从外边界开始**","**射程**判据：当射流在某一截面上的**最大轴线速度降低到某一数值**时（仍保持一定的**余速**），该截面距喷口的距离即为射程","射程**物理意义**：表征射流在烟气中的**贯穿能力**；射流的**初始动量越大，射程越大**","喷口尺寸影响：在**喷口通流截面不变**的情况下，将一个大喷口分为**多个小喷口**，可**增加卷吸能力**，但**射程将缩短**","矩形喷口**高宽比**影响：射流初速与喷口通流截面积不变时，**高宽比越大→喷口周界越大→射流外边界越大→卷吸能力增强**，但**射流轴线速度衰减加快，射程将缩短**"]},{"id":"p-ch4a-4","title":"直流煤粉燃烧器的配风方式：一次风/二次风/三次风","key":true,"source":"课件 p007","items":["送风原则：**对着火、燃烧有利而合理组织、分批送入**，按作用不同分为三种","**一次风**：携带煤粉送入燃烧器的空气；主要作用是**输送煤粉**和**满足燃烧初期对氧气的需要**","**二次风**：待煤粉气流**着火后再送入**的空气；补充煤粉继续燃烧所需空气，并发挥**促使气流扰动和混合**的作用","**三次风**：对**中间储仓式热风送粉系统**，为充分利用细粉分离器排出的含有 **10%～15% 细粉的乏气**，由**单独的喷口**送入炉膛燃烧，这股乏气称为三次风","按一次风与二次风喷口布置位置分为：**均等配风、分级配风**"]},{"id":"p-ch4a-5","title":"均等配风与分级配风的判据对比","key":true,"source":"课件 p008、p010","items":["**均等配风**：一、二次风喷口**相间布置**，即在二个一次风喷口之间**均等布置一个或二个二次风喷口**，或每个一次风**背火侧**均等布置二次风口，各二次风喷口**风量分配较均匀**","均等配风：一、二次风口**间距较小**，有利于一、二次风的**较早混合**，使一次风煤粉气流着火后能**迅速获得足够的空气，达到完全燃烧**","均等配风适用于**燃用高挥发分煤种**，常称为：**烟煤、褐煤型配风方式**","**分级配风**：一次风喷口**相对集中布置，并靠近燃烧器的下部**，二次风喷口则**分层布置**，一、二次风喷口间**保持较大的距离**，二次风**分级分阶段**送入，强化气流的**后期混合**，促使**燃料燃烧与燃尽**","分级配风方式一次风喷口**高宽比大，卷吸量大**；煤粉气流相对集中，**火焰中心温度高**，有利于**低挥发分煤**的着火、燃烧","分级配风适合于**燃用低挥发分煤种或劣质煤**，常称为**无烟煤和贫煤配风方式**"]},{"id":"p-ch4a-6","title":"三次风如此布置的原因及其对燃烧与汽温调节的不利影响","key":false,"source":"课件 p011","items":["提问：为什么三次风如此布置？（**压火，逗留时间，燃尽**）","1、使**炉膛温度降低**，**着火推迟**，**燃烧不稳定**","2、三次风**高速射入**，导致煤粉火炬**燃尽条件恶化**，**飞灰可燃物增加**，**火焰中心上移**，炉膛出口和过热器前**烟温升高**，增大了**过热器热偏差**，易引起**炉膛出口附近结渣、过热器超温爆管**等","3、三次风量较大时**风速也增大**，高速射入时增大了**火焰残余旋转**，易**扰乱炉膛内正常的空气流动**，引起**火焰贴墙结渣**"]},{"id":"p-ch4a-7","title":"四角布置切圆燃烧与炉内空气动力特性（无风区/强风区/弱风区）","key":true,"source":"课件 p012、p013","items":["四角布置时，四股气流在炉膛中心形成一个**假想圆**，这种**切圆燃烧**方式能使相邻燃烧器喷出的气流**互相引燃**，起到**帮助气流点火**的作用","切圆形式有：**单切圆、双切圆、六角、八角**","四角布置的直流燃烧器射出的四股气流在炉膛中心形成一个**稳定的强烈旋转火炬**；在离心力作用下气流向四周扩展，**炉膛中心形成真空，即无风区**","**无风区**的外面是气流强烈旋转的**强风区**；最外围是**弱风区**（对应图注 Ⅰ-无风区；Ⅱ-强风区；Ⅲ-弱风区）","气流在**引风机抽力**的作用下上升，在炉膛中形成**螺旋上升的气流**"]},{"id":"p-ch4a-8","title":"切圆燃烧炉内空气动力特性对着火、燃烧、燃尽的影响","key":true,"source":"课件 p014","items":["①**着火**：每一角喷出的煤粉气流都受到来自**上游邻角正在剧烈燃烧的高温火焰**的冲击和加热，很快着火燃烧，并再点燃下游邻角的新煤粉气流，**相邻的煤粉气流能互相引燃**","旋转气流使炉膛中心**无风区形成负压**，部分**高温烟气由上向下回流到火焰根部**；加上每股煤粉气流本身**卷吸部分高温烟气**和接受**炉膛辐射热**，因此四角布置切圆燃烧的**着火条件十分理想**","②**燃烧**：直流射流**射程长**，在炉膛烟气中**贯穿能力强**；着火后煤粉火炬强烈旋转，使炉内**温度、氧浓度更均匀**，**强化了煤粉与空气的后期混合**，加速煤粉燃烧","③**燃尽**：**气流螺旋上升**，改善了**火焰在炉内充满度**，**均布了炉内的热负荷**，并**延长了煤粉在炉内的停留时间**"]},{"id":"p-ch4a-9","title":"一次风煤粉气流的偏斜：d_im 与 α₁/α₂ 判据","key":true,"source":"课件 p015","items":["**假想切圆直径 d_im**：较大的 d_im 可使**邻角火炬的高温烟气更易达到下角射流的根部**，**扰动更强烈**，有利于煤粉气流**着火、燃尽**；但 **d_im 过大→射流偏斜增大→容易引起水冷壁结渣**；炉膛出口**较大的残余旋转**会引起**烟温和过热器的温偏差**","**防结渣角度：d_im 宜取小一些**","**炉膛和燃烧器的结构特性**：燃烧器射流两侧卷吸烟气形成负压","**内侧（向火侧，α₁）**：有**上游邻角气流横扫过来**，**补气条件充裕**","**外侧（面向炉墙一侧，α₂）**：需从射流较远处回流烟气或由射流**上下两端补气**，**补气条件很差**","因此射流两侧形成**外低内高的静压差**，**迫使射流发生偏斜**；判据：**α₁ 同 α₂ 不能相差太大**"]},{"id":"p-ch4a-10","title":"旋转射流的产生与内、外回流区；旋转射流 5 条特点","key":true,"source":"课件 p016–p018、p019","items":["**旋流式燃烧器由圆形喷口组成**，燃烧器中装有各种型式的**旋流发生器（简称旋流器）**","煤粉气流或热空气通过旋流器时发生旋转，具有**切向、轴向、径向三个方向的速度**，从喷口射出后即形成**旋转射流**；能形成有利于着火的**高温烟气回流区**，并使**气流强烈混合**","煤粉气流经**蜗壳式旋流器**后射出喷口，在**气流中心形成回流区——内回流区**；内回流区卷吸炉内高温烟气加热煤粉气流，达到**着火温度**后着火，**火焰从内回流区的内边缘向外传播**","在旋转气流的**外围**也形成回流区，叫**外回流区**，同样卷吸高温烟气加热空气和煤粉气流；二次风也形成旋转气流，**二次风与一次风混合比较强烈**，使燃烧**连续进行，直至燃尽**","旋转射流特点(1)：**二次风是旋转气流**，一次风可为旋转气流也可为直流射流，整个气流形成**空心圆锥形**的旋转气流","(2) **强烈的卷吸作用**，可从**内、外回流区两个区域**卷吸高温烟气，对煤粉气流的着火十分有利","(3) 气流动量一定，因而**轴向速度和切向速度衰减很快**；同样初始动量下，**旋转射流射程比直流射流射程短**","(4) 旋转射流的**扩展角一般比直流射流大**，且**随旋转强度增大而增大**","(5) 适合**烟煤和褐煤**；初期混合强烈使**着火热增加**，二次风包围一次风对烟气加热煤粉起**屏蔽作用**，**着火条件不够理想**；气流衰减快、射程短、后期混合较弱，对低挥发分煤着火不利，**一般仅适用于高挥发分煤种**"]},{"id":"p-ch4a-11","title":"旋流强度 n=M/(KL) 与封闭式/开放式/飞边火焰判据","key":true,"source":"课件 p020、p021、p022","items":["**旋流强度**：是指气流**切向旋转动量矩**与其**轴向动量和特征尺寸乘积比**（**无因次准则数**）","**公式：n = M /（K L）**","**M**——气流的切向旋转动量矩；**K**——轴向动量；**L**——燃烧器喷口的特征尺寸","（1）**封闭式火焰**：**旋流强度较小**时形成，在**火焰根部**卷吸高温烟气形成回流区；此种火焰**只能卷吸自身燃烧放出的热量**，**有一定的稳定着火能力**，但**回流量小，不适合燃烧难燃的煤**","（2）**开放式火焰**：**气流旋转强度较大**时**回流区加大**形成，**高温烟气的回流量也增多**，可以**将高温烟气从炉膛中卷吸进来**，对着火和燃烧有利","（3）**飞边火焰**：**旋流强度过大**时，气流成为**全扩散气流**导致**气流压向炉墙**，形成**气流飞边现象**；此时**气流扩散角为 180°**（旋转气流外边界之间的夹角称为扩散角），**火焰贴壁**，会引起**严重结渣，甚至烧坏燃烧器**，**实际运行中要避免飞边火焰出现**","结论性要求：**牢记三种火焰形状**及能够对各种火焰形状的**主要特征进行判断**"]},{"id":"p-ch4a-12","title":"旋转煤粉燃烧器的三种型式与旋流燃烧器布置方式","key":false,"source":"课件 p024、p025","items":["旋流燃烧器是**利用旋流器使气流产生旋转运动**；按旋流器结构分为**三种**：**蜗壳式（a）、切向叶片式（b）、轴向叶片式（c）**","（a）蜗壳式：标注蜗壳入口 a、旋流器**外径 d 与内径 d₀**；（b）切向叶片式：标注**叶片角 β** 与轴向尺寸 **b**；（c）轴向叶片式：标注 **d、d₀、b** 及叶片角 **β**","旋流燃烧器布置方式对炉内**空气动力工况有很大影响**；为提高炉膛效率和有效利用率，应注意**改善炉膛火焰充满度**","旋流燃烧器布置方式有**三种**：**前墙布置、前后墙对冲布置、前后墙交错布置**"]},{"id":"p-ch4b-1","title":"燃烧器前墙布置","key":true,"source":"课件 p026","items":["沿炉膛高度方向可布置成**一排或两排**；从每个燃烧器射出的旋流射流在炉内各自独立扩展，依靠**中心回流**卷吸高温烟气，保证煤粉气流迅速着火","炉内射流衰减很快，气流直接上升，炉墙上部和底部形成**两个死漩涡区**；燃烧**双排布置要比单排好一些**","**优点**：磨粉机可直接布置在炉前；煤粉管路短且各长度大致相同，煤粉均匀，沿炉膛宽度方向**烟温偏差小**","**缺点**：炉内火焰**充满度差**，煤粉气流后期扰动小、后期混合性差；死漩涡区较差，前墙火焰可直接冲到后墙**易结渣**；可布置**折焰角**改善其充满度"]},{"id":"p-ch4b-2","title":"旋流燃烧器的两面墙布置（对冲/错列）","key":true,"source":"课件 p027","items":["旋流燃烧器可布置在**前后墙**，也可布置在**两侧**；又可分为**对冲布置**和**错列布置**","对冲布置：两方火炬在中央对冲，气流大部分向上，少部分下冲到**冷灰斗**，形成**死滞漩涡区**；火炬一侧过强时可能导致**水冷壁结渣**","交错布置：由于**火焰相互穿插**所以避免死漩涡区，进而改善了**火焰充满度和火焰混合度**","**缺点**：一侧磨煤机故障或切换低负荷运行时，沿炉膛宽度方向容易引起**温度不均**；不布置燃烧器的两侧容易**结渣**","图上标注：热烟气和灰粒冲刷的几率较小；侧墙布置的**吹灰器**可有效控制水冷壁的积灰"]},{"id":"p-ch4b-3","title":"旋流燃烧器的六种布置方式","key":false,"source":"课件 p028","items":["(a)**前墙布置**　(b)**两面墙布置**　(c)**炉底布置**","（d）**炉顶布置**　(e)**两面墙交错布置**　(f)**两面墙对冲布置**","图组特征：(b) 两侧气流在中心交汇后上升；(e) 左 4 右 3 箭头**不对齐**；(f) 左 4 右 4 箭头**一一对齐对冲**"]},{"id":"p-ch4b-4","title":"第五节 低NOx燃烧：NOx成分与危害","key":false,"source":"课件 p029","items":["**NOx的成分**：主要成分为 **NO**，占总量的 **90%**，其余为 **NO₂、N₂O** 等","**NOx的危害**：刺激人的呼吸系统，损害动植物，破坏臭氧层，引起**温室效应、酸雨和光化学反应**","控制途径：（1）**洁净燃烧技术**（2）**排放法规**","**低NOx燃烧器（LNB）**：成本低、效果好"]},{"id":"p-ch4b-5","title":"热力型NOx与快速型NOx","key":true,"source":"课件 p030","items":["**热力NOx**：空气中的**氮气在高温下的氧化产物**；影响因素为**火焰温度、氧浓度以及高温区范围**","燃烧区域温度水平对热力型NOx生成量起决定作用：**低于1500℃**时生成量很少；**高于1500℃**时，温度每升高 **100℃**，NOx生成量就增大 **6～7倍**","煤粉燃烧中，燃烧温度为 **1600℃** 时，热力型NOx生成量占NOx总生成量的 **20%左右**","**快速型NOx**：由高温热解生成的 **CH自由基**和空气中的**氮**反应，生成 **HCN化合物和N**，进一步快速与氧反应生成NOx","快速型NOx**转换速度极快但生成量少**，占NOx总生成量的 **5%**；**保持足够的氧量供应可抑制生成**"]},{"id":"p-ch4b-6","title":"燃料型NOx（占总量75%）","key":true,"source":"课件 p031","items":["**燃料NOx**：燃料中所含的**氮化合物**在燃烧过程中氧化生成的氮氧化物，占总量的 **75%**","其中**挥发分燃烧产生占 70%**，在**燃烧器出口处的火焰中心处**生成","大部分挥发分在 **30～50ms** 内析出，要控制该区域NOx生成量，就应控制**着火初期的过量空气系数**","措施：形成**富燃料区**，让煤粉在开始着火阶段处于**缺氧状态**，使挥发分生成的一部分NOx**被还原**，实际生成的NOx数量就明显减少","★ **影响因素**：煤的燃烧方式、燃烧工况、炉膛温度水平以及煤粉浓度","**控制NOx的生成量主要应控制燃料型NOx和热力型NOx的生成量**"]},{"id":"p-ch4b-7","title":"低过量空气燃烧（低氧燃烧）","key":true,"source":"课件 p033","items":["使燃烧过程尽可能在**接近理论空气量**的条件下进行；随着烟气中**过量氧的减少**，可以抑制NOx的生成","这是**最简单**的降低NOx排放的方法，一般可降低NOx排放 **15～20%**","但实际运行引起**飞灰含碳量增加、燃烧效率下降**","因此在锅炉设计和运行时，应选取**最合理的过量空气系数**"]},{"id":"p-ch4b-8","title":"浓淡偏差燃烧","key":false,"source":"课件 p033、p037、p038","items":["**浓淡偏差燃烧**：将煤粉气流分成**浓相和淡相**两部分送入炉膛内燃烧；**浓相中煤粉含量较大**，淡相则相反、煤粉含量较少","**浓淡燃烧器低NOx排放**：一次风总量不变前提下提高浓粉流煤粉浓度，使浓粉流燃料在**过量空气系数小于1**条件下燃烧，淡粉流在**大于或接近于1**条件下燃烧，两股气流合起来使燃烧器出口**总过量空气系数仍保持合理范围**","**稳燃效果**：浓粉流可**加快火焰传播速度**使煤粉尽快着火，浓粉流着火后为淡粉流提供**着火、热源**，整个火炬燃烧稳定性增强，**扩大了锅炉不投油助燃的负荷调节范围和煤种适应性**","图5-19 PM型浓淡煤粉燃烧器：横截面自上而下为 火上风／上二次风／**浓燃料一次风**／中二次风／**淡燃料一次风**／下二次风；正视图经**煤和风的惯性分离**后分出浓燃料、淡燃料两股"]},{"id":"p-ch4b-9","title":"空气分级（分级燃烧法）","key":true,"source":"课件 p034","items":["用 **80%左右**的理论空气量从燃烧器喷口送入，形成**一次气流浓燃料燃烧区**，降低了燃烧区的**氧浓度**和**温度**，使燃料型NOx生成量减少","完全燃烧所需的**其余二次风**喷射到富燃料区域**下游**，形成**二次燃烧区（富氧燃烧）**，燃料可完全燃烧","燃烧所需空气量分**两级**送入炉内，燃烧过程也分两级进行，**火焰整体温度比空气不分级时低**，故称**两级燃烧法或分级燃烧法**","可降低氮氧化物 **40%～50%**","图4-9 旋流燃烧三级混合示意图：1—**富燃料区**；2—**空气逐渐掺混区**；3—**空气最后掺混区**；标注有燃尽风、外二次风、内二次风、煤粉和一次风"]},{"id":"p-ch4b-10","title":"典型直流/旋流煤粉燃烧器要点（WR型、双调风、LNASB）","key":false,"source":"课件 p035–p041","items":["**WR型燃烧器**：①一次风口内装 **V形或波形扩流锥**，相当于小钝体，使喷口外一次风气流形成稳定的**高温烟气回流区**，为煤粉着火提供热源；②一次风入口弯头内**故意不安装气体导向装置**，利用弯头进行**煤粉浓淡分离**；③能在**较大范围内适应煤种及负荷变化**","图5-20 **宽调节比燃烧器**：1-阻挡块；2-喷嘴头部；3-扩流锥；4-水平肋片；5--一次风管；6-**二次风箱**；7-入口弯头；8-摆动喷口","**双调风燃烧器**（图6-20）：煤粉气流进入后有**内二次风、外二次风**，炉内形成**火焰核心**，外缘为**富燃料区**、下部为**富氧区**","**三并-巴布科克 LNASB 燃烧器**（低NOx轴向旋流燃烧器）：含风箱、三次风管、中心风管、蝌状体、中心风机、PA/PF管、二次风管、**二次风旋流**、**三次风旋流发生器**、焦框器铸件"]},{"id":"p-ch4b-11","title":"第八节 煤粉锅炉炉膛：设计要求与排渣方式","key":true,"source":"课件 p042、p043","items":["炉膛应满足要求：1）**良好的炉内空气动力特性**——避免火焰冲击炉墙、防止水冷壁结渣、减少炉内**死滞旋涡区**，保证煤粉燃烧有足够**空间和时间**","2）能布置足够的受热面，将**炉膛出口烟气温度降到容许的数值**，以保证炉膛出口及其后的受热面**不结渣**","3）有**合适的热强度**——按热强度确定的炉膛**容积及截面尺寸和高度**应能满足煤粉气流在炉内**充分发展、均匀混合和完全燃烧**的要求","按排渣方式分两种型式：灰渣在**固体状态下**清除出去，称为**固态排渣煤粉炉**；灰渣在**熔化的液态下**清除出去，称为**液态排渣煤粉炉**","结构应保证燃料完全燃烧，又能使**炉膛出口烟温降低到灰熔点以下**，以便使出口之后对流受热面不结渣"]},{"id":"p-ch4b-12","title":"炉膛设计计算的5个热强度公式","key":true,"source":"课件 p044–p048","items":["**1、炉膛容积热强度**（单位时间、单位炉膛容积放出的热量）：**q_V = B_cal Q_net,ar / V_f**，单位 **kW/m³**；且 **q_v ∝ 1/τ**","V_f —— **炉膛容积**；q_V选得过大 → 燃料和烟气在炉内**停留时间不够**、不容易烧完；同时表示炉膛容积过小、水冷壁受热面积过小、**炉膛出口烟温过高**，容易导致结渣","**2、炉膛断面热强度**（单位时间、单位炉膛断面积放出热量）：**q_A = B_cal Q_net,ar / A**，单位 **kW/m²**；A —— **燃烧区域炉膛断面积**","q_A **反映燃烧器区域温度水平**；容积热负荷一定时截面热负荷过大 → 炉膛断面积小、燃烧器区域**局部温度过高**，引起燃烧器区域**结渣和NOx排放量过大**","**3、燃烧器区域壁面热强度**：**q_B = B_cal Q_net,ar / A_B**，单位 **kW/m²**；**A_B = 2(W + D)(h₂ + 3)**，单位 **m²**（燃烧区域炉墙面积，含炉膛宽度、深度、最大燃烧器喷口间距）；**强度越大，火焰越集中，燃烧器区域温度水平越高**","**4、燃尽区容积热强度**：**q_bo = B_cal Q_net,ar / V_bo**，单位 **kW/m³**；**V_bo = W D h₁**，单位 **m³**；V_bo——燃烧区计算容积；两个参数：最上层煤粉喷口至**折焰角尖端**的垂直距离、燃尽区容积热强度（图5-23 固态排渣煤粉炉形状及温度分布：1500/1400/1300/1200/1100℃等温线；1-等温线；2-燃烧器；3-折焰角；4-屏式过热器；5-冷灰斗）","**5、炉膛壁面热强度**（炉膛辐射受热面的热流密度）：**q_f^w = B_cal Q_f^re / F**，单位 **kW/m²**；**Q_f^re —— 炉膛烟气放热量**；**F —— 水冷壁面积**；壁面平均热强度越高，单位壁面吸收热量越大，**炉内平均烟温水平越高**"]}],"questions":[{"id":"bq-ch4a-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p009（1 分）","keyPoints":["均等配风","高挥发分煤种","一、二次风喷口相间布置"],"stem":"关于均等配风，下列说法正确的是（ ）。","options":[{"k":"A","t":"一次风喷口相对集中，二次风分层布置"},{"k":"B","t":"一、二次风喷口相间布置，适用于高挥发分煤种"},{"k":"C","t":"适用于低挥发分煤种，常称为无烟煤型配风方式"},{"k":"D","t":"三次风从燃烧器下部高速送入"}],"answer":"B","why":["A ✗ 课件 p008 原文：均等配风是「一、二次风喷口**相间布置**」；「一次风喷口相对集中布置、二次风喷口分层布置」是课件 p010 **分级配风**的定义","B ✓ 课件 p008 原文：「均等配风：一、二次风喷口相间布置，即在二个一次风喷口之间均等布置一个或二个二次风喷口……」；并「均等配风适用于燃用**高挥发分煤种**，常称为：烟煤、褐煤型配风方式」，与 B 完全一致","C ✗ 课件 p008 明确均等配风适用于**高**挥发分煤种；「低挥发分煤种、常称为无烟煤和贫煤配风方式」是课件 p010 **分级配风**的表述，且 p010 称「无烟煤和贫煤配风方式」而非「无烟煤型配风方式」","D ✗ 课件 p007 只说明三次风「由单独的喷口送入炉膛燃烧」，并未出现「三次风从燃烧器下部高速送入」的说法；三次风布置不当会造成炉膛温度降低、结渣等不利影响（p011），故不是均等配风的正确描述"],"basis":"课件 p008（原文）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]},{"id":"bq-ch4a-2","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p023（1 分）","keyPoints":["飞边火焰","旋流强度过大","全扩散气流","扩散角 180°"],"stem":"旋流强度过大时，旋转射流会形成全扩散气流并压向炉墙，此时形成的火焰称为（ ）。","options":[{"k":"A","t":"封闭式火焰"},{"k":"B","t":"开放式火焰"},{"k":"C","t":"飞边火焰"},{"k":"D","t":"环形回流区火焰"}],"answer":"C","why":["A ✗ 课件 p021 原文：「（1）封闭式火焰：**旋流强度较小**时，形成封闭式火焰，在火焰根部卷吸高温烟气，形成回流区……」条件与题干「旋流强度过大」相反","B ✗ 课件 p021 原文：「（2）开放式火焰：气流**旋转强度较大**时，回流区加大，形成开放式火焰……」；开放式火焰是回流区加大、对着火和燃烧有利，并非「全扩散气流压向炉墙」","C ✓ 课件 p021 原文：「（3）飞边火焰：气流的**旋流强度过大**时，使气流成为**全扩散气流**导致**气流压向炉墙**，形成气流飞边现象，同时燃烧形成飞边火焰，此时气流**扩散角为 180°**，火焰贴壁……」与题干逐字对应","D ✗ 课件 p022 图注中只出现「（b）环形回流区的封闭火焰」，属**封闭式火焰**的一种回流区形态，且课件未把它作为独立火焰类别；题干描述的是飞边火焰"],"basis":"课件 p021（原文）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]},{"id":"bq-ch4b-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p032（1 分）","keyPoints":["燃料型NOx","NOx生成机理"],"stem":"燃料型NOx约占煤粉燃烧NOx总生成量的（ ）","options":[{"k":"A","t":"5%"},{"k":"B","t":"20%"},{"k":"C","t":"75%"},{"k":"D","t":"90%"}],"answer":"C","why":["A ✗ 课件 p030 原文：快速型NOx「生成量少，占NOx总生成量的5%」，5% 是**快速型NOx**的占比，非燃料型","B ✗ 课件 p030 原文：「煤粉燃烧中，在燃烧温度为1600℃时，热力型NOx生成量占NOx总生成量的20%左右」，20% 是**热力型NOx**的占比","C ✓ 课件 p031 原文：「燃料NOx：燃料中所含的氮化合物在燃烧过程中氧化生成的氮氧化物，**占总量的75%**」，与题干完全对应","D ✗ 课件 p029 原文：「NOx的成分：主要成分为NO，**占总量的90%**」，90% 是 **NO 在 NOx 成分中的占比**，不是燃料型NOx的占比，属混淆项"],"basis":"课件 p031（原文：「燃料NOx……占总量的75%。其中挥发分燃烧产生占70%」）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]},{"id":"bq-ch4b-2","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p049（1 分）","keyPoints":["炉膛断面热强度","q_A"],"stem":"炉膛断面热强度主要反映（ ）。","options":[{"k":"A","t":"燃料在炉膛内的停留时间"},{"k":"B","t":"燃烧器区域温度水平"},{"k":"C","t":"炉膛出口烟温"},{"k":"D","t":"炉膛壁面平均热流密度"}],"answer":"B","why":["A ✗ 「停留时间」对应的是**炉膛容积热强度 q_V**：课件 p044 原文「q_V选得过大，导致燃料和烟气在炉膛内的**停留时间**不够，不容易烧完」，且 p044 给出 q_v ∝ 1/τ","B ✓ 课件 p045 原文定义炉膛断面热强度（q_A = B_cal Q_net,ar / A）后明确写道：「**反映燃烧器区域温度水平**」，与题干直接对应","C ✗ 「炉膛出口烟温」是 **q_V 过大**带来的后果：课件 p044「炉膛容积过小……**炉膛出口烟温过高**，容易导致结渣」，非断面热强度所反映的对象","D ✗ 「炉膛壁面平均热流密度」是**第5项**热强度指标：课件 p048「5、炉膛壁面热强度（**炉膛辐射受热面的热流密度**）」，属另一指标名称的混淆项"],"basis":"课件 p045（原文：「反映燃烧器区域温度水平。炉膛容积热负荷一定，截面热负荷过大……引起燃烧器区域结渣和NOx排放量过大。」）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]}],"images":{"2":{"w":"img/boiler-ch4/p002.webp","j":"img/boiler-ch4/p002.jpg"},"3":{"w":"img/boiler-ch4/p003.webp","j":"img/boiler-ch4/p003.jpg"},"4":{"w":"img/boiler-ch4/p004.webp","j":"img/boiler-ch4/p004.jpg"},"5":{"w":"img/boiler-ch4/p005.webp","j":"img/boiler-ch4/p005.jpg"},"6":{"w":"img/boiler-ch4/p006.webp","j":"img/boiler-ch4/p006.jpg"},"7":{"w":"img/boiler-ch4/p007.webp","j":"img/boiler-ch4/p007.jpg"},"8":{"w":"img/boiler-ch4/p008.webp","j":"img/boiler-ch4/p008.jpg"},"9":{"w":"img/boiler-ch4/p009.webp","j":"img/boiler-ch4/p009.jpg"},"10":{"w":"img/boiler-ch4/p010.webp","j":"img/boiler-ch4/p010.jpg"},"11":{"w":"img/boiler-ch4/p011.webp","j":"img/boiler-ch4/p011.jpg"},"12":{"w":"img/boiler-ch4/p012.webp","j":"img/boiler-ch4/p012.jpg"},"13":{"w":"img/boiler-ch4/p013.webp","j":"img {"w":"img/boiler-ch4/p043.webp","j":"img/boiler-ch4/p043.jpg"},"44":{"w":"img/boiler-ch4/p044.webp","j":"img/boiler-ch4/p044.jpg"},"45":{"w":"img/boiler-ch4/p045.webp","j":"img/boiler-ch4/p045.jpg"},"46":{"w":"img/boiler-ch4/p046.webp","j":"img/boiler-ch4/p046.jpg"},"47":{"w":"img/boiler-ch4/p047.webp","j":"img/boiler-ch4/p047.jpg"},"48":{"w":"img/boiler-ch4/p048.webp","j":"img/boiler-ch4/p048.jpg"},"49":{"w":"img/boiler-ch4/p049.webp","j":"img/boiler-ch4/p049.jpg"}}},{"id":"boiler-ch5","name":"第五章 蒸发受热面","subtitle":"工质吸热分配 · 自然/控制循环 · 水冷壁四种结构 · 汽包 · 循环泵 · 直流锅炉蒸发系统","status":"在读","overview":"本章从工质三个加热过程与吸热比例入手，讲汽包锅炉蒸发受热面系统（自然循环与控制循环之别）、水冷壁四种结构（光管/膜式/销钉式/内螺纹管）、汽包的作用与内部装置、循环泵，最后讲直流锅炉蒸发受热面系统（启动分离器、再循环泵、储水器）与螺旋管/垂直管水冷壁对比。","mindmap":{"label":"第五章 蒸发受热面","children":[{"label":"本章小节（共 5 节）","children":[{"label":"第一节 锅炉汽水工质吸热量的分配"},{"label":"第二节 汽包锅炉蒸发受热面系统"},{"label":"第三节 汽包锅炉水冷壁"},{"label":"第四节 汽包"},{"label":"第五节 循环泵"}]},{"label":"要点 1–5","children":[{"label":"三个加热过程"},{"label":"自然循环与控制循环"},{"label":"水冷壁四种结构：光管／膜式／销钉式／内螺纹管"},{"label":"卫燃带与折焰角"},{"label":"汽包内部汽水分离装置"}]},{"label":"第六节 直流锅炉蒸发受热面系统","children":[{"label":"第六节 直流锅炉蒸发受热面系统"},{"label":"一、蒸发受热面系统","children":[{"label":"系统组成（超临界或超超临界）"},{"label":"系统流程：降压运行时 / 正常运行时"},{"label":"1、启动分离器（作用、内置式/外置式）"},{"label":"2、再循环泵"},{"label":"3、储水器（蓄水器）"}]}]},{"label":"要点 13–19","children":[{"label":"二、水冷壁（型式）","children":[{"label":"螺旋管圈型（下部螺旋管、上部垂直管）"},{"label":"分叉管、过渡联箱"},{"label":"直流锅炉水冷壁过渡段结构"},{"label":"直流锅炉受热面结构简图"},{"label":"螺旋管和垂直管水冷壁特点比较"},{"label":"（一）垂直管水冷壁特点"}]}]},{"label":"要点 20–22","children":[{"label":"（二）螺旋管水冷壁特点"},{"label":"节流圈与热偏差"},{"label":"变压运行适应性"}]}]},"points":[{"id":"p-ch5a-1","title":"工质吸热的三个加热过程","key":true,"source":"课件 p002","items":["工质在锅炉内，从给水到额定参数的过热蒸汽，经历了**三个加热过程**","1）水的加热——**省煤器**（水的预热设备）","2）水的汽化（或水的蒸发）——**蒸发受热面**（水的蒸发或汽化设备）","汽包炉蒸发设备由**汽包、下降管、水冷壁、联箱和连接管**等组成；直流锅炉蒸发设备即**水冷壁**","3）蒸汽过热——**过热器、再热器**（蒸汽过热设备）"]},{"id":"p-ch5a-2","title":"压力等级升高时吸热比例的变化","key":true,"source":"课件 p002","items":["工质压力等级升高，水和过热蒸汽的加热吸热比例**增加**、蒸发吸热比例**减少**","即：省煤器与过热器的吸热份额上升，蒸发受热面（水冷壁）的吸热份额下降"]},{"id":"p-ch5a-3","title":"自然循环蒸发受热面系统","key":true,"source":"课件 p003","items":["系统构成：**锅筒（汽包）、下降管、水冷壁、联箱、连接管**及循环泵等","流程：给水→省煤器→锅筒；锅筒→下降管→水冷壁→返回锅筒；饱和蒸汽经顶部引出（去汽轮机）并经过热器","烟气侧流程：**炉膛→过热器→省煤器→空气预热器→排烟**","水冷壁管屏按四面墙布置（前墙、后墙、左右侧墙），四角编号 1、2、3、4；管屏按编号排列（11、22、24、28…）"]},{"id":"p-ch5a-4","title":"控制循环与自然循环的 3 条区别","key":true,"source":"课件 p004","items":["1、在**下降管下端设置了锅炉水的循环泵**；","2、**循环泵提供足够能量**，循环系统可简化；","3、**循环回路设计选择更多**","控制循环蒸发受热面系统主要包括：汽包、下降管、循环泵、**供水包（水冷壁环形下联箱）**、水冷壁及其引出管等"]},{"id":"p-ch5a-5","title":"水冷壁的布置方式与作用","key":true,"source":"课件 p005","items":["**布置方式**：每面墙由多个水冷壁管屏并列构成，其中的每个管屏由**进口联箱、受热面管组、出口联箱**组成","**作用**：吸收炉内辐射热量，将工质蒸发为**汽水混合物**；降低烟气温度，保证**炉膛出口烟气温度**在合适的范围","水冷壁的结构有**光管式、膜式、销钉式和内螺纹管式**四种"]},{"id":"p-ch5a-6","title":"光管水冷壁","key":true,"source":"课件 p006","items":["管径：外径 **50~60mm** 的无缝钢管","相对节距：**1.05~1.1**","使用场合：**小容量、中低压锅炉**","亚临界：**20号钢**（特点：便宜）","超临界：铁素体钢 **T23(HCM2S)** 和 **T24(7CrMoVTiB10-10)**"]},{"id":"p-ch5a-7","title":"膜式水冷壁","key":true,"source":"课件 p007","items":["**大容量锅炉**使用","外径：**50~70mm**；相对节距：**1.2~1.5**","优点 5 条：①**密封性好→漏风少**；②**吸热好**；③**不需炉墙，只需保温材料→轻、易悬吊**；④**降低金属耗量**；⑤**蓄热少→快速启停**"]},{"id":"p-ch5a-8","title":"销钉式水冷壁与卫燃带","key":true,"source":"课件 p008、p009","items":["销钉式水冷壁针对**燃烧低挥发分煤**的炉膛","无烟煤锅炉：**减小换热，保持火焰高温→强化着火**","方法：**燃烧器布置区域，敷设保温卫燃带（销钉＋耐火材料）**","**卫燃带**：在燃用劣质难燃的煤粉锅炉或循环流化床锅炉中，用耐火材料将燃烧器周围的水冷壁覆盖起来，这部分被覆盖的面积称为卫燃带","传统卫燃带：水冷壁鳍片上焊销钉，将**刚玉或陶瓷**等耐火材料挂在销钉上；后出现**可调整面积**的卫燃带，再出现**火焰喷涂或水性涂料式**的卫燃带","敷设目的：**提高着火区域温度，帮助燃料着火，稳定燃烧**；同时**减小燃料对该区域水冷壁管的磨损**"]},{"id":"p-ch5a-9","title":"内螺纹管水冷壁","key":true,"source":"课件 p010","items":["**对象**：亚临界压力自然循环和控制循环锅炉，**超临界和超超临界压力锅炉的下辐射区**","**作用**：防止**膜态沸腾**过早发生，推迟汽水混合物传热的恶化","**位置**：炉内**高热负荷区域**","**原因**：流体流过管内凹凸表面，不断产生流体对表面的**冲击和漩涡**，流体的**横向脉动加剧**，强化壁面与流体之间热交换"]},{"id":"p-ch5a-10","title":"汽包的结构规格与 4 条作用","key":true,"source":"课件 p014、p015","items":["汽包又称**锅筒**，是自然循环和控制循环锅炉**最重的承压部件和最庞大的设备**","现代亚临界压力锅炉的汽包长达 **25～28 米**，直径 **1700～1800mm**，厚度 **130～200mm**","沿长度方向和周界方向开有许多管孔，焊上管座，分别连接**饱和蒸汽引出管、给水管、下降管、汽水混合物引入管、加药管、排污管、再循环管、事故放水管**等管道","作用 1：接受从省煤器来的给水，与下降管、水冷壁等连接组成蒸发系统，并向过热器输送饱和蒸汽，是**加热、蒸发、过热三个过程（主要受热面）的连接枢纽**","作用 2：**容积大、储水多**，有一定的**蓄热能力**，锅炉负荷变动时具有一定的**缓冲能力**","作用 3：对来自水冷壁的汽水混合物进行**彻底的分离**，汽包内装有**多级汽水分离设备**","作用 4：对锅炉水进行**化学处理**，保证了蒸汽的**洁净度**"]},{"id":"p-ch5a-11","title":"汽包内部装置","key":false,"source":"课件 p016","items":["主要部件：**均流孔板、双板式分离器、波形板式分离器、旋风涡轮板、一次分离器、二次分离器**","管路与部件：**饱和蒸汽引出管**（顶部中央）、**汽水引入管**（左上）、**排污连接管**、**疏水管**、**给水分配器**、**下降管座**（底部）","水位标记三级：**最高正常水位、正常水位、最低正常水位**，并标出**锅筒中心线**"]},{"id":"p-ch5a-12","title":"循环泵","key":true,"source":"课件 p017","items":["**作用**：提升水循环压头。当压力升高到 **19～20MPa** 时，汽水密度接近，汽水密度差形成的自然循环压头**不能保证水循环的安全工作**；循环泵保证工质在水冷壁管内的**质量流速**，保证循环的安全","**布置位置**：在**下降管系统中部**设置；采用控制循环方式的锅炉，其下降管分为**上段和下段**两部分，上段进入循环泵，循环泵出口接在下段入口；位置在**锅炉前部汽包下方**","**型式**：**湿式定子型**","泵的电机**浸没在高压冷却水中**，来冷却电机","泵体和电机之间设有**热屏**，将高温炉水接触的泵体同电机隔开"]},{"id":"p-ch5b-1","title":"直流锅炉蒸发受热面系统组成","key":true,"source":"课件 p020–p021","items":["**系统组成（超临界或超超临界）**：水冷壁、启动分离器、储水器、再循环泵。","**系统流程·降压运行时（或低负荷运行）**：水冷壁 → 分离器：（1）汽水分离出的蒸汽 → 过热器；（2）汽水分离出的水 → 储水器 → 再循环泵 → 锅炉省煤器或水冷壁。","**系统流程·正常运行时**：水冷壁 → 分离器 → 过热器。","图 5-8 直流锅炉蒸发受热面系统编号：**1—给水泵；2—省煤器；3—水冷壁；4—分离器；5—再循环泵；6—过热器**。"]},{"id":"p-ch5b-2","title":"超临界压力下无汽水两相共存","key":true,"source":"课件 p020","items":["在**超临界和超超临界压力**下，**不存在汽-水两相共存，无需进行汽水分离**。","调峰能力链条：负荷变动 —— 变压运行 —— 机组负荷降至**额定值 60%~75%**，压力低于临界压力 —— 汽水两相共存 —— **内置式分离器**（位置：**水冷壁出口和初级过热器之间**）—— 设置**再循环泵**（**最低运行负荷，25%~35%**）。"]},{"id":"p-ch5b-3","title":"启动分离器①作用","key":true,"source":"课件 p022","items":["**作用：在锅炉启动过程中，进行汽水分离。**","在锅炉启动过程中，水冷壁在**直流负荷以下（低于临界压力）**工作时，**水冷壁出口为汽水混合物**，汽水混合物进入分离器分离。","**分离后的蒸汽送入过热器**；**分离的水经再循环系统送回给水系统**。"]},{"id":"p-ch5b-4","title":"启动分离器②型式：内置式与外置式","key":true,"source":"课件 p022–p023","items":["**内置式**——锅炉在**任何负荷**下，水冷壁出口工质**都流经分离器**再进入过热器。","**外置式**——分离器**只在直流负荷以下**时才有工质流入；在锅炉正常运行时，水冷壁出口工质**不流经分离器**，经由管道**直接送至过热器**。","内置式典型结构：在锅炉**启停及正常运行**过程中，汽水分离器**均投入运行**。"]},{"id":"p-ch5b-5","title":"内置式启动分离器功能与特点","key":true,"source":"课件 p023","items":["在锅炉**启停及低负荷运行期间**，汽水分离器**湿态运行**，起汽水分离作用。","在锅炉**正常运行期间**，汽水分离器**只作为蒸汽通道**。","在**启动时**将蒸汽从水中分离出来。","**收集的水排入储水罐**。"]},{"id":"p-ch5b-6","title":"内置式启动分离器结构组成","key":false,"source":"课件 p023","items":["结构图零件编号与名称：**1 筒身；2 汽侧封头；3 水侧封头；4 管接头；5 手孔管接头；6 热电偶插座**。","筒身中部设**管接头**，其中一根以 **15°** 角斜插入筒体（图中标有 A—A 剖切线与 15° 角度标注），下部设**热电偶插座**。","A—A 剖面显示管接头沿筒体径向**放射状（六根）**布置。"]},{"id":"p-ch5b-7","title":"再循环泵与储水器","key":true,"source":"课件 p021–p022","items":["**再循环泵：将分离出的锅炉水送回水冷壁或省煤器中。**（图 5-8 中编号 **5**）","**储水器（蓄水器）：在分离器下部，与分离器相连，收集分离器分离下来的锅炉水，送回再循环系统。**","低负荷/降压运行时，分离出的水走**储水器 → 再循环泵 → 锅炉省煤器或水冷壁**的回路。"]},{"id":"p-ch5b-8","title":"水冷壁型式与现代水冷壁分类","key":false,"source":"课件 p025","items":["**传统型式**：**水平围绕管圈、回带管圈**等。","**现代水冷壁由上段和下段两部分组成**，分为：**螺旋管圈型、立式管屏型（一次上升型）**。","**一次上升**：水冷壁沿高度方向分为几部分，工质**依次流过串联的各个水冷壁管屏**。","**多次上升型（上升-上升型）**：水冷壁并列布置，但在工质流程中，工质在系统中**依次流过串联的受热面**，采用**联箱过渡连接**。"]},{"id":"p-ch5b-9","title":"螺旋管圈型水冷壁结构","key":true,"source":"课件 p026–p028","items":["**结构：下部为螺旋管，上部为垂直管。**","**上部和下部水冷壁连接方式：分叉管；过渡联箱连接。**","过渡段结构标注：**上部垂直水冷壁、下部螺旋水冷壁、螺旋水冷壁出口集箱、垂直水冷壁进口集箱**。","连接件：**联箱连接方式**与**分叉管（三通形锻件）连接方式**两种。"]},{"id":"p-ch5b-10","title":"★ 垂直管水冷壁特点","key":true,"source":"课件 p030（原文）","items":["1、**制造工艺简单，支吊简单**；","2、不同管子之间以及管屏之间**热偏差大**；","3、水冷壁进口**设置节流圈**减轻**热偏差、传热恶化和水动力不稳定**。","图示（p031）：垂直管布置水冷壁的**水冷壁出口介质温度**与**热负荷**均呈周期性拱形波动且拱幅大；管束下部设**节流圈**（四片管屏为前墙│侧墙│后墙│侧墙）。"]},{"id":"p-ch5b-11","title":"★ 螺旋管水冷壁特点","key":true,"source":"课件 p030（原文）","items":["1、**制造工艺复杂**，**支吊系统复杂，安装检修难度大**；","2、由于**每根管子都围绕四面水冷壁**，**热偏差小**，**不用在水冷壁进口设置节流圈**；","3、可根据要求**设计管子数目，合理控制流速**；","4、**比垂直管更适合变压运行**。","图示（p031）：螺旋管管屏的出口介质温度与热负荷曲线**近似水平平直**，波动很小；管束下部**无节流圈**。"]},{"id":"p-ch5b-12","title":"螺旋管与垂直管水冷壁对比结论","key":true,"source":"课件 p031（原文）","items":["**螺旋管管间吸热偏差小，适应变压运行**；","**螺旋管不需设置水冷壁进口节流圈**；","**垂直管需要采用节流圈调节进口流量，以减轻热偏差影响。**"]}],"questions":[{"id":"bq-ch5a-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p013（1 分）","keyPoints":["吸热分配","水冷壁"],"stem":"关于锅炉汽水工质吸热过程及水冷壁，下列说法正确的是","options":[{"k":"A","t":"水的加热过程主要在蒸发受热面中完成"},{"k":"B","t":"工质从给水到过热蒸汽只经历“汽化”和“过热”两个过程"},{"k":"C","t":"随着工质压力等级升高，蒸发吸热比例减少，水和过热蒸汽的加热吸热比例增加"},{"k":"D","t":"内螺纹管水冷壁主要用于小容量、中低压锅炉"}],"answer":"C","why":["A ✗ 课件 p002 明确：水的加热——**省煤器**（水的预热设备），水的加热过程在省煤器中完成，而非蒸发受热面（蒸发受热面对应“水的汽化”）","B ✗ 课件 p002 明确：工质从给水到额定参数的过热蒸汽经历了**三个加热过程**——水的加热、水的汽化（水的蒸发）、蒸汽过热，不是两个","C ✓ 课件 p002 原文：**“工质压力等级升高，水和过热蒸汽的加热吸热比例增加、蒸发吸热比例减少。”** 与选项表述一致","D ✗ 课件 p010 明确：内螺纹管水冷壁的对象是**亚临界压力自然循环和控制循环锅炉，超临界和超超临界压力锅炉的下辐射区**；课件 p006 指出**光管水冷壁**才是“使用场合：小容量，中低压锅炉”"],"basis":"课件 p002（原文）；对照 p006（光管水冷壁使用场合）、p010（内螺纹管水冷壁对象）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]},{"id":"bq-ch5b-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p032（1 分）","keyPoints":["螺旋管","垂直管","启动分离器","热偏差","节流圈","变压运行"],"stem":"关于直流锅炉水冷壁及启动分离器，下列说法正确的是","options":[{"k":"A","t":"螺旋管圈水冷壁热偏差大，必须设置进口节流圈"},{"k":"B","t":"垂直管水冷壁制造和支吊较简单，但管间、管屏间热偏差大，常设节流圈减轻热偏差"},{"k":"C","t":"启动分离器在锅炉正常运行时进行汽水分离，分离水排入储水器"},{"k":"D","t":"螺旋管水冷壁不适合变压运行，因此超临界锅炉均采用垂直管水冷壁"}],"answer":"B","why":["A ✗ 课件 p030 原文：螺旋管“由于每根管子都围绕四面水冷壁，**热偏差小**，**不用在水冷壁进口设置节流圈**”，与 A 的“热偏差大、必须设置进口节流圈”正好相反。","B ✓ 课件 p030 原文（一）垂直管水冷壁特点：“1、制造工艺**简单**，支吊**简单**；2、不同管子之间以及管屏之间**热偏差大**；3、水冷壁进口**设置节流圈**减轻热偏差、传热恶化和水动力不稳定。”三项均吻合。","C ✗ 课件 p023 原文：“在锅炉**正常运行期间**，汽水分离器**只作为蒸汽通道**”，即正常运行时**不进行汽水分离**；汽水分离发生在锅炉启停及低负荷运行期间的湿态运行工况。","D ✗ 课件 p030 原文（二）螺旋管水冷壁特点第 4 条：“**比垂直管更适合变压运行**”，且 p020/p031 也强调螺旋管“适应变压运行”，与 D 相反。"],"basis":"课件 p030（原文）、课件 p023（原文）、课件 p031（原文）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]}],"images":{"2":{"w":"img/boiler-ch5/p002.webp","j":"img/boiler-ch5/p002.jpg"},"3":{"w":"img/boiler-ch5/p003.webp","j":"img/boiler-ch5/p003.jpg"},"4":{"w":"img/boiler-ch5/p004.webp","j":"img/boiler-ch5/p004.jpg"},"5":{"w":"img/boiler-ch5/p005.webp","j":"img/boiler-ch5/p005.jpg"},"6":{"w":"img/boiler-ch5/p006.webp","j":"img/boiler-ch5/p006.jpg"},"7":{"w":"img/boiler-ch5/p007.webp","j":"img/boiler-ch5/p007.jpg"},"8":{"w":"img/boiler-ch5/p008.webp","j":"img/boiler-ch5/p008.jpg"},"9":{"w":"img/boiler-ch5/p009.webp","j":"img/boiler-ch5/p009.jpg"},"10":{"w":"img/boiler-ch5/p010.webp","j":"img/boiler-ch5/p010.jpg"},"13":{"w":"img/boiler-ch5/p013.webp","j":"img/boiler-ch5/p013.jpg"},"14":{"w":"img/boiler-ch5/p014.webp","j":"img/boiler-ch5/p014.jpg"},"15":{"w":"img/boiler-ch5/p015.webp","j":"img/boiler-ch5/p015.jpg"},"16":{"w":"img/boiler-ch5/p016.webp","j":"img/boiler-ch5/p016.jpg"},"17":{"w":"img/boiler-ch5/p017.webp","j":"img/boiler-ch5/p017.jpg"},"20":{"w":"img/boiler-ch5/p020.webp","j":"img/boiler-ch5/p020.jpg"},"21":{"w":"img/boiler-ch5/p021.webp","j":"img/boiler-ch5/p021.jpg"},"22":{"w":"img/boiler-ch5/p022.webp","j":"img/boiler-ch5/p022.jpg"},"23":{"w":"img/boiler-ch5/p023.webp","j":"img/boiler-ch5/p023.jpg"},"25":{"w":"img/boiler-ch5/p025.webp","j":"img/boiler-ch5/p025.jpg"},"26":{"w":"img/boiler-ch5/p026.webp","j":"img/boiler-ch5/p026.jpg"},"27":{"w":"img/boiler-ch5/p027.webp","j":"img/boiler-ch5/p027.jpg"},"28":{"w":"img/boiler-ch5/p028.webp","j":"img/boiler-ch5/p028.jpg"},"30":{"w":"img/boiler-ch5/p030.webp","j":"img/boiler-ch5/p030.jpg"},"31":{"w":"img/boiler-ch5/p031.webp","j":"img/boiler-ch5/p031.jpg"},"32":{"w":"img/boiler-ch5/p032.webp","j":"img/boiler-ch5/p032.jpg"}}},{"id":"boiler-ch6","name":"第六章 过热器和再热器","subtitle":"作用与热偏差 · 对流/辐射/半辐射式 · 再热器 · 汽温特性 · 汽温调节","status":"在读","overview":"本章先讲过热器与再热器的作用、设计注意问题与热偏差，再按传热方式分对流式、辐射式和半辐射式（屏式）讲结构与布置判据，随后讲再热器特点、过热器/再热器系统与汽温特性，最后讲蒸汽侧与烟气侧两类汽温调节方法。","mindmap":{"label":"第六章 过热器和再热器","children":[{"label":"第一节 过热器和再热器的作用和工作特点（p007–p010）","children":[{"label":"过热器作用：饱和蒸汽→具有一定温度的过热蒸汽（p007）"},{"label":"再热器作用：高压缸排汽加热到与过热蒸汽温度相等（或相近）后再送中压缸、低压缸做功（p007）"},{"label":"再热压力约为过热蒸汽压力的 20%；再热使热经济性提高约 4%～5%（p007）"},{"label":"汽温波动不应超过 +5～-10℃；要有可靠的调温手段；减少并联管间热偏差（p008）"},{"label":"热偏差：并列管组中每根管工质焓增不同（p009）"},{"label":"减少热偏差措施：受热面分段串联、段间多管连接、均匀管束结构尺寸/减小管束前烟气空间深度/增大联箱直径/短接与交叉连接屏式过热器管子（p009）"}]},{"label":"第二节 过热器和再热器的形式和结构（p011–p024）","children":[{"label":"过热器分类：传热方式、流动方向、受热面放置方式、管子排列方式、管圈数、结构（p011）"},{"label":"对流式：水平烟道与尾部竖井烟道，蛇形管排（p012）"},{"label":"逆流/顺流/混合流布置判据（p012、p013）"},{"label":"顺列 s1/d=2.0～3.5；错列 s1/d=3.0～3.5（p014）"},{"label":"管圈数分类：单圈管、双圈管、多圈管（p015）"},{"label":"受热面结构：水平烟道 S1/d=2～3.5、S2/d=2.5～4；靠近炉膛 S1/d≥4.5、S2/d≥3.5（p016）"},{"label":"压降限值：过热器 ≤10% 工作压力；再热器 ≤0.2MPa（p016）"},{"label":"烟气流速：靠近炉膛出口 10～12m/s 以上；烟温低区 <9m/s；不宜低于 6m/s（p016）"},{"label":"对流过热器的支吊结构：横梁—过渡梁—吊钩—管夹（图 7-1，p017）；卧式吊挂结构（图 7-2，p019）"},{"label":"高温对流过热器结构示意（图 6-3，p018）"},{"label":"再热器结构示意 1160t/h 拔伯葛自然循环锅炉（图 7-6，p020）"},{"label":"辐射式（壁式、墙式）：墙式、顶棚、前屏过热器（p021）"},{"label":"辐射式特点及应用场合：中参数仅顶棚；亚临界以上加前屏或墙式（p022）"},{"label":"前屏过热器变横向节距示意图（图 7-10，p023）"},{"label":"三、半辐射式（屏式过热器/再热器）","children":[]},{"label":"四、包覆过热器","children":[]},{"label":"五、再热器","children":[]}]},{"label":"第三节 过热器和再热器的系统","children":[]},{"label":"第四节 过热器和再热器的汽温特性","children":[]},{"label":"第六节 蒸汽温度的调节方法（蒸汽侧/烟气侧）","children":[{"label":"喷水减温装置：文丘里式、漩涡式喷嘴、多孔喷管式"},{"label":"烟气侧调节：分隔烟道挡板、烟气再循环、摆动式燃烧器"}]}]},"points":[{"id":"p-ch6a-1","title":"过热器与再热器的作用（第一节）","key":true,"source":"课件 p007","items":["**过热器的作用**：将饱和蒸汽加热成具有一定温度的过热蒸汽。","**再热器的作用**：将汽轮机高压缸的排汽加热到与过热蒸汽温度相等（或相近）的再热温度，然后再送到中压缸及低压缸中膨胀做功。","再热的目的：**提高循环热效率，控制汽轮机尾部叶片蒸汽的干度**。","**一般再热蒸汽压力为过热蒸汽压力的 20% 左右**；采用再热系统可使电站**热经济性提高约 4%～5%**。","过热器和再热器是锅炉内**工质温度最高的部件**，特别是再热蒸汽的**吸热能力较差**，如何使管子金属能长期安全工作就成为过热器和再热器设计和运行中的重要问题。"]},{"id":"p-ch6a-2","title":"设计与运行应注意的三个问题","key":true,"source":"课件 p008","items":["1）运行中应**保持汽温稳定**：汽温的波动**不应超过 +5～-10℃**。","2）过热器和再热器要有**可靠的调温手段**，使运行工况在一定范围内变化时能维持额定的汽温。","3）尽量**减少并联管间的热偏差**。"]},{"id":"p-ch6a-3","title":"热偏差概念、原因与减少措施（4 条）","key":true,"source":"课件 p009","items":["**热偏差定义**：并列管组中每根管的**工质焓增不同**的现象。","**产生热偏差的原因**：热负荷不均系数、流量不均、结构不均。","减少热偏差措施 1：**受热面分段串联**。","减少热偏差措施 2：**段间连接采取多管连接**。","减少热偏差措施 3：**受热面结构采取措施**——均匀管束结构尺寸；减小管束前烟气空间的深度；增大联箱直径；短接、交叉连接屏式过热器管子。","结构设计判据（p018 高温对流过热器）：**内圈管加长、外圈管缩短**，降低平行管束中单管间蒸汽流量差异性，减少热偏差。"]},{"id":"p-ch6a-4","title":"过热器分类（6 种分法，第二节）","key":true,"source":"课件 p011","items":["（1）根据**传热方式**分：对流、辐射和半辐射式。","（2）根据烟气与管内蒸汽的**相对流动方向**分：逆流、顺流和混合流。","（3）根据对流**受热面的放置方式**分：立式、卧式。","（4）根据**管子排列方式**分：顺列、错列。","（5）根据**管圈数**分：单管圈、双管圈、多管圈（大容量锅炉一般采用多圈管，p015）。","（6）根据**结构**分：屏式过热器、壁式过热器、对流过热器。"]},{"id":"p-ch6a-5","title":"对流式过热器的范围与三种布置方式","key":true,"source":"课件 p012、p013","items":["**对流式的范围**：高温过热器，以及末级再热器和某些低温再热器，常布置在**水平烟道和尾部竖井烟道**中；主要依靠**对流传热**从烟气中吸取热量，属对流式过热器，基本由**蛇形管排**组成。","按管内蒸汽与管外烟气总的流动方向分三种：**逆流、顺流、混合流**（对应示意 (a)(b)(c)）。","**逆流布置判据**：传热温压最大、**金属耗量最少**，但蒸汽出口温度最高处也是烟温最高处，**管子工作条件差** → 一般用于**烟温较低区域的低温过热器和低温再热器**。","**顺流布置判据**：与之相反，传热温压小、耗用金属多，但**蒸汽出口处烟气温度最低、管壁工作条件好** → 为在使用现有钢材条件下获得尽可能高的蒸汽温度，**末级高温过热器和末级高温再热器都采用顺流布置**。"]},{"id":"p-ch6a-6","title":"顺列 / 错列布置判据与 s1/d 取值","key":true,"source":"课件 p014","items":["烟气横向冲刷**顺列**布置受热面管子时的**传热系数比错列小**，但顺列管束**管外积灰易于被吹灰器清除**。","**高烟温区**的过热器或再热器易产生**粘结性积灰**，为便于蒸汽吹灰器清除积灰及支吊方便，**都以顺列方式布置**。","**尾部烟井**中低温过热器和低温再热器一般**采用错列布置以增强传热**；但有的大型电站锅炉将它们以顺列方式布置，以便于吹灰和支吊。","节距取值：**(a) 顺列 s1/d=2.0～3.5**；**(b) 错列 s1/d=3.0～3.5**。"]},{"id":"p-ch6a-7","title":"对流过热器受热面结构：S1/d、S2/d 限值","key":true,"source":"课件 p016","items":["**布置位置**：烟道内。","**水平烟道中**：S1/d=2～3.5；S2/d=2.5～4。","**靠近炉膛位置**：S1/d≥4.5；S2/d≥3.5。","（p017 支吊结构：立式对流过热器管子由**横梁→过渡梁→吊钩→管夹**支吊，图 7-1；p019 卧式对流过热器受热面管子**水平布置**，**悬吊管**将重量传递到**炉顶过渡梁**上，图 7-2。）"]},{"id":"p-ch6a-8","title":"蒸汽流速选取与压降限值","key":true,"source":"课件 p016","items":["**传热效率**：选取较高的传热效率，**保证冷却效果**。","**阻力（压降）控制**：**过热器压降不大于 10% 工作压力**；**再热器压降不大于 0.2MPa**。","**流速分配**：高温级流速快、低温级流速慢，合理分配流速和压降，**保证总压降**。"]},{"id":"p-ch6a-9","title":"烟气流速选取限值","key":true,"source":"课件 p016","items":["选取原则：综合考虑**传热、流动阻力、积灰、磨损**等因素。","**靠近炉膛出口区域**：10～12m/s 以上。","**烟温低的区域**：小于 9m/s。","**不宜低于 6m/s**。"]},{"id":"p-ch6a-10","title":"辐射式（壁式、墙式）过热器定义与三种布置方式","key":true,"source":"课件 p021、p022","items":["**定义**：布置在**炉膛壁面上、直接吸收炉膛辐射热**的过热器或再热器，称为辐射式（或墙式）过热器或再热器。","采用原因：高参数大容量锅炉**蒸发吸热占比减小**，为在炉膛内布置足够的受热面，就需要布置辐射式过热器或再热器。","**墙式过热器**：布置在炉膛壁面上；**顶棚过热器**：水平布置在炉顶；**前屏过热器**：悬挂在炉膛上部并靠近前墙。","**应用场合**：中参数锅炉机组过热器吸热量占比不太高，**不需要墙式和前屏过热器，仅采用顶棚过热器**；**亚临界以上**机组有时还采用**前屏过热器或墙式过热器**。","**改善工作条件**：炉内热负荷很高、工作条件恶劣，辐射式过热器通常**作为低温级受热面，布置在远离火焰中心、热负荷稍低的炉膛上部**。"]},{"id":"p-ch6a-11","title":"结构实例图：前屏变横向节距与再热器结构","key":false,"source":"课件 p018、p020、p023","items":["**图 7-10（p023）**：1160t/h 拔伯葛自然循环锅炉**前屏过热器变横向节距示意图**，沿炉宽节距标注为 672.5、8×690、5×575、690、690、690、5×575、8×690、707.5（两侧墙附近加大节距）。","**图 6-3（p018）**：高温对流过热器示意，1—出口联箱；2—进口联箱；管子规格 φ38×8 / φ38×7.1 等。","**图 7-6（p020）**：1160t/h 拔伯葛自然循环锅炉再热器结构示意图，1—进口集管；2、3、4—管夹；5、6—连接板；7、8、9—密封片；10—出口联箱；11—焊点。"]},{"id":"p-ch6b-1","title":"半辐射式（屏式）过热器/再热器","key":true,"source":"课件 p025、p026","items":["布置在**炉膛上部**或**炉膛出口烟窗处**的受热面称为半辐射式过热器或半辐射式再热器，通常称为**屏式过热器**和**屏式再热器**。","屏式受热面具有**较高的热负荷**；为保证管子工作安全，需采用**较高的质量流速**。","密排管的相对纵向节距一般为 **s₂/d=1.1~1.25**；**屏间距离 s₁ 很大**。","**大屏和前屏 2.5~4 米**；**后屏 0.5~1 米**。","稀疏布置的管屏起了**凝结熔渣**的作用。","烟气在屏与屏之间的空间流过，**烟气流速通常为 6m/s 左右**。","屏式过热器热负荷高，为提高受热面工作安全性，**通常用作低温级过热器**。","结构（p026 图注）：1—相邻管屏间的**定位管**；2—屏本身的**扎紧管**。"]},{"id":"p-ch6b-2","title":"屏的布置方式（a~f）","key":false,"source":"课件 p027","items":["六种布置：**（a）后屏；（b）大屏；（c）半大屏；（d）前屏；（e）能疏水的屏；（f）水平布置的屏**。","**前屏主要吸收辐射热**；其它各种布置的屏**同时吸收辐射热和对流热**。","(a) 后屏——管屏竖直布置于炉膛出口附近；(b) 大屏——深入炉膛上部、较长；(c) 半大屏——长度介于大屏与后屏之间；(d) 前屏——位于炉膛前墙附近；(e) 能疏水的屏——下部带弯折以便疏水；(f) 水平布置的屏——水平横置于炉膛出口烟道。"]},{"id":"p-ch6b-3","title":"屏式过热器特点：热偏差与超温","key":true,"source":"课件 p028","items":["三大特点：**热负荷高；热偏差大；管壁易超温**。","屏中各 U 形管所受**辐射热及所接触的烟气温度有明显差别**，且**内外圈管长不同 → 蒸汽流量差别**。","平行的各 U 形管 → **吸热偏差↑**，**管间壁温差可达 80~90℃**。","运行时**出口端金属壁温**需**监视和控制**。","屏**最外圈 U 形管**行程长、阻力大、流量小，同时高温烟气直接冲刷，且接受辐射表面积↑。","最外圈管工质**焓增比平均焓增大 40%~50%**，极易**超温烧坏**。"]},{"id":"p-ch6b-4","title":"防止外圈管子超温的改进措施","key":false,"source":"课件 p028、p029","items":["（1）**外圈管长缩短**：将外圈管和內圈管在**中间交换位置**。","（2）**加大外圈管管径**。","（3）**采用高一级材质的钢材**提高可靠性。","图 p029 四种改进措施：**（a）外圈两圈管子截短；（b）外圈一圈管子短路；（c）内外圈管子交叉；（d）外圈管子短路，内外管屏交叉**。"]},{"id":"p-ch6b-5","title":"屏式过热器保护方法（4 条）","key":false,"source":"课件 p030","items":["1）使**低温工质流过**屏式过热器，来达到**冷却金属**的目的。","2）在管内采用**较高的质量流速**。","3）控制**受热面与火焰的距离**。","4）采取措施**减轻热偏差**影响（内外交叉、外管圈短接、外管圈使用高等级材质钢材）。"]},{"id":"p-ch6b-6","title":"包覆过热器","key":false,"source":"课件 p031、p032","items":["为简化炉墙结构采用悬吊结构的敷管炉墙，在**水平烟道和尾部竖井烟道内壁**类似布置水冷壁那样布置过热器，称为**包覆壁过热器**。","尾部烟道烟温较低，受热面布置较密集，**辐射吸热量较少，吸热量一般可不计**。","特点（1）：内部蒸汽来自**焓增很小的炉顶过热器或汽包**，温度↓、管壁温度↓，有利于**减少散热损失**。","特点（2）：具有将蒸汽**输送到尾部烟道的低温过热器进口**的作用。","图 p032 超临界锅炉包覆式过热器布置：标注有**后烟井包覆侧墙上集箱**、**后烟井包覆**、**尾部竖井前墙及悬吊管**（符号编号 B₁、A₃₄、A₁、A₈c、A₂、B₂、A₄、A₃₁h、A₃₁z、B₃）。"]},{"id":"p-ch6b-7","title":"再热器：布置方式与 5 条特点","key":true,"source":"课件 p034","items":["布置：**1 纯对流**——例如国产超高压和超临界锅炉中；**2 对流-辐射联合型**——例如国产亚临界锅炉中采用**壁式、屏、对流联合**。","结构与过热器相似，但**压力低（20%~25% 过热蒸汽压力）**，**流量约为 80% 主蒸汽流量**。","1 **压力低，对流换热系数小，管壁冷却效果差，容易超温**。","2 再热器**管道直径大、管壁薄、管圈数多**。","3 **蒸汽流速低，阻力小，阻力限制在 0.2MPa 以内**。","4 **出口汽温受进口汽温及热偏差影响大**。","5 汽轮机**变负荷或启停**时，需使用**旁路**保护再热器。"]},{"id":"p-ch6b-8","title":"过热器系统与再热器系统配置","key":false,"source":"课件 p035","items":["过热器系统：**各级过热器分段串联**，以减少**热偏差**影响。","中压锅炉采用**对流型**；高压锅炉采用**后屏和对流**（即辐射-对流联合型）。","超高压以上（超高压、亚临界、超临界）：**顶棚-包墙-低温对流-屏（半辐射）-高温对流**，也为辐射-对流联合型布置。","再热器系统：超高压和超临界锅炉采用**纯对流**；亚临界压力锅炉采用**辐射-对流联合型**：**壁管式、屏、对流**。"]},{"id":"p-ch6b-9","title":"汽温特性","key":true,"source":"课件 p036","items":["**汽温特性**：过热器或再热器**出口蒸汽温度**与**锅炉负荷（或工质流量）**之间的关系。","**对流式**过热器（再热器）汽温特性：锅炉负荷**增大，汽温升高**。","**辐射式**过热器（再热器）汽温特性：锅炉负荷**增大，汽温降低**。","图：纵轴汽温 ℃、横轴负荷 %（刻度 50、100），水平虚线为**额定汽温**，三条曲线在 100% 负荷处相交；**1-辐射式过热器、2-对流式过热器、3-远离炉膛出口的对流式过热器**（曲线 3 上升更陡）。"]},{"id":"p-ch6b-10","title":"汽温调节方式总览","key":false,"source":"课件 p037","items":["调节目标：**60~100% 额定负荷内维持额定蒸汽温度**。","调节方式分**蒸汽侧调节**与**烟气侧调节**两类。","**一、蒸汽侧调节（改变蒸汽热焓）**：1、喷水减温器；2、表面式减温器；3、汽-汽热交换器。","**二、烟气侧调节**：改变锅炉内**辐射受热面和对流受热面的吸热量分配比例**。","烟气侧手段：1、调节燃烧器倾角；2、烟气再循环；3、改变流经过热器、再热器的烟气量——**烟气挡板**。"]},{"id":"p-ch6b-11","title":"喷水减温装置：三种形式与关键数值","key":true,"source":"课件 p038、p039、p040、p041","items":["**喷水减温**：将水直接喷入蒸汽中，喷入的水在**加热、蒸发和过热**过程中消耗蒸汽的热量，使汽温降低。","**减温水**：锅炉给水（**3%~5% 锅炉容量**）；位置：**过热器连接管道或者联箱**。","**一般不作为再热蒸汽的主要调温方式**：再热器一般采用**烟气侧**调节汽温，因向再热蒸汽内喷水会**降低整个机组的经济性**，喷水减温只作为**辅助调节**。","三种喷水形式：**文丘里减温器**、**漩涡式喷嘴减温器**、**多孔喷管式减温器（笛形管式减温器）**。","**漩涡式喷嘴**：减温水经喷嘴喷出雾化，在文丘里管喉部与高速（**70~120m/s**）蒸汽混合；**混合管长约 4~5m**，混合管与蒸汽管道**间隙 6~10mm**；雾化质量很好，能适应减温水总量频繁变化的场合，减温幅度较大。","**多孔喷管式**：喷孔一般在**背向汽流方向的一侧**，使喷水方向和汽流方向一致；**喷孔直径通常 5~7mm，喷水速度 3~5m/s**。","文丘里管式结构（p039）：1－减温器联箱；2－文丘里管；3－喷水孔；4－环形水室；5－减温水室；6－混合室。"]},{"id":"p-ch6b-12","title":"烟气侧调节措施：挡板、再循环、摆动燃烧器","key":true,"source":"课件 p042、p043、p045、p046","items":["**分隔烟道挡板**：将烟道分为两个通道，再热器布置在其中一个烟道中，**改变流过的烟气量**调节汽温。","烟道挡板**利用改变流过尾部烟道中的烟气量来调节汽温，现代锅炉上主要用来调节再热蒸汽温度**。","**烟气再循环**：改变锅炉内**辐射与对流受热面吸热量分配比例**，调节汽温。","**改变火焰高度**：火焰高度变化 → 辐射与对流受热面吸热量分配比例变化 → 调节汽温。","**摆动式燃烧器**：调节喷嘴的**上下倾角**，改变炉内高温火焰中心的位置。","**高负荷：向下倾斜；低负荷：向上倾斜**。","**上倾角过大 → 增加燃料的未完全燃烧损失；下倾角过大 → 冷灰斗结渣**。"]}],"questions":[{"id":"bq-ch6a-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p010（1 分）","keyPoints":["过热器作用","再热器","热偏差"],"stem":"关于过热器和再热器的作用、工作特点及热偏差，下列说法正确的是","options":[{"k":"A","t":"再热蒸汽压力一般约为过热蒸汽压力的 50% 左右，采用再热系统可使热经济性提高约 4%～5%"},{"k":"B","t":"过热器和再热器是锅炉内工质温度最高的部件，再热蒸汽吸热能力较差，因此管壁金属长期安全工作是设计和运行中的重要问题"},{"k":"C","t":"热偏差是指并列管组中每根管的工质流量完全相同的现象"},{"k":"D","t":"为减少热偏差，应尽量采用单管连接，避免受热面分段串联"}],"answer":"B","why":["A ✗ 数值错误。课件 p007 原文为「一般再热蒸汽压力为过热蒸汽压力的 **20%** 左右」，A 写成「50% 左右」；「采用再热系统可使电站热经济性提高约 4%～5%」这半句与原文一致，故 A 因压力比例错误而错。","B ✓ 与课件 p007 原文一致：「过热器和再热器是锅炉内工质温度最高的部件，特别是再热蒸汽的吸热能力较差，如何使管子金属能长期安全工作就成为过热器和再热器设计和运行中的重要问题。」","C ✗ 概念错误。课件 p009 原文为「热偏差：并列管组中每根管的**工质焓增不同**的现象」；C 说成「工质流量完全相同」，既把「焓增」偷换为「流量」，又把「不同」说成「完全相同」。","D ✗ 措施相反。课件 p009「减少热偏差的措施」原文为「1、受热面**分段串联**；2、段间连接采取**多管连接**」；D 主张「尽量采用**单管**连接，**避免**受热面分段串联」，与原文两条措施正好相反。"],"basis":"课件 p007（过热器/再热器作用、再热压力 20%、热经济性 4%～5%）；课件 p009（热偏差定义、减少热偏差的措施）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]},{"id":"bq-ch6b-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p033（1 分）","keyPoints":["逆流","顺流","屏式过热器","辐射式过热器"],"stem":"关于对流式、辐射式、半辐射式过热器/再热器，下列说法正确的是","options":[{"k":"A","t":"逆流布置传热温压最大，金属耗量最少，但蒸汽出口温度最高处也是烟温最高处，管子工作条件差，因此末级高温过热器常采用逆流布置"},{"k":"B","t":"顺流布置传热温压小，耗用金属多，但蒸汽出口处烟气温度最低，管壁工作条件好，末级高温过热器和末级高温再热器常采用顺流布置"},{"k":"C","t":"屏式过热器热负荷高、热偏差小、管壁不易超温，因此通常用作高温级过热器"},{"k":"D","t":"辐射式过热器通常布置在火焰中心附近热负荷最高的区域，以增强吸热"}],"answer":"B","why":["A ✗ 逆流布置传热温压最大、金属耗量最少属实，但蒸汽出口温度最高处也正是烟温最高处、管壁工作条件最差；末级高温过热器恰好处于烟气高温区，若再逆流则出口段更危险，工程上**末级高温过热器不采用逆流而采用顺流（或混流）布置**，A 项结论与布置原则相反。（课件 p025~p048 未直接给出逆流/顺流的比较条文，此项按传热与布置原则判定）","B ✓ 顺流布置传热温压小、耗用金属多，但**蒸汽出口处烟气温度最低，管壁工作条件好**；末级高温过热器和末级高温再热器正是要改善出口段管壁工作条件，故**常采用顺流布置**，与课件 p035「超高压以上……高温对流」的高温段布置原则一致。","C ✗ 与课件原文直接矛盾：课件 p028「屏式过热器特点：热负荷高；**热偏差大**；**管壁易超温**」；课件 p025「屏式过热器热负荷高，为了提高受热面工作的安全性，屏式过热器**通常用作低温级过热器**」。C 项「热偏差小、管壁不易超温」「用作高温级过热器」两处均错。","D ✗ 与课件原文矛盾：课件 p025 指出屏式（半辐射式）受热面因**热负荷高**，为保证安全「通常用作低温级过热器」；火焰中心附近热负荷最高的区域管壁极易超温，工程上**不会把受热面布置在该处以「增强吸热」**，D 项说法错误。"],"basis":"课件 p025（屏式过热器热负荷高、通常用作低温级过热器）、课件 p028（热负荷高；热偏差大；管壁易超温）、课件 p035（高温对流段布置）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]},{"id":"bq-ch6b-2","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p047（1 分）","keyPoints":["再热器特点","喷水减温","汽温特性","分隔烟道挡板"],"stem":"关于再热器特点及蒸汽温度调节方法，下列说法正确的是","options":[{"k":"A","t":"再热器压力低、对流换热系数小、管壁冷却效果差，容易超温；再热蒸汽阻力限制在 0.2 MPa 以内"},{"k":"B","t":"再热器一般采用喷水减温作为主要调温方式，因为喷水减温不会降低机组经济性"},{"k":"C","t":"对流式过热器汽温特性是：锅炉负荷增大，汽温降低；辐射式过热器汽温特性是：锅炉负荷增大，汽温升高"},{"k":"D","t":"分隔烟道挡板调节汽温主要用于调节过热蒸汽温度，不用于调节再热蒸汽温度"}],"answer":"A","why":["A ✓ 与课件原文完全一致：课件 p034「1 压力低，**对流换热系数小**，管壁冷却效果差，**容易超温**」「3 蒸汽流速低，阻力小，**阻力限制在 0.2MPa 以内**」。","B ✗ 与课件原文直接矛盾：课件 p039「**再热器一般采用烟气侧调节汽温**，因向再热蒸汽内喷水会**降低整个机组的经济性**，喷水减温只作为**辅助调节**」。B 项「喷水减温作为主要调温方式」「不会降低机组经济性」两处均错。","C ✗ 与课件原文正好相反：课件 p036「对流式过热器（再热器）汽温特性：锅炉负荷增大，汽温**升高**；辐射式过热器（再热器）汽温特性：锅炉负荷增大，汽温**降低**」。C 项把两条特性写反了。","D ✗ 与课件原文矛盾：课件 p043「烟道挡板是利用改变流过尾部烟道中的烟气量来调节汽温，现代锅炉上**主要用来调节再热蒸汽温度**」。D 项称「不用于调节再热蒸汽温度」错误。"],"basis":"课件 p034（再热器特点 1、3）、课件 p036（对流/辐射式汽温特性）、课件 p039（再热器采用烟气侧调节）、课件 p043（烟道挡板调节再热蒸汽温度）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]}],"images":{"7":{"w":"img/boiler-ch6/p007.webp","j":"img/boiler-ch6/p007.jpg"},"8":{"w":"img/boiler-ch6/p008.webp","j":"img/boiler-ch6/p008.jpg"},"9":{"w":"img/boiler-ch6/p009.w
