h3/p071.jpg"},"72":{"w":"img/heat-ch3/p072.webp","j":"img/heat-ch3/p072.jpg"},"73":{"w":"img/heat-ch3/p073.webp","j":"img/heat-ch3/p073.jpg"},"74":{"w":"img/heat-ch3/p074.webp","j":"img/heat-ch3/p074.jpg"},"75":{"w":"img/heat-ch3/p075.webp","j":"img/heat-ch3/p075.jpg"},"76":{"w":"img/heat-ch3/p076.webp","j":"img/heat-ch3/p076.jpg"},"77":{"w":"img/heat-ch3/p077.webp","j":"img/heat-ch3/p077.jpg"},"78":{"w":"img/heat-ch3/p078.webp","j":"img/heat-ch3/p078.jpg"},"79":{"w":"img/heat-ch3/p079.webp","j":"img/heat-ch3/p079.jpg"}}},{"id":"heat-ch4","name":"第四章 导热问题的数值解法","subtitle":"区域离散化 · 内节点与边界节点离散方程 · 迭代求解 · 稳定性","status":"在读","overview":"本章讲形状或边界复杂、分析解算不出来时改用数值解法。4-1 讲数值求解的基本思想：对比分析解与数值解的优缺点，给出五步流程（物理问题→区域离散化→建立节点代数方程→求解代数方程组→解的分析），并以二维矩形域稳态无内热源常物性问题写出控制方程与定解条件。4-2 讲内节点离散方程的建立方法：Taylor 展开法与热平衡法两条途径，含一维、二维与含内热源情形。4-3 讲边界节点离散方程的建立与代数方程求解：平直边界、外角点、内角点的能量平衡式，不规则边界的阶梯逼近，联立成 n 元代数方程组后用 Jacobi 迭代与 Gauss-Seidel 迭代求解，给出迭代收敛判据与主对角占优原则。4-4 讲非稳态导热问题的数值解法：以厚度 2δ 无限大平壁为例，用热平衡法建立内节点与边界节点离散方程，向前/向后/中心差分格式，显式格式的稳定性限制条件 Fo=aΔτ/Δx² ≤ 1/2。","mindmap":{"label":"第四章 导热问题的数值解法","children":[{"label":"4-1 数值求解的基本思想","children":[{"label":"分析解是对定解条件下的积分求解","children":[]},{"label":"数值解用离散点温度代替连续温度场","children":[]},{"label":"用大量代数方程代替微分方程","children":[]},{"label":"连续到离散、微分方程到代数方程","children":[]},{"label":"分析解能得到精确解并作比较依据","children":[]},{"label":"分析解局限大、对复杂问题无法求解","children":[]},{"label":"数值解是近似解而有很强适应性","children":[]},{"label":"原则上可求解一切导热问题","children":[]},{"label":"数值解比实验法成本低","children":[]},{"label":"物理问题取矩形域稳态无内热源","children":[]},{"label":"控制方程为二维拉普拉斯方程","children":[]},{"label":"左右边界与上下边界给出定解条件","children":[]},{"label":"区域离散化得到控制容积与节点","children":[]},{"label":"建立节点离散方程并联立成方程组","children":[]},{"label":"方程组多用迭代法并设立迭代初场","children":[]},{"label":"温度场用于算热流量与热应力","children":[]}]},{"label":"4-2 内节点离散方程建立方法","children":[{"label":"Taylor展开法推导内节点离散方程","children":[]},{"label":"连续性条件下节点温度作Taylor展开","children":[]},{"label":"两式相加得到二阶导数中心差分式","children":[]},{"label":"截断误差为Δx的最低阶数为2","children":[]},{"label":"Δx等于Δy时内节点取四邻点平均","children":[]},{"label":"热平衡法对控制体列能量守恒式","children":[]},{"label":"依据能量守恒定律与Fourier定律","children":[]},{"label":"规定热量进入为正且分东西南北","children":[]},{"label":"四个界面热流量之和等于零","children":[]},{"label":"两种方法得到相同的差分方程","children":[]},{"label":"数值解是一种近似解","children":[]},{"label":"差分式分子各项系数代数和为零","children":[]}]},{"label":"4-3 边界节点离散方程建立及代数方程求解","children":[{"label":"建立IIBC与IIIBC边界节点方程","children":[]},{"label":"假设物体内部有内热源","children":[]},{"label":"Δx与Δy取均匀网格","children":[]},{"label":"平直边界节点能量平衡式的推导","children":[]},{"label":"边界节点控制容积不足半格","children":[]},{"label":"边界热流以q_w代入平衡式","children":[]},{"label":"外角点控制容积只占四分之一格","children":[]},{"label":"外角点两条边界热流各按半格计","children":[]},{"label":"内角点控制容积占四分之三格","children":[]},{"label":"内角点两个边界方向各加一项热流","children":[]},{"label":"内角点内热源体积为四分之三格","children":[]},{"label":"不规则边界采用阶梯逼近法处理","children":[]},{"label":"区域含圆形边界时按阶梯折线替代","children":[]},{"label":"写出全部内节点与边界节点方程","children":[]},{"label":"n个未知节点温度对应n个代数方程","children":[]},{"label":"迭代法假设初场不断更新至收敛","children":[]},{"label":"Jacobi迭代只用上一轮得到的值","children":[]},{"label":"Gauss-Seidel迭代代入本轮最新值","children":[]},{"label":"Gauss-Seidel迭代占用内存更省","children":[]},{"label":"收敛判据取相邻两轮温度之差","children":[]},{"label":"分母可能为零时可加小量或取最大值","children":[]},{"label":"主对角占优时迭代法一定收敛","children":[]}]},{"label":"4-4 非稳态导热问题的数值解法","children":[{"label":"非稳态问题需对空间与时间均离散","children":[]},{"label":"以厚度2δ无限大平壁为分析对象","children":[]},{"label":"初始温度t₀突然置入t∞流体中","children":[]},{"label":"两侧表面与流体的传热系数为h","children":[]},{"label":"数学描述含非稳态项与对流边界","children":[]},{"label":"热平衡法对控制容积列能量平衡","children":[]},{"label":"左右两侧导入热量等于内能增量","children":[]},{"label":"内节点方程含时间与空间差分","children":[]},{"label":"右端边界节点控制容积取半格","children":[]},{"label":"右端边界方程含对流换热项","children":[]},{"label":"左端用对称性以t-1代换","children":[]},{"label":"差分代替微分有向前向后中心","children":[]},{"label":"显式格式求解方便但受步长限制","children":[]},{"label":"显式格式稳定条件为Fo≤1/2","children":[]},{"label":"边界节点稳定性要求更为苛刻","children":[]},{"label":"隐式格式无条件稳定但需联立求解","children":[]}]}]},"points":[{"id":"p-h4a-1","title":"第四章内容简介与学习重点","key":true,"source":"课件 p001","items":["章标题为「第四章 导热问题的数值解法」，英文为 Numerical solutions of heat conduction。","内容简介：本章介绍了数值求解物理问题的基本思想，以**二维稳态导热问题**和**一维非稳态导热**为例，介绍了数值求解导热问题的基本过程。","学习重点之一：掌握从**能量守恒定律**出发建立离散方程的方法。","学习重点之二：代数方程的迭代求解方法。"]},{"id":"p-h4a-2","title":"分析解与数值解的基本思想","key":true,"source":"课件 p002–p003","items":["分析解：对导热微分方程在定解条件下的**积分**求解。","数值解：用求解区域上空间、时间坐标系中的**离散点**的温度分布代替连续的温度场，用大量的**代数方程**代替微分方程。","基本思想可概括为两句话：连续 → 离散，微分方程 → 代数方程。","温度场写成 `t = f(x,y,z,τ)`，用网格节点上的温度值代表连续的温度场。"]},{"id":"p-h4a-3","title":"分析解与数值解的比较","key":true,"source":"课件 p004","items":["分析解(1)：能获得研究问题的**精确解**，可以为实验和数值计算提供比较依据。","分析解(2)：局限性很大，对**复杂问题**无法求解。","分析解(3)：分析解具有**普遍性**，各种情况的影响清晰可见。","数值解(1)：**近似解**。","数值解(2)：弥补了分析法的缺点，适应性强，特别对于复杂问题更显其优越性，原则上可以求解一切导热问题，如 2D、3D，复杂几何形状，复杂BC，物性不均匀等。","数值解(3)：与实验法相比成本低。"]},{"id":"p-h4a-4","title":"数值求解的物理问题设定","key":true,"source":"课件 p005","items":["基本步骤第 1 步是明确物理问题：**2D、矩形域、稳态、无内热源、常物性**的导热问题，边界条件为 **IIBC & IIIBC**。","计算区域为矩形，x 方向由 0 到 H，y 方向由 0 到 W。","左边界 x=0 与上边界 y=W 为对流边界，标注 `h,t_f`；右边界 x=H 与下边界 y=0 为绝热边界，标注 `q=0`。"]},{"id":"p-h4a-5","title":"控制方程与定解条件","key":true,"source":"课件 p006","items":["控制方程（二维稳态、无内热源）：`∂²t/∂x² + ∂²t/∂y² = 0`。","边界条件 x = 0 处：`λ(∂t/∂x) = h(t - t_f)`。","边界条件 x = H 处：`∂t/∂x = 0`。","边界条件 y = 0 处：`∂t/∂y = 0`。","边界条件 y = W 处：`-λ(∂t/∂y) = h(t - t_f)`。"]},{"id":"p-h4a-6","title":"区域离散化与控制容积","key":true,"source":"课件 p007","items":["区域离散化：将求解区域按照一定规则划分为许多小区域，这个过程称作**区域离散**。","每个小的区域称为**控制容积（CV）**，其物理量值由一个点——**节点**来表示。","网格的节点总数为 `M × N`，x 方向网格间距记为 `Δx`，y 方向网格间距记为 `Δy`。"]},{"id":"p-h4a-7","title":"建立节点物理量的代数方程","key":true,"source":"课件 p008","items":["每一个节点都与它相邻的节点存在一定的关系，通过相应的物理定律，可建立它们之间的关系式（代数方程式），此关系式又称作**节点的离散方程**。","内节点与其四个相邻节点的关系式为 `t_{m,n} = 1/4(t_{m+1,n} + t_{m-1,n} + t_{m,n+1} + t_{m,n-1})`。","该式适用范围为 `m = 2, M-1`、`n = 2, N-1`，即不包含边界节点。"]},{"id":"p-h4a-8","title":"代数方程组的求解与解的分析","key":true,"source":"课件 p009–p010","items":["把所有节点的离散方程联立起来，会组成一个**封闭的方程组**。","对代数方程组的求解可采用**直接解法**或迭代求解，更多的是采用**迭代解法**；如果采用迭代解法，还要**设立迭代初场**。","获得物体中的温度分布常常不是工程问题的最终目的，所得出的温度场可能进一步用于计算热流量或计算设备、零部件的热应力及热变形等。"]},{"id":"p-h4a-9","title":"获得离散方程的Taylor展开法","key":true,"source":"课件 p011","items":["§4-2 内节点离散方程建立方法之一：获得离散方程的 **Taylor 展开法**。","推导的起点方程为 `∂²t/∂x²|_{m,n} + ∂²t/∂y²|_{m,n} = 0`。","假定满足连续性条件，各节点温度都可作 **Taylor 展开**。","`t_{m+1,n} = t_{m,n} + (∂t/∂x)_{m,n}Δx + (∂²t/∂x²)_{m,n}(Δx²/2!) + (∂³t/∂x³)_{m,n}(Δx³/3!) + …`。","`t_{m-1,n} = t_{m,n} - (∂t/∂x)_{m,n}Δx + (∂²t/∂x²)_{m,n}(Δx²/2!) - (∂³t/∂x³)_{m,n}(Δx³/3!) + …`。"]},{"id":"p-h4a-10","title":"二阶导数的中心差分表达式","key":true,"source":"课件 p012","items":["把两个 Taylor 展开式左右两边分别相加，得到二阶导数的**中心差分表达式**。","`(∂²t/∂x²)_{m,n} = (t_{m+1,n} - 2t_{m,n} + t_{m-1,n})/Δx² + o(Δx²)`。","`(∂²t/∂y²)_{m,n} = (t_{m,n+1} - 2t_{m,n} + t_{m,n-1})/Δy² + o(Δy²)`。","**截断误差**：未明确写出的级数余项中的 Δx 的最低阶数为 2。","代入控制方程得 `(t_{m+1,n} - 2t_{m,n} + t_{m-1,n})/Δx² + (t_{m,n+1} - 2t_{m,n} + t_{m,n-1})/Δy² = 0`。","如果 `Δx = Δy`，则 `t_{m,n} = 1/4(t_{m+1,n} + t_{m-1,n} + t_{m,n+1} + t_{m,n-1})`。"]},{"id":"p-h4a-11","title":"Taylor展开法的两点注意","key":true,"source":"课件 p013","items":["注意①：数值解是一种**近似解**。","注意②：各阶导数的差分表达式分子各项系数**代数和为零**。"]},{"id":"p-h4a-12","title":"热平衡法建立内节点离散方程","key":true,"source":"课件 p014–p015","items":["热平衡法的基本思想：对每个节点所代表的**控制体**列能量守恒方程式，从而得出该点与其它节点的关系式。","依据定律：**能量守恒定律；Fourier 导热定律**。","推导中规定**热量进入为正**，控制体的东、西、南、北四个界面分别记为 e、w、s、n。","`Φ_w = λ(1·Δy)(t_{m-1,n} - t_{m,n})/Δx`，`Φ_e = λ(1·Δy)(t_{m+1,n} - t_{m,n})/Δx`。","`Φ_s = λ(1·Δx)(t_{m,n-1} - t_{m,n})/Δy`，`Φ_n = λ(1·Δx)(t_{m,n+1} - t_{m,n})/Δy`。","同一热流也可按温度降方向写成 `Φ_e = -λ(1·Δy)(t_{m,n} - t_{m+1,n})/Δx`。","节点能量守恒式为 `Φ_w + Φ_e + Φ_s + Φ_n = 0`，代入整理得 `(t_{m+1,n} - 2t_{m,n} + t_{m-1,n})/Δx² + (t_{m,n+1} - 2t_{m,n} + t_{m,n-1})/Δy² = 0`。"]},{"id":"p-h4a-13","title":"平直边界节点的能量平衡式","key":true,"source":"课件 p016–p017","items":["§4-3 的标题为「边界节点离散方程建立及代数方程求解」，本片讲到「建立 IIBC & IIIBC 边界节点离散方程」。","为不失一般性，假设物体内部有内热源，`Δx` 及 `Δy` 均匀。","平直边界上节点 (m,n) 的相邻节点为 (m-1,n)、(m,n+1)、(m,n-1)，边界热流记为 `q_w`。","平直边界节点的能量平衡式为 `λ(t_{m-1,n} - t_{m,n})/Δx·Δy + λ(t_{m,n+1} - t_{m,n})/Δy·(Δx/2) + λ(t_{m,n-1} - t_{m,n})/Δy·(Δx/2) + (ΔxΔy/2)Φ_{m,n} + Δy·q_w = 0`。"]},{"id":"p-h4b-1","title":"外角点的能量平衡式","key":true,"source":"课件 p018","items":["外角点是 §4-3 边界节点离散方程中的第 2 类节点（继平直边界节点之后）。","外角点 (m,n) 的相邻节点为 (m-1,n) 与 (m,n-1)，两条边界上的法向热流均记为 `q_w`。","外角点控制容积只占网格的 **1/4 格**，故两条相邻截面的导热面积分别取 `Δy/2`、`Δx/2`。","课件中两条边界热流项分别为 `(Δy/2)q_w` 与 `(Δx/2)q_w`，内热源项所含体积为 `(Δx/2)·(Δy/2)`。","外角点能量平衡式为 `λ(Δy/2)(t_{m-1,n} - t_{m,n})/Δx + (Δy/2)q_w + (Δx/2)q_w + λ(Δx/2)(t_{m,n-1} - t_{m,n})/Δy + Φ̇_{m,n}(Δx/2)(Δy/2) = 0`。"]},{"id":"p-h4b-2","title":"内角点的能量平衡式","key":true,"source":"课件 p019","items":["内角点是 §4-3 边界节点离散方程中的第 3 类节点。","内角点 (m,n) 的相邻节点为 (m-1,n)、(m+1,n)、(m,n+1)、(m,n-1)，两条边界上的热流均记为 `q_w`。","内角点控制容积占 **3/4 格**，故内热源项所含体积为 `(3ΔxΔy)/4`。","两个非边界方向的导热面积取整格 `λΔy`、`λΔx`，两个边界方向各取半格 `Δy/2`、`Δx/2`，并各加一项 `q_w` 热流。","内角点能量平衡式为 `λΔy(t_{m-1,n} - t_{m,n})/Δx + [λ(Δy/2)(t_{m+1,n} - t_{m,n})/Δx + (Δy/2)q_w] + λΔx(t_{m,n+1} - t_{m,n})/Δy + [λ(Δx/2)(t_{m,n-1} - t_{m,n})/Δy + (Δx/2)q_w] + Φ̇_{m,n}(3ΔxΔy/4) = 0`。"]},{"id":"p-h4b-3","title":"不规则边界的阶梯逼近法","key":true,"source":"课件 p020","items":["处理边界节点离散方程的又一内容为**二、不规则边界**。","对于不规则边界，课件给出的方法是**阶梯逼近法**。","配图为一个正方形区域内含圆形边界的二维导热问题：圆内区域温度为 `t₁`（圆心附近标注 `t₁`），圆外的斜线阴影区域边界温度为 `t₂`。","（原图仅给出区域示意图与温度标注，未在图上写出阶梯逼近的具体公式）"]},{"id":"p-h4b-4","title":"代数方程组的迭代求解形式","key":true,"source":"课件 p021","items":["内容为**三、求解代数方程迭代法**。","做法是写出所有内节点和边界节点的温度差分方程，得到 `n` 个未知节点温度、`n` 个代数方程式。","方程组的第 1 式为 `t₁ = a₁₁t₁ + a₁₂t₂ + …… + a₁ₙtₙ + b₁`。","方程组的第 2 式为 `t₂ = a₂₁t₁ + a₂₂t₂ + …… + a₂ₙtₙ + b₂`。","方程组的第 n 式为 `tₙ = aₙ₁t₁ + aₙ₂t₂ + …… + aₙₙtₙ + bₙ`。"]},{"id":"p-h4b-5","title":"Jacobi迭代与Gauss-Seidel迭代","key":true,"source":"课件 p022–p023","items":["**迭代法**的思路是：假设初场，不断更新，收敛。","① **Jacobi 迭代**：迭代代入值总为**上轮得到的值**。","② **Gauss-Seidel 迭代**：将本轮得到的值也代入，计算机内存更省。","由第 `k` 次迭代的数值 `t₁^{(k)}`、`t₂^{(k)}`……`tₙ^{(k)}` 获得节点温度 `t₁^{(k+1)} = a₁₁t₁^{(k)} + a₁₂t₂^{(k)} + …… + a₁ₙtₙ^{(k)} + b₁^{(k)}`。","在计算后面的节点温度时应按下式（采用最新值）：`t₂^{(k+1)} = a₂₁t₁^{(k+1)} + a₂₂t₂^{(k)} + …… + a₂ₙtₙ^{(k)} + b₂^{(k)}`。","依次写法为 `t₃^{(k+1)} = a₃₁t₁^{(k+1)} + a₃₂t₂^{(k+1)} + …… + a₃ₙtₙ^{(k)} + b₃^{(k)}`，末式为 `tₙ^{(k+1)} = aₙ₁t₁^{(k+1)} + aₙ₂t₂^{(k+1)} + …… + aₙₙ₋₁tₙ₋₁^{(k+1)} + aₙₙtₙ^{(k)} + bₙ^{(k)}`。"]},{"id":"p-h4b-6","title":"迭代收敛判据","key":true,"source":"课件 p024","items":["内容为**2. 迭代收敛**的 **①收敛判据**。","最简单判据为相邻两轮节点温度之差 `|t_{m,n}^{(i+1)} - t_{m,n}^{(i)}| ≤ ε`（课件旁注「是否合理？」）。","相对判据为 `|(t_{m,n}^{(i+1)} - t_{m,n}^{(i)})/t_{m,n}^{(i+1)}| ≤ ε`。","课件指出该式**分母可能为零**，为避免此问题可在分母加小量，如 `10⁻²⁰`。","也可改用温度最大值作分母：`|(t_{m,n}^{(i+1)} - t_{m,n}^{(i)})/t_max| ≤ ε`。","课件另标出迭代后的节点温度记号 `t_{m,n}^{(i+k)}`。"]},{"id":"p-h4b-7","title":"主对角占优原则","key":true,"source":"课件 p025","items":["内容为迭代收敛的 **②主对角占优原则**。","迭代公式的选择应使每一个迭代变量的系数总是**大于或等于**该式中其他变量系数绝对值的**代数和**。","满足该原则时，用迭代法求解代数方程，**一定收敛**。"]},{"id":"p-h4b-8","title":"非稳态导热数值解与物理问题","key":true,"source":"课件 p026–p027","items":["节标题为 **§ 4-4 非稳态导热问题的数值解法**。","在非稳态导热问题中，不但需要对**空间**区域进行离散，还需要对**时间**变量进行离散。","课件以一个**一维非稳态导热问题**为例，重点介绍对非稳态项的离散方法，以及不同离散方法对计算带来的影响。","物理问题为**厚度 2δ 的无限大平壁**，`λ`、`a` 为已知常数。","`τ=0` 时温度为 `t₀`，突然将其放置于两侧温度为 `t∞` 并保持不变的流体中，两侧表面与流体之间的表面传热系数为 `h`。","数学描述：`∂t/∂τ = a·∂²t/∂x²`；`τ=0`，`t = t₀`；`x=0`，`∂t/∂x = 0`；`x=δ`，`-λ∂t/∂x = h(t|_δ - t∞)`。"]},{"id":"p-h4b-9","title":"热平衡法建立内节点离散方程","key":true,"source":"课件 p028–p029","items":["内容为**二、离散方程的建立**下的 **1. 热平衡法**之 **①内节点**。","做法：对于节点 `n` 在 `i` 时刻的所代表的控制容积建立热平衡关系。","物理含义：从左右两侧导入的热量等于单位时间控制容积的**内能增量**。","左右两侧导入的热量分别为 `Φ_w = λ·1·(t_{n-1}^{(i)} - t_n^{(i)})/Δx`、`Φ_e = λ·1·(t_{n+1}^{(i)} - t_n^{(i)})/Δx`。","内能增量为 `ΔE = ρVc·Δt/Δτ = ρΔxc·(t_n^{(i+1)} - t_n^{(i)})/Δτ`。","热平衡关系为 `ΔE = Φ_w + Φ_e`。","整理得内节点的一维非稳态差分方程 `(t_n^{(i+1)} - t_n^{(i)})/Δτ = a(t_{n+1}^{(i)} - 2t_n^{(i)} + t_{n-1}^{(i)})/Δx²`。"]},{"id":"p-h4b-10","title":"右端边界节点与左端对称节点方程","key":true,"source":"课件 p030","items":["**②右端边界节点**：导入热量与对流换热热量之和等于内能增量，即 `λ·1·(t_{N-1}^{(i)} - t_N^{(i)})/Δx + h(t_f - t_N^{(i)}) = (Δxρc/2)·(t_N^{(i+1)} - t_N^{(i)})/Δτ`。","右端边界节点控制容积只取半格，故内能增量项分子系数为 `Δxρc/2`。","整理得 `t_N^{(i+1)} = t_N^{(i)}(1 - 2aΔτ/Δx² - 2hΔτ/(ρcΔx)) + 2(aΔτ/Δx²)t_{N-1}^{(i)} + (2hΔτ/(ρcΔx))t_f`。","**③左端对称**：利用对称性以 `t_{-1}` 代换，写出 `(t₁^{(i+1)} - t₁^{(i)})/Δτ = a(t_{-1}^{(i)} - 2t₁^{(i)} + t₂^{(i)})/Δx²`。","整理得 `t₁^{(i+1)} = (1 - 2aΔτ/Δx²)t₁^{(i)} + 2(aΔτ/Δx²)t₂^{(i)}`。"]},{"id":"p-h4b-11","title":"用差分代替微分的三种格式","key":true,"source":"课件 p031–p032","items":["内容为**2. 直接用差分代替微分**。","**①向前差分 (forward difference)**：`∂t/∂τ|_{n,i} ≈ (t_n^{(i+1)} - t_n^{(i)})/Δτ`。","代入得 `(t_n^{(i+1)} - t_n^{(i)})/Δτ = a(t_{n+1}^{(i)} - 2t_n^{(i)} + t_{n-1}^{(i)})/Δx²`，整理为 `t_n^{(i+1)} = (aΔτ/Δx²)(t_{n+1}^{i} + t_{n-1}^{i}) + [1 - 2aΔτ/Δx²]t_n^{i}`。","课件同页还给出扩散项取 `i+1` 时层值的写法：`(t_n^{(i+1)} - t_n^{(i)})/Δτ = a(t_{n+1}^{(i+1)} - 2t_n^{(i+1)} + t_{n-1}^{(i+1)})/Δx²`，整理为 `(1 + 2aΔτ/Δx²)t_n^{(i+1)} = (aΔτ/Δx²)(t_{n-1}^{(i+1)} + t_{n+1}^{(i+1)}) + t_n^{(i)}`。","**②向后差分 (backward difference)**：`∂t/∂τ|_{n,i} ≈ (t_n^{(i)} - t_n^{(i-1)})/Δτ`。","**③中心差分 (centre difference)**：`∂t/∂τ|_{n,i} ≈ (t_n^{(i+1)} - t_n^{(i-1)})/(2Δτ)`。"]},{"id":"p-h4b-12","title":"显式格式与隐式格式的稳定性","key":true,"source":"课件 p033–p034","items":["内容为**三、稳定性分析 (stability)**。","**1. 显式格式**：扩散项用 `i` 时层值表示得到的离散方程为显式格式。","显式格式优点：**求解方便**；缺点：对**时间步长和空间步长有限制**，否则会出现不合理的结果。","根据稳定性要求，限制条件为节点 `t_n^{(i)}` 前面的系数 `≥0`，而且**边界节点要求更为苛刻**。","显式格式的稳定性条件为 `Fo = aΔτ/Δx² ≤ 1/2`。","**2. 隐式格式**：扩散项用 `i+1` 时层值得到的离散方程又称为隐式格式，优点：**无条件稳定**；缺点：需对每一个时间层进行**联立求解**。"]}],"questions":[{"id":"q-h4a-1","kind":"单选","priority":2,"source":"课件 p004","sourceDetail":"课件 p004（依据正文自拟）","keyPoints":["分析解与数值解的对比","精确解与近似解","数值解的适应性与成本"],"stem":"关于导热问题分析解与数值解的对比，下列说法正确的是：","options":[{"k":"A","t":"分析解是近似解，数值解能获得精确解"},{"k":"B","t":"分析解具有普遍性，各种情况的影响清晰可见"},{"k":"C","t":"数值解不能求解复杂几何形状、复杂边界条件与物性不均匀的问题"},{"k":"D","t":"数值解与实验法相比成本更高"}],"answer":"B","why":["A ✗ 课件 p004 原文为「分析解 (1)能获得研究问题的精确解」，「数值解 (1)近似解」，两者说反了。","B ✓ 课件 p004 原文：「分析解具有普遍性，各种情况的影响清晰可见」。","C ✗ 课件 p004 原文：数值解「原则上可以求解一切导热问题. 2D, 3D, 复杂几何形状，复杂BC，物性不均匀等」。","D ✗ 课件 p004 原文：「与实验法相比成本低」。"],"basis":"课件 p004（原文）","answerNote":"答案由课件 p004 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h4a-2","kind":"单选","priority":2,"source":"课件 p012","sourceDetail":"课件 p012（依据正文自拟）","keyPoints":["二阶导数的中心差分表达式","Δx = Δy 时内节点差分方程","四点平均格式"],"stem":"在二维稳态、无内热源、常物性的均分网格（Δx = Δy）中，内节点的差分方程可写为：","options":[{"k":"A","t":"t_{m,n} = 1/4(t_{m+1,n} + t_{m-1,n} + t_{m,n+1} + t_{m,n-1})"},{"k":"B","t":"t_{m,n} = 1/2(t_{m+1,n} + t_{m-1,n})"},{"k":"C","t":"t_{m,n} = 1/2(t_{m,n+1} + t_{m,n-1})"},{"k":"D","t":"t_{m,n} = (t_{m+1,n} + t_{m-1,n} + t_{m,n+1} + t_{m,n-1})"}],"answer":"A","why":["A ✓ 课件 p012 原文：如果 Δx=Δy 则 `t_{m,n} = 1/4(t_{m+1,n} + t_{m-1,n} + t_{m,n+1} + t_{m,n-1})`。","B ✗ 课件 p012 只有 x 方向二阶导数的中心差分式 `(t_{m+1,n} - 2t_{m,n} + t_{m-1,n})/Δx²`，不是内节点最终方程。","C ✗ 同上，只取 y 方向一项会丢掉 `(∂²t/∂x²)` 项。","D ✗ 缺少系数 1/4，与课件 p008、p012 的式子不一致。"],"basis":"课件 p012（原文）","answerNote":"答案由课件 p012 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h4a-3","kind":"单选","priority":2,"source":"课件 p012","sourceDetail":"课件 p012（依据正文自拟）","keyPoints":["截断误差的含义","差分表达式分子系数代数和为零","数值解是近似解"],"stem":"关于二阶导数中心差分表达式的截断误差，下列说法正确的是：","options":[{"k":"A","t":"截断误差指未明确写出的级数余项中的 Δx 的最低阶数为 2"},{"k":"B","t":"中心差分表达式的截断误差为 1 阶"},{"k":"C","t":"差分表达式不再需要截断误差项，因此数值解是精确解"},{"k":"D","t":"各阶导数的差分表达式分子各项系数代数和为 1"}],"answer":"A","why":["A ✓ 课件 p012 原文：「截断误差：未明确写出的级数余项中的 Δx 的最低阶数为2」，表达式记为 o(Δx²)。","B ✗ 课件 p012 写的是 o(Δx²)、o(Δy²)，为 2 阶。","C ✗ 课件 p013 原文注意①：数值解是一种近似解。","D ✗ 课件 p013 原文注意②：各阶导数的差分表达式分子各项系数代数和为零。"],"basis":"课件 p012 / p013（原文）","answerNote":"答案由课件 p012、p013 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h4b-1","kind":"单选","priority":2,"source":"课件 p033","sourceDetail":"课件 p033（依据正文自拟）","keyPoints":["显式格式的稳定性条件","Fourier 数与步长限制","边界节点要求更苛刻"],"stem":"对于一维非稳态导热问题的显式格式，为保证计算结果合理，需要满足的稳定性条件是：","options":[{"k":"A","t":"Fo = aΔτ/Δx² ≤ 1/2"},{"k":"B","t":"Fo = aΔτ/Δx² ≥ 1/2"},{"k":"C","t":"显式格式对时间步长和空间步长没有限制"},{"k":"D","t":"节点 t_n^{(i)} 前面的系数小于零时仍然稳定"}],"answer":"A","why":["A ✓ 课件 p033 原文：`Fo = aΔτ/Δx² ≤ 1/2`。","B ✗ 与课件 p033 的不等号方向相反。","C ✗ 课件 p033 原文缺点：「对时间步长和空间步长有限制，否则会出现不合理的结果」。","D ✗ 课件 p033 原文：「限制条件为节点 t_n^{(i)} 前面的系数 ≥ 0」。"],"basis":"课件 p033（原文）","answerNote":"答案由课件 p033 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h4b-2","kind":"单选","priority":2,"source":"课件 p022","sourceDetail":"课件 p022（依据正文自拟）","keyPoints":["Jacobi 迭代的特点","Gauss-Seidel 迭代的特点","迭代法假设初场"],"stem":"关于迭代法求解节点代数方程组，下列说法正确的是：","options":[{"k":"A","t":"Jacobi 迭代在计算后面的节点温度时常采用本轮已经得到的最新值"},{"k":"B","t":"Gauss-Seidel 迭代的迭代代入值总为上轮得到的值"},{"k":"C","t":"Gauss-Seidel 迭代将本轮得到的值也代入，计算机内存更省"},{"k":"D","t":"迭代法不需要假设初场，直接收敛"}],"answer":"C","why":["A ✗ 课件 p022 原文：「Jacobi 迭代，迭代代入值总为上轮得到的值」。","B ✗ 课件 p022 原文：Gauss-Seidel 迭代「将本轮得到的值也代入」。","C ✓ 课件 p022 原文：「②Gauss-Seidel 迭代，将本轮得到的值也代入，计算机内存更省」。","D ✗ 课件 p022 原文：「假设初场，不断更新，收敛」。"],"basis":"课件 p022（原文）","answerNote":"答案由课件 p022 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h4b-3","kind":"单选","priority":2,"source":"课件 p032","sourceDetail":"课件 p032（依据正文自拟）","keyPoints":["向前差分表达式","向后差分表达式","中心差分表达式"],"stem":"用差分代替微分时，关于时间一阶导数 ∂t/∂τ|_{n,i} 的差分表达式，下列对应正确的是：","options":[{"k":"A","t":"向前差分：(t_n^{(i)} - t_n^{(i-1)})/Δτ"},{"k":"B","t":"向后差分：(t_n^{(i+1)} - t_n^{(i)})/Δτ"},{"k":"C","t":"中心差分：(t_n^{(i+1)} - t_n^{(i-1)})/(2Δτ)"},{"k":"D","t":"中心差分：(t_n^{(i+1)} - t_n^{(i)})/Δτ"}],"answer":"C","why":["A ✗ 课件 p032 中该式为**向后差分** `∂t/∂τ|_{n,i} ≈ (t_n^{(i)} - t_n^{(i-1)})/Δτ`。","B ✗ 课件 p031 中该式为**向前差分** `∂t/∂τ|_{n,i} ≈ (t_n^{(i+1)} - t_n^{(i)})/Δτ`。","C ✓ 课件 p032 原文：「③中心差分 (centre difference) `∂t/∂τ|_{n,i} ≈ (t_n^{(i+1)} - t_n^{(i-1)})/(2Δτ)`」。","D ✗ 系数应为 2Δτ，课件 p032 中心差分分母为 `2Δτ`。"],"basis":"课件 p031 / p032（原文）","answerNote":"答案由课件 p031、p032 原文推出，课件未标答案，请以老师公布为准"}],"images":{"1":{"w":"img/heat-ch4/p001.webp","j":"img/heat-ch4/p001.jpg"},"2":{"w":"img/heat-ch4/p002.webp","j":"img/heat-ch4/p002.jpg"},"3":{"w":"img/heat-ch4/p003.webp","j":"img/heat-ch4/p003.jpg"},"4":{"w":"img/heat-ch4/p004.webp","j":"img/heat-ch4/p004.jpg"},"5":{"w":"img/heat-ch4/p005.webp","j":"img/heat-ch4/p005.jpg"},"6":{"w":"img/heat-ch4/p006.webp","j":"img/heat-ch4/p006.jpg"},"7":{"w":"img/heat-ch4/p007.webp","j":"img/heat-ch4/p007.jpg"},"8":{"w":"img/heat-ch4/p008.webp","j":"img/heat-ch4/p008.jpg"},"9":{"w":"im 流换热问题的数学描写：普朗特 1904 年的边界层概念、流动边界层的厚度与流态及临界雷诺数、边界层理论四个要点、简化后的动量方程，以及热边界层与数量级分析简化后的能量方程。5-4 讲流体外掠平板层流分析解与比拟理论：速度场与摩擦系数、温度场与局部表面传热系数，化为特征数方程 Nu_x=0.332Re_x^{1/2}Pr^{1/3}，讨论 Pr=ν/a 的物理意义，介绍雷诺比拟与契尔顿—柯尔本比拟。5-5 讲相似原理与量纲分析：物理现象相似的定义、相似三定理、用相似分析法导出 Fo 与 Bi、用量纲分析法由 π 定理导出 Nu、Re、Pr 与 Nu=f(Re,Pr) 准则式，并讲幂函数式整理实验数据、特征长度与定性温度的选取与实验关联式的不确定度。","mindmap":{"label":"第五章 对流换热的理论基础","children":[{"label":"5-1 对流换热概述","children":[{"label":"对流换热是流体流经固体时的换热现象","children":[]},{"label":"与热对流不同：既有热对流也有导热","children":[]},{"label":"特点：导热与热对流同时存在","children":[]},{"label":"特点：必须直接接触、有宏观运动和有温差","children":[]},{"label":"贴壁处形成速度梯度很大的边界层","children":[]},{"label":"根本目的：计算表面传热系数 h","children":[]},{"label":"基本计算式 Φ=Ah(t_w-t_f)","children":[]},{"label":"表面传热系数 h=Φ/(A(t_w-t_f))","children":[]},{"label":"影响因素一：流动起因","children":[]},{"label":"影响因素二：流动状态","children":[]},{"label":"影响因素三：流体有无相变","children":[]},{"label":"影响因素四：换热表面的几何因素","children":[]},{"label":"影响因素五：流体的热物理性质","children":[]},{"label":"层流靠导热，湍流靠对流且 h 更大","children":[]},{"label":"相变换热 h 相变大于 h 单相","children":[]},{"label":"h=f(u, λ, ρ, c, η, l)，l 为特征长度","children":[]},{"label":"定性温度用于确定物性参数数值","children":[]},{"label":"按无相变与相变换热两大类分类","children":[]},{"label":"研究法：分析法与数值法","children":[]},{"label":"研究法：实验法与比拟法","children":[]},{"label":"局部表面传热系数 h_x 由贴壁导热求","children":[]},{"label":"温度场取决于流场","children":[]}]},{"label":"5-2 对流换热问题的数学描写","children":[{"label":"完整描述＝微分方程组加定解条件","children":[]},{"label":"方程组含质量、动量、能量守恒方程","children":[]},{"label":"假设 a：流体为连续性介质","children":[]},{"label":"假设 b：物性参数为常数","children":[]},{"label":"假设 c：流体为不可压缩性流体","children":[]},{"label":"假设 d：牛顿流体 τ=η(∂u/∂y)","children":[]},{"label":"假设 e：无内热源、忽略耗散热","children":[]},{"label":"假设 f：二维对流换热","children":[]},{"label":"取 dx、dy 微元体分析质量守恒","children":[]},{"label":"流入流出质量差等于质量变化率","children":[]},{"label":"连续性方程含密度随时间变化项","children":[]},{"label":"二维稳定常物性时 ∂u/∂x+∂v/∂y=0","children":[]},{"label":"由牛顿第二定律建立动量微分方程","children":[]},{"label":"N-S方程含惯性力、压力梯度与粘性力","children":[]},{"label":"由Q=ΔE+W导出能量守恒方程","children":[]},{"label":"四项假设简化为能量微分方程","children":[]},{"label":"完整描述含质量、动量、能量方程","children":[]},{"label":"方程组未知量为u、v、p、t","children":[]},{"label":"定解条件分几何、物理、时间三类","children":[]},{"label":"边界条件分第一类与第二类","children":[]},{"label":"恒壁温与恒热流边界条件","children":[]},{"label":"不存在第三类边界条件","children":[]}]},{"label":"5-3 边界层型对流换热问题的数学描写","children":[{"label":"普朗特1904年提出边界层概念","children":[]},{"label":"流动边界层内速度由零增至主流速度","children":[]},{"label":"边界层厚度取u/u∞=0.99处","children":[]},{"label":"层流边界层经过渡区转为湍流","children":[]},{"label":"湍流边界层贴壁处有层流底层","children":[]},{"label":"临界雷诺数一般取5×10⁵","children":[]},{"label":"主流区按理想流体欧拉方程处理","children":[]},{"label":"边界层理论有四个基本要点","children":[]},{"label":"简化得边界层动量方程","children":[]},{"label":"热边界层由波尔豪森1921年提出","children":[]},{"label":"热边界层厚度取过余温度0.99倍","children":[]},{"label":"温度分布受速度分布影响","children":[]},{"label":"用数量级分析简化能量方程","children":[]},{"label":"五个基本量的数量级：u∞、t、l、δ、δ_t","children":[]},{"label":"x 与 l 相当，y 具有 δ 的数量级","children":[]},{"label":"由连续性方程得 v 具有 δ 的数量级","children":[]},{"label":"除液态金属外热扩散率 a 具有 δ² 数量级","children":[]},{"label":"能量方程简化为 u∂t/∂x+v∂t/∂y=a∂²t/∂y²","children":[]},{"label":"层流边界层微分方程组三个方程封闭","children":[]},{"label":"未知量为 u、v、t，配定解条件可求解","children":[]},{"label":"压力梯度由 p+½ρu∞²=C 给出","children":[]},{"label":"换热方程给出 h_x 与壁面温度梯度关系","children":[]}]},{"label":"5-4 流体外掠平板传热层流分析解及比拟理论","children":[{"label":"边界层积分方程求解的四步基本思想","children":[]},{"label":"速度场：δ/x=5.0Re_x^{-1/2}","children":[]},{"label":"局部摩擦系数 c_{f,x}=0.664Re_x^{-1/2}","children":[]},{"label":"平均摩擦系数 c_f=1.328Re^{-1/2}","children":[]},{"label":"厚度比 δ/δ_t=Pr^{1/3}","children":[]},{"label":"局部表面传热系数 h_x=0.332(λ/x)Re_x^{1/2}Pr^{1/3}","children":[]},{"label":"努赛尔数 Nu_x=h_x x/λ 与特征数方程","children":[]},{"label":"平均努塞尔数 Nu_l=0.664Re_l^{1/2}Pr^{1/3}","children":[]},{"label":"定性温度 t_m=(t_∞+t_w)/2，层流 Re≤5×10⁵","children":[]},{"label":"普朗特数 Pr=ν/a 是粘性与热扩散能力之比","children":[]},{"label":"Pr=1 时 δ=δ_t，Pr>1 时 δ>δ_t","children":[]},{"label":"比拟理论：湍流动量与热量扩散相类比","children":[]},{"label":"雷诺比拟 Nu_x=(c_f/2)Re_x，前提 Pr=1","children":[]},{"label":"契尔顿—柯尔本比拟 c_f/2=St Pr^{2/3}=j","children":[]}]},{"label":"5-5 相似原理及量纲分析","children":[{"label":"问题的提出：变量太多、实验数据如何整理","children":[]},{"label":"实物试验困难或太昂贵时如何进行试验","children":[]},{"label":"相似概念来自几何学，对应边成比例","children":[]},{"label":"物理现象相似的定义","children":[]},{"label":"只有同类现象才能谈相似","children":[]},{"label":"非同类现象只能比拟或类比","children":[]},{"label":"相似现象可用统一无量纲场表示","children":[]},{"label":"模型实验要解决的三个问题","children":[]},{"label":"相似第一定理：同名特征数相等","children":[]},{"label":"相似第二定理与 π 定理","children":[]},{"label":"相似第三定理：单值性条件相似","children":[]},{"label":"相似分析法：一维非稳态导热","children":[]},{"label":"标尺 θ₀、δ、δ²/a 的无量纲化","children":[]},{"label":"Fo 数、Bi 数与特征数方程","children":[]},{"label":"引入相似倍数导出制约关系","children":[]},{"label":"动量与能量方程导出 Re 和 Pe","children":[]},{"label":"格拉晓夫数反映自然对流强弱","children":[]},{"label":"常用准数 Nu、Re、Pr、Gr","children":[]},{"label":"量纲分析法的步骤与优点","children":[]},{"label":"圆管内强制对流 n=7、r=4","children":[]},{"label":"组成三个无量纲量 π₁、π₂、π₃","children":[]},{"label":"量纲分析法设 π₁ 为幂函数形式","children":[]},{"label":"由量纲齐次得待定指数方程组","children":[]},{"label":"解出 π₁ = hd/λ = Nu","children":[]},{"label":"π₂ = ρud/η = ud/ν = Re","children":[]},{"label":"π₃ = ηc_p/λ = ν/a = Pr","children":[]},{"label":"强制对流 Nu = f(Re, Pr)","children":[]},{"label":"自然对流 Nu = f(Gr, Pr)","children":[]},{"label":"混合对流 Nu = f(Re, Gr, Pr)","children":[]},{"label":"Nu 为待定特征数，含待求 h","children":[]},{"label":"Re、Pr、Gr 为已定特征数","children":[]},{"label":"实验只需测特征数包含的物理量","children":[]},{"label":"按特征数关系整理数据得实用关联式","children":[]},{"label":"相似原理指导模化试验","children":[]},{"label":"模型须与原型同类且单值性条件相似","children":[]},{"label":"已定特征数必须与原型相等","children":[]},{"label":"幂函数式 Nu = C·Re^n Pr^m","children":[]},{"label":"双对数坐标上关联式成一条直线","children":[]},{"label":"管内湍流得 m≈0.4、n=0.8、C=0.023","children":[]},{"label":"大量实验点用最小二乘法处理","children":[]},{"label":"Re 范围宽时指数 n 取分段常数","children":[]},{"label":"模化试验用缩小模型研究实际过程","children":[]},{"label":"工程上采用近似模化方法","children":[]},{"label":"特征长度取内径、当量直径或外径","children":[]},{"label":"特征速度取来流速度或截面平均流速","children":[]},{"label":"定性温度取流体温度、平均温度或壁温","children":[]},{"label":"准则方程不得外推至参数范围以外","children":[]},{"label":"表6-1 给出六个准则数的定义与释义","children":[]},{"label":"实验关联式误差可达 ±20% 至 ±25%","children":[]},{"label":"内部与外部流动边界层发展不同","children":[]}]}]},"points":[{"id":"p-h5a-1","title":"对流换热的定义与根本目的","key":true,"source":"课件 p002–p004","items":["对流换热是指流体流经固体时流体与固体表面之间的热量传递现象。","对流换热与热对流不同，既有热对流，也有导热；不是基本传热方式。","本课程的根本目的是计算在各种不同条件下的表面传热系数 h。","介绍影响对流换热的因素，确定对流换热表面传热系数 h 的几种方法及对这些方法的介绍，理解对流换热的物理本质。","课件 p003 给出对流换热实例：散热器、CPU 散热器与风扇、翅片管、U 型管式换热器（图 3）。"]},{"id":"p-h5a-2","title":"对流换热的三个特点","key":true,"source":"课件 p004","items":["(1) 导热与热对流同时存在的复杂热传递过程。","(2) 必须有直接接触（流体与壁面）和宏观运动；也必须有温差。","(3) 由于流体的粘性和受壁面摩擦阻力的影响，紧贴壁面处会形成速度梯度很大的边界层。","配图中标出主流速度 `u_∞`、主流温度 `t_∞` 与壁面温度 `t_w`，并注明 `t_∞ < t_w`。"]},{"id":"p-h5a-3","title":"对流换热基本计算式与表面传热系数","key":true,"source":"课件 p005","items":["对流换热的基本计算式：`Φ = Ah(t_w - t_f)`。","同一式也写为 `q = h(t_w - t_f) = hΔt`。","`h` — 固体表面的平均表面换热系数；`t_w` — 固体表面的平均温度；`t_f` — 流体温度。","外部绕流（外掠平板，圆管）：`t_f` 为流体的主流温度。","内部流动（各种形状槽道内的流动）：`t_f` 为流体的平均温度。","表面传热系数（对流换热系数）定义为 `h = Φ/(A(t_w - t_f))`，当流体与壁面温度相差1度时、每单位壁面面积上、单位时间内所传递的热量。","如何确定 `h` 及增强换热的措施是对流换热的核心问题。"]},{"id":"p-h5a-4","title":"影响对流换热的五个因素与流动起因","key":true,"source":"课件 p006","items":["对流换热是流体的导热和对流两种基本传热方式共同作用的结果。","其影响因素主要有以下五个方面：(1)流动起因；(2)流动状态；(3)流体有无相变；(4)换热表面的几何因素；(5)流体的热物理性质。","(1) 流动起因：影响流体的速度分布与温度分布，分为强迫对流换热（force convection）与自然对流换热（natural convection）。","一般的说，自然对流的流速较低，因此自然对流换热通常要比强迫对流换热弱，表面传热系数要小。"]},{"id":"p-h5a-5","title":"流动状态：层流与湍流","key":true,"source":"课件 p007–p009","items":["层流（Laminar flow）：整个流场呈一簇互相平行的流线；流速缓慢，流体分层地平行于壁面方向流动，垂直于流动方向上的热量传递主要靠分子扩散（即导热）。","层流的特点：流速缓慢；沿轴线或平行于壁面作规则分层流动；热量传递主要靠导热（垂直于流动方向）。","湍流（Turbulent flow）：流体质点做复杂无规则的运动；流体内存在强烈的脉动和旋涡，使各部分流体之间迅速混合，因此湍流对流换热要比层流对流换热强烈，表面传热系数大。","湍流的特点：流体内存在强烈脉动和旋涡运动；各部分流体之间迅速混合；热量传递主要靠对流。","配图给出层流边界层、管内层流流动，以及湍流照片中的小旋涡与大旋涡。"]},{"id":"p-h5a-6","title":"流体有无相变：单相与相变换热","key":true,"source":"课件 p010","items":["单相换热：（Single phase heat transfer）。","相变换热：凝结、沸腾、升华、凝固、融化等（Phase change）：Condensation、Boiling。","课件写明 `h_相变 > h_单相`。","配图为沸腾水壶中汽泡引起的流体运动，以及冷水管外表面水蒸气凝结出水滴、附有热流密度 q″ 与 Moist air、Water droplets 标注。"]},{"id":"p-h5a-7","title":"换热表面的几何因素","key":true,"source":"课件 p011","items":["换热表面的几何形状、尺寸、相对位置以及表面粗糙度等几何因素将影响流体的流动状态，因此影响流体的速度分布和温度分布，对对流换热产生影响。","内部流动对流换热：管内或槽内；外部流动对流换热：外掠平板、圆管、管束。","(a) 强迫对流：内部流动、外部绕流；(b) 自然对流：热面朝上、热面朝下。"]},{"id":"p-h5a-8","title":"流体的热物理性质与定性温度","key":true,"source":"课件 p012","items":["1) 热导率 `λ`，W/(m·K)，`λ` 愈大，流体导热热阻愈小，对流换热愈强烈。","2) 密度 `ρ`，kg/m³。","3) 比热容 `c`，J/(kg·K)。`ρc` 反映单位体积流体热容量的大小，其数值愈大，通过对流所转移的热量愈多，对流换热愈强烈。","4) 动力粘度 `η`，Pa·s；运动粘度 `ν=η/ρ`，m²/s。流体的粘度影响速度分布与流态，因此影响对流换热。","定性温度：对于同一种不可压缩牛顿流体，其物性参数的数值主要随温度而变化。用来确定物性参数数值的温度，称为定性温度。","在分析计算对流换热时，定性温度的取法取决于对流换热的类型。"]},{"id":"p-h5a-9","title":"表面传热系数的函数式与特征长度","key":true,"source":"课件 p013","items":["影响对流换热的因素很多，表面传热系数是很多变量的函数，即 `h = f(u, λ, ρ, c, η, l)`。","式中 `l` 为特征长度（定型尺寸），代表几何因素对换热的影响。","例如：管内换热以内径为特征长度；沿平板流动以流动方向的尺寸为特征长度等。"]},{"id":"p-h5a-10","title":"对流换热的分类","key":true,"source":"课件 p014","items":["对流换热先分为无相变换热与相变换热两大类。","无相变换热分为受迫对流换热、自然对流换热、混合对流换热（受迫对流与自然对流并存）。","受迫对流换热分内部流动（圆管内受迫流动、非圆形管内受迫流动）与外部流动（外掠平板、外掠单管、外掠管束（光管；翅片管））。","自然对流换热分无限空间（竖壁；竖管、横管、水平壁（上表面和下表面））与有限空间——夹层空间。","相变换热分为凝结换热（垂直壁凝结换热、水平单圆管及管束外凝结换热、管内凝结换热）与沸腾换热（大空间沸腾换热、管内沸腾换热（横管，竖管））。"]},{"id":"p-h5a-11","title":"对流换热的四种研究方法","key":true,"source":"课件 p015","items":["1. 分析法：指对描写某一类对流换热问题的偏微分方程及定解条件进行数学求解，从而获得速度场和温度场的分析解。可得出精确解或近似解。适用简单问题。","2. 数值法：对对流换热过程的特征和主要参数变化趋势作出预测。","3. 实验法：相似原理和量纲分析理论。","4. 比拟法：利用流体动量传递和热量传递的相似机理，建立表面传热系数和阻力系数之间的相互关系。"]},{"id":"p-h5a-12","title":"由解得的温度场计算表面传热系数","key":true,"source":"课件 p016–p017","items":["当粘性流体在壁面上流动时，由于粘性的作用，流体的流速在靠近壁面处随离壁面的距离的缩短而逐渐降低；在贴壁处被滞止，处于无滑移状态（即：`y=0`，`u=0`）。","在这极薄的贴壁流体层中，热量只能以导热方式传递。","根据傅里叶定律：`q = -λ (∂t/∂y)|_{y=0}`，单位 [W/m²]。","`λ`—流体的热导率，[W/(m·℃)]；`(∂t/∂y)_{y=0}`—在坐标(x,0)处流体的温度梯度。","又由牛顿冷却公式：`q = h_x (t_w - t_∞)_x`，其中 `h_x`—壁面x处局部表面传热系数。","局部表面传热系数：`h_x = -λ/(t_w - t_∞) · (∂t/∂y)|_{y=0,x}`；`h_x` 取决于流体热导系数、温度差和贴壁流体的温度梯度。","温度梯度或温度场取决于流体热物性、流动状况（层流或紊流）、流速的大小及其分布、表面粗糙度等 ⇒ 温度场取决于流场。","速度场和温度场由对流换热微分方程组确定：质量守恒方程、动量守恒方程、能量守恒方程。"]},{"id":"p-h5a-13","title":"对流换热数学描述的六条假设","key":true,"source":"课件 p018–p019","items":["对流换热问题完整的数学描述：对流换热微分方程组 + 定解条件；微分方程组由质量守恒方程、动量守恒方程、能量守恒方程组成。","(a) 流体为连续性介质。当流体的分子平均自由行程与换热壁面的特征长度 `l` 相比非常小时，流体可近似为连续性介质。","(b) 流体的物性参数为常数，不随温度变化。","(c) 流体为不可压缩性流体。通常流速低于四分之一声速的流体可以近似为不可压缩性流体。","(d) 流体为牛顿流体，即切向应力与应变之间的关系为线性，遵循牛顿公式：`τ = η(∂u/∂y)`。","(e) 流体无内热源，忽略粘性耗散产生的耗散热。","(f) 二维对流换热。"]},{"id":"p-h5a-14","title":"连续性方程（质量守恒方程）推导","key":true,"source":"课件 p020–p022","items":["流体的连续流动遵循质量守恒规律；从流场中 (x, y) 处取出边长为 dx、dy 的微元体，并设定x方向的流体流速为u，而y方向上的流体流速为v。","建立方程的思路：单位时间流进和流出微元体的质量流量差(1) = 微元体质量随时间的变化率(2)。","单位时间内、沿x轴方向流入微元体的净质量：`M_x = ρudy`，`M_{x+dx} = M_x + (∂M_x/∂x)dx`，故 `M_x - M_{x+dx} = -(∂M_x/∂x)dx = -(∂(ρu)/∂x)dxdy`。","单位时间内、沿 y 轴方向流入微元体的净质量：`M_y = ρvdx`，`M_y - M_{y+dy} = -(∂M_y/∂y)dy = -(∂(ρv)/∂y)dxdy`。","单位时间内微元体内流体质量的变化：`(∂(ρdxdy))/∂τ = (∂ρ/∂τ)dxdy`。","连续性方程：`-(∂(ρu)/∂x)dxdy - (∂(ρv)/∂y)dxdy = (∂ρ/∂τ)dxdy`。","整理得 `∂ρ/∂τ + ∂ρu/∂x + ∂ρv/∂y = 0`；对于二维、稳定、常物性流场：`∂u/∂x + ∂v/∂y = 0`。"]},{"id":"p-h5b-1","title":"动量微分方程的建立思路与分量式","key":true,"source":"课件 p023–p024","items":["节标题为「5.2.1 运动流体能量方程的推导」，其中二、动量微分方程，动量微分方程式描述流体速度场——动量守恒。","动量微分方程是纳维埃和斯托克斯分别于1827和1845年推导的，即 `Navier-Stokes方程（N-S方程）`。","建立方程的思路取牛顿第二运动定律：作用在微元体上各外力的总和(2) = 控制体中流体动量的变化率(1)。","矢量形式为 `ρ(DV/Dτ) = F - grad p + μ∇²V`，图形上把右端各项分别对应「惯性力」「体积力」「压力梯度」「粘性力」。","x方向分量式为 `ρ(∂u/∂τ + u ∂u/∂x + v ∂u/∂y) = F_x - ∂p/∂x + η(∂²u/∂x² + ∂²u/∂y²)`。","y方向分量式为 `ρ(∂v/∂τ + u ∂v/∂x + v ∂v/∂y) = F_y - ∂p/∂y + η(∂²v/∂x² + ∂²v/∂y²)`。","说明：只有重力场作用时，强迫对流换热忽略重力项，自然对流换热中浮升力起重要作用。"]},{"id":"p-h5b-2","title":"能量守恒方程的文字表述与假设","key":true,"source":"课件 p025–p026","items":["三、能量守恒方程：描述流体温度场——能量守恒。","文字表述为 [导入与导出的净热量] + [热对流传递的净热量] + [内热源发热量] = [总能量的增量] + [对外作膨胀功]。","总式为 `Q = ΔE + W`，其中 `Q = Q_导热 + Q_对流 + Q_内热源`。","`ΔE = ΔU_热力学能 + ΔU_K（动能）`；`W` 为体积力(重力)作的功、表面力作的功。","假设(1)：流体的热物性均为常量，流体不做功，故 `W=0`；假设(2)：流体不可压缩。","假设(3)：一般工程问题流速低，故 `ΔU_K=0`；假设(4)：无化学反应等内热源，故 `Q_内热源=0`。","由此 `Q = ΔE + W` 简化为 `Q_导热 + Q_对流 = ΔU_热力学能`。"]},{"id":"p-h5b-3","title":"净热量表达式与能量微分方程","key":true,"source":"课件 p027–p028","items":["导热净热量：`Q_导热 = λ (∂²t/∂x²) dxdy + λ (∂²t/∂y²) dxdy`。","单位时间内、沿 x 方向热对流传递到微元体的净热量：`Q_x'' - Q_{x+dx}'' = -(∂Q_x''/∂x) dx = -ρc_p (∂(ut)/∂x) dxdy`。","单位时间内、沿 y 方向热对流传递到微元体的净热量：`Q_y'' - Q_{y+dy}'' = -(∂Q_y''/∂y) dy = -ρc_p (∂(vt)/∂y) dydx`。","`Q_对流 = -ρc_p (∂(ut)/∂x) dxdy - ρc_p (∂(vt)/∂y) dxdy = -ρc_p[u ∂t/∂x + v ∂t/∂y + t ∂u/∂x + t ∂v/∂y]dxdy`。","利用连续性使后两项为零，得 `Q_对流 = -ρc_p[u ∂t/∂x + v ∂t/∂y]dxdy`；又有 `ΔU = ρc_p dxdy (∂t/∂τ)`。","由 `Q_导热 + Q_对流 = ΔU_热力学能` 得能量守恒方程 `ρc_p(u ∂t/∂x + v ∂t/∂y + ∂t/∂τ) = λ[∂²t/∂x² + ∂²t/∂y²]`。","图上把方程左端标注为「对流项 + 非稳态项」，右端标注为「热传导项」。"]},{"id":"p-h5b-4","title":"对流换热的完整数学描述方程组","key":true,"source":"课件 p029","items":["节标题「5.2.2 对流换热的完整数学描述」，前提是对于不可压缩、常物性、无内热源的二维对流换热。","质量守恒方程：`∂u/∂x + ∂v/∂y = 0`。","动量守恒方程：`ρ(∂u/∂τ + u ∂u/∂x + v ∂u/∂y) = F_x - ∂p/∂x + η(∂²u/∂x² + ∂²u/∂y²)`。","动量守恒方程：`ρ(∂v/∂τ + u ∂v/∂x + v ∂v/∂y) = F_y - ∂p/∂y + η(∂²v/∂x² + ∂²v/∂y²)`。","能量守恒方程：`u ∂t/∂x + v ∂t/∂y + ∂t/∂τ = λ/(ρc_p)[∂²t/∂x² + ∂²t/∂y²]`。","方程组含有未知量：`u`、`v`、`p`、`t`。","适用条件：自然对流、强迫对流换热；层流、湍流换热。"]},{"id":"p-h5b-5","title":"对流换热的定解条件三类","key":true,"source":"课件 p030","items":["1. 几何条件：说明对流换热过程中换热表面的几何形状：平板、圆管；尺寸：长度、直径等；壁面与流体的相对位置：竖直圆管、水平圆管；壁面粗糙度。","2. 物理条件：说明对流换热过程的物理特征，如物性参数 `λ`、`ρ`、`c` 和 `η` 的数值，是否随温度和压力变化；有无内热源、大小和分布。","3. 时间条件：说明对流换热过程进行的时间上的特点。","稳态换热：无初始条件；非稳态换热：初始时刻的速度场和温度场。"]},{"id":"p-h5b-6","title":"对流换热的边界条件","key":true,"source":"课件 p031","items":["4. 边界条件：说明对流换热边界上的状态（边界上速度分布，温度分布及与周围环境之间的相互作用）。","第一类边界条件：`t_w = f(x,y,z,τ)`；恒壁温边界条件（Constant temp B.C）写为 `t_w = const`。","第二类边界条件：`q_w = -λ(∂t/∂n)_w`；恒热流边界条件（Constant heat rate B.C）写为 `q_w = const`。","一般而言不存在第三类边界条件；图上给出第二类边界条件的写法 `-λ(∂t/∂n)|_w = f(τ) = q_w`，并注明这里 `n` 是所论壁面的外法线。","该页右下角提示「对比导热的边界条件」。"]},{"id":"p-h5b-7","title":"边界层概念的提出","key":true,"source":"课件 p032","items":["节标题「5.3 边界层型对流换热问题的数学描写」。","对流换热微分方程组和定解条件构成了对一个具体对流换热过程的完整的数学描述。","但由于这些微分方程非常复杂，尤其是动量微分方程的高度非线性，使方程组的分析求解非常困难。","1904年，德国科学家普朗特（L. Prandtl）在大量实验观察的基础上提出了著名的边界层概念，使微分方程组得以简化，使其分析求解成为可能。"]},{"id":"p-h5b-8","title":"流动边界层的定义与两个区域","key":true,"source":"课件 p033–p035","items":["节标题「5.3.1 流动边界层及边界层动量方程」；1. 流动边界层（速度边界层）：垂直于壁面的方向上流体流速发生显著变化的流体薄层定义为流动边界层。","流体流过固体壁面时，由于壁面层流体分子的不滑移特性，在流体粘性力的作用下，近壁流体流速在垂直于壁面的方向上会从壁面处的零速度逐步变化到来流速度。","从 `y=0`、`u=0` 开始，`u` 随着 y 方向离壁面距离的增加而迅速增大；经过厚度为 `δ` 的薄层，`u` 接近主流速度 `u_∞`。","`y=δ` 薄层——流动边界层或速度边界层；`δ`——边界层厚度；定义为 `u/u∞=0.99` 处离壁的距离为边界层厚度。","边界层内平均速度梯度很大，`y=0` 处的速度梯度最大。","边界层区：速度梯度大，粘性力不能忽略；粘性力与惯性力处同一数量级；动量交换的主要区域，用动量微分方程描述。","主流区：速度梯度趋于零，粘性力忽略不计；流体可近似为理想流体；用理想流体的欧拉方程描述。","图「空气沿平板流动时边界层厚度变化的情况」给出边界层厚度（cm）随 x（cm）的增大而逐渐增大，且来流速度越大边界层越薄。"]},{"id":"p-h5b-9","title":"流动边界层内的流态与临界雷诺数","key":true,"source":"课件 p036–p037","items":["2. 流动边界层内的流态：平板起始段 `δ` 很小，随着 x 的增大，`δ` 逐渐增大。","在到达某一距离 Xc 以前，边界层保持层流状态，称为层流边界层；Xc 以后，朝着湍流过渡，最终为旺盛湍流，称为湍流边界层。","在湍流边界层紧靠壁面的地方，仍有一极薄层内保持层流状态，称为湍流边界层的粘性底层（层流底层）。","临界距离 Xc：边界层从层流开始向湍流过渡的距离；其大小取决于流体的物性、固体壁面的粗糙度等几何因素以及来流的稳定度，由实验确定的临界雷诺数 `Re_c` 给定。","`Re_c = u_∞ x_c/ν`；一般情况下，取 `Re_c = 5×10⁵`。","流场沿壁面依次划分为层流边界层、过渡区、湍流边界层，湍流边界层内标出「湍流核心」与贴壁的层流底层。"]},{"id":"p-h5b-10","title":"边界层理论的四个基本要点","key":true,"source":"课件 p038","items":["a. 当粘性流体沿固体表面流动时，流场划为主流区（势流区）和边界层区。在边界层区内，速度在垂直于壁面方向剧烈变化。而主流区速度梯度几乎为零。","b. 主流区的流动视为理想流体的流动，用描述理想流体的方程求解。边界层区应考虑粘性的影响，用粘性流体的边界层微分方程求解。","c. 边界层的流动状态分为层流和湍流。湍流边界层紧贴壁面处仍有一个极薄的层流底层。","d. 边界层厚度 `δ` 与壁面尺寸 l 相比很小，远不只小一个数量级。因此，对于流体流过平板，满足边界层假设的条件就是雷诺数足够大。"]},{"id":"p-h5b-11","title":"边界层动量方程及其四点简化","key":true,"source":"课件 p039","items":["3. 流动边界层内的动量方程：由两个方向的 N-S 方程简化得到 `u ∂u/∂x + v ∂u/∂y = -(1/ρ)(dp/dx) + ν (∂²u/∂y²)`。","1. 动量方程去掉了 v 方向。","2. 忽略 y 方向上的压力变化 `∂p/∂y=0`，所以 `∂p/∂x` 用 `dp/dx` 代替。","3. 略去 u 对 x 的高阶偏导。","4. 略去了体积力项。"]},{"id":"p-h5b-12","title":"热边界层及厚度定义","key":true,"source":"课件 p042","items":["节标题「5.3.2 热边界层及热边界层动量方程」；1. 热边界层及厚度定义：1921年，波尔豪森提出。","热边界层厚度 `δ_t` 的定义式为 `t - t_w = 0.99(t_∞ - t_w)`。","温度场分区中，热边界层区存在温度梯度，是发生热量传递的主要区，温度场由能量微分方程描述。","主流区：温度梯度不计，近似等温流动。"]},{"id":"p-h5b-13","title":"热边界层与流动边界层的关系","key":true,"source":"课件 p043","items":["流动中流体温度分布受速度分布影响。","图给出局部表面传热系数的变化趋势。","沿壁面依次为层流边界层、过渡区、湍流边界层与层流底层，图上用「导热」「对流」标注边界层内外的换热方式。","在表面的速度图下方给出表面传热系数 `h_x` 随 x 变化的曲线，并用「导热热阻增大」「扰动」「热阻增大」解释曲线的变化。"]},{"id":"p-h5b-14","title":"热边界层能量方程与数量级分析","key":true,"source":"课件 p044","items":["2. 热边界层的能量方程，能量守恒方程为 `u ∂t/∂x + v ∂t/∂y + ∂t/∂τ = λ/(ρc_p)[∂²t/∂x² + ∂²t/∂y²]`。","采用数量级分析方法对能量方程进行简化。","比较方程中各量或各项的量级的相对大小。","保留量级较大的量或项；舍去那些量级小的项，实现方程式的合理简化。"]},{"id":"p-h5c-1","title":"热边界层与五个基本量数量级","key":true,"source":"课件 p045","items":["本页标题为 `5.3.2 热边界层及热边界层动量方程`，先做 a. 定义 5 个基本量的数量级。","主流速度 `u_∞ ~ 0(1)`；温度 `t ~ 0(1)`；壁面特征长度 `l ~ 0(1)`；边界层厚度 `δ ~ 0(δ)`、`δ_t ~ 0(δ)`。","其他量的数量级导出：`x` 与 `l` 相当，即 `x ~ l ~ 0(1)`；因为 `0 ≤ y ≤ δ`，所以 `y ~ 0(δ)`。","`u` 沿边界层厚度由 0 到 `u_∞`，所以 `u ~ u_∞ ~ 0(1)`。","由连续性方程 `-∂v/∂y = ∂u/∂x ~ u_∞/l ~ 0(1)`，因此 `v ~ 0(δ)`。","注意：`0(1)`、`0(δ)` 表示数量级为 1 和 δ，且 `1 >> δ`；图中符号 `~` 表示“相当于”。","图中画出边界层发展示意：主流区 `u_∞, t_∞`，边界层内速度分布 u、热边界层厚度 `δ_t`、壁面热流 `q_w` 与壁温 `t_w`。"]},{"id":"p-h5c-2","title":"能量方程的数量级简化","key":true,"source":"课件 p046","items":["对**二维稳态、常物性**情况下的能量方程作简化，原式为 `u ∂t/∂x + v ∂t/∂y + ∂t/∂τ = (λ/(ρc_p))[∂²t/∂x² + ∂²t/∂y²]`，其中非稳态项 `∂t/∂τ` 被划去。","各项的数量级：`u ∂t/∂x` 为 `1 · 1/1`，`v ∂t/∂y` 为 `δ · 1/δ`，扩散项括号内为 `(1/1², 1/δ²)`。","对于除了液态金属以外的流体，**热扩散率 a 具有 δ² 的数量级**，所以 `∂²t/∂x²` 一项可略去。","简化后的边界层能量方程为 `u ∂t/∂x + v ∂t/∂y = a ∂²t/∂y²`。"]},{"id":"p-h5c-3","title":"边界层对流换热微分方程组","key":true,"source":"课件 p047","items":["本页标题为 `5.3.3 二维稳态边界层型对流换热的数学描述`：对于二维、稳态、无内热源的边界层类型问题，流场与温度场的控制方程为**层流边界层对流换热微分方程组**。","连续性方程：`∂u/∂x + ∂v/∂y = 0`。","动量方程：`u ∂u/∂x + v ∂u/∂y = -(1/ρ) dp/dx + ν ∂²u/∂y²`。","能量方程：`u ∂t/∂x + v ∂t/∂y = a ∂²t/∂y²`。","方程组为 **3 个方程、3 个未知量** `u`、`v`、`t`，方程封闭；如果配上相应的定解条件，则可以求解。","动量方程中的压力梯度由主流关系给出：`p + ½ρu_∞² = C`，即 `-dp/dx = ρu_∞ du_∞/dx`。","**换热方程**：`h_x = -(λ/((t_w - t_∞)_x)) ∂t/∂y|_{y=0,x}`。"]},{"id":"p-h5c-4","title":"边界层积分方程求解的基本思想","key":true,"source":"课件 p048","items":["本页进入 `5.4 流体外掠平板传热层流分析解及比拟理论`，图上给出平板上边界层的三个区段：层流边界层、过渡区、湍流边界层，前缘由 0 到 `x_c` 为层流边界层。","第 (1) 步：建立边界层积分方程，针对包括固体边界及边界层外边界在内的有限大小的控制容积。","第 (2) 步：对边界层内的速度和温度分布作出假设，常用的函数形式为多项式。","第 (3) 步：利用边界条件确定速度和温度分布中的常数，然后将速度和温度分布带入积分方程，解出 `δ` 和 `δ_t` 的计算式。","第 (4) 步：根据求得的速度分布和温度分布计算固体边界上的 `∂u/∂y|_{y=0}` 及 `∂t/∂y|_{y=0}`。"]},{"id":"p-h5c-5","title":"层流分析解的速度场结果","key":true,"source":"课件 p049","items":["`5.4.1 流体外掠等温平板传热的层流分析解`的**速度场求解结果**之 1，流动边界层厚度（离开前缘 x 处）：`δ/x = 5.0 Re_x^{-1/2}`，其中 `Re_x = u_∞ x/ν`。","之 2，摩擦系数中的**局部摩擦系数**：`c_{f,x} = 0.664 Re_x^{-1/2}`。","之 2，摩擦系数中的**平均摩擦系数**：`c_f = (1/l)∫_0^l c_{f,x} dx = 1.328 Re^{-1/2}`。","图中画出层流边界层内流动边界层厚度 δ 与热边界层厚度 `δ_t` 随 x 的分布，以及速度分布 u 与温度分布 t 的对照。"]},{"id":"p-h5c-6","title":"温度场结果与边界层厚度比","key":true,"source":"课件 p050","items":["**温度场求解结果**之 1，热边界层厚度与流动边界层厚度之比：`δ/δ_t = (ν/a)^{1/3} = Pr^{1/3}`。","之 2，**局部表面传热系数**：`h_x = 0.332 (λ/x) Re_x^{1/2} Pr^{1/3}`。","局部表面传热系数也可展开写成 `h_x = 0.332 (λ/x) (u_∞ x/ν)^{1/2} (ν/a)^{1/3}`。","图上给出层流边界层内 u、t 的分布以及主流参数 `u_∞`、`t_∞`、壁温 `t_w`、边界层厚度 `δ`、`δ_t` 的相对位置。"]},{"id":"p-h5c-7","title":"边界层厚度计算例题要点","key":true,"source":"课件 p051–p052","items":["例题：压力为大气压的 20℃ 的空气，纵向流过一块长 320mm、温度为 30℃ 的平板，流速为 10m/s，求离板前缘 50mm、100mm、150mm、200mm、250mm、300mm、350mm、400mm 处的流动边界层和热边界层的厚度。","空气的物性参数按板表面温度和空气温度的平均值 30℃ 确定，30℃ 时空气的 `ν = 16×10⁻⁶ m²/s`，`Pr = 0.701`。","对长为 400mm 的平板：`Re = ul/ν = 10×0.32/(16×10⁻⁶) = 2×10⁵`，这一 Re 数位于层流范围内。","流动边界层的厚度用 `δ/x = 5.0Re_x^{-1/2}` 计算：`δ = 5.0√(νx/u_∞) = 5.0√(16×10⁻⁶ m²/s / (10 m/s)) √x = 6.36×10⁻³ m^{1/2}√x = 0.0636 cm^{1/2}√x`。","热边界层的厚度 `δ_t ≅ δ/∛Pr ≅ δ/∛0.701 ≅ 1.1δ`。","δ 及 δ_t 计算结果示于图中：纵坐标为边界层厚度 δ、δ_t/mm（0~5.0），横坐标为距平板前缘的距离 x/cm（0~40），`δ_t` 曲线始终略高于 `δ`。"]},{"id":"p-h5c-8","title":"特征数、特征长度与特征数方程","key":true,"source":"课件 p053–p054","items":["`5.4.2 特征数方程`中的**无量纲数**基本思想：当所研究的问题非常复杂、涉及到的参数很多时，为了减少问题所涉及的参数，人们将这些参数组合起来，使之能表征一类物理现象或物理过程的主要特征，并且没有量纲。","这样的无量纲数又被称为**特征数**，或者准则数，比如毕渥数又称毕渥准则；特征数中所涉及到的几何尺度称为**特征长度**（characteristic length），一般用符号 `l` 表示。","对于一个特征数，应该掌握其**定义式 + 物理意义**，以及定义式中各个参数的意义。","毕渥数中，`δ` 为特征长度，但注意特征长度 δ 是平板厚度的一半！","由局部表面传热系数 `h_x = 0.332 (λ/x) Re_x^{1/2} Pr^{1/3}` 得 `h_x x/λ = 0.332 Re_x^{1/2} Pr^{1/3}`，这是一个无量纲数。","**努赛尔数** `Nu_x = h_x x/λ`，下标 x 表示以 x 作为特征长度。","流体外掠等温平板层流换热的分析解变为 `Nu_x = 0.332 Re_x^{1/2} Pr^{1/3}`。","以特征数表示的对流换热计算关系称为**特征数方程**，又称关联式或者准则方程。"]},{"id":"p-h5c-9","title":"平均表面传热系数与定性温度","key":true,"source":"课件 p055","items":["**平均表面传热系数** `h`：`h = (1/l)∫_0^l h_x dx = (1/l)∫_0^l C′ x^{-1/2} dx = (1/l)·2C′ x^{1/2}|_0^l = 2C′ l^{-1/2} = 2h_{x=l}`，图中并注明 `Re_x = u_∞ x/ν`。","**平均努塞尔数**：`Nu_l = hl/λ = 2h_l l/λ = 2Nu_{x=l}`，由此得 `Nu_l = 0.664 Re_l^{1/2} Pr^{1/3}`。","具体计算式流体的物性与温度相关，用来确定特征数中流体的物性的温度称为**定性温度**。","对于边界层类型的对流换热，定性温度为 `t_m = (t_∞ + t_w)/2`，并满足 `Re ≤ 5×10⁵`。"]},{"id":"p-h5c-10","title":"普朗特数的物理意义","key":true,"source":"课件 p056–p057","items":["`5.4.3 普朗特数的物理意义`：对比动量方程 `u ∂u/∂x + v ∂u/∂y = -(1/ρ) dp/dx + ν ∂²u/∂y²`（配合 `-dp/dx = ρu_∞ du_∞/dx`）与能量方程 `u ∂t/∂x + v ∂t/∂y = a ∂²t/∂y²` 发现，形式完全相同。","当 `ν = a` 时，`u` 与 `t` 的分布完全相同，即 `δ_t = δ`；因此，`ν/a` 可以表示流动边界层与热边界层的相对厚度。","`ν = η/ρ` 为**运动粘度**，表示粘性扩散的能力；`a = λ/(ρc_p)` 为**热扩散率**，表示热扩散的能力。","`Pr = ν/a = ηc_p/λ = 粘性扩散的能力/热扩散的能力`。","`Pr = 1` 时 `ν = a`、粘性扩散=热扩散、`δ = δ_t`；`Pr > 1` 时 `ν > a`、粘性扩散>热扩散、`δ > δ_t`；`Pr < 1` 时 `ν < a`、粘性扩散<热扩散、`δ < δ_t`。","常见流体 `Pr = 0.6~4000`；空气 `Pr = 0.6~1`；液态金属较小，`Pr = 0.01~0.001` 数量级。"]},{"id":"p-h5c-11","title":"比拟理论的基本思想","key":true,"source":"课件 p059–p060","items":["`5.4.4 比拟理论的基本思想`：**比拟理论**指利用两个不同物理现象之间在控制方程方面的应用的类似性，通过测定其中某一种现象的规律而获得另一种现象基本关系的方法；这里以流体外掠等温平板的湍流换热为例。","湍流边界层动量方程 `u ∂u/∂x + v ∂u/∂y = (ν + ν_t) ∂²u/∂y²`，其中 `ν_t` 为**湍流动量扩散率**（湍流粘度）。","湍流边界层能量方程 `u ∂t/∂x + v ∂t/∂y = (a + a_t) ∂²t/∂y²`，其中 `a_t` 为**湍流热扩散率**。","引入下列无量纲量：`x* = x/l`、`y* = y/l`、`u* = u/u_∞`、`v* = v/u_∞`、`Θ = (t - t_w)/(t_∞ - t_w)`。","无量纲化后为 `u* ∂u*/∂x* + v* ∂u*/∂y* = (1/(u_∞ l))(ν + ν_t) ∂²u*/(∂y*)²` 与 `u* ∂Θ/∂x* + v* ∂Θ/∂y* = (1/(u_∞ l))(a + a_t) ∂²Θ/(∂y*)²`。","雷诺认为：由于湍流切应力 `τ_t` 和湍流热流密度 `q_t` 均由脉动所致，因此可以假定 `ν_t/a_t = Pr_t = 1`，此即**湍流普朗特数**。","当 `Pr = 1` 时，`u*` 与 `Θ` 应该有完全相同的解，此时 `∂u*/∂y*|_{y*=0} = ∂Θ/∂y*|_{y*=0}`。"]},{"id":"p-h5c-12","title":"雷诺比拟与契尔顿—柯尔本比拟","key":true,"source":"课件 p061–p062","items":["由无量纲速度梯度得 `∂u*/∂y*|_{y*=0} = ∂u/∂y|_{y=0} · l/u_∞ = η ∂u/∂y|_{y=0} · l/(ηu_∞) = τ_w · (1/(½ρu_∞²)) · (ρu_∞ l/(2η)) = c_f Re/2`。","类似地 `∂Θ/∂y*|_{y*=0} = -(λ/((t_w - t_∞))) ∂t/∂y|_{y=0} · l/λ = (q/(t_w - t_∞)) · l/λ = h_{x=l} l/λ = Nu_{x=l}`，于是 `Nu_x = (c_f/2) Re_x`。","实验测定平板上湍流边界层阻力系数为 `c_f = 0.0592 Re_x^{-1/5}`（`Re_x ≤ 10⁷`），代入后得 `Nu_x = 0.0296 Re_x^{4/5}`。","这就是有名的**雷诺比拟**，它成立的前提是 `Pr = 1`。","当 `Pr ≠ 1` 时，需要对该比拟进行修正，于是有**契尔顿—柯尔本比拟**（修正雷诺比拟）：`c_f/2 = St Pr^{2/3} = j`（`0.6 < Pr < 60`）。","`St` 称为**斯坦顿（Stanton）数**，其定义为 `St = Nu/(Re Pr)`；`j` 称为 j 因子，在制冷、低温工业的换热器设计中应用较广。","修正后由 `c_f = 0.0592 Re_x^{-1/5}` 得 `Nu_x = 0.0296 Re_x^{4/5} Pr^{1/3}`。"]},{"id":"p-h5c-13","title":"平板换热计算例题要点","key":true,"source":"课件 p063–p064","items":["例题：温度为 30℃ 的空气以 0.5m/s 的速度平行掠过长 250mm、温度为 50℃ 的平板，试求出平板末端流动边界层和热边界层的厚度及空气与单位宽度平板的换热量。","边界层的平均温度为 `t_m = ½(t_w + t_∞) = 40`；空气 40℃ 的物性参数分别为 `ν = 16.96×10⁻⁶ m²/s`、`λ = 2.76×10⁻² W/(m·K)`、`Pr = 0.699`。","在离平板前 250mm 处，雷诺数为 `Re = ul/ν = 0.5m/s × 0.25m / (16.96×10⁻⁶ m²/s) = 7.37×10³`，位于层流范围。","流动边界层的厚度 `δ = 5.0x·Re^{-1/2} = 5×0.25m×(7.37×10³)^{-0.5} = 0.0146m`。","热边界层的厚度 `δ_t = δPr^{-1/3} = 14.6mm×(0.699)^{-1/3} = 16.4mm`，可见空气的热边界层比流动边界层略厚。","整个平板的平均表面传热系数 `Nu = 0.664Re^{1/2}Pr^{1/3} = 0.664×(7.37×10³)^{1/2}×0.699^{1/3} = 50.6`，`h = (λ/l)Nu = (2.76×10⁻²W/(m·K)/0.25m)×50.6 = 5.6W/(m²·K)`。","1m 宽平板与空气的换热量为 `Φ = Ah(t_w - t_∞) = 1m×0.25m×5.6W/(m²·K)×(50-30)K = 28W`。"]},{"id":"p-h5c-14","title":"相似原理与量纲分析的开篇","key":true,"source":"课件 p065–p066","items":["`5.5 相似原理与量纲分析`的**问题的提出**：实验是不可或缺的手段，然而经常遇到如下两个问题。","问题 (1) **变量太多**：`h = f(u, t_w, t_f, λ, c_p, ρ, η, l)`，也可写成 `h = f(u, l, ρ, η, λ, c_p)`。","由此引出：A 实验中应测哪些量（是否所有的物理量都测）；B 实验数据如何整理（整理成什么样函数关系）。","问题 (2) 实物试验很困难或太昂贵的情况，如何进行试验？**相似原理将回答上述三个问题**。","`5.5.1 物理现象相似的定义`：相似的概念来自于几何学。","两个相似的三角形对应边成比例，即 `a′/a″ = b′/b″ = c′/c″ = c_l = const`。"]},{"id":"p-h5d-1","title":"物理现象相似的定义","key":true,"source":"课件 p067–p068","items":["对于两个**同类**的物理现象，在相应的时刻及相应的地点上与现象有关的物理量一一对应成比例，则称此两现象彼此**相似**。","只有同类现象才能谈论相似问题；用相同形式且具有相同内容的微分方程时所描述的现象为**同类现象**。","速度场相似：`u₁″/u₁′ = u₂″/u₂′ = u₃″/u₃′ = … = u″/u′ = C_u`。","温度场相似：`t₁″/t₁′ = t₂″/t₂′ = t₃″/t₃′ = … = t″/t′ = C_t`。","物理常量场相似：`ρ″/ρ′ = C_ρ`、`μ″/μ′ = C_μ`、`λ″/λ′ = C_λ`。","对于非同类现象，比如电场与温度场之间、速度场与温度场之间，只能「**比拟**」或「**类比**」。","与现象有关的物理量要一一对应成比例；对非稳态问题，要求在相应的时刻各物理量空间分布对应成比例。","对于相似的物理现象，其物理量的场一定可以用一个统一的**无量纲**的场来表示（图上为 `u/u_max` 随 `r/r_o` 变化的曲线，圆管内速度分布无量纲后重合成一条曲线）。"]},{"id":"p-h5d-2","title":"模型实验与相似三定理","key":true,"source":"课件 p069","items":["从事模型实验研究，需要解决三个问题：实验研究应当测量哪些参量？如何对测量的数据进行加工和整理？如何作到模型现象和原型相似？","**相似三定理**可以回答（相似原理的核心内容）：物理现象相似的性质；相似准数间的关系；判断相似的充分必要条件。"]},{"id":"p-h5d-3","title":"相似第一定理与 Nu 数","key":true,"source":"课件 p070","items":["**相似第一定理**（相似物理现象间的重要特征）：彼此相似的现象，它们的**同名相似特征数**必定对应相等。","对流换热微分方程：`h(t_w - t_f) = -λ (∂t/∂y)|_{y=0}`。","以 `t_w - t_f` 作为温度的标尺、以换热面的某一特征尺寸 `l` 作为长度标尺把上式无量纲化：`h l/λ = ∂[(t_w - t)/(t_w - t_f)] / ∂(y/l) |_{y=0}`，等式右端为**无量纲的梯度**。","对于两个相似的对流换热现象 1 和 2，根据相似现象的定义，其无量纲的同名物理量的场是相同的，因而无量纲的梯度也相等：`(h l/λ)₁ = (h l/λ)₂`，即 `Nu₁ = Nu₂`。"]},{"id":"p-h5d-4","title":"相似第二定理与 π 定理","key":true,"source":"课件 p071","items":["**相似第二定理**（同类现象相似特征数及其关系）：所有相似的物理现象的解必定可用**同一个特征数方程**来描述。","**π 定理**：一个表示 n 个物理量间关系的量纲一致的方程式，一定可以转换成包含 `n-r` 个独立的无量纲量群间的关系式；`r` 是 n 个物理量中涉及到的基本量纲数目。","对于彼此相似的物理现象，无量纲数群（即相似特征数群）间的关系都相同。","对某个具体的物理过程所获得的特征数方程也适用于所有其他与之相似的现象。"]},{"id":"p-h5d-5","title":"相似第三定理与单值性条件","key":true,"source":"课件 p072","items":["**相似第三定理**（两现象相似的充要条件）之一：**同名的已定特征数相等**。","已定特征数是由所研究问题的已知量组成的特征数；**待定特征数**包含需要求解的未知量。","对流换热中 `Nu = f(Re, Pr)`，其中 `Nu` 为**待定特征数**，`Re`、`Pr` 为**已定特征数**。","充要条件之二：**单值性条件相似**。单值性条件包括**初始条件**、**边界条件**、**几何条件**、**物理条件**。","这里的**单值性条件**与分析解法中数学描写的**定解条件**是一致的。"]},{"id":"p-h5d-6","title":"相似分析法与标尺无量纲化","key":true,"source":"课件 p073–p076","items":["**相似分析法**（导出相似特征数的两种方法之一）以过余温度为求解变量的常物性、无内热源、第三类边界条件的一维非稳态导热问题为例。","导热微分方程：`∂θ/∂τ = a ∂²θ/∂x²`（`0 ≤ x < δ`，`τ > 0`）。","初始条件：`τ = 0`，`θ = θ₀`（`0 ≤ x ≤ δ`）。","边界条件：`x = 0` 时 `∂θ/∂x = 0`；`x = δ` 时 `-λ ∂θ/∂x = hθ`。","三个标尺：温度标尺 `θ₀ = t₀ - t_∞`，长度标尺 `δ`，时间标尺 `δ²/a`。","无量纲化后的方程：`∂(θ/θ₀)/∂(aτ/δ²) = ∂²(θ/θ₀)/∂(x/δ)²`，也可写成 `∂(θ/θ₀)/∂(τ/(δ²/a)) = ∂²(θ/θ₀)/∂(x/δ)²`，其左端为**无量纲的梯度**。","边界条件无量纲化：`x/δ = 0` 时 `∂(θ/θ₀)/∂(x/δ) = 0`；`x/δ = 1` 时 `∂(θ/θ₀)/∂(x/δ) = -(hδ/λ)(θ/θ₀)`；`aτ/δ² = 0` 时 `θ/θ₀ = 1`。"]},{"id":"p-h5d-7","title":"Fo 数、Bi 数与特征数方程","key":true,"source":"课件 p077–p078","items":["无量纲方程中出现的 `aτ/δ²` 称为 **Fo 数**（傅里叶数），`hδ/λ` 称为 **Bi 数**（毕渥数），`θ/θ₀` 记为 `Θ`。","无量纲化后的完整方程组：`∂Θ/∂(Fo) = ∂²Θ/∂(x/δ)²`；`x/δ = 0` 时 `∂Θ/∂(x/δ) = 0`；`x/δ = 1` 时 `∂Θ/∂(x/δ) = -BiΘ`；`Fo = 0` 时 `Θ = 1`。","上述方程组的解可写成 `Θ = f(Fo, Bi, x/δ)`，其中 `Fo`、`Bi`、`x/δ` 为**已定准则**。","对两个一维无限大平板的非稳态导热问题而言，只要单值性条件相似，`Fo`、`Bi`、`x/δ` 之值对应相等，则两个平板的 `Θ` 值必相同，即非稳态导热现象相似。","表示物理现象的解的无量纲量之间的函数关系式称为**特征数方程**。"]},{"id":"p-h5d-8","title":"相似分析法中的相似倍数","key":true,"source":"课件 p079–p082","items":["相似分析法的另一种实施方式：根据相似现象的基本定义——各个物理量的场对应成比例，对与过程有关的量引入两个现象之间的一系列比例系数（称**相似倍数**），然后应用描述该过程的一些数学关系式，来导出制约这些相似倍数间的关系，从而得出相应的相似准则数。","现象 1：`h′ = -(λ′/Δt′)(∂t′/∂y′)|_{y′=0}`；现象 2：`h″ = -(λ″/Δt″)(∂t″/∂y″)|_{y″=0}`。","建立相似倍数：`h′/h″ = C_h`、`λ′/λ″ = C_λ`、`y′/y″ = C_l`、`t′/t″ = Δt′/Δt″ = C_t`，即 `h′ = C_h h″`、`λ′ = C_λ λ″`、`y′ = C_l y″`、`t′ = C_t t″`、`Δt′ = C_t Δt″`。","代入后得 `C_h h″ = -(C_λ λ″/(C_t Δt″)) · ∂(C_t t″)/∂(C_l y″) |_{C_l y″ = 0}`，整理得**换热现象相似倍数的制约关系** `(C_h C_l)/C_λ = 1`。","由制约关系得 `h′y′/λ′ = h″y″/λ″`；取 `y′/y″ = l′/l″ = C_l`，则 `h′l′/λ′ = h″l″/λ″`，即 `(h l/λ)₁ = (h l/λ)₂`，`Nu₁ = Nu₂`。"]},{"id":"p-h5d-9","title":"动量与能量方程导出的 Re、Pe","key":true,"source":"课件 p083","items":["由**动量微分方程** `u ∂u/∂x + v ∂u/∂y = -(1/ρ)(dp/dx) + ν ∂²u/∂y²` 导出**雷诺数** `Re = ul/ν`。","`Re` 的物理意义：流体流动的**惯性力**和**粘性力**的相对大小；两运动相似现象 `Re′ = Re″`。","由**能量微分方程** `u ∂t/∂x + v ∂t/∂y = a ∂²t/∂y²` 导出**贝克来数** `Pe = ul/a`，又有 `Pe = (ν/a)(ul/ν) = Pr·Re`。","两热量传递现象相似：`Pe′ = Pe″`。"]},{"id":"p-h5d-10","title":"格拉晓夫数与常用准数","key":true,"source":"课件 p084","items":["**格拉晓夫数**的定义：`Gr = αgΔt l³/ν²`。","`Gr` 的物理意义：**浮升力**和**粘性力**的相对大小；它反映了**自然对流换热**的强弱。","研究对流换热问题常用准数：`Nu`、`Re`、`Pr`、`Gr`，即测量相关准数中所包含的各物理量。"]},{"id":"p-h5d-11","title":"量纲分析法与圆管内强制对流","key":true,"source":"课件 p085–p087","items":["**量纲分析法**（导出相似特征数的两种方法之二）：在已知表面传热系数影响因素的前提下，采用量纲分析获得无量纲量。","其优点是方法简单；在不知道**微分方程**的情况下，仍然可以获得无量纲量。","例：以圆管内单相强制对流换热为例，(a) 确定相关的物理量 `h = f(u, d, λ, η, ρ, c_p)`，`n = 7`。","(b) 确定基本量纲 `r`：各物理量的单位为 `h: kg/(s³·K)`、`u: m/s`、`d: m`、`λ: W/(m·K) = kg·m/(s³·K)`、`η: Pa·s = kg/(m·s)`、`ρ: kg/m³`、`c_p: J/(kg·K) = m²/(s²·K)`。","国际单位制中的 7 个基本量：长度 [m]、质量 [kg]、时间 [s]、电流 [A]、温度 [K]、物质的量 [mol]、发光强度 [cd]；本例取 4 个基本量纲：时间 [T]、长度 [L]、质量 [M]、温度 [Θ]，故 `r = 4`。","由 π 定理 `n - r = 3`，即应该有**三个无量纲量**，因此必须选定 4 个基本物理量，以与其它量组成三个无量纲量；选 `u`、`d`、`λ`、`η` 为基本物理量。","(c) 组成三个无量纲量：`π₁ = h u^{a₁} d^{b₁} λ^{c₁} η^{d₁}`、`π₂ = ρ u^{a₂} d^{b₂} λ^{c₂} η^{d₂}`、`π₃ = c_p u^{a₃} d^{b₃} λ^{c₃} η^{d₃}`。","(d) 求解待定指数，以 `π₁` 为例：`π₁ = h u^{a₁} d^{b₁} λ^{c₁} η^{d₁}`。"]},{"id":"p-h5e-1","title":"量纲分析法求解待定指数","key":true,"source":"课件 p088","items":["`5.5.3 导出相似特征数的两种方法` 中第二种方法为**量纲分析法**，把表面传热系数写成 `h = f(u,d,λ,η,ρ,c_p)`。","求解待定指数，以 `π₁` 为例，设 `π₁ = h u^{a₁} d^{b₁} λ^{c₁} η^{d₁}`。","按基本量纲展开：`π₁ = M¹T⁻³Θ⁻¹·L^{a₁}T^{-a₁}·L^{b₁}·M^{c₁}L^{c₁}T^{-3c₁}Θ^{-c₁}·M^{d₁}L^{-d₁}T^{-d₁}`。","合并同类项得 `π₁ = M^{1+c₁+d₁}T^{-3-a₁-3c₁-d₁}Θ^{-1-c₁}·L^{a₁+b₁+c₁-d₁}`。","由量纲齐次令各指数为零，得方程组 `1+c₁+d₁=0`、`-3-a₁-3c₁-d₁=0`、`-1-c₁=0`、`a₁+b₁+c₁-d₁=0`。","解得 `a₁=0`、`b₁=1`、`c₁=-1`、`d₁=0`。"]},{"id":"p-h5e-2","title":"量纲分析结果与三个准则数","key":true,"source":"课件 p089","items":["把解得的指数代回得 `π₁ = h u⁰ d¹ λ⁻¹ η⁰ = hd/λ = Nu`。","第二个无量纲量 `π₂ = ρud/η = ud/ν = Re`。","第三个无量纲量 `π₃ = ηc_p/λ = ν/a = Pr`。","图中标注上述结果对应**单相、强制对流**。","由此把 `h = f(u,l,ρ,η,λ,c_p)` 整理为 `Nu = f(Re, Pr)`。"]},{"id":"p-h5e-3","title":"强制、自然与混合对流的准则式","key":true,"source":"课件 p090","items":["**强制对流换热**：`Nu = f(Re, Pr)`。","**自然对流换热**：`Nu = f(Gr, Pr)`。","**混合对流换热**：`Nu = f(Re, Gr, Pr)`。","`Nu` ——待定特征数（含有待求的 `h`）；`Re`、`Pr`、`Gr` ——已定特征数。","按上述关联式整理实验数据，得到实用关联式——解决了实验中实验数据如何整理的问题。"]},{"id":"p-h5e-4","title":"相似原理解决的三类实验问题","key":true,"source":"课件 p091","items":["实验中只需测量各特征数所包含的物理量，避免了测量的盲目性——解决了实验中测量哪些物理量的问题。","按特征数之间的函数关系整理实验数据，得到实用关联式——解决了实验中实验数据如何整理的问题。","在相似原理的指导下采用模化试验——解决了实物试验很困难或太昂贵的情况下，如何进行试验的问题。"]},{"id":"p-h5e-5","title":"相似原理指导实验安排与数据整理","key":true,"source":"课件 p093","items":["`5.4 相似原理的应用`、`5.4.1 指导实验的安排和实验数据的整理`。","按相似原理来安排与整理实验数据时，个别实验得出的结果已上升到代表整个相似组的地位。","由 `h = f(u,l,ρ,η,λ,c_p)` 整理为 `Nu = f(Re, Pr)`，图中实验工作量由 `10⁶` 降到 `10²`。","所用特征数为 `Nu = hl/λ`、`Re = ul/ν`、`Pr = ν/a`。","模型中进行的对流换热过程必须满足物理现象相似的3个条件：模型是与原型同类的对流换热过程；模型的单值性条件必须与原型相似；已定特征数必须与原型相等。"]},{"id":"p-h5e-6","title":"特征数方程的幂函数常用形式","key":true,"source":"课件 p094","items":["`2. 特征数方程（实验关联式）的常用形式`。","相似原理虽然原则上阐明了实验结果应整理成准则间的关联式，但具体的**函数形式**以及**定性温度**和**特征长度**的确定，则带有经验的性质。","在对流换热研究中，以已定准则的**幂函数形式**整理实验数据的实用方法取得很大的成功。","常用形式为 `Nu = C·Re^n` 和 `Nu = C·Re^n Pr^m`。","式中，`c`、`n`、`m` 等常数由实验数据确定。"]},{"id":"p-h5e-7","title":"幂函数式在双对数坐标上成直线","key":true,"source":"课件 p095","items":["对 `Nu = C·Re^n` 取对数得 `lg Nu = lg C + n lg Re`。","**优点**：在纵、横坐标都是对数的**双对数坐标图**上会得到一条直线。","图中直线的斜率 `n = tan φ`，纵向截距为 `lg c`，横坐标为 `lg Re`、纵坐标为 `lg Nu`。"]},{"id":"p-h5e-8","title":"管内湍流关联式的两步整理","key":true,"source":"课件 p096–p097","items":["由 `Nu = C Re^n Pr^m` 取对数得 `lg Nu = lg C + n lg Re + m lg Pr`，需要确定 `C`、`m`、`n` 三个常数，实验数据的整理分两部进行。","以管内湍流对流换热为例，**第一步**：利用薛伍德得到的同一雷诺数下不同种类流体的实验数据从图中先确定 `m` 值，此时 `lg Nu = lg C′ + m lg Pr`。","由双对数图上量得 `m = (lg200 - lg40)/(lg62 - lg1.15) ≈ 0.4`。","**第二步**：以 `lg(Nu/Pr^0.4)` 为纵坐标，用不同 `Re` 数的管内湍流传热实验数据确定 `c`，此时 `lg(Nu/Pr^0.4) = lg C + n lg Re`。","由图得 `n = tan φ = 0.8`、`C = 0.023`，即 `lg(Nu/Pr^0.4) = 0.023 + 0.8 ln Re`，最终 `Nu = 0.023 Re^0.8 Pr^0.4`。"]},{"id":"p-h5e-9","title":"大量实验点的整理与分段常数","key":true,"source":"课件 p098","items":["对于有大量实验点的关联式，采用**最小二乘法**确定关联式中各常数值，并由计算机完成。","在对流传热的特征数方程式中，待定量表面传热系数 `h` 包含在 `Nu` 数中，所以 `Nu` 数是个待定数。","对于求 `h` 的计算，其他特征数都是已定数。","`Nu = C·Re^n`、`Nu = C·Re^n Pr^m` 是传热学文献中应用最广的一种实验数据整理形式。","当实验的 `Re` 数范围相当宽时，其指数 `n` 常随 `Re` 数的范围的变动而变化，这时可采用**分段常数**的处理方法。"]},{"id":"p-h5e-10","title":"应用相似原理指导模化试验","key":true,"source":"课件 p099","items":["所谓**模化试验**，是指用不同于实物几何尺度的**模型**（在大多数情况下是缩小的模型）来研究实际装置中所进行的物理过程的试验。","模型与原型中的对流换热过程必须相似，要满足上述判别相似的条件，要满足**单值性条件相似**、**已定特征数相等**。","实验时改变条件，测量与现象有关的、相似特征数中所包含的全部物理量，因而可以得到几组有关的相似特征数。","利用这几组有关的相似特征数，经过综合得到特征数间的函数关联式。","工程上采用**近似模化**的方法，即只要求对过程有决定性影响的条件满足相似原理的要求。"]},{"id":"p-h5e-11","title":"特征长度、特征速度与定性温度","key":true,"source":"课件 p100–p103","items":["(1) **特征长度**：包含在相似特征数中的几何长度，应取所研究问题中具有代表性的几何尺度；管内流动换热取内径 `d`，流体在流通截面形状不规则的槽道中流动取当量直径，外掠单管或管束时取管子外径。","(2) **特征速度**：计算 `Re` 数时用到的流速称为特征流速，一般取截面平均流速；流体外掠平板或绕流圆柱传热取来流速度 `u∞`，管内对流换热取截面平均流速 `u_m`，流体绕流管束取最小流通截面的最大速度 `u_max`。","(3) **定性温度**：确定物性的温度即定性温度；常用的选取方式有①通道内部流动取进出口截面的平均值，②外部流动取边界层外的流体温度或取这一温度与壁面温度的平均值。","流体在管内流动换热时 `t_f = (t′_f + t″_f)/2`；热边界层的平均温度 `t_m = (t_w + t_f)/2`；壁面温度记作 `t_w`。","在应用文献中已经有的特征数方程时，特征长度、流速、定性温度都应按该准则式规定的方式选取。","(4) **实验参数的范围**：准则方程不能任意推广到得到该方程的试验参数的范围以外，这种参数范围主要有 `Re` 数范围、`Pr` 数的范围、几何参数的范围。"]},{"id":"p-h5e-12","title":"表6-1 常见相似准则数的物理意义","key":true,"source":"课件 p104","items":["`表6-1 常见相似准则数的物理意义` 按特征数名称、定义、释义三列列出六个准则数。","`Bi` 数：定义 `hl/λ`，释义为固体内部导热热阻与界面上换热热阻之比（λ为固体的导热系数）。","`Fo` 数：定义 `aτ/l²`，释义为非稳态过程的无量纲时间，表征过程进行的深度。","`Gr` 数：定义 `g l³ α_V Δt / ν²`，释义为浮升力与粘性力之比的一种量度。","`Nu` 数：定义 `hl/λ`，释义为壁面上流体的无量纲温度梯度（注意，λ为流体的导热系数）。","`Pr` 数：定义 `ηc_p/λ = ν/a`，释义为动量扩散能力与热量扩散能力的一种量度。","`Re` 数：定义 `ul/ν`，释义为惯性力与黏性力之比的一种度量。"]},{"id":"p-h5e-13","title":"实验关联式的误差与不确定度","key":true,"source":"课件 p105","items":["`5.4.4 对实验关联式准确性的正确认识`。","应用每个实验公式所造成的计算误差（error）常常可达**±20%**，甚至**±25%**。","更合适地称为**不确定度**（uncertainty）。","对于一般的工程计算，这样的不确定度是可以接受的。"]},{"id":"p-h5e-14","title":"内部流动与外部流动的区别","key":true,"source":"课件 p106","items":["`5.5.5 内部强制对流换热的实验关联式`。","内部流动与外部流动的区别主要在于流动边界层与流道壁面之间的相对关系不同。","在外部流动中，换热壁面上的流体边界层可以自由地发展，不会受到流道壁面的阻碍或限制。","因此，在外部流动中往往存在着一个边界层外的区域，在那里无论速度梯度还是温度梯度都可以忽略。","而在内部流动中，换热壁面上边界层的发展受到流道壁面的限制，因此其换热规律就与外部流动有明显的区别。"]}],"questions":[{"id":"q-h5a-1","kind":"单选","priority":2,"source":"课件 p004","sourceDetail":"课件 p004（依据正文自拟）","keyPoints":["对流换热的定义","对流换热与热对流的区别","对流换热的必要条件"],"stem":"关于对流换热，下列说法符合课件的是：","options":[{"k":"A","t":"对流换热就是热对流，属于基本传热方式"},{"k":"B","t":"对流换热是指流体流经固体时流体与固体表面之间的热量传递现象"},{"k":"C","t":"对流换热过程中热量只靠导热方式传递"},{"k":"D","t":"对流换热只需要流体与壁面直接接触，不需要温差"}],"answer":"B","why":["A ✗ 课件 p004 原文写明「对流换热与热对流不同，既有热对流，也有导热；不是基本传热方式」","B ✓ 课件 p004 原文：对流换热是指流体流经固体时流体与固体表面之间的热量传递现象","C ✗ 课件 p004 说明对流换热中既有热对流也有导热，并非只有导热","D ✗ 课件 p004 特点(2)：必须有直接接触（流体与壁面）和宏观运动；也必须有温差"],"basis":"课件 p004（原文）","answerNote":"答案由课件 p004 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h5a-2","kind":"单选","priority":2,"source":"课件 p007–p009","sourceDetail":"课件 p007–p009（依据正文自拟）","keyPoints":["层流与湍流的定义","两种流态的热量传递方式","表面传热系数的比较"],"stem":"关于层流与湍流的对流换热，下列说法符合课件的是：","options":[{"k":"A","t":"层流时垂直于流动方向上的热量传递主要靠对流"},{"k":"B","t":"湍流时流体内存在强烈的脉动和旋涡，表面传热系数大"},{"k":"C","t":"层流对流换热比湍流对流换热强烈"},{"k":"D","t":"湍流时热量传递主要靠导热"}],"answer":"B","why":["A ✗ 课件 p007 原文：层流垂直于流动方向上的热量传递主要靠分子扩散（即导热）","B ✓ 课件 p007–p008 原文：流体内存在强烈的脉动和旋涡，使各部分流体之间迅速混合，因此湍流对流换热要比层流对流换热强烈，表面传热系数大","C ✗ 课件 p008 原文说明湍流对流换热要比层流对流换热强烈","D ✗ 课件 p008 原文：湍流时热量传递主要靠对流"],"basis":"课件 p007–p009（原文）","answerNote":"答案由课件 p007–p009 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h5a-3","kind":"单选","priority":2,"source":"课件 p016–p017","sourceDetail":"课件 p016–p017（依据正文自拟）","keyPoints":["贴壁流体层的导热","傅里叶定律与牛顿冷却公式","局部表面传热系数表达式"],"stem":"课件由贴壁流体层导热与牛顿冷却公式推出的壁面 x 处局部表面传热系数表达式是：","options":[{"k":"A","t":"h_x = -λ/(t_w - t_∞) · (∂t/∂y)|_{y=0,x}"},{"k":"B","t":"h_x = λ(t_w - t_∞)(∂t/∂y)|_{y=0,x}"},{"k":"C","t":"h_x = -λ(t_w - t_∞)/(∂t/∂y)|_{y=0,x}"},{"k":"D","t":"h_x = ρc(∂t/∂y)|_{y=0,x}"}],"answer":"A","why":["A ✓ 课件 p017 原文：局部表面传热系数 `h_x = -λ/(t_w - t_∞) · (∂t/∂y)|_{y=0,x}`","B ✗ 把温度差误作因式相乘，与课件 p017 原文不符","C ✗ 温度梯度与温度差位置颠倒，与课件 p017 原文不符","D ✗ 课件 p016–p017 未出现 ρc 形式的局部表面传热系数表达式"],"basis":"课件 p016–p017（原文）","answerNote":"答案由课件 p016–p017 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h5b-1","kind":"多选","priority":1,"source":"课件题目","sourceDetail":"课件 p040（原文）","keyPoints":["流动边界层内速度梯度大","流动边界层内粘性作用不能忽略","边界层厚度取 u/u∞=0.99","热边界层厚度取 t-t_w=0.99(t_∞-t_w)"],"stem":"下面关于流动边界层和热边界层的说法正确的是","options":[{"k":"A","t":"流动边界层内的温度梯度大"},{"k":"B","t":"流动边界层内的粘性作用不能忽略"},{"k":"C","t":"流动边界层的外边界是指流速达到主流速度的0.99倍"},{"k":"D","t":"热边界层的外边界是指温度达到主流温度的0.99倍"}],"answer":"BCD","why":["A ✗ 课件 p034 原文为「边界层区：速度梯度大，粘性力不能忽略」，显著变化的是速度梯度；温度梯度大是课件 p042 所述热边界层的特征。","B ✓ 课件 p034 原文：边界层区「速度梯度大，粘性力不能忽略；粘性力与惯性力处同一数量级」。","C ✓ 课件 p035 原文：「定义：u/u∞=0.99 处离壁的距离为边界层厚度」。","D ✓ 课件 p042 原文：热边界层厚度 `t - t_w = 0.99(t_∞ - t_w)`。"],"basis":"课件 p040（原文）；课件未标答案，请以老师公布为准"},{"id":"q-h5b-2","kind":"填空","priority":1,"source":"课件题目","sourceDetail":"课件 p041（原文）","keyPoints":["临界雷诺数","层流到湍流的转换","Re_c = u_∞ x_c/ν"],"stem":"外掠平板的边界层中，层流和湍流的转换边界为Re=","answer":"5×10⁵","basis":"课件 p036（原文）：`Re_c = u_∞ x_c/ν`，一般情况下，取 `Re_c = 5×10⁵`"},{"id":"q-h5b-3","kind":"单选","priority":2,"source":"课件 p028","sourceDetail":"课件 p028（依据正文自拟）","keyPoints":["能量守恒方程","对流项","非稳态项","热传导项"],"stem":"流体能量守恒方程 `ρc_p(u ∂t/∂x + v ∂t/∂y + ∂t/∂τ) = λ[∂²t/∂x² + ∂²t/∂y²]` 中，右端项表示的是","options":[{"k":"A","t":"对流项"},{"k":"B","t":"非稳态项"},{"k":"C","t":"热传导项"},{"k":"D","t":"内热源项"}],"answer":"C","why":["A ✗ 课件 p028 把 `u ∂t/∂x + v ∂t/∂y` 标为对流项，在方程左端。","B ✗ 课件 p028 把 `∂t/∂τ` 标为非稳态项，同样在方程左端。","C ✓ 课件 p028 原文：方程右端 `λ[∂²t/∂x² + ∂²t/∂y²]` 标注为「热传导项」。","D ✗ 课件 p026 的假设(4)为「无化学反应等内热源」，故 `Q_内热源=0`，方程中没有内热源项。"],"basis":"课件 p028（原文）","answerNote":"答案由课件 p028 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h5b-4","kind":"单选","priority":2,"source":"课件 p039","sourceDetail":"课件 p039（依据正文自拟）","keyPoints":["边界层动量方程","N-S方程简化","四点简化条件"],"stem":"由 N-S 方程简化得到边界层动量方程 `u ∂u/∂x + v ∂u/∂y = -(1/ρ)(dp/dx) + ν (∂²u/∂y²)` 时，下列简化说法错误的是","options":[{"k":"A","t":"动量方程去掉了 v 方向"},{"k":"B","t":"忽略 y 方向上的压力变化 ∂p/∂y=0，所以 ∂p/∂x 用 dp/dx 代替"},{"k":"C","t":"保留了 u 对 x 的高阶偏导"},{"k":"D","t":"略去了体积力项"}],"answer":"C","why":["A ✗ 课件 p039 原文第1条：「动量方程去掉了v方向」。","B ✗ 课件 p039 原文第2条：「忽略y方向上的压力变化∂p/∂y=0，所以∂p/∂x用dp/dx代替」。","C ✓ 课件 p039 原文第3条为「略去u对x的高阶偏导」，故「保留」的说法错误。","D ✗ 课件 p039 原文第4条：「略去了体积力项」。"],"basis":"课件 p039（原文）","answerNote":"答案由课件 p039 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h5c-1","kind":"例题","priority":1,"source":"课件例题","sourceDetail":"课件 p051–p052（原文）","keyPoints":["平板边界层厚度计算","Re 数判层流","δ 与 δ_t 的换算关系"],"stem":"压力为大气压的 20℃ 的空气，纵向流过一块长 320mm、温度为 30℃ 的平板，流速为 10m/s，求离板前缘 50mm、100mm、150mm、200mm、250mm、300mm、350mm、400mm 处的流动边界层和热边界层的厚度。","given":["空气压力为大气压，温度 20℃，流速 u = 10m/s","平板长 320mm，板温 30℃（题中列出距前缘 50mm 至 400mm 共 8 个位置）","物性按板表面温度与空气温度的平均值 30℃ 确定","30℃ 时空气 ν = 16×10⁻⁶ m²/s，Pr = 0.701"],"ask":["各指定位置处流动边界层的厚度 δ","各指定位置处热边界层的厚度 δ_t"],"steps":["第一步：确定定性温度 30℃，取空气物性 ν = 16×10⁻⁶ m²/s、Pr = 0.701。","第二步：对长为 400mm 的平板计算雷诺数 Re = ul/ν = 10×0.32/(16×10⁻⁶) = 2×10⁵，判断这一 Re 数位于层流范围内。","第三步：用 δ/x = 5.0Re_x^{-1/2} 得 δ = 5.0√(νx/u_∞) = 5.0√(16×10⁻⁶ m²/s / (10m/s)) √x = 6.36×10⁻³ m^{1/2}√x = 0.0636 cm^{1/2}√x。","第四步：热边界层厚度 δ_t ≅ δ/∛Pr ≅ δ/∛0.701 ≅ 1.1δ。","第五步：将各位置 x 代入 δ 与 δ_t 的表达式，作 δ、δ_t 随 x（0~40cm）变化的曲线。"],"result":"δ = 0.0636 cm^{1/2}·√x（x 以 cm 计），δ_t ≅ 1.1δ；由图中曲线可见 δ_t 始终略大于 δ，两者都随距平板前缘距离 x 的增大而增大（x = 40cm 处 δ 约 3.7mm、δ_t 约 4.1mm）。","basis":"课件 p051–p052（原文）"},{"id":"q-h5c-2","kind":"简答","priority":1,"source":"课件题目","sourceDetail":"课件 p058（原文）","keyPoints":["Pr 大小与边界层厚度关系","粘性油与液态金属的 Pr 区别"],"stem":"粘性油的 Pr 很大，液态金属的 Pr 很小。下图为这两种流体的边界层过余温度与速度场。试确定 a) 和 b) 哪一幅是粘性油的？哪一幅是液态金属的？（图中 θ = t - t_w）","given":["粘性油的 Pr 很大，液态金属的 Pr 很小","图中 θ = t - t_w","图中左幅标注 δ > δ_t，右幅标注 δ < δ_t"],"ask":["判断 a)、b) 两幅图各自对应的流体是粘性油还是液态金属"],"steps":["第一步：由 Pr = ν/a = 粘性扩散的能力/热扩散的能力，Pr 越大表示粘性扩散相对热扩散越强。","第二步：由课件结论，Pr > 1 时 δ > δ_t，Pr < 1 时 δ < δ_t。","第三步：粘性油 Pr 很大 → δ > δ_t；液态金属 Pr 很小 → δ < δ_t。","第四步：对照图中标注，δ > δ_t 的一幅（左幅）为粘性油，δ < δ_t 的一幅（右幅）为液态金属。"],"result":"δ > δ_t 的一幅（左幅，速度边界层明显厚于热边界层）是粘性油；δ < δ_t 的一幅（右幅，热边界层明显厚于速度边界层）是液态金属。课件图上已分别标注“粘性油”“液态金属”。","basis":"课件 p058（原文）"},{"id":"q-h5c-3","kind":"例题","priority":1,"source":"课件例题","sourceDetail":"课件 p063–p064（原文）","keyPoints":["平板末端边界层厚度","平均表面传热系数","单位宽度平板换热量"],"stem":"温度为 30℃ 的空气以 0.5m/s 的速度平行掠过长 250mm、温度为 50℃ 的平板，试求出平板末端流动边界层和热边界层的厚度及空气与单位宽度平板的换热量。","given":["空气温度 30℃，速度 0.5m/s","平板长 250mm，板温 50℃","边界层的平均温度 t_m = ½(t_w + t_∞) = 40","空气 40℃ 的物性参数：ν = 16.96×10⁻⁶ m²/s，λ = 2.76×10⁻² W/(m·K)，Pr = 0.699"],"ask":["平板末端流动边界层的厚度 δ","平板末端热边界层的厚度 δ_t","空气与单位宽度平板的换热量 Φ"],"steps":["第一步：确定边界层平均温度 t_m = ½(t_w + t_∞) = 40℃，据此查取空气物性 ν = 16.96×10⁻⁶ m²/s、λ = 2.76×10⁻² W/(m·K)、Pr = 0.699。","第二步：在离平板前 250mm 处计算雷诺数 Re = ul/ν = 0.5m/s × 0.25m / (16.96×10⁻⁶ m²/s) = 7.37×10³，位于层流范围。","第三步：流动边界层厚度 δ = 5.0x·Re^{-1/2} = 5×0.25m×(7.37×10³)^{-0.5} = 0.0146m。","第四步：热边界层厚度 δ_t = δPr^{-1/3} = 14.6mm×(0.699)^{-1/3} = 16.4mm，可见空气的热边界层比流动边界层略厚。","第五步：整个平板的平均表面传热系数 Nu = 0.664Re^{1/2}Pr^{1/3} = 0.664×(7.37×10³)^{1/2}×0.699^{1/3} = 50.6，h = (λ/l)Nu = (2.76×10⁻²W/(m·K)/0.25m)×50.6 = 5.6W/(m²·K)。","第六步：1m 宽平板与空气的换热量 Φ = Ah(t_w - t_∞) = 1m×0.25m×5.6W/(m²·K)×(50-30)K = 28W。"],"result":"δ = 0.0146m，δ_t = 16.4mm，h = 5.6W/(m²·K)，1m 宽平板的换热量 Φ = 28W。","basis":"课件 p063–p064（原文）"},{"id":"q-h5c-4","kind":"单选","priority":2,"source":"课件 p056–p057","sourceDetail":"课件 p056–p057（依据正文自拟）","keyPoints":["Pr = ν/a 的物理意义","δ 与 δ_t 的大小关系"],"stem":"普朗特数 Pr = ν/a 表示粘性扩散的能力与热扩散的能力之比。当某流体的 Pr > 1 时，其流动边界层厚度 δ 与热边界层厚度 δ_t 的关系是：","options":[{"k":"A","t":"δ < δ_t"},{"k":"B","t":"δ > δ_t"},{"k":"C","t":"δ = δ_t"},{"k":"D","t":"δ 与 δ_t 无关，无法确定"}],"answer":"B","why":["A ✗ 课件 p057 原文：Pr < 1 时 ν < a、粘性扩散<热扩散、δ < δ_t，与本题 Pr > 1 不符。","B ✓ 课件 p057 原文：Pr > 1 时 ν > a、粘性扩散>热扩散、δ > δ_t。","C ✗ 课件 p057 原文：只有 Pr = 1（ν = a）时才有 δ = δ_t。","D ✗ 课件 p056 明确指出 ν/a 可以表示流动边界层与热边界层的相对厚度，二者大小关系由 Pr 决定。"],"answerNote":"答案由课件 p057 原文推出，课件未标答案，请以老师公布为准","basis":"课件 p056–p057（原文）"},{"id":"q-h5c-5","kind":"单选","priority":2,"source":"课件 p054–p055","sourceDetail":"课件 p054–p055（依据正文自拟）","keyPoints":["特征数方程 Nu_x = 0.332Re_x^{1/2}Pr^{1/3}","边界层层流换热的适用条件"],"stem":"流体外掠等温平板层流换热的分析解可化为特征数方程 Nu_x = 0.332Re_x^{1/2}Pr^{1/3}，该式的适用条件（以 x 为特征长度）是：","options":[{"k":"A","t":"Re ≤ 5×10⁵，流动处于层流范围"},{"k":"B","t":"Re ≥ 10⁷，流动处于旺盛湍流范围"},{"k":"C","t":"Re ≤ 10³，与 Pr 无关"},{"k":"D","t":"对外掠平板任何 Re 数都适用"}],"answer":"A","why":["A ✓ 课件 p055 原文：对于边界层类型的对流换热，定性温度为 t_m = (t_∞ + t_w)/2，Re ≤ 5×10⁵，即该层流分析解只在层流范围成立。","B ✗ 课件 p061–p062 中的 Re_x ≤ 10⁷ 是湍流边界层阻力系数 c_f = 0.0592Re_x^{-1/5} 的条件，且对应的是雷诺比拟的湍流结果。","C ✗ 课件 p055 的限定是 Re ≤ 5×10⁵，并且该解由 δ/δ_t = Pr^{1/3} 推导而来，与 Pr 直接相关。","D ✗ 课件 p049–p050 的 δ/x = 5.0Re_x^{-1/2}、h_x = 0.332(λ/x)Re_x^{1/2}Pr^{1/3} 均为层流分析解结果，不能推广到全部 Re 数。"],"answerNote":"答案由课件 p055 原文推出，课件未标答案，请以老师公布为准","basis":"课件 p054–p055（原文）"},{"id":"q-h5d-1","kind":"单选","priority":2,"source":"课件 p070","sourceDetail":"课件 p070（依据正文自拟）","keyPoints":["相似第一定理","同名相似特征数"],"stem":"关于相似第一定理，下列说法正确的是：","options":[{"k":"A","t":"对于彼此相似的物理现象，无量纲数群（相似特征数群）间的关系都相同"},{"k":"B","t":"彼此相似的现象，它们的同名相似特征数必定对应相等"},{"k":"C","t":"所有相似的物理现象的解必定可用同一个特征数方程来描述"},{"k":"D","t":"两现象相似的充要条件是单值性条件相似"}],"answer":"B","why":["A ✗ 这是相似第二定理中关于无量纲数群关系的表述，课件 p071。","B ✓ 课件 p070 原文：相似第一定理（相似物理现象间的重要特征）——彼此相似的现象，它们的同名相似特征数必定对应相等。","C ✗ 这是相似第二定理的表述，课件 p071。","D ✗ 单值性条件相似是相似第三定理所述充要条件之一，不是第一定理，课件 p072。"],"basis":"课件 p070（原文）","answerNote":"答案由课件 p070 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h5d-2","kind":"单选","priority":2,"source":"课件 p087","sourceDetail":"课件 p087（依据正文自拟）","keyPoints":["π 定理","n-r 个无量纲量"],"stem":"以圆管内单相强制对流换热为例，表面传热系数 `h = f(u, d, λ, η, ρ, c_p)`，物理量个数 `n = 7`，基本量纲数目 `r = 4`，则可组成的独立无量纲量个数 `n - r` 为：","options":[{"k":"A","t":"2"},{"k":"B","t":"3"},{"k":"C","t":"4"},{"k":"D","t":"7"}],"answer":"B","why":["A ✗ 课件 p087 给出 `n - r = 3`，不是 2。","B ✓ 课件 p087 原文：`n - r = 3`，即应该有三个无量纲量，因此必须选定 4 个基本物理量，以与其它量组成三个无量纲量。","C ✗ 4 是基本量纲数目 `r`（时间 [T]、长度 [L]、质量 [M]、温度 [Θ]），课件 p086。","D ✗ 7 是相关物理量的个数 `n`，课件 p085。"],"basis":"课件 p087（原文）","answerNote":"答案由课件 p087 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h5d-3","kind":"单选","priority":2,"source":"课件 p084","sourceDetail":"课件 p084（依据正文自拟）","keyPoints":["格拉晓夫数","自然对流"],"stem":"格拉晓夫数 `Gr = αgΔt l³/ν²` 的物理意义是：","options":[{"k":"A","t":"流体流动的惯性力和粘性力的相对大小"},{"k":"B","t":"浮升力和粘性力的相对大小，反映了自然对流换热的强弱"},{"k":"C","t":"惯性力和浮升力的相对大小"},{"k":"D","t":"导热热阻和对流热阻之比"}],"answer":"B","why":["A ✗ 惯性力与粘性力的相对大小是雷诺数 `Re = ul/ν` 的物理意义，课件 p083。","B ✓ 课件 p084 原文：物理意义——浮升力和粘性力的相对大小；反映了自然对流换热的强弱。","C ✗ 课件 p084 未给出惯性力与浮升力之比的表述。","D ✗ 课件 p084 未给出导热热阻与对流热阻之比的表述。"],"basis":"课件 p084（原文）","answerNote":"答案由课件 p084 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h5e-1","kind":"多选","priority":1,"source":"课件题目","sourceDetail":"课件 p092（原文）","keyPoints":["现象相似的定义","相似与同名特征数相等","相似与特征数方程相同","相似还须单值性条件相似"],"stem":"下列说法正确的是","options":[{"k":"A","t":"相应的时刻及相应的地点上与现象有关的物理量一一对应成比例，那就是现象相似"},{"k":"B","t":"如果两个现象相似，则其同名特征数相等"},{"k":"C","t":"如果两个现象相似，则其特征数方程必定相同"},{"k":"D","t":"只要同名特征数相同，则两个现象必相似"}],"answer":"ABC","why":["A ✓ 课件 p092 该选项即现象相似的定义表述，与课件 p093 所讲的判别相似条件一致","B ✓ 课件 p093 原文要求「已定特征数必须与原型相等」，即两个相似现象的同名特征数相等","C ✓ 课件 p093 原文要求「模型是与原型同类的对流换热过程」，同类相似现象的特征数方程形式相同","D ✗ 课件 p093 原文还要求「模型的单值性条件必须与原型相似」，只有同名特征数相等并不足以判定两现象相似"],"basis":"课件 p092（原文）","answerNote":"课件 p092 为雨课堂多选题，未标注答案；答案由课件 p093 原文推出，请以老师公布为准"},{"id":"q-h5e-2","kind":"简答","priority":1,"source":"课件题目","sourceDetail":"课件 p108（原文）","keyPoints":["本章作业第1题","对流换热与热对流的区别"],"stem":"解释并比较「对流换热」与「热对流」的区别。","given":["对流换热","热对流"],"ask":["解释两者的含义并比较其区别"],"steps":["第一步：给出「热对流」的含义（课件 p062）：由于流体的宏观运动而引起的流体各部分之间发生相对位移，使不同温度的流体互相掺混所产生的热量传递过程。","第二步：给出「对流换热」的含义（课件 p004、课件 p062）：对流换热是指流体流经固体时流体与固体表面之间的热量传递现象，是导热和热对流两种基本传热方式共同作用的结果。","第三步：指出两者的根本区别（课件 p004）：对流换热与热对流不同，既有热对流，也有导热，不是基本传热方式；课件 p063 进一步指出「自然界不存在单一的热对流」。","第四步：比较两者的特点（课件 p004、课件 p063）：对流换热必须有流体的宏观运动且必须存在温差，必然同时伴随着热传导，只能发生在流体中，并因流体的粘性和受壁面摩擦阻力的影响，紧贴壁面处会形成速度梯度很大的边界层。"],"result":"课件 p108 只给出题目，未给出解答","basis":"课件 p108（原文）","answerNote":"课件 p108 只印题目、未给解答；本答案由课件 p004 与课件 p062–p063 原文推出，请以老师公布为准"},{"id":"q-h5e-3","kind":"简答","priority":1,"source":"课件题目","sourceDetail":"课件 p108（原文）","keyPoints":["本章作业第2题","比拟法与边界层"],"stem":"解释下列名词的相关含义：比拟法、速度边界层、流动边界层、普朗特数。","given":["比拟法","速度边界层","流动边界层","普朗特数"],"ask":["解释上述名词的相关含义"],"steps":["第一步：比拟法（课件 p015、课件 p059）：指利用两个不同物理现象之间在控制方程方面的应用的类似性，通过测定其中某一种现象的规律而获得另一种现象基本关系的方法；课件 p015 又把比拟法表述为利用流体动量传递和热量传递的相似机理，建立表面传热系数和阻力系数之间的相互关系。","第二步：速度边界层（课件 p033）：速度边界层即流动边界层，两者是同一定义的两种称法，指垂直于壁面的方向上流体流速发生显著变化的流体薄层。","第三步：流动边界层（课件 p033–p035）：从 y=0、u=0 开始，u 随离壁面距离的增加而迅速增大，经过厚度为 δ 的薄层后接近主流速度 u_∞；取 u/u_∞=0.99 处离壁的距离为边界层厚度 δ，y=δ 的薄层即流动边界层或速度边界层。","第四步：普朗特数（课件 p056–p057）：Pr = ν/a = ηc_p/λ，表示粘性扩散的能力与热扩散的能力之比；Pr=1 时 δ=δ_t，Pr>1 时 δ>δ_t，Pr<1 时 δ<δ_t，因此 ν/a 可以表示流动边界层与热边界层的相对厚度。"],"result":"课件 p108 只给出题目，未给出解答","basis":"课件 p108（原文）","answerNote":"课件 p108 只印题目、未给解答；本答案由课件 p015、课件 p033–p035、课件 p056–p057、课件 p059 原文推出，请以老师公布为准"},{"id":"q-h5e-4","kind":"简答","priority":1,"source":"课件题目","sourceDetail":"课件 p108（原文）","keyPoints":["本章作业第3题","物理现象相似的充要条件"],"stem":"解释什么称为两个物理现象相似，并说明相似现象的充要条件。","given":["两个物理现象相似"],"ask":["说明两个物理现象相似的含义及其充要条件"],"steps":["课件 p093 原文列出模型与原型相似的 3 个条件：模型是与原型同类的对流换热过程；模型的单值性条件必须与原型相似；已定特征数必须与原型相等"],"result":"课件 p108 未给出完整解答，可参考课件 p093 列出的 3 个相似条件","basis":"课件 p108（原文）"},{"id":"q-h5e-5","kind":"单选","priority":2,"source":"课件 p100","sourceDetail":"课件 p100（依据正文自拟）","keyPoints":["特征长度的选取","外掠单管或管束"],"stem":"应用特征数方程时，外掠单管或管束的换热，其特征长度应取","options":[{"k":"A","t":"管内径 d"},{"k":"B","t":"管子外径"},{"k":"C","t":"当量直径"},{"k":"D","t":"管子长度 l"}],"answer":"B","why":["A ✗ 课件 p100 原文：管内流动换热取内径 d，不适用于外掠单管或管束","B ✓ 课件 p100 原文：外掠单管或管束时：取管子外径","C ✗ 课件 p100 原文：流体在流通截面形状不规则的槽道中流动时取当量直径作为特征长度","D ✗ 课件 p100 未把管子长度 l 作为外掠单管或管束的特征长度"],"basis":"课件 p100（原文）","answerNote":"答案由课件 p100 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h5e-6","kind":"单选","priority":2,"source":"课件 p097","sourceDetail":"课件 p097（依据正文自拟）","keyPoints":["管内湍流关联式","幂函数形式的指数"],"stem":"课件以管内湍流对流换热为例整理实验数据，最终得到的特征数关联式为","options":[{"k":"A","t":"Nu = 0.023 Re^0.4 Pr^0.8"},{"k":"B","t":"Nu = 0.023 Re^0.8 Pr^0.4"},{"k":"C","t":"Nu = 0.8 Re^0.023 Pr^0.4"},{"k":"D","t":"Nu = 0.4 Re^0.8 Pr^0.023"}],"answer":"B","why":["A ✗ 课件 p096–p097 中 0.4 是 Pr 的指数、0.8 是 Re 的指数，两者不可互换","B ✓ 课件 p097 原文：Nu = 0.023 Re^0.8 Pr^0.4","C ✗ 课件 p097 原文：C = 0.023 是常数，不是 Re 的指数","D ✗ 课件 p097 原文：C = 0.023 是常数，不是 Pr 的指数"],"basis":"课件 p097（原文）","answerNote":"答案由课件 p097 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h5e-7","kind":"单选","priority":2,"source":"课件 p102","sourceDetail":"课件 p102（依据正文自拟）","keyPoints":["定性温度的定义","定性温度的常用选取方式"],"stem":"关于定性温度，下列说法符合课件的是","options":[{"k":"A","t":"定性温度就是壁面温度 t_w"},{"k":"B","t":"确定物性的温度即定性温度"},{"k":"C","t":"定性温度与物性无关，可任意选取"},{"k":"D","t":"管内流动的定性温度必须取进口截面温度"}],"answer":"B","why":["A ✗ 课件 p102 原文：壁面温度 t_w 只是可选取的温度之一，不是定性温度的定义","B ✓ 课件 p102 原文：(3) 定性温度：确定物性的温度即定性温度","C ✗ 课件 p102 原文：定性温度应按准则式规定的方式选 l":"余弦函数 cosωt ↔ s/(s²+ω²)"},{"label":"拉普拉斯变换简表（续）"}]},{"label":"2.2.4 拉普拉斯变换的基本性质","children":[{"label":"线性定理"},{"label":"平移定理"},{"label":"微分定理（含 n 阶导数推广）"},{"label":"(4) 积分定理"},{"label":"(5) 终值定理"},{"label":"(6) 初值定理"},{"label":"(7) 卷积定理"}]},{"label":"2.2.5 拉普拉斯反变换","children":[{"label":"(1) 拉普拉斯反变换的定义"},{"label":"(2) 部分分式展开法"},{"label":"(1) 分母B(s)无重根"},{"label":"(2) 分母B(s)有重根"}]},{"label":"利用拉氏变换解常系数线性微分方程","children":[]}]},"points":[{"id":"p-lapA-1","title":"系统分析方法与拉氏变换的地位","key":true,"source":"课件 p002","items":["系统的数学模型以**微分方程**的形式表达输出与输入的关系。","经典控制理论的**系统分析方法**：**时域法**、**频域法**。","**时域分析法**：求解数学模型微分方程，获得系统输出随时间变化的规律。","**频域分析法**：借助于系统频率特性分析系统的性能，**拉普拉斯变换是其数学基础**。","频域分析法是经典控制理论的**核心**，被广泛采用，该方法间接地运用系统的**开环频率特性**分析**闭环响应**。"]},{"id":"p-lapA-2","title":"复数的概念","key":true,"source":"课件 p003","items":["复数 `s=σ+jω`，有一个实部 `σ` 和一个虚部 `ω`，`σ` 和 `ω` 均为实数。","`j=√-1` 称为**虚数单位**。","**两个复数相等**：当且仅当它们的实部和虚部分别相等。","**一个复数为零**：当且仅当它的实部和虚部同时为零。"]},{"id":"p-lapA-3","title":"复平面与复数的几何表示","key":true,"source":"课件 p004","items":["以 `σ` 为横坐标（**实轴**）、`ω` 为纵坐标（**虚轴**）所构成的平面称为**复平面**或 `[s]` 平面。","复数 `s=σ+jω` 可在复平面 `[s]` 中用点 `(σ, ω)` 表示。","**一个复数对应于复平面上的一个点**。"]},{"id":"p-lapA-4","title":"复数的向量表示法：模与复角","key":true,"source":"课件 p005","items":["复数 `s=σ+jω` 可以用从原点指向点 `(σ, ω)` 的**向量**表示。","向量的长度称为复数的**模**：`|s|=r=√(σ²+ω²)`。","向量与 `σ` 轴的夹角 `θ` 称为复数 `s` 的**复角**：`θ=arctan(ω/σ)`。"]},{"id":"p-lapA-5","title":"复数的三角函数表示法与指数表示法","key":true,"source":"课件 p006","items":["根据复平面的图示可得：`σ=r cosθ`，`ω=r sinθ`。","**复数的三角函数表示法**：`s=r(cosθ+j sinθ)`。","**欧拉公式**：`e^{jθ}=cosθ+j sinθ`。","**复数的指数表示法**：`s=r e^{jθ}`。"]},{"id":"p-lapA-6","title":"复变函数、零点与极点","key":true,"source":"课件 p007","items":["以复数 `s=σ+jω` 为自变量构成的函数 `G(s)` 称为**复变函数**：`G(s)=u+jv`，式中 `u`、`v` 分别为复变函数的**实部**和**虚部**。","通常，在**线性控制系统**中，复变函数 `G(s)` 是复数 `s` 的**单值函数**：对应于 `s` 的一个给定值，`G(s)` 就有一个唯一确定的值与之相对应。","当复变函数表示成 `G(s)=kΠ(s+z_i)/Π(s+p_j)` 时：","（a）当 `s=-z_i` 时，`G(s)=0`，则 `s_i=-z_i` 称为 `G(s)` 的**零点**（分子为零）。","（b）当 `s=-p_j` 时，`G(s)→∞`，则 `s_j=-p_j` 称为 `G(s)` 的**极点**（分母为零）。"]},{"id":"p-lapA-7","title":"拉普拉斯变换的定义","key":true,"source":"课件 p009","items":["拉氏变换是控制工程中的一个基本数学方法，其优点是能将**时间函数的导数**经拉氏变换后变成**复变量 `s` 的乘积**，将时间表示的**微分方程**变成以 `s` 表示的**代数方程**。","设有时间函数 `f(t)`，当 `t<0` 时 `f(t)=0`；在 `t≥0` 时定义函数 `f(t)` 的拉普拉斯变换为：`F(s)=L[f(t)]=∫₀^∞ f(t)e^{-st}dt`。","符号名称：`F(s)` 为**象函数**，`L` 为**拉氏变换符号**，`f(t)` 为**原函数**，`s` 为**复变量**。","拉普拉斯变换：在一定条件下，把实数域中的实变函数 `f(t)` 变换到复数域内与之等价的复变函数 `F(s)`。"]},{"id":"p-lapA-8","title":"拉氏变换存在的条件","key":true,"source":"课件 p010","items":["拉氏变换是否存在取决于定义的**积分是否收敛**。","① 当 `t≥0` 时，`f(t)` **分段连续**，只有有限个间断点；","② 当 `t→∞` 时，`f(t)` 的**增长速度不超过某一指数函数**，即 `|f(t)|≤Me^{at}`，式中 `M`、`a` 为实常数。"]},{"id":"p-lapA-9","title":"单位阶跃函数及其拉氏变换","key":true,"source":"课件 p011","items":["单位阶跃函数定义：`1(t)={0, t<0; 1, t≥0}`。","其拉普拉斯变换：`L[1(t)]=∫₀^∞ 1(t)e^{-st}dt=∫₀^∞ e^{-st}dt=-1/s e^{-st}|₀^∞=1/s`。","结论：`1(t) ↔ 1/s`。"]},{"id":"p-lapA-10","title":"单位脉冲函数及其拉氏变换","key":true,"source":"课件 p012","items":["单位脉冲函数定义：`δ(t)={∞, t=0; 0, t≠0}`。","且：`∫_{-∞}^{∞} δ(t)dt=1`，`∫_{-∞}^{∞} δ(t)f(t)dt=f(0)`。","其拉普拉斯变换：`L[δ(t)]=∫₀^∞ δ(t)e^{-st}dt=e^{-st}|_{t=0}=1`，即 `δ(t) ↔ 1`。"]},{"id":"p-lapA-11","title":"单位速度函数（单位斜坡函数）及其拉氏变换","key":true,"source":"课件 p013","items":["单位速度函数定义：`f(t)={0, t<0; t, t≥0}`。","其拉普拉斯变换：`L[t]=∫₀^∞ te^{-st}dt=-1/s ∫₀^∞ t de^{-st}=1/s²`。","结论：`t ↔ 1/s²`。"]},{"id":"p-lapA-12","title":"指数函数及其拉氏变换","key":true,"source":"课件 p014","items":["指数函数表达式：`f(t)=e^{-at}`，式中 `a` 是常数。","其拉普拉斯变换：`L[e^{-at}]=∫₀^∞ e^{-at}e^{-st}dt=∫₀^∞ e^{-(s+a)t}dt=1/(s+a)`。"]},{"id":"p-lapA-13","title":"正弦信号函数及其拉氏变换","key":true,"source":"课件 p015","items":["正弦信号函数定义：`f(t)={0, t<0; sinωt, t≥0}`。","由欧拉公式，正弦函数表达为：`sinωt=1/(2j)(e^{jωt}-e^{-jωt})`。","其拉普拉斯变换：`L[sinωt]=1/(2j)∫₀^∞ (e^{jωt}-e^{-jωt})e^{-st}dt=1/(2j)(1/(s-jω)-1/(s+jω))=ω/(s²+ω²)`。"]},{"id":"p-lapA-14","title":"余弦信号函数及其拉氏变换","key":true,"source":"课件 p016","items":["余弦信号函数定义：`f(t)={0, t<0; cosωt, t≥0}`。","由欧拉公式，余弦函数表达为：`cosωt=1/2(e^{jωt}+e^{-jωt})`。","其拉普拉斯变换：`L[cosωt]=1/2∫₀^∞ (e^{jωt}+e^{-jωt})e^{-st}dt=1/2(1/(s-jω)+1/(s+jω))=s/(s²+ω²)`。"]},{"id":"p-lapA-15","title":"拉普拉斯变换简表（续4，序号17–19）","key":false,"source":"课件 p021","items":["17：`ω_n/√(1-ξ²)·e^{-ξω_n t}·sin(ω_n√(1-ξ²)t) ↔ ω_n²/(s²+2ξω_n s+ω_n²)`。","18：`1/(ω_n√(1-ξ²))·e^{-ξω_n t}·sin(ω_n√(1-ξ²)t) ↔ 1/(s²+2ξω_n s+ω_n²)`。","19：`-1/√(1-ξ²)·e^{-ξω_n t}·sin(ω_n√(1-ξ²)t-φ) ↔ s/(s²+2ξω_n s+ω_n²)`，其中 `φ=arctan(√(1-ξ²)/ξ)`。"]},{"id":"p-lapA-16","title":"拉普拉斯变换简表（续5，序号20–23）","key":false,"source":"课件 p022","items":["20：`1-1/√(1-ξ²)·e^{-ξω_n t}·sin(ω_n√(1-ξ²)t+φ) ↔ ω_n²/(s(s²+2ξω_n s+ω_n²))`，其中 `φ=arctan(√(1-ξ²)/ξ)`。","21：`1-cosωt ↔ ω²/(s(s²+ω²))`。","22：`ωt-sinωt ↔ ω²/(s(s²+ω²))`。","23：`t sinωt ↔ 2ωs/(s²+ω²)²`。"]},{"id":"p-lapA-17","title":"基本性质(1)：线性定理","key":true,"source":"课件 p023","items":["若 `α`、`β` 是任意两个**复常数**，且 `L[f₁(t)]=F₁(s)`，`L[f₂(t)]=F₂(s)`；","则：`L[αf₁(t)+βf₂(t)]=αF₁(s)+βF₂(s)`。","证明：按定义展开积分 `∫₀^∞ [αf₁(t)+βf₂(t)]e^{-st}dt=α∫₀^∞ f₁(t)e^{-st}dt+β∫₀^∞ f₂(t)e^{-st}dt=αF₁(s)+βF₂(s)`。"]},{"id":"p-lapA-18","title":"基本性质(2)：平移定理","key":true,"source":"课件 p024","items":["若 `L[f(t)]=F(s)`；","则：`L[e^{-at}f(t)]=F(s+a)`。","证明：`L[e^{-at}f(t)]=∫₀^∞ f(t)e^{-at}e^{-st}dt=∫₀^∞ f(t)e^{-(s+a)t}dt=F(s+a)`。"]},{"id":"p-lapA-19","title":"基本性质(3)：微分定理","key":true,"source":"课件 p025","items":["若 `L[f(t)]=F(s)`；","则：`L[df(t)/dt]=sF(s)-f(0)`，式中 `f(0)` 是 `t=0` 时的 `f(t)` 值。","证明：`L[df(t)/dt]=∫₀^∞ (df(t)/dt)e^{-st}dt=e^{-st}f(t)|₀^∞+s∫₀^∞ f(t)e^{-st}dt=sF(s)-f(0)`。","同理，二阶导数的拉普拉斯变换：`L[d²f(t)/dt²]=s²F(s)-sf(0)-df(0)/dt`。"]},{"id":"p-lapA-20","title":"微分定理推广到 n 阶导数","key":true,"source":"课件 p026","items":["推广到 `n` 阶导数的拉普拉斯变换：`L[d^n f(t)/dt^n]=s^n F(s)-s^{n-1}f(0)-s^{n-2}f'(0)-…-s f^{(n-2)}(0)-f^{(n-1)}(0)`。","如果函数 `f(t)` 及其各阶导数的**初始值均为零**，即 `f(0)=f'(0)=f''(0)=…=f^{(n-2)}(0)=f^{(n-1)}(0)=0`；","则：`L[d^n f(t)/dt^n]=s^n F(s)`。"]},{"id":"p-lapB-1","title":"积分定理","key":true,"source":"课件 p027","items":["若 `L[f(t)]=F(s)`，则积分定理：`L[∫f(t)dt]=(1/s)F(s)+(1/s)∫f(0)dt`","式中第二项 `∫f(0)dt` 表示函数 `f(t)` 积分的初始值（课件用粉框标出）","证明思路：由定义展开 `L[∫f(t)dt]=∫_0^∞[∫f(t)dt]·e^{-st}dt`，用分部积分法","取 `u=∫f(t)dt`、`dv=e^{-st}dt`，则 `dv` 积分得 `-(1/s)de^{-st}`，于是 `=∫_0^∞[∫f(t)dt]·(-1/s)de^{-st}`","分部积分后 `=[[∫f(t)dt]e^{-st}/(-s)]|_0^∞-∫_0^∞(e^{-st}/(-s))f(t)dt`","代入上下限整理得 `=(1/s)∫f(0)dt+(1/s)F(s)`，即积分定理成立"]},{"id":"p-lapB-2","title":"n 重积分的积分定理与用途","key":true,"source":"课件 p028","items":["同理，对于 `n` 重积分的拉普拉斯变换：`L[∫^{(n)}f(t)dt]=(1/s^n)F(s)+(1/s^n)∫f(0)dt+(1/s^{n-1})∫^{(2)}f(0)dt+⋯+(1/s)∫^{(n)}f(0)dt`","若函数 `f(t)` 各重积分的初始值均为零，则有 `L[∫^{(n)}f(t)dt]=(1/s^n)F(s)`","注：利用积分定理，可以求时间函数的拉普拉斯变换","注：利用微分定理和积分定理，可将微分-积分方程变为代数方程"]},{"id":"p-lapB-3","title":"终值定理","key":true,"source":"课件 p029","items":["若 `L[f(t)]=F(s)`，则 `lim_{t→∞}f(t)=lim_{s→0}sF(s)`","证明依据拉普拉斯变换的微分定理：`lim_{s→0}∫_0^∞[df(t)/dt]·e^{-st}dt=lim_{s→0}[sF(s)-f(0)]`","由于 `lim_{s→0}e^{-st}=1`，上式可写成 `∫_0^∞[df(t)/dt]dt=lim_{s→0}sF(s)-f(0)`","写出左式积分：`lim_{t→∞}f(t)-f(0)=lim_{s→0}sF(s)-f(0)`","两边约去 `f(0)`，即得终值定理 `lim_{t→∞}f(t)=lim_{s→0}sF(s)`"]},{"id":"p-lapB-4","title":"初值定理","key":true,"source":"课件 p030","items":["若 `L[f(t)]=F(s)`，则 `lim_{t→0}f(t)=lim_{s→∞}sF(s)`","证明依据拉普拉斯变换的微分定理：`lim_{s→∞}∫_0^∞[df(t)/dt]·e^{-st}dt=lim_{s→∞}[sF(s)-f(0)]`","由于 `lim_{s→∞}e^{-st}=0`，上式可写成 `0=lim_{s→∞}sF(s)-f(0)`","或者写成 `f(0)=lim_{s→∞}sF(s)`"]},{"id":"p-lapB-5","title":"卷积定理","key":true,"source":"课件 p031","items":["两个时间函数 `f_1(t)`、`f_2(t)` 卷积的拉普拉斯变换，等于这两个时间函数拉普拉斯变换的乘积","卷积定理：`L[∫_0^∞f_1(t-τ)f_2(τ)dτ]=F_1(s)F_2(s)`","式中 `L[f_1(t)]=F_1(s)`，`L[f_2(t)]=F_2(s)`","而 `∫_0^∞f_1(t-τ)f_2(τ)dτ=f_1(t)*f_2(t)`，称为函数 `f_1(t)` 与 `f_2(t)` 的卷积"]},{"id":"p-lapB-6","title":"拉普拉斯反变换的定义","key":true,"source":"课件 p032","items":["将象函数 `F(s)` 变换成与之相对应的原函数 `f(t)` 的过程，称为拉普拉斯反变换","其公式：`f(t)=(1/(2πj))∫_{a-j∞}^{a+j∞}F(s)e^{st}ds`","简写为 `f(t)=L^{-1}[F(s)]`","拉氏反变换的求算有多种方法：如果是简单的象函数，可直接查拉氏变换表","对于复杂的象函数，可利用部分分式展开法"]},{"id":"p-lapB-7","title":"反变换的线性分解思路","key":true,"source":"课件 p033","items":["如果把 `f(t)` 的拉氏变换 `F(s)` 分成各个部分之和：`F(s)=F_1(s)+F_2(s)+⋯+F_n(s)`","假若 `F_1(s)、F_2(s)、…、F_n(s)` 的拉氏反变换很容易由拉氏变换表查得，那么 `f(t)=L^{-1}[F(s)]=L^{-1}[F_1(s)]+L^{-1}[F_2(s)]+⋯+L^{-1}[F_n(s)]=f_1(t)+f_2(t)+⋯+f_n(t)`","当 `F(s)` 不能很简单地分解成各部分之和时，可采用部分分式展开将 `F(s)` 分解成各部分之和","然后对每一部分查拉氏变换表，得到其对应的拉氏反变换函数，其和就是要得的 `F(s)` 的反变换 `f(t)` 函数"]},{"id":"p-lapB-8","title":"部分分式展开法（有理真分式）","key":true,"source":"课件 p034","items":["在系统分析问题中，`F(s)` 常具有如下形式：`F(s)=A(s)/B(s)`","式中 `A(s)` 和 `B(s)` 是 `s` 的多项式，`B(s)` 的阶次较 `A(s)` 阶次要高","对于这种称为有理真分式的象函数 `F(s)`，分母 `B(s)` 应首先进行因子分解","只有先进行因子分解，才能用部分分式展开法得到 `F(s)` 的拉氏反变换函数"]},{"id":"p-lapB-9","title":"分母因子分解与极点","key":true,"source":"课件 p035","items":["将分母 `B(s)` 进行因子分解，写成：`F(s)=A(s)/B(s)=A(s)/[(s+p_1)(s+p_2)⋯(s+p_n)]`","式中 `p_1,p_2,…,p_n` 称为 `B(s)` 的根，或 `F(s)` 的极点","极点可以是实数，也可能为复数；如果是复数，则一定成对共轭","当 `A(s)` 的阶次高于 `B(s)` 时，应首先用分母 `B(s)` 去除分子 `A(s)`","由此得到一个 `s` 的多项式，再加上一项具有分式形式的余项，其分子 `s` 多项式的阶次就化为低于分母 `s` 多项式阶次了"]},{"id":"p-lapB-10","title":"无重根时的部分分式展开与留数","key":true,"source":"课件 p036","items":["分母 `B(s)` 无重根时，`F(s)` 总可以展成简单的部分分式之和","`F(s)=A(s)/B(s)=A(s)/[(s+p_1)(s+p_2)⋯(s+p_n)]=a_1/(s+p_1)+a_2/(s+p_2)+⋯+a_n/(s+p_n)`","式中 `a_k(k=1,2,…,n)` 是常数","系数 `a_k` 称为极点 `s=-p_k` 处的留数"]},{"id":"p-lapB-11","title":"留数的计算方法与共轭复留数","key":true,"source":"课件 p037","items":["`a_k` 的值可以用在等式两边乘以 `(s+p_k)`，并把 `s=-p_k` 代入的方法求出","两边乘以 `(s+p_k)` 后，除含有 `a_k` 的项外，其余项都消失了","因此留数 `a_k` 可由下式得到：`a_k=[(s+p_k)A(s)/B(s)]|_{s=-p_k}`","因为 `f(t)` 是时间的实函数，如 `p_1` 和 `p_2` 是共轭复数时，则留数 `α_1` 和 `α_2` 也必然是共轭复数，上式照样可以应用","共轭复留数中，只需计算一个复留数 `α_1`（或 `α_2`），而另一个复留数 `α_2`（或 `α_1`）自然也就知道了"]},{"id":"p-lapB-12","title":"分母有重根时的一般展开式","key":true,"source":"课件 p045","items":["若有重根，以三重根 `p_1` 为例，则 `F(s)` 的一般表达式为 `F(s)=A(s)/[(s+p_1)^3(s+p_2)(s+p_3)⋯(s+p_n)]`","展开为 `=α_{11}/(s+p_1)^3+α_{12}/(s+p_1)^2+α_{13}/(s+p_1)+α_2/(s+p_2)+α_3/(s+p_3)+⋯+α_n/(s+p_n)`","式中系数 `α_2,α_3,…,α_n` 仍按照无重根的方法（留数计算公式）求得","而重根的系数 `α_{11},α_{12},α_{13}` 可按专门的方法求得"]},{"id":"p-lapB-13","title":"重根系数的计算公式","key":true,"source":"课件 p046","items":["`α_{11}=[(s+p_1)^3F(s)]|_{s=-p_1}`","`α_{12}=[d/ds((s+p_1)^3F(s))]|_{s=-p_1}`","`α_{13}=(1/2!)[d^2/ds^2((s+p_1)^3F(s))]|_{s=-p_1}`","依此类推，当 `p_1` 为 `k` 重根时，其系数为 `α_{1m}=(1/(m-1)!)[d^{(m-1)}/ds^{(m-1)}((s+p_1)^kF(s))]|_{s=-p_1}`，`m=1,2,…,k`"]},{"id":"p-lapB-14","title":"用拉氏变换解微分方程的步骤","key":true,"source":"课件 p050","items":["采用拉氏反变换的方法，可以求得线性定常微分方程的全解（补解和特解）","求解微分方程可以采用数学分析方法（经典方法），也可以采用拉氏变换方法","采用拉氏变换法求解微分方程是带初值进行运算的，许多情况下应用更为方便","(1) 对给定的微分方程等式两端取拉氏变换，变微分方程为 `s` 变量的代数方程","(2) 对以 `s` 为变换的代数方程加以整理，得到微分方程求解的变量的拉氏表达式；对这个变量求拉氏反变换，即得在时域中（以时间 `t` 为参变量）微分方程的解"]}],"questions":[{"id":"q-lapA-1","kind":"例题","priority":1,"source":"课件例题","sourceDetail":"课件 p008","keyPoints":["复变函数的实部与虚部"],"stem":"当 `s=σ+jω` 时，求复变函数 `G(s)=s²+1` 的实部 `u` 和虚部 `v`。","given":["`s=σ+jω`，复变函数 `G(s)=s²+1`。"],"ask":["求复变函数 `G(s)` 的实部 `u` 和虚部 `v`。"],"steps":["代入 `s=σ+jω`：`G(s)=s²+1=(σ+jω)²+1`。","展开平方：`(σ+jω)²=σ²+2jσω+(jω)²=σ²+j2σω-ω²`，故 `G(s)=σ²+j(2σω)-ω²+1`。","按实部、虚部合并：`G(s)=(σ²-ω²+1)+j(2σω)`。"],"result":"实部 `u=σ²-ω²+1`，虚部 `v=2σω`。"},{"id":"q-lapB-1","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p039","keyPoints":["拉普拉斯反变换","部分分式展开法","无重根留数"],"stem":"求 `F(s)` 的拉氏反变换，已知 `F(s)=(s+3)/(s^2+3s+2)`","given":["`F(s)=(s+3)/(s^2+3s+2)`"],"ask":["求 `L^{-1}[F(s)]`"],"steps":["分母因式分解：`F(s)=(s+3)/(s^2+3s+2)=(s+3)/[(s+1)(s+2)]`","展成部分分式：`=(s+3)/[(s+1)(s+2)]=α_1/(s+1)+α_2/(s+2)`","由留数的计算公式，得 `α_1=[(s+1)(s+3)/((s+1)(s+2))]|_{s=-1}=2`","`α_2=[(s+2)(s+3)/((s+1)(s+2))]|_{s=-2}=2`","查拉氏变换表，对 `2/(s+1)`、`2/(s+2)` 分别取反变换"],"result":"`f(t)=2e^{-t}+2e^{-2t}`（课件 p039 已求出 `α_1=α_2=2`，查表即得）"},{"id":"q-lapB-2","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p042、p043、p044","keyPoints":["拉普拉斯反变换","共轭复极点","共轭复留数"],"stem":"已知象函数含共轭复极点 `F(s)=(2s+12)/[(s+1+j2)(s+1-j2)]`，求其拉氏反变换","given":["`F(s)=(2s+12)/[(s+1+j2)(s+1-j2)]=(2s+12)/(s^2+2s+5)`"],"ask":["求 `f(t)=L^{-1}[F(s)]`"],"steps":["由留数的计算公式，得 `α_1=[(s+1+j2)(2s+12)/((s+1+j2)(s+1-j2))]|_{s=-1-j2}`","`=[(2s+12)/(s+1-j2)]|_{s=-1-j2}=(2(-1-j2)+12)/((-1-j2)+1-j2)`","`=(-2-j4+12)/(-j4)=(10-j4)/(-j4)=(10j+4)/4=1+j(5/2)`","由于 `α_2` 与 `α_1` 共轭，故 `α_2=1-j(5/2)`","所以 `f(t)=L^{-1}[(1+j5/2)/(s+1+j2)]+L^{-1}[(1-j5/2)/(s+1-j2)]`","查拉氏变换表，得 `f(t)=(1+j5/2)e^{-(1+j2)t}+(1-j5/2)e^{-(1-j2)t}`","整理 `=e^{-(1+j2)t}+e^{-(1-j2)t}+j(5/2)[e^{-(1+j2)t}-e^{-(1-j2)t}]`","`=e^{-t}(e^{-j2t}+e^{j2t})+j(5/2)e^{-t}(e^{-j2t}-e^{j2t})`","`=2e^{-t}·(e^{j2t}+e^{-j2t})/2-j^2·5e^{-t}·(e^{j2t}-e^{-j2t})/(2j)`","利用欧拉公式得 `=2e^{-t}cos2t+5e^{-t}sin2t`"],"result":"`f(t)=2e^{-t}cos2t+5e^{-t}sin2t`"},{"id":"q-lapB-3","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p047、p048、p049","keyPoints":["拉普拉斯反变换","部分分式展开法","重根"],"stem":"已知 `F(s)`，求 `L^{-1}[F(s)]`，其中 `F(s)=(s^2+2s+3)/(s+1)^3`","given":["`F(s)=(s^2+2s+3)/(s+1)^3`"],"ask":["求 `L^{-1}[F(s)]`"],"steps":["展成部分分式：`F(s)=(s^2+2s+3)/(s+1)^3=α_{11}/(s+1)^3+α_{12}/(s+1)^2+α_{13}/(s+1)`","`p_1=-1`，`p_1` 有三重根","由上述公式：`α_{11}=[(s+1)^3(s^2+2s+3)/(s+1)^3]|_{s=-1}=2`","`α_{12}=[d/ds((s+1)^3(s^2+2s+3)/(s+1)^3)]|_{s=-1}=[2s+2]|_{s=-1}=0`","`α_{13}=(1/2!)[d^2/ds^2((s+1)^3(s^2+2s+3)/(s+1)^3)]|_{s=-1}=(1/2)[2]|_{s=-1}=1`","因此 `f(t)=L^{-1}[2/(s+1)^3]+L^{-1}[0/(s+1)^2]+L^{-1}[1/(s+1)]`","查拉氏变换表，有 `f(t)=t^2e^{-t}+0+e^{-t}=(t^2+1)e^{-t}`"],"result":"`f(t)=(t^2+1)e^{-t}`"},{"id":"q-lapB-4","kind":"计算","priority":1,"source":"课件题目","sourceDetail":"课件 p051","keyPoints":["拉氏变换解微分方程","初值代入","部分分式展开"],"stem":"利用拉氏变换解常系数线性微分方程","given":["微分方程 `d^2y(t)/dt^2+5dy(t)/dt+6y(t)=6`，其中 `dy(0)/dt=2`，`y(0)=2`"],"ask":["求 `y(t)`"],"steps":["将方程两边取拉氏变换：`s^2Y(s)-sy(0)-dy(0)/dt+5[sY(s)-y(0)]+6Y(s)=6/s`","将 `dy(0)/dt=2`、`y(0)=2` 代入，并整理，得 `Y(s)=(2s^2+12s+6)/[s(s+2)(s+3)]=1/s+5/(s+2)-4/(s+3)`","对 `Y(s)` 求拉氏反变换"],"result":"`y(t)=1+5e^{-2t}-4e^{-3t}`"}],"order":0,"images":{"2":{"w":"img/control-lap/p002.webp","j":"img/control-lap/p002.jpg"},"3":{"w":"img/control-lap/p003.webp","j":"img/control-lap/p003.jpg"},"4":{"w":"img/control-lap/p004.webp","j":"img/control-lap/p004.jpg"},"5":{"w":"img/control-lap/p005.webp","j":"img/control-lap/p005.jpg"},"6":{"w":"img/control-lap/p006.webp","j":"img/control-lap/p006.jpg"},"7":{"w":"img/control-lap/p007.webp","j":"img/control-lap/p007.jpg"},"8":{"w":"img/control-lap/p008.webp","j":"img/control-lap/p008.jpg"
