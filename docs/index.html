内热源平壁的微分方程与边界条件","children":[]},{"label":"内热源平壁温度呈抛物线分布","children":[]},{"label":"内热源平壁任一点热流密度 q=Φ̇x","children":[]},{"label":"2.5.2 具有内热源的圆柱体导热","children":[]},{"label":"有内热源圆柱体最高温度在圆心处","children":[]},{"label":"例题2-9 核反应堆燃料元件散热模型","children":[]},{"label":"例题2-9 半模型与热平衡求热流密度","children":[]},{"label":"例题2-9 由牛顿冷却公式求界面温度","children":[]},{"label":"有内热源不能用热阻概念分析","children":[]},{"label":"例题2-10 铀棒最高温度的迭代求解","children":[]},{"label":"导热系数随温度变需迭代修正","children":[]}]},{"label":"2-6 多维稳态导热问题的求解（课件未覆盖）","children":[]}]},"points":[{"id":"p-h2a-1","title":"第二章框架与本章学习重点","key":true,"source":"课件 p001–p002","items":["第 2 章标题为**稳态热传导的规律及计算**（英文 Steady-state heat conduction），目录含 2-1 导热基本定律---傅里叶定律、2-2 导热问题的数学描写、2-3 典型的一维稳态导热问题分析解、2-4 通过肋片的导热、2-5 具有内热源的一维稳态导热问题、2-6 多维稳态导热问题的求解共六节。","为解决工程中三类传热问题都需要：（1）能准确地预测所研究系统中的温度分布；（2）能准确地计算所研究问题中传递的热流。","导热问题是预测温度分布及根据温度分布计算热流的典型问题，这两个方面内容是本章学习的重点，其中预测温度分布是关键。","所以对各种情况的导热问题，首先要获得其温度分布，然后根据傅里叶定律获得热流密度的分布。"]},{"id":"p-h2a-2","title":"导热机理与导热系数大小规律","key":true,"source":"课件 p003","items":["**气体**：分子热运动，`t ↑ → λ ↑`；**导电固体**：自由电子运动；**非导电固体**：晶格振动，其量子化为声子（Phonon）；**液体**：分子热运动及晶格振动。","一般而言：`λ金属 > λ非金属`、`λ固相 > λ液相 > λ气相`。","两种新材料：气凝胶含有大量纳米级别的空隙，尺度小于气体平均自由程，彻底抑制气体导热，其导热系数小于空气。","石墨烯的导热系数包括自由电子及声子的贡献，但后者远大于前者，导热系数可高达 5000 W/（m·K）。"]},{"id":"p-h2a-3","title":"温度场的定义与分类","key":true,"source":"课件 p004–p005","items":["**温度场（Temperature field）**：各个时刻物体中各点温度值所组成的集合。","在微波炉加热过程中任意瞬间物体内各点的温度可以表示为 `t = f(x, y, z, τ)`。","按温度场随空间与时间的变化特性，可以区分为**稳态温度场** `t = f(x, y, z)` 与**非稳态温度场** `t = f(x, y, z, τ)`。","一维温度场：`t = f(x)`（稳态）、`t = f(x, τ)`（非稳态）；二维温度场：`t = f(x, y)`、`t = f(x, y, τ)`；三维温度场：`t = f(x, y, z)`、`t = f(x, y, z, τ)`。"]},{"id":"p-h2a-4","title":"等温线与等温面的定义及特点","key":true,"source":"课件 p005–p007","items":["**等温线（Isotherm）/等温面（Isothermal surface）**定义：同一瞬间温度相等的各点连成的线或面。","特点（1）：等温线（面）不能相交（同一点不可能有两个温度）；特点（2）：等温线（面）只能在物体边界中断或完全封闭。","基于上述特点（1）：根据物体中等温线的分布能判断局部热流密度的方向——局部导热热流密度与等温线垂直！","基于上述特点（2）：由等温线与界面的交角能判定界面是否绝热——如果等温线处处垂直于界面，该界面必为绝热面。","基于上述特点（3）：绘制等温线时如果相邻两根等温线温差保持相同，则等温线的疏密反映了局部热流密度的大小。","课件 p007 给出某角部结构的等温线分布图：外壁温度为 `T_wo`、内壁温度为 `T_wi`，图中标出**等温线**与**绝热边界**，左侧为**温度标尺**，色标数值由 3.00e+02 到 4.12e+02。"]},{"id":"p-h2a-5","title":"温度梯度的定义与表达式","key":true,"source":"课件 p008","items":["**梯度（Gradient）**：是向量，指向变化最剧烈的方向。","**温度梯度（Temperature gradient）**：某点所在等温线与相邻等温线之间的温差与其法线间距离之比取极限，指向温度升高的方向。","数学式：`lim(Δt/Δn)·n = grad(t) = (∂t/∂n)n`（Δn→0），其中 n 为等温面法线方向单位矢量。","直角坐标展开式：`grad(t) = (∂t/∂x)i + (∂t/∂y)j + (∂t/∂z)k`。"]},{"id":"p-h2a-6","title":"傅里叶定律的文字与数学表达","key":true,"source":"课件 p010–p011","items":["1822 年，法国数学家傅里叶（Fourier）在实验研究基础上，发现导热基本规律——**傅里叶定律（Fourier's law of heat conduction）**。","课件介绍：法国数学家 J.B.Fourier 是法国拿破仑时代的高级官员，曾于 1798-1801 追随拿破仑去埃及；1807 年提出了求解偏微分方程的分离变量法，提交了 234 页的论文，但直到 1822 年才出版（生卒 1768-1830）。","导热基本定律的文字表达：在导热现象中，单位时间内通过给定截面的热量，正比于垂直于该截面方向上的温度变化率和截面面积，方向与温度梯度相反。","导热基本定律的数学表达（矢量式）：`q = φ/A = -λ grad t = -λ(∂t/∂n)n`，其中 q 为热流密度矢量、φ 为热流量、A 为截面面积、n 为等温面法线方向单位矢量。","分量展开式：`q = (-λ∂t/∂x)i + (-λ∂t/∂y)j + (-λ∂t/∂z)k`。","实验定律，常规尺度问题普遍适用：变物性，内热源，非稳态，固、液、气。"]},{"id":"p-h2a-7","title":"傅里叶定律的要点与热流线","key":true,"source":"课件 p012–p013","items":["`q_x = -λ∂t/∂x`，`q_y = -λ∂t/∂y`，`q_z = -λ∂t/∂z` 是热流密度矢量在三个坐标轴方向的分量。","要点 1）**负号的含义**：热量传递方向指向温度降低方向，即与温度升高方向相反。","要点 2）热流密度矢量与等温线（面）垂直，方向与温度梯度相反；热流密度矢量的走向可用**热流线**来表示。","一旦温度分布已知，导热热流密度即可求出！","课件 p013 的算例图形给出热流线、等温线、`t₁ = 140 ℃` 与 `t₂ = 20 ℃` 两个界面以及对称面，并注明：等温线垂直于界面，界面绝热，对称面就是绝热面，此时 `∂t/∂n = 0`。","该图还注明：等温线最稠密，局部热流密度最大。"]},{"id":"p-h2a-8","title":"导热系数的定义与物理意义","key":true,"source":"课件 p015","items":["**导热系数（Thermal conductivity）**定义：`λ = |q|/|grad t|`。","物理意义：数值上等于单位温度梯度作用下的物体内所产生的热流密度的模，是标量，单位：W/(m·K)。","导热系数表征了物体导热本领的大小。","导热系数与物质种类及热力状态有关（温度，压力（气体）），与宏观物体的几何形状无关。"]},{"id":"p-h2a-9","title":"材料导热系数的数值范围与温度关系","key":true,"source":"课件 p016–p018","items":["课件 p016 给出**七大类材料的导热系数数值范围**图（纵坐标为 `λ/[W/(m·K)]`，范围 0.01~10000），图中列出气体（氮气、氦气、空气、二氧化碳）、建筑及绝热材料（纤维、木材、泡沫、纳米多孔材料）、液体（水银、水、油类）、非金属固体（氧化物、岩石、食品、橡胶）、合金（铝合金、青铜、钢、镍铬合金）、纯金属（银、铜、铁、锰）、非金属晶体（石墨烯、金刚石、石墨、碳化硅、铍氧化物、石英）等。","图中所附名称与 λ 数值表：石墨烯 5000、金刚石 2300、银 429、铜 399、青铜 52、水银 8.54、大理石 2.7、水 0.6、氦气 0.152、空气 0.026，单位 W/(m·K)。","课件 p017 给出**材料的导热系数随温度的变化**图，横坐标 `T/K` 取 200~1400，纵坐标 `λ/[W/(m·K)]` 取 0.01~10000，按固体（实线）、液体（长虚线）、气体（点线）分族，曲线包括不同类型金刚石、银、铜、铝、金、钨、铂、铁、铝氧化物、耐热玻璃、熔化石英、水、四氯化碳、水蒸汽、氮气、空气、氩气。","在温度变化范围不很宽情况下，工程材料的导热系数可表示为温度的线性函数：`λ = λ₀(1 + bt)`。","常用物质导热系数大小顺序：`λ金属 > λ非金属`；`λ固相 > λ液相 > λ气相`。","在常温（20℃）条件下课件列出：纯铜 `λ = 399 W/(m·K)`；纯铜 `λ = 36.7 W/(m·K)`；水 `λ = 0.599 W/(m·K)`；空气 `λ = 0.0259 W/(m·K)`。"]},{"id":"p-h2a-10","title":"保温与双层玻璃的思考题","key":true,"source":"课件 p019","items":["思考题一：冬天的棉被晒一晒、拍一拍，晚上睡觉就会觉得很暖和，为什么？原因是大量空气进入狭小的棉被空间内，自然对流不易展开，同时空气的导热系数低，能起到保温作用。","思考题二：北方寒冷地区，房屋都是双层玻璃，以利于保温。如何解释其道理？空气夹层越厚越好吗？","思考题二解答：北方冬季时间长、气温低，中空玻璃中的空气不流动减少对流换热作用；空气夹层太厚、空气空间大，引起流动，增大换热，不利于保温。"]},{"id":"p-h2a-11","title":"数学描写的构成与微分方程推导前提","key":true,"source":"课件 p020–p022","items":["求解导热问题的实质是获得温度场；为了从数学上获得导热物体温度场的解析表达式，需要建立物体温度分布函数应当满足的基本方程式——**导热微分方程**，即物体的温度分布应当满足的在空间上与时间上的一般变化关系式。","导热微分方程是所有导热物体都要满足的，为了将不同的问题区分开来，还必须规定与各个具体问题有关的条件，即**定解条件**。","导热微分方程与定解条件的组合就构成了不同导热问题的数学描写（Mathematical formulation）。","导热微分方程推导的基本依据：能量守恒原理（热力学第一定律）与导热傅立叶定律。","推导的基本方法：对微元体做热平衡。","物理问题及假设条件：对任一三维、非稳态有内热源（单位 W/m³，如化学反应能、电流生成热等，未必均匀）的导热物体，物性已知，设：（1）物体是各向同性的；（2）导热体与外界没有功的交换。"]},{"id":"p-h2b-1","title":"微元体能量平衡的建立","key":true,"source":"课件 p023–p024","items":["建立坐标系，取出一个微元体做能量平衡分析，先在直角坐标系中进行分析，微元体边长分别为 dx、dy、dz。","根据能量守恒原理，任一时间间隔内：导入微元体的净热量＋微元体内热源产生的热量＝微元体热力学能的增量。","沿 x 方向在 x 位置处导入微元体的热量按照傅里叶定律有 `Φ_x = -λ(∂t/∂x)dydz`。","沿 x 方向经 x+dx 表面导出微元体的热量 `Φ_{x+dx} = Φ_x + (∂Φ_x/∂x)dx`，代入傅里叶定律后 `= Φ_x + ∂/∂x(-λ ∂t/∂x · dydz)dx = Φ_x - ∂/∂x(λ ∂t/∂x)dxdydz`。"]},{"id":"p-h2b-2","title":"三方向净热量与内能增量","key":true,"source":"课件 p025–p026","items":["沿 x 轴方向导入微元体的净热量 `Φ_x - Φ_{x+dx} = ∂/∂x(λ ∂t/∂x)dxdydz`。","同理可得，沿 y 轴方向导入微元体的净热量 `Φ_y - Φ_{y+dy} = ∂/∂y(λ ∂t/∂y)dxdydz`。","沿 z 轴方向导入微元体的净热量 `Φ_z - Φ_{z+dz} = ∂/∂z(λ ∂t/∂z)dxdydz`。","故得单位时间内导入微元体的净热量 `Φ_c = [∂/∂x(λ ∂t/∂x) + ∂/∂y(λ ∂t/∂y) + ∂/∂z(λ ∂t/∂z)]dxdydz`。","单位时间内微元体内热源生成的热量即内热源项 `Φ_V = Φ̇dxdydz`。","单位时间内微元体热力学能（内能）的增量 `ΔU = ρc(∂t/∂τ)·dxdydz`。"]},{"id":"p-h2b-3","title":"导热微分方程基本形式","key":true,"source":"课件 p027","items":["代入能量平衡式，(1) + (2) = (3)，得导热微分方程的基本形式 `ρc ∂t/∂τ = ∂/∂x(λ ∂t/∂x) + ∂/∂y(λ ∂t/∂y) + ∂/∂z(λ ∂t/∂z) + Φ̇`。","式中 `ρc ∂t/∂τ` 为非稳态项（Transient term），表示热力学能增量。","三个坐标方向的导热项（扩散项，Diffusion term）`∂/∂x(λ ∂t/∂x) + ∂/∂y(λ ∂t/∂y) + ∂/∂z(λ ∂t/∂z)` 表示三个坐标方向导入的净热量。","`Φ̇` 为内热源项（Source term）。","三维非稳态导热微分方程是所有导热物体的温度都要满足的普遍关系式。"]},{"id":"p-h2b-4","title":"几种简化情形与热扩散率","key":true,"source":"课件 p028–p030","items":["情形 1：λ=constant 时 `∂t/∂τ = λ/(ρc)(∂²t/∂x² + ∂²t/∂y² + ∂²t/∂z²) + Φ̇/(ρc)`。","`a = λ/(ρc)` 称为热扩散率（Thermal diffusivity）或导温系数，单位 m²/s，是物性参数。","情形 2：λ=constant 并且无内热源，`∂t/∂τ = a(∂²t/∂x² + ∂²t/∂y² + ∂²t/∂z²) = a∇²t`，其中 ∇² 为 Laplace 算子。","情形 3：λ=constant 而且稳态（Steady），`∇²t + Φ̇/λ = 0`，即 `∇²t = -Φ̇/λ`，称为 Poisson 方程。","情形 4：λ=constant、稳态而且无内热源，`∂²t/∂x² + ∂²t/∂y² + ∂²t/∂z² = 0`，即 `∇²t = 0`，称为 Laplace 方程。","情形 5：λ=constant、稳态而且一维，`d²t/dx² + Φ̇/λ = 0`。","情形 6：λ=constant、稳态、无内热源而且一维，`d²t/dx² = 0`。","热扩散率 `a = λ/(ρc_p)` 的物理意义：分子越大在相同的温度梯度下传导的热量越多，分母越小温升 1 度所需的热量越少，比值表示物体被加热或冷却时物体内部温度趋于一致的能力，故以前称为导温系数。","常温下热扩散率数值举例：碳钢 1.15×10⁻⁵ m²/s，硬木 1.77×10⁻⁷ m²/s。"]},{"id":"p-h2b-5","title":"圆柱与球坐标系微分方程","key":true,"source":"课件 p031–p032","items":["圆柱坐标系（r, φ, z）（Cylindrical coordinate）与直角坐标的换算关系为 `x = r cos φ; y = r sin φ; z = z`。","圆柱坐标系中的导热微分方程为 `ρc ∂t/∂τ = (1/r)∂/∂r(λr ∂t/∂r) + (1/r²)∂/∂φ(λ ∂t/∂φ) + ∂/∂z(λ ∂t/∂z) + Φ̇`。","球坐标系（r, θ, φ）（Spherical coordinate）与直角坐标的换算关系为 `x = r sin θ cos φ; y = r sin θ sin φ; z = r cos θ`。","球坐标系中的导热微分方程为 `ρc ∂t/∂τ = (1/r²)∂/∂r(λr² ∂t/∂r) + (1/(r² sin θ))∂/∂θ(λ sin θ ∂t/∂θ) + (1/(r² sin²θ))∂/∂φ(λ ∂t/∂φ) + Φ̇`。"]},{"id":"p-h2b-6","title":"定解条件的定义","key":true,"source":"课件 p033","items":["2.2.2 定解条件：导热微分方程式描写物体的温度随时间和空间变化的通用关系，没有涉及具体、特定的导热过程。","例如 Laplace 方程 `∂²t/∂x² + ∂²t/∂y² = 0` 就有无穷多个解。","要将适合于某个特定问题的解唯一地确定下来，需补充定解条件，导热问题完整的数学描述包括「导热微分方程 + 定解条件」。","定解条件定义：使得微分方程获得某一特定问题唯一解的附加条件，分为初始条件和边界条件。"]},{"id":"p-h2b-7","title":"初始条件","key":true,"source":"课件 p034","items":["初始条件（initial condition）——给定初始时刻物体中的温度分布：`τ = 0, t = f(x, y, z)`。","例如对烧红的铁块：`τ = 0, t = f(x, y, z) = 1150 ℃`。","边界条件（Boundary condition）——给定边界上导热物体的热条件，常见的边界条件有三类。"]},{"id":"p-h2b-8","title":"第一类边界条件","key":true,"source":"课件 p035","items":["第一类边界条件：规定边界上的温度分布，即 `t_w = f(τ)`。","例如对一厚度为 δ 的平板：左侧壁温 t_w1、右侧壁温 t_w2，数学表达为 `x = 0, t = t_w1; x = δ, t = t_w2`。"]},{"id":"p-h2b-9","title":"第二类边界条件","key":true,"source":"课件 p036","items":["第二类边界条件：给定边界上的热流密度，即 `-λ ∂t/∂n|_w = f(τ) = q_w`。","这里 n 是所论壁面的外法线。","对厚度为 δ 的平板情形，数学表达式为 `x = δ, -λ ∂t/∂x|_w = q_w`。"]},{"id":"p-h2b-10","title":"第三类边界条件","key":true,"source":"课件 p037–p038","items":["第三类边界条件：给定了边界上物体与周围流体间的表面传热系数以及流体温度。","对固体表面内，按傅里叶导热定律 `q_w = -λ(∂t/∂n)_w`；对固体表面外，按牛顿冷却公式 `q_w = h(t_w - t_f)`。","根据能量守恒原理，得第三类边界条件的一般表达式 `-λ ∂t/∂n|_w = h(t_w - t_f)`。","对平板情形得 `x = δ, -λ ∂t/∂x = h(t_w - t_f)`。","其它边界条件之一（a）辐射边界条件：`-λ ∂T/∂n|_w = εσ(T_w⁴ - T_e⁴)`，对应太空中热表面向外散热的情形。","其它边界条件之二（b）界面连续条件：`t₁ = t₂` 且 `(λ ∂t/∂n)₁ = (λ ∂t/∂n)₂`。"]},{"id":"p-h2b-11","title":"稳态导热与一维问题分类","key":true,"source":"课件 p040","items":["2.3 典型一维稳态导热问题的分析解：稳态导热基本特点是温度不随时间而变化，即 `∂t/∂τ = 0`。","分别介绍四种典型的一维几何形状问题：通过平壁的导热（直角坐标一维问题）。","通过圆筒壁的导热（圆柱坐标一维问题）。","通过球壳的导热（球坐标一维问题）。","变截面一维问题。"]},{"id":"p-h2b-12","title":"单层平壁导热的数学描写","key":true,"source":"课件 p041","items":["2.3.1 通过平壁的导热·1. 单层平壁导热问题分析解。","条件：1 维，稳态，无内热源，λ 为常数，两侧均为第一类边界。","问题图示：平板厚度为 δ，坐标为 0 到 δ，左侧面温度 t₁、右侧面温度 t₂。","数学描写：`d²t/dx² = 0`；`x = 0, t = t₁`；`x = δ, t = t₂`。"]},{"id":"p-h2b-13","title":"平壁温度分布与热流量","key":true,"source":"课件 p042–p043","items":["对微分方程直接积分两次，得微分方程的通解：`dt/dx = c₁ ⇒ t = c₁x + c₂`。","利用两个边界条件：`x = 0, t = t₁ ⇒ c₂ = t₁`；`x = δ, t = t₂ ⇒ c₁ = (t₂ - t₁)/δ`。","将两个积分常数代入通解，可得平壁内的温度分布 `t = t₁ - (t₁ - t₂)x/δ`，该线性分布与 λ 无关。","利用傅里叶导热定律可得通过平壁的热流量 `q = -λ dt/dx = (t₁ - t₂)/(δ/λ) = Δt/(δ/λ)`，单位 W/m²。","通过平壁的总热流量 `Φ = -λA dt/dx = λA(t₁ - t₂)/δ = Δt/(δ/(λA))`，单位 W。","根据傅里叶定律已知其中三个量就可以求出第四个量，例如稳态法测定导热系数：`λ = Φδ/(ΔtA)`。"]},{"id":"p-h2b-14","title":"热阻与热阻图","key":true,"source":"课件 p044","items":["热阻与热阻图：`q = (t₁ - t₂)/(δ/λ) = Δt/r`，单位面积热阻 `r = δ/λ`，热阻单位为 m²K/W。","`Φ = (t₁ - t₂)/(δ/(λA)) = Δt/R`，总面积热阻 `R = δ/(λA)`，热阻单位为 K/W。","热阻单位 K/W 表明每传递 1W 功率需要多少度温差，电子器件冷却技术分析中常用之。","热阻图用一个热阻 R 连接温度节点 t₁ 与 t₂，热量 Φ 从 t₁ 流向 t₂。"]},{"id":"p-h2c-1","title":"多层平壁导热的热阻分析法","key":true,"source":"课件 p045","items":["**多层平壁**：由几层导热系数不同材料组成的复合平壁，先假设最外侧均为第一类边界。","可采用**热阻**的概念进行分析。","假定**层间接触热阻为零**，**稳态**、**无内热源**，则通过各层的热流量相等：等于总温差与串连各层的总热阻之比。","通过两层平壁时 `q=(t₁-t₂)/(δ₁/λ₁)=(t₂-t₃)/(δ₂/λ₂)=(t₁-t₃)/(δ₁/λ₁+δ₂/λ₂)`。"]},{"id":"p-h2c-2","title":"n层平壁热流密度与层间温度","key":true,"source":"课件 p046","items":["热阻图：`T₁`—`R_A`—`T₂`—`R_B`—`T₃` 依次串连，热流量 `Φ` 由左向右。","对 `n` 层平壁：`q=(t₁-t_{n+1})/(∑_{i=1}^{n} δ_i/λ_i)`。","获得 `q` 后再计算层间温度：`t_{i+1}=t_i-qδ_i/λ_i`。","讨论：如果采用单层壁的求解方法，须先暂时设定 `t₂,t₃`，对三层平壁分别求解，然后利用界面连续性条件得出层间温度，十分繁琐。利用物理概念求解，大为简化！"]},{"id":"p-h2c-3","title":"两侧第三类边界时的多层平壁","key":true,"source":"课件 p047","items":["再讨论其他条件不变，两侧为**第三类边界**的情形。","仿照上述思想，只要把两个表面的对流换热热阻叠加进去并把温差改为两流体的温差。","`q=(t_{f1}-t_{f2})/(1/h₁+∑_{i=1}^{n} δ_i/λ_i+1/h₂)`。","对应热阻图由 `t_{f1}`、`1/h₁`、`t_{w1}`、`R₁`、`t_{w2}`、`R₂`、`t_{w3}`、`R₃`、`t_{w4}`、`1/h₂`、`t_{f2}` 串连组成。"]},{"id":"p-h2c-4","title":"例题2-1 珍珠岩炉墙已知条件","key":true,"source":"课件 p048","items":["**例题 2-1**：锅炉炉墙用保温材料水泥珍珠岩制成。","其导热系数与温度的关系按下式变化：`{λ̄}_{W/(m·K)}=0.0651+0.000105{t̄}_℃`。","`ρ=300 kg/m³`，`δ=120 mm`，`t₂=50 ℃`，`t₁=500 ℃`。","求：每平方米炉墙每小时的热损失。"]},{"id":"p-h2c-5","title":"例题2-1 平均温度与平均导热系数","key":true,"source":"课件 p049","items":["**假设**：（1）一维问题；（2）稳态导热。","**分析**：水泥珍珠岩制品的导热系数是导热物体平均温度的函数，因此需按炉墙平均温度下的导热系数计算热流量；为求平均导热系数需算出材料的平均温度。","平均温度 `t̄=(500 ℃+50 ℃)/2=275 ℃`。","平均导热系数 `λ̄=(0.0651+0.000105×275) W/(m·K)=0.094 0 W/(m·K)`。"]},{"id":"p-h2c-6","title":"例题2-1 热流密度计算与讨论","key":true,"source":"课件 p050","items":["单层平壁导热 `q=-λ dt/dx=(t₁-t₂)/(δ/λ)`。","代入数值得 `q=(λ/δ)(t₁-t₂)=(0.094 0 W/(m·K))/(0.120 m)×(500 ℃-50 ℃)=353 W/m²`。","**讨论**：对水泥珍珠岩这类在一定的温度范围内导热系数与温度成线性关系的材料，工厂提供的导热系数计算式中的温度都是指计算范围内的平均值。","使用这类材料时要注意其**最高的允许使用温度**。"]},{"id":"p-h2c-7","title":"例题2-2 三层平壁已知条件","key":true,"source":"课件 p051","items":["**例题2-2**：一个三层平壁结构，里面是耐火粘土砖，厚 115m；中间是 **B级硅藻土砖**，厚 125 mm；最外层为石棉板，厚 70 mm。","内、外表面温度分别为 495 ℃ 和 60 ℃。","求：每平方米炉墙每小时的热损失及耐火粘土砖与硅藻土砖分界面上的温度。","右侧给出温度沿厚度下降的分布示意与由 `t₁ r₁ t₂ r₂ t₃ r₃ t₄` 组成的热阻串连图。"]},{"id":"p-h2c-8","title":"变导热系数多层壁的迭代法","key":true,"source":"课件 p052–p054","items":["**假设**：（1）一维问题；（2）稳态导热；（3）无接触热阻。","**分析**：耐火黏土砖以及B级硅藻土的导热系数都是温度的函数，按平均温度计算其导热系数时需要知道层间温度，而层间温度本身是待求解的，因此需要采用**迭代法（Iteration method）**：即先估计各层的平均温度，算出导热量，再验算假设的温度正确与否。","假设界面温度为 `t₂,t₃`，各层平均温度 `t₁₂=(t₁+t₂)/2`，`t₂₃=(t₂+t₃)/2`，`t₃₄=(t₃+t₄)/2`（1）。","各层导热系数 `λ̄₁=a₁+b₁t₁₂`，`λ̄₂=a₂+b₂t₂₃`，`λ̄₃=a₃+b₃t₃₄`（2）。","由式（3）计算 `q=(t₁-t₄)/(δ₁/λ₁+δ₂/λ₂+δ₃/λ₃)`；再由 `q` 计算层间温度 `t₂″=t₁-qδ₁/λ₁`（4）、`t₃″=t₂-qδ₂/λ₂`（5）。","再代入式（1）计算平均温度 `t₁₂=(t₁+t₂″)/2`、`t₂₃=(t₂″+t₃″)/2`、`t₃₄=(t₃″+t₄)/2`，重新开始迭代计算，直到预估值与计算结果的偏差在一定的允许范围内。","经过数次迭代计算得到 `λ₁=1.12 W/(m·K)`，`λ₂=0.116 W/(m·K)`，`λ₃=0.116 W/(m·K)`。"]},{"id":"p-h2c-9","title":"例题2-2 热流密度与界面温度结果","key":true,"source":"课件 p055","items":["得热流密度 `q=(t₁-t₄)/(δ₁/λ₁+δ₂/λ₂+δ₃/λ₃)`。","`q=(495 ℃-60 ℃)/((0.115 m)/(1.12 W/(m·K))+(0.125 m)/(0.116 W/(m·K))+(0.115 m)/(0.116 W/(m·K)))=435/1.78 W/m²=244 W/m²`。","耐火粘土砖与硅藻土砖分界面的温度 `t₂=t₁-qδ₁/λ₁=495 ℃-244 W/m²×(0.115 m)/(1.12 W/(m·K))=470 ℃`。"]},{"id":"p-h2c-10","title":"例题2-3 水垢灰垢的单位面积热阻","key":true,"source":"课件 p056–p057","items":["**例题 2-3**：三种材料的导热系数为 钢板 `46.4 W/(m·K)`、水垢 `1.16 W/(m·K)`、灰垢 `0.016 W/(m·K)`，`δ=1 mm`。","求：1mm钢板、水垢及灰垢的单位面积热阻。假设：（1）一维；（2）稳态问题。","平板的单位面积导热热阻为 `r=δ/λ`。","钢板 `r=(1×10⁻³ m)/(46.4 W/(m·K))=2.16×10⁻⁵ m²·K/W`；水垢 `r=(1×10⁻³ m)/(1.16 W/(m·K))=8.62×10⁻⁴ m²·K/W`；灰垢 `r=(1×10⁻³ m)/(0.116 W/(m·K))=8.62×10⁻³ m²·K/W`。","**讨论**：1 mm 厚水垢的热阻相当于 40 mm 厚钢板的热阻，而 1 mm 厚灰垢的热阻相当于 400 mm 厚钢板的热阻。在换热器的运行过程中保持换热表面的干净十分重要。"]},{"id":"p-h2c-11","title":"例题2-4 钢柱按一维导热处理","key":true,"source":"课件 p058–p059","items":["**例题 2-4**：钢柱直径 `d=30mm`，长度 `L=300mm`，导热系数 `λ=50W/(m·K)`，其两个端面分别为持在 60 ℃ 与 20 ℃，四周为保温材料。求通过钢柱的导热量。","**分析**：钢柱四周绝热，温度仅沿着轴线方向变化，相当于一维导热问题。假设：（1）一维；（2）稳态问题。","计算 `Φ=λA Δt/δ=50 W/(m·K)×(3.14×0.025² m²)/4×(60-20)K/0.3m=3.27W`。","**讨论**：对通过一个物体的导热，如果温度仅在某个方向发生变化，就可以作为该方向的一维导热问题处理；至于物体截面积则可大可小，截面也未必是方形的。","以前文献中常有“通过无限大平板的导热”的提法，其实“无限大”只是为“一维”创造条件，并不十分确切。"]},{"id":"p-h2c-12","title":"单层圆筒壁导热的分析解","key":true,"source":"课件 p061–p064","items":["**2.3.2 通过圆筒壁的导热**：当温度仅沿着半径方向变化时，通过管壁的导热是圆柱坐标系上的一维导热问题。","圆柱坐标系导热微分方程 `ρc ∂t/∂τ=(1/r)∂/∂r(λr ∂t/∂r)+(1/r²)∂/∂φ(λ ∂t/∂φ)+∂/∂z(λ ∂t/∂z)+Φ`。","条件：**1D，稳态，无内热源，λ为常数，两侧均为第一类边界**；数学描述为 `d/dr(r dt/dr)=0`，`r=r₁,t=t₁`，`r=r₂,t=t₂`。","对微分方程做两次积分得到通解 `t=c₁ ln r+c₂`；利用两个边界条件得 `c₁=(t₂-t₁)/ln(r₂/r₁)`，`c₂=t₁-ln r₁·(t₂-t₁)/ln(r₂/r₁)`。","圆筒壁内的温度分布 `t=t₁+(t₂-t₁)/ln(r₂/r₁)·ln(r/r₁)`，**圆筒壁中的温度分布是对数曲线**。","通过圆筒壁的热流量 `Φ=-λA dt/dr=-λ2πrl(-(t₁-t₂)/ln(r₂/r₁)·1/r)=(t₁-t₂)/((1/2πλl)ln(r₂/r₁))=(t₁-t₂)/R`。"]},{"id":"p-h2c-13","title":"圆筒壁的热阻与热流密度","key":true,"source":"课件 p065","items":["通过长为 `l` 的整个圆筒壁导热的热阻 `R=Δt/Φ=ln(r₂/r₁)/(2πlλ)`，括号内注明**几何尺度只与半径比有关！**","该热阻在热阻图上标注为**总面积热阻**，两端为 `t₁`、`t₂`，热流量为 `Φ`。","通过圆筒壁的稳态导热过程中 `Φ=2πrlq=const`。","热流密度 `q=Φ/2πrl ∝ 1/r`，即热流密度沿半径按 1/r 规律变化。"]},{"id":"p-h2c-14","title":"多层圆筒壁的导热","key":true,"source":"课件 p066","items":["**2. 通过多层圆筒壁的导热**：采用热阻的概念进行分析。","在**稳态**、**无内热源**的情况下，通过各层的热流量相等；假定**无接触热阻**，层间温度连续。","`Φ=(t₁-t₂)/((1/2πλ₁l)ln(r₂/r₁))=(t₂-t₃)/((1/2πλ₂l)ln(r₃/r₂))=(t₃-t₄)/((1/2πλ₃l)ln(r₄/r₃))`。","总热流量 `Φ=(t₁-t₄)/((1/2πλ₁l)ln(r₂/r₁)+(1/2πλ₂l)ln(r₃/r₂)+(1/2πλ₃l)ln(r₄/r₃))`。","对应热阻图由 `t₁ R₁ t₂ R₂ t₃ R₃ t₄` 串连组成，热流量为 `Φ`。"]},{"id":"p-h2d-1","title":"例题2-5 蒸汽管道保温层计算","key":true,"source":"课件 p067","items":["例题 2-5：外径为 133 mm 的蒸汽管道外覆盖保温层，蒸汽管外壁温度为 400 ℃，外侧温度不得超过 50 ℃，并每米长管道的热损失 `Φ/l` 应控制在 465 W/m 之下（该数值由课件 p069 计算式中的 `465` 得到）。保温材料为水泥珍珠岩，保温层厚度应为多少毫米？","假设（1）：圆柱坐标的一维问题。","假设（2）：稳态导热。","假设（3）：导热系数为温度的线性函数。","计算：材料的平均温度为 `t̄ = (400 ℃+50 ℃)/2 = 225 ℃`。"]},{"id":"p-h2d-2","title":"导热系数与对数直径公式","key":true,"source":"课件 p068","items":["导热系数（附录 4）：`{λ̄}_{W/(m·K)} = 0.0651+0.000 105{t̄}_{℃} = 0.0651+0.000 105×225`。","由上式算得 `λ̄ = 0.088 7 W/(m·K)`。","圆筒壁导热公式：`ln(d₂/d₁) = (2πλ)/(Φ/l)(t₁-t₂)`。","改写成便于求外径的形式：`ln{d₂}_m = (2πλ)/(Φ/l)(t₁-t₂) + ln{d₁}_m`。","说明：`ln{d₂}_m` 表示以米（m）为单位的外直径数值的对数，这是国标规定的表述方式。"]},{"id":"p-h2d-3","title":"保温层厚度结果与讨论","key":true,"source":"课件 p069","items":["代入数值：`ln{d₂}_m = (2π×0.087)/465×(400-50) + ln 0.133 = 0.419-2.02 = -1.601`。","由对数值求得外径 `d₂ = 0.202 m`。","保温层厚度为 `δ = (d₂-d₁)/2 = (0.202 m-0.133 m)/2 = 34 mm`。","讨论：根据已知条件的不同，导热热流量计算式可以计算热流量、导热层厚度及表面温度（或温差）。本题是计算导热层厚度的例子。"]},{"id":"p-h2d-4","title":"球壳一维稳态导热的数学描述","key":true,"source":"课件 p071","items":["2.3.3 通过球壳的导热：内、外半径分别为 `r₁`、`r₂`，球壳材料的导热系数为常数，无内热源，球壳内、外侧壁面分别维持均匀恒定的温度 `t₁`、`t₂`。","球坐标下的导热微分方程：`ρc ∂t/∂τ = (1/r²)∂/∂r(λr² ∂t/∂r) + (1/(r² sin θ))∂/∂θ(λ sin θ ∂t/∂θ) + (1/(r² sin²θ))∂/∂φ(λ ∂t/∂φ) + Φ̇`。","1. 数学描述：`d/dr(r² dt/dr) = 0`。","边界条件：`r = r₁, t = t₁`；`r = r₂, t = t₂`。"]},{"id":"p-h2d-5","title":"球壳的温度分布热流量与热阻","key":true,"source":"课件 p072","items":["（1）温度分布：`t = t₂ + (t₁-t₂)/(1/r₁-1/r₂)·(1/r - 1/r₂)`。","（2）热流量：`Φ = 4πλ(t₁-t₂)/(1/r₁-1/r₂) = (t₁-t₂)/((1/r₁-1/r₂)/4πλ)`。","（3）热阻：`R = (1/4πλ)(1/r₁-1/r₂)`。"]},{"id":"p-h2d-6","title":"第二三类边界条件一维导热例题","key":true,"source":"课件 p073–p074","items":["2.3.4 第二、三类边界条件一维导热问题：一个电熨斗电功率为 1200 W，底面竖直置于环境温度为 25 ℃ 的房间中，金属底板厚为 5 mm，导热系数 `λ = 15 W/(m·K)`，底板面积 `A = 300 cm²`，考虑辐射作用在内的表面传热系数 `h = 80 W/(m²·K)`（该数值由课件 p076 计算式得出），今要确定稳态时底板两表面的温度。","假设（1）：电熨斗绝热层的性能良好，加热器的功率全部通过底板散到环境中去。","假设（2）：忽略底板四周厚度方向的侧面散热。","分析：这个问题可近似处理为一维平板导热，底板右侧为对流换热边条件，左侧为给定热流密度边界条件。","热流密度的数值为 `q₀ = 1200W/0.03m² = 40000W/m²`。","将坐标原点设于底板右侧，问题的数学描写为：`d²t/dx² = 0`；`x = 0, -λ dt/dx = q₀`；`x = δ, -λ dt/dx = h(t-t_∞)`。"]},{"id":"p-h2d-7","title":"电熨斗例题的求解过程","key":true,"source":"课件 p075","items":["此微分方程的通解为：`t = c₁x + c₂`。","代入第一个边界条件 `x = 0, -λ dt/dx = q₀` 得 `-λc₁ = q₀`，`c₁ = -q₀/λ`。","代入第二个边界条件 `x = δ, -λ dt/dx = h(t-t_∞)` 得 `-λc₁ = h[(c₁δ+c₂)-t_∞]`。","解得 `c₂ = t_∞ - (c₁λ)/h - c₁δ = t_∞ + q₀/h + (q₀/λ)δ`。","得温度分布为：`t = t_∞ + q₀((δ-x)/λ + 1/h)`。","讨论：与第一类边界条件求解的区别在于确定任意常数 `c₁`、`c₂` 所利用的条件不同。"]},{"id":"p-h2d-8","title":"底板两表面温度计算结果","key":true,"source":"课件 p076","items":["`t_{x=δ} = t_∞ + q₀(0+1/h) = 25 ℃ + 40000W/m² × 1/(80W/(m²·K)) = 525 ℃`。","`t_{x=0} = t_∞ + q₀(δ/λ + 1/h) = 25 ℃ + 40000W/m² [0.005m/(15W/(m·K)) + 1/(80W/(m²·K))] = 538 ℃`。"]},{"id":"p-h2d-9","title":"传热过程与增加传热量的措施","key":true,"source":"课件 p077","items":["传热过程的热流量：`Φ = (t_f1-t_f2)/(1/(Ah₁) + δ/(Aλ) + 1/(Ah₂))`。","为了增加传热量可以采取的措施（1）：增加温差 `(t_f1-t_f2)`，但受工艺条件限制。","措施（2）减小热阻：a) 金属壁一般很薄（`δ` 很小）、导热率很大，故导热热阻一般可忽略；b) 增大 `h₁`、`h₂`，但提高 `h₁`、`h₂` 并非任意的；c) 增大换热面积 `A` 也能增加传热量。"]},{"id":"p-h2d-10","title":"2.4.1 肋片的作用与应用实例","key":true,"source":"课件 p078–p079","items":["2.4 通过肋片的导热；2.4.1 肋片的作用与主要研究问题。","肋片（Fin，又称翅片）是指依附于基础表面上的扩展表面，主要用于增加对流换热表面积，以减小该侧的热阻；广泛应用于各类换热器中，气体侧应用尤广。","课件给出的肋片图例包括：针肋、等截面直肋、环肋、大套片。","工程技术中应用肋片的一些例子：摩托车气缸外的散热片、冷却计算机 CPU 的散热器翅片、正在测试性能的 LED 灯的散热器利用多个翅片进行自然对流散热、汽车空调冷凝器的翅片。"]},{"id":"p-h2d-11","title":"肋片形状与主要研究问题","key":true,"source":"课件 p080–p081","items":["常见肋片的形状包括：(a) 矩形 (b) 圆柱形 (c) 三角形 (d) 圆锥形 (e) 圆环形 (f) 大套片。","对通过肋片的导热主要研究的问题是：1. 肋片中的温度沿着热量传递方向如何变化（温度分布）；2. 通过肋片散失（或得到）的热流量是多少？","其中温度分布是关键，知道了温度分布，就可按 Fourier 定律计算热流量。","前面分析的例题中在热量传递路径上导热量处处相等，而在肋片的传递过程中热流量处处变化，右图示为逐步减小的情形，因此肋片中的温度分布需要另做分析。","对复杂的工程传热问题经过适当简化建立起合理的物理与数学模型，运用已有的数学及传热学知识进行求解的方法就是绪论中所说的分析解法；肋片是本课程中分析解法的第一个例子。"]},{"id":"p-h2d-12","title":"等截面直肋的四条简化假设","key":true,"source":"课件 p082–p083","items":["2.4.2 通过等截面直肋导热的分析和计算；物理问题：确定肋片中的温度分布与肋片的散热量。","简化假设（1）：肋片的 `λ`、`h` 均为常数。","简化假设（2）：设肋片温度垂直于纸面方向不变化，取出一个截面来分析，由 3D 简化为 2D。","简化假设（3）：设肋片的导热系数比较大，因而 `1/h >> δ/λ`，沿肋片厚度方向温度可设为均匀，由 2D 简化为 1D。","简化假设（4）：肋片顶端可以认为是绝热，即 `dt/dx|_{x=H} = 0`，沿 Y 方向无导热。","由 2D 简化为 1D 的顶端绝热的计算模型中，微元体上有导入 `Φ_x`、导出 `Φ_{x+dx}` 与侧面散热 `Φ_s`。"]},{"id":"p-h2d-13","title":"等截面直肋的物理模型","key":true,"source":"课件 p084","items":["1. 建立物理模型 1)：肋片垂直于纸面方向（长度方向）很长，不考虑该方向温度变化，故可取单位长度分析。","2)：肋片根部与肋基接触良好，温度一致 `t₀`。","3)：材料导热系数 `λ` 及表面传热系数 `h` 均为常数，沿肋高 `H` 方向肋片横截面积 `A_c` 保持不变。","4)：肋片厚度方向的导热热阻 `δ/λ` 与表面的对流换热热阻 `1/h` 相比很小，可以忽略，肋片温度只沿高度方向发生变化，在任一截面上都是均匀的，肋片导热可以近似地认为是一维的。","5)：肋片顶端表面可视为绝热，即在肋端 `dt/dx = 0`。"]},{"id":"p-h2d-14","title":"肋片数学描述方法一当量热源","key":true,"source":"课件 p085–p086","items":["2. 数学描述 方法一：微分方程 `d²t/dx² + Φ̇/λ = 0`；边界条件 `x = 0, t = t₀`、`x = H, dt/dx = 0`。","为什么出现热源？取一宽度方向为单位宽度、高度方向为 dx 的微元体分析。","分析：微元体内沿高度方向温度由 `t` 增加为 `t+dt`，但同时在微元体的外表面上（`P*dx` 面）发生了散热，散热量为 `Φ_s = (Pdx)h(t-t_∞)`。","相应的微元体体积为 `A_c*dx`，可认为微元体的当量热源为 `Φ̇ = -Φ_s/(A_c dx) = -(hP(t-t_∞))/A_c`。","由于是散热（导致肋片温度降低），故当量或折算源项应为「负」：`d²t/dx² = -Φ̇/λ = hP(t-t_∞)/(λA_c)`。"]},{"id":"p-h2d-15","title":"肋片数学描述方法二能量平衡","key":true,"source":"课件 p087–p088","items":["2. 数学描述 方法二：取一宽度方向为单位宽度、高度方向为 dx 的微元体分析。","导入微元体的热流量 `Φ_x = -λA_c dt/dx`。","导出微元体的热流量 `Φ_{x+dx} = Φ_x + ∂Φ_x/∂x dx = -λA_c dt/dx + d/dx(-λA_c dt/dx)dx`。","净导入微元体的热流量为 `ΔΦ = Φ_x - Φ_{x+dx} = d/dx(λA_c dt/dx)dx`。","按照牛顿冷却公式，散失于环境中的换热热流量为 `Φ_s = (Pdx)h(t-t_∞)`。","根据能量平衡，沿肋高净导入微元体的热流量等于微元体与环境的对流换热量：`d/dx(λA_c dt/dx)dx = h(t-t_∞)Pdx`，即 `λA_c d/dx(dt/dx) = h(t-t_∞)P`，整理得 `d²t/dx² = hP(t-t_∞)/(λA_c)`。"]},{"id":"p-h2e-1","title":"等截面直肋导热的分析求解","key":true,"source":"课件 p089","items":["肋片导热的微分方程为 `d²θ/dx² = m²θ`，其中 `θ = t - t_∞` 为过剩温度。","边界条件为 `x = 0，θ = θ_0 = t_0 - t_∞`；`x = H，dθ/dx = 0`（肋端绝热）。","方程的通解为 `θ = c₁e^{mx} + c₂e^{-mx}`。","由 `θ_0 = c₁ + c₂` 与 `dθ/dx|x=H = c₁me^{mx} - c₂me^{-mx}|x=H = 0` 定出积分常数：`c₁ = θ_0·e^{-mH}/(e^{mH} + e^{-mH})`，`c₂ = θ_0·e^{mH}/(e^{mH} + e^{-mH})`。","肋片温度分布解为 `θ = θ_0·(e^{m(H-x)} + e^{-m(H-x)})/(e^{mH} + e^{-mH}) = θ_0·ch[m(H-x)]/ch(mH)`。","双曲函数定义：`sh(x) = (e^x - e^{-x})/2`；`ch(x) = (e^x + e^{-x})/2`；`th(x) = (e^x - e^{-x})/(e^x + e^{-x})`。"]},{"id":"p-h2e-2","title":"直肋温度分布与肋片散热量","key":true,"source":"课件 p090","items":["结果分析：等截面直肋中的温度变化为**双曲线函数**。","肋片端部温度为 `θ_H = θ_0/ch(mH)`。","由肋片散失的总热量为通过肋根截面的导热量：`Φ_{x=0} = -λA_c(dθ/dx)_{x=0} = -λA_cθ_0(-m)·sh(mH)/(ch(mH)) = λA_cθ_0·m·th(mH) = (hP/m)·θ_0·th(mH)`。","其中参数满足 `m² = hP/(λA_c)`。","矩形肋的过剩温度分布曲线为双曲余弦型，肋根处 t_0 最高，向肋端逐渐降低到 t_∞。"]},{"id":"p-h2e-3","title":"肋片传热分析的注意事项","key":true,"source":"课件 p091","items":["前面得到的 θ 或 t 分布计算公式是有条件的，其一是**肋端绝热**，这是一个近似边界条件，对大量实际肋片特别是薄而长的肋片，此理论结果足够精确。","若考虑肋端绝热之外的实际结果，求解非常复杂。","对复杂情况计算 Φ 有一个简化而巧妙的方法：以直肋为例，若肋厚为 δ，可用**假想高度**代替 H，按上式去计算 Φ，所得结果足够准确；其思路是考虑肋端散热而将端面面积铺展到侧面上，假想高度 `H′=H + δ/2`。","实际上肋片表面上表面传热系数 h 不是均匀一致的，可按其平均值来计算；不均匀性比较大时，用数值方法来计算。","对于肋片厚度方向的导热热阻 δ/λ 与表面的对流换热热阻 1/h 相比不可忽略的情况，肋片的导热不能认为是一维的，上述公式不再适用。"]},{"id":"p-h2e-4","title":"温度计套管测温误差问题提出","key":true,"source":"课件 p092–p093","items":["应用举例——温度计套管测温误差分析，问题提出：应采用什么样的材料（铜/钢）作为温度计套管可以提高测温的准确性？","温度计感温包与套管顶端直接接触，因而所测之值即为 `x = H` 处顶端温度。","套管四周换热条件一致，因而不同高度 x 处的截面上温度均匀（**充油**以加强这一假设）；套管中的导热可以看成是截面积为 `πdδ` 的等截面直肋中的导热。","套管顶端与周围环境发生以下两种热量交换方式（即顶端向根部导热之外的散热）。","图中参数：玻璃水银温度计插在套管中，套管长 H、壁厚 δ、内径 d，套管外为油与流体，测温点分别为顶端 `t_H` 与根部 `t_0`。"]},{"id":"p-h2e-5","title":"套管顶端换热与测温偏差公式","key":true,"source":"课件 p094","items":["套管顶端的两种热量交换方式为：顶端与流体流经的管壁间的辐射换热；管道中的气体与顶端间的对流换热。","因此套管顶端温度不等于被测的流体温度。","设流体温度 t_f 比外界环境温度高，则套管顶端从流体吸收热量，一部分传导给根部，一部分向管壁辐射传递，因此 `t_H < t_f`，即存在测温误差。","仍采用上述假定顶端绝热的解来分析，该偏差即是顶端的过剩温度：`θ_H = t_H - t_f = (t_0 - t_f)/ch(mH)`。","反解得被测流体温度 `t_f = (t_H·ch(mH) - t_0)/(ch(mH) - 1)`。"]},{"id":"p-h2e-6","title":"温度计套管测温误差算例","key":true,"source":"课件 p095","items":["已知：温度计读数 100℃，连接处 `t_0 = 50℃`，套管高 140mm，壁厚 `δ = 1mm`，导热系数 `λ = 58.2 W/(m·K)`，表面传热系数 `h = 29.1 W/(m²·K)`。","把温度计套管看成是截面积为 `πdδ` 的等截面直肋。","由 `θ_H = θ_0/ch(mH)` 得 `t_H - t_f = (t_0 - t_f)/ch(mH)`。","换热周长 πd，套管截面积 πdδ，则 `mH = √(hP/(λA_c))·H = √(h/(λδ))·H = 3.13`。","查得 `ch3.13 = 11.5`，代入算得 `t_f = 104.7℃`，测量误差为 4.7℃。"]},{"id":"p-h2e-7","title":"借热阻概念分析减小测温误差","key":true,"source":"课件 p096","items":["借助热阻概念进行分析：流体 t_f 经 `R₁ = 1/h`（套管与流体间换热）到套管顶端 t_H，再经 `R₂ = H/(λA_c)`（沿套管导热）到根部 t_0，再经 R₃ 到外界环境温度 t_∞。","从物理角度分析：应使 `t_H → t_f` 或 t_H 尽量远离 t_∞。","减小 R₁：强化气体与顶端的换热，即增大 h（强化套管与流体间换热）。","增大 R₂：`H↑`、`λ↓`、`A_c↓`，即选用导热系数较小的材料作为套管材料、增加套管高度并减小壁厚。","增大 R₃：管外壁包绝热材料（即储气筒外包保温层）。"]},{"id":"p-h2e-8","title":"肋效率的定义","key":true,"source":"课件 p097","items":["对于不同形状的肋片，为快速计算每一个肋片的热量，引入**肋效率（Fin efficiency）**的概念，它表示肋片散热的有效程度。","利用肋片温度分析解，预先绘制好肋效率曲线，便于工程上的迅速计算。","肋效率的定义式为 `η_f = 肋片的实际散热量 / 整个肋片均处于温度 t_0 时的散热量`。"]},{"id":"p-h2e-9","title":"肋效率分析式与等效肋高","key":true,"source":"课件 p098–p099","items":["等截面直肋按定义得 `η_f = [(hPθ_0/m)·th(mH)]/(HPθ_0 h) = th(mH)/mH`。","计算参数 `mH = √(hP/(λA_c))·H`，课件进一步化为含 `√(h(2+2δ)/(λδ))·H` 的形式，并整理为 `√(2h/(λδ))·H = √(2h/(λδH))·H^{3/2} = √(2h/(λA_L))·H^{3/2}`（原图一处分母有不清字符）。","`A_L` 为纵截面：与热流密度传递方向平行的面；所以可预先绘制关于 `η_f — √(2h/(λA_L))·H^{3/2}` 的图表。","环肋、三角形肋及其它形状的肋片的肋效率均为 `√(2h/(λA_L))·H^{3/2}` 的函数。","考虑肋端散热对 Φ 的影响时可采用**等效肋高 H′** 代替 H 查图，等效肋高定义为：等截面直肋 `H′=H + δ/2`；环肋 `H′=H + δ/2`（`r′₂ = r₂ + δ/2`）；三角形肋 `H′=H`。"]},{"id":"p-h2e-10","title":"肋效率曲线与工程计算方法","key":true,"source":"课件 p100–p102","items":["肋效率曲线横坐标为 `(H′)^{3/2}[h/(λA_L)]^{1/2}`，纵坐标为 `η_f/%`，环肋曲线族按 `r′₂/r₁ = 1、2、3、5` 分列，随横坐标增大 η_f 单调下降。","肋效率曲线物理意义及变化特点：肋效率越高肋片温度越接近于肋根温度；肋效率越低，肋片温度越接近于周围流体温度；肋片与周围流体换热越强烈，肋效率越低。","采用肋片时一般要求 `η_f > 0.8`。","肋片散热量的工程计算方法：（1）由图线或计算公式得到 `η_f`；（2）计算理想情况下的散热量 `Φ_0 = hPH(t_0 - t_∞)`；（3）由式 `Φ = η_f Φ_0` 计算出实际散热量 Φ。"]},{"id":"p-h2e-11","title":"整体式翅片的肋效率","key":true,"source":"课件 p103","items":["家用空调的冷凝器与蒸发器，常采用整体式翅片（大套片）。","图中给出的翅片型式与尺寸为：(a) 平片（外廓 43.3×25，孔距 21.65）；(b) 三角形波纹片（齿高 1.7）；(c) 正弦波纹片（齿高 2）；(d) 开缝片（缝间距 2.5、片厚 1）。","其中平片肋效率已经有分析解（原图注：可扫码查询），其它翅片效率还未得出分析解，需要按照肋效率的定义采用数值方法确定。"]},{"id":"p-h2e-12","title":"肋面总效率","key":true,"source":"课件 p104","items":["一般以肋片根部温度 t_0 作为计算对流传热温差中的壁温，因此通过包括肋根在内的整个带肋侧的换热量为 `Φ = hA_r(t_0 - t_f) + hη_f A_f(t_0 - t_f) = h(t_0 - t_f)[(A_r + A_fη_f)/A_o]A_o = hη_o A_o(t_0 - t_f)`。","其中 `A_o = A_r + A_f`，`A_r` 为肋根侧未加肋的光滑面积，`A_f` 为肋片表面积。","肋面总效率 `η_o = (A_r + η_f A_f)/(A_r + A_f) = (A_r + η_f A_f)/A_o`，称为**肋面总效率（Overall fin efficiency）**。","通过带肋侧的总换热量就等于 `hη_o A_o(t_0 - t_f)`。"]},{"id":"p-h2e-13","title":"增加传热量的措施","key":true,"source":"课件 p106","items":["传热过程的热量为 `Φ = (t_{f1} - t_{f2})/(1/(A h₁) + δ/(Aλ) + 1/(A h₂))`。","为增加传热量：一是增加温差 `(t_{f1} - t_{f2})`，但受工艺条件限制。","二是减小热阻：a) 金属壁一般很薄（δ 很小）、热导率很大，故导热热阻一般可忽略；b) 增大 h₁、h₂，但提高 h₁、h₂ 并非任意的；c) 增大换热面积 A 也能增加传热量。"]},{"id":"p-h2e-14","title":"接触热阻与减小方法","key":true,"source":"课件 p107","items":["两个名义上互相接触的固体表面，实际接触只发生在一些离散面积上，未接触的间隙中常充满空气，热量以导热的方式穿过这层气隙。","由于气隙的存在增加了附加的热阻，即**接触热阻**；界面温度发生 `T₁ → T₂A → T₂B → T₃` 的阶跃式降落。","填充导热系数较大的材料，如导热姆（导热油、硅油）等可以减小接触热阻，在电子器件制造中广泛采用。","金属表面间的单位面积接触热阻一般在 `10⁻⁴ m²·K/W` 的量级。"]},{"id":"p-h2e-15","title":"内热源导热背景与数学描写","key":true,"source":"课件 p109–p110","items":["2.5 具有内热源的一维导热，应用背景（1）导线通电发热：`Φ̇ = I²R/(πr²L) W/m³`，电缆含保护层、发泡绝缘、粘结层、铝塑复合膜、铝镁合金线编织、导电导体。","应用背景（2）压水堆燃料元件的发热：大约 90% 的裂变能在燃料元件中转变成热能（压力容器高约 5m，燃料组件宽约 20cm，燃料元件长约 3m）。","有内热源时的导热微分方程写作 `ρc(∂t/∂τ) = ∂/∂x(λ∂t/∂x) + ∂/∂y(λ∂t/∂y) + ∂/∂z(λ∂t/∂z) + Φ̇`。","2.5.1 具有内热源的平壁的导热，条件为：平壁具有均匀的内源 `Φ̇`，其表面与周围流体发生对流换热，流体温度及换热系数各为 `t_f` 及 `h`。","数学描写：`d²t/dx² + Φ̇/λ = 0`；`x = 0，dt/dx = 0`；`x = δ，-λdt/dx = h(t - t_f)`。"]},{"id":"p-h2f-1","title":"具有内热源平壁的导热解","key":true,"source":"课件 p111","items":["具有均匀内热源的平壁，微分方程为 `d²t/dx² + Φ̇/λ = 0`。","边界条件为 `x = 0, dt/dx = 0`（对称面）与 `x = δ, -λ dt/dx = h(t - t_f)`。","通解为 `t = Φ̇/(2λ) x² + c₁x + c₂`；温度分布为 `t = Φ̇/(2λ)(δ² - x²) + Φ̇δ/h + t_f`。","任一位置 x 处的热流密度为 `q = -λ dt/dx = Φ̇ x`。","与无内热源的平壁解比较：温度分布呈**抛物线**分布，而不是直线分布；热流密度**不再是常数**。"]},{"id":"p-h2f-2","title":"例题2-9 燃料元件散热模型","key":true,"source":"课件 p112–p113","items":["例题 2-9：核反应堆中燃料元件散热放大简化模型，该模型是一个三层平板组成的大平壁，中间燃料层为内热源，铝板中无内热源。","分析：由于对称性，只要研究半个模型即可。","燃料元件的最高温度必发生在其中心线上 x=0 处，记为 t₂；界面温度记为 t₀；铝板表面温度记为 t₁。","在稳态工况下，燃料元件的热量必全部散失到流过铝板表面的冷却水中，且从界面到冷却水所传递的热流量均相同。","图中铝板的导热热阻 R_A1，表面对流换热热阻 R_A2，从燃料元件进入铝板的热流密度 q。","假设：(1) 一维稳态导热；(2) 不计接触热阻；(3) 内热源强度为常数。"]},{"id":"p-h2f-3","title":"例题2-9 的热平衡与温度计算","key":true,"source":"课件 p114–p115","items":["据热平衡 `q = (δ₁/2)Φ̇ = 0.014 m/2 × 1.5×10⁷ W/m³ = 1.05×10⁵ W/m²`。","按牛顿冷却公式 `q = h(t₂ - t_f)` 得 `t₂ = t_f + q/h`，`t₂ = 150 ℃ + (1.05×10⁵ W/m²)/(3500 W/(m²·K)) = 180 ℃`。","按傅里叶定律 `q = λ₂(t - t₂)/δ₂` 得 `t₁ = qδ₂/λ₂ + t₂`。","`t₁ = (1.05×10⁵ W/m² × 0.006 m)/(100 W/(m²·K)) = 186.3 ℃`。","`t₀ = t₁ + Φ̇(δ₁/2)²/(2λ₁) = 186.3 ℃ + (1.5×10⁷ W/m³ × (0.007 m)²)/(2×35 W/(m·K)) = 196.8 ℃`。","讨论：热阻分析是从界面温度开始而不是从 t₀ 开始，这是因为燃料元件有内热源不能用热阻概念来分析。"]},{"id":"p-h2f-4","title":"具有内热源的圆柱体导热","key":true,"source":"课件 p116","items":["2.5 具有内热源的一维稳态导热问题；2.5.2 具有内热源的圆柱体导热。","微分方程为 `(1/r) d/dr (r dt/dr) + Φ̇/λ = 0`。","边界条件为 `r = 0, dt/dr = 0` 与 `r = r₁, t = t₁`。","积分得 `r dt/dr + Φ̇ r²/(2λ) = c₁`，由边界条件得 `c₁ = 0`。","`t = -(1/4)(Φ̇/λ) r² + c₂`，`c₂ = t₁ + (1/4)(Φ̇/λ) r₁²`，故 `t = t₁ + (1/4)(Φ̇/λ)(r₁² - r²)`。","最高温度出现在圆心处：`t_max = c₂ = t₁ + (1/4)(Φ̇/λ) r₁²`。"]},{"id":"p-h2f-5","title":"例题2-10 的已知条件","key":true,"source":"课件 p117–p118","items":["例题 2-10：铀燃料充装于由锆锡合金制成的圆管中，管子成正方形布置（间距 17.5 mm，管径 8.25 mm），管束之间有冷却水流过，管子内壁与铀棒间存在接触热阻。试确定稳态过程中铀棒的最高温度。","已知：`d_i = 8.25 mm, d_o = 9.27 mm`；`Φ̇ = 8.73×10⁸ W/m³`；`t_f = 400K, h = 10000 W/(m²·K)`。","接触热阻相当于增加了表面传热系数：`h_ct = 6000 W/(m²·K)`。","锆锡合金导热系数 λ_zir（500、600、800K）为 16.2、17.2、19.2 W/(m·K)；铀燃料导热系数 λ_u（1000、1500、2000K）为 3.9、2.6、2.3 W/(m·K)。","分析：只有在确定了铀棒的外表面温度后才能应用分析解；由于锆锡合金以及铀棒的导热系数与温度有关，需采用迭代方法计算。"]},{"id":"p-h2f-6","title":"例题2-10 的迭代计算","key":true,"source":"课件 p119–p121","items":["假设：(1) 稳态导热；(2) 四根铀棒情况一样，计算一根即可；(3) 一维导热。","每米长度铀棒外表面的散热量 `Φ = Φ̇ × (π/4) d_i² × 1 = 8.73×10⁸ × 3.14/4 × 0.825² × 1 = 46700 W`。","`T_u = T_f + Φ[1/(2πr_i h_ct) + ln(r_o/r_i)/(2πλ_zir) + 1/(2πr_o h_o)] = 400 + 46700(0.00642 + 0.0256/λ_zir + 0.00328)`。","先假定锆锡合金管子的平均温度为 600K，`λ_zir = 17.2 W/(m·K)`，得 `T_u = 400 + 46700(0.00642 + 0.00149 + 0.00328) = 923K`。","取铀棒平均温度 1500K，`λ_u = 2.6 W/(m·K)`，`T_max = T_u + (1/4)(Φ̇ r_i²/λ_u) = 923 + (8.73×10⁸×0.00413²)/(4×2.6) = 2355K`。","检验壁温 `T_tubem = 588K` 与 600K 很接近，假设有效；铀棒平均温度 `T_um = (923+2355)/2 = 1639K` 与 1500K 相差较远，需修正，取 `λ_u = 2.5 W/(m·K)` 后 `T_max = 923 + (8.73×10⁸×0.00413²)/(4×2.5) = 2412K`。","讨论：铀棒导热系数只给出两位有效数字，没必要做进一步的迭代；对有内热源的实心圆柱、球的导热问题，稳态时外表面上的导热量等于内热源功率总和，需要求解的仅是温度分布。"]},{"id":"p-h2f-7","title":"本章小结：导热基本定律与导热系数","key":true,"source":"课件 p122–p123","items":["一、导热基本定律。有关基本概念：导热的定义、本质和特点；温度场及其分类；等温面(线)及其特点、温度梯度。","导热基本定律——傅里叶定律：物理含义（实质）是反映热流密度(或热流量)与温度场间的联系；数学表达式有矢量式、标量式（注意在各种不同场合的具体形式）；还要掌握定律的适用场合。","导热系数：掌握定义、意义、影响因素（特别是材料种类的影响、温度的影响及处理方法）。","材料种类对导热系数的总体影响：`λ_纯金属 > λ_合金 > λ_非金属 > λ_绝热材料 > λ_气体`。","温度对导热系数的影响一般按线性关系处理：`λ = λ₀(1 + bt)`；`λ̄ = λ₀(1 + b t̄)`。","注意：(1) 在热流量的计算中，可取平均导热系数后将其作常量处理；(2) 在求解温度分布时，则应将导热系数随温度变化的关系式代入微分方向进行求解。"]},{"id":"p-h2f-8","title":"小结：数学描写与一维稳态分析解","key":true,"source":"课件 p124–p126","items":["二、导热问题的数学描写：导热微分方程的推导思路及基本依据、实质(能量守恒)；直角坐标系中导热微分方程的一般形式(要求熟记)、各项的意义、适用范围；能写出一般工程问题的数学描述——即写出导热微分方程及其定解条件。","直角坐标系导热微分方程一般形式：`ρc ∂t/∂τ = [∂/∂x(λ ∂t/∂x) + ∂/∂y(λ ∂t/∂y) + ∂/∂z(λ ∂t/∂z)] + Φ̇`。","三、典型一维稳态导热问题的分析解：通过平壁、圆筒壁、球壁等的导热，共同点为无内热源、一维、稳态(`Φ=C`)；求解方法为利用导热微分方程求解，或直接由傅里叶定律积分求解。","需求解的问题：壁内温度分布、通过壁面的导热量；求解要点是利用热阻概念，`Φ = Δt_总/R_t总 = Δt_总/∑ᵢ R_{t,i}`。","注意事项：圆筒壁、球壁与平壁间的差别是导热面积随 r 而变；不同形状的壁面导热热阻有不同的计算式；对于组合壁面热阻符合串、并联规则；对于多层壁层间接触不良时应考虑接触热阻的影响。","对于平壁，因沿途的导热面积等于常量，故又有 `q=C`；所以在串联通路中温差与热阻成正比，或导热系数与温度梯度成反比。"]},{"id":"p-h2f-9","title":"一维稳态导热分析解汇总","key":true,"source":"课件 p127–p129","items":["多层壁串联：`q = Δt₁/R_t1 = Δt₂/R_t2 = Δt₃/R_t3`；或 `q = -λ₁(dt/dx)₁ = -λ₂(dt/dx)₂ = -λ₃(dt/dx)₃`。","平壁：`λ=C` 时 `t = (t₂ - t₁)x/δ + t₁`，`q = (t₁ - t_{n+1})/∑ᵢ δ_i/λ_i`；`λ≠C` 时 t=f(x) 为非线性函数。","圆筒壁：`λ=C` 时 `t = t₁ + (t₂ - t₁)ln(r/r₁)/ln(r₂/r₁)`，`Φ = 2πl(t₁ - t_{n+1})/∑ᵢ[ln(d_{i+1}/d_i)/λ_i]`；`λ≠C` 时 `Φ = λ̄(t₁ - t₂)/∫dx/A`。","球壁（具体公式略）。肋片(`λ=C`)：等截面肋 `θ = θ₀ ch[m(x-H)]/ch(mH)`，`Φ = λA_c θ₀ m th(mH)`；其他形状截面肋 `Φ = η_f Φ_{λ→∞}`。","表2-3 一维稳态导热部分分析解汇总：平板导热 `t = t₁ + (t₂ - t₁)x/δ`、`Φ = λA(t₁ - t₂)/δ`、`R = δ/(λA)`。","圆筒体导热 `R = ln(r₂/r₁)/(2πλl)`；球壳导热 `R = (1/4πλ)(1/r₁ - 1/r₂)`；等截面直肋 `R = 1/((λA_c hP)^{1/2} th(mH))`。"]},{"id":"p-h2f-10","title":"课堂练习与本章习题作业","key":true,"source":"课件 p130–p132","items":["课堂练习一：已知某室内气温 t_f1=20 ℃，室外气温 t_f2=-20 ℃，室内外空气对墙面的对流换热系数分别为 h₁=10 W/(m²·k) 和 h₂=20 W/(m²·k)，墙壁厚度 δ=360 mm，导热系数 λ=0.5 W/(m·k)，换热面积 A=15 m²，试计算通过墙壁的热量损失。","课堂练习二：有一厚 20 mm 的平面墙，导热系数为 1.3 W/(m·K)，为使每平方米墙的热损失不超过 1500 W，在外表面覆盖了一层导热系数为 0.12 W/(m·K) 的保温材料。已知复合壁两侧的温度分别为 750 ℃ 和 55 ℃，试确定此保温层的厚度。","第二章习题作业：2-1，2-7，2-10，2-18。"]}],"questions":[{"id":"q-h2a-1","kind":"多选","priority":1,"source":"课件题目","sourceDetail":"课件 p009（原文）","keyPoints":["温度场","等温线特点","稳态温度场"],"stem":"下面关于温度场的说法，正确的是","options":[{"k":"A","t":"等温线上的温度都一样"},{"k":"B","t":"等温线可以交叉"},{"k":"C","t":"等温线上可能存在热量传递"},{"k":"D","t":"稳态温度场不随时间变化"}],"answer":"AD","why":["A ✓ 课件 p005 原文：同一瞬间温度相等的各点连成的线或面称为等温线（Isotherm）或等温面（Isothermal surface）。","B ✗ 课件 p006 原文：等温线（面）不能相交（同一点不可能有两个温度）。","C ✗ 课件 p006 原文：局部导热热流密度与等温线垂直，热流密度矢量与等温线（面）垂直，等温线上不存在沿线的热量传递。","D ✓ 课件 p005 原文：稳态温度场写作 `t = f(x, y, z)`，式中不含时间 τ，故不随时间变化。"],"basis":"课件 p009（原文），答案依据课件 p005、p006 原文推出，课件未标答案"},{"id":"q-h2a-2","kind":"多选","priority":1,"source":"课件题目","sourceDetail":"课件 p014（原文）","keyPoints":["傅里叶定律","负号含义","热流线与等温线","适用范围"],"stem":"下面关于傅里叶定律说法正确的是，","options":[{"k":"A","t":"式子中的负号表明传热方向与梯度相反"},{"k":"B","t":"热流是矢量，温度是标量"},{"k":"C","t":"傅里叶定律可以适用于一切导热问题"},{"k":"D","t":"热流线与等温线垂直"}],"answer":"ABD","why":["A ✓ 课件 p012 原文：负号的含义——热量传递方向指向温度降低方向，即与温度升高方向相反。","B ✓ 课件 p011 原文：`q = φ/A = -λ grad t`，热流密度 q 为矢量；课件 p015 原文：导热系数是标量，p012 也指出热流密度矢量与等温线（面）垂直、可用热流线表示。","C ✗ 课件 p011 原文框注：实验定律，常规尺度问题普遍适用；即受「常规尺度」限制，并非适用于一切导热问题。","D ✓ 课件 p012 原文：热流密度矢量与等温线（面）垂直，方向与温度梯度相反。"],"basis":"课件 p014（原文），答案依据课件 p011、p012、p015 原文推出，课件未标答案"},{"id":"q-h2a-3","kind":"简答","priority":1,"source":"课件例题","sourceDetail":"课件 p019（原文）","keyPoints":["空气导热系数低","自然对流受抑制","保温作用"],"stem":"冬天的棉被晒一晒、拍一拍，晚上睡觉就会觉得很暖和，为什么？","given":["棉被被晒、拍打后，大量空气进入棉被的狭小空间"],"ask":["说明棉被晒一晒、拍一拍后睡觉觉得暖和的原因"],"steps":["第一步 晒一晒、拍一拍使大量空气进入狭小的棉被空间内","第二步 狭小空间内自然对流不易展开","第三步 同时空气的导热系数低，能起到保温作用"],"result":"大量空气进入狭小的棉被空间内，自然对流不易展开，同时空气的导热系数低，能起到保温作用。","basis":"课件 p019（原文）"},{"id":"q-h2a-4","kind":"简答","priority":1,"source":"课件例题","sourceDetail":"课件 p019（原文）","keyPoints":["双层玻璃保温","空气夹层不流动","夹层过厚引起流动"],"stem":"北方寒冷地区，房屋都是双层玻璃，以利于保温。如何解释其道理？空气夹层越厚越好吗？","given":["北方冬季时间长，气温低","双层玻璃之间存在中空空气夹层"],"ask":["解释双层玻璃利于保温的道理","判断空气夹层是否越厚越好"],"steps":["第一步 中空玻璃中的空气不流动，减少对流换热作用，从而削弱通过玻璃的热量传递","第二步 空气夹层太厚、空气空间大时，空气会引起流动","第三步 空气流动会增大换热，不利于保温"],"result":"北方冬季时间长，气温低。中空玻璃中的空气不流动减少对流换热作用。空气夹层太厚，空气空间大，引起流动，增大换热，不利于保温。","basis":"课件 p019（原文）"},{"id":"q-h2b-1","kind":"多选","priority":1,"source":"课件题目","sourceDetail":"课件 p039（原文）","keyPoints":["边界条件的分类","初始条件与边界条件的区别","三类边界条件"],"stem":"下列关于边界条件的说法正确的是","options":[{"k":"A","t":"规定了初始时刻的温度分布"},{"k":"B","t":"给定边界处的温度属于边界条件的一类"},{"k":"C","t":"给定边界处的热流属于边界条件的一类"},{"k":"D","t":"给定边界外的流体温度和传热系数属于边界条件的一类"}],"answer":"BCD","why":["A ✗ 课件 p034 原文：初始条件（initial condition）给定初始时刻物体中的温度分布 τ = 0, t = f(x, y, z)，它属于定解条件中的初始条件，不是边界条件。","B ✓ 课件 p035 原文：第一类边界条件规定边界上的温度分布 t_w = f(τ)，故给定边界处的温度属于边界条件的一类。","C ✓ 课件 p036 原文：第二类边界条件给定边界上的热流密度 -λ ∂t/∂n|_w = f(τ) = q_w，故给定边界处的热流属于边界条件的一类。","D ✓ 课件 p037 原文：第三类边界条件给定了边界上物体与周围流体间的表面传热系数以及流体温度 -λ ∂t/∂n|_w = h(t_w - t_f)，故给定边界外的流体温度和传热系数属于边界条件的一类。"],"basis":"课件 p039（原文）；课件 p034–p037（原文）"},{"id":"q-h2b-2","kind":"单选","priority":2,"source":"课件 p028","sourceDetail":"课件 p028（依据正文自拟）","keyPoints":["热扩散率的定义式","热扩散率的单位","热扩散率是物性参数"],"stem":"课件中定义的热扩散率（导温系数）a 及其单位是","options":[{"k":"A","t":"a = λ/(ρc)，单位 m²/s"},{"k":"B","t":"a = ρc/λ，单位 m²/s"},{"k":"C","t":"a = λ/(ρc)，单位 W/(m·K)"},{"k":"D","t":"a = λ/(ρc_p)，单位 W/(m²·K)"}],"answer":"A","why":["A ✓ 课件 p028 原文：`a = λ/(ρc)` 称为热扩散率（Thermal diffusivity）或导温系数，单位：m²/s，是物性参数。","B ✗ 课件 p028 原文给出的定义式是 a = λ/(ρc)，分子是导热系数 λ、分母是 ρc，不是倒数。","C ✗ 课件 p028 原文标明的单位是 m²/s，W/(m·K) 是导热系数 λ 的单位，不是热扩散率的单位。","D ✗ 课件 p028 原文的单位是 m²/s；课件 p030 中物理意义处写作 a = λ/(ρc_p)，但单位仍为 m²/s 而非 W/(m²·K)。"],"basis":"课件 p028（原文）；课件 p030（原文）","answerNote":"答案由课件 p028 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h2b-3","kind":"单选","priority":2,"source":"课件 p041–p043","sourceDetail":"课件 p041–p043（依据正文自拟）","keyPoints":["单层平壁的温度分布","稳态下温度呈线性分布","线性分布与导热系数无关"],"stem":"在 1 维、稳态、无内热源、λ 为常数且两侧均为第一类边界的单层平壁中，平壁内的温度分布是","options":[{"k":"A","t":"线性分布，且与 λ 无关"},{"k":"B","t":"线性分布，且随 λ 增大而变陡"},{"k":"C","t":"抛物线分布，与 λ 有关"},{"k":"D","t":"对数分布，与 λ 有关"}],"answer":"A","why":["A ✓ 课件 p043 原文：平壁内的温度分布 `t = t₁ - (t₁ - t₂)x/δ`，并标注「线性分布与 λ 无关」。","B ✗ 课件 p043 原文明确标注线性分布与 λ 无关，故不会随 λ 增大而变陡。","C ✗ 课件 p041 的数学描写为 d²t/dx² = 0，积分两次得 t = c₁x + c₂，是一次式而非抛物线。","D ✗ 课件 p043 原文给出的是线性分布 t = t₁ - (t₁ - t₂)x/δ，不是对数分布。"],"basis":"课件 p041–p043（原文）","answerNote":"答案由课件 p041–p043 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h2c-1","kind":"计算","priority":1,"source":"课件例题","sourceDetail":"课件 p048–p050（原文）","keyPoints":["平均温度下的导热系数","单层平壁热流密度"],"stem":"例题 2-1：锅炉炉墙用保温材料水泥珍珠岩制成，其导热系数与温度的关系按下式变化 `{λ̄}_{W/(m·K)}=0.0651+0.000105{t̄}_℃`，已知 `ρ=300 kg/m³`，`δ=120 mm`，`t₂=50 ℃`，`t₁=500 ℃`，求每平方米炉墙每小时的热损失。","given":["导热系数与温度的关系 `{λ̄}_{W/(m·K)}=0.0651+0.000105{t̄}_℃`","ρ=300 kg/m³，δ=120 mm，t₂=50 ℃，t₁=500 ℃","假设：（1）一维问题；（2）稳态导热"],"ask":["每平方米炉墙每小时的热损失"],"steps":["第一步 分析：水泥珍珠岩制品的导热系数是导热物体平均温度的函数，因此需按炉墙平均温度下的导热系数计算热流量，为求平均导热系数需先算出材料的平均温度","第二步 计算平均温度 `t̄=(500 ℃+50 ℃)/2=275 ℃`","第三步 计算平均导热系数 `λ̄=(0.0651+0.000105×275) W/(m·K)=0.094 0 W/(m·K)`","第四步 由 `q=-λ dt/dx=(t₁-t₂)/(δ/λ)` 得 `q=(λ/δ)(t₁-t₂)`","第五步 代入数值 `q=(0.094 0 W/(m·K))/(0.120 m)×(500 ℃-50 ℃)=353 W/m²`"],"result":"q=353 W/m²","basis":"课件 p048–p050（原文）"},{"id":"q-h2c-2","kind":"计算","priority":1,"source":"课件例题","sourceDetail":"课件 p051–p055（原文）","keyPoints":["多层平壁热阻串联","迭代法求变导热系数","由热流密度逆推层间温度"],"stem":"例题2-2：一个三层平壁结构，里面是耐火粘土砖，厚 115m；中间是 B级硅藻土砖，厚 125 mm；最外层为石棉板，厚 70 mm，内、外表面温度分别为 495 ℃ 和 60 ℃，求每平方米炉墙每小时的热损失及耐火粘土砖与硅藻土砖分界面上的温度。","given":["耐火粘土砖 δ₁=0.115 m，B级硅藻土砖 δ₂=0.125 m，石棉板 δ₃=0.115 m（课件 p055 计算式中取值）","内、外表面温度 t₁=495 ℃，t₄=60 ℃","假设：（1）一维问题；（2）稳态导热；（3）无接触热阻"],"ask":["每平方米炉墙每小时的热损失","耐火粘土砖与硅藻土砖分界面上的温度"],"steps":["第一步 分析：耐火黏土砖以及B级硅藻土的导热系数都是温度的函数，按平均温度计算其导热系数时需要知道层间温度，而层间温度本身是待求解的，因此需要采用迭代法（Iteration method）","第二步 假设界面温度为 t₂、t₃，各层平均温度 `t₁₂=(t₁+t₂)/2`、`t₂₃=(t₂+t₃)/2`、`t₃₄=(t₃+t₄)/2`","第三步 由 `λ̄=a+bt` 求出各层导热系数，再由 `q=(t₁-t₄)/(δ₁/λ₁+δ₂/λ₂+δ₃/λ₃)` 计算热流密度","第四步 由 q 逆推层间温度 `t₂″=t₁-qδ₁/λ₁`、`t₃″=t₂-qδ₂/λ₂`，若与设定值差别大于允许值则重新计算平均温度并重新迭代，直到预估值与计算结果的偏差在一定的允许范围内","第五步 经数次迭代得 `λ₁=1.12 W/(m·K)`，`λ₂=0.116 W/(m·K)`，`λ₃=0.116 W/(m·K)`","第六步 计算热流密度 `q=(495 ℃-60 ℃)/((0.115 m)/(1.12 W/(m·K))+(0.125 m)/(0.116 W/(m·K))+(0.115 m)/(0.116 W/(m·K)))=435/1.78 W/m²=244 W/m²`","第七步 计算分界面温度 `t₂=t₁-qδ₁/λ₁=495 ℃-244 W/m²×(0.115 m)/(1.12 W/(m·K))=470 ℃`"],"result":"q=244 W/m²，耐火粘土砖与硅藻土砖分界面上的温度 t₂=470 ℃","basis":"课件 p051–p055（原文）"},{"id":"q-h2c-3","kind":"计算","priority":1,"source":"课件例题","sourceDetail":"课件 p056–p057（原文）","keyPoints":["单位面积导热热阻","污垢热阻的影响"],"stem":"例题 2-3：已知三种材料的导热系数为 钢板 46.4 W/(m·K)、水垢 1.16 W/(m·K)、灰垢 0.016 W/(m·K)，且 δ=1 mm，求 1mm钢板、水垢及灰垢的单位面积热阻。","given":["钢板 λ=46.4 W/(m·K)，水垢 λ=1.16 W/(m·K)，灰垢 λ=0.016 W/(m·K)","δ=1 mm","假设：（1）一维；（2）稳态问题"],"ask":["1mm钢板、水垢及灰垢的单位面积热阻"],"steps":["第一步 平板的单位面积导热热阻为 `r=δ/λ`","第二步 钢板 `r=(1×10⁻³ m)/(46.4 W/(m·K))=2.16×10⁻⁵ m²·K/W`","第三步 水垢 `r=(1×10⁻³ m)/(1.16 W/(m·K))=8.62×10⁻⁴ m²·K/W`","第四步 灰垢 `r=(1×10⁻³ m)/(0.116 W/(m·K))=8.62×10⁻³ m²·K/W`"],"result":"钢板 2.16×10⁻⁵ m²·K/W；水垢 8.62×10⁻⁴ m²·K/W；灰垢 8.62×10⁻³ m²·K/W（1 mm 厚水垢热阻相当于 40 mm 厚钢板，1 mm 厚灰垢热阻相当于 400 mm 厚钢板）","basis":"课件 p056–p057（原文）"},{"id":"q-h2c-4","kind":"计算","priority":1,"source":"课件例题","sourceDetail":"课件 p058–p059（原文）","keyPoints":["一维导热的判定","Φ=λA Δt/δ"],"stem":"例题 2-4：钢柱直径 d=30mm，长度 L=300mm，导热系数 λ=50W/(m·K)，其两个端面分别为持在 60 ℃ 与 20 ℃，四周为保温材料，求通过钢柱的导热量。","given":["钢柱直径 d=30mm，长度 L=300mm","导热系数 λ=50W/(m·K)","两个端面分别持在 60 ℃ 与 20 ℃，四周为保温材料","假设：（1）一维；（2）稳态问题"],"ask":["通过钢柱的导热量"],"steps":["第一步 分析：钢柱四周绝热，温度仅沿着轴线方向变化，相当于一维导热问题","第二步 采用 `Φ=λA Δt/δ` 计算导热量","第三步 代入数值 `Φ=50 W/(m·K)×(3.14×0.025² m²)/4×(60-20)K/0.3m=3.27W`"],"result":"Φ=3.27W","basis":"课件 p058–p059（原文）"},{"id":"q-h2c-5","kind":"多选","priority":1,"source":"课件题目","sourceDetail":"课件 p060（原文）","keyPoints":["一维无内热源稳态平板导热","温度分布与热流密度特征"],"stem":"下列对一维无内热源稳态平板导热说法正确的是，","options":[{"k":"A","t":"平板内的温度成线性分布"},{"k":"B","t":"平板中的热流密度成线性分布"},{"k":"C","t":"平板中的热流密度不变"},{"k":"D","t":"平板中的传热功率成线性分布"}],"answer":"AC","why":["A ✓ 课件 p046 原文：多层平壁中各层温度沿厚度线性下降，一维无内热源稳态平板的温度成线性分布","B ✗ 一维稳态无内热源时热流密度是常量，不随位置线性变化","C ✓ 课件 p045 原文：假设层间接触热阻为零，稳态、无内热源，则通过各层的热流量相等，即热流密度不变","D ✗ 传热功率（热流量）在稳态一维平壁中为定值，不随位置成线性分布"],"basis":"课件 p060（原文）"},{"id":"q-h2c-6","kind":"单选","priority":2,"source":"课件 p046","sourceDetail":"课件 p046（依据正文自拟）","keyPoints":["n层平壁热流密度表达式"],"stem":"对由 n 层不同材料组成、层间接触热阻为零的稳态平壁导热，若两侧表面温度为 t₁ 与 t_{n+1}，则热流密度 q 的表达式是（ ）。","options":[{"k":"A","t":"q=(t₁-t_{n+1})·∑_{i=1}^{n} δ_i/λ_i"},{"k":"B","t":"q=(t₁-t_{n+1})/∑_{i=1}^{n} δ_i/λ_i"},{"k":"C","t":"q=(t₁-t_{n+1})/(∑_{i=1}^{n} δ_i·λ_i)"},{"k":"D","t":"q=∑_{i=1}^{n} δ_i/(λ_i(t₁-t_{n+1}))"}],"answer":"B","why":["A ✗ 课件写的是总温差被总热阻除，不是乘总热阻","B ✓ 课件 p046 原文：对n层平壁 `q=(t₁-t_{n+1})/(∑_{i=1}^{n} δ_i/λ_i)`","C ✗ 各层热阻为 δ_i/λ_i，分母不是 δ_i 与 λ_i 的乘积之和","D ✗ 该式把总温差放在了分母，与课件原文相反"],"basis":"课件 p046（原文）","answerNote":"答案由课件 p046 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h2c-7","kind":"单选","priority":2,"source":"课件 p064","sourceDetail":"课件 p064（依据正文自拟）","keyPoints":["圆筒壁温度分布规律"],"stem":"据课件对单层圆筒壁、λ为常数且无内热源的稳态导热分析，圆筒壁内的温度分布是（ ）。","options":[{"k":"A","t":"直线"},{"k":"B","t":"抛物线"},{"k":"C","t":"对数曲线"},{"k":"D","t":"双曲线"}],"answer":"C","why":["A ✗ 直线是一维无内热源稳态平壁的温度分布","B ✗ 课件未出现抛物线形式的圆筒壁温度分布","C ✓ 课件 p064 原文：圆筒壁中的温度分布是对数曲线，`t=t₁+(t₂-t₁)/ln(r₂/r₁)·ln(r/r₁)`","D ✗ 课件中圆筒壁温度分布不是双曲线"],"basis":"课件 p064（原文）","answerNote":"答案由课件 p064 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h2d-1","kind":"多选","priority":1,"source":"课件题目","sourceDetail":"课件 p070（原文）","keyPoints":["一维稳态无内热源圆筒壁导热","壁面温度的对数分布","圆筒壁导热热阻与半径相关"],"stem":"下面关于一维稳态无内热源圆桶壁面导热的说法正确的是","options":[{"k":"A","t":"壁面中的温度成对数分布"},{"k":"B","t":"壁面中的热流成线性分布"},{"k":"C","t":"导热热阻与圆桶壁的内外半径相关"},{"k":"D","t":"温差越大，导热热阻越小"}],"answer":"AC","why":["A ✓ 课件 p070 选项 A 原文「壁面中的温度成对数分布」，一维稳态无内热源圆筒壁内温度沿半径呈对数规律分布。","B ✗ 圆筒壁稳态导热中通过壁面的热流量处处相等，热流密度随半径增大而减小，均不是线性分布。","C ✓ 课件 p070 选项 C 原文「导热热阻与圆桶壁的内外半径相关」，圆筒壁导热热阻由内外半径（直径）与导热系数决定。","D ✗ 热阻只与几何尺寸和材料导热系数有关，与两侧温差大小无关。"],"basis":"课件 p070（原文）；课件未标答案，选项判断依据课件本片圆筒壁导热原文内容推出，请以老师公布为准"},{"id":"q-h2d-2","kind":"计算","priority":1,"source":"课件例题","sourceDetail":"课件 p067–p069（原文）","keyPoints":["圆筒壁稳态导热计算","导热系数按平均温度线性取值","由热损失限制求保温层厚度"],"stem":"例题 2-5：外径为 133 mm 的蒸汽管道外覆盖保温层，蒸汽管外壁温度为 400 ℃，外侧温度不得超过 50 ℃，每米长管道的热损失 `Φ/l` 应控制在 465 W/m 之下，保温材料为水泥珍珠岩，求保温层厚度应为多少毫米。","given":["蒸汽管道外径 `d₁ = 133 mm`","蒸汽管外壁温度 `t₁ = 400 ℃`","保温层外侧温度不得超过 `t₂ = 50 ℃`","每米长管道的热损失 `Φ/l` 控制在 465 W/m 之下","保温材料为水泥珍珠岩，导热系数按附录 4 取值","假设：圆柱坐标的一维问题；稳态导热；导热系数为温度的线性函数"],"ask":["材料的平均温度 `t̄`","平均导热系数 `λ̄`","保温层外直径 `d₂`","保温层厚度 `δ`（mm）"],"steps":["第一步 求材料的平均温度：`t̄ = (400 ℃+50 ℃)/2 = 225 ℃`","第二步 查附录 4 求平均导热系数：`{λ̄}_{W/(m·K)} = 0.0651+0.000 105×225`，得 `λ̄ = 0.088 7 W/(m·K)`","第三步 代入圆筒壁导热公式 `ln{d₂}_m = (2πλ)/(Φ/l)(t₁-t₂) + ln{d₁}_m`","第四步 计算对数：`ln{d₂}_m = (2π×0.087)/465×(400-50) + ln 0.133 = 0.419-2.02 = -1.601`","第五步 由对数值求外径：`d₂ = 0.202 m`","第六步 求保温层厚度：`δ = (d₂-d₁)/2 = (0.202 m-0.133 m)/2 = 34 mm`"],"result":"保温层厚度 `δ = 34 mm`","basis":"课件 p067–p069（原文）"},{"id":"q-h2d-3","kind":"计算","priority":1,"source":"课件例题","sourceDetail":"课件 p073–p076（原文）","keyPoints":["第二、三类边界条件的一维平板导热","给定热流密度与对流换热组合边界","稳态时平板两表面温度求解"],"stem":"2.3.4 第二、三类边界条件一维导热问题：一个电熨斗电功率为 1200 W，底面竖直置于环境温度为 25 ℃ 的房间中，金属底板厚为 5 mm，导热系数 `λ = 15 W/(m·K)`，底板面积 `A = 300 cm²`，考虑辐射作用在内的表面传热系数 `h = 80 W/(m²·K)`，求稳态时底板两表面的温度。","given":["电熨斗电功率 `P = 1200 W`","环境温度 `t_∞ = 25 ℃`","金属底板厚 `δ = 5 mm`","底板导热系数 `λ = 15 W/(m·K)`","底板面积 `A = 300 cm²`","考虑辐射作用在内的表面传热系数 `h = 80 W/(m²·K)`","假设：电熨斗绝热层性能良好，加热器功率全部通过底板散到环境中去；忽略底板四周厚度方向的侧面散热"],"ask":["稳态时底板两表面的温度 `t_{x=0}` 与 `t_{x=δ}`"],"steps":["第一步 近似处理为一维平板导热：底板右侧为对流换热边条件，左侧为给定热流密度边界条件","第二步 求热流密度：`q₀ = 1200W/0.03m² = 40000W/m²`","第三步 将坐标原点设于底板右侧，写出数学描写：`d²t/dx² = 0`；`x = 0, -λ dt/dx = q₀`；`x = δ, -λ dt/dx = h(t-t_∞)`","第四步 通解 `t = c₁x+c₂`，代入第一个边界条件得 `-λc₁ = q₀`，`c₁ = -q₀/λ`","第五步 代入第二个边界条件得 `-λc₁ = h[(c₁δ+c₂)-t_∞]`，解得 `c₂ = t_∞ + q₀/h + (q₀/λ)δ`","第六步 得温度分布 `t = t_∞ + q₀((δ-x)/λ + 1/h)`","第七步 求外表面温度：`t_{x=δ} = 25 ℃ + 40000W/m² × 1/(80W/(m²·K)) = 525 ℃`","第八步 求内表面温度：`t_{x=0} = 25 ℃ + 40000W/m² [0.005m/(15W/(m·K)) + 1/(80W/(m²·K))] = 538 ℃`"],"result":"底板外表面（`x = δ`）温度 525 ℃，底板内表面（`x = 0`）温度 538 ℃","basis":"课件 p073–p076（原文）"},{"id":"q-h2d-4","kind":"例题","priority":1,"source":"课件例题","sourceDetail":"课件 p082–p088（原文）","keyPoints":["等截面直肋的三维到一维简化","当量热源法与能量平衡法","肋片导热微分方程建立"],"stem":"2.4.2 物理问题：确定等截面直肋中的温度分布与肋片的散热量（课件给出简化假设与两种数学描述方法）。","given":["肋片的 `λ`、`h` 均为常数","肋片温度垂直于纸面方向不变化，取出一个截面来分析，由 3D 简化为 2D","`1/h >> δ/λ`，沿肋片厚度方向温度可设为均匀，由 2D 简化为 1D","肋片顶端可以认为是绝热，即 `dt/dx|_{x=H} = 0`","肋片根部与肋基接触良好，温度一致 `t₀`；沿肋高 H 方向横截面积 `A_c` 保持不变；肋片周长 P，厚度 δ"],"ask":["肋片中的温度分布","通过肋片散失的热流量"],"steps":["第一步 建立物理模型：取单位长度分析，根部温度 `t₀`，`λ` 与 `h` 为常数，`A_c` 沿肋高不变，肋端绝热 `dt/dx = 0`","第二步 方法一写出微分方程与边界条件：`d²t/dx² + Φ̇/λ = 0`；`x = 0, t = t₀`；`x = H, dt/dx = 0`","第三步 方法一解释热源来源：微元体外表面（`P*dx` 面）散热 `Φ_s = (Pdx)h(t-t_∞)`，微元体体积为 `A_c*dx`","第四步 方法一得当量热源：`Φ̇ = -Φ_s/(A_c dx) = -(hP(t-t_∞))/A_c`，因是散热故源项为「负」","第五步 方法二求导热流量：`Φ_x = -λA_c dt/dx`，`Φ_{x+dx} = Φ_x + ∂Φ_x/∂x dx`，净导入 `ΔΦ = d/dx(λA_c dt/dx)dx`","第六步 方法二按能量平衡：`d/dx(λA_c dt/dx)dx = h(t-t_∞)Pdx`","第七步 整理得肋片导热微分方程：`d²t/dx² = hP(t-t_∞)/(λA_c)`"],"result":"肋片导热的微分方程为 `d²t/dx² = hP(t-t_∞)/(λA_c)`，边界条件为 `x = 0, t = t₀` 与 `x = H, dt/dx = 0`（本片未给出其温度分布与散热量的解）","basis":"课件 p082–p088（原文）"},{"id":"q-h2e-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p105（原文）","keyPoints":["肋效率的定义","肋效率与肋片高度、总效率的区别"],"stem":"下面关于肋效率的说法正确的是","options":[{"k":"A","t":"长肋片比短肋片好"},{"k":"B","t":"单个翅片的肋效率比总体的肋效率高"},{"k":"C","t":"翅片高度为零时肋效率为0"},{"k":"D","t":"表示实际散热量与假想肋片具有肋基温度时散热量之比"}],"answer":"D","why":["A ✗ 课件未支持「长肋片比短肋片好」，课件 p102 反而指出肋效率随肋片换热增强而降低、一般要求 η_f > 0.8。","B ✗ 课件 p104 定义的是肋面总效率 η_o，并未给出「单个翅片肋效率比总体高」的结论。","C ✗ 课件 p098 给出等截面直肋 η_f = th(mH)/mH，当 H→0 时该式趋于 1 而非 0。","D ✓ 课件 p097 原文：肋效率 η_f 的定义为「肋片的实际散热量 / 整个肋片均处于温度 t_0 时的散热量」，即实际散热量与假想整片均处于肋基温度时散热量之比。"],"basis":"课件 p097 / p105（原文）"},{"id":"q-h2e-2","kind":"例题","priority":1,"source":"课件例题","sourceDetail":"课件 p092–p095（原文）","keyPoints":["等截面直肋分析解的应用","θ_H = θ_0/ch(mH)","mH = √(h/(λδ))·H","测温误差计算"],"stem":"温度计套管测温误差分析：用温度计套管测量管道内流体温度，已知温度计读数 100℃，套管连接处（根部）温度 t_0 = 50℃，套管高 H = 140mm，壁厚 δ = 1mm，套管导热系数 λ = 58.2 W/(m·K)，套管表面传热系数 h = 29.1 W/(m²·K)。把套管看成截面积为 πdδ 的等截面直肋，求被测流体的真实温度及测温误差。","given":["温度计读数（套管顶端温度）t_H = 100℃","套管连接处 t_0 = 50℃","套管高 H = 140mm，壁厚 δ = 1mm","导热系数 λ = 58.2 W/(m·K)","表面传热系数 h = 29.1 W/(m²·K)","套管顶端按绝热处理，套管可视为换热周长 πd、截面积 πdδ 的等截面直肋"],"ask":["求被测流体的真实温度 t_f","求测温误差 t_f − t_H"],"steps":["第一步 按顶端绝热的等截面直肋分析解写出顶端过剩温度关系：`θ_H = t_H − t_f = (t_0 − t_f)/ch(mH)`。","第二步 反解流体真实温度：`t_f = (t_H·ch(mH) − t_0)/(ch(mH) − 1)`。","第三步 计算参数（换热周长 πd，套管截面积 πdδ）：`mH = √(hP/(λA_c))·H = √(h/(λδ))·H = 3.13`。","第四步 查得 `ch3.13 = 11.5`，代入解得 `t_f = 104.7℃`。"],"result":"被测流体真实温度 `t_f = 104.7℃`，测量误差为 4.7℃（读数偏低）。","basis":"课件 p092–p095（原文）"},{"id":"q-h2f-1","kind":"计算","priority":1,"source":"课件例题","sourceDetail":"课件 p112–p115（原文）","keyPoints":["有内热源平壁导热","热平衡与牛顿冷却公式","傅里叶定律"],"stem":"例题2-9：核反应堆中燃料元件散热放大简化模型是一个三层平板组成的大平壁，中间燃料层为内热源，铝板中无内热源；由于对称性只研究半个模型。试求热流密度及各界面温度。","given":["三层平板大平壁，中间燃料层为内热源，铝板中无内热源，取半个模型","δ₁/2 = 0.007 m，δ₂ = 0.006 m","内热源强度 Φ̇ = 1.5×10⁷ W/m³","冷却水温度 t_f = 150 ℃，h = 3500 W/(m²·K)","铝板导热系数 λ₂ = 100 W/(m²·K)，燃料层导热系数 λ₁ = 35 W/(m·K)"],"ask":["求通过的热流密度 q","求铝板表面温度 t₂ 与界面温度 t₁、中心温度 t₀"],"steps":["第一步 据热平衡求热流密度：`q = (δ₁/2)Φ̇ = 0.014/2 × 1.5×10⁷ = 1.05×10⁵ W/m²`。","第二步 按牛顿冷却公式 `q = h(t₂ - t_f)` 得 `t₂ = t_f + q/h = 150 + 1.05×10⁵/3500 = 180 ℃`。","第三步 按傅里叶定律 `q = λ₂(t - t₂)/δ₂` 得 `t₁ = qδ₂/λ₂ + t₂ = 1.05×10⁵×0.006/100 + 180 = 186.3 ℃`。","第四步 中心温度 `t₀ = t₁ + Φ̇(δ₁/2)²/(2λ₁) = 186.3 + 1.5×10⁷×0.007²/(2×35) = 196.8 ℃`。"],"result":"t₁ = 186.3 ℃，t₀ = 196.8 ℃；热阻分析从界面温度开始而不是从 t₀ 开始，因为有内热源不能用热阻概念来分析。","basis":"课件 p112–p115（原文）"},{"id":"q-h2f-2","kind":"计算","priority":1,"source":"课件例题","sourceDetail":"课件 p117–p121（原文）","keyPoints":["有内热源圆柱体导热","迭代计算","接触热阻"],"stem":"例题2-10：铀燃料充装于由锆锡合金制成的圆管中，管子成正方形布置，管束之间有冷却水流过，管子内壁与铀棒间存在接触热阻。试确定稳态过程中铀棒的最高温度。","given":["管子正方形布置，间距 17.5 mm，d_i = 8.25 mm，d_o = 9.27 mm","Φ̇ = 8.73×10⁸ W/m³","t_f = 400K，h = 10000 W/(m²·K)，接触热阻对应 h_ct = 6000 W/(m²·K)","锆锡合金 λ_zir：500K 时 16.2、600K 时 17.2、800K 时 19.2 W/(m·K)","铀燃料 λ_u：1000K 时 3.9、1500K 时 2.6、2000K 时 2.3 W/(m·K)"],"ask":["确定稳态运行中铀棒的最高温度 T_max"],"steps":["第一步 每米长度铀棒外表面散热量 `Φ = Φ̇(π/4)d_i² = 8.73×10⁸×3.14/4×0.825² = 46700 W`。","第二步 外表面温度 `T_u = T_f + Φ[1/(2πr_i h_ct) + ln(r_o/r_i)/(2πλ_zir) + 1/(2πr_o h_o)] = 400 + 46700(0.00642 + 0.0256/λ_zir + 0.00328)`。","第三步 先假定锆锡合金管子平均温度 600K，`λ_zir = 17.2 W/(m·K)`，得 `T_u = 923K`。","第四步 假定铀棒平均温度 1500K，`λ_u = 2.6 W/(m·K)`，`T_max = T_u + (1/4)(Φ̇ r_i²/λ_u) = 2355K`。","第五步 检验壁温 `T_tubem = 588K` 与 600K 接近、假设有效；铀棒平均温度 `T_um = 1639K` 与 1500K 相差较远，修正取 `λ_u = 2.5 W/(m·K)`，得 `T_max = 2412K`。"],"result":"铀棒最高温度 T_max = 2412K。","basis":"课件 p117–p121（原文）"},{"id":"q-h2f-3","kind":"计算","priority":1,"source":"课件例题","sourceDetail":"课件 p130（原文）","keyPoints":["墙壁传热","对流换热热阻","热阻串联"],"stem":"课堂练习：已知某室内气温 t_f1=20 ℃，室外气温 t_f2=-20 ℃，室内外空气对墙面的对流换热系数分别为 h₁=10 W/(m²·k) 和 h₂=20 W/(m²·k)，墙壁厚度 δ=360 mm，导热系数 λ=0.5 W/(m·k)，换热面积 A=15 m²。试计算通过墙壁的热量损失。","given":["t_f1 = 20 ℃，t_f2 = -20 ℃","h₁ = 10 W/(m²·k)，h₂ = 20 W/(m²·k)","δ = 360 mm，λ = 0.5 W/(m·k)","A = 15 m²"],"ask":["计算通过墙壁的热量损失 Φ"],"steps":["第一步 按热阻串联写出总热阻 `R_总 = 1/(h₁A) + δ/(λA) + 1/(h₂A)`。","第二步 传热量 `Φ = (t_f1 - t_f2)/R_总`。"],"result":"课件未给出计算结果。","basis":"课件 p130（原文）"},{"id":"q-h2f-4","kind":"计算","priority":1,"source":"课件例题","sourceDetail":"课件 p131（原文）","keyPoints":["复合壁导热","保温层厚度","热损失限制"],"stem":"课堂练习：有一厚 20 mm 的平面墙，导热系数为 1.3 W/(m·K)，为使每平方米墙的热损失不超过 1500 W，在外表面覆盖了一层导热系数为 0.12 W/(m·K) 的保温材料。已知复合壁两侧的温度分别为 750 ℃ 和 55 ℃，试确定此保温层的厚度。","given":["平面墙厚 20 mm，导热系数 1.3 W/(m·K)","每平方米墙热损失不超过 1500 W","保温材料导热系数 0.12 W/(m·K)","复合壁两侧温度分别为 750 ℃ 和 55 ℃"],"ask":["确定保温层的厚度 δ₂"],"steps":["第一步 由 `q = (t₁ - t₂)/(δ₁/λ₁ + δ₂/λ₂) ≤ 1500 W/m²` 建立方程。","第二步 解出保温层厚度 δ₂。"],"result":"课件未给出计算结果。","basis":"课件 p131（原文）"}],"images":{"1":{"w":"img/heat-ch2/p001.webp","j":"img/heat-ch2/p001.jpg"},"2":{"w":"img/heat-ch2/p002.webp","j":"img/heat-ch2/p002.jpg"},"3":{"w":"img/heat-ch2/p003.webp","j":"img/heat-ch2/p003.jpg"},"4":{"w":"img/heat-ch2/p004.webp","j":"img/heat-ch2/p004.jpg"},"5":{"w":"img/heat-ch2/p005.webp","j":"img/heat-ch2/p005.jpg"},"6":{"w":"img/heat-ch2/p006.webp","j":"img/heat-ch2/p006.jpg"},"7":{"w":"img/heat-ch2/p007.webp","j":"img/heat-ch2/p007.jpg"},"8":{"w":"img/heat-ch2/p008.webp","j":"img/heat-ch2/p008.jpg"},"9":{"w":"img/heat-ch2/p009.webp","j":"img/heat-ch2/p009.jpg"},"10":{"w":"img/heat-ch2/p010.webp","j":"img/heat-ch2/p010.jpg"},"11":{"w":"img/heat-ch2/p011.webp","j":"img/heat-ch2/p011.jpg"},"12":{"w":"img/heat-ch2/p012.webp","j":"img/heat-ch2/p012.jpg"},"13":{"w":"img/heat-ch2/p013.webp","j":"img/heat-ch2/p013.jpg"},"14":{"w":"img/heat-ch2/p014.webp","j":"img/heat-ch2/p014.jpg"},"15":{"w":"img/heat-ch2/p015.webp","j":"img/heat-ch2/p015.jpg"},"16":{"w":"img/heat-ch2/p016.webp","j":"img/heat-ch2/p01 hildren":[{"label":"工程上需定内部温度场随时间的变化","children":[]},{"label":"部件急变温度产生热应力需定瞬时温度场","children":[]},{"label":"热处理与加热炉停留时间是典型应用","children":[]},{"label":"主要目的：掌握温度场与换热量算法","children":[]},{"label":"分类：周期性与非周期性非稳态导热","children":[]},{"label":"温度变化率跨度从极低速到极高速","children":[]},{"label":"短脉冲激光作用须考虑非傅里叶效应","children":[]},{"label":"特点一：热扰动传递到一定距离需要时间","children":[]},{"label":"特点二：非正规状况与正规状况两阶段","children":[]},{"label":"导热体内能随时间变化需储存或释放能量","children":[]},{"label":"导热微分方程解的唯一性定律","children":[]},{"label":"第三类边界条件及未知与已知量","children":[]},{"label":"Bi数对非稳态导热的三种影响","children":[]},{"label":"Bi→∞与Bi→0两种极限情形","children":[]},{"label":"特征数与特征尺度的定义与取法","children":[]}]},{"label":"3-2 零维问题的分析解法","children":[{"label":"基本思想：Bi→0时物体温度趋于一致","children":[]},{"label":"集中参数法：温度只随时间变化","children":[]},{"label":"控制方程：空间导数为零化为常微分","children":[]},{"label":"初始条件为τ=0时t=t_0，不需边界条件","children":[]},{"label":"表面换热折算为物体体积等效热源","children":[]},{"label":"过余温度θ与温度场指数解析解","children":[]},{"label":"分析解指数改写为Bi_V与Fo_V乘积","children":[]},{"label":"非稳态导热量按热平衡与积分两法求","children":[]},{"label":"时间常数τ_c反映温度响应快慢","children":[]},{"label":"时间常数越小对温度变化响应越快","children":[]},{"label":"傅里叶数的物理意义为两时间间隔之比","children":[]},{"label":"集中参数法适用范围 Bi≤0.1","children":[]},{"label":"特征长度取平板δ圆柱0.5R球0.33R","children":[]},{"label":"特征尺度取 V/A 时最大偏差13%","children":[]},{"label":"实例 厨师吹肉丝估算冷却时间","children":[]},{"label":"例题3-1 钢球冷却到300℃的时间","children":[]},{"label":"例题3-2 温度计时间常数与5min读数","children":[]},{"label":"例题3-3 钢圆柱体加热到800℃的时间","children":[]}]},{"label":"3-3 典型的一维问题分析解","children":[{"label":"无限大平壁物理问题描述","children":[]},{"label":"数学描写与非齐次边界条件","children":[]},{"label":"引入过剩温度使边界条件齐次化","children":[]},{"label":"分离变量法求解思路","children":[]},{"label":"解的数学表达式与超越方程","children":[]},{"label":"平板圆柱球无量纲温度分析解","children":[]},{"label":"μ1 随 Bi 的变化规律","children":[]},{"label":"正规状况阶段的物理与数学意义","children":[]},{"label":"正规状况阶段分析解的简化","children":[]},{"label":"一段时间内传递热量的计算式","children":[]},{"label":"正规状况阶段导热量与温度场统一式","children":[]},{"label":"平板、柱体、球体的 A、B、f 表达式","children":[]},{"label":"Campо 近似拟合公式求 μ₁、A、B","children":[]},{"label":"拟合公式中常数与 J₀(x) 拟合常数","children":[]},{"label":"海斯勒图线法主图查 θ_m/θ₀","children":[]},{"label":"辅图查 θ/θ_m，Bi ≤ 0.1 时相差小于 5%","children":[]},{"label":"热量诺模图由 (BiFo², Bi) 查 Q/Q₀","children":[]},{"label":"图线法优点简易快捷、精度受限","children":[]},{"label":"分析解适用范围拓宽与 Fo、Bi 影响","children":[]},{"label":"例题3-4 钢板加热时间与最大温差","children":[]}]},{"label":"3-4 半无限大物体的非稳态导热","children":[{"label":"半无限大物体的定义与判定条件","children":[]},{"label":"三种类型边界条件及对应数学式","children":[]},{"label":"第1类边界条件的数学描写","children":[]},{"label":"误差函数形式的温度分布分析解","children":[]},{"label":"热流密度与表面导热量计算式","children":[]},{"label":"吸热系数 √(ρcλ) 的物理意义","children":[]},{"label":"x/(2√(aτ)) ≥ 2 时温度尚未变化","children":[]},{"label":"惰性时间与局部傅里叶数判据","children":[]},{"label":"例题3-6 铸件砂型温度计算","children":[]},{"label":"例题3-7 地下埋管深度计算","children":[]}]},{"label":"3-5 简单形状多维问题的分析解（课件未覆盖）","children":[]}]},"points":[{"id":"p-h3a-1","title":"非稳态导热的工程背景与主要目的","key":true,"source":"课件 p002–p004","items":["许多工程实际问题需要确定物体内部的温度场随时间的变化，或确定内部温度到达某一限定值所需的时间。","在机器启动、停机及变动工况时，急剧的温度变化会使部件内产生热应力而破坏，因此需要确定物体内部的瞬时温度场。","钢制工件的热处理是一个典型的非稳态导热过程，掌握工件中温度变化的速率是控制工件热处理质量的重要因素。","金属在加热炉内加热时，需要确定它在加热炉内停留的时间，以保证达到规定的中心温度。","主要目的：了解和掌握非稳态导热过程中温度场的变化规律及换热量的计算方法。","实例「热铁块投入水中」：铁块 M₁ 温度为 300℃，水 M₂ 温度为 20℃，其温度场与热量分别为 `t=f(x,y,z,τ)`、`Q=f(τ)`。"]},{"id":"p-h3a-2","title":"非稳态导热的分类与两个特点","key":true,"source":"课件 p005 / p007–p011","items":["3.1 非稳态导热的基本概念（Un-steady-state heat conduction）；3.1.1 非稳态导热的分类及特点。","分类：**周期性**——物体中各点温度及热流密度随时间作周期性变化，如太阳对地球辐照引起的地球温度变化；**非周期性**——物体的温度随时间推移逐渐趋向于一个恒定值，如动力机械从启动到稳定运行，本章研究内容。","非稳态导热过程中物体的温度变化率从低速的缓慢变化，到激光脉冲的极高速变化（原图上下标不清），其时 Fourier 定律可能就不再适用。","不同非稳态导热过程中物体温度变化率举例：地球表面温度变化、金属热处理、快速干燥、汽车制动盘、内燃机气缸、等离子体喷涂、超急速沸腾（喷墨指打印头）；横轴为 `|∂t/∂τ|/(K/s)`，自左端「极低速非稳态导热」到右端「极高速非稳态导热」，量级从 `10⁻⁴` 到 `10¹²`。","短脉冲激光作用的时间可小到皮秒（Pico Sec.），`10⁻¹² s`，甚至飞秒（Femto Sec.），`10⁻¹⁵ s`；这时必须考虑非傅里叶效应。","特点（1）：界面上所发生的热扰动传递到一定距离需要一定的时间；在同一时刻，热量传递方向不同截面上的导热量不相同。","特点（2）：在非稳态导热物体中的温度分布存在着两个不同的阶段——（a）非正规状况阶段（Non-regular regime）：温度分布主要受初始温度分布的影响（金属壁中的分布 P-B、P-C）；（b）正规状况（Regular regime）：初始温度分布影响逐渐消失，不同时刻温度分布主要取决于边界条件及物性（分布 P-D、P-E、P-G 等）。","导热体的内能随时间发生变化，导热体要储存（被加热时）或释放（被冷却时）能量；图中 `Φ₁` 为进入热量、`Φ₂` 为导出热量，`Φ_ac` 表示在物体被加热的非稳态导热过程中物体内积聚的热量。","用 ANSYS 演示：3mm 厚铝板，初始 300K，左侧突然变为 500K，右侧温度维持 300K，上下前后表面绝热，平板中温度变化过程。"]},{"id":"p-h3a-3","title":"3.1.2 导热微分方程解的唯一性定律","key":true,"source":"课件 p012–p013","items":["用矢量表示的三个坐标系下导热微分方程的统一形式：`ρc(∂t/∂τ)=λdiv(gradt)+Φ̇`，或者 `∂t/∂τ=λ∇²t+Φ̇/(ρc)`。","其中 `∇²t` 称为 Laplace 算子，对直角坐标系有 `∇²t=∂²t/∂x²+∂²t/∂y²+∂²t/∂z²`。","初始条件（IC）：`t=f(x,y,z,τ=0)=f(x,y,z)` 给定；边界条件（BC）可能有三种：第 I、II、III 类边界条件。","第三类边界条件较常见：`-λ(∂t/∂n)_w=h(t_w-t_f)`；式中未知的是表面法向导数与表面温度 `t_w`，已知的是表面法线、表面对流传热系数 `h` 与流体温度 `t_f`。","凡能满足上述控制方程和初始条件、边界条件的解是唯一的解（解的唯一性定律）。","偏微分方程解的唯一性证明是数学上的重要命题，N-S 方程解的唯一性尚未证明！"]},{"id":"p-h3a-4","title":"3.1.3 Bi数对非稳态导热的影响","key":true,"source":"课件 p014–p016","items":["对厚 `2δ` 的平板中非稳态导热，根据导热物体的导热系数和表面换热条件分三种情况。","表面换热十分强烈：`1/h≪δ/λ`；表面换热十分微弱：`1/h≫δ/λ`；表面热阻～导热热阻：`1/h~δ/λ`。","`δ/λ` 与 `1/h` 之比称为毕渥数（Biot number）：`Bi=hδ/λ=(δ/λ)/(1/h)`，即「物体内部导热热阻 / 物体表面对流换热热阻」；式中 `δ` 为导热平板的半厚。","`Bi→∞` 表示表面传热系数 `h→∞`（`Bi=hδ/λ`），对流换热热阻→0，平壁的表面温度几乎从冷却过程一开始就立刻降到流体温度 `t_∞`；此时第三类边界条件→第一类边界条件（III BC → I BC）。","`Bi→0` 表示物体导热系数很大、导热热阻→0，任何时间物体内的温度分布都趋于均匀一致，分析最简单；`0<Bi<∞` 时对流热阻与物体导热热阻具有相同量级，情况介于两者之间。"]},{"id":"p-h3a-5","title":"特征数（准则数）与特征尺度","key":true,"source":"课件 p017","items":["像毕渥数这样一类表征物理过程特征的无量纲数称为特征数（Characteristic number），又称准则数（Criterion）。","一般以对揭示过程特性做出贡献的科学家命名。","特征数定义中的尺度称为特征尺度（Characteristic length），常用 `l` 表示；在这里取为平板的半个厚度。","遇到一个新的特征数时，应该掌握其定义，了解其中特征尺度的取法，掌握特征数的物理意义。"]},{"id":"p-h3a-6","title":"3.2 集中参数法的基本思想","key":true,"source":"课件 p019–p020","items":["3.2 零维问题分析解法-集中参数法；3.2.1 集中参数法温度场分析解。","基本思想：`Bi→0` 时物体内部导热热阻远小于表面换热热阻，任意时刻导热体内部各点温度趋于一致，它只随时间变化，而不随空间而异，属于零维问题；这种分析法称为集中参数法（Lumped parameter method），此时 `t=f(τ)`。","只要物体内部任意时刻温度都基本均匀一致，不论物体形状，也不论被加热或被冷却，都可以按照集中参数法来处理。","设物体体积为 `V`、表面积为 `A`、物性为 `ρ, λ, c`、表面换热系数 `h` 已知、流体温度为 `t_∞`；被冷却时初始温度 `t_0>t_∞`，被加热时初始温度 `t_0<t_∞`。"]},{"id":"p-h3a-7","title":"集中参数法的数学描写与等效热源","key":true,"source":"课件 p021–p022","items":["1）控制方程：由 `∂t/∂τ=a∇²t+Φ̇/(ρc)`，因「空间导数为零」，化为 `dt/dτ=Φ̇/(ρc)`。","初始条件：`τ=0, t=t_0`（不需要边界条件）；`Φ̇` 为广义/等效热源。","与肋片导热问题类似，发生热量交换的边界不是计算边界，因此界面上交换的热量折算成整个物体的体积热源。","2）确定广义/等效热源：`Ah(t-t_∞)=-VΦ̇`；式中左端为表面对流传热散失（得到）的热量，右端为作为物体本身负（正）的内热源。","故得 `Φ̇=-Ah(t-t_∞)/V`；所以控制方程式可改写为 `ρVc(dt/dτ)=-Ah(t-t_∞)`，左端 `ρVc(dt/dτ)` 为单位时间内热力学能增量，右端为与外界在表面上的换热量。"]},{"id":"p-h3a-8","title":"集中参数法的求解与温度场分析解","key":true,"source":"课件 p023–p024","items":["3）求解：令 `θ=t-t_∞` 为过余温度，方程式及初始条件可改写为 `ρVc(dθ/dτ)=-hAθ`，`τ=0, θ_0=t_0-t_∞`。","分离变量得 `(1/θ)dθ=-(hA/(ρVc))dτ`；对时间 `τ` 从 0 到任意时刻 `τ` 积分：`∫_{θ_0}^{θ}(1/θ)dθ=-(hA/(ρVc))∫_0^{τ}dτ`。","积分结果：`θ/θ_0=(t-t_∞)/(t_0-t_∞)=e^{-(hA/(ρVc))τ}`。","式中指数可作如下变化：`(hA/(ρVc))τ=(h(V/A)/λ)·(aτ/(V/A)²)=Bi_V Fo_V`。","式中 `Bi_V` 是特征尺度 `l` 用 `V/A` 表示的毕渥数；`Fo_V` 是特征尺度 `l` 用 `V/A` 表示的傅里叶数。","`Fo=aτ/l_c²=τ/(l_c²/a)`；`Fo` 是表征非稳态过程进行深度的无量纲时间，其值越大，热扰动就越深入地传播到物体内部，物体内各点的温度越接近周围介质的温度。"]},{"id":"p-h3a-9","title":"3.2.2 非稳态导热量的计算","key":true,"source":"课件 p025","items":["3.2.2 分析解的应用及傅里叶数的意义；1. 非稳态导热量计算：导热体在时间 0～τ 内传给流体的总热量是多少？","任意时刻 `Φ(τ)=-ρVc(dt/dτ)=(t_0-t_∞)hA exp(-(hA/(ρVc))τ)`。","从开始到 `τ` 时刻 `Q_{0-τ}=∫_0^{τ}Φ(τ)dτ`。","总传热量也可从该段时间的热平衡来计算：`Q_{0-τ}=ρVc(t_0-t)=ρVc(t_0-t_∞+t_∞-t)`。","积分结果：`Q_{0-τ}=θ_0ρVc((t_0-t_∞)-(t-t_∞))/(t_0-t_∞)=θ_0ρVc(1-e^{-(hA/(ρVc))τ})` [J]。"]},{"id":"p-h3a-10","title":"时间常数及其物理意义","key":true,"source":"课件 p026–p027","items":["2. 时间常数（Time constant）：令使 `(hA/ρVc)τ=1` 的时间为 `τ_c`，称为时间常数，它的数值反映了物体对温度变化响应的快慢。","如果 `τ=ρVc/hA`，则 `θ/θ_0=e^{-1}=0.368=36.8%`，到该时刻非稳态过程完成了全过程的 63.2%。","所以时间常数 `τ_c` 越小，对温度变化的响应越快。","动态测量时，时间常数越小，越能正确反映被测温度的变化；图中热电偶丝很细，直径可小到 0.05~0.02mm。"]},{"id":"p-h3a-11","title":"傅里叶数的物理意义","key":true,"source":"课件 p027","items":["3. 傅里叶数的意义：傅里叶数的物理意义可以理解为两个时间间隔相除所得的无量纲时间。","`Fo=τ/(l_c²/a)` =（从边界上开始发生热扰动的时刻起到所计算时刻为止的时间间隔）/（使边界上发生的有限大小的热扰动穿过一定厚度的固体层扩散到 `l_c²` 的面积上所需的时间）。","这一无量纲时间越大，热扰动就越深入地传播到物体内部。"]},{"id":"p-h3b-1","title":"集中参数法的适用范围","key":true,"source":"课件 p029","items":["课件给出 `3.2.3 集中参数法的适用范围`：当 `Bi=hl/λ ≤ 0.1` 时，**过剩温度最大偏差小于等于 5%**。","`l` 为特征长度，λ 为导热物体的导热系数。","特征长度取法：**平板为 δ**，**圆柱为 0.5R**，**球为 0.33R**（图中平板标注半厚 δ、外形尺寸 2δ）。","如果特征尺度取为 `l_c = V/A`，则 `Bi=hl_c/λ ≤ 0.1` 的条件导致最大偏差增加到 **13%**。"]},{"id":"p-h3b-2","title":"集中参数法实例——厨师吹肉丝","key":true,"source":"课件 p030–p031","items":["题目：一厨师在炒鸡肉丝时从 100℃ 的热炒锅中取出一鸡肉丝，用口吹了一会，待其降至 65℃ 时再放入口中，试估算厨师需要吹多长时间。","已知：出锅时鸡肉丝可视为平均直径为 2mm 的圆条，口中吹出的气流温度为 30℃，与鸡肉丝之间的表面传热系数为 100W/m²K；鸡肉丝 `ρ=810 kg/m³`，`c=3.35kJ/(kg·℃)`，`λ=1.1 W/(m·K)`。","解：首先检验是否可用集总参数法，计算 `Bi_V=h(V/A)/λ=h(r/2)/λ=0.045<0.05`，故可以采用集总参数法。","`(t-t_∞)/(t_0-t_∞)=exp(-(hA/ρcV)τ)`，其中 `hA/ρcV=2h/(cρr)=0.0705 s⁻¹`。","`(t-t_∞)/(t_0-t_∞)=(65-30)/(100-30)=0.5`，于是 `0.5=exp(-0.0705τ)`，解得 `τ=9.83s`。"]},{"id":"p-h3b-3","title":"例题3-1 钢球冷却计算","key":true,"source":"课件 p032–p033","items":["题目：一直径为 5cm 的钢球，初始温度为 450℃，忽然被置于温度为 30℃ 的空气中，钢球表面与周围环境间的传热系数为 24W/(m²·K)，试计算钢球冷却到 300℃ 所需的时间。","已知钢球实测数据：`c=0.48kJ/(kg.K)`，`r=7753kg/m³`，`λ=33W/(m·K)`。","假设：(1) 表面传热系数指平均复合传热系数，取为常数；(2) 常物性。","分析：首先检验是否可用集中参数法，计算 Bi 数 `Bi=hR/λ=24×0.05/3/33=0.00606<0.0333`，可以采用。","计算：`hA/ρcV=24×4π×0.025²/(7753×480×4/3×π×0.025³)=7.74×10⁻⁴ s⁻¹`。","据式(3-9) 有 `(t-t_∞)/(t_0-t_∞)=(300℃-30℃)/(450℃-30℃)=exp(-7.74×10⁻⁴ τ)`，由此解得 `τ=570 s=0.158 h`。"]},{"id":"p-h3b-4","title":"例题3-2 温度计时间常数","key":true,"source":"课件 p034–p037","items":["题目：一温度计的水银泡呈圆柱状，长 20mm，内径为 4mm，初始温度为 t_0，插入温度较高的储气罐中测量气体温度；水银泡同气体间的对流换热表面传热系数 `h=11.63W/(m²·K)`，水银泡一层薄玻璃的作用可忽略不计。","已知水银物性：`λ=10.36 W/(m·K)`，`ρ=13110kg/m³`，`c=0.138kJ/(kg·K)`。","分析：`V/A=πR²l/(2πRl+πR²)=0.002×0.02/(2×(0.20+0.001))=0.953×10⁻³ m`；`Bi_V=h(V/A)/λ=11.63×0.953×10⁻³/10.36=1.07×10⁻³<0.05`，可以采用集中参数法。","计算时间常数：`τ_c=ρcV/hA=13110×138×0.953×10⁻³/11.63=148s`。","计算 `F_0V=aτ/(V/A)²=λ/(cρ)·τ/(V/A)²=10.36/(0.138×10³×13110)×5×60/(0.953×10⁻³)²=1.89×10³`。","`θ/θ_0=exp(-Bi_V F_0V)=exp(-1.07×10⁻³×1.89×10³)=exp(-2.02)=0.133`。","结论：经 5 分钟后温度计读数的过剩温度是初始过剩温度的 **13.3%**，即读数上升了这次测量中温度跃升的 **86.7%**。","讨论：水银温度计测量流体温度时必须放置足够长时间使温度计与流体基本达到热平衡；对于非稳态流体温度场，水银热容量过大时无法跟上流体温度变化，动态响应特性很差，需采用时间常数很小的感温元件，如热电偶。"]},{"id":"p-h3b-5","title":"例题3-3 钢圆柱体加热时间","key":true,"source":"课件 p038–p040","items":["题目：一直径为 5cm、长为 30cm 的钢圆柱体，初始温度为 30℃，放入炉温为 1200℃ 的加热炉中加热，升温到 800℃ 方可取出；复合换热表面传热系数为 140W/(m²·K)，物性取与例3-1 相同的值 `c=0.48kJ/(kg·K)`，`r=7753kg/m³`，`λ=33W/(m·K)`，问需多少时间。","假设：(1) 表面复合传热系数为常数；(2) 常物性。","分析：`Bi_v=h(V/A)/λ=h[(πd²l/4)÷(πdl+2πd²/4)]/λ=(h/λ)·(dl/4)/(l+d/2)=140/33×0.50×0.3/(0.3+0.025)=0.049<0.05`，可以采用集中参数法。","计算：`hA/cρV=(h/cρ)(V/A)⁻¹=(h/cρ)·4(l+d/2)/(dl)=140×4×0.325/(0.48×10³×7753×0.005×0.3)=0.326×10⁻² s⁻¹`。","`θ/θ_0=(t-t_∞)/(t_0-t_∞)=(800-1200)/(30-1200)=0.342`，按式(3-6) 有 `0.342=exp(-0.326×10⁻² τ)`，由此解得 `τ=329 s`。","讨论：本例中以 l_c 作为特征长度的 Bi 数已达 0.049，按 0.05 估算柱体表面过剩温度与中心过剩温度之比为 0.95；经过 329s 后柱体表面温度达 800℃，中心温度为 779℃；需准确预测时应采用一维问题的分析解。"]},{"id":"p-h3b-6","title":"第三章章节目录","key":true,"source":"课件 p041","items":["课件给出本章结构图：第3章 非稳态热传导的计算。","下辖五节：`3-1 非稳态导热基本概念`、`3-2 零维问题的分析解法`、`3-3 典型的一维问题分析解`、`3-4 半无限大物体的非稳态导热`、`3-5 简单形状多维问题的分析解`。","其中 `3-3 典型的一维问题分析解` 以红色高亮，为本节讲课重点。"]},{"id":"p-h3b-7","title":"一维问题的物理描述与数学描写","key":true,"source":"课件 p042–p043","items":["`3.3 一维非稳态导热的分析解`，其 `3.3.1 三种几何形状温度场的分析解`。","物理问题描述：厚度 `2δ` 的无限大平壁，λ、a 为已知常数，τ=0 时温度为 `t_0`，突然将其放置于温度为 `t_∞` 并保持不变的流体中，两侧表面与介质之间的表面传热系数为 h，要求确定平板中的瞬态温度场。","所谓无限大，仅指温度仅在厚度方向发生变化，平板的截面积可大可小；例如一块四周绝热、前后表面温度不同的平板导热就属之。","数学描写（中心截面为对称面）：`∂t/∂τ=a∂²t/∂x²`；`τ=0, t=t_0`；`x=0, ∂t/∂x=0`；`x=δ, -λ∂t/∂x=h(t|_{x=δ}-t_∞)`（非齐次边界条件）。"]},{"id":"p-h3b-8","title":"边界条件齐次化与分离变量","key":true,"source":"课件 p044–p045","items":["为使边界条件齐次化，引入**过剩温度** `θ=t-t_∞`。","上述数学描写转化为：`∂θ/∂τ=a∂²θ/∂x²`；`τ=0, θ=t_0-t_∞=θ_0`；`x=0, ∂θ/∂x=0`；`x=δ, -λ∂θ/∂x=hθ|_{x=δ}`。","微分方程及边界条件均为齐次，可以采用**分离变量法**求解。","取 `θ=X(x)·φ(τ)`，方程化为 `1/(aφ)·dφ/dτ=1/X·d²X/dx²`，左端只为 τ 的函数、右端只为 x 的函数，故左右端只能为常数 `=const`。","由左端获得过剩温度与时间的关系，由右端获得与空间位置的关系，两者相乘为解的一个分量；按照 Fourier 展开的思想，由无穷多个分量的叠加构成分析解，系数由给定的初始分布与边界条件决定。"]},{"id":"p-h3b-9","title":"解的数学表达式与超越方程","key":true,"source":"课件 p046","items":["平板无因次过剩温度的解为 `θ(x,τ)/θ_0=2∑_{n=1}^{∞} e^{-(μ_n)²(aτ/δ²)}·sin(μ_n)cos[(μ_n)x/δ]/(μ_n+sin(μ_n)cos(μ_n))`。","式中 `θ(x,τ)/θ_0` 为**无量纲过剩温度**，指数项表示**时间自变量影响**，分式项表示**空间自变量的影响**。","`μ_n` 是超越方程 `tan μ_n=(hδ/λ)(1/μ_n)=Bi/μ_n` 的根。","`aτ/δ²=Fo`，可见平板的分析解可表示为 `θ(x,τ)/θ_0=f(Bi, Fo, x/δ)`。"]},{"id":"p-h3b-10","title":"平板圆柱球的无量纲温度分析解","key":true,"source":"课件 p047–p048","items":["平板（第3类边界）：`θ(η,τ)/θ_0=∑_{n=1}^{∞} C_n exp(-μ_n²Fo)cos(μ_nη)`，`C_n=2sin(μ_n)/(μ_n+cos(μ_n)sin(μ_n))`，根满足 `tan(μ_n)=Bi/μ_n`；`η=x/δ`，`Fo=aτ/δ²`，`Bi=hδ/λ`。","圆柱：`θ(η,τ)/θ_0=∑_{n=1}^{∞} C_n exp(-μ_n²Fo)J_0(μ_nη)`，`C_n=(2/μ_n)·J_1(μ_n)/(J_0²(μ_n)+J_1²(μ_n))`，根满足 `μ_n J_1(μ_n)/J_0(μ_n)=Bi`；`η=r/R`，`Fo=aτ/R²`，`Bi=hR/λ`。","球：`θ(η,τ)/θ_0=∑_{n=1}^{∞} C_n exp(-μ_n²Fo)(1/(μ_nη))sin(μ_nη)`，`C_n=2(sin(μ_n)-μ_n cos(μ_n))/(μ_n-sin(μ_n)cos(μ_n))`，根满足 `1-μ_n cot(μ_n)=Bi`；`η=r/R`，`Fo=aτ/R²`，`Bi=hR/λ`。","`μ_n` 取决于 Bi 数，无穷级数中第一项影响最大；`Fo>0.2` 后只取级数第一项和完整级数计算的偏差小于 1%，可只用第一项来计算，称为**正规状况**。","μ_1 随 Bi 变化的曲线：在一定 Bi 数下，μ_n 之值随 n 的增加而迅速增加；在一定 n 下，μ_n 之值随 Bi 的增加而迅速增加（球、圆柱、平板曲线依次降低）。"]},{"id":"p-h3b-11","title":"正规状况阶段及分析解的简化","key":true,"source":"课件 p049–p051","items":["`3.3.2 正规状况阶段及分析解的简化`：正规状况从物理意义上说就是**温度初始分布的影响已经消失的阶段**，温度分布只取决于边界条件。","数学上：初始分布通过无穷级数来满足，只用第一项造成的偏差小于 1% 就表明其影响已消失；平板（圆柱、球）中任一点的过剩温度与平板中心的过剩温度之比只与几何位置和边界条件有关，而与时间无关；级数第一项就是正规状况阶段的解。","`Fo<0.2` 则是瞬态温度变化的初始阶段或非正规状况阶段，需要采用完全的级数计算。","正规状况简化式——平板：`θ(x,τ)/θ_0=2sin(μ_1)/(μ_1+sin(μ_1)cos(μ_1))·exp(-μ_1²Fo)cos(μ_1η)`（时间是基本变量，含空间变量）。","圆柱体：`θ(η,τ)/θ_0=(2/μ_1)·J_1(μ_1)/(J_0²(μ_1)+J_1²(μ_1))·exp(-μ_1²Fo)J_0(μ_1η)`。","球体：`θ(η,τ)/θ_0=2[sin(μ_1)-μ_1cos(μ_1)]/(μ_1-sin(μ_1))·exp(-μ_1²Fo)·sin(μ_1η)/(μ_1η)`。","共同表示形式 `θ(x,τ)/θ_0=A exp(-μ_1²Fo)f(μ_1η)`；基本特点：物体中任意两点的过剩温度之比只与几何位置及边界条件有关，而与时间无关。"]},{"id":"p-h3b-12","title":"一段时间内传递热量的计算式","key":true,"source":"课件 p052–p053","items":["从初始时刻到平板与周围介质处于热平衡这一过程中所传递的总热量为 `Q_0=ρcV(t_0-t_∞)`。","从初始时刻到某一时刻 τ 这一阶段所传递的热量 Q 与 Q_0 之比为 `Q/Q_0=ρc∫_V[t_0-t(x,τ)]dV/(ρcV(t_0-t_∞))=1-(1/V)∫_V θ/θ_0 dV=1-θ̄/θ_0`。","当 `Fo>0.2` 时，将正规状况阶段的无量纲温度场表达式代入积分后，得到指定时刻所传递热量与总换热量之比。","平板：`Q/Q_0=1-θ̄/θ_0=1-2sin μ_1/(μ_1+sin μ_1 cos μ_1)·exp(-μ_1²Fo)·sin μ_1/μ_1`。","圆柱体：`Q/Q_0=1-[(2/μ_1)·J_1(μ_1)/(J_0²(μ_1)+J_1²(μ_1))]exp(-μ_1²Fo)·2J_1(μ_1)/μ_1`。","球体：`Q/Q_0=1-{2[sin(μ_1)-μ_1cos(μ_1)]/(μ_1-sin(μ_1)cos(μ_1))}exp(-μ_1²Fo)·3[sin(μ_1)-μ_1cos(μ_1)]/μ_1³`。"]},{"id":"p-h3c-1","title":"正规状况阶段计算式统一表达","key":true,"source":"课件 p054","items":["三种几何形状的正规状况阶段导热量与温度场的计算式可统一表示为：导热量 `Q/Q₀ = 1 - A exp(-μ₁²Fo)B`。","温度场统一式为 `θ(x,τ)/θ₀ = A exp(-μ₁²Fo) f(μ₁η)`。","同一时刻物体中任意两点的过余温度之比仅取决于两点的几何位置及 **Bi 数**（即边界条件），而与时间无关。"]},{"id":"p-h3c-2","title":"三种形状的 A、B、f 表达式","key":true,"source":"课件 p055","items":["平板：`A = 2 sin μ₁/(μ₁ + sin μ₁ cos μ₁)`，`B = sin μ₁/μ₁`，`f(μ₁,η) = cos(μ₁,η)`。","柱体：`A = 2 J₁(μ₁)/[μ₁(J₀²(μ₁) + J₁²(μ₁))]`，`B = 2 J₁(μ₁)/μ₁`，`f(μ₁,η) = J₀(μ₁,η)`。","球体：`A = 2 (sin μ₁ - μ₁cos μ₁)/(μ₁ - sin μ₁ cos μ₁)`，`B = 3 (sin μ₁ - μ₁cos μ₁)/μ₁³`，`f(μ₁,η) = sin(μ₁,η)/(μ₁η)`。"]},{"id":"p-h3c-3","title":"Campо 近似拟合公式法","key":true,"source":"课件 p056","items":["3.3.3 正规状况阶段的工程计算方法，方法 1 为采用近似拟合公式 Campо 方法（1997）。","拟合所用的基础式为 `θ(x,τ)/θ₀ = A exp(-μ₁²Fo) f(μ₁η)` 与 `Q/Q₀ = 1 - A exp(-μ₁²Fo)B`。","特征值与系数拟合式：`μ₁ = (a + b/Bi)^{-1}`，`A = a + b(1 - e^{-cBi})`，`B = (a + cBi)/(1 + bBi)`，`J₀ = a + bx + cx² + dx³`。","其中 `a,b,c,d` 为根据精确解而拟合的常数。","就可据给定的边界条件及几何位置通过简易计算获得温度与导热量之值。"]},{"id":"p-h3c-4","title":"拟合公式中的常数取值表","key":true,"source":"课件 p057","items":["特征值 `μ₁` 的常数：无限大平板 `a = 0.402 2`、`b = 0.918 8`；无限长圆柱 `a = 0.170 0`、`b = 0.434 9`；球 `a = 0.098 8`、`b = 0.277 9`。","系数 `A` 的常数：无限大平板 `a = 1.010 1`、`b = 0.257 5`、`c = 0.427 1`；无限长圆柱 `a = 1.004 2`、`b = 0.587 7`、`c = 0.403 8`；球 `a = 1.000 3`、`b = 0.985 8`、`c = 0.319 1`。","系数 `B` 的常数：无限大平板 `a = 1.006 3`、`b = 0.547 5`、`c = 0.348 3`；无限长圆柱 `a = 1.017 3`、`b = 0.598 3`、`c = 0.257 4`；球 `a = 1.029 5`、`b = 0.648 1`、`c = 0.195 3`。","零阶贝塞尔函数 `J₀(x)` 拟合公式中的常数：`a = 0.996 7`、`b = 0.035 4`、`c = -0.325 9`、`d = 0.057 7`。"]},{"id":"p-h3c-5","title":"图线法求温度场（海斯勒图）","key":true,"source":"课件 p058–p060","items":["方法 2 为图线法（采用 Heisler-Grober 的 Nomogram 图，1947），以大平板为例按如下方式计算温度场与导热量。","温度场按两步相乘：`θ/θ₀ = (θ/θ_m)×(θ_m/θ₀)`；其中 `θ/θ_m` 为平板中任一点与中心点过余温度之比（与时间无关），`θ_m/θ₀` 为平板中心点过余温度与初始过余温度之比。","平板温度场分析解：`θ(x,τ)/θ₀ = 2sin(μ₁)/(μ₁ + sin(μ₁)cos(μ₁)) e^{-Fo·μ₁²} cos(μ₁ x/δ) = f(Bi, Fo)×f(Bi, x/δ)`。","主图 `θ_m/θ₀ = f(Bi, Fo)` 由 `(Bi, Fo)` 查取 `θ_m/θ₀`；主图特点：横坐标为不同比例尺的算术坐标，纵坐标为对数坐标。","`1/Bi → 0` 为第一类边界条件；`1/Bi → ∞` 为集中参数法。","辅图 `θ/θ_m = f(Bi, x/δ)` 由 `(Bi, x/δ)` 查取 `θ/θ_m`；`Bi ≤ 0.1` 后平板中各点的 `θ/θ_m` 均处于这一范围，相差小于 5%。","进入正规状况，各点 `θ/θ_m` 随时间变化规律相同，只取决于边界条件。","辅图特点：横坐标为对数坐标，纵坐标为算术坐标，几何位置以参数出现。"]},{"id":"p-h3c-6","title":"图线法求热量与诺模图评价","key":true,"source":"课件 p061","items":["导热量图线 `Q/Q₀ = f(Fo, Bi)`，由 `(BiFo², Bi)` 查取 `Q/Q₀`。","热量图的横坐标组合量为 `FoBi² = h²aτ/λ²`。","热量图特点：1）纵坐标为算术坐标，横坐标为对数坐标；2）`Bi` 数以参变数形式出现。","图线法优点：简易，快捷；缺点：精度受限，不利于程序化。"]},{"id":"p-h3c-7","title":"分析解适用范围与 Fo、Bi 影响","key":true,"source":"课件 p062","items":["3.3.4 分析解适用范围拓宽及例题：适用范围为（1）物体被加热或冷却均可；（2）边界条件可拓宽为平板一侧绝热、另一侧为第三类，以及平板两侧均为第一类且维持在相同温度。","物体的过余温度随 `Fo` 的增加而减小，但即使 `Fo → ∞` 物体内的温度分布仍然不均匀。","`Bi` 体现了边界条件，`Bi → ∞` 边界条件从第 3 类转化为第 1 类；`Bi` 还反应了物体中温度的均匀性，`Bi → 0` 温度均匀，可用集中参数法。"]},{"id":"p-h3c-8","title":"例题3-4：钢板加热时间与温差","key":true,"source":"课件 p063–p065","items":["例题3-4：一块厚 100mm 的钢板放入温度为 1000℃ 的炉中加热，钢板一面受热、另一面可近似地认为是绝热的，钢板初始温度 20℃，求钢板受热表面的温度达到 500℃ 时所需的时间，并计算此时剖面上的最大温差。","假设：（1）一维问题；（2）热物性为常数；（3）加热过程表面传热系数为常数；分析：这一问题相当于厚为 200mm 平板对称受热的情形，故可以应用一维平板的分析解。","计算：`Bi = hδ/λ = (174 W/(m²·K)×0.1m)/(34.8 W/(m·K)) = 0.5`，`x/δ = 1`，从平板辅图查得 `θ_w/θ_m = 0.8`。","`θ_w/θ₀ = (t_w - t_∞)/(t₀ - t_∞) = (500℃ - 1000℃)/(20℃ - 1000℃) = 0.51`，故 `θ_m/θ₀ = (θ_w/θ₀)/(θ_w/θ_m) = 0.51/0.8 = 0.637`。","据 `θ_m/θ₀` 及 `Bi` 数之值，从平板主图查得 `Fo = 1.2`，则 `τ = 1.2 δ²/a = 1.2×(0.1m)²/(0.555×10⁻⁵ m²/s) = 2.16×10³ s = 0.6h`。","`θ_m = 0.637θ₀`，`t_m = 0.637θ₀ + t_∞ = 0.637×(20℃ - 1000℃) + 1000℃ = 376℃`，得剖面上的最大温差为 `Δt_max = 500℃ - 376℃ = 124℃`。","讨论：利用 Campо 的近似拟合公式求解，`Bi = hδ/λ = 0.5` 时 `μ₁ = 0.653 3rad = 37.43°`，代入得 `Fo = 1.196`，与从海斯勒图得到的 1.2 十分接近；图线法需要迭代时，采用拟合公式不需要迭代。"]},{"id":"p-h3c-9","title":"半无限大物体概念与三种边界条件","key":true,"source":"课件 p066–p068","items":["本章节标题为 3-1 非稳态导热基本概念、3-2 零维问题的分析解法、3-3 典型的一维问题分析解、3-4 半无限大物体的非稳态导热、3-5 简单形状多维问题的分析解。","3.4 半无限大物体的非稳态导热：半无限大物体是非稳态导热的特有概念，其特点是从 `x = 0` 的界面开始可以向 `x` 正的方向及其它两个坐标 `(y, z)` 方向无限延伸。","当 `x = 0` 的界面上发生的热扰动的影响尚未深入到物体内部中时，该物体中的非稳态导热就可视为半无限大物体的导热；所谓「半」，是指表面的存在把 `x` 方向分成了两半，所讨论的区域仅限于 `x > 0` 的范围。","3.4.1 三种类型边界条件：（1）表面温度维持不变，第 1 类边界条件；（2）表面热流密度保持不变，第 2 类边界条件；（3）给定周围流体温度与表面传热系数，第 3 类条件。","三种条件的数学式：(a) `t(0,τ) = t_w`；(b) `-λ ∂t/∂x = q₀`；(c) `-λ ∂t/∂x = h[t_∞ - t(0,τ)]`。"]},{"id":"p-h3c-10","title":"第1类边界条件数学描写与分析解","key":true,"source":"课件 p069–p070","items":["问题：一个半无限大物体，初始温度均匀为 `t₀`，在 `τ = 0` 时刻，在 `x = 0` 的一侧表面温度突然升高到 `t_w`，并保持不变，现在要确定物体内部温度随时间的变化。","原始方程组：`∂t/∂τ = a ∂²t/∂x²`；`τ = 0` 时 `t(x,0) = t₀`；`x = 0` 时 `t(0,τ) = t_w`；`x → ∞` 时 `t(x,τ) = t₀`。","引入过余温度 `θ = t - t_w` 后改写为：`∂θ/∂τ = a ∂²θ/∂x²`；`τ = 0, θ = θ₀`；`x = 0, τ > 0, θ = 0`；`x → ∞, τ > 0, θ = θ₀`。","温度分布分析解：`θ/θ₀ = (t - t_w)/(t₀ - t_w) = 2/√π ∫₀^{x/(2√(aτ))} e^{-η²} dη = erf(x/(2√(aτ))) = erf(η)`。","式中 `η = x/(2√(aτ))`；`erf(η)` 称为**误差函数**，查图 3-13 和附录 15 计算。"]},{"id":"p-h3c-11","title":"热流密度、表面导热量与吸热系数","key":true,"source":"课件 p071–p072","items":["3.4.2 第 1 类边界条件导热量的计算，通过任意截面 `x` 处的热流密度：`q_x = -λ ∂t/∂x = -λ(t₀ - t_w) ∂[erf(η)]/∂x = λ (t_w - t₀)/√(πaτ) exp[-x²/(4aτ)]`。","从起始时刻到 `τ` 时刻在表面上的导热量为：`Q = A∫₀^τ q_w dτ = A∫₀^τ λ(t_w - t₀)/√(πaτ) dτ = 2A√(τ/π)√(ρcλ)(t_w - t₀)`。","可见表面上的瞬时热流密度与时间的平方根成反比，而总的导热量则与时间的平方根成正比。","`Q` 与物体的 `√(ρcλ)` 成正比，在材料成型工业中称为**吸热系数**，它的大小代表了物体向与其接触的高温物体吸热的能力。","冬天用手摸触同温度金属与摸木头感觉不同，就是两种材料吸热系数不同所致。","3.4.3 分析解的讨论：半无限大物体温度场的分析解都包含误差函数，随 `η` 的变化如课件图所示；`η = 2` 时得 `θ/θ₀ = 0.9953`。"]},{"id":"p-h3c-12","title":"分析解适用条件与惰性时间","key":true,"source":"课件 p073","items":["从位置上说：如果 `x/(2√(aτ)) ≥ 2`，在时刻 `τ`，`x` 处的温度可以认为尚未发生变化；对一块初温均匀厚 `2δ` 的平板，当其一侧的温度突然变化到一恒定温度时，如果其半厚度 `δ ≥ 4√(aτ)`，则该时刻之前该平板中瞬时温度场的计算均可采用半无限大物体的模型。","从时间上看：如果 `τ ≤ x²/(16a)`，则此时 `x` 处的温度可认为完全不变，因而可以把 `x²/16a` 视为**惰性时间**，即该时刻该处的温度可认为等于 `t₀`。","或者说当局部傅里叶数满足 `aτ/x² < 1/16 ≈ 0.06` 时，物体中的非稳态导热可以作为半无限大物体处理。"]},{"id":"p-h3c-13","title":"例题3-6与例题3-7","key":true,"source":"课件 p074–p077","items":["例题3-6：大平板型钢铸件在地坑中浇铸，浇铸前型砂温度 20℃，浇铸后铸件表面温度一直维持在其凝固温度 1450℃，型砂的热扩散率 `a = 0.89×10⁻⁶ m²/s`，求离铸件底面 80mm 处浇铸后 2h 的温度。","例题3-6 计算：`η = x/(2√(aτ)) = (80×10⁻³ m)/(2√(0.89×10⁻⁶ m²/s × 2 × 3600s)) = 0.5`，查得 `erf(0.5) = 0.5205`，则 `t = t_w + erf(0.5)(t₀ - t_w) = 1450℃ + 0.520 5×(20℃ - 1450℃) = 705.7℃`。","例题3-6 讨论：物体表面与发生相变的物质紧密接触是形成第一类边界条件的常见例子，在铸件内部基本凝固前假设铸件表面仍处于相变温度是一个可接受的近似处理。","例题3-7：地下埋管处温度不能低于 0℃，某地冬天地表面温度 10℃，后突然受冷空气侵袭，地表温度降到 －15℃ 并维持 45 天不变，试确定此条件下 45 天后地下温度为 0℃ 处的位置。","例题3-7 计算：土壤物性取 `c = 1840J/(kg·K)`、`ρ = 2050kg/m³`、`λ = 0.52 W/(m·K)`，得 `a = λ/ρc = 0.138×10⁻⁶ m²/s`；据式（3-35）得 `(0℃ - (-15℃))/(10℃ - (-15℃)) = 0.6 = erf(x/(2√(aτ)))`，查得 `x/(2√(aτ)) ≈ 0.6`，故 `x = 1.2√(aτ) = 1.2×(0.138×10⁻⁶ m²/s × 3600s × 45 × 24)^{1/2} = 0.88m`。","例题3-7 讨论：土壤热物性受许多因素影响，计算结果准确性很大程度上取决于热扩散率之值，例如 `a` 值增加一倍将使所需最小埋管深度增加 41%，故应尽量选用可靠的物性数据；地表层温度并不均匀、地表面温度阶跃变化只是一种理想化处理，考虑这些复杂因素时分析解已无能为力，应求助于数值计算。"]},{"id":"p-h3c-14","title":"本章重要内容总结与习题作业","key":true,"source":"课件 p078–p079","items":["重要内容总结 1：非稳态导热过程的特点及温度场的定性分析。","重要内容总结 2：正规状况阶段、非正规状况阶段。","重要内容总结 3：集总参数法的特点及应用。","重要内容总结 4：`Bi`、`Fo` 及 `τ` 的表达式及物理意义，其中 `Bi = hδ/λ = (δ/λ)/(1/h)`，`Fo = aτ/l_c² = τ/(l_c²/a)`，`τ = ρVc/hA`。","重要内容总结 5：诺模图的应用。","导热问题习题作业：第三章 复习题 1，6；习题 3-13。"]}],"questions":[{"id":"q-h3a-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p006（原文）","keyPoints":["非稳态导热分类","周期性","非周期性"],"stem":"淬火的零件放在水中冷却的过程属于","options":[{"k":"A","t":"周期性非稳态导热"},{"k":"B","t":"非周期性非稳态导热"}],"answer":"B","why":["A ✗ 课件 p005 原文：周期性——物体中各点温度及热流密度随时间作周期性变化，如太阳对地球辐照引起的地球温度变化；淬火冷却的温度是逐渐趋于恒定值，不属于周期性","B ✓ 课件 p005 原文：非周期性——物体的温度随时间推移逐渐趋向于一个恒定值，如动力机械从启动到稳定运行；淬火零件在水中冷却正是温度趋于水温的这类过程"],"basis":"课件 p006（原文）"},{"id":"q-h3a-2","kind":"单选","priority":2,"source":"课件 p005","sourceDetail":"课件 p005（依据正文自拟）","keyPoints":["非稳态导热分类","非周期性定义"],"stem":"下列过程中，属于非周期性非稳态导热的是","options":[{"k":"A","t":"太阳对地球辐照引起的地球温度变化"},{"k":"B","t":"动力机械从启动到稳定运行"},{"k":"C","t":"物体中各点温度及热流密度随时间作周期性变化的过程"},{"k":"D","t":"以上都不是"}],"answer":"B","why":["A ✗ 课件 p005 原文把「太阳对地球辐照引起的地球温度变化」列为周期性变化的例子","B ✓ 课件 p005 原文：非周期性——物体的温度随时间推移逐渐趋向于一个恒定值，如动力机械从启动到稳定运行","C ✗ 该项描述的是周期性非稳态导热的定义","D ✗ 存在正确选项 B"],"answerNote":"答案由课件 p005 原文推出，课件未标答案，请以老师公布为准","basis":"课件 p005（原文）"},{"id":"q-h3a-3","kind":"单选","priority":2,"source":"课件 p026","sourceDetail":"课件 p026（依据正文自拟）","keyPoints":["时间常数","过余温度比"],"stem":"用集中参数法分析物体温度变化时，令 (hA/ρVc)τ=1 的时间称为时间常数 τ_c，当时间等于 τ_c 时过余温度比 θ/θ_0 为","options":[{"k":"A","t":"63.2%"},{"k":"B","t":"36.8%"},{"k":"C","t":"50%"},{"k":"D","t":"100%"}],"answer":"B","why":["A ✗ 课件 p026 原文：到该时刻非稳态过程完成了全过程的 63.2%，并非 θ/θ_0 的值","B ✓ 课件 p026 原文：如果 τ=ρVc/hA，则 θ/θ_0=e^{-1}=0.368=36.8%","C ✗ 课件 p026 未出现 50% 这一数值","D ✗ 课件 p026 未出现 100% 这一数值"],"answerNote":"答案由课件 p026 原文推出，课件未标答案，请以老师公布为准","basis":"课件 p026（原文）"},{"id":"q-h3a-4","kind":"单选","priority":2,"source":"课件 p024","sourceDetail":"课件 p024（依据正文自拟）","keyPoints":["傅里叶数","无量纲时间","特征尺度"],"stem":"集中参数法分析解中，傅里叶数的表达式为（特征尺度用 l_c 表示）","options":[{"k":"A","t":"Fo=aτ/l_c²"},{"k":"B","t":"Fo=h l_c/λ"},{"k":"C","t":"Fo=λτ/(ρc)"},{"k":"D","t":"Fo=ρVc/(hA)"}],"answer":"A","why":["A ✓ 课件 p024 原文：Fo=aτ/l_c²=τ/(l_c²/a)","B ✗ 课件 p015/p024 原文：Bi=hδ/λ=(δ/λ)/(1/h)，B 项为毕渥数的形式","C ✗ 课件中未出现该式，Fo 应为无量纲时间，C 项量纲不符","D ✗ 课件 p026 原文：ρVc/hA 为时间常数 τ_c，不是傅里叶数"],"answerNote":"答案由课件 p024 原文推出，课件未标答案，请以老师公布为准","basis":"课件 p024（原文）"},{"id":"q-h3b-1","kind":"多选","priority":1,"source":"课件题目","sourceDetail":"课件 p028（原文）","keyPoints":["Bi 的定义","Fo 的定义与含义","第三类边界与第一类边界的转换"],"stem":"下列描述正确的是","options":[{"k":"A","t":"Bi趋于无穷这第三类边界可转换为第一类边界"},{"k":"B","t":"Bi的定义是hl/λ"},{"k":"C","t":"Fo的定义是aτ/l"},{"k":"D","t":"Fo的含义大致为表达一种无量纲的时间"}],"answer":"ABD","why":["A ✓ 课件 p028 原文：Bi趋于无穷这第三类边界可转换为第一类边界","B ✓ 课件 p029 原文给出 Bi=hl/λ（特征长度 l）","C ✗ 课件 p046 给出的 Fo 定义为 aτ/δ²（无量纲时间），并非 aτ/l","D ✓ 课件 p028 原文：Fo的含义大致为表达一种无量纲的时间"],"basis":"课件 p028（原文）"},{"id":"q-h3b-2","kind":"例题","priority":1,"source":"课件例题","sourceDetail":"课件 p032–p033（原文）","keyPoints":["集中参数法适用性检验","Bi 数计算","指数冷却公式求时间"],"stem":"例题3-1：一直径为5cm的钢球，初始温度为450℃，忽然被置于温度为30℃的空气中。设钢球表面与周围环境间的传热系数为24W/(m²·K)，试计算钢球冷却到300℃所需的时间。已知钢球的 c=0.48kJ/(kg.K)，r=7753kg/m³，λ=33W/(m·K)。","given":["钢球直径 d=5cm，半径 R=0.025m，初始温度 t_0=450℃","环境空气温度 t_∞=30℃","表面传热系数 h=24W/(m²·K)","物性 c=0.48kJ/(kg.K)，r=7753kg/m³，λ=33W/(m·K)"],"ask":["检验是否可用集中参数法","计算钢球冷却到300℃所需的时间"],"steps":["假设：(1) 表面传热系数指平均复合传热系数，取为常数；(2) 常物性","计算 Bi 数：Bi=hR/λ=24×0.05/3/33=0.00606<0.0333，可以采用集中参数法","计算 hA/ρcV=24×4π×0.025²/(7753×480×4/3×π×0.025³)=7.74×10⁻⁴ s⁻¹","据式(3-9)：(t-t_∞)/(t_0-t_∞)=(300℃-30℃)/(450℃-30℃)=exp(-7.74×10⁻⁴ τ)"],"result":"由此解得 τ=570 s=0.158 h","basis":"课件 p032–p033（原文）"},{"id":"q-h3b-3","kind":"例题","priority":1,"source":"课件例题","sourceDetail":"课件 p034–p037（原文）","keyPoints":["温度计时间常数","Bi_V 检验","Fo_V 与过剩温度比"],"stem":"例题3-2：一温度计的水银泡呈圆柱状，长20mm，内径为4mm，初始温度为t_0，今将其插入到温度较高的储气罐中测量气体温度。设水银泡同气体间的对流换热表面传热系数h=11.63W/(m²·K)，水银泡一层薄玻璃的作用可忽略不计，试计算此条件下温度计的时间常数，并确定插入5min后温度计读数的过剩温度为初始过剩温度的百分之几？水银的物性参数：λ=10.36 W/(m·K)，ρ=13110kg/m³，c=0.138kJ/(kg·K)。","given":["水银泡长 l=20mm=0.02m，内径 d_i=4mm，半径 R=0.002m","对流换热表面传热系数 h=11.63W/(m²·K)","水银物性 λ=10.36 W/(m·K)，ρ=13110kg/m³，c=0.138kJ/(kg·K)"],"ask":["计算温度计的时间常数","确定插入5min后温度计读数的过剩温度为初始过剩温度的百分之几"],"steps":["假设：(1) 以水银泡作为研究对象；(2) 常物性","分析：V/A=πR²l/(2πRl+πR²)=0.002×0.02/(2×(0.20+0.001))=0.953×10⁻³ m","检验：Bi_V=h(V/A)/λ=11.63×0.953×10⁻³/10.36=1.07×10⁻³<0.05，可以采用集中参数法","时间常数 τ_c=ρcV/hA=13110×138×0.953×10⁻³/11.63=148s","F_0V=aτ/(V/A)²=λ/(cρ)·τ/(V/A)²=10.36/(0.138×10³×13110)×5×60/(0.953×10⁻³)²=1.89×10³","θ/θ_0=exp(-Bi_V F_0V)=exp(-1.07×10⁻³×1.89×10³)=exp(-2.02)=0.133"],"result":"时间常数 τ_c=148s；经5分钟后温度计读数的过剩温度为初始过剩温度的13.3%，即读数上升了这次测量中温度跃升的86.7%","basis":"课件 p034–p037（原文）"},{"id":"q-h3b-4","kind":"例题","priority":1,"source":"课件例题","sourceDetail":"课件 p038–p040（原文）","keyPoints":["钢圆柱体集中参数法","Bi_v 与 V/A 计算","升温所需时间"],"stem":"例题3-3：一直径为5cm、长为30cm的钢圆柱体，初始温度为30℃，将其放入炉温为1200℃的加热炉中加热，升温到800℃方可取出。设钢圆柱体与烟气间的复合换热表面传热系数为140W/(m²·K)，钢的物性参数取与例3-1中一样的值（c=0.48kJ/(kg·K)，r=7753kg/m³，λ=33W/(m·K)），问需多少时间才能达到要求。","given":["钢圆柱体直径 d=5cm=0.05m，长 l=30cm=0.3m","初始温度 t_0=30℃，炉温 t_∞=1200℃，要求升温到800℃","复合换热表面传热系数 h=140W/(m²·K)","物性 c=0.48kJ/(kg·K)，r=7753kg/m³，λ=33W/(m·K)"],"ask":["检验是否可用集中参数法","计算升温到800℃所需的时间"],"steps":["假设：(1) 表面复合传热系数为常数；(2) 常物性","Bi_v=h(V/A)/λ=h[(πd²l/4)÷(πdl+2πd²/4)]/λ=(h/λ)·(dl/4)/(l+d/2)=140/33×0.50×0.3/(0.3+0.025)=0.049<0.05，可以采用集中参数法","hA/cρV=(h/cρ)(V/A)⁻¹=(h/cρ)·4(l+d/2)/(dl)=140×4×0.325/(0.48×10³×7753×0.005×0.3)=0.326×10⁻² s⁻¹","θ/θ_0=(t-t_∞)/(t_0-t_∞)=(800-1200)/(30-1200)=0.342","按式(3-6)：0.342=exp(-0.326×10⁻² τ)"],"result":"由此解得 τ=329 s；按0.05估算柱体表面过剩温度与中心过剩温度之比为0.95，柱体中心温度约为779℃","basis":"课件 p038–p040（原文）"},{"id":"q-h3c-1","kind":"例题","priority":1,"source":"课件例题","sourceDetail":"课件 p063–p065（原文）","keyPoints":["平板一面绝热等效为厚 200mm 平板对称受热","用海斯勒主图与辅图分别查 θ_m/θ₀ 与 θ_w/θ_m","Bi = hδ/λ 与 Fo 的定义式","Campо 拟合公式的校核"],"stem":"一块厚 100mm 的钢板放入温度为 1000℃ 的炉中加热，钢板一面受热，另一面可近似地认为是绝热的。钢板初始温度 20℃。求钢板受热表面的温度达到 500℃ 时所需的时间，并计算此时剖面上的最大温差。","given":["钢板厚 100mm，一面受热，另一面可近似地认为是绝热的","炉温（流体温度）1000℃，钢板初始温度 20℃","表面传热系数 h = 174 W/(m²·K)，导热系数 λ = 34.8 W/(m·K)，热扩散率 a = 0.555×10⁻⁵ m²/s","假设：（1）一维问题；（2）热物性为常数；（3）加热过程表面传热系数为常数","分析：这一问题相当于厚为 200mm 平板对称受热的情形，故可以应用一维平板的分析解"],"ask":["求钢板受热表面的温度达到 500℃ 时所需的时间","计算此时剖面上的最大温差"],"steps":["第一步：把问题转化为厚 200mm 平板对称受热情形，用一维平板分析解求解。","第二步：`Bi = hδ/λ = (174 W/(m²·K)×0.1m)/(34.8 W/(m·K)) = 0.5`，`x/δ = 1`。","第三步：从平板辅图查得 `θ_w/θ_m = 0.8`。","第四步：`θ_w/θ₀ = (t_w - t_∞)/(t₀ - t_∞) = (500℃ - 1000℃)/(20℃ - 1000℃) = 0.51`。","第五步：`θ_w/θ₀ = (θ_m/θ₀)×(θ_w/θ_m)`，故 `θ_m/θ₀ = (θ_w/θ₀)/(θ_w/θ_m) = 0.51/0.8 = 0.637`。","第六步：据 `θ_m/θ₀` 及 `Bi` 数之值，从平板主图查得 `Fo = 1.2`。","第七步：`τ = 1.2 δ²/a = 1.2×(0.1m)²/(0.555×10⁻⁵ m²/s) = 2.16×10³ s = 0.6h`。","第八步：`θ_m = 0.637θ₀`，`t_m = 0.637θ₀ + t_∞ = 0.637×(20℃ - 1000℃) + 1000℃ = 376℃`，故 `Δt_max = 500℃ - 376℃ = 124℃`。","第九步（讨论）：利用 Campо 近似拟合公式，`Bi = hδ/λ = 0.5` 时 `μ₁ = 0.653 3rad = 37.43°`，由 `0.51 = 2sin(37.43°)/(0.6533 + sin(37.43°)cos(37.43°)) × exp(-0.6553²Fo) × cos(37.43°×1)` 最后可得 `Fo = 1.196`，与从海斯勒图得到的 1.2 十分接近。"],"result":"钢板受热表面达到 500℃ 所需时间 τ = 2.16×10³ s = 0.6h；此时剖面上的最大温差 Δt_max = 500℃ - 376℃ = 124℃。","basis":"课件 p063–p065（原文）"},{"id":"q-h3c-2","kind":"计算","priority":1,"source":"课件例题","sourceDetail":"课件 p074–p075（原文）","keyPoints":["第1类边界条件下半无限大物体的分析解","无量纲量 η = x/(2√(aτ)) 的计算","误差函数 erf(η) 查表","过余温度形式 t = t_w + erf(η)(t₀ - t_w)"],"stem":"一块大平板型钢铸件在地坑中浇铸，浇铸前型砂温度为 20℃。设浇铸在很短时间内完成，并且浇铸后铸件表面温度一直维持在其凝固温度 1450℃，试计算离铸件底面 80mm 处浇铸后 2h 的温度。型砂的热扩散率 a = 0.89×10⁻⁶ m²/s。","given":["浇铸前型砂温度（初始温度）t₀ = 20℃","浇铸后铸件表面温度一直维持在其凝固温度 t_w = 1450℃","型砂的热扩散率 a = 0.89×10⁻⁶ m²/s","离铸件底面 x = 80mm，浇铸后时间 τ = 2h","假设：（1）将铸件底面以下砂型中的非稳态导热按第一种边界条件的半无限大物体处理；（2）物性为常数"],"ask":["计算离铸件底面 80mm 处浇铸后 2h 的温度"],"steps":["第一步：计算无量纲量 `η = x/(2√(aτ)) = (80×10⁻³ m)/(2√(0.89×10⁻⁶ m²/s × 2 × 3600s)) = 0.5`。","第二步：查得 `erf(0.5) = 0.5205`。","第三步：由温度分布分析解 `t = t_w + erf(0.5)(t₀ - t_w) = 1450℃ + 0.520 5×(20℃ - 1450℃) = 705.7℃`。"],"result":"离铸件底面 80mm 处浇铸后 2h 的温度为 t = 705.7℃。","basis":"课件 p074–p075（原文）"},{"id":"q-h3c-3","kind":"计算","priority":1,"source":"课件例题","sourceDetail":"课件 p076–p077（原文）","keyPoints":["半无限大物体第1类边界条件模型","由热扩散率定义式 a = λ/ρc 求物性","用 erf 反查无量纲坐标 x/(2√(aτ))","第一类边界条件下求解冻结（0℃）深度"],"stem":"地下埋管是常见的工程与生活设施，以输送工业及民用水的埋管为例，埋管处的温度不能低于 0℃。设某地冬天地表面温度为 10℃，后突然受冷空气侵袭，地表温度降到 －15℃ 并维持 45 天不变。试确定此条件下 45 天后地下温度为 0℃ 处的位置。","given":["初始地表面温度 t₀ = 10℃","地表温度突然降到 t_w = －15℃ 并维持 45 天不变","土壤物性取 c = 1840J/(kg·K)，ρ = 2050kg/m³，λ = 0.52 W/(m·K)","假设：（1）采用第一种边界条件的半无限大非稳态导热模型；（2）物性为常数"],"ask":["确定 45 天后地下温度为 0℃ 处的位置"],"steps":["第一步：由物性算热扩散率 `a = λ/ρc = 0.138×10⁻⁶ m²/s`。","第二步：据式（3-35）写出 `(t - t_w)/(t₀ - t_∞) = erf(x/(2√(aτ)))`。","第三步：代入数值 `(0℃ - (-15℃))/(10℃ - (-15℃)) = 0.6 = erf(x/(2√(aτ)))`。","第四步：查得 `x/(2√(aτ)) ≈ 0.6`。","第五步：`x = 1.2√(aτ) = 1.2×(0.138×10⁻⁶ m²/s × 3600s × 45 × 24)^{1/2} = 0.88m`。"],"result":"45 天后地下温度为 0℃ 处的位置为 x = 0.88m。","basis":"课件 p076–p077（原文）"}],"images":{"2":{"w":"img/heat-ch3/p002.webp","j":"img/heat-ch3/p002.jpg"},"3":{"w":"img/heat-ch3/p003.webp","j":"img/heat-ch3/p003.jpg"},"4":{"w":"img/heat-ch3/p004.webp","j":"img/heat-ch3/p004.jpg"},"5":{"w":"img/heat-ch3/p005.webp","j":"img/heat-ch3/p005.jpg"},"6":{"w":"img/heat-ch3/p006.webp","j":"img/heat-ch3/p006.jpg"},"7":{"w":"img/heat-ch3/p007.webp","j":"img/heat-ch3/p007.jpg"},"8":{"w":"img/he
