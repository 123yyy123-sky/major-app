      }
      c.appendChild(el('div','stem', rich(q.stem)));
      if((q.given||[]).length){ c.appendChild(el('div','exlabel','已知')); c.appendChild(el('div','exbox', q.given.map(bul).join(''))); }
      if((q.ask||[]).length){ c.appendChild(el('div','exlabel','求解')); c.appendChild(el('div','exbox', q.ask.map(bul).join(''))); }
      (q.options||[]).forEach(function(op){
        var isAns=String(q.answer||'').indexOf(op.k)>=0;
        var d=el('div','opt ro'+(open&&isAns?' ok':''));
        d.innerHTML='<div class="k">'+esc(op.k)+'</div><div class="t">'+rich(op.t)+'</div>'+
          (open&&isAns?'<div class="m" style="color:#2f9e44">✓</div>':'');
        c.appendChild(d);
      });
      if(open){
        var ans=el('div','ansbox');
        ans.innerHTML='<div class="anshead">答案与解析</div>'+answerHTML(q);
        var th=thumbsHTML(ch, (q.sourceDetail||'')+' '+(q.basis||''));
        if(th) ans.insertAdjacentHTML('beforeend', th);
        c.appendChild(ans);
        var tg2=el('button','tbtn','收起答案'); tg2.style.marginTop='10px';
        tg2.onclick=function(){ QA.open[q.id]=false; render(); };
        c.appendChild(tg2);
      } else {
        var tg=el('button','tbtn','看答案'); tg.style.marginTop='4px';
        tg.onclick=function(){ QA.open[q.id]=true; render(); };
        c.appendChild(tg);
      }
      root.appendChild(c);
    });
  }

  /* --- 练习 --- */
  var Q=null;
  function paneQuiz(root,ch,s){
    var st=stats(ch);
    // Q.chId==='__wrong__' 表示「只练错题」模式，不按本章重置
    if(!Q || (Q.chId!==ch.id && Q.chId!=='__wrong__')){
      var c=el('div','card');
      c.innerHTML='<div style="font-size:18px;font-weight:800">本章练习</div>'+
        '<div class="small muted" style="margin:8px 0 0">共 '+st.total+' 题 ｜ 重点 '+st.key+' ｜ 非重点 '+st.nonKey+'</div>'+
        '<div class="small muted" style="margin-top:4px">出题规则：<b>课件题目优先</b>，非重点题占比 ≤ '+Math.round(MAX_NONKEY*100)+'%，错题加权</div><hr>';
      [5,10,st.total].filter(function(v,i,a){return v>0&&a.indexOf(v)===i;}).forEach(function(n){
        var b=el('button','btn','开始 '+n+' 题'); b.style.background=s.color;
        b.onclick=function(){ startQuiz(ch,n); };
        c.appendChild(b);
      });
      var wl=wrongList();
      if(wl.length){
        var wb=el('button','btn ghost','只练错题（'+wl.length+' 题）');
        wb.onclick=function(){ startWrongQuiz(wl.map(function(x){return x.q;})); };
        c.appendChild(wb);
      }
      var vb=el('button','btn ghost','先看本章题目（不开始练习）');
      vb.onclick=function(){ R.tab='bank'; render(); };
      c.appendChild(vb);
      root.appendChild(c); return;
    }
    if(Q.i>=Q.list.length){ return quizDone(root,ch,s); }
    var q=Q.list[Q.i], ps=PS[q.priority]||PSD, isFill=q.kind==='填空', isSimple=q.kind==='简答', isExample=(q.kind==='例题'||q.kind==='计算'||isSimple);
    // 进度
    var pr=el('div','row'); pr.style.marginBottom='12px';
    pr.appendChild(el('div','small',''+(Q.i+1)+' / '+Q.list.length));
    var bar=el('div','bar2'); bar.innerHTML='<i style="width:'+(((Q.i+(Q.done?1:0))/Q.list.length)*100)+'%;background:'+s.color+'"></i>';
    pr.appendChild(bar); root.appendChild(pr);

    var c=el('div','card');
    c.appendChild(el('div','row',
      '<span class="tag" style="background:'+ps.b+';color:'+ps.c+'">'+ps.l+'</span>'+
      '<span class="chip">'+esc(q.kind)+'</span>'+
      '<span class="small muted">'+esc(q.basis||'')+'</span>'));
    if(isKey(q)){
      var kp=el('div','kp');
      kp.appendChild(el('span','lab','考点'));
      q.keyPoints.forEach(function(k){ kp.appendChild(el('span','k',esc(k))); });
      c.appendChild(kp);
    }
    c.appendChild(el('div','stem', rich(q.stem)));

    if(isExample){
      /* ---- 例题：已知 → 求解 →（点开）解答过程 → 结果 ---- */
      if((q.given||[]).length){
        c.appendChild(el('div','exlabel','已知'));
        c.appendChild(el('div','exbox', q.given.map(function(g){
          return '<div class="bul"><div class="d">·</div><div class="t">'+rich(g)+'</div></div>';
        }).join('')));
      }
      if((q.ask||[]).length){
        c.appendChild(el('div','exlabel','求解'));
        c.appendChild(el('div','exbox', q.ask.map(function(g){
          return '<div class="bul"><div class="d">·</div><div class="t">'+rich(g)+'</div></div>';
        }).join('')));
      }
      var showSol = !!Q.done || !!Q.solOpen;
      if(showSol){
        if((q.steps||[]).length){
          c.appendChild(el('div','exlabel', isSimple?'参考答案':'解答过程'));
          c.appendChild(el('div','exbox steps', q.steps.map(function(s, i){
            return '<div class="bul"><div class="d">'+(isSimple?'·':(i+1))+'</div><div class="t">'+rich(s)+'</div></div>';
          }).join('')));
        }
        if(q.result) c.appendChild(el('div','exres',(isSimple?'要点：':'结果：')+rich(q.result)));
      }
      var rb0=el('div','res');
      (q.why||[]).forEach(function(w){ rb0.appendChild(el('div','bul','<div class="d">›</div><div class="t">'+rich(w)+'</div>')); });
      if(q.basis) rb0.appendChild(el('div','basis','依据：'+esc(q.basis)));
      if(q.answerNote) rb0.appendChild(el('div','note','⚠️ '+esc(q.answerNote)));
      if(rb0.innerHTML) c.appendChild(rb0);
    } else if(isFill){
      var inp=el('input','fill'); inp.placeholder='输入答案'; inp.value=Q.text||'';
      inp.disabled=!!Q.done;
      inp.oninput=function(){ Q.text=inp.value; var b=$('qsubmit'); if(b) b.disabled=!inp.value.trim(); };
      if(Q.done) inp.style.background = (Q.lastOk===null) ? '#f1f3f5' : (Q.lastOk ? '#e8f6ec' : '#fff0f0');
      c.appendChild(inp);
    } else {
      (q.options||[]).forEach(function(op){
        var sel = q.kind==='多选' ? String(Q.pick||'').indexOf(op.k)>=0 : Q.pick===op.k;
        var isAns = String(q.answer).indexOf(op.k)>=0;
        var cls='opt', mark='';
        if(Q.done){
          if(isAns){ cls+=' ok'; mark='✓'; }
          else if(sel){ cls+=' no'; mark='✗'; }
        } else if(sel) cls+=' sel';
        var d=el('div',cls,'<div class="k">'+esc(op.k)+'</div><div class="t">'+rich(op.t)+'</div>'+(mark?'<div class="m">'+mark+'</div>':''));
        if(!Q.done) d.onclick=function(){
          if(q.kind==='多选'){
            var cur=String(Q.pick||'').split(''), i=cur.indexOf(op.k);
            if(i>=0) cur.splice(i,1); else cur.push(op.k);
            Q.pick=cur.sort().join('');
          } else Q.pick=op.k;
          render();
        };
        c.appendChild(d);
      });
    }

    if(Q.done){
      var ok=Q.lastOk;
      var rb=el('div','res');
      if(isExample){
        /* 例题 / 简答：不判对错，只给依据与解析 */
      } else if(ok===null||ok===undefined){
        rb.appendChild(el('div','small','<span style="color:#6b7280;font-weight:800">已看答案（本题未作答，不计入错题）</span>'));
      } else {
        rb.appendChild(el('h4',null,'<span style="color:'+(ok?'#2f9e44':'#e03131')+'">'+(ok?'✓ 回答正确':'✗ 回答错误　正确答案：'+esc(q.answer))+'</span>'));
      }
      (q.why||[]).forEach(function(w){ rb.appendChild(el('div','bul','<div class="d">›</div><div class="t">'+rich(w)+'</div>')); });
      if(q.basis) rb.appendChild(el('div','basis','依据：'+esc(q.basis)));
      if(q.answerNote) rb.appendChild(el('div','note','⚠️ '+esc(q.answerNote)));
      // 答完给出课件原页，便于核对
      var th=thumbsHTML(ch, (q.sourceDetail||'')+' '+(q.basis||''));
      if(th) rb.appendChild(el('div','small muted','课件原页：'));
      if(th) rb.insertAdjacentHTML('beforeend', th);
      c.appendChild(rb);
    }

    var act=el('div'); act.style.marginTop='12px';
    if(isExample){
      /* 例题 / 简答：先自己做，再点开看答案 */
      if(!Q.done){
        var sb=el('button','btn', isSimple?'看参考答案':'看解答'); sb.style.background=s.color;
        sb.onclick=function(){ Q.solOpen=true; Q.done=true; render(); };
        act.appendChild(sb);
      } else {
        var nb2=el('button','btn', (Q.i+1>=Q.list.length?'看结果':'下一题')); nb2.style.background=s.color;
        nb2.onclick=function(){ Q.i++; Q.pick=''; Q.text=''; Q.done=false; Q.solOpen=false; render(); };
        act.appendChild(nb2);
      }
    } else if(!Q.done){
      var b=el('button','btn'+(isFill?'':'')+'','提交'); b.id='qsubmit'; b.style.background=s.color;
      if(isFill && !(Q.text||'').trim()) b.disabled=true;
      if(!isFill && !Q.pick) b.disabled=true;
      b.onclick=function(){
        Q.lastOk=judge(q, isFill?Q.text:Q.pick);
        if(Q.lastOk) markRight(q.id); else markWrong(q.id);
        Q.done=true; render();
      };
      act.appendChild(b);
      /* 允许直接看答案：不判对错、不计入错题本 */
      var pk=el('button','btn ghost','看答案（本题不计作答）');
      pk.onclick=function(){ Q.lastOk=null; Q.solOpen=true; Q.done=true; render(); };
      act.appendChild(pk);
    } else {
      var nb=el('button','btn', (Q.i+1>=Q.list.length?'看结果':'下一题')); nb.style.background=s.color;
      nb.onclick=function(){ Q.i++; Q.pick=''; Q.text=''; Q.done=false; render(); };
      act.appendChild(nb);
    }
    c.appendChild(act);
    root.appendChild(c);
    var ex=el('button','btn ghost','退出练习');
    ex.onclick=function(){ Q=null; render(); };
    root.appendChild(ex);
  }
  function startQuiz(ch,n){
    Q={ chId:ch.id, list:buildQuiz(ch,n), i:0, pick:'', text:'', done:false, wrong:[] };
    render();
  }
  function quizDone(root,ch,s){
    var right=Q.list.length-Q.wrong.length;
    var n=Q.list.length||1;                 // 防 0 题时正确率算出 NaN
    var kps={}; Q.wrong.forEach(function(q){ (q.keyPoints||[]).forEach(function(k){ kps[k]=1; }); });
    var c=el('div','card center');
    c.innerHTML='<div style="font-size:18px;font-weight:800">完成</div>'+
      '<div class="big">'+right+' / '+Q.list.length+'</div>'+
      '<div class="small muted">正确率 '+Math.round(right/n*100)+'%</div>'+
      (Q.wrong.length
        ? '<div class="small" style="margin-top:10px">错题考点：'+esc(Object.keys(kps).join(' · ')||'（无考点标签）')+'</div>'
        : '<div class="small" style="margin-top:10px">全对，很棒</div>')+'<hr>';
    var b=el('button','btn','再来一组'); b.style.background=s.color;
    b.onclick=function(){ startQuiz(ch, Q.list.length); }; c.appendChild(b);
    var b2=el('button','btn ghost','返回练习设置'); b2.onclick=function(){ Q=null; render(); }; c.appendChild(b2);
    root.appendChild(c);
  }

  /* --- 错题本（跨章累计） --- */
  function allQuestions(){
    var out=[];
    DATA.subjects.forEach(function(s){
      (s.chapters||[]).forEach(function(c){
        (c.questions||[]).forEach(function(q){ out.push({q:q, sub:s, ch:c}); });
      });
    });
    return out;
  }
  function wrongList(){
    return allQuestions().filter(function(it){ return (state.wrong[it.q.id]||0) > 0; })
      .sort(function(a,b){ return (state.wrong[b.q.id]||0)-(state.wrong[a.q.id]||0); });
  }
  function paneWrong(root){
    var list=wrongList();
    if(!list.length){
      root.appendChild(el('div','empty','还没有错题。<br>去「练习」做几题吧 —— 做错的题会自动收进这里。'));
      return;
    }
    var stat=el('div','card');
    stat.innerHTML='<div class="between"><div style="font-size:17px;font-weight:800">错题本</div>'+
      '<span class="chip" style="background:#fff0f0;color:#e03131">'+list.length+' 题</span></div>'+
      '<div class="small muted" style="margin-top:6px">按错误次数排序 · 累计记录在本机</div>';
    var b=el('button','btn','只练错题（'+list.length+' 题）');
    b.onclick=function(){ startWrongQuiz(list.map(function(x){return x.q;})); };
    stat.appendChild(el('hr')); stat.appendChild(b);
    root.appendChild(stat);

    list.forEach(function(it){
      var q=it.q, ps=PS[q.priority]||PSD;
      var c=el('div','card');
      var kp=(q.keyPoints||[]).map(function(k){ return '<span class="k">'+esc(k)+'</span>'; }).join('');
      c.innerHTML='<div class="row"><span class="tag" style="background:'+ps.b+';color:'+ps.c+'">'+ps.l+'</span>'+
        '<span class="chip" style="background:#fff0f0;color:#e03131">错 '+(state.wrong[q.id]||0)+' 次</span>'+
        '<span class="small muted">'+esc(it.sub.name+' · '+it.ch.name)+'</span></div>'+
        (kp?'<div class="kp"><span class="lab">考点</span>'+kp+'</div>':'')+
        '<div class="stem" style="margin:10px 0 8px">'+rich(q.stem)+'</div>'+
        '<div class="basis">正确答案：<b>'+esc(q.answer)+'</b>　依据：'+esc(q.basis||'')+'</div>';
      root.appendChild(c);
    });
    var clr=el('button','btn ghost','清空错题本');
    clr.onclick=function(){ if(confirm('确定清空所有错题记录？')){ state.wrong={}; saveState(state); render(); } };
    root.appendChild(clr);
  }
  function startWrongQuiz(qs){
    Q={ chId:'__wrong__', list:qs, i:0, pick:'', text:'', done:false, wrong:[] };
    R.tab='quiz'; render();
  }

  /* ---------- 总渲染 ---------- */
  function render(){
    renderSubjects();
    var t=$('ttl'), back=$('back');
    if(!R.sub){
      t.textContent='专业课'; back.style.display='none';
      setAccent(DEFAULT_ACCENT); renderHome(); return;
    }
    var s=curSub();
    if(!s){ R.sub=null; t.textContent='专业课'; back.style.display='none';
      setAccent(DEFAULT_ACCENT); renderHome(); return; }
    setAccent(s.color);
    if(!R.ch){ t.textContent=s.name; back.style.display='block'; renderChapters(); return; }
    // 深链可能带来「科目的章节 id 不匹配」（如 ?subject=heat&chapter=boiler-ch1）
    //   旧代码直接 curCh().name 会 TypeError 白屏，这里回落章节列表
    var c=curCh();
    if(!c){ R.ch=null; t.textContent=s.name; back.style.display='block'; renderChapters(); return; }
    t.textContent=c.name; back.style.display='block'; renderDetail();
  }
  $('back').onclick=function(){
    if(R.ch){ R.ch=null; Q=null; render(); }
    else if(R.sub){ R.sub=null; render(); }
  };

  /* 记录本次练习错题（供结果页用）；例题不算错题 */
  var _oldRender = render;
  render = function(){
    var cur = Q && Q.list[Q.i];
    if(Q && Q.done && cur && Q.lastOk===false
       && cur.kind!=='例题' && cur.kind!=='计算'
       && Q.wrong.indexOf(cur)<0){
      Q.wrong.push(cur);
    }
    _oldRender();
  };

  /* 深链：?subject=boiler&chapter=boiler-intro&tab=points */
  try{
    var p=new URLSearchParams(location.search);
    if(p.get('subject')) R.sub=p.get('subject');
    if(p.get('chapter')) R.ch=p.get('chapter');
    if(p.get('tab')) R.tab=p.get('tab');
  }catch(e){}

  /* 注册 Service Worker（离线可用）。file:// 下会失败，忽略即可。 */
  /* 更新策略：新版本接管后自动重载一次 —— 部署完不用手动清缓存 */
  if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    // 只有「已经被 SW 接管过」的页面才监听切换，避免首次安装多一次重载
    if(navigator.serviceWorker.controller){
      var __swRefreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(__swRefreshing) return;
        __swRefreshing = true;
        location.reload();
      });
    }
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
        .then(function(reg){
          reg.update();                       // 每次打开都主动查新版本
          // 从后台切回时再查一次（已装成 PWA 的情况）
          document.addEventListener('visibilitychange', function(){
            if(!document.hidden) reg.update();
          });
        })
        .catch(function(){});
    });
  }

  render();
})();
</script>
</body>
