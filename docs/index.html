,"32":{"w":"img/control-ch3/p032.webp","j":"img/control-ch3/p032.jpg"},"33":{"w":"img/control-ch3/p033.webp","j":"img/control-ch3/p033.jpg"},"34":{"w":"img/control-ch3/p034.webp","j":"img/control-ch3/p034.jpg"},"35":{"w":"img/control-ch3/p035.webp","j":"img/control-ch3/p035.jpg"},"36":{"w":"img/control-ch3/p036.webp","j":"img/control-ch3/p036.jpg"},"37":{"w":"img/control-ch3/p037.webp","j":"img/control-ch3/p037.jpg"},"38":{"w":"img/control-ch3/p038.webp","j":"img/control-ch3/p038.jpg"},"39":{"w":"img/control-ch3/p039.webp","j":"img/control-ch3/p039.jpg"},"40":{"w":"img/control-ch3/p040.webp","j":"img/control-ch3/p040.jpg"},"41":{"w":"img/control-ch3/p041.webp","j":"img/control-ch3/p041.jpg"},"42":{"w":"img/control-ch3/p042.webp","j":"img/control-ch3/p042.jpg"},"43":{"w":"img/control-ch3/p043.webp","j":"img/control-ch3/p043.jpg"},"44":{"w":"img/control-ch3/p044.webp","j":"img/control-ch3/p044.jpg"},"45":{"w":"img/control-ch3/p045.webp","j":"img/control-ch3/p045.jpg"},"46":{"w":"img/control-ch3/p046.webp","j":"img/control-ch3/p046.jpg"},"47":{"w":"img/control-ch3/p047.webp","j":"img/control-ch3/p047.jpg"},"48":{"w":"img/control-ch3/p048.webp","j":"img/control-ch3/p048.jpg"},"49":{"w":"img/control-ch3/p049.webp","j":"img/control-ch3/p049.jpg"}}},{"id":"control-ch4","name":"第四章 系统频域响应","subtitle":"频率特性 · 伯德图 · 奈奎斯特判据","status":"在读","overview":"先用「时域分析法的缺点」引出频域分析的意义。讲频率特性的概念，用极坐标图（Nyquist 图）表示频率特性，讨论典型环节的 Nyquist 图、绘制的一般方法与一般形状；再用对数坐标图（Bode 图），讲典型环节的Bode 图、系统 Bode 图的绘制，以及考虑扰动的闭环频率特性（频域特征量），最后简介最小相位系统与非最小相位系统。","mindmap":{"label":"第四章 系统频域响应","children":[{"label":"引言：时域分析法的缺点与研究频率特性的意义","children":[{"label":"时域分析法的缺点"},{"label":"研究频率特性的意义"},{"label":"频率特性法的优点"}]},{"label":"一、频率特性概述","children":[{"label":"1. 频率响应与频率特性"},{"label":"2. 频率特性与传递函数的关系"},{"label":"3. 频率特性的求法"},{"label":"4. 频率特性的表示法"},{"label":"5. 频率特性的特点"}]},{"label":"二、频率特性的极坐标图(Nyquist图)","children":[{"label":"1. 典型环节的Nyquist图","children":[{"label":"延时环节"},{"label":"延时环节在低频区近似于惯性环节"}]},{"label":"2. 绘制Nyquist图的一般方法","children":[]},{"label":"3. Nyquist图的一般形状","children":[{"label":"三个不同系统的Nyquist图"},{"label":"起点、终点与弯曲规律"}]}]},{"label":"三、频率特性的对数坐标图（Bode图）","children":[{"label":"1. Bode图"},{"label":"2. 典型环节的Bode图"},{"label":"3. 系统Bode图的绘制","children":[{"label":"一、环节曲线叠加法"},{"label":"二、顺序斜率法"}]}]},{"label":"四、闭环频率特性与频域特征量","children":[{"label":"一、闭环频率特性"},{"label":"二、系统频域特征量（频域性能指标）"}]},{"label":"五、最小相位系统与非最小相位系统","children":[]},{"label":"六、系统传递函数的实验确定法","children":[{"label":"一、频率特性实验测试"},{"label":"二、频率特性实验曲线→对数幅频特性渐近线"},{"label":"三、对数幅频特性渐近线→传递函数（初步估计）"},{"label":"四、非最小相位修正"}]}]},"points":[{"id":"p-ctrl4a-1","title":"时域分析法的缺点","key":true,"source":"课件 p002","items":["用时域法分析系统性能比较**直观、准确**，但求解系统的时域响应往往比较**繁杂**。","(1)**高阶系统的分析难以进行**。","(2)当系统某些元件的**传递函数难以列写**时，整个系统的分析工作将无法进行。","(3)**物理意义欠缺**。"]},{"id":"p-ctrl4a-2","title":"研究频率特性的意义与频率特性法的优点（1）","key":true,"source":"课件 p003","items":["频率特性法是二十世纪三十年代发展起来的、研究自动控制系统的一种**经典工程实用方法**，是一种利用频率特性进行控制系统分析的**图解方法**，可方便地用于控制工程中的系统分析与设计。","(1)**不必求解系统的特征根**，采用较为简单的图解法就可研究系统的稳定性。","频率响应法主要通过**开环频率特性的图形**对系统进行分析，因而**形象直观且计算量少**。"]},{"id":"p-ctrl4a-3","title":"频率特性法的优点（2）—（4）","key":true,"source":"课件 p004","items":["(2)系统的频率特性**可用实验方法测出**，且频率特性有明确的物理意义；对于难以列写微分方程式的系统具有重要的实际意义。","(3)**可推广应用**于某些非线性系统，还适用于含有**延迟环节**的系统和部分非线性系统的分析。","(4)频域分析法更**具有工程实用价值**。"]},{"id":"p-ctrl4a-4","title":"时域分析与频域分析的对比","key":true,"source":"课件 p005","items":["**时域分析**：重点研究**过渡过程**，通过阶跃或脉冲输入下系统的瞬态时间响应来研究系统的性能。","**频域分析**：通过系统在不同频率 `ω` 的谐波（正弦）输入作用下的**稳态响应**来研究系统的性能。"]},{"id":"p-ctrl4a-5","title":"频率响应（例：一阶系统对谐波输入的响应）","key":true,"source":"课件 p006","items":["**频率响应**：系统对谐波输入的稳态响应。","设系统传递函数 `G(s)=K/(Ts+1)`，输入 `x_i(t)=X_i sinωt`，即 `X_i(s)=X_i ω/(s^2+ω^2)`。","输出 `X_o(s)=G(s)X_i(s)`，全响应为 `x_o(t)=X_i K Tω/(1+T^2ω^2)·e^(-t/T)+X_i K/√(1+T^2ω^2)·sin(ωt-arctgTω)`。","**稳态输出（响应）** `x_o(t)=X_i K/√(1+T^2ω^2)·sin(ωt-arctgTω)`，其**幅值与输入信号的幅值成正比**，且**与输入信号同频率**。"]},{"id":"p-ctrl4a-6","title":"频率响应的三个特征","key":true,"source":"课件 p007","items":["输入 `x_i(t)=X_i sinωt`；稳态输出（频率响应）`x_o(t)=X_i A(ω) sin[ωt+φ(ω)]`。","信号与输入**同频率**。","**幅值比** `A(ω)` 与**相位差** `φ(ω)` 都是 `ω` 的非线性函数，**揭示了系统的频率响应特性**。"]},{"id":"p-ctrl4a-7","title":"频率特性：幅频特性与相频特性","key":true,"source":"课件 p008","items":["**幅频特性**：稳态输出与输入谐波的**幅值比**，`A(ω)=X_o(ω)/X_i`。","**相频特性**：稳态输出与输入谐波的**相位差** `φ(ω)`。","`A(ω)` 与 `φ(ω)` 合称**频率特性**。","频率特性是 `ω` 的复变函数，其幅值为 `A(ω)`、相位为 `φ(ω)`；记为 `A(ω)·∠φ(ω)`（极坐标）或 `A(ω)·e^(jφ(ω))`（指数）。"]},{"id":"p-ctrl4a-8","title":"频率特性与传递函数的关系","key":true,"source":"课件 p009","items":["设 `G(s)=X_o(s)/X_i(s)=(b_m s^m+b_(m-1)s^(m-1)+…+b_1 s+b_0)/(a_n s^n+a_(n-1)s^(n-1)+…+a_1 s+a_0)`，输入 `x_i(t)=X_i sinωt`。","若系统稳定，则 `x_o(t)=B e^(jωt)+B* e^(-jωt)`，其中 `B=G(jω)·X_i/(2j)`，`B*=G(-jω)·X_i/(-2j)`。","故 `x_o(t)=|G(jω)| X_i sin[ωt+∠G(jω)]`。","即 `A(ω)=|G(jω)|`、`φ(ω)=∠G(jω)`，故 **`G(jω)=|G(jω)|e^(j∠G(jω))` 就是系统的频率特性**。"]},{"id":"p-ctrl4a-9","title":"频率特性的求法","key":true,"source":"课件 p010","items":["**(1)频率响应→频率特性**：由 `x_o(t)=L^(-1)[G(s)·X_i ω/(s^2+ω^2)]` 求稳态输出，得 `A(ω)=X_o(ω)/X_i=K/√(1+T^2ω^2)`，`φ(ω)=-arctgTω`。","**(2)传递函数→频率特性**：令 `s=jω`，即 `G(jω)=G(s)|_(s=jω)`；则 `A(ω)=|G(jω)|`，`φ(ω)=∠G(jω)`。","如例 `G(jω)=K/(1+jTω)=K/√(1+T^2ω^2)·e^(-jarctgTω)`。","**(3)实验方法**。"]},{"id":"p-ctrl4a-10","title":"频率特性的表示法：解析表示","key":true,"source":"课件 p011","items":["**幅频—相频**：`G(jω)=X_o(ω)/X_i·e^(jφ(ω))=A(ω)e^(jφ(ω))=|G(jω)|e^(j∠G(jω))=|G(jω)|∠G(jω)`。","**实频—虚频**：`G(jω)=A(ω)e^(jφ(ω))=A(ω)[cosφ(ω)+j sinφ(ω)]`。","`G(jω)=Re[G(jω)]+j Im[G(jω)]=U(ω)+jV(ω)`，引出**实频特性** `U(ω)` 与**虚频特性** `V(ω)`。"]},{"id":"p-ctrl4a-11","title":"频率特性的表示法：图示方法","key":true,"source":"课件 p012","items":["给定 `ω` 时可在复平面上用一个向量表示 `G(jω)`：向量长度为 `A(ω)`，与正实轴的夹角为 `φ(ω)`；规定**逆时针方向为正（相角超前）**、**顺时针方向为负（相角滞后）**。","`A(ω)=√(u^2(ω)+v^2(ω))`，`φ(ω)=arctan(v(ω)/u(ω))`。","`u(ω)=A(ω)·cosφ(ω)`，`v(ω)=A(ω)·sinφ(ω)`。","**Nyquist图**（极坐标图，幅相频率特性图）；**Bode图**（对数坐标图，对数频率特性图）。"]},{"id":"p-ctrl4a-12","title":"频率特性的特点","key":true,"source":"课件 p013","items":["(1)频率特性是频域中描述系统动态特性的**数学模型**。","(2)频率特性是系统**单位脉冲响应函数 ω(t) 的 Fourier 变换**：由 `X_o(s)=G(s)X_i(s)` 有 `X_o(jω)=G(jω)X_i(jω)`；当 `x_i(t)=δ(t)` 时 `x_o(t)=ω(t)`、`X_i(jω)=F[δ(t)]=1`，故 `X_o(jω)=G(jω)`，即 `F[ω(t)]=G(jω)`。","(3)**分析简便**。","(4)**易于实验求取**。"]},{"id":"p-ctrl4a-13","title":"频率特性的极坐标图（Nyquist图）","key":true,"source":"课件 p014","items":["`G(jω)` 是 `ω` 的复变函数；给定 `ω`，`G(jω)` 是复平面上的一个矢量。","幅值 `A(ω)=|G(jω)|`；相角（与正实轴的夹角，逆时针为正）`φ(ω)=∠G(jω)`。","实部 `U(ω)=A(ω)cosφ(ω)`；虚部 `V(ω)=A(ω)sinφ(ω)`。","当 `ω` 从 `0→∞` 时，`G(jω)` 端点的轨迹即**频率特性的极坐标图（Nyquist图）**。"]},{"id":"p-ctrl4a-14","title":"典型环节的Nyquist图：比例环节","key":true,"source":"课件 p015","items":["传递函数 `G(s)=K`；频率特性 `G(jω)=K`。","幅频 `|G(jω)|=K`；相频 `∠G(jω)=0°`。","实频 `U(ω)=K`；虚频 `V(ω)=0`。","Nyquist图为实轴上的一定（点），其坐标为 `(K, j0)`。"]},{"id":"p-ctrl4a-15","title":"典型环节的Nyquist图：惯性环节","key":true,"source":"课件 p018","items":["传递函数 `G(s)=K/(Ts+1)`；频率特性 `G(jω)=K/(jTω+1)=K/(1+T^2ω^2)-j KTω/(1+T^2ω^2)`。","幅频 `|G(jω)|=K/√(1+T^2ω^2)`；相频 `∠G(jω)=-arctgTω`。","实频 `U(ω)=K/(1+T^2ω^2)`；虚频 `V(ω)=-KTω/(1+T^2ω^2)`。","当 `ω=0` 时 `|G(jω)|=K`、`∠G(jω)=0°`；当 `ω=1/T` 时 `∠G(jω)=-45°`；当 `ω=∞` 时 `|G(jω)|=0`、`∠G(jω)=-90°`。","当 `ω` 从 `0→∞` 时，Nyquist图为正实轴下的一个半圆，圆心为 `(K/2, j0)`，半径为 `K/2`。"]},{"id":"p-ctrl4a-16","title":"典型环节的Nyquist图：一阶微分环节","key":true,"source":"课件 p019","items":["传递函数 `G(s)=1+Ts`；频率特性 `G(jω)=1+jTω`。","幅频 `|G(jω)|=√(1+T^2ω^2)`；相频 `∠G(jω)=arctgTω`。","实频 `U(ω)=1`；虚频 `V(ω)=Tω`。","Nyquist图始于点 `(1, j0)`，平行于虚轴。"]},{"id":"p-ctrl4a-17","title":"典型环节的Nyquist图：振荡环节","key":true,"source":"课件 p020","items":["传递函数 `G(s)=ω_n^2/(s^2+2ξω_n s+ω_n^2)`。","频率特性 `G(jω)=ω_n^2/(-ω^2+ω_n^2+j2ξω_nω)`（`0<ξ<1`）；令 `λ=ω/ω_n`，则 `G(jω)=1/((1-λ^2)+j2ξλ)`。","幅频 `|G(jω)|=1/√((1-λ^2)^2+j4ξ^2λ^2)`；相频 `∠G(jω)=-arctg[2ξλ/(1-λ^2)]`。","实频 `U(ω)=(1-λ^2)/((1-λ^2)^2+j4ξ^2λ^2)`；虚频 `V(ω)=-2ξλ/((1-λ^2)^2+j4ξ^2λ^2)`。","当 `λ=0`（即 `ω=0`）`|G(jω)|=1`、`∠G(jω)=0°`；当 `λ=1`（即 `ω=ω_n`）`|G(jω)|=1/(2ξ)`、`∠G(jω)=-90°`；当 `λ=∞`（即 `ω=∞`）`|G(jω)|=0`、`∠G(jω)=-180°`。"]},{"id":"p-ctrl4a-18","title":"振荡环节的谐振特性","key":true,"source":"课件 p021","items":["当 `ω` 从 `0→∞`（即 `λ` 由 `0→∞`）时，`G(jω)` 的幅值由 `1→0`，相位由 `0°→-180°`；其Nyquist图始于点 `(1, j0)`，而终于点 `(0, j0)`。","曲线与虚轴的交点的频率就是**无阻尼固有频率 `ω_n`**，此时的幅值为 `1/(2ξ)`。","`ξ<0.707` 时，`|G(jω)|` 在频率 `ω_r` 处出现峰值（**谐振峰值**，`ω_r` 为谐振频率）。","由 `∂|G(jω)|/∂ω|_(ω=ω_r)=0`，有 `ω_r=ω_n√(1-2ξ^2)`，`|G(jω_r)|=1/(2ξ√(1-2ξ^2))`。","显然 `ω_r<ω_d<ω_n`，其中 `ω_d=ω_n√(1-ξ^2)`（**有阻尼固有频率**）。"]},{"id":"p-ctrl4a-19","title":"振荡环节：阻尼比 ξ 的影响","key":true,"source":"课件 p022","items":["`ξ≥0.707`：**无谐振**。","`ξ≥1`：可为**两个一阶环节的组合**。","若 `ξ` 足够大，`1/(2ξ)≈0`，**奈氏图近似于半圆**，即振荡环节近似于**惯性环节**。"]},{"id":"p-ctrl4b-1","title":"延时环节的Nyquist图","key":true,"source":"课件 p023","items":["传递函数：`G(s)=e^(-τs)`","频率特性：`G(jω)=e^(-jτω)=cosτω−jsinτω`","幅频：`|G(jω)|=1`；相频：`∠G(jω)=−τω`","实频：`U(ω)=cosτω`；虚频：`V(ω)=−sinτω`","Nyquist图：单位圆"]},{"id":"p-ctrl4b-2","title":"延时环节在低频区的近似","key":false,"source":"课件 p024","items":["在低频区，频率特性表达式根据泰勒公式展开为 `e^(-jτω)=1/[1+jτω+1/2!(jτω)^2+1/3!(jτω)^3+…+1/n!(jτω)^n+…]`","当 ω 很小时，`e^(-jτω)≈1/(1+jτω)`","即在低频区，延迟环节的频率特性近似于惯性环节","从奈氏图可见，二者的曲线在低频区基本重合"]},{"id":"p-ctrl4b-3","title":"绘制Nyquist图的一般方法","key":true,"source":"课件 p025","items":["由 `G(jω)` 求出其实频特性 `Re[G(jω)]`、虚频特性 `Im[G(jω)]` 和幅频特性 `|G(jω)|`、相频特性 `∠G(jω)` 的表达式","求出若干特征点，如起点(ω=0)、终点(ω=∞)、与实轴的交点(`Im[G(jω)]=0`)、与虚轴的交点(`Re[G(jω)]=0`)等，并标注在极坐标图上","补充必要的几点，根据 `|G(jω)|`、`∠G(jω)` 和 `Re[G(jω)]`、`Im[G(jω)]` 的变化趋势以及 `G(jω)` 所处的象限，作出Nyquist曲线的大致图形"]},{"id":"p-ctrl4b-4","title":"Nyquist图的一般形状（三个不同系统）","key":true,"source":"课件 p028","items":["三个系统：(a) `G(s)=K/(s^0(Ts+1))`；(b) `G(s)=K/(s(Ts+1))`；(c) `G(s)=K/(s^2(1+T1s)(1+T2s))`","(a) ν=0，n−m=1：ω=0 时 `|G(jω)|=K`、`∠G(jω)=0°`；ω=∞ 时 `|G(jω)|=0`、`∠G(jω)=−90°`","(b) ν=1，n−m=2：ω=0 时 `|G(jω)|=∞`、`∠G(jω)=−90°`；ω=∞ 时 `|G(jω)|=0`、`∠G(jω)=−180°`","(c) ν=2，n−m=4：ω=0 时 `|G(jω)|=∞`、`∠G(jω)=−180°`；ω=∞ 时 `|G(jω)|=0`、`∠G(jω)=−360°`"]},{"id":"p-ctrl4b-5","title":"Nyquist图一般形状的普遍规律","key":true,"source":"课件 p029","items":["一般形式：`G(jω)=K(1+jτ1ω)(1+jτ2ω)…(1+jτmω)/[(jω)^ν(1+jT1ω)(1+jT2ω)…(1+jT_{n−ν}ω)]`（m≤n）","当 ω=0 时，对0型系统 `|G(jω)|=K`、`∠G(jω)=0°`，起始点是一个在正实轴上有有限值的点","当 ω=0 时，对I型系统 `|G(jω)|=∞`、`∠G(jω)=−90°`，低频段Nyquist曲线渐近于与负虚轴平行的直线","当 ω=0 时，对II型系统 `|G(jω)|=∞`、`∠G(jω)=−180°`，低频段 `G(jω)` 负实部是比虚部阶数更高的无穷大","当 ω=∞ 时，`|G(jω)|=0`，`∠G(jω)=(m−n)×90°`","当 `G(s)` 包含导前环节时，若相位非单调下降，则Nyquist曲线将发生“弯曲”"]},{"id":"p-ctrl4b-6","title":"频率特性的对数坐标图（Bode图）","key":true,"source":"课件 p030","items":["1. Bode图分别表示幅频和相频","① 对数幅频特性图：横坐标 ω，对数分度，标注真值；几何上的等分→真值的等比","纵坐标 `|G(jω)|` 的分贝值(dB)，`dB=20lg|G(jω)|`，线性分度","特别：0dB 时 `|G(jω)|=1`，输出幅值=输入幅值；dB>0 时 `|G(jω)|>1`，输出幅值>输入幅值（放大）；dB<0 时 `|G(jω)|<1`，输出幅值<输入幅值（衰减）","② 对数相频特性图：横坐标同上；纵坐标 `∠G(jω)`，线性分度","dec 表示10倍频程"]},{"id":"p-ctrl4b-7","title":"Bode图的优点（一）：乘除运算变加减运算","key":false,"source":"课件 p031","items":["幅频特性取分贝数 `20lgA(ω)` 后，使各因子间的乘除运算变为加减运算，在Bode图上则变为各因子幅频特性曲线的叠加，大大简化了作图过程","`G(jω)=G1(jω)G2(jω)…Gn(jω)=A(ω)e^(jφ(ω))`","式中 `A(ω)=A1(ω)A2(ω)…An(ω)`，`φ(ω)=φ1(ω)+φ2(ω)+…+φn(ω)`","对数幅频特性：`L(ω)=20lgA(ω)=20lgA1(ω)+20lgA2(ω)+…+20lgAn(ω)`，即 `L(ω)=L1(ω)+L2(ω)+…+Ln(ω)`"]},{"id":"p-ctrl4b-8","title":"Bode图的优点（二）：展宽低频、可用渐近线、K只影响平移","key":false,"source":"课件 p032","items":["横坐标按频率取对数分度，低频展宽、高频压缩，与实际控制系统（一般为低频系统）的频率分辨要求吻合","可采用由直线段构成的渐近特性（或稍加修正）代替精确Bode图，使绘图十分简便","在控制系统的设计和调试中，开环放大系数 K 是最常变化的参数；K 的变化不影响对数幅频特性的形状，只会使幅频特性曲线作上下平移"]},{"id":"p-ctrl4b-9","title":"典型环节的Bode图：比例环节与积分环节","key":true,"source":"课件 p033","items":["(1)比例环节 `G(s)=K`，`G(jω)=K`；`20lg|G(jω)|=20lgK`，`∠G(jω)=0°`","(2)积分环节 `G(s)=1/s`，`G(jω)=1/(jω)`；`20lg|G(jω)|=20lg(1/ω)=−20lgω`，`∠G(jω)=−90°`","积分环节对数幅频特性：过点(1, 0)、斜率−20dB/dec的直线","积分环节对数相频特性：过点(0, −90°)、平行于横轴的直线"]},{"id":"p-ctrl4b-10","title":"典型环节的Bode图：微分环节","key":false,"source":"课件 p034","items":["(3)微分环节 `G(s)=s`，`G(jω)=jω`","`20lg|G(jω)|=20lgω`，`∠G(jω)=90°`","对数幅频特性：过点(1, 0)、斜率20dB/dec的直线","对数相频特性：过点(0, 90°)、平行于横轴的直线"]},{"id":"p-ctrl4b-11","title":"典型环节的Bode图：惯性环节","key":true,"source":"课件 p035","items":["(4)惯性环节 `G(s)=1/(Ts+1)`，`G(jω)=1/(1+jTω)`","令 `ω_T=1/T`，则 `G(jω)=ω_T/(ω_T+jω)`；故 `|G(jω)|=ω_T/√(ω_T^2+ω^2)`，`∠G(jω)=−arctg(ω/ω_T)`","对数幅频特性：`20lg|G(jω)|=20lgω_T−20lg√(ω_T^2+ω^2)`","低频段（`ω<<ω_T`）：`20lg|G(jω)|≈20lgω_T−20lgω_T=0dB`","高频段（`ω>>ω_T`）：`20lg|G(jω)|≈20lgω_T−20lgω`，为始于点(ω_T, 0)、斜率−20dB/dec的直线","`ω_T`：转角频率（高频渐近线与低频渐近线的交点）"]},{"id":"p-ctrl4b-12","title":"惯性环节的渐近线误差与对数相频特性","key":false,"source":"课件 p036","items":["低频段渐近线：`20lg|G(jω)|≈0dB`，误差 `e(ω)=20lgω_T−20lg√(ω_T^2+ω^2)`","高频段渐近线：`20lg|G(jω)|≈20lgω_T−20lgω`，误差 `e(ω)=20lgω−20lg√(ω_T^2+ω^2)`","对数相频特性：由 `∠G(jω)=−arctg(ω/ω_T)`，ω=0 时 `∠G(jω)=0°`；ω=ω_T 时 `∠G(jω)=−45°`；ω=∞ 时 `∠G(jω)=−90°`","对数相频特性曲线对称于点(ω_T, −45°)；ω≤0.1ω_T 时 `∠G(jω)→0°`，ω≥10ω_T 时 `∠G(jω)→−90°`"]},{"id":"p-ctrl4b-13","title":"典型环节的Bode图：一阶微分环节","key":false,"source":"课件 p037","items":["(5)一阶微分环节 `G(s)=1+Ts`，`G(jω)=1+jTω=(ω_T+jω)/ω_T`（`ω_T=1/T`）","故 `|G(jω)|=√(ω_T^2+ω^2)/ω_T`，`∠G(jω)=arctg(ω_T/ω)`；`ω_T` 为转角频率","对数幅频特性：`20lg|G(jω)|=20lg√(ω_T^2+ω^2)−20lgω_T`","低频段（`ω<<ω_T`）：`20lg|G(jω)|≈20lgω_T−20lgω_T=0dB`","高频段（`ω>>ω_T`）：`20lg|G(jω)|≈20lgω−20lgω_T`，为始于点(ω_T, 0)、斜率20dB/dec的直线","对数相频特性：ω=0 时 0°；ω=ω_T 时 45°；ω=∞ 时 90°；曲线对称于点(ω_T, 45°)"]},{"id":"p-ctrl4b-14","title":"典型环节的Bode图：振荡环节","key":true,"source":"课件 p038","items":["(6)振荡环节 `G(s)=ω_n^2/(s^2+2ξω_n s+ω_n^2)`（0≤ξ<1）","`G(jω)=ω_n^2/(−ω^2+ω_n^2+j2ξω_nω)=1/[(1−λ^2)+j2ξλ]`（`λ=ω/ω_n`）","`|G(jω)|=1/√((1−λ^2)^2+4ξ^2λ^2)`，`∠G(jω)=−arctg[2ξλ/(1−λ^2)]`","对数幅频特性：`20lg|G(jω)|=−20lg√((1−λ^2)^2+4ξ^2λ^2)`","低频段（`ω<<ω_n`，λ≈0）：`20lg|G(jω)|≈0dB`（0dB线）","高频段（`ω>>ω_n`，λ>>1）：`20lg|G(jω)|≈−40lgλ=−40lgω+40lgω_n`，为始于点(ω_n, 0)、斜率−40dB/dec的直线；`ω_n` 为转角频率"]},{"id":"p-ctrl4b-15","title":"振荡环节的误差与对数相频特性","key":false,"source":"课件 p039","items":["低频段误差：`e(λ,ξ)=−20lg√((1−λ^2)^2+4ξ^2λ^2)`","高频段误差：`e(λ,ξ)=40lgλ−20lg√((1−λ^2)^2+4ξ^2λ^2)`","对数相频特性：ω=0 时 `∠G(jω)=0°`；ω=ω_n 时 `∠G(jω)=−90°`；ω=∞ 时 `∠G(jω)=−180°`","对数相频特性曲线对称于点(ω_n, −90°)"]},{"id":"p-ctrl4b-16","title":"二阶微分环节与延时环节的Bode图","key":false,"source":"课件 p040","items":["(7)二阶微分环节 `G(s)=s^2/ω_n^2+2ξ s/ω_n+1`，`G(jω)=−ω^2/ω_n^2+j2ξω/ω_n+1`","二阶微分环节与二阶振荡系统的Bode图对称于频率轴","(8)延时环节 `G(s)=e^(−τs)`，`G(jω)=e^(−jτω)`；`|G(jω)|=1`，`∠G(jω)=−τω`，`20lg|G(jω)|=0dB`","因对数分度，延时环节的相频特性由直线变为曲线"]},{"id":"p-ctrl4b-17","title":"各典型环节Bode图汇总对照","key":false,"source":"课件 p041","items":["② 积分环节：对数幅频斜率−20dB/dec，对数相频恒为−90°","③ 微分环节：对数幅频斜率+20dB/dec，对数相频恒为+90°","④ 惯性环节：高频段斜率−20dB/dec，相频由0°过渡到−90°","⑤ 导前环节：高频段斜率+20dB/dec，相频由0°过渡到+90°","⑥ 振荡环节：高频段斜率−40dB/dec，相频由0°过渡到−180°","⑦ 二阶微分环节：高频段斜率+40dB/dec，相频由0°过渡到+180°"]},{"id":"p-ctrl4b-18","title":"系统Bode图的绘制：环节曲线叠加法","key":true,"source":"课件 p042","items":["1. `G(s)` → 标准形（常数项为1）→ `G(jω)`","2. 求典型环节的转角频率（惯性、一阶微分、振荡和二阶微分环节）","3. 作出各环节的对数幅频特性的渐近线；4. 误差修正（必要时）","5. 将各环节的对数幅频特性叠加（不包括系统总的增益K）","6. 将叠加后的曲线垂直移动 `20lgK`，得到系统的对数幅频特性","7. 作各环节的对数相频特性，然后叠加而得到系统总的对数相频特性","8. 有延时环节时，对数幅频特性不变，对数相频特性则应加上 `−τω`"]},{"id":"p-ctrl4c-1","title":"环节曲线叠加法绘制系统Bode图","key":true,"source":"课件 p043","items":["先将传递函数化为标准形再求频率特性：`G(s)=24(0.25s+0.5)/[(5s+2)(0.05s+2)]` → `G(s)=3(0.5s+1)/[(2.5s+1)(0.025s+1)]` → `G(jω)=3(1+j0.5ω)/[(1+j2.5ω)(1+j0.025ω)]`","求出各环节的转角频率：`ω_T1=0.4`、`ω_T2=40`、`ω_T3=2`","3) 各环节的对数幅频特性的渐近线，叠加、平移","4) 各环节的对数相频特性曲线，叠加"]},{"id":"p-ctrl4c-2","title":"顺序斜率法的原理","key":true,"source":"课件 p044","items":["频率特性写为标准形式：`G(jω)=K(1+jτ_1ω)(1+jτ_2ω)…(1+jτ_mω)/[(jω)^v(1+jT_1ω)(1+jT_2ω)…(1+jT_{n-v}ω)]`","系统在低频段 `ω≪min(1/τ_1,1/τ_2,…,1/T_1,1/T_2,…)` 时，频率特性为 `K/(jω)^v`","因此其对数幅频特性在低频段表现为过点 `(1, 20lgK)`、斜率为 `-20v dB/dec` 的直线","在各环节的转角频率处，系统对数幅频特性渐近线的斜率发生变化，其变化量等于相应环节在其转角频率处斜率的变化量（即其高频渐近线的斜率）","当 `G(jω)` 包含振荡环节或二阶微分环节时，不改变上述结论；根据上述特点可直接绘制系统的对数幅频特性"]},{"id":"p-ctrl4c-3","title":"顺序斜率法绘制Bode图的步骤","key":true,"source":"课件 p045","items":["1. `G(s)`→标准形（常数项为1）→`G(jω)`","2. 确定各典型环节的转角频率，并由小到大将其顺序标在横坐标轴上","3. 过点 `(1, 20lgK)`，作斜率为 `-20v dB/dec` 的直线","4. 延长该直线，每遇到一个转角频率便改变一次斜率：遇惯性环节的转角频率则斜率增加 `-20dB/dec`；遇一阶微分环节的转角频率，斜率增加 `+20dB/dec`；遇振荡环节的转角频率，斜率增加 `-40dB/dec`；二阶微分环节则增加 `+40dB/dec`","5. 如果需要，可根据误差修正曲线对渐近线进行修正，其办法是在同一频率处将各环节误差值迭加，即可得到精确的对数幅频特性曲线"]},{"id":"p-ctrl4c-4","title":"闭环频率特性","key":true,"source":"课件 p046","items":["闭环传递函数：`X_o(jω)/X_i(jω)=G_B(jω)=G_K(jω)/[1+G_K(jω)]`","闭环幅频特性：`A_B(ω)=|G_B(jω)|=|G_K(jω)|/|1+G_K(jω)|`","闭环相频特性：`φ_B(ω)=∠G_B(jω)=∠G_K(jω)-∠[1+G_K(jω)]`","图中 `A_B(ω)` 在低频近似恒定、中频出现峰值后随 ω 增大而衰减；`φ_B(ω)` 从 0° 起单调下降，最终趋于 -360°"]},{"id":"p-ctrl4c-5","title":"系统频域特征量（频域性能指标）","key":true,"source":"课件 p047","items":["1. 零幅值 `A(0)`","2. 复现频率 `ω_M` 与复现带宽 `0~ω_M`","3. 谐振频率 `ω_r` 与相对谐振峰值 `M_r=A_max/A(0)`","4. 截止频率 `ω_b` 与截止带宽 `0~ω_b`（`A(ω_b)=0.707A(0)`）","带宽越大，响应的快速性越好"]},{"id":"p-ctrl4c-6","title":"最小相位系统与非最小相位系统","key":true,"source":"课件 p048","items":["最小相位系统：所有零点和极点均在 `[s]` 平面的左半平面","与非最小相位系统相比：幅频特性相同，但前者的相位变化范围最小","例：`G_1(s)=(1+T_1s)/(1+T_2s)`（最小相位系统），`G_2(s)=(1-T_1s)/(1+T_2s)`（非最小相位系统）","两者幅频特性相同 `|G_1(jω)|=|G_2(jω)|=√(1+T_1^2ω^2)/√(1+T_2^2ω^2)`；相频不同：`∠G_1(jω)=tg^{-1}T_1ω-tg^{-1}T_2ω`，`∠G_2(jω)=-tg^{-1}T_1ω-tg^{-1}T_2ω`"]},{"id":"p-ctrl4c-7","title":"频率特性实验测试与实验曲线→对数幅频渐近线","key":true,"source":"课件 p049","items":["给定频率 `ω=1/T`，有 `G(jω)=X_o/X_i`，`∠G(jω)=-(τ/T)×360°`","输入量 `x_i(t)=X_i sinωt`，输出量 `x_o(t)=X_o sin(ωt+φ)`（含直流分量）","根据实验得到的各个频率下的幅值比和相位差，就可作出频率特性实验曲线","在对数幅频特性图上，用斜率为 `0`、`±20`、`±40`、`±60dB/dec` 的渐近线由低频段到高频段逐段逼近实验曲线，得到对数幅频特性渐近线"]},{"id":"p-ctrl4c-8","title":"由对数幅频特性渐近线求传递函数（初步估计）","key":true,"source":"课件 p050","items":["设 `G(jω)=K(1+jτ_1ω)(1+jτ_2ω)…(1+jτ_mω)/[(jω)^v(1+jT_1ω)(1+jT_2ω)…(1+jT_{n-v}ω)]`","(1) 确定 `K` 和 `v`：系统在低频段的频率特性为 `lim_{ω→0}G(jω)=K/(jω)^v`，其对数幅频特性为过点 `(1, 20lgK)`、斜率 `-20v dB/dec` 的直线，与零分贝线交点处的频率为 `ω=v√K`","(2) 确定系统的组成环节：找出对数幅频特性图上的转角频率，并根据各转角频率处斜率的变化确定各组成环节","若非最小相位系统，还需进行非最小相位修正"]}],"questions":[{"id":"q-ctrl4a-1","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p006（例题）","keyPoints":["频率响应","稳态输出","幅频特性与相频特性"],"stem":"设系统的传递函数为 `G(s)=K/(Ts+1)`，输入信号为 `x_i(t)=X_i sinωt`，试求系统的稳态输出（频率响应）及其频率特性。","given":["`G(s)=K/(Ts+1)`；输入 `x_i(t)=X_i sinωt`，即 `X_i(s)=X_i ω/(s^2+ω^2)`。"],"ask":["求稳态输出 `x_o(t)`，以及幅频特性 `A(ω)` 与相频特性 `φ(ω)`。"],"steps":["第一步：求输出象函数 `X_o(s)=G(s)X_i(s)=K/(Ts+1)·X_i ω/(s^2+ω^2)`。","第二步：拉氏反变换得全响应 `x_o(t)=X_i K Tω/(1+T^2ω^2)·e^(-t/T)+X_i K/√(1+T^2ω^2)·sin(ωt-arctgTω)`。","第三步：取稳态（暂态项 `e^(-t/T)` 随 t→∞ 衰减为零），得稳态输出 `x_o(t)=X_i K/√(1+T^2ω^2)·sin(ωt-arctgTω)`。","第四步：稳态输出与输入同频率、幅值与输入幅值成正比，故幅频特性 `A(ω)=K/√(1+T^2ω^2)`、相频特性 `φ(ω)=-arctgTω`。","第五步（另一求法）：令 `s=jω`，`G(jω)=G(s)|_(s=jω)=K/(1+jTω)=K/√(1+T^2ω^2)·e^(-jarctgTω)`，即 `A(ω)=|G(jω)|=K/√(1+T^2ω^2)`、`φ(ω)=∠G(jω)=-arctgTω`。"],"result":"稳态输出 `x_o(t)=X_i K/√(1+T^2ω^2)·sin(ωt-arctgTω)`；频率特性 `G(jω)=K/(1+jTω)`，幅频 `A(ω)=K/√(1+T^2ω^2)`，相频 `φ(ω)=-arctgTω`。","basis":"课件 p006、p010（原文）"},{"id":"q-ctrl4b-1","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p026（例1）","keyPoints":["频率特性分解","积分环节改变起始点","Nyquist图起点与终点"],"stem":"例1 系统的传递函数 `G(s)=K/[s(Ts+1)]`，求系统的频率特性及幅频、相频、实频、虚频表达式，并分析 ω=0 与 ω=∞ 时的特征点。","given":["`G(s)=K/[s(Ts+1)]`（K、T 为常数）"],"ask":["求系统频率特性 `G(jω)`、幅频 `|G(jω)|`、相频 `∠G(jω)`、实频 `U(ω)`、虚频 `V(ω)`，并确定 ω=0、ω=∞ 时的起点与终点"],"steps":["解：系统的频率特性 `G(jω)=K/[jω(1+jTω)]=K·(1/jω)·(1/(1+jTω))=−KT/(1+T^2ω^2)−j K/[ω(1+T^2ω^2)]`","幅频：`|G(jω)|=K/[ω√(1+T^2ω^2)]`","相频：`∠G(jω)=−90°−arctgTω`","实频：`U(ω)=−KT/(1+T^2ω^2)`","虚频：`V(ω)=−K/[ω(1+T^2ω^2)]`","ω=0 时：`U(ω)=−KT`，`V(ω)=−∞`，`|G(jω)|=∞`，`∠G(jω)=−90°`","ω=∞ 时：`U(ω)=0`，`V(ω)=0`，`|G(jω)|=0`，`∠G(jω)=−180°`"],"result":"ω=0 时曲线起点位于负实轴点 `(−KT, j0)`，并沿负虚轴方向趋于无穷（`∠G(jω)=−90°`）；随 ω 增大曲线趋于原点，ω=∞ 时相角为 −180°；即积分环节改变了起始点（低频段）。","basis":"课件 p026（原文）"},{"id":"q-ctrl4b-2","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p027（例2）","keyPoints":["II型系统频率特性","与实轴交点","Nyquist曲线走向"],"stem":"例2 系统的传递函数 `G(s)=K/[s^2(1+T1s)(1+T2s)]`，求系统的频率特性及幅频、相频、实频、虚频表达式，并分析 ω=0、ω=∞ 及与实轴交点处的特征。","given":["`G(s)=K/[s^2(1+T1s)(1+T2s)]`（K、T1、T2 为常数）"],"ask":["求 `G(jω)`、`|G(jω)|`、`∠G(jω)`、`U(ω)`、`V(ω)`，并确定 ω=0、ω=∞ 以及 ω=1/√(T1T2) 时的特征点"],"steps":["解：系统的频率特性 `G(jω)=K/[(jω)^2(1+jT1ω)(1+jT2ω)]=K(1−T1T2ω^2)/[−ω^2(1+T1^2ω^2)(1+T2^2ω^2)]+j K(T1+T2)/[ω(1+T1^2ω^2)(1+T2^2ω^2)]`","幅频：`|G(jω)|=K/[ω^2√(1+T1^2ω^2)√(1+T2^2ω^2)]`","相频：`∠G(jω)=−180°−arctgT1ω−arctgT2ω`","实频：`U(ω)=K(1−T1T2ω^2)/[−ω^2(1+T1^2ω^2)(1+T2^2ω^2)]`","虚频：`V(ω)=K(T1+T2)/[ω(1+T1^2ω^2)(1+T2^2ω^2)]`","ω=0 时：`U(ω)=−∞`，`V(ω)=∞`，`|G(jω)|=∞`，`∠G(jω)=−180°`","ω=∞ 时：`U(ω)=0`，`V(ω)=0`，`|G(jω)|=0`，`∠G(jω)=−180°`","令 `U(ω)=0`，得 `ω=1/√(T1T2)`，此时 `V(ω)=K(T1T2)^(3/2)/(T1+T2)`"],"result":"ω=0 时起点在低频区趋于无穷（实部、虚部均为无穷，`∠G(jω)=−180°`）；曲线与实轴的交点在 `ω=1/√(T1T2)` 处，交点坐标为 `(0, jK(T1T2)^(3/2)/(T1+T2))`；ω=∞ 时回到原点，相角 −180°。","basis":"课件 p027（原文）"},{"id":"q-ctrl4c-1","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p051（例1）","keyPoints":["由实验幅频特性曲线估计传递函数","斜率变化判断典型环节","由低频段延长线确定K"],"stem":"例1 由系统的幅频特性实验曲线（实线）求其对数幅频渐近特性曲线（虚线），并由低到高确定转折频率和相应典型环节、确定增益K，对系统的频率特性作初步估计。","given":["幅频特性实验曲线（实线）及其渐近特性曲线（虚线）；由低到高确定的转折频率 `ω_1=1`、`ω_2=2`、`ω_3=8`；作低频段延长线交 0dB 线于 `ω=10` 处，确定 `K=10`"],"ask":["估计系统的传递函数"],"steps":["第一步：由低到高确定转折频率和相应典型环节，得 `ω_1=1`、`ω_2=2`、`ω_3=8`","第二步：确定增益 K——作低频段的延长线交 0dB 线于 `ω=10` 处，确定 `K=10`","第三步：写出频率特性的初步估计：`G(jω)=10(1+0.5jω)/{jω(1+jω)[1+j(ω/8)+(jω/8)^2]}`","第四步：由上式得 `G(s)=320(s+2)/[s(s+1)(s^2+8s+64)]`","第五步：上式相频曲线与相频实验曲线（实线）有差异，分析表明存在延迟环节，延迟为 `e^{-0.2s}`"],"result":"`G(s)=320(s+2)e^{-0.2s}/[s(s+1)(s^2+8s+64)]`","basis":"课件 p051（原文）"},{"id":"q-ctrl4c-2","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p052–p053（例2）","keyPoints":["由渐近特性曲线斜率变化判断环节类型","由20lgK确定K","直线方程求转角频率"],"stem":"例2 最小相位系统对数据幅频渐近特性如图4-59所示。试确定系统传递函数。","given":["最小相位系统的对数幅频渐近特性曲线；`ω=0.1` 处斜率变化 `+20dB/dec`，`ω_1`、`ω_2`、`ω_3`、`ω_4` 处斜率变化均为 `-20dB/dec`；由 `20lgK=30dB` 可确定 `K=31.6`；图中 `ω_B=0.1`、`L(ω_A)=40dB`、`L(0.1)=30dB`、斜率 `K=20dB/dec`"],"ask":["确定系统的传递函数（其中 `K`、`ω_1`、`ω_2`、`ω_3`、`ω_4` 待定）"],"steps":["第一步：判断各环节——`ω=0.1` 处斜率变化 `+20dB/dec`，为一阶微分环节；`ω_1` 处斜率变化 `-20dB/dec`，为惯性环节；`ω_2` 处斜率变化 `-20dB/dec`，为惯性环节；`ω_3` 处斜率变化 `-20dB/dec`，为惯性环节；`ω_4` 处斜率变化 `-20dB/dec`，为惯性环节","第二步：写出系统传递函数形式 `G(s)=K(1+s/0.1)/[(1+s/ω_1)(1+s/ω_2)(1+s/ω_3)(1+s/ω_4)]`，其中 K、ω_1、ω_2、ω_3、ω_4 待定","第三步：由 `20lgK=30dB`，确定 `K=31.6`","第四步：设 A、B 为斜率为 K 的对数幅频特性直线段上两点，A 点对数幅值为 `L(ω_A)`、B 点则为 `L(ω_B)`，由直线方程 `L(ω_A)-L(ω_B)=K[lgω_A-lgω_B]`，得 `ω_A=ω_B·10^{[L(ω_A)-L(ω_B)]/K}`","第五步：从低频段开始，令 `ω_A=ω_1`，图中可知 `ω_B=0.1`、`L(ω_A)=40dB`、`L(0.1)=30dB`、`K=20dB/dec`，则 `ω_1=0.1×10^{(40-30)/20}=0.316`","第六步：同理可分别求出 `ω_4`、`ω_3`、`ω_2`，写出系统传递函数"],"result":"`G(s)=31.62(1+s/0.1)/[(1+s/0.316)(1+s/3.481)(1+s/34.81)(1+s/82.54)]`","basis":"课件 p052、p053（原文）"},{"id":"q-ctrl4c-3","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p054（例1）","keyPoints":["机械系统频率特性与动柔度","动刚度＝频率特性的倒数","静刚度取ω=0"],"stem":"例1 已知机械系统在输入力作用下变形的传递函数为 `2/(s+1)`，求系统的动刚度、动柔度和静刚度。","given":["机械系统的传递函数 `G(s)=2/(s+1)`；机械系统的输入为力，输出为位移"],"ask":["求系统的动刚度、动柔度和静刚度"],"steps":["第一步：若机械系统的输入为力、输出为位移，则机械系统的频率特性就是机械系统的动柔度，故动柔度 `λ(jω)=G(jω)=G(s)|_{s=jω}=2/(jω+1)`","第二步：机械系统频率特性的倒数就是机械系统的动刚度，故动刚度 `K(jω)=1/G(jω)=(jω+1)/2`","第三步：当 `ω=0` 时，系统频率特性的倒数为系统的静刚度，故静刚度 `K(jω)|_{ω=0}=1/G(jω)|_{ω=0}=(jω+1)/2|_{ω=0}=0.5kg/mm`"],"result":"动柔度 `λ(jω)=2/(jω+1)`；动刚度 `K(jω)=(jω+1)/2`；静刚度 `K=0.5kg/mm`","basis":"课件 p054（原文）"},{"id":"q-ctrl4c-4","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p055–p056（例2）","keyPoints":["由回路电压定律建立微分方程","求传递函数与频率特性","由频率特性定义求稳态输出"],"stem":"例2 LRC串联电路如图所示。假设作用在输入端的电压为 `e_i(t)=E_i sinωt`。试求通过电阻R的稳态电流 `i(t)`。","given":["LRC 串联电路；输入端电压 `e_i(t)=E_i sinωt`；电感的自感 L、电阻 R、电容 C"],"ask":["求通过电阻 R 的稳态电流 `i(t)`（即稳态输出 `i_ss(t)`）"],"steps":["第一步：根据回路电压定律有 `L·di/dt+R·i+(1/C)∫i dt=e_i(t)`","第二步：求系统的传递函数 `G(s)=I(s)/E_i(s)=1/(Ls+R+1/(Cs))=Cs/(LCs^2+CRs+1)`","第三步：系统的频率特性 `G(jω)=jCω/(1-LCω^2+jCRω)`","第四步：系统的幅频特性 `|G(jω)|=Cω/√[(1-LCω^2)^2+(CRω)^2]`","第五步：系统的相频特性 `∠G(jω)=π/2-arctan[CRω/(1-LCω^2)]`","第六步：根据系统频率特性的定义，系统稳态输出为 `i_ss(t)=E_iCω/√[(1-LCω^2)^2+(CRω)^2]·sin(ωt+π/2-arctan[CRω/(1-LCω^2)])`"],"result":"`i_ss(t)=E_iCω/√[(1-LCω^2)^2+(CRω)^2]·cos(ωt-arctan[CRω/(1-LCω^2)])`","basis":"课件 p055、p056（原文）"},{"id":"q-ctrl4c-5","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p057–p058（例3）","keyPoints":["机械系统动力学方程与传递函数","幅频、相频特性","由稳态响应联立求参数"],"stem":"例3 一质块-弹簧-阻尼机械系统如图所示，已知质块的质量 `m=1kg`，`k` 为弹簧刚度，`c` 为阻尼系数。若外力 `f(t)=2sin2t`，由实验得到系统的稳态响应为 `x_oss=sin(2t-π/2)`。试确定 `k` 和 `c`。","given":["`m=1kg`；外力 `f(t)=2sin2t`；系统的稳态响应 `x_oss=sin(2t-π/2)`；`k` 为弹簧刚度、`c` 为阻尼系数"],"ask":["确定弹簧刚度 `k` 和阻尼系数 `c`"],"steps":["第一步：由图可知，系统的动力学方程为 `m·ẍ_o(t)+c·ẋ_o(t)+k·x_o(t)=f(t)`","第二步：则系统的传递函数为 `G(s)=1/(ms^2+cs+k)`（其中 `m=1`）","第三步：系统的频率特性为 `G(jω)=1/(k-ω^2+jcω)`","第四步：其幅频特性 `|G(jω)|=1/√[(k-ω^2)^2+c^2ω^2]`，相频特性 `∠G(jω)=-arctan[cω/(k-ω^2)]`","第五步：由题意，当 `ω=2` 时，幅值比 `|G(j2)|=1/2`，相位 `∠G(j2)=-π/2`，即 `1/√[(k-ω^2)^2+c^2ω^2]=1/2` 且 `-arctan[cω/(k-ω^2)]=-π/2`","第六步：联立解得 `k=4`、`c=1`"],"result":"`k=4`，`c=1`","basis":"课件 p057、p058（原文）"}],"images":{"2":{"w":"img/control-ch4/p002.webp","j":"img/control-ch4/p002.jpg"},"3":{"w":"img/control-ch4/p003.webp","j":"img/control-ch4/p003.jpg"},"4":{"w":"img/control-ch4/p004.webp","j":"img/control-ch4/p004.jpg"},"5":{"w":"img/control-ch4/p005.webp","j":"img/control-ch4/p005.jpg"},"6":{"w":"img/control-ch4/p006.webp","j":"img/control-ch4/p006.jpg"},"7":{"w":"img/control-ch4/p007.webp","j":"img/control-ch4/p007.jpg"},"8":{"w":"img/control-ch4/p008.webp","j":"img/control-ch4/p008.jpg"},"9":{"w":"img/control-ch4/p009.webp","j":"img/control-ch4/p009.jpg"},"10":{"w":"img/control-ch4/p010.webp","j":"img/control-ch4/p010.jpg"},"11":{"w":"img/control-ch4/p011.webp","j":"img/control-ch4/p011.jpg"},"12":{"w":"img/control-ch4/p012.webp","j":"img/control-ch4/p012.jpg"},"13":{"w":"img/control-ch4/p013.webp","j":"img/control-ch4/p013.jpg"},"14":{"w":"img/control-ch4/p014.webp","j":"img/control-ch4/p014.jpg"},"15":{"w":"img/control-ch4/p015.webp","j":"img/control-ch4/p015.jpg"},"18":{"w":"img/control-ch4/p018.webp","j":"img/control-ch4/p018.jpg"},"19":{"w":"img/control-ch4/p019.webp","j":"img/control-ch4/p019.jpg"},"20":{"w":"img/control-ch4/p020.webp","j":"img/control-ch4/p020.jpg"},"21":{"w":"img/control-ch4/p021.webp","j":"img/control-ch4/p021.jpg"},"22":{"w":"img/control-ch4/p022.webp","j":"img/control-ch4/p022.jpg"},"23":{"w":"img/control-ch4/p023.webp","j":"img/control-ch4/p023.jpg"},"24":{"w":"img/control-ch4/p024.webp","j":"img/control-ch4/p024.jpg"},"25":{"w":"img/control-ch4/p025.webp","j":"img/control-ch4/p025.jpg"},"26":{"w":"img/control-ch4/p026.webp","j":"img/control-ch4/p026.jpg"},"27":{"w":"img/control-ch4/p027.webp","j":"img/control-ch4/p027.jpg"},"28":{"w":"img/control-ch4/p028.webp","j":"img/control-ch4/p028.jpg"},"29":{"w":"img/control-ch4/p029.webp","j":"img/control-ch4/p029.jpg"},"30":{"w": trol-ch4/p058.jpg"}}}]},{"id":"test","name":"动力测试技术","short":"动力测试","meta":"测试技术 · 信号描述 / 测量 / 系统特性","color":"#c2255c","chapters":[{"id":"test-intro","name":"绪论","subtitle":"课程概况 · 测量、计量与测试 · 测试方法分类与系统组成","status":"在读","overview":"先交代课程的定位与要求：课程用书、主要内容、学习方法、仿真实验任务与考核安排。再进入绪论本体，界定测量、计量、测试三个概念，给出测量的三个要素与现代十大基本计量量，区分实验与试验。随后用流程工业设备状态监控、机械制造业传感检测、产品质量检验、智能家居、智能农业、军事航天等例子说明测试技术的用处，收在动力机械测试的三大核心目标上。最后讲测试方法的分类与测试系统的组成，说明本课程以非电量测试技术为主，给出直接测量、间接测量、组合测量的定义与算例，以及测试系统的两大部分构成。","mindmap":{"label":"绪论","children":[{"label":"课程概况","children":[{"label":"课程名称与任课教师信息"},{"label":"课程用书：能源与动力工程测试技术"},{"label":"课程在学科专业中的作用"},{"label":"课程内容与主要学习内容"},{"label":"学习方法与三元并重"},{"label":"仿真设计实验任务"},{"label":"答疑与考核安排"}]},{"label":"1.1 课程的目的及意义","children":[{"label":"测量是确定被测物属性量值的操作"},{"label":"测量的三个要素"},{"label":"计量以技术法制保量值统一"},{"label":"现代十大基本计量量"},{"label":"日常计量与强制检定"},{"label":"测试是测量和试验的综合"},{"label":"实验与试验的区别"},{"label":"测试技术的含义"},{"label":"机械产品的灵魂是测试系统"},{"label":"一架飞机需3600只传感器"},{"label":"一辆汽车需30~150只传感器"},{"label":"阿波罗10共有3295个检测点"},{"label":"温度559个、信号传感器501个"},{"label":"流程工业建立24小时在线监测系统"},{"label":"石化管道与储油罐破损泄露检测"},{"label":"机械制造中的无损检测与控制"},{"label":"汽车零部件出厂性能质量测量"},{"label":"智能家居、智能农业与办公自动化"},{"label":"军事航天与动力机械测试","children":[{"label":"导弹拦截系统中的自动测试问题"},{"label":"天宫1号与神21对接中的自动测试"},{"label":"性能验证：输出功率、热效率、汽耗率"},{"label":"状态监控：振动、温度、压力"},{"label":"故障诊断：轴系不平衡、叶片损伤"}]}]},{"label":"1.2 测试方法的分类与系统组成","children":[{"label":"非电量经传感器变换为电信号"},{"label":"非电量：位移、距离、胀差、转速"},{"label":"本课程主要以非电量测试技术为主"},{"label":"按测量过程分直接与间接测量"},{"label":"按是否接触分接触与非接触测量"},{"label":"按是否随时间变化分静态与动态测量"},{"label":"按测量条件分等精度与非等精度测量"},{"label":"一、按照获得测量结果的过程分类","children":[{"label":"直接测量：仪器直接读出被测量量值"},{"label":"水银温度计测量机油温度"},{"label":"间接测量：由已知函数关系求得被测量"},{"label":"间接测量算例 `P = Tn/9550`"},{"label":"组合测量：改变条件多次测量列方程组"},{"label":"组合测量算例 `R_T = R_0(1 + aT + bT^2)`"}]},{"label":"测试系统","children":[{"label":"测试系统是传感器仪器设备的总称"},{"label":"两类：状态检测中的测试系统"},{"label":"两类：自动控制中的测试系统"},{"label":"由试验装置和测量系统两大部分组成"},{"label":"试验装置是测试系统的信号发生器"},{"label":"测量系统含传感器、信号调理等单元"},{"label":"信号流程含激励装置与反馈控制"}]}]},{"label":"1.3 测试技术的发展现状及趋势","children":[]},{"label":"本章重点与要求","children":[{"label":"重点：掌握测试系统的组成"},{"label":"了解测试技术的发展趋势"}]}]},"points":[{"id":"p-i1-1","title":"课程基本信息与参考用书","key":true,"source":"课件 p001–p002","items":["课程名称为**动力机械测试技术**，开课单位为三峡大学。","课程教师为赵美云、陈保家，邮箱 51331403@qq.com，办公室 M2405。","课程用书为《能源与动力工程测试技术》穆林等。","课程用书为《机械工程测试技术及应用》陈保家等。"]},{"id":"p-i1-2","title":"课程在学科专业中的作用","key":true,"source":"课件 p003","items":["能源与动力工程是研究工程领域中的能源转换、传输和利用的理论和技术，提高能源利用率，减少一次能源消耗和污染物质排放，推动国民经济可持续发展的应用工程技术领域。","衔接先修理论课程，实现「理论→实践」的认知转化。","支撑专业核心能力，服务动力机械「全生命周期」需求。","对接行业实践需求，匹配岗位核心技能要求；支撑学科前沿发展，奠定创新研究基础。","测试是人类认识客观世界的手段，科学研究的基本方法。","先进的测试技术是经济高度发展和科学现代化的重要标志。","页面以「水电站、火电站、核电站中？」提出问题。"]},{"id":"p-i1-3","title":"课程内容与学习方法","key":true,"source":"课件 p004–p006","items":["本课程主要介绍热能与动力工程测试中常见物理量（压力、温度、流量、转速、功率、振动及噪声等）的传感器测量原理、测试方法及信号分析方法。","主要学习内容依次为：绪论、常用传感器基本原理、信号的描述方法、测试系统的特性、信号的调理与处理、温度的测量、压力的测量、流速的测量、流量测量、液位测量、转速转矩及功率测量。","动力机械测试技术是一门与材料科学、微电子技术、信息技术密切相关的快速发展的学科。","为弥补书本内容滞后于学科发展的问题，在教学上采编了很多多媒体素材和案例。","本课程是培养学生解决实际工程测量问题能力的专业基础课，具有很强的实践性，学习时应充分利用课程所开设的仿真实验。","课件以应变片传感器、红外传感器、电涡流传感器等为例，提出「理论学习、实践学习、研究学习三元并重」。","只有通过足够的实验和仿真实验操作，才能得到应有的实际动手能力培养和更好的掌握书本知识。"]},{"id":"p-i1-4","title":"仿真实验任务与考核安排","key":true,"source":"课件 p007–p008","items":["仿真设计实验任务为：基于 LabVIEW 的动力机械典型参数监测系统设计（任选一个参数）。","核心监测参数覆盖动力机械关键运行参数；热力参数为进汽温度/压力、排汽温度/压力、流速；机械参数为转速、轴承振动、转子胀差。","系统核心功能为数据采集、实时监测、信号分析（滤波/频域分析）、异常报警、数据存储与报表生成。","从第 9 周开始答疑，现场答疑地点为 M2405（左侧门）。","考核方法：卷面成绩 50%，平时 50%（签到 10%、课堂答题 10%、作业 10%、课后测试 10%，实验 10%）。"]},{"id":"p-i1-5","title":"绪论章节结构与重点","key":true,"source":"课件 p009–p010","items":["第 1 章绪论包含 **1.1 课程的目的及意义**、**1.2 测试方法的分类与系统组成**、**1.3 测试技术的发展现状及趋势**。","本章重点为掌握测试系统的组成，了解测试技术的发展趋势。","测试手段水平决定科学研究的深度和广度。","传感器与测试技术是综合实力的真正体现。"]},{"id":"p-i1-6","title":"测量的定义与三个要素","key":true,"source":"课件 p011","items":["**测量 MEASUREMENT**——用以确定被测物属性量值为目的的全部操作。","测量的三个要素：①事物及其属性；②指派数字或符号；③法则、标准。","课件配图举例：质量测量、血压测量、体温测量、噪声等级测量、车速测量。"]},{"id":"p-i1-7","title":"计量的定义与分类","key":true,"source":"课件 p012–p013","items":["**计量 METROLOGY**（史称「度量衡」）：以技术和法制手段保证量值准确可靠、单位统一的测量，即实现量值准确可靠、单位统一的测量。","现代十大基本计量量：长度、温度、力学、电磁学、光学、声学、化学、无线电、时间频率、电离辐射，形成了一门独立的学科。","日常计量包括电子秤、水表、电表、煤气表，出租计价器，加油机，医用体温计、血压计、眼压计。","质量技术监督局：贸易结算、安全防护、医疗卫生和环境监测等上千万台件工作强检计量器的强制检定。","课件配图为秦半两钱、秦量、秦衡与伦敦格林尼治长度标准。"]},{"id":"p-i1-8","title":"测试、实验与试验","key":true,"source":"课件 p014","items":["**测试 TEST**：具有试验性质的测量；测量和试验的综合。","测试和测量紧密相关，实际使用中往往不加严格区分。","**实验**：为了检验某种科学理论或假设而进行某种操作或从事某种活动。","**试验**：为了察看某事的结果或某物的性能而从事某种活动。","测试技术是指测试过程中所涉及的测试理论、测试方法、测试设备等。","本页英文标题为 Measurement & Test Techniques。"]},{"id":"p-i2-1","title":"测试的意义与传感器用量","key":true,"source":"课件 p015","items":["测试的意义在于：机械产品的灵魂是测试系统。","一架飞机需要3600只传感器及其配套的监测仪器。","一辆汽车需要30~150只传感器及其配套的监测仪器。","高性能传感器的集合体：“阿波罗10”共有3295个检测点。","阿波罗10的检测点中：温度传感器559个，压力传感器140个，信号传感器501个，遥控传感器142个。"]},{"id":"p-i2-2","title":"流程工业设备运行状态监控","key":true,"source":"课件 p016","items":["在电力、冶金、石化、化工等流程工业中，生产线上设备运行状态关系到整个生产线流程。","流程工业通常建立24小时在线监测系统。","典型应用是石化企业输油管道、储油罐等压力容器的破损和泄露检测。"]},{"id":"p-i2-3","title":"机械制造业中的传感检测","key":true,"source":"课件 p017","items":["在机械制造业中，利用传感技术对铸件内有无气泡、裂纹进行无损检测。","在机械加工过程中，采用各种传感器，对刀架压力、工件被夹是否变形、自动进力量等进行控制，对车床振动进行检测。","工件加工完毕后对加工精度、表面光洁度、平面度、同轴度、圆度、锥度等进行检测，有利于保证和提高工件加工质量。"]},{"id":"p-i2-4","title":"产品质量测量与出厂检验","key":true,"source":"课件 p018","items":["在汽车、机床等设备，电机、发动机等零部件出厂时，必须对其性能质量进行测量和出厂检验。","汽车出厂检验原理框图中，测量参数包括润滑油温度、冷却水温度、燃油压力及发动机转速等。","通过对抽样汽车的测试，工程师可以了解产品质量。","课件配图为汽车扭矩测量与机床加工精度测量。"]},{"id":"p-i2-5","title":"智能家居、智能农业与办公自动化","key":true,"source":"课件 p019–p021","items":["智能家居通过物联网技术将家中的各种设备（如音频设备、影音设备、照明系统、窗帘控制、空调控制、安防系统、数字影院系统、影音服务器、影柜系统、网络家电等）连接到一起。","智能家居提供家电控制、照明控制、电话远程控制、室内外遥控、防盗报警、环境监测、暖通控制、红外转发以及可编程定时控制等多种功能和手段。","智能农业，也称为精准农业，使用最少的资源，如水、肥料和种子，以最大限度地提高产量。","精准农业使用的传感器包括位置传感器、光学传感器、电化学传感器、机械传感器、土壤湿度传感器和气流传感器。","在家电产品和办公自动化产品设计中，人们大量的应用了传感器和测试技术来提高产品性能和质量。","全自动洗衣机中的传感器包括衣物重量传感器、衣质传感器、水温传感器、水质传感器、透光率光传感器(洗净度)、液位传感器、电阻传感器(衣物烘干检测)。"]},{"id":"p-i2-6","title":"军事航天中的自动测试思考","key":true,"source":"课件 p022","items":["课件以“军事航天”为题提出若干 Questions。","问题一：导弹拦截系统中的自动测试？","问题二：天宫1号与神21对接中的自动测试？","问题三：其他…………？","以上问题课件未给出答案，留作课堂讨论。"]},{"id":"p-i2-7","title":"动力机械测试的三个核心目标","key":true,"source":"课件 p023","items":["汽轮机、内燃机等测试技术的所有手段，最终都服务于以下三个核心目标，确保机组在安全边界内实现高效运行。","性能验证：确认机组实际输出功率、热效率、汽耗率等指标是否符合设计要求，常见于新机投运或大修后。","状态监控：实时跟踪运行中的关键参数（如振动、温度、压力），判断机组是否处于正常工况。","故障诊断：通过数据分析定位潜在问题（如轴系不平衡、叶片损伤、油系统异常），避免突发停机。","页面配图标注为进相600MW汽轮发电机。"]},{"id":"p-i2-8","title":"非电量测试技术","key":true,"source":"课件 p024","items":["非电量测试技术：在测试过程中，将被测的非电量通过相应的传感器变化为电信号，以便进行传输、调理、分析处理和显示记录等。","课件列举的非电量包括：位移、距离、胀差、…；振动的位移、速度、加速度、…；应力、压力、摩擦力、…；油温、瓦温、轴温、气温、…；转速、鉴相。","本课程主要以非电量测试技术为主！"]},{"id":"p-i2-9","title":"测试方法的四种分类依据","key":true,"source":"课件 p025","items":["按照获得测量结果的过程分为：直接测量、间接测量。","按是否接触测定被测对象分为：接触测量、非接触测量。","按被测量是否随时间变化分为：静态测量、动态测量。","按照测量条件分为：等精度测量、非等精度测量。"]},{"id":"p-i2-10","title":"按获得测量结果的过程分类","key":true,"source":"课件 p026","items":["直接测量：直接通过测量仪器得到被测量量值的测量为直接测量。例如，水银温度计测量机油温度。","间接测量：被测量与其它可以直接测量的物理量有确定的函数关系，可以先测量其它物理量，然后通过已知的函数关系求得被测量，例如 `P = Tn/9550`。","组合测量：通过改变测试条件进行多次测量，根据被测量与参数间的函数关系列出方程组并求解，最终确定被测量的量值，例如 `R_T = R_0(1 + aT + bT^2)`。"]},{"id":"p-i2-11","title":"测试系统的定义与分类","key":true,"source":"课件 p027","items":["测试系统：完成测试任务的传感器、仪器和设备的总称。","课件图示测试台包含转速、振动/位移传感器 + 测速、测振仪，以及转速控制/调节。","两类测试系统：① 状态检测中的测试系统；② 自动控制中的测试系统。"]},{"id":"p-i2-12","title":"测试系统的组成与信号流程","key":true,"source":"课件 p028","items":["测试系统一般由试验装置和测量系统两大部分组成，目的是全面准确地产生能够表达被测试对象状态的信息。","信号的传递过程为：激励装置 → 被测对象 → 传感器 → 信号调理 → 信号处理 → 显示记录 → 观察者。","框图中在被测对象与传感器、显示记录之间还设有反馈控制环节。","试验装置的核心作用是表达与输出被测试对象的待测信息，是测试系统的“信号发生器”。","测量系统主要由传感器、信号调理、信号处理和显示记录等单元构成。"]}],"questions":[{"id":"q-i1-1","kind":"单选","priority":2,"source":"课件 p011","sourceDetail":"课件 p011（依据正文自拟）","keyPoints":["测量的定义","测量的三个要素"],"stem":"课件中给出的「测量的三个要素」是下列哪一组？","options":[{"k":"A","t":"事物及其属性、指派数字或符号、法则与标准"},{"k":"B","t":"传感器、放大器、记录仪"},{"k":"C","t":"被测对象、测量人员、环境条件"},{"k":"D","t":"输入、输出、干扰"}],"answer":"A","why":["A ✓ 课件 p011 原文：测量的三个要素：①事物及其属性 ②指派数字或符号 ③法则、标准","B ✗ 课件 p011 未出现「传感器、放大器、记录仪」的提法","C ✗ 课件 p011 未把被测对象、测量人员、环境条件列为测量要素","D ✗ 课件 p011 未出现输入、输出、干扰的说法"],"basis":"课件 p011（原文）","answerNote":"答案由课件 p011 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-i1-2","kind":"单选","priority":2,"source":"课件 p012","sourceDetail":"课件 p012（依据正文自拟）","keyPoints":["计量","现代十大基本计量量"],"stem":"下列哪一项不属于课件列出的「现代十大基本计量量」？","options":[{"k":"A","t":"长度"},{"k":"B","t":"电磁学"},{"k":"C","t":"转速"},{"k":"D","t":"时间频率"}],"answer":"C","why":["A ✗ 「长度」在课件 p012 的十大基本计量量之中","B ✗ 「电磁学」在课件 p012 的十大基本计量量之中","C ✓ 课件 p012 原文列出的十大基本计量量为长度、温度、力学、电磁学、光学、声学、化学、无线电、时间频率、电离辐射，其中没有「转速」","D ✗ 「时间频率」在课件 p012 的十大基本计量量之中"],"basis":"课件 p012（原文）","answerNote":"答案由课件 p012 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-i1-3","kind":"单选","priority":2,"source":"课件 p014","sourceDetail":"课件 p014（依据正文自拟）","keyPoints":["测试 TEST 的定义","测试与测量的关系"],"stem":"课件对「测试 TEST」的界定是？","options":[{"k":"A","t":"具有试验性质的测量；测量和试验的综合"},{"k":"B","t":"仅在实验室内进行的精密测量"},{"k":"C","t":"仅指对计量器具的强制检定"},{"k":"D","t":"对产品性能的抽样检查"}],"answer":"A","why":["A ✓ 课件 p014 原文：测试TEST —— 具有试验性质的测量；测量和试验的综合","B ✗ 课件 p014 未把测试限定在实验室内","C ✗ 课件 p014 未把测试等同于计量器具强制检定","D ✗ 课件 p014 未给出抽样检查这一界定"],"basis":"课件 p014（原文）","answerNote":"答案由课件 p014 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-i2-1","kind":"单选","priority":2,"source":"课件 p025","sourceDetail":"课件 p025「测试方法分类」","keyPoints":["测试方法的四种分类依据","按被测量是否随时间变化的分类"],"stem":"课件“测试方法分类”一页提出多种分类依据，其中按被测量是否随时间变化，测量可分为哪两类？","options":[{"k":"A","t":"直接测量与间接测量"},{"k":"B","t":"接触测量与非接触测量"},{"k":"C","t":"静态测量与动态测量"},{"k":"D","t":"等精度测量与非等精度测量"}],"answer":"C","why":["A ✗ 直接测量、间接测量是按照获得测量结果的过程分类，见课件 p025。","B ✗ 接触测量、非接触测量是按是否接触测定被测对象分类，见课件 p025。","C ✓ 课件 p025 原文：按被测量是否随时间变化 → 静态测量、动态测量。","D ✗ 等精度测量、非等精度测量是按照测量条件分类，见课件 p025。"],"basis":"课件 p025（原文）","answerNote":"答案由课件 p025 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-i2-2","kind":"单选","priority":2,"source":"课件 p027","sourceDetail":"课件 p027「测试系统」","keyPoints":["测试系统的定义","两类测试系统"],"stem":"课件中对“测试系统”给出的定义是什么？","options":[{"k":"A","t":"由试验装置和测量系统两大部分组成的整体"},{"k":"B","t":"完成测试任务的传感器、仪器和设备的总称"},{"k":"C","t":"状态检测中的测试系统与自动控制中的测试系统"},{"k":"D","t":"传感器、信号调理、信号处理和显示记录等单元的集合"}],"answer":"B","why":["A ✗ 由试验装置和测量系统两大部分组成是课件 p028 对测试系统组成的说明，不是 p027 的定义。","B ✓ 课件 p027 原文：测试系统——完成测试任务的传感器、仪器和设备的总称。","C ✗ 状态检测中的测试系统、自动控制中的测试系统是课件 p027 划分的两类测试系统，不是定义。","D ✗ 传感器、信号调理、信号处理和显示记录等单元构成的是测量系统，见课件 p028。"],"basis":"课件 p027（原文）","answerNote":"答案由课件 p027 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-i2-3","kind":"单选","priority":2,"source":"课件 p026","sourceDetail":"课件 p026「一、按照获得测量结果的过程分类」","keyPoints":["间接测量的定义与算例","组合测量的定义与算例"],"stem":"课件在说明间接测量时，举出的公式例子是哪一个？","options":[{"k":"A","t":"`R_T = R_0(1 + aT + bT^2)`"},{"k":"B","t":"`P = Tn/9550`"},{"k":"C","t":"`y′ = dy/dt`"},{"k":"D","t":"`R_T = R_0/(1 + aT)`"}],"answer":"B","why":["A ✗ `R_T = R_0(1 + aT + bT^2)` 是课件 p026 组合测量的例子，不是间接测量的例子。","B ✓ 课件 p026 原文：间接测量……例如，P = Tn/9550。","C ✗ 课件 p026 未出现该式。","D ✗ 课件 p026 未出现该式。"],"basis":"课件 p026（原文）","answerNote":"答案由课件 p026 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-i2-4","kind":"简答","priority":1,"source":"课件题目","sourceDetail":"课件 p022「军事航天」页的 Questions 思考题","keyPoints":["军事航天中的自动测试","导弹拦截与航天器对接中的测试需求"],"stem":"课件 p022“军事航天”一页用 Questions? 列出了哪几个与自动测试有关的问题？请分别说明。","given":["课件 p022 页面左侧以 Questions? 列出三个带红色方块的问题。","页面配图为导弹防御系统工作示意、火箭发射、天宫1号与神舟飞船对接、航天员合影及导弹发射车图片。"],"ask":["导弹拦截系统中的自动测试是怎样实现的？","天宫1号与神21对接中的自动测试是怎样实现的？","其他军事航天场景中的自动测试还有哪些？"],"steps":["第一步 观看导弹拦截系统示意图，梳理从预警探测到拦截弹发射各环节的自动测试需求。","第二步 结合天宫1号与神21对接的图示，思考对接过程中位置、姿态等参数的自动测试需求。","第三步 联系本课程内容，再列举其他军事航天中的自动测试场景。"],"result":"课件在本页只提出问题，未给出解答，问题留作课堂讨论。","basis":"课件 p022（原文）"}],"images":{"1":{"w":"img/test-intro/p001.webp","j":"img/test-intro/p001.jpg"},"2":{"w":"img/test-intro/p002.webp","j":"img/test-intro/p002.jpg"},"3":{"w":"img/test-intro/p003.webp","j":"img/test-intro/p003.jpg"},"4":{"w":"img/test-intro/p004.webp","j":"img/test-intro/p004.jpg"},"5":{"w":"img/test-intro/p005.webp","j":"img/test-intro/p005.jpg"},"6":{"w":"img/test-intro/p006.webp","j":"img/test-intro/p006.jpg"},"7":{"w":"img/test-intro/p007.webp","j":"img/test-intro/p007.jpg"},"8":{"w":"img/test-intro/p008.webp","j":"img/test-intro/p008.jpg"},"9":{"w":"img/test-intro/p009.webp","j":"img/test-intro/p009.jpg"},"10":{"w":"img/test-intro/p010.webp","j":"img/test-intro/p010.jpg"},"11":{"w":"img/test-intro/p011.webp","j":"img/test-intro/p011.jpg"},"12":{"w":"img/test-intro/p012.webp","j":"img/test-intro/p012.jpg"},"13":{"w":"img/test-intro/p013.webp","j":"img/test-intro/p013.jpg"},"14":{"w":"img/test-intro/p014.webp","j":"img/test-intro/p014.jpg"},"15":{"w":"img/test-intro/p015.webp","j":"img/test-intro/p015.jpg"},"16":{"w":"img/test-intro/p016.webp","j":"img/test-intro/p016.jpg"},"17":{"w":"img/test-intro/p017.webp","j":"img/test-intro/p017.jpg"},"18":{"w":"img/test-intro/p018.webp","j":"img/test-intro/p018.jpg"},"19":{"w":"img/test-intro/p019.webp","j":"img/test-intro/p019.jpg"},"20":{"w":"img/test-intro/p020.webp","j":"img/test-intro/p020.jpg"},"21":{"w":"img/test-intro/p021.webp","j":"img/test-intro/p021.jpg"},"22":{"w":"img/test-intro/p022.webp","j":"img/test-intro/p022.jpg"},"23":{"w":"img/test-intro/p023.webp","j":"img/test-intro/p023.jpg"},"24":{"w":"img/test-intro/p024.webp","j":"img/test-intro/p024.jpg"},"25":{"w":"img/test-intro/p025.webp","j":"img/test-intro/p025.jpg"},"26":{"w":"img/test-intro/p026.webp","j":"img/test-intro/p026.jpg"},"27":{"w":"img/test-intro/p027.webp","j":"img/test-intro/p027.jpg"},"28":{"w":"img/test-intro/p028.webp","j":"img/test-intro/p028.jpg"}}},{"id":"test-ch1","name":"第一章 测量误差分析及数据处理","subtitle":"误差三分类 · 随机与系统误差 · 疏失误差剔除 · 数据处理","status":"在读","overview":"讲测量误差怎么分、怎么算、怎么处理。先把误差分成系统误差、随机误差、疏失误差三类，给出准确度、精密度、精确度的含义，以及绝对误差 Δ=x−x_o 与相对误差 δ=Δ/m 的定义。再讲随机误差的正态分布规律与单峰性、对称性、抵偿性三大特性；系统误差按来源分类并给出方和根综合方法；疏失误差的消除给出莱依特准则、格拉布斯准则、t 检验准则与狄克逊准则的判据与步骤，并指出 n≤10 时莱依特准则不再适用。接着讲单次测量的最大相对误差估算、等精度与非等精度测量的误差计算、间接测量的误差传递函数。最后讲有效数字与测量数据处理方法。","mindmap":{"label":"第一章 测量误差分析及数据处理","children":[{"label":"课程与本章导学","children":[{"label":"考核：卷面 50%、平时 50%"},{"label":"本课程是理论、仿真与工程实物的桥梁"},{"label":"测到了 ≠ 测准了，测准了 ≠ 理解正确了"},{"label":"本章为第1章 测量误差分析及数据处理"},{"label":"知识目标重在误差定义与统计分析"},{"label":"难点含最小二乘法残差平方和最小"}]},{"label":"1.1 测量误差的基本概念","children":[{"label":"按规律与影响程度分三类误差"},{"label":"系统误差具规律性且可消除或修正"},{"label":"随机误差必然存在，均值趋于零"},{"label":"等精度测量：同仪器同方法同观测者"},{"label":"准确度反映系统误差大小"},{"label":"精密度反映随机误差大小"},{"label":"精确度是准确度与精密度的综合"},{"label":"疏失误差无规则，只能舍弃不用"},{"label":"绝对误差 Δ = x − x_o"},{"label":"相对误差 δ = Δ/m 含三种形式"}]},{"label":"1.2 随机误差分析与表达","children":[{"label":"随机误差服从正态分布规律"},{"label":"三大特性：单峰性、对称性、抵偿性"},{"label":"有限次数用样本标准差 σ̂ 估算"},{"label":"算术平均标准差 s = σ̂/√n"},{"label":"算术平均值极限误差 λ_lim = ±3S"},{"label":"结果写成 L ± λ_lim 或 L ± δ_lim"}]},{"label":"1.3 系统误差分析与处理","children":[{"label":"恒值系统误差与变值系统误差"},{"label":"阿贝-赫梅特准则判断周期性误差"},{"label":"偏差核算法判断线性系统误差"},{"label":"算术平均值与标准差比较法"},{"label":"根源控制、预检法、交换法"},{"label":"代数、算术、几何三种综合法估算"},{"label":"多项系统误差按方和根综合"},{"label":"综合值换算相对误差 δ_p"},{"label":"项数不多时可用算术综合法"}]},{"label":"1.4 疏失误差的消除","children":[{"label":"人为错读错记可直接剔除"},{"label":"莱依特准则用 3σ̂ 判坏值"},{"label":"剔除后重算 x̄ 与 σ̂ 再检验"},{"label":"格拉布斯准则算 T_li 查表判别"},{"label":"t 检验准则剔除可疑值 x_j"},{"label":"狄克逊准则按极差比判别"},{"label":"n≤10 时莱依特准则不适用"}]},{"label":"1.5 测量误差的计算","children":[{"label":"误差计算三步：剔除—修正—分析"},{"label":"单次测量最大相对误差估算"},{"label":"等精度测量误差五步计算"},{"label":"非等精度测量引入“权”"},{"label":"加权算术平均值与 S_m"},{"label":"间接测量的误差传递式"},{"label":"间接测量标准误差与极限误差"}]},{"label":"1.6 测量数据的处理方法","children":[{"label":"有效数字记录与舍入法则"},{"label":"加减乘除与乘方开方位数规则"},{"label":"图示法坐标尺选择要点"},{"label":"曲线极值处理与光顺"},{"label":"一元多项式回归最小二乘"},{"label":"正态方程求解回归系数"},{"label":"一元线性回归相关系数检验"},{"label":"非线性方程的线性变换"}]}]},"points":[{"id":"p-c1a-1","title":"课程信息与考核安排","key":true,"source":"课件 p001–p002","items":["课程名称：动力机械测试技术；授课教师：赵美云、陈保家、肖嘉伟；机械与动力学院；邮箱 51331403@qq.com；办公室 M2405。","从第1周开始答疑，现场答疑地点为 M2405（左侧门）。","考核方法：卷面成绩 50%，平时 50%。","平时成绩构成：签到 10%、课堂答题 10%、作业 10%、课后测试 10%、实验 10%。"]},{"id":"p-c1a-2","title":"课程定位与专业培养目标","key":true,"source":"课件 p003–p004","items":["能源动力工程专业主要研究如何把大自然存在的如太阳能、风能、化石燃料、水能、生物质能等各种能源有效转换成工业上和社会生活需要的电能、机械能等能量，同时如何减少对环境的污染。","专业旨在培养具备从事能源、动力、环保等领域的科学研究、技术开发、设计制造、运行控制、教学、管理等工作，富有社会责任感、具有国际视野、创新创业精神、工程实践能力和竞争意识的高素质专门人才。","动力机械测试技术，是能动专业理论、仿真、工程实物三者之间的桥梁，贯穿能源动力装备研发、试验、运行、运维全生命周期，是能动专业学生必备核心工程能力。","课程作用 6 条：验证理论与仿真，打通理论和实物的鸿沟；动力装备性能评定的唯一依据；掌握装备运行状态，保障机组安全稳定运行；支撑能源装备创新研发；赋能能源装备数字化与智能化；支撑专业人才工程素养培养。","热力、流体理论回答装备应该如何工作；测试技术回答装备实际是如何工作。先进的测试技术是经济高度发展和科学现代化的重要标志。"]},{"id":"p-c1a-3","title":"为什么准确测量并不容易","key":true,"source":"课件 p005","items":["设问：传感器显示 100℃，真实温度就是 100℃吗？答案是不一定，在实际工程测量中，数据的准确性会受到多重因素的叠加影响，导致显示值与真实值存在偏差。","六类影响因素：测量误差（系统偏差与随机误差的叠加）、安装影响（接触热阻与机械应力影响）、噪声干扰（电磁干扰与电路热噪声污染）、采样问题（频率混叠与采样率不足失真）、动态特性（响应滞后与频率特性限制）、环境干扰（温度漂移与湿度变化影响）。","01 测到了 ≠ 测准了：数据采集的第一步是“获取”，但数值的准确性受限于设备精度、校准状态与环境条件，显示的数字未必反映真实物理量。","02 测准了 ≠ 理解正确了：即使数据准确，若缺乏对工况背景、传感器特性及信号处理的理解，也可能得出错误的分析结论，误判系统状态。"]},{"id":"p-c1a-4","title":"本章章名与内容框架","key":true,"source":"课件 p006–p007","items":["本章标题为：第1章 测量误差分析及数据处理。","节次安排：1.1 测量误差的基本概念；1.2 随机误差分析与表达；1.3 系统误差分析与处理。","后续节次：1.4 疏失误差的消除；1.5 测量误差的计算；1.6 测量数据的处理方法。"]},{"id":"p-c1a-5","title":"知识能力与素养目标","key":true,"source":"课件 p008–p009","items":["知识目标1：理解测量误差基本概念，掌握绝对误差、相对误差、引用误差定义与计算公式。","知识目标2：掌握随机误差统计特性、正态分布规律，学会用平均值、贝塞尔标准偏差评价随机误差。","知识目标3：掌握系统误差产生原因、识别方法以及工程上减小、修正系统误差的措施。","知识目标4：理解疏失误差（粗大误差）来源，熟练运用莱特准则判别并剔除疏失误差。","知识目标5：掌握测量误差合成计算思路，能够对动力测试（温度、压力、振动）误差分量进行估算。","知识目标6：掌握测量数据处理方法：有效数字取舍规则、测量结果规范表达、最小二乘法线性拟合，可完成传感器标定数据处理。","能力目标：能对汽轮机、内燃机测试中的测量误差分类，区分随机、系统、疏失误差；能独立完成一组等精度重复测试数据的统计计算、疏失误差判别与剔除；能完成误差分量计算、误差合成，评估动力测试结果可靠性；能利用最小二乘法对标定数据拟合，得到传感器线性方程并规范撰写试验数据结果。","素养目标：延续绪论核心思想，牢固树立测到了 ≠ 测准了的工程意识，认识不存在绝对无误差的测量；养成严谨、客观的试验科研习惯，不盲目采信仪器读数；理解误差处理是动力测试的基础，为后续传感器测试、信号采集、状态监测奠定理论基础。"]},{"id":"p-c1a-6","title":"本章重点与难点","key":true,"source":"课件 p010","items":["重点1：三类误差（随机误差、系统误差、疏失误差）的特点、来源及工程区分。","重点2：随机误差统计分析：算术平均值、贝塞尔公式标准偏差。","重点3：疏失误差莱特判别准则、异常数据剔除流程。","重点4：绝对误差、相对误差、引用误差的计算。","重点5：测量结果规范表达；最小二乘法一元线性拟合（传感器标定）。","难点1：随机误差正态分布物理含义，单次测量标准偏差与平均值标准偏差的区别。","难点2：系统误差的识别；理解多次测量取平均只能削弱随机误差，无法消除系统误差。","难点3：莱特准则的适用前提（正态分布、等精度测量）与局限性。","难点4：多分量测量误差合成计算。","难点5：最小二乘法“残差平方和最小”原理理解，结合标定工程场景应用。"]},{"id":"p-c1a-7","title":"三类测量误差与系统误差","key":true,"source":"课件 p011","items":["在测量过程中产生误差的因素是多种多样的，如果按照影响因素的出现规律以及它们对测量结果的影响程度来区分，可将测量误差分为三类。","系统误差：在测量过程中，由某些具有规律性的、影响程度可以由确定的因素所引起的误差称为系统误差。","系统误差主要因素：仪器本身及其安装使用方法、环境条件、测试人员的操作习惯等。","准确度（Justness）：对于同一被测量进行多次测量时，每次测量数据与真值之间的偏离程度体现了系统误差的大小，是系统误差的反映。","系统误差是可能被消除或修正的。"]},{"id":"p-c1a-8","title":"随机误差精密度与精确度","key":true,"source":"课件 p012","items":["随机误差：在测量过程中，由许多未知的或微小的因素对测量结果产生综合影响的结果，这些因素出现与否以及它们的影响程度都是难以确定的；随机误差的算术平均值逐渐接近于零。","等精度测量：（用同一仪器、按同一方法、由同一观测者进行的测量）条件下，对同一测量参数进行多次测量。","精密度（Precision）：对于同一被测量进行多次测量时，每次测量数据之间的偏离程度是随机误差大小的反映，是随机误差的反映。","精确度（常简称精度，Accuracy）：是上述准确度、精密度的综合反映，体现同一被测量多次测量数据密集接近真值的程度。","随机误差必然存在于测量结果之中。"]},{"id":"p-c1a-9","title":"疏失误差与绝对相对误差","key":true,"source":"课件 p013","items":["疏失误差：主要由于测量者粗心或操作失误等引起，这类疏失误差无规则可寻，无法修正。","包含疏失误差的测量结果只能舍弃不用。","绝对误差：测量值 x 与真值 x_o 之差，`Δ = x − x_o`。","相对误差：`δ = Δ/m`。","m 取测定值 x 时，δ 称为标称相对误差；m 取约定真值 x_o 时，δ 称为实际相对误差；m 取测量仪表的满刻度值（最大量程）时，δ 称为引用相对误差。"]},{"id":"p-c1a-10","title":"随机误差的分布规律","key":true,"source":"课件 p014–p015","items":["虽然就测量的个体而言随机误差是无规律的，但就整体而言随机误差仍然遵循着一定的统计规律，因此可以用数理统计方法来处理和分析测量结果。","随机误差可分正态分布与非正态分布两大类，其中非正态分布又有均匀分布与反正弦分布之分，但就大多数测量而言，其测量结果中的随机误差都服从正态分布规律。","正态分布概率密度 `f(Δ) = 1/(σ√(2π)) · e^{−Δ²/(2σ²)}`。","标准差 `σ = √(∑(x_i − μ)²/n) = √(∑Δ_i²/n)`。","式中 μ 为被测量的数学期望值，当重复测量次数足够多时，可以取测量值的平均值，是表征测量值平均水平和中心位置的参数；σ 为被测量的标准差（或称均方根误差），是表征测量值相对于其中心位置离散程度的参数；n 为重复测量次数，n → ∞。","1）单峰性：概率密度峰值出现在被测量的平均值附近，即误差 Δ 接近零位置；且标准差 σ 越小，曲线越狭窄陡峭，说明随机误差中小误差出现的概率大。","2）对称性：绝对值相等、符号相反的随机误差出现的概率相等。","3）抵偿性：当重复测量次数无限多（n → ∞）时，正负误差互相抵消，即随机误差的平均值趋于零，意味着增加重复测量次数可以减小测量结果的随机误差。"]},{"id":"p-c1a-11","title":"有限次数测量的标准差与极限误差","key":true,"source":"课件 p016–p017","items":["对于有限次数测量，采用测量值与算术平均值的偏差来估算标准差，即样本标准差为 `σ̂ = √(∑(X_i − X̄)²/(n−1)) = √(∑v_i²/(n−1))`。","算术平均标准差为 `s = σ̂/√n = √(∑(X_i − X̄)²/(n(n−1))) = √(∑v_i²/(n(n−1)))`。","式中 `v_i = x_i − X̄`（i = 1, 2, …, n），称为测量值的偏差。","算术平均值的极限误差：`λ_lim = ±3S = ±3√(∑v_i²/(n(n−1)))`。","或者用相对极限误差 δ_lim 表示：`δ_lim = λ_lim/X̄ × 100%`。","因此，对于有限次测量的最后测量结果可写成 `L ± λ_lim`（±3S）或 `L ± δ_lim`。"]},{"id":"p-c1a-12","title":"系统误差的基本特性与判断","key":true,"source":"课件 p018–p020","items":["恒值系统误差：在同一条件下，对同一被测量进行多次测量时，误差的绝对值和符号保持不变。","变值系统误差：对同一被测量进行多次测量时，误差的绝对值和符号按一定规律变化；分为线性变值系统误差与非线性变值系统误差。","右图中 a 为恒值系统误差，b、c、e 为变值和复杂规律变化系统误差，d 为周期性系统误差。","由上述特征可知，多次重复测量不能抵偿系统误差，而且误差值可能很大，因此必须及时发现，并采取减小或者消除措施。","（1）阿贝-赫梅特准则（用于周期性系统误差的判断）：①计算测量结果的算术平均值 `X̄ = ∑X_i/n`；②计算测量值偏差 `v_i = X_i − X̄`（i = 1, 2, …, n）；③计算算术平均值标准差 `σ̂ = √(∑(X_i − X̄)²/(n−1)) = √(∑v_i²/(n−1))`；④判断。","判断准则：若 `|∑v_i v_{i+1}| > √(n−1)σ̂²` 成立，则测量结果存在周期性系统误差。","（2）偏差核算法——马力科夫准则（检查是否含有线性系统误差）：将按照测量先后排序的测量结果分为前半组 x₁, x₂, …, x_m 和后半组 x_m+1, x_m+2, …, x_n，计算两组测量值偏差和的差值 `D = ∑v_i − ∑v_i`；如果 D 值显著偏离零值，则认为测量结果中含有线性系统误差。","（3）算术平均值与标准差比较法：对同一被测量进行两组（或多组）测量，设两组重复次数为 n₁ 和 n₂，算术平均值分别为 x̄₁ 和 x̄₂，算术平均值的标准差分别为 s₁ 和 s₂，则 Δx̄ = x̄₁ − x̄₂ 的标准差 `s_Δ = √(s₁² + s₂²)`，其在置信区间 (−ts_Δ, ts_Δ) 内概率为 `p_α = p(|Δx̄| < ts_Δ)`，t 为置信系数；在给定的置信概率 p_α 下，如果测量结果不含恒值系统误差，则 `|Δx̄| < ts_Δ` 成立，否则认为测量结果不仅含有随机误差，还存在恒值系统误差。"]},{"id":"p-c1a-13","title":"系统误差的修正消除与估算","key":true,"source":"课件 p023–p024","items":["a. 根源控制：每一次测量之前都应该对测量过程可能产生系统误差的环节作详细分析，正确选择、安装、调整和操作测量仪器，严格遵守使用环境条件要求。","b. 预检法：预检法也称校准法，这种方法是预先检定测量仪器的系统误差，制作误差曲线或者校准曲线，以之修正或校准实际测量结果；由于修正值本身也会有误差，因此这种修正方法不可能完全消除系统误差，测量结果中残留的系统误差可按随机误差处理。","c. 交换法：测量过程通过变换某些条件（如被测对象的位置等），使产生系统误差的因素相互抵消，达到减小或消除误差的方法。","系统误差的估算：设测量结果受 n 个系统误差源的影响，误差分量为 Δ₁, Δ₂, …, Δ_n，估算总系统误差 Δ 可采用以下方法。","a. 代数综合法：`Δ = Δ₁ + Δ₂ + ⋯ + Δ_n = ∑Δ_i`。","b. 算术综合法：`Δ = ±(|Δ₁| + |Δ₂| + ⋯ + |Δ_n|) = ±∑|Δ_i|`。","c. 几何综合法：`Δ = ±√(Δ₁² + Δ₂² + ⋯ + Δ_i²) = ±√(∑Δ_i²)`。"]},{"id":"p-c1a-14","title":"压力测量装置系统误差估算","key":true,"source":"课件 p025–p026","items":["已知压力表的精度为 0.5 级，量程为 0～600kPa，表盘刻度 100 格代表 200kPa，即分度值为 2kPa，测量时指示压力读数为 300kPa，读数时指针来回摆动 ±1 格，Δh ≤ 0.05m。","压力表使用条件大多符合要求，仅环境温度值高于标准值 (20±3)℃ 10℃，该压力表温度修正值为每偏离 1℃ 时造成系统误差为仪表基本误差的 4%。","（1）仪表基本误差：`Δp₁ = ±(0.5% × 600)kPa = ±3kPa`。","（2）环境温度造成的系统误差：`Δp₂ = ±(4%Δp₁Δt) = ±(4% × 3 × 10)kPa = ±1.2kPa`。","（3）安装误差：管路实际压力值 `p = p_i + gρh`，式中 p_i 为指示压力、g 为重力加速度、ρ 为所测液体的密度，若液体为水其密度 ρ = 1000kg/m³；`Δp₃ = ±(Δhρg) = ±(0.05m × 1000kg/m³ × 9.8m/s²) = ±490N/m² = ±0.49kPa`。","（4）读数误差：`Δp₄ = ±2kPa`。","按算术综合法，总系统误差 `Δp = ±∑Δp_i = ±(3 + 1.2 + 0.490 + 2)kPa = ±6.690kPa`。","引用相对误差 `δ_p = Δp/p = ±6.690/300 = ±2.23%`（课件 p026 另列“若按几何综合法，则 Δp 为”待续）。"]},{"id":"p-c1b-1","title":"系统误差的综合计算例","key":true,"source":"课件 p027","items":["课件 p027 的算例按方和根法综合系统误差：Δp = ±√(3² + 1.2² + 0.490² + 2²) = ±3.831 kPa。","相对误差由综合值除以被测量得到：δ_p = Δp/p = ±3.831/300 = ±1.27%。","课件结论：此例中因系统误差项数不多，为了安全起见可采用算术综合法的计算值。"]},{"id":"p-c1b-2","title":"疏失误差与莱依特准则","key":true,"source":"课件 p028","items":["如果可以明确奇异的数据是由于人为的错读、错记或者错算造成，则可以直接剔除，否则需要按照一定的准则判断，然后再做处理。","课件假定下述测量已修正系统误差，或者系统误差可以忽略不计。","1. 莱依特准则：对某一被测量的等精度测量，若已知其算术平均值 x̄ 和标准差 σ̂，如果有 |V_i| = |x_i − x̄| > 3σ̂，则认为 x_i 为坏值，需要予以剔除。","剔除值 x_i 后，需要重新对剩余的数据进行筛选，即重新计算算术平均值 x̄ 与标准误差 σ̂，并再次检验有无坏值。","在重复次数 n ≤ 10 的情况下，莱依特准则不再适用，需要采用其他判别准则。"]},{"id":"p-c1b-3","title":"格拉布斯准则判别步骤","key":true,"source":"课件 p029","items":["2. 格拉布斯（Grubbs）准则：对某一被测量的等精度测量，若已知其算术平均值 x̄ 和标准差 σ̂，按下式计算格拉布斯准则数 T：T_li = |V_i|/σ̂ = |x_i − x̄|/σ̂。","选择一个显著度（或称危险率）α，再根据测量次数 n，在格拉布斯准则数 T_(n,α) 表中查出相应的 T_(n,α) 值。","判别 T_li 是否大于 T_(n,α)，若 T_li ≥ T_(n,α)，则可认为测量结果中含有疏失误差。"]},{"id":"p-c1b-4","title":"t 检验准则判别疏失误差","key":true,"source":"课件 p030","items":["3. t 检验准则：当测量次数较少时，也可以采用 t 检验准则来判别疏失误差，适用于对某被测量进行 n 次等精度测量、认为 x_j 是可疑数据的情形。","将可疑数据 x_j 剔除后计算平均值 x̄ = (1/(n−1))·Σ x_i，式中求和取 i = 1 到 n 且 i ≠ j。","并求得测量值的标准误差 σ̂ = √(Σ v_i²/(n−2))，计算时仍不包含 v_j = x_j − x̄。","根据测量次数 n 和选取的显著度 α，即可查 t 分布检验系数表查得 K_(n,α)。","若 |x_j − x̄| > Kσ̂，则认为测量值 x_j 为疏失误差、予以剔除是正确的；否则 x_j 应保留。"]},{"id":"p-c1b-5","title":"狄克逊准则与四组统计量","key":true,"source":"课件 p031–p032","items":["4. 狄克逊准则：上述疏失误差判别准则均需先求出标准误差 σ̂，实际计算时比较麻烦，狄克逊准则可不必要 σ̂，用极差比的方法得到简化而严密的结果。","对某一被测量的等精度测量结果按照从小到大排序，得 x_1, x_2, …, x_n。","根据测量次数 n 的数值选取适合的计算式：n ≤ 7 时用 r_10(n) = (x_n − x_(n−1))/(x_n − x_1) 和 r_11(1) = (x_1 − x_2)/(x_1 − x_n)。","8 ≤ n ≤ 10 时用 r_11(n) = (x_n − x_(n−1))/(x_n − x_2) 和 r_11(1) = (x_1 − x_2)/(x_1 − x_(n−1))。","11 ≤ n ≤ 13 时用 r_21(n) = (x_n − x_(n−2))/(x_n − x_2) 和 r_21(1) = (x_1 − x_3)/(x_1 − x_(n−1))。","n ≥ 14 时用 r_22(n) = (x_n − x_(n−2))/(x_n − x_3) 和 r_22(1) = (x_1 − x_3)/(x_1 − x_(n−2))。","选定显著度 α，查狄克逊准则临界值表得到 r_0(n,α)；当测量结果的统计量大于临界值时，则认为相应的 x_1 或者 x_n 含有疏失误差。","剔除含疏失误差的测量结果后，重新执行计算统计量与判别的步骤，直至计算得到的统计量均小于临界值。"]},{"id":"p-c1b-6","title":"误差分析与计算的基本步骤","key":true,"source":"课件 p034","items":["课件 p034 给出误差分析与计算的基本步骤：①剔除疏失误差；②修正系统误差；③最后在确定不存在疏失误差与系统误差的情况下，对随机误差进行分析和计算。","课件说明：以下关于不同测量类别的误差计算都是指在完成上述①、②步骤的基础上进行的。","1. 直接测量误差的计算，a. 单次测量误差的估算：记单次测量所得被测量的读数为 A_m，测量仪器满刻度读数为 A，测量仪器的精度等级为 δ_e。","则被测量测量结果中可能出现的最大相对误差为 δ_max = δ_e · A/A_m。"]},{"id":"p-c1b-7","title":"单次测量最大相对误差例","key":true,"source":"课件 p035","items":["课件 p035 例：某一离心式转速表满刻度读数为 2000 r/min，精度级为 1 级，试求用此转速表测量转速、当指针值为 200 r/min 与 1500 r/min 时可能出现的最大相对误差。","当示值为 200 r/min 时：δ_max = δ_e · A/A_m = (±1%) × 2000/200 = ±10%。","当示值为 1500 r/min 时：δ_max = δ_e · A/A_m = (±1%) × 2000/1500 = ±1.33%。","课件结论：采用确定量程和精度等级的仪器进行测量时，被测量量值越小其相对误差越大；选择测量仪器的量程时需要对被测量的量值范围做预估，尽可能使测量值接近于仪器的满刻度。"]},{"id":"p-c1b-8","title":"等精度测量误差的五步计算","key":true,"source":"课件 p036–p037","items":["b. 等精度测量误差的计算：对某一被测量 x 进行 m 次重复等精度测量，并且经过疏失误差剔除和系统误差修正后，得到 n 个有效测量值 x_1, x_2, …, x_n。","①计算平均值 x̄ = (Σ x_i)/n = (x_1 + x_2 + x_3 + … + x_n)/n。","②计算测量样本的均方根误差（标准差）σ̂ = √(Σ(x_i − x̄)²/(n−1)) = √(Σ v_i²/(n−1)) 和极限误差 Δ_lim = ±3σ̂。","③计算测量结果算术平均值的均方根误差（标准差）S = σ̂/√n 和极限误差 λ_lim = ±3S。","④计算测量结果算术平均值的相对极限误差 δ_lim = λ_lim/x̄ × 100%。","⑤测量结果表达为 x̄ ± λ_lim 或 x̄ ± δ_lim。"]},{"id":"p-c1b-9","title":"非等精度测量与“权”","key":true,"source":"课件 p038–p039","items":["c. 非等精度测量误差的计算：“权”值的大小与测量的标准误差密切相关，标准差越小，说明相应的测量结果越可靠，对应的“权”值也就越大，“权”值与标准误差的平方成反比。","假设对某一被测量进行了一系列（n 组）测量，各组测量精度不尽相同，每组测量结果算术平均值的标准误差分别为 s_1, s_2, …, s_n，则相应的“权”分别为 P_1 = η/s_1², P_2 = η/s_2², …, P_i = η/s_i², …, P_n = η/s_n²。","式中 P_i 为第 i 组测量结果的“权”值，η 为任意选取的常数；用测量值的加权算术平均值 x̄_m 作为被测量真值 A 的最佳估计值。","加权算术平均值 x̄_m = Σ P_i x̄_i / Σ P_i，式中 x̄_i 为各组测量值的算术平均值。","与加权算术平均值相应的加权算术平均值均方根误差 S_m = √(1/Σ(1/s_i)²)。"]},{"id":"p-c1b-10","title":"间接测量的误差传递","key":true,"source":"课件 p039–p041","items":["2. 间接测量误差的计算：间接测量（计算值）误差不仅与直接测量参数的测量误差有关，而且还和两者之间的函数关系有关。","设被测量为 y，其关联的直接测量量为 x, z, w, …，它们之间的函数关系为 y = f(x, z, w, …)。","按泰勒级数展开、化简得到间接测量误差的一般表达式，即间接测量的误差传递式 Δy = (∂y/∂x)Δx + (∂y/∂z)Δz + (∂y/∂w)Δw + …。","间接测量量的标准误差 σ_y² = (∂y/∂x)²σ_x² + (∂y/∂z)²σ_z² + (∂y/∂w)²σ_w² + …，式中 σ_x, σ_w, σ_z… 为各直接测量量的标准误差。","间接测量量的极限误差 (Δ_lim)_y = ±3σ_y；间接测量量的最佳值（平均值）ȳ = f(x̄, z̄, w̄ …)。","间接测量量的标准误差 S_y = √((∂y/∂x)²S_x² + (∂y/∂z)²S_z² + (∂y/∂w)²S_w² + …)；间接测量量的极限误差 (λ_lim)_y = ±3S_y。","间接测量量的相对误差 (δ_lim)_y = (λ_lim)_y/L_y = √((δ_lim)_x² + (δ_lim)_z² + (δ_lim)_w² + …)。","式中 S_x, S_z, S_w… 和 (δ_lim)_x, (δ_lim)_z, (δ_lim)_w… 分别为直接测量量 x, z, w… 的算术平均值标准误差和相对误差。"]},{"id":"p-c1b-11","title":"有效数字表达与计算法则","key":true,"source":"课件 p042–p044","items":["测试数据处理的根本目的是为了便于从测量结果中挖掘有意义的信息，包括被测对象的基本属性、变化规律等等，涉及数据的误差分析与计算、有效数字表达与计算、函数拟合与图表表示等等。","①记录测量值时，只保留一位欠准数字。","②除另有规定外，欠准数字表示末位有 ±1/10 个分度（刻度）单位的误差；如分度值为 1℃ 的温度计读数，其误差为 ±0.1℃。","③当有效数字位数确定后，其余数字应一律舍去；舍入原则是：若末位有效数字（欠准数字）后面的第一位数字大于 5，则须在欠准数字上加 1，小于 5 则舍去不计；等于 5 时，若前一位数字为奇数则加 1，为偶数则舍去不计。","④当第一位有效数字大于或等于 8 时，在计算有效数字位数时可多计一位。","⑤对多个测量数据进行加减运算时，其和或差的小数点后面保留的位数应与各测量数据中小数点后位数最少者相同。","⑥对多个测量数据进行乘除运算时，其积或商的有效数字位数的保留必须以各个数据中有效数字位数最少为准，例如 1.21 × 25.64 × 1.0578 = 32.8176 ≈ 32.8。","⑦对测量数据做乘方和开方运算时，所得结果的有效数字位数保留应与原始数据相同，例如 7.25² = 52.5625 ≈ 52.6。","⑧对测量数据进行对数运算时，所得结果小数点后的位数（不包括整数部分）应与原始数据的有效数字位数相同，例如计算 N = log 149 = 2.1372 ≈ 2.137。","⑨在混合运算中，按照四则混合运算的基本法则，先乘除后加减，每一步运算的结果都按照上述运算法则进行修约。","⑩在所有算式中的常数 π、e 等特定数值以及作为乘数的 √2、1/3 等的有效数字的位数，可以认为是不受限制的，可根据需要取舍。","⑪对四个数或超过四个数据进行平均值计算时，所得结果的有效数字可增加一位。","⑫表示分析方法的精密度和准确度时，有效数字通常只取一位，最多取两位。"]},{"id":"p-c1b-12","title":"测量数据的图示法要点","key":true,"source":"课件 p044–p045","items":["2. 测量数据的图示法：所谓图示法就是将因变量和自变量的测量数据点描绘于选定的坐标系之中，并用曲线连接，使绘制的曲线能够明确地反映客观规律。","a. 坐标尺的选择：分度应使每个测量点的数据都能够迅速方便地读出，同时还必须考虑到测量数据的精度。","纵、横坐标既代表各自的变量，又有各自的量纲，因而两者可有各自的比例尺；所选坐标比例应使所绘制的曲线尽可能有近于 1 的变化斜率。","b. 曲线极值处理：极值或奇异点对试验分析及其结论有着十分重要的影响，当发现测量数据变化趋势出现明显改变时，应该在附近增加测量点的密度；绘制曲线时不能随意处理极值数据。","c. 图示法的其他若干技术问题：绘制的图形要丰满，能占满全幅坐标；对曲线进行光顺处理时，不必（一般也不可能）让曲线通过每一测量数据点，特别是上下限两个端点。","在不同试验条件下对某一被测量进行测量时，如果要将所有测量数据绘制在同一图上，可用不同线型（虚线、点划线、实线等）或用不同的描点图形（○、△、×…）来区别表示不同测量条件之所得。"]},{"id":"p-c1b-13","title":"一元多项式回归与最小二乘","key":true,"source":"课件 p046–p047","items":["3. 测量数据的函数拟合——回归分析：回归分析的主要任务是采用数理统计方法，从测量数据中寻求变量之间的关系，建立相应的数学表达式（也称拟合函数），并对表达式的可信度进行统计检验。","a. 一元多项式回归的最小二乘法：设 x 和 y 分别是自变量和应变量，两者之间的函数关系通常可以用一个 m 阶多项式来逼近，即 y = B_0 + B_1 x + B_2 x² + … + B_m x^m。","式中 B_0, B_1, B_2, …, B_m 为待定常数或称回归系数；根据最小二乘法原理，各待定系数取最佳值时各剩余偏差平方和为最小值，即 Σd_i² = d_1² + d_2² + … + d_n² 为最小值。","Σd_i² 为待定系数 B_0, B_1, B_2, …, B_m 的函数；Σd_i² 取最小值的条件是其关于待定系数的一阶微分等于零，二阶微分为正值。","令 ∂Σd_i²/∂B_0 = 0、∂Σd_i²/∂B_1 = 0、…、∂Σd_i²/∂B_m = 0，将以上各式均除以 −2 并整理，可得到 m + 1 个方程。","得到的方程组即正态方程，如 nB_0 + B_1Σx_i + B_2Σx_i² + … + B_mΣx_i^m = Σy_i，B_0Σx_i + B_1Σx_i² + … + B_mΣx_i^(m+1) = Σy_i x_i 等。","求解正态方程可得 B_0, B_1, B_2, …, B_m，从而解出方程 y = B_0 + B_1 x + B_2 x² + … + B_m x^m。"]},{"id":"p-c1b-14","title":"一元线性回归与线性变换","key":true,"source":"课件 p048–p049","items":["b. 一元线性回归分析及其检验：一元线性回归方程可简化为 y = B_0 + B_1 x。","对于试验数据 (x_i, y_i) 是否具有良好的线性度应予以检验，这就是通常称作回归方程拟合程度的检验，它是采用相关系数 R 的大小来描述两个变量之间线性相关的密切程度。","其数学表达式为 R = Σ(x_i − x̄)(y_i − ȳ) / √(Σ(x_i − x̄)² Σ(y_i − ȳ)²)，即 R = S_xy/√(S_xx·S_yy)。","当 R = 1，则 y ∝ x；当 R = −1，则 y ∝ 1/x；当 R ≈ 0，则试验数据点沿回归直线两侧分散，也就是说回归直线毫无实用意义。","c. 一元线性回归分析的线性变换给出 7 组对应关系：y = a + b ln x → Y = a + b ln X，其中 Y = y、X = ln x。","y = a x^b → ln y = ln a + b ln x，其中 Y = ln y、X = ln x。","y = 1 − e^{−ax} → ln(1/(1 − y)) = ax，其中 Y = ln(1/(1 − y))、X = x。","y = a + b√x̄ → Y = a + bX̄，其中 Y = y、X = √x̄。","y = a + b/x → Y = a + b x，其中 Y = y、X = 1/x。","y = e^{(a+bx)} → ln y = a + b x，其中 Y = ln y、X = x。","e^y = a x^b → y = ln a + b ln x，其中 Y = y、X = ln x。"]}],"questions":[{"id":"q-c1a-1","kind":"计算","priority":1,"source":"课件例题","sourceDetail":"课件 p021 阿贝-赫梅特准则检验周期性系统误差","keyPoints":["算术平均值与偏差的计算","样本标准差 σ̂ 的计算","阿贝-赫梅特准则 |∑v_i v_{i+1}| > √(n−1)σ̂² 的判定"],"stem":"对某电阻两端电压等精度测量 10 次，其值分别为 28.03V、28.01V、27.98V、27.94V、27.96V、28.02V、28.00V、27.93V、27.95V、27.90V，利用阿贝-赫梅特准则检验测量中有无周期性系统误差。","given":["等精度测量 10 次的电压值：28.03V、28.01V、27.98V、27.94V、27.96V、28.02V、28.00V、27.93V、27.95V、27.90V","判断准则：当 |∑v_i v_{i+1}| > √(n−1)σ̂² 时存在周期性系统误差"],"ask":["计算算术平均值与标准差","计算相邻偏差乘积之和并判断测量结果是否存在周期性系统误差"],"steps":["第一步 计算算术平均值：X̄ = ∑X_i/n = 27.972","第二步 计算标准差：σ̂ = √(∑(X_i − X̄)²/(n−1)) = √(∑v_i²/(n−1)) = 0.042895","第三步 计算各测量值偏差：v₁ = 0.058，v₂ = 0.038，v₃ = 0.008，v₄ = −0.032，v₅ = −0.012，v₆ = 0.048，v₇ = 0.028，v₈ = −0.042，v₉ = −0.022，v₁₀ = −0.072","第四步 计算 |∑v_i v_{i+1}| = 4.736 × 10⁻³","第五步 与 √(n−1)σ̂² 比较，得 |∑v_i v_{i+1}| < √(n−1)σ̂²"],"result":"故可判断测量结果不存在周期性系统误差。","basis":"课件 p021（原文）"},{"id":"q-c1a-2","kind":"计算","priority":1,"source":"课件例题","sourceDetail":"课件 p025–p026 管道流体压力测量装置系统误差估算","keyPoints":["仪表基本误差由精度等级与量程算得","环境温度系统误差按每偏离 1℃ 为基本误差的 4% 修正","安装误差 Δp₃ = ±(Δhρg)","算术综合法合成总系统误差"],"stem":"某管道流体压力测量装置，已知压力表的精度为 0.5 级，量程为 0～600kPa，表盘刻度 100 格代表 200kPa，即分度值为 2kPa，测量时指示压力读数为 300kPa，读数时指针来回摆动 ±1 格，Δh ≤ 0.05m。压力表使用条件大多符合要求，仅环境温度值高于标准值 (20±3)℃ 10℃，该压力表温度修正值为每偏离 1℃ 时造成系统误差为仪表基本误差的 4%。试估算测量结果的系统误差。","given":["压力表精度 0.5 级，量程 0～600kPa，表盘刻度 100 格代表 200kPa（分度值 2kPa），指示压力读数 300kPa","读数时指针来回摆动 ±1 格，Δh ≤ 0.05m","环境温度高于标准值 (20±3)℃ 共 10℃，温度修正值为每偏离 1℃ 造成仪表基本误差的 4%","液体为水，密度 ρ = 1000kg/m³，重力加速度 g = 9.8m/s²"],"ask":["估算仪表基本误差、环境温度系统误差、安装误差与读数误差","用算术综合法求总系统误差及其引用相对误差"],"steps":["第一步 仪表基本误差：Δp₁ = ±(0.5% × 600)kPa = ±3kPa","第二步 环境温度造成的系统误差：Δp₂ = ±(4%Δp₁Δt) = ±(4% × 3 × 10)kPa = ±1.2kPa","第三步 安装误差：由实际压力值 p = p_i + gρh，得 Δp₃ = ±(Δhρg) = ±(0.05m × 1000kg/m³ × 9.8m/s²) = ±490N/m² = ±0.49kPa","第四步 读数误差：Δp₄ = ±2kPa","第五步 按算术综合法合成：Δp = ±∑Δp_i = ±(3 + 1.2 + 0.490 + 2)kPa = ±6.690kPa"],"result":"δ_p = Δp/p = ±6.690/300 = ±2.23%；课件 p026 末尾另列“若按几何综合法，则 Δp 为”待后续页给出。","basis":"课件 p025–p026（原文）"},{"id":"q-c1a-3","kind":"单选","priority":2,"source":"课件 p011–p013","sourceDetail":"课件 p011–p013（依据正文自拟）","keyPoints":["系统误差具有规律性且可能被消除或修正","随机误差必然存在，算术平均值趋于零","精密度反映随机误差，准确度反映系统误差","疏失误差无规则可寻，含疏失误差的结果只能舍弃"],"stem":"关于三类测量误差，下列说法正确的是（　）。","options":[{"k":"A","t":"系统误差由许多未知的或微小的因素引起，可通过对多次测量取平均来削弱"},{"k":"B","t":"疏失误差无规则可寻、无法修正，包含疏失误差的测量结果只能舍弃不用"},{"k":"C","t":"随机误差具有规律性，是可能被消除或修正的"},{"k":"D","t":"精密度体现系统误差的大小，准确度是随机误差的反映"}],"answer":"B","why":["A ✗ 由许多未知或微小因素引起、取平均后趋于零的是随机误差；系统误差由具有规律性的、影响程度可以由确定的因素引起。","B ✓ 课件 p013 原文：疏失误差无规则可寻、无法修正，包含疏失误差的测量结果只能舍弃不用。","C ✗ 课件 p011 原文：系统误差是可能被消除或修正的；课件 p012 原文：随机误差必然存在于测量结果之中。","D ✗ 课件 p012 原文：精密度是随机误差大小的反映，准确度体现的是系统误差的大小。"],"basis":"课件 p011–p013（原文）","answerNote":"答案由课件 p011–p013 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-c1b-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p033（单选题，1 分）","keyPoints":["莱特（3s）准则判据 |x_i − x̄| > 3σ̂","超限坏值需剔除，剔除后重新计算平均值与标准差并再次检验","n ≤ 10 时莱依特准则不再适用"],"stem":"某组 20 次等精度测量已修正系统误差，随机误差服从正态分布。已知平均值为 100.0 kPa，标准差估计值为 0.2 kPa，其中一次测量值为 100.8 kPa。按照莱特（3s）准则，应如何处理（　）？","options":[{"k":"A","t":"保留，因为该数据与平均值的相对偏差不足 1%"},{"k":"B","t":"直接将该数据改为平均值 100.0 kPa"},{"k":"C","t":"剔除该数据，重新计算平均值和标准差，并再次检验"},{"k":"D","t":"剔除该数据后，继续使用原平均值和标准差完成后续检验"}],"answer":"C","why":["A ✗ 莱特准则不是以相对偏差大小作为判据，课件 p028 的判据是 |V_i| = |x_i − x̄| > 3σ̂；本题偏差 |100.8 − 100.0| = 0.8 kPa 已大于 3σ̂ = 3 × 0.2 = 0.6 kPa。","B ✗ 课件 p028 原文要求对判为坏值的数据予以剔除，把实测值改写为平均值会人为掩盖该次测量的疏失误差。","C ✓ 课件 p028 原文：认为 x_i 为坏值，需要予以剔除；且剔除值 x_i 后，需要重新对剩余的数据进行筛选，即重新计算算术平均值 x̄ 与标准误差 σ̂，并再次检验有无坏值。本题 0.8 kPa > 0.6 kPa，故应剔除并重新计算与检验。","D ✗ 课件 p028 原文明确要求剔除后重新计算 x̄ 与 σ̂ 再检验，不能沿用原来的平均值和标准差，因此“继续使用原平均值和标准差”错误。"],"basis":"课件 p033 / 课件 p028（原文）"},{"id":"q-c1b-2","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p050（单选题，1 分）","keyPoints":["最小二乘法原理：剩余偏差平方和为最小值","Σd_i² = d_1² + d_2² + … + d_n² 取最小","残差之和最小会因正负抵消而失去意义"],"stem":"利用压力与传感器输出电压的标定数据，拟合直线（U = a + bp）。最小二乘法确定（a、b）的依据是（　）。","options":[{"k":"A","t":"使直线通过全部测量点"},{"k":"B","t":"使所有测量点的残差之和最小"},{"k":"C","t":"使最大残差的绝对值最小"},{"k":"D","t":"使所有测量点的残差平方和最小"}],"answer":"D","why":["A ✗ 拟合直线一般不可能通过全部测量点，课件 p050 的选项也不构成最小二乘的依据。","B ✗ 残差之和最小时正负残差会相互抵消，课件 p046 的最小二乘法原理要求的是剩余偏差的平方和为最小值。","C ✗ 使最大残差绝对值最小属于另一种拟合准则，与课件 p046 所述最小二乘原理不符。","D ✓ 课件 p046 原文：根据最小二乘法原理，各待定系数取最佳值时各剩余偏差平方和为最小值，即 Σd_i² = d_1² + d_2² + … + d_n² 为最小值。"],"basis":"课件 p050 / 课件 p046（原文）"},{"id":"q-c1b-3","kind":"例题","priority":1,"source":"课件例题","sourceDetail":"课件 p035（1.5 测量误差的计算 · 例）","keyPoints":["单次测量最大相对误差 δ_max = δ_e · A/A_m","满刻度读数 A 与读数 A_m 之比放大误差","被测量量值越小，相对误差越大"],"stem":"某一离心式转速表满刻度读数为 2000 r/min，精度级为 1 级。试求用此转速表测量转速，当指针值为 200 r/min 与 1500 r/min 时，可能出现的最大相对误差。","given":["转速表满刻度读数 A = 2000 r/min","仪器精度等级 δ_e = 1 级，即 ±1%","指针值（读数）A_m 分别为 200 r/min 与 1500 r/min"],"ask":["指针值为 200 r/min 时可能出现的最大相对误差 δ_max","指针值为 1500 r/min 时可能出现的最大相对误差 δ_max"],"steps":["第一步 写出单次测量最大相对误差估算式：δ_max = δ_e · A/A_m（课件 p034）。","第二步 代入 A_m = 200 r/min：δ_max = δ_e · A/A_m = (±1%) × 2000/200 = ±10%。","第三步 代入 A_m = 1500 r/min：δ_max = δ_e · A/A_m = (±1%) × 2000/1500 = ±1.33%。","第四步 比较两个结果并得出结论：被测量量值越小，其相对误差越大。"],"result":"指针值为 200 r/min 时最大相对误差为 ±10%；指针值为 1500 r/min 时为 ±1.33%。可见采用确定量程和精度等级的仪器进行测量时，被测量量值越小，其相对误差越大；因此选择测量仪器的量程时，需要对被测量的量值范围做预估，尽可能使测量值接近于仪器的满刻度。","basis":"课件 p035（原文）"},{"id":"q-c1b-4","kind":"计算","priority":1,"source":"课件例题","sourceDetail":"课件 p027（1.3 系统误差分析与处理 · 算例）","keyPoints":["方和根综合：Δp = ±√(ΣΔp_i²)","各系统误差项 3、1.2、0.490、2（kPa）","相对误差 δ_p = Δp/p"],"stem":"已知某项测量的各系统误差项 Δp_i 分别为 3、1.2、0.490、2（kPa），被测量 p = 300 kPa，求按方和根法综合得到的总系统误差 Δp 与相对误差 δ_p。","given":["各系统误差项 Δp_i 分别为 3、1.2、0.490、2（kPa）","被测量 p = 300（kPa）"],"ask":["按方和根法综合得到的总系统误差 Δp","测量结果的相对误差 δ_p"],"steps":["第一步 按方和根法合成各项系统误差：Δp = ±√(3² + 1.2² + 0.490² + 2²)。","第二步 计算得 Δp = ±3.831 kPa。","第三步 求相对误差：δ_p = Δp/p = ±3.831/300 = ±1.27%。","第四步 判定：此例中，因系统误差项数不多，为了安全起见可采用算术综合法的计算值。"],"result":"Δp = ±3.831 kPa，δ_p = ±1.27%；此例中因系统误差项数不多，为了安全起见可采用算术综合法的计算值。","basis":"课件 p027（原文）"},{"id":"q-c1b-5","kind":"简答","priority":1,"source":"课件题目","sourceDetail":"课件 p051（思考题 3）","keyPoints":["等精度测量与非等精度测量的含义","“权”值与标准误差的平方成反比","加权算术平均值 x̄_m = ΣP_i x̄_i / ΣP_i"],"stem":"什么叫做等精度测量和非等精度测量，为什么在非等精度测量中引入“权”的概念计算更为合理？","given":["课件 p038 中“权”的定义：权值大小与测量的标准误差密切相关","各组测量结果算术平均值的标准误差分别为 s_1, s_2, …, s_n","“权”取 P_1 = η/s_1², P_2 = η/s_2², …, P_i = η/s_i², …, P_n = η/s_n²，η 为任意选取的常数"],"ask":["说明等精度测量与非等精度测量的含义及区别","说明非等精度测量中引入“权”的概念计算更为合理的理由"],"steps":["第一步 说明等精度测量是对某一被测量进行 m 次重复测量、各次测量精度相同的测量；非等精度测量是对某一被测量进行一系列（n 组）测量，而各组的测量精度不尽相同。","第二步 引用课件 p038 原文：“权”值的大小与测量的标准误差密切相关，标准差越小，说明相应的测量结果越可靠，对应的“权”值也就越大，“权”值与标准误差的平方成反比。","第三步 写出“权”的取值 P_1 = η/s_1², P_2 = η/s_2², …, P_i = η/s_i², …, P_n = η/s_n²（η 为任意选取的常数），标准差小的组获得更大的权。","第四步 用测量值的加权算术平均值 x̄_m = ΣP_i x̄_i / ΣP_i 作为被测量真值 A 的最佳估计值，式中 x̄_i 为各组测量值的算术平均值。"],"result":"非等精度测量中各组的测量精度不尽相同，若直接取算术平均则同等地对待精度不同的数据；按“权”加权后，标准差小的测量结果获得更大的权，所得加权算术平均值 x̄_m 作为真值 A 的最佳估计值更为合理。","basis":"课件 p051 / 课件 p038（原文）"},{"id":"q-c1b-6","kind":"计算","priority":1,"source":"课件题目","sourceDetail":"课件 p051（思考题 4）","keyPoints":["精度等级 δ_e 为仪器满刻度相对误差限","δ_max = δ_e · A/A_m","量程 20 MPa、允许绝对误差 0.01 MPa"],"stem":"某压力表量程为 20 MPa，测量值绝对误差不允许超过 0.01 MPa，问该压力表的精度等级是多少？","given":["压力表量程（满刻度读数）A = 20 MPa","测量值绝对误差不允许超过 0.01 MPa"],"ask":["该压力表的精度等级 δ_e"],"steps":["第一步 由课件 p034 的 δ_max = δ_e · A/A_m 可知 δ_e 即仪器精度等级，在接近满刻度处 A/A_m 趋于 1，绝对误差允许值与量程之比即为所需精度等级。","第二步 代入数值：δ_e = 0.01/20 × 100% = 0.05%。","第三步 按精度等级取值给出结论：该压力表的精度等级为 0.05 级。"],"result":"δ_e = 0.01/20 × 100% = 0.05%，该压力表的精度等级为 0.05 级。","basis":"课件 p051（思考题原文）；算式依据课件 p034 的 δ_max = δ_e · A/A_m，课件未给答案"}],"images":{"1":{"w":"img/test-ch1/p001.webp","j":"img/test-ch1/p001.jpg"},"2":{"w":"img/test-ch1/p002.webp","j":"img/test-ch1/p002.jpg"},"3":{"w":"img/test-ch1/p003.webp","j":"img/test-ch1/p003.jpg"},"4":{"w":"img/test-ch1/p004.webp","j":"img/test-ch1/p004.jpg"},"5":{"w":"img/test-ch1/p005.webp","j":"img/test-ch1/p005.jpg"},"6":{"w":"img/test-ch1/p006.webp","j":"img/test-ch1/p006.jpg"},"7":{"w":"img/test-ch1/p007.webp","j":"img/test-ch1/p007.jpg"},"8":{"w":"img/test-ch1/p008.webp","j":"img/test-ch1/p008.jpg"},"9":{"w":"img/test-ch1/p009.webp","j":"img/test-ch1/p009.jpg"},"10":{"w":"img/test-ch1/p010.webp","j":"img/test-ch1/p010.jpg"},"11":{"w":"img/test-ch1/p011.webp","j":"img/test-ch1/p011.jpg"},"12":{"w":"img/test-ch1/p012.webp","j":"img/test-ch1/p012.jpg"},"13":{"w":"img/test-ch1/p013.webp","j":"img/test-ch1/p013.jpg"},"14":{"w":"img/test-ch1/p014.webp","j":"img/test-ch1/p014.jpg"},"15":{"w":"img/test-ch1/p015.webp","j":"img/test-ch1/p01
