/boiler-ch6/p041.jpg"},"42":{"w":"img/boiler-ch6/p042.webp","j":"img/boiler-ch6/p042.jpg"},"43":{"w":"img/boiler-ch6/p043.webp","j":"img/boiler-ch6/p043.jpg"},"45":{"w":"img/boiler-ch6/p045.webp","j":"img/boiler-ch6/p045.jpg"},"46":{"w":"img/boiler-ch6/p046.webp","j":"img/boiler-ch6/p046.jpg"},"47":{"w":"img/boiler-ch6/p047.webp","j":"img/boiler-ch6/p047.jpg"}}},{"id":"boiler-ch7","name":"第七章 省煤器和空气预热器","subtitle":"尾部受热面作用 · 省煤器类型/布置/支吊/防护 · 管式空预器 · 回转式空预器与漏风密封","status":"在读","overview":"本章讲尾部受热面（省煤器与空气预热器）的作用与三大运行问题，然后分别讲省煤器的类型结构、布置方式、支吊方式与启动防护；空气预热器分传热式（管式）与蓄热式（回转式），重点讲回转式的结构、三分仓、传热元件、漏风与密封系统。","mindmap":{"label":"第七章 省煤器和空气预热器","children":[{"label":"第一节 尾部受热面的作用和工作特点","children":[{"label":"尾部受热面定义（省煤器＋空气预热器）"},{"label":"省煤器的主要作用（3 条）"},{"label":"空气预热器的主要作用（2 条）"},{"label":"空气预热器分类：传热式（管式）/ 蓄热式（再生式、回转式）"},{"label":"低温受热面三大问题：腐蚀、积灰、磨损"}]},{"label":"第二节 省煤器","children":[{"label":"一、省煤器的类型及结构特点","children":[{"label":"钢管省煤器优点 / 缺点"},{"label":"按出口参数：沸腾式（中压）/ 非沸腾式（高压）"},{"label":"按结构形式：光管式 / 鳍片式 / 膜片式 / 螺旋肋片管式"},{"label":"按管子排列方式：错列 / 顺列"}]},{"label":"二、省煤器的布置方式（卧式逆流；垂直、平行前墙 3 种）","children":[]},{"label":"三、省煤器的支吊方式（支承 / 悬吊）","children":[]},{"label":"四、省煤器的启动防护（两种再循环管）","children":[]}]},{"label":"第三节 管式空气预热器","children":[{"label":"图7-9 管式空气预热器布置方式（a–e）"}]},{"label":"第四节 回转式空气预热器","children":[{"label":"工作原理：蓄热式（烟气/空气交替流过受热面）"},{"label":"受热面回转式＝容克式 Ljungström；风罩回转式＝罗特米勒式 Rothemühle"},{"label":"二分仓式 / 三分仓式"},{"label":"结构与工作过程（转子约50%烟气区、约30%空气区；1~4 周/分）"},{"label":"三分仓圆周角 165°/50°/100°，密封区各 15°"},{"label":"机壳（上梁/下梁/侧梁、扇形板、推力轴承与导向轴承）"},{"label":"转子（空心转轴/中心筒、模数仓格、每扇形块四个仓格）"},{"label":"传热元件（波纹板+定位板；热段/中间段/冷段；DU/CU/NF）"},{"label":"★漏风率与漏风影响（间隙漏风+携带漏风）"},{"label":"★密封系统：径向密封 / 轴向密封 / 环向密封（旁路密封+中心筒密封）"},{"label":"蘑菇状变形和径向密封间隙的调整"}]}]},"points":[{"id":"p-ch7a-1","title":"尾部受热面定义与两大部件的作用","key":true,"source":"课件 p002","items":["尾部受热面定义：**省煤器和空气预热器**称为尾部受热面。","省煤器的作用①：**吸收烟气热量以降低排烟温度**，提高锅炉效率，节省燃料；","省煤器的作用②：加热给水**取代部分蒸发受热面**，降低造价；","省煤器的作用③：在汽包锅炉中提高进入汽包的给水温度，**减少给水与汽包壁之间的温差**，有效降低汽包热应力。","空气预热器的作用①：**回收烟气热量以降低排烟温度**，提高锅炉效率；","空气预热器的作用②：空气预热，**利于制粉**，同时强化燃料在炉内的着火、燃烧及传热过程，提高锅炉效率。"]},{"id":"p-ch7a-2","title":"空气预热器按换热方式分类","key":true,"source":"课件 p003","items":["**1、传热式——管式空气预热器**：热量**连续地通过传热面**，由烟气传递给空气；","**2、蓄热式（再生式）——回转式空气预热器**：烟气和空气**交替通过受热面**，热量在金属受热面**先储存后释放**。","辨析判据：连续传热=管式（传热式）；交替通过、蓄热放热=回转式（蓄热/再生式）。"]},{"id":"p-ch7a-3","title":"低温受热面运行中突出的问题：腐蚀、积灰和磨损","key":true,"source":"课件 p003","items":["三大突出问题：**腐蚀、积灰和磨损**。","**低温腐蚀**：烟气中**水蒸气和硫酸蒸汽在壁面凝结**；","**低温积灰和飞灰磨损**：**夹带大量灰粒的烟气以一定速度冲刷**低温受热面。"]},{"id":"p-ch7a-4","title":"钢管省煤器的优点与缺点","key":false,"source":"课件 p004","items":["目前**大中容量锅炉广泛采用钢管省煤器**。","优点：**强度高、承受冲击、工作可靠、传热性能好、重量轻、体积小、价格低廉**；","缺点：**耐腐蚀性差**——现代锅炉严格处理锅炉给水。"]},{"id":"p-ch7a-5","title":"省煤器按出口参数分类：沸腾式 / 非沸腾式","key":true,"source":"课件 p004","items":["**沸腾式省煤器——中压**；","**非沸腾式省煤器——高压**。","易错点：按出口参数分的是**沸腾式/非沸腾式**；光管式/鳍片式属于**按结构形式**分类，两者不可混。"]},{"id":"p-ch7a-6","title":"省煤器按结构形式分类：光管 / 鳍片 / 膜片 / 螺旋肋片","key":true,"source":"课件 p004、课件 p005（图7-1）","items":["**光管式**；","**鳍片式**：扩展受热面，强化烟气侧传热；","**膜片式（简称膜式）**；","**螺旋肋片管式**。","图7-1 省煤器按结构形式：(a)光管；(b)鳍片管；(c)膜片管；(d)螺旋肋片管；（b）标注“扁钢”，（c）标注“连续扁钢膜片”，（d）标注“螺旋状分布横向肋片”。"]},{"id":"p-ch7a-7","title":"省煤器按管子排列方式：错列 vs 顺列（对比判据）","key":true,"source":"课件 p004","items":["**错列**：传热效果好、结构紧凑，并能**减少积灰**，但**磨损比顺列布置严重**、**吹灰较困难**；","**顺列**：容易吹灰、**磨损较轻**，但**积灰相对严重**。","一句话记：错列——传热好、少积灰、磨损重、吹灰难；顺列——易吹灰、磨损轻、积灰重。"]},{"id":"p-ch7a-8","title":"省煤器的布置方式（卧式逆流 + 蛇形管三种布置）","key":true,"source":"课件 p008","items":["**卧式、逆流布置（尾部烟道）**：既有利于**停炉排除积水，减轻停炉期间的腐蚀**，也有利于**改善传热，节约金属**。","按蛇形管在烟道的布置可分为：**垂直于或平行于锅炉前墙布置**。","1）蛇型管**垂直于前墙**布置：**水速最低**，但**每根管均会受到磨损**；","2）蛇型管**平行于前墙**布置：**水速最高**，**仅磨损几根管子**，**支吊不方便**；","3）蛇型管**平行于前墙布置、双侧进水**布置：**水速适中**，**支吊方便**。","布置判据：平行于前墙时“平行工作的管数少，水速高，流动阻力大”。"]},{"id":"p-ch7a-9","title":"省煤器的支吊方式：支承 / 悬吊","key":true,"source":"课件 p009、课件 p010、课件 p011","items":["**1、支承——只用于小型锅炉**；","**2、悬吊**：**集箱在烟道中**，**减少穿墙管的数目**，以**出水引出管为悬吊管**，**有利于热膨胀**，**大型电站锅炉普遍采用**。","图7-5 省煤器的支承结构简图：1—支持梁；2—管夹；3—蛇形管。","图7-3 1025t/h亚临界控制循环锅炉的省煤器：1—进口集箱；2—中间集箱；3—悬吊管。"]},{"id":"p-ch7a-10","title":"省煤器的启动防护（汽包锅炉）：两种再循环管","key":true,"source":"课件 p012","items":["用途：**用于锅炉启动过程中省煤器间断供水时的保护**。","方式1：在**省煤器进口与汽包下部或水冷壁供水包之间**装设**不受热的再循环管**；","方式2：在**省煤器出口与除氧器或疏水箱之间**装有**一根带阀门的再循环管**。","作用机理：**利用工质密度差形成再循环**；**阀门切换建立省煤器水循环**。","图7-6 省煤器的再循环管：1—自动调节阀；2—逆止阀；3—进口阀；4—再循环阀；5—再循环管。","图7-7 省煤器与除氧器之间的再循环管：1—自动调节阀；2—逆止阀；3—进口阀；4—省煤器；5—除氧器；6—再循环管；7—再循环阀；8—出口阀。"]},{"id":"p-ch7a-11","title":"管式空气预热器的布置方式（图7-9）","key":false,"source":"课件 p017（第三节 管式空气预热器）","items":["图7-9 管式空气预热器布置方式：(a) **单道单面进风**；(b) **多道单面进风**；(c) **多道双面进风**；(d) **多道单面双股平行进风**；(e) **多道多面进风**。","图中各方案上方均标“烟气”及向下箭头，烟气**自上而下**流过管内；空气侧箭头示水平进出、多道折返。","(e) 为大型立式多道多面进风布置，管内标数字1、2，并标注“进风”。"]},{"id":"p-ch7a-12","title":"管式空气预热器的结构外形与尺寸","key":false,"source":"课件 p018","items":["立式管式空气预热器：上部**管板布满管孔**（管端与管板连接），下部为**管束区**，四周为框架与墙板；","外形尺寸标注：**1665、2500、2500**；","流向：**烟气自上方进入、向下流过管内**，空气在管外横向冲刷并由侧上方流出。"]},{"id":"p-ch7b-1","title":"管式空气预热器（图7-8）","key":false,"source":"课件 p019","items":["**图7-8 管式空气预热器**：(a)空气预热器组纵剖面图；(b)管箱","件号：1—锅炉钢架；2—空气预热器管子；3—空气连通罩；4—导流板；5—热风道的连接法兰；6—上管板；7—预热器墙板；8—膨胀节；9—冷风道的连接法兰；10—下管板","**(b)管箱**：空气自上而下，烟气自上而下；箱体顶面为管板孔阵"]},{"id":"p-ch7b-2","title":"回转式空气预热器：原理、两种结构与优缺点","key":true,"source":"课件 p020（第四节 回转式空气预热器）","items":["**大型电站锅炉均采用回转式空气预热器**","**工作原理：蓄热式**，烟气和空气**交替地**流过受热面（蓄热元件）放热和吸热","**两种结构**：受热面回转式（用的较多）、风罩回转式","受热面回转式，又称**容克式(Ljungström-type)**：分**二分仓式**、**三分仓式**","风罩回转式，又称**罗特米勒式(Rothemühle-type)**","**优点**：尺寸小，重量轻，制造水平要求高；烟气侧腐蚀小，受热面温度高，允许有较大磨损量和腐蚀量，检修方便","**缺点**：**存在漏风**，结构复杂，耗电大"]},{"id":"p-ch7b-3","title":"回转式空气预热器的结构分区与工作过程","key":true,"source":"课件 p021（图7-11）","items":["**1、结构**：1）**可转动的圆筒型转子**，内置蓄热元件；2）**固定的圆筒型外壳**，**扇形顶板和底板**将转子流通截面分为两部分，分别与固定的烟气及空气通道相连接","3）转子截面分**三个区**：烟气流通部分约 **50％**、空气流通部分约为 **30％**、密封区为**其余部分**","**2、工作过程：每分钟旋转 1~4 周**；转子受热面顺序通过烟气侧吸热升温，通过空气侧放热降温，**旋转一周完成一个热交换过程**","图7-11 件号：1-上轴承；2—径向密封；3—上端板（上梁）；4—外壳；5—转子；6—旁路密封；7—下端板（下梁）；8—下轴承；9—主轴；10—传动装置；11—三叉梁；12—空气出口；13—烟气进口"]},{"id":"p-ch7b-4","title":"整体结构及部件（机壳、转子、受热面、密封、传动、轴承座）","key":false,"source":"课件 p022、p024","items":["**三分仓受热面回转式预热器由机壳、转子、受热面、密封装置、传动装置、轴承座及其润滑系统等组成**","四大部件：**机壳 / 转子 / 传热元件（受热面）/ 密封装置**","容克式预热器三维标注：周向密封、水冲洗、蓄热元件篮子、上支承梁、模数仓格、连接罩板、吹灰器、蓄热元件、径向密封片、轴向密封、转子、驱动装置、轴向密封板调整、冷段篮子调换门、热段、中间段、冷段、下支承梁、Gas(烟气)、Air(空气)","三分仓结构图标注：导向轴承、热端连接板、烟气、空气、中间梁、扇形板、转子模块、传动装置、主支座板、外壳板、副支座、导向端轴、转子、调换式子外壳板、篮式调换门、支承端轴、冷端连接板、支承轴承、烟气出口、空气进口"]},{"id":"p-ch7b-5","title":"二分仓 vs 三分仓（圆周角 165°/50°/100°，密封区各 15°）","key":true,"source":"课件 p023","items":["**空气通道分为一次风和二次风两个通道**","**烟气、一次风和二次风流通区所占的圆周角一般分别为 165°、50° 和 100°**，其余为**三个密封区，各占 15°**","与二分仓式相比，将**少量高压一次风**和**大量压力较低的二次风**分隔在两个空气区内进行加热","**使二次风可采用低压头风机，可降低送风机的电耗，并提高制粉系统运行的可靠性和经济性**","图：三分仓空气预热器示意图（热烟气进口、一次风出口、二次风出口、冷烟气出口、一次风进口、二次风进口、Rotation）"]},{"id":"p-ch7b-6","title":"机壳：封闭框架与密封、轴承布置","key":true,"source":"课件 p025、p026","items":["**上梁、下梁与主壳体板Ⅰ、Ⅱ连接，组成一个封闭的框架**，为支承预热器转动件的主要结构","**上梁和下梁分隔了烟气和空气**；上部侧梁和下部侧梁将空气**分隔成一次风和二次风**，分别形成烟气和一、二次风进、出口通道","**上、下梁及上、下侧梁装有扇形板**，**扇形板与转子径向密封片之间形成主要密封—径向密封**；主外壳板内侧的轴向密封装置与转子的轴向密封片组成**轴向密封结构**","**下梁中心放置推力轴承，支承全部转动重量**（图7-14 三分仓回转式预热器的外壳板）","**上梁中心放置导向轴承**"]},{"id":"p-ch7b-7","title":"转子：空心转轴、模数仓格、四个仓格","key":true,"source":"课件 p027","items":["**转子是装载传热元件（波纹板）并可以旋转的圆筒形部件**，包括**空心转轴（中心筒）、模数仓格、传热元件**","**模数分仓结构**：分扇形模数仓格，**每个扇形块分四个仓格**，其中放置**波纹板组合件**","**转子装设有周向密封**","转子图标注：上轴、固定销、热段蓄热元件、中心筒、下轴、定位销、链接轴、模数仓格、冷段蓄热元件；扇形仓格外径标注 **R6747**"]},{"id":"p-ch7b-8","title":"传热元件：波纹板+定位板，热段/中间段/冷段，DU/CU/NF","key":true,"source":"课件 p028（图7-17）","items":["**传热元件：波纹板和定位板，分热段、中间段、冷段三段**","**冷段传热元件为防腐和防堵灰型**","**图7-17 回转式预热器蓄热板结构**：（a）**波纹板带定位波纹板（DU型）**；(b)**波纹板带平板定位板（CU型）**；(c)**平板带平板定位板（NF型）**","断面图尺寸符号：t、a、c、s、30°；实物照片分别标 **DU** 与 **NF 6**"]},{"id":"p-ch7b-9","title":"★漏风：漏风率公式、5-6%、原因与影响","key":true,"source":"课件 p029","items":["**漏风量大是回转式空气预热器的主要缺点**；**先进空气预热器的漏风率为 5-6%**","**漏风率 = 漏入烟气侧的湿空气重量（kg/s）／进入空气预热器的湿烟气重量（kg/s）×100%**","★**漏风原因：主要是间隙漏风及携带漏风**","★**漏风的影响**：1、空预器传热能力下降，排烟温度升高；2、增加输送烟气和空气介质的阻力，增加送引风机的电耗；3、严重时甚至影响燃烧器和锅炉的正常运行"]},{"id":"p-ch7b-10","title":"密封系统三类：径向密封、轴向密封、环向密封","key":true,"source":"课件 p030","items":["**防治措施：设置密封系统**","**径向密封**：1、防止和减少沿转子上下端面通过**径向间隙**的漏风（空气到烟气、一次空气到二次空气）；2、密封系统由**扇形板的板面与转子的径向密封片**构成；**为适应蘑菇状变形，设置密封间隙调整装置**","**轴向密封**：1、防止和减少转子外围圆周和机壳之间通过**周向间隙**的漏风；2、密封系统由**轴向密封板和轴向密封片**构成，密封间隙可调整","**环向密封：旁路（周向或环向）密封和中心筒密封**：1、减少经转子与机壳之间空间旁路通过的烟气或空气量；2、由转子上、下端外圆周上设置的**圆弧形 T 型钢**与固定在机壳相应部位的**旁路密封片**组成"]},{"id":"p-ch7b-11","title":"密封装置结构：示意图、轴向和旁路密封、径向轴向双密封","key":false,"source":"课件 p031、p033、p034","items":["**回转式空气预热器密封系统示意图（p031）**标注：径向密封片、径向密封调整支点、扇形板、周向旁路密封、轴向密封调整、轴向密封板、轴向密封片","**轴向和旁路密封装置（p033）**：压板、旁路密封角钢、螺栓/螺母/垫圈、旁路密封片、**“T”字钢**、径向隔板、转子壳板、轴向密封片、转子转向、轴向密封板、径向隔板垫板、围带销、旁路密封、冷端；含 **A—A** 剖视放大","**径向、轴向双密封系统（p034）**：密封扇形板 / Radial Sealing Plate、径向密封片 / Radial Seals、轴向密封片 / Axial Seals、轴向密封板 / Axial Sealing Plate、Rotor Rotation","双密封压力标注：**70\" WG、35\" WG、0\" WG**；Leakage / Axial Seals；**空气侧 Air Side — 烟气侧 Gas Side**"]},{"id":"p-ch7b-12","title":"蘑菇状变形和径向密封间隙的调整","key":false,"source":"课件 p032","items":["**蘑菇状变形和径向密封间隙的调整**","上：**Boiler not operating / Heater static（锅炉未运行、预热器静止）**——转子端面与密封板之间存在间隙","下：**Boiler operating / Heater rotating（锅炉运行、预热器转动）**——转子受热后呈橙黄渐变，中心向上、外围向下（蘑菇状），密封板贴合转子端面，由螺杆式**调整装置**改变密封间隙","对应 p030 径向密封第 2 条：**为适应蘑菇状变形，设置密封间隙调整装置**"]}],"questions":[{"id":"bq-ch7a-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p016（1 分）","keyPoints":["省煤器","按出口参数分类","按结构形式分类","错列","顺列","卧式逆流布置"],"stem":"关于省煤器，下列说法正确的是","options":[{"k":"A","t":"省煤器按出口参数分为光管式和鳍片式"},{"k":"B","t":"错列布置传热效果好、结构紧凑，并能减少积灰，但磨损比顺列布置严重"},{"k":"C","t":"顺列布置磨损严重、吹灰困难，但积灰较轻"},{"k":"D","t":"卧式顺流布置有利于停炉排除积水，并改善传热"}],"answer":"B","why":["A ✗ 课件 p004 原文：“1、按出口参数分类：沸腾式省煤器（中压）、非沸腾式省煤器（高压）”；“2、按结构形式分类：光管式；鳍片式……”。故光管式、鳍片式是**按结构形式**分类，不是按出口参数分类，选项张冠李戴。","B ✓ 课件 p004 原文：“1）错列：传热效果好，结构紧凑，并能减少积灰，但磨损比顺列布置严重、吹灰较困难”，与选项文字一致。","C ✗ 课件 p004 原文：“2）顺列：容易吹灰、磨损较轻，但积灰相对严重。”选项把顺列说成“磨损严重、吹灰困难、积灰较轻”，三点全部说反。","D ✗ 课件 p008 原文：“卧式、逆流布置（尾部烟道）：既有利于停炉排除积水，减轻停炉期间的腐蚀，也有利于改善传热，节约金属。”应采用**逆流**而非“顺流”布置。"],"basis":"课件 p004（原文：错列/顺列对比、按出口参数与按结构形式分类）、课件 p008（原文：卧式、逆流布置）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]},{"id":"bq-ch7b-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p035（1 分）","keyPoints":["回转式空气预热器","三分仓","漏风率"],"stem":"关于回转式空气预热器，下列说法正确的是","options":[{"k":"A","t":"受热面回转式又称罗特米勒式"},{"k":"B","t":"三分仓式将空气通道分为一次风和二次风两个通道，可降低送风机电耗"},{"k":"C","t":"回转式空气预热器漏风率很小，因此结构简单、耗电少"},{"k":"D","t":"漏风率定义为漏入空气侧的湿烟气重量与进入空气预热器的湿空气重量之比"}],"answer":"B","why":["A ✗ 课件 p020 原文：“受热面回转式，又称**容克式(Ljungström-type)**”；“风罩回转式，又称**罗特米勒式(Rothemühle-type)**”——罗特米勒式对应风罩回转式，A 张冠李戴","B ✓ 课件 p023 原文：“空气通道分为一次风和二次风两个通道……使二次风可采用低压头风机，**可降低送风机的电耗**，并提高制粉系统运行的可靠性和经济性”——与 B 完全一致","C ✗ 课件 p029 原文：“**漏风量大是回转式空气预热器的主要缺点**。先进空气预热器的漏风率为 5-6%”；课件 p020 原文缺点：“**存在漏风，结构复杂，耗电大**”——C 的“漏风率很小”“结构简单、耗电少”均与原文相反","D ✗ 课件 p029 原文公式：“**漏风率 = 漏入烟气侧的湿空气重量（kg/s）／进入空气预热器的湿烟气重量（kg/s）×100%**”——D 把分子“湿空气”、分母“湿烟气”与侧别“烟气侧/空气侧”全部颠倒"],"basis":"课件 p020（两种结构命名）、p023（三分仓优点）、p029（漏风率公式与漏风率 5-6%）、p020（优缺点）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]}],"images":{"2":{"w":"img/boiler-ch7/p002.webp","j":"img/boiler-ch7/p002.jpg"},"3":{"w":"img/boiler-ch7/p003.webp","j":"img/boiler-ch7/p003.jpg"},"4":{"w":"img/boiler-ch7/p004.webp","j":"img/boiler-ch7/p004.jpg"},"5":{"w":"img/boiler-ch7/p005.webp","j":"img/boiler-ch7/p005.jpg"},"8":{"w":"img/boiler-ch7/p008.webp","j":"img/boiler-ch7/p008.jpg"},"9":{"w":"img/boiler-ch7/p009.webp","j":"img/boiler-ch7/p009.jpg"},"10":{"w":"img/boiler-ch7/p010.webp","j":"img/boiler-ch7/p010.jpg"},"11":{"w":"img/boiler-ch7/p011.webp","j":"img/boiler-ch7/p011.jpg"},"12":{"w":"img/boiler-ch7/p012.webp","j":"img/boiler-ch7/p012.jpg"},"16":{"w":"img/boiler-ch7/p016.webp","j":"img/boiler-ch7/p016.jpg"},"17":{"w":"img/boiler-ch7/p017.webp","j":"img/boiler-ch7/p017.jpg"},"18":{"w":"img/boiler-ch7/p018.webp","j":"img/boiler-ch7/p018.jpg"},"19":{"w":"img/boiler-ch7/p019.webp","j":"img/boiler-ch7/p019.jpg"},"20":{"w":"img/boiler-ch7/p020.webp","j":"img/boiler-ch7/p020.jpg"},"21":{"w":"img/boiler-ch7/p021.webp","j":"img/boiler-ch7/p021.jpg"},"22":{"w":"img/boiler-ch7/p022.webp","j":"img/boiler-ch7/p022.jpg"},"23":{"w":"img/boiler-ch7/p023.webp","j":"img/boiler-ch7/p023.jpg"},"24":{"w":"img/boiler-ch7/p024.webp","j":"img/boiler-ch7/p024.jpg"},"25":{"w":"img/boiler-ch7/p025.webp","j":"img/boiler-ch7/p025.jpg"},"26":{"w":"img/boiler-ch7/p026.webp","j":"img/boiler-ch7/p026.jpg"},"27":{"w":"img/boiler-ch7/p027.webp","j":"img/boiler-ch7/p027.jpg"},"28":{"w":"img/boiler-ch7/p028.webp","j":"img/boiler-ch7/p028.jpg"},"29":{"w":"img/boiler-ch7/p029.webp","j":"img/boiler-ch7/p029.jpg"},"30":{"w":"img/boiler-ch7/p030.webp","j":"img/boiler-ch7/p030.jpg"},"31":{"w":"img/boiler-ch7/p031.webp","j":"img/boiler-ch7/p031.jpg"},"32":{"w":"img/boiler-ch7/p032.webp","j":"img/boiler-ch7/p032.jpg"},"33":{"w":"img/boiler-ch7/p033.webp","j":"img/boiler-ch7/p033.jpg"},"34":{"w":"img/boiler-ch7/p034.webp","j":"img/boiler-ch7/p034.jpg"},"35":{"w":"img/boiler-ch7/p035.webp","j":"img/boiler-ch7/p035.jpg"}}},{"id":"boiler-ch8","name":"第八章 锅炉热平衡计算","subtitle":"从输入热量与各项热损失出发建立锅炉机组热平衡方程，用正、反平衡法求锅炉效率并据以计算燃料消耗量。","status":"在读","overview":"本章先给出锅炉机组热平衡的定义、目的与热平衡方程式 Q_f=Q_1+Q_2+Q_3+Q_4+Q_5+Q_6（或 100=q_1+q_2+q_3+q_4+q_5+q_6），随后逐项分析输入热量 Q_f 及排烟 q_2、化学未完全燃烧 q_3、机械未完全燃烧 q_4、散热 q_5、其它 q_6 的定义、计算公式、影响因素与降低措施；最后以正平衡法 η_b=Q_1/Q_f×100 与反平衡法 η_b=100−(q_2+q_3+q_4+q_5+q_6) 求效率，并由效率反求燃料消耗量 B 与计算燃料消耗量 B_cal。","mindmap":{"label":"第八章 锅炉热平衡计算","children":[{"label":"第一节 锅炉机组热平衡","children":[{"label":"热平衡定义与计算目的"},{"label":"热平衡方程式与各项热量含义"},{"label":"锅炉效率（正平衡/反平衡）"},{"label":"输入热量 Q_f"},{"label":"机械未完全燃烧热损失 Q_4"},{"label":"化学未完全燃烧热损失 Q_3"},{"label":"排烟热损失 Q_2"},{"label":"散热损失 Q_5 与保热系数 φ"},{"label":"其它热损失 Q_6"},{"label":"热效率和燃料消耗量 B、B_cal"}]},{"label":"第二节 锅炉机组热平衡测试","children":[{"label":"热平衡试验的目的"},{"label":"正平衡法"},{"label":"反平衡法"},{"label":"两种方法的使用场合"},{"label":"测量参数"}]}]},"points":[{"id":"p-ch8-1","title":"热平衡的定义与计算目的","key":true,"source":"课件 p002","items":["定义：锅炉机组的热平衡是指**输入锅炉机组的热量与锅炉机组输出热量之间的平衡**。","输入的热量：主要来源于**燃料燃烧放出的热量**。","输出的热量：1、**有效利用热**（用于生产蒸汽或热水）；2、**损失**（生产过程中的各项热量损失）。","★锅炉热平衡计算的目的：①计算**锅炉的效率**；②分析引起热量损失的**因素**和影响锅炉效率的因素、寻求**提高锅炉效率的途径**。"]},{"id":"p-ch8-2","title":"热平衡方程式与各项热量含义","key":true,"source":"课件 p003–p004","items":["热平衡方程式：**Q_f = Q_1 + Q_2 + Q_3 + Q_4 + Q_5 + Q_6（kJ/kg）**。","写成百分数形式：**100 = q_1 + q_2 + q_3 + q_4 + q_5 + q_6**。","Q_f——1kg 燃料带入炉内的热量，kJ/kg。","Q_1——锅炉有效利用热量；Q_2——排烟热损失；Q_3——化学未完全燃烧热损失；Q_4——机械未完全燃烧热损失；Q_5——散热损失；Q_6——其它热损失（单位均为 kJ/kg）。","图8-1 煤粉锅炉机组热平衡示意图：1kg 燃料带入炉内的热量 Q_f 沿炉膛→烟道逐项分配为 Q_1、Q_2、Q_3、Q_4（含飞灰 Q_4^fh、灰渣 Q_4^hz）、Q_5、Q_6^hz。"]},{"id":"p-ch8-3","title":"锅炉效率（正平衡与反平衡）","key":true,"source":"课件 p005、p022","items":["**正平衡**：有效利用热占输入热量的百分比，**η_b = q_1 = Q_1/Q_f × 100**。","**反平衡**：各项热损失占输入热量的百分比，**η_b = q_1 = 100 − (q_2 + q_3 + q_4 + q_5 + q_6)**。","正平衡法：在试验过程中直接测定锅炉机组的**有效利用热 Q_1、燃料消耗量 B、燃料的低位发热量 Q_ar,net**，再代入 η_b=Q_1/Q_f×100 计算。","反平衡法：通过试验测定出锅炉的**各项热损失 q_2、q_3、q_4、q_5、q_6**，再代入 η_b=100−(q_2+q_3+q_4+q_5+q_6) 计算。"]},{"id":"p-ch8-4","title":"输入热量 Q_f","key":true,"source":"课件 p006–p007","items":["对于燃煤或燃油锅炉，每 kg 燃料带入锅炉的热量：**Q_f = Q_net,ar + Q_ph + Q_ex + Q_at（kJ/kg）**。","Q_net,ar——燃料的**低位发热量**，kJ/kg。","Q_ph——燃料的**物理显热**，kJ/kg，**Q_ph = c_f·t_f**。","Q_ex——用锅炉以外的热量加热空气时空气带入锅炉的热量，kJ/kg，**Q_ex = βV⁰(c_2t_2 − c_1t_1)**。","Q_at——用蒸汽雾化燃料油时雾化蒸汽带入的热量，kJ/kg，**Q_at = G_at(i_at − 2510)**（G_at、i_at 为雾化蒸汽耗量及焓）。","对于燃煤锅炉，若燃料和空气**没有利用外界热量进行预热**，且燃煤水分 **M_ar < Q_net,ar/630**，则取 **Q_f = Q_net,ar**。"]},{"id":"p-ch8-5","title":"机械未完全燃烧热损失 Q_4：定义、构成与范围","key":true,"source":"课件 p008","items":["定义：部分固体燃料颗粒在炉内**未能燃尽就被排出炉外**而造成的热损失。","对于煤粉炉，Q_4 包括两部分：①排烟携带的飞灰中未燃尽的碳粒（**飞灰含碳**）造成；②锅炉冷灰斗排出的灰渣（炉渣）中未参加燃烧或未燃尽的碳粒（**炉渣含碳**）造成。","机械未完全燃烧热损失是燃煤锅炉**主要的热损失之一，通常仅次于排烟热损失**。","q_4 范围：**煤粉炉 0.5%~5%**（大型电站锅炉燃用烟煤时 **0.5~0.8%**）；**燃油、燃气锅炉 ≈ 0**。"]},{"id":"p-ch8-6","title":"机械未完全燃烧热损失 Q_4 的计算公式","key":true,"source":"课件 p010","items":["灰平衡：**B·A_ar/100 = G_fa(100 − C_fa)/100 + G_sl(100 − C_sl)/100**；其中 C_fa 为飞灰可燃物含量占飞灰百分数，C_sl 为灰渣可燃物含量。","**G_fa = α_fa·B·A_ar/(100 − C_fa)**，**G_sl = α_sl·B·A_ar/(100 − C_sl)**；α_fa 为**飞灰系数**、α_sl 为**排渣率**，且 **α_fa + α_sl = 1**。","通常认为灰渣和飞灰中可燃物颗粒为**纯碳**，**Q_c = 32700 kJ/kg**。","相对 1kg 燃料总的机械未完全燃烧热损失：**Q_4 = Q_4^fa + Q_4^sl = Q_c(G_fa^c + G_sl^c)/B = (Q_c/B)(C_fa/100·G_fa + C_sl/100·G_sl)**。","**Q_4 = 327A_ar[α_fa·C_fa/(100 − C_fa) + α_sl·C_sl/(100 − C_sl)]**。","**q_4 = Q_4/Q_f × 100（%）**。"]},{"id":"p-ch8-7","title":"机械未完全燃烧损失的影响因素与降低措施","key":true,"source":"课件 p011","items":["★影响因素：**燃料特性**（挥发分、灰分）；**燃烧方式**；**炉膛结构**（炉内停留时间等）；**运行工况**（煤粉细度、过量空气系数等）。","★降低 q_4 的主要措施：①**改善煤粉细度**；②**延长煤粉在炉内的停留时间**；③**适当大的过量空气系数**。"]},{"id":"p-ch8-8","title":"化学未完全燃烧热损失 Q_3","key":true,"source":"课件 p012–p013","items":["定义：锅炉排烟中**残留的可燃气体**如 **CO、H_2、CH_4 和重碳氢化合物 C_mH_n** 等未放出其燃烧热而造成的热损失。","q_3 范围：**煤粉炉中一般不超过 0.5%**。","通用计算式：**Q_3 = V_dg(126.4CO + 108H_2 + 358.2CH_4)(1 − q_4/100)，kJ/kg**；V_dg 为干烟气容积，CO、H_2、CH_4 为**容积份额比例**。","燃用固体燃料时气体未完全燃烧产物只考虑一氧化碳，故 **Q_3 = 236(C_ar + 0.375S_ar)·CO/(RO_2 + CO)·(1 − q_4/100)，kJ/kg**。","**q_3 = Q_3/Q_f × 100（%）**。","★化学未完全燃烧损失的影响因素：**燃料性质**（挥发分含量）；**过量空气系数**（炉膛过量空气系数的大小和燃烧过程的组织方式直接影响炉内可燃气体与氧气的混合工况）；**炉膛结构**（停留时间）；**运行工况**。"]},{"id":"p-ch8-9","title":"排烟热损失 Q_2","key":true,"source":"课件 p014–p015","items":["定义：由于**排出锅炉时的烟气焓高于进入锅炉时的空气焓**而造成的热损失。","**Q_2 是锅炉热损失中最大的一项**，现代电厂锅炉 **q_2 范围为 5%~6%**。","排烟温度 **θ_exg 每增加 15~20℃，q_2 增加 1%**。","计算式：**Q_2 = [I_exg − α_exg V⁰(ct)_ca](1 − q_4/100)，kJ/kg**（方括号内为“排烟焓 − 冷空气焓”，α_exg 为**排烟过量空气系数**）。","**q_2 = Q_2/Q_f × 100（%）**。","影响因素：**排烟温度**（一般在 **110~150℃** 之间）；**燃料性质**（含硫量、水分，影响排烟容积 V_exg）；**过量空气系数和漏风系数**；**受热面结渣、积灰**；**燃烧最佳过量空气系数**。","漏风会增大排烟容积 V_exg，降低受热面烟气温度，降低换热量，**提高排烟温度 T_exg**。","图8-2 最佳过量空气系数：随 α″_1 增大，q_3、q_4 减小而 q_2 增大，**q_2+q_3+q_4 之和最小时对应的 α″_1 为最佳**；α″_1 过小则氧不够，过大则炉膛内停留时间太短、大颗粒增多。"]},{"id":"p-ch8-10","title":"散热损失 Q_5 与保热系数 φ","key":true,"source":"课件 p016–p017","items":["定义：由于锅炉炉墙、汽包、集箱、汽水管道、烟风管道等部件的温度高于周围环境温度，通过**自然对流和辐射**向周围所散失的热量。","影响因素：锅炉的**外表面积**；**表面温度**；**炉墙结构**；**保温层的隔热性和厚度**；**周围环境温度**。","散热损失随机组容量和负荷的变化：**容量增大，q_5 减小**（散热表面积/燃料消耗量减小）；**q_5 与锅炉运行负荷近似成反比**。","保热系数：计算时假定各段烟道的散热损失仅与该烟道中烟气传给受热面的热量成正比，**φ = 受热面传给工质的热量/烟气放热量 = 受热面传给工质的热量/(受热面传给工质的热量 + 烟道的散热量)**。","**1 − φ = 烟道的散热量/烟气放热量 = Q_5/(Q_1 + Q_5)**（Q_1 为有效利用热）。","**φ = 1 − q_5/(η_b + q_5)**。","大型电站锅炉的散热损失都很小，**q_5 ≈ 0.2%，保热系数 φ ≈ 0.998**。"]},{"id":"p-ch8-11","title":"其它热损失 Q_6","key":true,"source":"课件 p018","items":["定义：主要是指**灰渣带走的物理热损失**。","对固体燃料，从锅炉中排除的灰渣具有相当高的温度（约 **600~800℃**）而造成热量损失。","对于**层燃炉、沸腾炉或液态排渣炉**该项热损失较大，**必须予以考虑**。","对于**固态排渣煤粉炉，只有当燃料的 A_ar ≥ Q_net,ar/419 时才考虑**。"]},{"id":"p-ch8-12","title":"锅炉机组热效率和燃料消耗量","key":true,"source":"课件 p019","items":["锅炉机组有效利用热：**Q_1 = [D_gr(i″_sh − i_fw) + D_rh(i″_rh − i′_rh) + D_bl(i′ − i_fw)]/B，kJ/kg**；其中 D_gr 为过热蒸汽、D_rh 为再热蒸汽、D_bl 为排污水流量。","一般可根据 **Q_f、Q_1 和 B** 计算锅炉机组的热效率：**η_b = Q_1/Q_f × 100（%）**。","或根据 **Q_f、Q_1 和 η_b** 计算锅炉机组的燃料消耗量 **B**。","计算燃料消耗量：**B_cal = B(1 − q_4/100)**。","**燃料消耗量 B**：用于**燃料供应和制粉系统**的计算；**计算燃料消耗量 B_cal**：用于**空气量和烟气量**的计算。"]},{"id":"p-ch8-13","title":"热平衡试验的目的","key":false,"source":"课件 p021","items":["1、**确定锅炉的热效率 η_b**。","2、确定锅炉的**各项热损失**，并分析各项损失的原因和寻求降低热损失的方法。","3、确定不同工况下锅炉各项工作指标，如**过量空气系数、干烟气中 CO_2 容积百分数、排烟温度及过热蒸汽温度**等与锅炉负荷的关系等。"]},{"id":"p-ch8-14","title":"正、反平衡法的使用场合与测量参数","key":true,"source":"课件 p023–p024","items":["**设计时**：燃料消耗量未知，**均采用反平衡计算**，即预先确定各项损失后再求锅炉效率。","**运行时**：**大中型锅炉一般采用反平衡法**；**小型锅炉正、反平衡法均采用**。","正平衡法测量参数：过热蒸汽（D_sh、P_sh、t_sh）、给水（P_fw、t_fw、D_fw）、汽包压力和排污（P_d、D_bl）、再热蒸汽（D_rh、P′_rh、P″_rh、t′_rh、t″_rh）、燃料（B、Q_net,ar）。","反平衡法测量参数：烟气（RO_2、O_2、CO、θ_exg、α_exg）、冷空气（t_a）、灰渣（C_fa、C_sl）、Q_net,ar、燃料元素分析成分。"]}],"questions":[{"id":"bq-ch8-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p009（1 分）","keyPoints":["机械未完全燃烧热损失 q_4 范围","煤粉炉热损失数量级"],"stem":"煤粉炉中，机械未完全燃烧热损失的一般范围是","options":[{"k":"A","t":"0.5% ~ 5%"},{"k":"B","t":"5% ~ 6%"},{"k":"C","t":"10% ~ 15%"},{"k":"D","t":"约为0"}],"answer":"A","why":["A ✓ 课件 p008 原文“q_4 范围：煤粉炉 0.5%~5%（大型电站锅炉燃用烟煤时 0.5~0.8%）”，与本题选项完全一致。","B ✗ 5%~6% 是课件 p014 给出的现代电厂锅炉排烟热损失 q_2 的范围，不是 q_4。","C ✗ 课件本章未出现 10%~15% 这一数量级，机械未完全燃烧损失通常仅次于排烟损失，不可能达到 10% 以上。","D ✗ “约为 0”是课件 p008 对燃油、燃气锅炉 q_4 的描述，煤粉炉并非约为 0。"],"basis":"课件 p008（原文：q_4 范围：煤粉炉 0.5%~5%；燃油、燃气锅炉 ≈ 0）","answerNote":"课件未标答案（p009 选项圆圈无任何标注痕迹），本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]},{"id":"bq-ch8-2","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p020（1 分）","keyPoints":["排烟热损失 q_2 是最大项","各项热损失数量级比较"],"stem":"现代电厂锅炉热损失中最大的一项通常是","options":[{"k":"A","t":"化学未完全燃烧热损失"},{"k":"B","t":"排烟热损失"},{"k":"C","t":"机械未完全燃烧热损失"},{"k":"D","t":"散热损失"}],"answer":"B","why":["B ✓ 课件 p014 原文“锅炉热损失中最大的一项，现代电厂锅炉 q_2 范围为 5%~6%”，明确排烟热损失 q_2 最大。","A ✗ 课件 p012 给出煤粉炉 q_3 一般不超过 0.5%，是各项损失中最小的之一。","C ✗ 课件 p008 只说“机械未完全燃烧热损失是燃煤锅炉主要的热损失之一，通常仅次于排烟热损失”，即位居第二而非最大。","D ✗ 课件 p017 给出大型电站锅炉 q_5≈0.2%、保热系数 φ≈0.998，散热损失很小。"],"basis":"课件 p014（原文：锅炉热损失中最大的一项，现代电厂锅炉 q_2 范围为 5%~6%）","answerNote":"课件未标答案（p020 选项圆圈无任何标注痕迹），本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]},{"id":"bq-ch8-3","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p025（1 分）","keyPoints":["设计时用反平衡法","正/反平衡法适用场合","燃料消耗量未知"],"stem":"设计锅炉时，燃料消耗量未知，确定锅炉效率通常采用","options":[{"k":"A","t":"正平衡法"},{"k":"B","t":"反平衡法"},{"k":"C","t":"正、反平衡法都必须用"},{"k":"D","t":"不需要热平衡计算"}],"answer":"B","why":["B ✓ 课件 p023 原文“设计时：燃料消耗量未知，均采用反平衡计算。即预先确定各项损失后，再求锅炉效率”，与题干条件完全吻合。","A ✗ 正平衡法 η_b=Q_1/Q_f×100 需要直接测定燃料消耗量 B，而设计时 B 未知，无法使用。","C ✗ 课件 p023 只说明运行时大中型锅炉一般用反平衡法、小型锅炉正反平衡均采用，并未要求设计时两者都必须用。","D ✗ 课件 p002 已明确锅炉热平衡计算的目的之一就是计算锅炉效率，设计时必须做热平衡计算。"],"basis":"课件 p023（原文：设计时：燃料消耗量未知，均采用反平衡计算）","answerNote":"课件未标答案（p025 选项圆圈无任何标注痕迹），本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]}],"images":{"2":{"w":"img/boiler-ch8/p002.webp","j":"img/boiler-ch8/p002.jpg"},"3":{"w":"img/boiler-ch8/p003.webp","j":"img/boiler-ch8/p003.jpg"},"4":{"w":"img/boiler-ch8/p004.webp","j":"img/boiler-ch8/p004.jpg"},"5":{"w":"img/boiler-ch8/p005.webp","j":"img/boiler-ch8/p005.jpg"},"6":{"w":"img/boiler-ch8/p006.webp","j":"img/boiler-ch8/p006.jpg"},"7":{"w":"img/boiler-ch8/p007.webp","j":"img/boiler-ch8/p007.jpg"},"8":{"w":"img/boiler-ch8/p008.webp","j":"img/boiler-ch8/p008.jpg"},"9":{"w":"img/boiler-ch8/p009.webp","j":"img/boiler-ch8/p009.jpg"},"10":{"w":"img/boiler-ch8/p010.webp","j":"img/boiler-ch8/p010.jpg"},"11":{"w":"img/boiler-ch8/p011.webp","j":"img/boiler-ch8/p011.jpg"},"12":{"w":"img/boiler-ch8/p012.webp","j":"img/boiler-ch8/p012.jpg"},"13":{"w":"img/boiler-ch8/p013.webp","j":"img/boiler-ch8/p013.jpg"},"14":{"w":"img/boiler-ch8/p014.webp","j":"img/boiler-ch8/p014.jpg"},"15":{"w":"img/boiler-ch8/p015.webp","j":"img/boiler-ch8/p015.jpg"},"16":{"w":"img/boiler-ch8/p016.webp","j":"img/boiler-ch8/p016.jpg"},"17":{"w":"img/boiler-ch8/p017.webp","j":"img/boiler-ch8/p017.jpg"},"18":{"w":"img/boiler-ch8/p018.webp","j":"img/boiler-ch8/p018.jpg"},"19":{"w":"img/boiler-ch8/p019.webp","j":"img/boiler-ch8/p019.jpg"},"20":{"w":"img/boiler-ch8/p020.webp","j":"img/boiler-ch8/p020.jpg"},"21":{"w":"img/boiler-ch8/p021.webp","j":"img/boiler-ch8/p021.jpg"},"22":{"w":"img/boiler-ch8/p022.webp","j":"img/boiler-ch8/p022.jpg"},"23":{"w":"img/boiler-ch8/p023.webp","j":"img/boiler-ch8/p023.jpg"},"24":{"w":"img/boiler-ch8/p024.webp","j":"img/boiler-ch8/p024.jpg"},"25":{"w":"img/boiler-ch8/p025.webp","j":"img/boiler-ch8/p025.jpg"}}},{"id":"boiler-ch9","name":"第九章 炉内辐射传热计算","subtitle":"辐射基本概念 · 贝尔定律 · 火焰黑度 · 有效辐射 · 炉内传热计算（方法一/二/三）· 热负荷分布","status":"在读","overview":"本章先建立辐射传热基本概念（黑体 E_b=σ₀T⁴、灰体、贝尔定律、介质的吸收率与黑度、入射辐射 G 与有效辐射 J、两平行平面辐射传热），再讲炉内传热计算的任务、复杂性与八条简化假设；后半部分给出煤粉炉炉内传热工程算法：引入 (1/4)kR 修正、火焰综合黑度 ε_syn 与综合系数 C_syn、伯劳赫公式求火焰平均温度、理论燃烧温度 T_th、三种炉膛出口烟温计算方法与热负荷分布规律。","mindmap":{"label":"第九章 炉内辐射传热计算","children":[{"label":"第一节 炉内辐射传热的基本概念","children":[{"label":"物体的辐射：E_b=σ₀T⁴、E=εσ₀T⁴=εE_b，σ₀=5.67×10⁻¹¹ kW/(m²·K⁴)"},{"label":"介质的吸收率和黑度：贝尔定律 I_λ,s/I_λ,0=e^(-k_λ·S)，τ=k_λS，a=1-e^(-k_a·S)，ε=a"},{"label":"炉内火焰黑度：由三原子气体、灰分颗粒、焦炭颗粒三部分组成"},{"label":"入射辐射和有效辐射：G、J=εE_b+(1-ε)G"},{"label":"两平行平面之间的辐射传热：q_R=σ₀(T₁⁴-T₂⁴)/(1/ε₁+1/ε₂-1)"}]},{"label":"第二节 炉内辐射传热特点","children":[{"label":"基本任务：设计计算（定出口烟温求受热面）与校核计算（定受热面核算出口烟温）"},{"label":"复杂性：放热/吸热比例不同、烟气成分与介质浓度不同、辐射能力不同、多物体参与、燃烧与传热同时进行、并存对流传热"},{"label":"简化与假设（8条）：火焰当灰体、燃烧与辐射分开、平均温度替代真实温度、出口烟温作定性温度、略去对流、炉墙影响计入角系数、包围绕炉墙假想为等面积圆柱面、与水冷壁相切的假想柱面为火焰辐射面"}]},{"label":"第四节 煤粉锅炉炉内传热计算方法","children":[{"label":"炉内辐射交换热流密度修正：分母加 (1/4)kR，k=(1.25~1.30)k_a，煤粉炉 k≈1.28k_a"},{"label":"炉内辐射传热量：Q_R=q_R·F/B_cal，Q̇_R=σ₀F(T₁⁴-T₂⁴)/(1/ε_syn+1/ε₂-1)"},{"label":"火焰综合黑度 ε_syn 与综合系数 C_syn：1/ε_syn=0.32k_a R+1/ε₁"},{"label":"火焰平均温度 T₁：θ₁=T₁/T_th，伯劳赫理论近似公式，x_m≈x_B=h_B/h_f"},{"label":"理论燃烧温度 T_th：Q_f^ef、Q_a、烟气平均热容 VC_av"},{"label":"吸收减弱系数与火焰黑度：k_a=k_g·r+k_ash·μ_ash+k_cok·μ_cok，ε₁=1-e^(-k_a·S)"}]},{"label":"第五节 炉内辐射传热计算的有效系数法","children":[{"label":"热有效系数 ψ 与炉膛黑度 ε_f^syn"},{"label":"炉内传热计算公式与热平衡（Bo、θ₁、θ_f″）"},{"label":"炉膛出口烟气温度[方法一]：θ_f″=[Bo/(3(1−x_m)ε_f^syn+Bo)]^(1/3)"}]},{"label":"第六节 炉膛水冷壁结构特征（有效容积边界、F=ΣF_i、S=3.6V_f/F）","children":[]},{"label":"第七节 水冷壁热有效系数（ψ_i=xψ、ψ_c=βψ、ψ_av=Σψ_iF_i/F）","children":[]},{"label":"第八节 炉内热负荷的分布规律（q_av、q_i=η_i q_av、图9-8）","children":[]},{"label":"第九节 苏联1973年炉膛传热计算框架（方法二、方法三）","children":[{"label":"炉内介质温度分布系数 M"},{"label":"火焰综合黑度 ε_syn=ε₁/(0.32k_aRε₁+1)"},{"label":"炉膛传热计算的基本步骤（13 步，迭代判据 100℃）"},{"label":"本章小结（自身辐射/有效辐射、传热公式、理论燃烧温度、减弱系数与火焰黑度、炉膛黑度、热有效系数、出口烟温三公式）"}]}]},"points":[{"id":"p-ch9-1","title":"物体的自身辐射（黑体与灰体）","key":true,"source":"课件 p001","items":["物体的自身辐射是指**单位面积该物体在半球形范围内向各个方向所发射的各种波长能量的总和**。","黑体辐射：**E_b = σ₀T⁴**，单位 kW/m²。","灰体辐射：**E = εσ₀T⁴ = εE_b**，单位 kW/m²。","**T**——物体的绝对温度，K；**σ₀**——波尔兹曼常数（简称辐射常数），**σ₀ = 5.67×10⁻¹¹ kW/(m²·K⁴)**；**ε**——灰体的黑度。"]},{"id":"p-ch9-2","title":"气体辐射的分类与炉内烟气辐射特点","key":true,"source":"课件 p002","items":["气体按辐射能力分为两类：**透热气体**——无发射和吸收辐射能力的气体，如**空气、H₂、O₂、N₂** 等；**吸收性气体**——有发射和吸收辐射能力的气体，如 **O₃、H₂O、CO₂、SO₂、CO** 等。","炉内高温燃烧产物气体辐射的特点（**CO₂、H₂O**）：","1. 气体辐射**对波长有选择性**，CO₂、H₂O 各有**三个位于红外线光带的区间**具有辐射和吸收的本领。","2. 气体辐射在**整个容积中进行**，与气体在容器中的**分子数目、容器的形状和其容积大小**有关。","3. 炉内气体辐射介质**只考虑三原子气体**。"]},{"id":"p-ch9-3","title":"贝尔定律与光学厚度","key":true,"source":"课件 p003","items":["辐射能通过吸收性气体层，不断被气体吸收而削弱；削弱的程度取决于**辐射强度和气体分子数目**。","**贝尔定律**：光谱辐射强度呈**指数规律衰减**。辐射能穿过辐射层 S 后因被吸收的减弱程度——气体的光谱穿透比：**I_λ,s / I_λ,0 = e^(−k_λ·S)**。","**k_λ**——辐射介质的吸收减弱系数。","**τ = k_λ·S**——光学厚度（密度），或称**无量纲布格尔准则数**。","示意图（p003）读法：厚度为 S 的气体层内取微元 dx，入射光谱强度 I_λ,0 从左侧进入，经过距离 x 后强度降为 I_λ,x，箭头随穿透深度逐渐变粗，表示能量被逐层吸收。"]},{"id":"p-ch9-4","title":"炉内介质的吸收率与黑度","key":true,"source":"课件 p004","items":["炉内介质的吸收率：**a = 1 − e^(−k_a·S)**。","**k_a**——炉内辐射介质的吸收衰减系数，单位 **m⁻¹**；**S**——炉内辐射层有效厚度，单位 **m**。","对于**灰体**，介质的黑度**等于其吸收率**：**ε = a = 1 − e^(−k_a·S)**。","该式表明：辐射层越厚、吸收衰减系数越大，介质黑度越接近 1（越接近黑体）。"]},{"id":"p-ch9-5","title":"炉内火焰黑度的组成","key":true,"source":"课件 p005","items":["★ 计算火焰黑度或吸收率时，其减弱系数 **k_a** 及光学密度 **τ** 由**三原子气体、灰分颗粒和焦炭颗粒**三部分组成。","因此计算炉内辐射传热时**主要考虑烟气中三原子气体、灰分颗粒和焦炭颗粒**（火焰黑度是这三者共同的贡献）。"]},{"id":"p-ch9-6","title":"入射辐射 G 与有效辐射 J","key":true,"source":"课件 p007","items":["物体的**入射辐射 G**：半球范围内从各个方向以各种波长进入该物体单位面积的辐射能的总合，单位 kW/m²。","物体的**有效辐射**：包括物体的**自身辐射**和物体接受入射辐射后的**反射辐射**。","**J = εE_b + (1 − ε)G**，单位 kW/m²。","示意图读法：斜向下的箭头表示入射辐射 G 投射到表面；向上的两支箭头分别为反射辐射 **(1−ε)G** 和自身辐射 **E = εE_b**，二者合成离开表面的有效辐射 J。"]},{"id":"p-ch9-7","title":"两平行平面之间的辐射传热","key":true,"source":"课件 p008","items":["两物体之间辐射热交换热流：**q_R = σ₀(T₁⁴ − T₂⁴) / (1/ε₁ + 1/ε₂ − 1)**，单位 kW/m²。","**T₁、T₂**——高温和低温两个平面的绝对温度；**ε₁、ε₂**——两个平面的黑度。","其中 **1/ε₁ + 1/ε₂ − 1** 称为**系统黑度**。","注意：分母是**系统黑度**而非某单一平面黑度，黑度越小分母越大、换热量越小，符合物理直觉。"]},{"id":"p-ch9-8","title":"炉内传热计算的基本任务与复杂性","key":true,"source":"课件 p010~p011","items":["★ **设计计算**：根据**合理选定的炉膛出口烟温**，确定**炉内所需布置的受热面积**。","★ **校核计算**：根据**合理布置的受热面积**，核算**炉膛出口烟气温度是否合理**。","炉内传热计算的复杂性：① 炉内不同区域**放热量和吸热量的比例不同**，造成各处烟温高低不一；② 各区域**烟气成分不同**，各处辐射介质浓度不同；③ 各处高温介质的**辐射能力不同**；④ 参加辐射的物体有**火焰、烟气、水冷壁、炉墙**等，且炉墙对外散热；⑤ **燃烧和传热两个过程同时进行**，且燃烧是复杂的物理化学过程；⑥ 同时存在着**对流传热**。"]},{"id":"p-ch9-9","title":"炉内传热计算的简化与八条假设","key":true,"source":"课件 p012~p013","items":["1. 把火焰当作**灰体**；假设火焰黑度是**均匀的**。","2. 将**燃烧和辐射两个过程分开**：只有燃烧无传热时，燃烧产生的热量全部用来加热烟气，烟气所能达到的温度称为**理论燃烧温度**；只有传热无燃烧时，完全服从**辐射传热**的规律。","3. 采用**火焰的平均温度**代替火焰的真实温度。","4. 用**炉膛出口烟温**作为定性温度。","5. **略去对流传热**的影响。","6. **炉墙对辐射传热的影响放到角系数中**一并考虑，**略去炉墙散热**的影响（用保热系数表示）。","7. 包围炉膛有效容积的炉墙面，以**水冷壁中心线所包围的平面**——假定为**与原始面积相等的圆柱面**。","8. 与**水冷壁相切的假想圆柱面**，定义为**火焰辐射面**，即水冷壁接受火焰辐射的平面。","结论：**炉内辐射换热就近似为两个灰体之间的辐射换热**。"]},{"id":"p-ch9-10","title":"炉内辐射交换热流密度的修正（引入 1/4·kR）","key":true,"source":"课件 p014","items":["平行平面的基础式仍为 **q_R = σ₀(T₁⁴ − T₂⁴)/(1/ε₁ + 1/ε₂ − 1)**。","考虑**火焰辐射强度沿炉膛截面方向的减弱**（介质吸收和散射），炉内辐射的交换热流密度为：**q_R = σ₀(T₁⁴ − T₂⁴) / [ (1/4)kR + 1/ε₁ + 1/ε₂ − 1 ]**，单位 kW/m²。","**k**——总辐射减弱系数，**k = (1.25~1.30)k_a**，**煤粉炉近似取 k = 1.28k_a**；","**R**——炉膛的当量半径。","与平行平面公式相比，分母中**多出 (1/4)kR 一项**，正是气体介质沿程吸收造成火焰辐射减弱的表现。"]},{"id":"p-ch9-11","title":"炉内辐射传热量公式、火焰综合黑度 ε_syn 与综合系数 C_syn","key":true,"source":"课件 p015~p016","items":["炉内火焰和水冷壁之间的辐射传热量（**1 kg 计算燃料**计的炉内辐射传热量）：**Q_R = q_R·F / B_cal**，单位 kJ/kg。","**F**——炉内水冷壁的吸收表面积，m²；**B_cal**——锅炉的计算燃料消耗量，kg/s。","把 q_R 写成综合形式：**q_R = σ₀(T₁⁴ − T₂⁴)/(1/ε_syn + 1/ε₂ − 1) = C_syn·σ₀(T₁⁴ − T₂⁴)**，单位 kW/m²。","**1/ε_syn = 0.32k_a·R + 1/ε₁**。","定义 **ε_syn 为火焰综合黑度**，**C_syn 为炉内辐射热交换综合系数**。","按计算燃料量计的总辐射传热量：**Q̇_R = σ₀F(T₁⁴ − T₂⁴)/(1/ε_syn + 1/ε₂ − 1)**，单位 **kW**。","记忆要点：ε_syn 把火焰黑度 ε₁、介质吸收 0.32k_a·R 与水冷壁黑度 ε₂ 一并综合，是工程计算的核心中间量。"]},{"id":"p-ch9-12","title":"火焰平均温度 T₁ 与伯劳赫理论近似公式","key":true,"source":"课件 p017","items":["炉内火焰平均温度和炉膛出口烟温用与理论燃烧温度之间比值的**无量纲温度**表示：**θ₁ = T₁/T_th**，**θ_f″ = T_f″/T_th**。","**伯劳赫的理论近似公式**：**θ₁⁴ = (T₁/T_th)⁴ = 3(1 − x_m) / [ (T_th/T_f″) + (T_th/T_f″)² + (T_th/T_f″)³ ]**。","**x_m**——炉膛最高火焰温度位置相对高度；**x_B**——燃烧器布置相对高度；**h_f**——炉膛计算高度；**h_B**——燃烧器的布置高度。","**x_m ≈ x_B = h_B / h_f**。","燃烧器的布置高度加权平均值：**h_B = Σ n_i·B_i·h_B_i / Σ n_i·B_i**。"]},{"id":"p-ch9-13","title":"理论燃烧温度 T_th 与烟气平均热容 VC_av","key":true,"source":"课件 p018","items":["**理论燃烧温度**是在**绝热条件下**燃料燃烧所产生的热量可将燃烧产物加热达到的温度。","1 kg 燃料的炉内有效热（包括燃料的有效放热和随空气带入的热量）：**Q_f^ef = Q_f·(100 − q₃ − q₄ − q₆)/(100 − q₄) + Q_a**，单位 kJ/kg。","随空气带入的热量：**Q_a = (α_f″ − Δα_f − Δα_pcs)·I_ha⁰ + (Δα_f + Δα_pcs)·I_ca⁰**，单位 kJ/kg。","式中用到炉膛出口过量空气、炉膛漏风系数、制粉系统漏风系数。","引入**烟气平均热容**的概念计算理论燃烧温度：炉内烟气在**理论燃烧温度至炉膛出口温度区间内**的平均热容。","**Q_f^ef − I_f″ = VC_av·(T_th − T_f″)**，故 **VC_av = (Q_f^ef − I_f″)/(T_th − T_f″)**。"]},{"id":"p-ch9-14","title":"吸收减弱系数 k_a 与火焰黑度 ε₁ 的计算式","key":false,"source":"课件 p019","items":["计算炉内辐射传热量时，煤粉燃烧火焰的**吸收减弱系数和火焰黑度 ε₁**，由**三原子气体、灰分颗粒和焦炭颗粒三部分**组成。","对于炉膛在常压（**p ≈ 0.1 MPa**）下工作的煤粉炉，其计算式为：**k_a = k_g·r + k_ash·μ_ash + k_cok·μ_cok**。","**ε₁ = 1 − e^(−k_a·S)**。","式中 k_g、k_ash、k_cok 分别为三原子气体、灰分颗粒、焦炭颗粒的减弱系数，r 为三原子气体容积份额，μ_ash、μ_cok 分别为灰分与焦炭颗粒的无因次浓度。"]},{"id":"p-ch9b-1","title":"水冷壁灰污表面的壁温 T₂ 与黑度 ε₂","key":true,"source":"课件 p020","items":["五、水冷壁灰污表面的壁温 T₂ 和黑度 ε₂","考虑水冷壁管子外表面的灰污，与炉内火焰辐射热交换的水冷壁灰污表面温度 T₂","**T₂ = T_w + R_f q_R　（K）**：T_w 为管子外表面平均温度，R_f 为灰污热阻，q_R 为辐射热流","可通过灰污表面温度 T₂ 和水冷壁黑度 ε₂ 计算炉内火焰与水冷壁间的辐射传热量","也可以**采用经验方法简化计算**"]},{"id":"p-ch9b-2","title":"第五节 热有效系数 ψ 与炉膛黑度","key":true,"source":"课件 p022","items":["定义：水冷壁的**热有效系数 ψ** 表示火焰假想平面与水冷壁平面之间辐射热交换热流 q_R 占火焰有效辐射热流的份额","**q_R = ψ ε_f^syn σ₀ T₁⁴　（kW/m²）**","炉膛黑度与火焰综合黑度的关系：**ε_f^syn = ε_syn / [ε_syn + (1 − ε_syn)ψ]**","热有效系数与水冷壁黑度、火焰平均温度、炉膛黑度的关系：**ψ = ε₂ [ 1 − (1/ε_f^syn)(T₂/T₁)⁴ ]**","ε₂ —— 水冷壁黑度"]},{"id":"p-ch9b-3","title":"二、炉内传热计算公式与热平衡","key":true,"source":"课件 p023","items":["辐射传热量：**Q̇_R = ψ F ε_f^syn σ₀ T₁⁴　（kW）**","ε_f^syn = ε_syn / [ε_syn + (1 − ε_syn)ψ]；**1/ε_syn = 0.32 k_a R + 1/ε₁**","烟气放热量：**Q̇_f^re = φ B_cal (Q_f^ef − I_f″) = φ B_cal V̄C̄_av T_th (1 − T_f″/T_th)　（kW）**","热平衡：**炉内辐射传热量 = 炉内烟气放热量**","无量纲化：**θ₁⁴ = (Bo/ε_f^syn)(1 − θ_f″)**","**Bo = φ B_cal V̄C̄_av / (ψ F σ₀ T_th³)**；φ —— 保热系数；Bo —— 玻尔兹曼准则数"]},{"id":"p-ch9b-4","title":"三、炉膛出口烟气温度[方法一]及影响因素","key":true,"source":"课件 p024","items":["利用**伯劳赫**的近似公式表示无量纲火焰温度 θ₁ 和炉膛出口温度 θ_f″ 之间的关系，得到炉膛出口温度计算公式[方法一]","**θ_f″ = T_f″/T_th = [ Bo / (3(1 − x_m) ε_f^syn + Bo) ]^(1/3)**","x_m —— 炉膛火焰最高温度位置相对高度，近似取燃烧器布置相对高度 x_B","辅助关系：θ₁⁴ = (Bo/ε_f^syn)(1 − θ_f″)；**θ₁⁴ = (T₁/T_th)⁴ = 3(1 − x_m) / [ 1/θ_f″ + (1/θ_f″)² + (1/θ_f″)³ ]**","影响炉膛出口烟温的因素：**锅炉负荷（燃料量）、燃料特性、过量空气系数、炉膛结构（水冷壁面积）、受热面的灰污、燃烧器及其布置**"]},{"id":"p-ch9b-5","title":"第六节 炉膛有效容积边界与辐射层有效厚度","key":true,"source":"课件 p025–p026","items":["炉膛有效容积的边界：**水冷壁中心线所在的平面；炉膛出口（烟窗）的平面；冷灰斗高度中心点的平面**","图(a)(b) 为炉膛结构示意，标注 h₁、h₂、h₃、h₄、h_4-1、h₅、0.5h、h、w、r₁、a、β 等尺寸及燃烧器标高","水冷壁面积：**F = ΣF_i** —— 所有包围炉膛有效容积的各个平面面积之和","辐射层有效厚度：**S = 3.6 V_f / F**（V_f 为炉膛有效容积）"]},{"id":"p-ch9b-6","title":"第七节 水冷壁热有效系数","key":true,"source":"课件 p027","items":["煤粉炉水冷壁热有效系数（表9-3）：**吸收辐射热占炉膛辐射到该平面的比例**","炉膛水冷壁面积的平均热有效系数的计算方法：煤粉炉水冷壁热有效系数数值见**表9-3**","**非膜式水冷壁**应考虑水冷壁的角系数：**ψ_i = x ψ**","炉膛出口烟窗考虑屏的辐射吸收：**ψ_c = β ψ**","平均热有效系数：**ψ_av = Σ ψ_i F_i / F**"]},{"id":"p-ch9b-7","title":"第八节 炉内热负荷分布规律与局部吸热量","key":true,"source":"课件 p028–p029","items":["炉内水冷壁的总吸热量：**Q_R = Q_f^re = φ (Q_f^ef − I_f″)　（kJ/kg）**；**Q̇_f^re = φ B_cal (Q_f^ef − I_f″)　（kW）**","单位面积平均吸热量（即热负荷或热流密度）：**q_av = B_cal Q_f^re / F = Q̇_f^re / F　（kW/m²）**","Q_f^ef 为 1kg 燃料的炉内有效热（含热空气和漏风热量）","炉内热负荷沿炉膛**高度、宽度、深度**方向是不均匀的；确定某区段吸热量：① 根据试验值或经验数据确定该区域的热负荷不均匀系数 η_i；② 计算该区局部热负荷 **q_i = η_i q_av**，也可写为 **q_i = ψ_i ε_f^syn σ₀ T_i⁴　（kW/m²）**；③ 计算该区域的吸热量 **Q_i = q_i F_i / B_cal = η_i (F_i/F) Q_f^re　（kJ/kg）**","图9-8 沿炉膛高度的热负荷分布曲线：纵轴 η_h（0.2~1.8），横轴 X = h/h_l（0~1.0），图中标有**燃烧器轴心线**位置","**实线—无烟煤、贫煤和烟煤；虚线—褐煤**；曲线在 X≈0.35 附近达到峰值，实线峰值(≈1.5)高于虚线(≈1.3)，两端均趋于下降"]},{"id":"p-ch9b-8","title":"第九节 苏联1973年方法[方法二]及其准则方程式","key":true,"source":"课件 p031–p032","items":["方法二特点：**不考虑炉内火焰的辐射能在向水冷壁面传递过程中辐射强度因介质的吸收和散射性能导致的减弱**","采用**炉膛黑度（由火焰黑度 ε_f 计算）和热有效系数**作为计算参数","不单独计算炉膛火焰的平均温度，认为火焰平均温度（以无量纲温度表示）与表征炉膛热负荷的波尔兹曼准则数、炉膛黑度、炉内火焰最高温度位置和无量纲炉膛出口温度等有关，**根据试验数据确定炉膛出口温度的计算公式**","辐射传热量：**Q̇_R = ψ F ε_f σ₀ T₁⁴　（kW）**","炉膛黑度：**ε_f = ε₁ / [ ε₁ + (1 − ε₁)ψ ]　（9-65）**","烟气放热量：Q̇_f^re = φ B_cal (Q_f^ef − I_f″) = φ B_cal V̄C̄_av T_th (1 − T_f″/T_th)　（9-55）","热平衡：**θ₁⁴ = (Bo/ε_f)(1 − θ_f″)　（9-55a）**；**Bo = φ B_cal V̄C̄_av / (ψ_av F σ₀ T_th³)　（9-56）**","准则方程式：**θ_f″ / (1 − θ_f″) = (1/M)(Bo/ε_f)^0.6**；**θ_f″ = T_f″/T_th = 1 / [ 1 + M(ε_f/Bo)^0.6 ]　（9-66）**","**T_f″ = T_th / { M[ ε_f ψ_av F σ₀ T_th³ / (φ B_cal V̄C̄_av) ]^0.6 + 1 }　（K）**"]},{"id":"p-ch9b-9","title":"炉内介质温度分布系数 M","key":true,"source":"课件 p033","items":["M 是**表征炉内火焰最高温度相对位置的参数**","影响因素：**燃烧器的位置（及摆动角度）、燃料性质、燃烧方式**","**烟煤、褐煤：M = 0.59 − 0.5(x_B + Δx)**","**无烟煤、贫煤：M = 0.56 − 0.5(x_B + Δx)**","x_B 为燃烧器布置相对高度；x_b 由式（9-38）、（9-39）计算"]},{"id":"p-ch9b-10","title":"方法三 火焰黑度修正与综合黑度","key":true,"source":"课件 p034","items":["二、基于前苏联1973年炉膛传热计算框架的方法[方法三]：**通过对火焰黑度进行修正后进一步计算炉膛黑度，以考虑辐射沿射线行程的减弱**","辐射传热量（采用热有效系数）：**Q̇_R = ψ F ε_f^syn σ₀ T₁⁴　（kW）（9-55）**","炉膛黑度：**ε_f^syn = ε_syn / [ ε_syn + (1 − ε_syn)ψ ]　（9-53）**","**火焰综合黑度 ε_syn = ε₁ / (0.32 k_a R ε₁ + 1)　（9-33）**","炉膛出口温度计算公式仍保持1973年方法[方法二]的形式：**θ_f″ = T_f″/T_th = 1 / [ 1 + M(ε_f^syn/Bo)^0.6 ]　（9-67）**","**T_f″ = T_th / { M[ ε_f^syn ψ_av F σ₀ T_th³ / (φ B_cal V̄C̄_av) ]^0.6 + 1 }　（K）**"]},{"id":"p-ch9b-11","title":"炉膛传热计算的基本步骤（13 步）","key":true,"source":"课件 p035–p036","items":["已知：炉膛结构尺寸；求：炉膛的出口烟温","1. 由燃料计算求得烟气特性表和焓温表，由热平衡计算得到计算燃料量 **B_cal** 和保热系数 **φ**","2. 求炉膛受热面积 **F**、炉膛有效容积 **V_f**、燃烧器相对高度 **x_B** 和有效辐射层厚度 **S**","3. 根据水冷壁的结构、燃料性质、燃烧方式求热有效系数 **ψ_av**","4. 根据燃烧器结构特性求 **x_m ≈ x_B[方法一]**，或根据燃料特性和燃烧器结构求炉内介质的温度分布系数 **M[方法二、三]**","5. 求随同 1kg 燃料带入炉内的有效热量 **Q_f^ef** 和理论燃烧温度 **T_th**","6. 假设炉膛出口烟温 **T_f″**，由焓温表查烟气焓","7. 求平均热容","8. 求三原子气体的辐射减弱系数 **k_g r**、灰粒辐射减弱系数 **k_ash μ_ash**、焦炭颗粒辐射减弱系数 **k_cok μ_cok**","9. 求炉内介质的辐射减弱系数 **k_a**","10. 求火焰黑度 **ε_f[方法二]** 或综合火焰黑度 **ε_f[方法一、三]**","11. 求炉膛黑度 **ε_f[方法二]** 或 **ε_f^syn[方法一、三]**","12. 计算炉膛出口烟温 **T_f″**","13. 若计算与假定值之差**小于 100℃**，则计算结果符合要求，否则从第 6 步重新假设计算"]},{"id":"p-ch9b-12","title":"本章小结","key":true,"source":"课件 p037","items":["1. 物体的自身辐射和有效辐射。","2. 炉膛火焰对水冷壁受热面的传热公式。","3. 理论燃烧温度及其计算。","4. 煤粉火焰的辐射吸收减弱系数、火焰黑度（火焰综合黑度）及其计算。","5. 炉膛黑度意义。","6. 水冷壁热有效系数？","7. 炉膛出口烟气温度的计算方法（三个公式）。"]}],"questions":[{"id":"bq-ch9-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p006（1 分）","keyPoints":["吸收性气体","透热气体","气体辐射介质分类"],"stem":"下列气体中，属于吸收性气体（有发射和吸收辐射能力）的是：","options":[{"k":"A","t":"N₂"},{"k":"B","t":"O₂"},{"k":"C","t":"CO₂"},{"k":"D","t":"H₂"}],"answer":"C","why":["A ✗ N₂ 属于**透热气体**，课件 p002 明确把 N₂ 与空气、H₂、O₂ 并列为无发射和吸收辐射能力的气体。","B ✗ O₂ 同样属于**透热气体**，不具备发射和吸收辐射的能力。","C ✓ CO₂ 属于**吸收性气体**，课件 p002 明确列出 O₃、H₂O、CO₂、SO₂、CO 等为有发射和吸收辐射能力的气体，且炉内高温燃烧产物气体辐射的特点专讲 CO₂ 与 H₂O。","D ✗ H₂ 属于**透热气体**，与空气、O₂、N₂ 同类。"],"basis":"课件 p002（原文：\"透热气体：无发射和吸收辐射能力的气体；空气、H₂、O₂、N₂ 等\"；\"吸收性气体：有发射和吸收辐射能力的气体；O₃、H₂O、CO₂、SO₂、CO 等\"）","answerNote":"课件未标答案（选项前无勾选/高亮痕迹），本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]},{"id":"bq-ch9-2","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p009（1 分）","keyPoints":["黑体辐射","斯蒂芬-玻尔兹曼定律","E_b 与 T 的四次方关系"],"stem":"黑体辐射的总能量 E_b 与绝对温度 T 的关系是：","options":[{"k":"A","t":"E_b = σ₀T"},{"k":"B","t":"E_b = σ₀T²"},{"k":"C","t":"E_b = σ₀T⁴"},{"k":"D","t":"E_b = εσ₀T⁴"}],"answer":"C","why":["A ✗ 与温度一次方成正比，不符合四次方定律，量纲上也不成立。","B ✗ 与温度平方成正比，同样不符合课程给出的辐射公式。","C ✓ 课件 p001 原文给出**黑体辐射 E_b = σ₀T⁴**（单位 kW/m²），即黑体辐射总能量与绝对温度的四次方成正比。","D ✗ E = εσ₀T⁴ = εE_b 是**灰体**（实际物体）的自身辐射公式，多乘了黑度 ε；题目问的是黑体（ε = 1），故应选不带 ε 的 C。"],"basis":"课件 p001（原文：\"黑体辐射：E_b = σ₀T⁴ kW/m²\"；\"灰体辐射：E = εσ₀T⁴ = εE_b kW/m²\"；σ₀ = 5.67×10⁻¹¹ kW/(m²·K⁴)）","answerNote":"课件未标答案（选项前无勾选/高亮痕迹），本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]},{"id":"bq-ch9b-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p021（1 分）","keyPoints":["理论燃烧温度的定义","绝热燃烧条件"],"stem":"理论燃烧温度是在什么条件下燃料燃烧所产生的热量可将燃烧产物加热达到的温度","options":[{"k":"A","t":"有传热条件下"},{"k":"B","t":"绝热条件下"},{"k":"C","t":"有漏风条件下"},{"k":"D","t":"有对流换热条件下"}],"answer":"B","why":["A ✗ 有传热条件下，燃烧产物会把热量传给受热面，温度必然低于理论值，达不到理论燃烧温度。","B ✓ 理论燃烧温度的定义正是在**绝热（与外界无热交换）**条件下，燃料燃烧产生的热量全部用于加热燃烧产物所达到的温度，对应课件中 T_th 的含义。","C ✗ 有漏风条件会带入低温空气、增加烟气量，使燃烧产物温度降低，不是定义条件。","D ✗ 有对流换热条件下热量被带走，同样不是绝热条件，无法达到理论燃烧温度。"],"basis":"课件 p024（原文：求理论燃烧温度 T_th）；课件 p035（原文：求随同1kg燃料带入炉内的有效热量 Q_f^ef 和理论燃烧温度 T_th）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]},{"id":"bq-ch9b-2","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p030（1 分）","keyPoints":["影响炉膛出口烟温的因素"],"stem":"影响炉膛出口烟温的因素不包括：","options":[{"k":"A","t":"锅炉负荷"},{"k":"B","t":"燃料特性"},{"k":"C","t":"过量空气系数"},{"k":"D","t":"炉膛材料颜色"}],"answer":"D","why":["A ✗（即属于影响因素）课件 p024 明确列出「锅炉负荷（燃料量）」是影响炉膛出口烟温的因素之一。","B ✗（即属于影响因素）课件 p024 明确列出「燃料特性」是影响因素之一。","C ✗（即属于影响因素）课件 p024 明确列出「过量空气系数」是影响因素之一。","D ✓ 课件 p024 列出的影响因素为：锅炉负荷（燃料量）、燃料特性、过量空气系数、炉膛结构（水冷壁面积）、受热面的灰污、燃烧器及其布置；其中**没有「炉膛材料颜色」**，故为不包括项。"],"basis":"课件 p024（原文：影响炉膛出口烟温的因素——锅炉负荷（燃料量）／燃料特性／过量空气系数／炉膛结构（水冷壁面积）／受热面的灰污／燃烧器及其布置）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准","steps":[],"given":[],"ask":[]}],"images":{"1":{"w":"img/boiler-ch9/p001.webp","j":"img/boiler-ch9/p001.jpg"},"2":{"w":"img/boiler-ch9/p002.webp","j":"img/boiler-ch9/p002.jpg"},"3":{"w":"img/boiler-ch9/p003.webp","j":"img/boiler-ch9/p003.jpg"},"4":{"w":"img/boiler-ch9/p004.webp","j":"img/boiler-ch9/p004.jpg"},"5":{"w":"img/boiler-ch9/p005.webp","j":"img/boiler-ch9/p005.jpg"},"6":{"w":"img/boiler-ch9/p006.webp","j":"img/boiler-ch9/p006.jpg"},"7":{"w":"img/boiler-ch9/p007.webp","j":"img/boiler-ch9/p007.jpg"},"8":{"w":"img/boiler-ch9/p008.webp","j":"img/boiler-ch9/p008.jpg"},"9":{"w":"img/boiler-ch9/p009.webp","j":"img/boiler-ch9/p009.jpg"},"10":{"w":"img/boiler-ch9/p010.webp","j":"img/boiler-ch9/p010.jpg"},"11":{"w":"img/boiler-ch9/p011.webp","j":"img/boiler-ch9/p011.jpg"},"12":{"w":"img/boiler-ch9/p012.webp","j":"img/boiler-ch9/p012.jpg"},"13":{"w":"img/boiler-ch9/p013.webp","j":"img/boiler-ch9/p013.jpg"},"14":{"w":"img/boiler-ch9/p014.webp","j":"img/boiler-ch9/p014.jpg"},"15":{"w":"img/boiler-ch9/p015.webp","j":"img/boiler-ch9/p015.jpg"},"16":{"w":"img/boiler-ch9/p016.webp","j":"img/boiler-ch9/p016.jpg"},"17":{"w":"img/boiler-ch9/p017.webp","j":"img/boiler-ch9/p017.jpg"},"18":{"w":"img/boiler-ch9/p018.webp","j":"img/boiler-ch9/p018.jpg"},"19":{"w":"img/boiler-ch9/p019.webp","j":"img/boiler-ch9/p019.jpg"},"20":{"w":"img/boiler-ch9/p020.webp","j":"img/boiler-ch9/p020.jpg"},"21":{"w":"img/boiler-ch9/p021.webp","j":"img/boiler-ch9/p021.jpg"},"22":{"w":"img/boiler-ch9/p022.webp","j":"img/boiler-ch9/p022.jpg"},"23":{"w":"img/boiler-ch9/p023.webp","j":"img/boiler-ch9/p023.jpg"},"24":{"w":"img/boiler-ch9/p024.webp","j":"img/boiler-ch9/p024.jpg"},"25":{"w":"img/boiler-ch9/p025.webp","j":"img/boiler-ch9/p025.jpg"},"26":{"w":"img/boiler-ch9/p026.webp","j":"img/boiler-ch9/p026.jpg"},"27":{"w":"img/boiler-ch9/p027.webp","j":"img/boiler-ch9/p027.jpg"},"28":{"w":"img/boiler-ch9/p028.webp","j":"img/boiler-ch9/p028.jpg"},"29":{"w":"img/boiler-ch9/p029.webp","j":"img/boiler-ch9/p029.jpg"},"30":{"w":"img/boiler-ch9/p030.webp","j":"img/boiler-ch9/p030.jpg"},"31":{"w":"img/boiler-ch9/p031.webp","j":"img/boiler-ch9/p031.jpg"},"32":{"w":"img/boiler-ch9/p032.webp","j":"img/boiler-ch9/p032.jpg"},"33":{"w":"img/boiler-ch9/p033.webp","j":"img/boiler-ch9/p033.jpg"},"34":{"w":"img/boiler-ch9/p034.webp","j":"img/boiler-ch9/p034.jpg"},"35":{"w":"img/boiler-ch9/p035.webp","j":"img/boiler-ch9/p035.jpg"},"36":{"w":"img/boiler-ch9/p036.webp","j":"img/boiler-ch9/p036.jpg"},"37":{"w":"img/boiler-ch9/p037.webp","j":"img/boiler-ch9/p037.jpg"}}},{"id":"boiler-ch10","name":"第十章 对流受热面传热计算","subtitle":"三基本方程 · 传热温压 · 传热系数 · 放热系数 · 灰污与辐射","status":"在读","overview":"本章讲对流受热面的传热计算：先给出传热计算的两类任务（设计计算/校核计算）与三基本方程、热平衡方程；再讲传热温压（对数平均、算术平均与修正系数 ψ）；然后讲传热系数 K 的三种情形（管式承压受热面、扩展表面式、空气预热器）与 ε、ψ 两种算法；最后讲放热系数（对流放热 α_c + 辐射放热 α_r，含烟气黑度、辐射减弱系数、辐射层厚度）与灰污表面温度。","mindmap":{"label":"第十章 对流受热面传热计算","children":[{"label":"本章概览","children":[{"label":"本章核心内容：3个基本方程＋各项变量计算"}]},{"label":"第一节 对流传热计算的基本公式","children":[{"label":"对流传热的特点（温度、气流速度、管间烟气辐射、炉内辐射）"},{"label":"基本任务：设计计算 / 校核计算"},{"label":"烟气对流放热量 Q_c^re（10-2）"},{"label":"工质对流吸热量 Q_c^ab（10-4）"},{"label":"对流传热基本公式 Q_c^tr = KHΔt/B_cal（10-1）"},{"label":"热平衡：Q_c^re = Q_c^ab = Q_c^tr"}]},{"label":"第二节 传热温压","children":[{"label":"对数平均温差（10-12）与算术平均温差（10-13，端差比≤1.7）"},{"label":"混合流/交叉流修正系数 ψ（10-14）"},{"label":"顺流温压≥0.92逆流温压时取平均（10-17）"}]},{"label":"第三节 传热系数","children":[{"label":"一、管式承压受热面 K（10-18、10-19）","children":[{"label":"污染系数 ε = δ_ash/λ_ash"},{"label":"热有效系数 ψ 与清洁管 K₀（10-22、10-20）"},{"label":"1/α₂ 可忽略的简化式（10-23）"}]},{"label":"二、扩展表面式承压受热面 K（10-25、10-26、10-27）","children":[{"label":"鳍片效率 η_f 与受热面效率 η_hs"}]},{"label":"三、空气预热器 K（管式10-28、回转式10-29）","children":[{"label":"利用系数 ξ 与不稳定修正系数 π"}]}]},{"label":"第四节 放热系数","children":[{"label":"α₁ = ξ(α_c + α_r)（10-30）"},{"label":"影响对流放热系数的6项因素"},{"label":"相似理论准则式 Nu = C Re^m Pr^n（10-31）"},{"label":"横向冲刷：顺列（Re^0.65）、错列（10-38）"},{"label":"纵向冲刷（10-40）与超临界水蒸汽（10-41、10-42）"},{"label":"扩展受热面对流放热系数（10-43~45、10-46、10-48）"},{"label":"回转式空气预热器准则式（10-49）"},{"label":"四、辐射放热系数","children":[{"label":"q_R = 0.9ε₁σ₀(T₁⁴−T₂⁴)（10-50）"},{"label":"α_r 计算式（10-51）"},{"label":"烟气黑度 ε₁（10-53）与吸收减弱系数 k_a（10-54）"},{"label":"辐射层有效厚度 S（10-55、10-56、10-57）"},{"label":"灰污表面温度 T₂（10-58、10-59）与 ΔT 取 60℃/不低于25℃"}]}]},{"label":"第五节 污染系数、热有效系数、利用系数和鳍（肋）片效率","children":[{"label":"污染系数 ε（灰污系数）：灰层热阻 ε = δ_h/λ_h = 1/K − 1/K₀（式10-19、10-60）"},{"label":"热有效系数 ψ = K/K₀（式10-21）"},{"label":"利用系数 ξ：大容量锅炉横向冲刷 ξ = 1.0（式10-30），空预器查表10-6"},{"label":"鳍（肋）片效率（扩展表面效率）"}]},{"label":"第六节 对流受热面的面积、介质流速、流通截面积和附加受热面","children":[{"label":"受热面积 H 的选取：放热系数悬殊取小侧表面积，相近取平均直径面积"},{"label":"介质流速公式（10-66~68）与流通截面积公式（10-69~70a）"},{"label":"附加受热面：超 5% 单独计算（误差 <±10%），不超 5% 合并计算"},{"label":"对流受热面传热计算的基本步骤（15 步）"},{"label":"Q_c^tr = K·H·Δt/B_cal（式10-1）与校核 ΔQ ≤ 2%（凝渣管 ΔQ ≤ 5%）"},{"label":"烟气对流放热量 Q_c^re = φ(I′ − I″ + Δα·I₁⁰) 及各受热面形式"},{"label":"本章小结与作业"}]}]},"points":[{"id":"p-ch10a-1","title":"第十章总览与对流传热的特点","key":true,"source":"课件 p002–p003","items":["本章核心内容之一：**传热计算的3个基本方程**（对流传热基本方程、烟气对流放热量方程、工质对流吸热量方程）。","本章核心内容之二：**传热方程中各项变量的计算**（温差、传热系数、污染系数、传热面积）。","第一节为**对流传热计算的基本公式**，其前提是对流传热的特点。","特点1：就其对流传热本身而言，需**考虑温度的影响**、**考虑气流速度的影响**。","特点2：同时需考虑**管间烟气的辐射影响**。","特点3：靠近**炉膛出口的受热面**，需考虑直接接受**炉内辐射传热**的影响（下一章：半辐射式受热面）。"]},{"id":"p-ch10a-2","title":"对流传热计算的基本任务：设计计算与校核计算","key":false,"source":"课件 p004","items":["**设计计算**：已知对流受热面的吸热量，求该受热面的**结构尺寸**。","**校核计算**：已知受热面的结构尺寸，校核该受热面的**进出口参数**。","两者区别在于已知量与待求量的互换：设计计算已知吸热量求尺寸，校核计算已知尺寸求进出口参数。"]},{"id":"p-ch10a-3","title":"对流传热的3个基本方程式与热平衡","key":true,"source":"课件 p005","items":["① 烟气对流放热量（式10-2）：Q_c^re = 保热系数φ·(I′ − I″ + Δα·I_l^0)，单位 **kJ/kg**；其中 Δα 为**受热面烟道的漏风系数**，I_l^0 为**漏入空气焓**。","② 工质对流吸热量（式10-4）：Q_c^ab = (D / B_cal)·(i″ − i′)，单位 **kJ/kg**；D 为工质流量，B_cal 为计算燃料消耗量，i′、i″ 为工质进出口焓。","③ 对流传热量（对流传热基本公式，式10-1）：Q_c^tr = K·H·Δt / B_cal，单位 **kJ/kg**；K 为**传热系数**，H 为受热面面积，Δt 为传热温压。","**热平衡**：Q_c^re = Q_c^ab = Q_c^tr（三者相等是联立求解的基础）。","三个方程中，传热系数 K、传热温压 Δt、传热面积 H 是后续各节要逐项计算的变量。"]},{"id":"p-ch10a-4","title":"第二节 传热温压：对数平均温差、算术平均温差与修正系数","key":true,"source":"课件 p007","items":["**顺流或逆流**（或**五次以上交叉流按顺流计算**）采用**对数平均温差**（式10-12）：Δt = (Δt_lar − Δt_sma) / ln(Δt_lar / Δt_sma)。","当**端差之比 Δt_lar/Δt_sma ≤ 1.7** 时，则可采用**算术平均温差**（式10-13）：Δt = (Δt_lar + Δt_sma)/2 = θ_av − t_av。","**混合流**（图10-4）和**交叉流**（图10-5，管式空气预热器）：按**逆流传热温压 Δt_cou 乘修正系数 ψ**（式10-14）：Δt = ψ·Δt_cou。","任何复杂的流动方式，当**顺流温压 Δt_par** 和**逆流温压 Δt_cou** 之间满足 **Δt_par ≥ 0.92·Δt_cou** 时（式10-17）：Δt = (Δt_par + Δt_cou)/2。","符号含义：Δt_lar 为较大端差，Δt_sma 为较小端差；θ_av 为烟气平均温度，t_av 为工质平均温度。"]},{"id":"p-ch10a-5","title":"第三节 管式承压受热面传热系数 K","key":true,"source":"课件 p008","items":["完整式（式10-18）：K = 1 / (1/α₁ + δ_ash/λ_ash + δ_m/λ_m + δ_sc/λ_sc + 1/α₂)，单位 **kW/(m²·℃)**。","各项含义：α₁ 为**烟气对管壁放热系数**，α₂ 为**管壁对受热介质放热系数**，δ_ash/λ_ash 为灰污层热阻，δ_m/λ_m 为金属管壁热阻，δ_sc/λ_sc 为管内结垢层热阻。","**忽略金属管壁的热阻和不计管内结垢**后（式10-19）：K = 1 / (1/α₁ + ε + 1/α₂)。","**污染系数**（式10-19）：ε = δ_ash / λ_ash。","分母为各项串联热阻之和，K 为总热阻的倒数，故任一环节热阻增大都会显著降低 K。"]},{"id":"p-ch10a-6","title":"污染系数（灰污系数）ε 与 热有效系数 ψ 两种算法","key":true,"source":"课件 p009","items":["**燃用固体燃料时，错列布置的横向冲刷光管管束（可用于省煤器）**，其灰层热阻用**灰污系数 ε** 考虑，按式10-19 计算：K = 1/(1/α₁ + ε + 1/α₂)，ε = δ_ash/λ_ash。","**其余情况下**采用**热有效系数 ψ** 法计算受热面的传热系数；ψ 定义为**管子污染状况下的传热系数与清洁状况下的传热系数的比值**。","热有效系数法（式10-22）：K = ψ·K₀ = ψ / (1/α₁ + 1/α₂)。","**清洁管（ε = 0）的传热系数**（式10-20）：K₀ = 1 / (1/α₁ + 1/α₂)。","**管内为水、汽水混合物或超临界压力以上的过热蒸汽**时，管壁对工质的放热系数很大，**1/α₂ 可忽略**，传热系数简化为（式10-23）：K = α₁ / (1 + ε·α₁)；或 K = ψ·α₁。","注意：ε 法用「加一项热阻」，ψ 法用「乘一个小于1的系数」，二者适用条件不同。"]},{"id":"p-ch10a-7","title":"扩展表面式承压受热面传热系数（鳍片式、肋片式）","key":true,"source":"课件 p010","items":["**外表面扩展式受热面**较多地采用**鳍片式和肋片式**（一般用于**省煤器**以强化**烟气侧**的传热）。","对省煤器，**按烟气侧全部表面积计算传热系数**。","计算式（式10-25）：K = ψ·(H_f/ΣH·η_f + H_t/ΣH)·α₁ = ψ·η_hs·α₁。","计算式（式10-26）：K = 1 / [ (1/α₁ + ε)·(1/η_hs) ] = η_hs·α₁ / (1 + ε·α₁)。","受热面效率（式10-27）：η_hs = (H_f/ΣH)·η_f + H_t/ΣH。","符号含义：H_f 为**鳍片或肋片表面积**，H_t 为**管子无鳍或无肋部分表面积**，ΣH 为总表面积；η_f 为**鳍片或肋片效率**，η_hs 为**鳍片管或肋片管的受热面效率**。"]},{"id":"p-ch10a-8","title":"空气预热器传热系数（管式与回转式）","key":false,"source":"课件 p011","items":["采用受热面的**利用系数（对流受热面冲刷不完善系数）ξ** 及**受热面热交换不稳定修正系数 π**，来综合考虑**灰分的污染、气流对受热面冲刷的不完善以及不稳定换热**等的影响。","**管式空气预热器**（式10-28）：K = ξ / (1/α₁ + 1/α₂) = ξ·α₁α₂/(α₁ + α₂)。","**回转式空气预热器**（式10-29）：K = ξπ / ( 1/(x₁α₁) + 1/(x₂α₂) )。","x₁、x₂ 分别为**烟气、空气流通截面积份额**。","**π 与转速有关**。"]},{"id":"p-ch10a-9","title":"第四节 放热系数的构成与影响因素","key":true,"source":"课件 p013","items":["放热系数计算涉及：**烟气对管壁的放热系数 α₁** 和**管壁对受热介质的放热系数 α₂**。","烟气对管壁的放热系数 α₁，一般包括烟气的**对流放热系数 α_c** 和**管间烟气容积的辐射放热系数 α_r**（式10-30）：α₁ = ξ·(α_c + α_r)。","★**影响对流放热系数的因素**（共6项）：**烟气流速**、**烟气温度**、**管子尺寸**、**管束冲刷状况**、**管束布置方式**、**冲刷介质的物性**。","注意：「锅炉负荷变化率」不在上述6项主要因素之列。"]},{"id":"p-ch10a-10","title":"对流放热系数准则式（横向冲刷、纵向冲刷、回转式）","key":false,"source":"课件 p014–p015","items":["工程上应用**相似理论**分析得出放热系数公式；锅炉各受热面中烟气、空气、蒸汽、水等介质的流动**均为强迫流动**。不考虑自然对流影响时，**稳定对流放热准则关系式**（式10-31）：Nu = C·Re^m·Pr^n。","**光管对流受热面的对流放热系数——横向冲刷（烟气）**：**顺列管束** Nu = 0.21·Re^0.65·Pr^0.34；**错列管束**（式10-38）Nu = 0.35·φ^0.1·Re^0.6·Pr^0.36。","**纵向冲刷**（蒸汽、水或管式空气预热器中的介质在管内纵向流动，式10-40）：Nu = 0.023·Re^0.8·Pr^0.4·C_L·C_t。","超临界水和蒸汽的放热系数见**公式10-41、10-42**。","**扩张（扩展）受热面的对流放热系数（用于省煤器）**：见**公式10-43~45、10-46、10-48**，覆盖鳍片式、肋片式、错列、顺列。","**回转式空气预热器的对流放热系数**：**定性尺寸为蓄热板的当量直径**，**定性温度为进出口流体均温**，Nu = C·Re^0.8·Pr^0.4（式10-49），**C 取决于蓄热板的板型**。"]},{"id":"p-ch10a-11","title":"辐射放热系数、烟气黑度与辐射层有效厚度","key":true,"source":"课件 p016–p017","items":["烟气与灰污壁面之间的热交换 q_R 应为**多次吸收和反射**的结果；简化时**仅考虑一次吸收的能量**，但用**加大壁面黑度**的办法对多次吸收进行补偿。","壁面黑度取实测灰污壁面黑度 ε₂ 与绝对黑体黑度的平均值，即 **(ε₂ + 1)/2 ≈ 0.9**，于是（式10-50）：q_R = 0.9·ε₁·σ₀·(T₁⁴ − T₂⁴)。","**烟气辐射放热系数**（适合于含灰气流，式10-51）：α_r = q_R/(T₁ − T₂) = 0.9·ε₁·σ₀·T₁³·[1 − (T₂/T₁)⁴] / [1 − (T₂/T₁)]，单位 **kW/(m²·℃)**。","**烟气黑度**（式10-53）：ε₁ = 1 − e^(−k_a·S)。","**介质的吸收减弱系数**（式10-54）：k_a = k_g·r + k_ash·μ_ash，单位 **m⁻¹**。","**辐射层有效厚度**（式10-55）：S = 3.6·V/ΣF，单位 **m**；V 为**辐射空间容积**，ΣF 为**参与辐射热交换的周界表面积**。","**光管管束**（式10-56）：S = 0.9·d·( 4/π · s₁s₂/d² − 1 )；s₁ 为**横向节距**，s₂ 为**纵向节距**，d 为管径。","**鳍片管和肋片管（T₁ 高时）**，分别乘系数 **0.4** 和 **0.25**；**烟气在管内纵向流动**时（式10-57）：S = 0.9·d_i。"]},{"id":"p-ch10a-12","title":"灰污表面温度 T₂ 的计算","key":false,"source":"课件 p018","items":["**对墙式受热面和对流过热器**（式10-58）：T₂ = (t + 273) + (ε + 1/α₂)·B_cal·(Q_c + Q_r) / (H·K)，单位 **K**。","式10-58 中：t 为**管内受热介质温度**，ε 为污染系数，α₂ 为**管壁对受热介质的放热系数**，B_cal 为计算燃料消耗量，Q_c 为**受热面从烟气获得的对流热**，Q_r 为**从其前面烟气中获得的辐射热**，H 为**受热面面积**。","**对省煤器**（式10-59）：T₂ = (t + 273) + ΔT，单位 **K**。","对于**入口烟温 ϑ′ > 400 ℃** 的省煤器，取 **ΔT = 60 ℃**；当 **ϑ′ < 400 ℃** 时其值可相应减小，**但不低于 ΔT = 25 ℃**。"]},{"id":"p-ch10b-1","title":"第五节 污染系数、热有效系数、利用系数和鳍（肋）片效率——总览","key":true,"source":"课件 p020","items":["在对流受热面的传热计算中，用来表示受热面的**灰污程度**有三种系数：","一、**污染系数**（ε）","二、**热有效系数**（ψ）","三、**利用系数**（ξ）","四、**鳍（肋）片效率**（扩展表面效率）"]},{"id":"p-ch10b-2","title":"污染系数（灰污系数）的定义与计算式","key":true,"source":"课件 p021、课件 p022","items":["定义（灰层的热阻）：ε = δ_ash/λ_ash = δ_h/λ_h（式10-19、10-60），δ_h 为灰层厚度、λ_h 为灰层导热系数","由传热系数定义：ε = 1/K − 1/K₀（式10-60）","有灰层时：1/K = 1/α₁ + ε + 1/α₂","没有灰层时：1/K₀ = 1/α₁ + 1/α₂","即污染系数把灰层热阻作为附加串联热阻计入总热阻","固体燃料**错列布置管束**：用经验式计算或查图（图10-11），ε = C_gr·C_d·ε₀ + Δε（式10-61）"]},{"id":"p-ch10b-3","title":"污染系数的影响因素（式10-61~63）","key":true,"source":"课件 p022","items":["（1）与灰的**粒径成反比**","（2）与**烟气流速成反比**","（3）与**纵向相对节距成正比**","（4）与**管径成正比**","（5）与**积灰类型、是否吹灰**有关（表10-4）"]},{"id":"p-ch10b-4","title":"热有效系数 ψ","key":true,"source":"课件 p023","items":["定义：ψ = K/K₀（式10-21），即**有灰层的 K 与没有灰层的 K₀ 之比**","适用于：燃用**固体燃料的顺列光管管束**（表10-5）；燃用**液体、气体燃料的所有光管管束**","计算用式10-64、10-65（P197-198）","★ 影响因素：**类同 ε**（与灰粒径、烟气流速、纵向相对节距、管径、积灰类型及吹灰等有关）"]},{"id":"p-ch10b-5","title":"利用系数 ξ","key":true,"source":"课件 p024","items":["含义：受热面积**得到利用（受烟气冲刷）的程度**","考虑气流对受热面**横向冲刷不完善（均匀性程度）**的影响","对于**大容量锅炉**，烟气对过热器、再热器、省煤器都是横向冲刷，均匀性较好，**ξ = 1.0**（式10-30）","对于**空预器**，考虑气流冲刷不完善以及受热面灰污染、漏风等因素综合影响，**查表10-6**","★ 空气预热器中影响 ξ 的因素：（1）管式空气预热器的**中间管板数**；（2）燃料**是否含硫**；（3）**入口空气温度**；（4）**漏风系数**"]},{"id":"p-ch10b-6","title":"鳍（肋）片效率——扩展表面效率的影响因素","key":false,"source":"课件 p025","items":["扩展表面（鳍片或肋片）效率的影响因素：","（1）**扩展表面的型式**（鳍片或肋片）；","（2）**横截面形状**；","（3）**几何参数**；","（4）**材料导热系数**；","（5）**气流（烟气）的对流放热系数**"]},{"id":"p-ch10b-7","title":"第六节 对流受热面的面积 H 如何取","key":true,"source":"课件 p027、课件 p028","items":["当管式受热面**按平壁公式**计算传热系数时，为减少误差，按下述原则确定受热面积 H：","① 当壁面两侧的**放热系数相差悬殊**时，取**放热系数较小一侧**的管子表面积作为计算受热面积；","② 当管子壁面两侧的放热系数**同属一个数量级、相差不大**时，则取相应于**管子平均直径**的面积作为计算受热面积","具体选择方法：过热器、再热器和省煤器：**H = 管子外表面积**","管式空预器：**H = 烟气侧和空气侧的平均表面积**","再生式空预器：**H = 2 × 蓄热板面积**","附加受热面：**H = 炉墙面积 × 角系数**（包覆管组成的膜式壁角系数取 **1.0**）"]},{"id":"p-ch10b-8","title":"介质流速 w 与流通截面积 F 的计算式","key":true,"source":"课件 p029","items":["烟气：w_g = B_cal·V_g·(ϑ_av + 273)/(273F)  m/s（式10-66）","空气：w_a = B_cal·β·V⁰·(t_av + 273)/(273F)  m/s（式10-67）","蒸汽：w = D·v_av/f  m/s（式10-68）","流通截面积——管内介质流动：F（或 f）= Z·πd_i²/4  m²（式10-69）","管外烟气横向冲刷：F = ab − Z₁dl  m²（式10-70）","烟道截面变化时取几何平均：F = 2F′F″/(F′ + F″)（式10-70a）"]},{"id":"p-ch10b-9","title":"附加受热面的计算（5% 界限）","key":true,"source":"课件 p030","items":["（1）附加受热面积**超过 5% 的主受热面**：附加受热面**单独计算**。计算时首先假设换热量","1）**传热温差**：a 与主受热面**并联**布置：Δt = ϑ_av − t_av；b **串联布置在主受热面后**：Δt = ϑ″ − t_av（ϑ″ 为**烟道出口处烟温**）","2）**传热系数**：同主受热面传热系数","3）校核的对流吸热量**允许的误差：< ±10%**","（2）附加受热面积**不超过 5% 的主受热面**：**合并到主受热面中计算**"]},{"id":"p-ch10b-10","title":"对流受热面传热计算的基本步骤（15 步）","key":true,"source":"课件 p031、课件 p032、课件 p033","items":["已知：受热面的**结构尺寸、进口烟气温度、进口工质温度**；求：**出口烟气温度、出口工质温度以及受热面的吸热量**","1. 由基本的结构尺寸求计算受热面积 H、烟气的流通截面 F、工质的流通截面 f、有效辐射层厚度 S","2. 假定烟气的出口温度 ϑ″，求出出口烟气焓 I″","3. 求出烟气的对流放热量 Q_c^re，若吸收炉膛的辐射传热，则需求出吸收的辐射热 Q_r","4. 由 Q_c^re = Q_c^ab，求出工质的出口焓 I″，并查得温度 t″","5. 求平均传热温压 Δt","6. 求烟气流速 w_g、工质流速 w","7. 求烟气侧的对流放热系数 α₁","8. 求工质侧的对流放热系数 α₂","9. 求烟气黑度 ε₁","10. 求灰污壁温 T₂","11. 求烟气侧辐射放热系数 α_r","12. 根据燃料种类、受热面布置选取污染系数 ε、热有效系数 ψ、利用系数 ξ","13. 求传热系数 K","14. 求对流传输热量：**Q_c^tr = K·H·Δt/B_cal  kJ/kg（式10-1）**","15. 校核：**ΔQ = |Q_c^tr − Q_c^re|/Q_c^re × 100**；主受热面（对流过、再、省、屏、空）**ΔQ ≤ 2%**；凝渣管 **ΔQ ≤ 5%**；满足要求则计算结束，否则**重新假设烟气出口温度（第2步）**重算"]},{"id":"p-ch10b-11","title":"烟气对流放热量 Q_c^re 的公式形式","key":true,"source":"课件 p037","items":["一般式（保温系数 φ、受热面烟道漏风系数 Δα）：**Q_c^re = φ(I′ − I″ + Δα·I₁⁰)  kJ/kg**","受热面前烟气焓：I′ = [I_g⁰ + (α − 1)I_a⁰]₁；受热面后烟气焓：I″ = [I_g⁰ + (α + Δα − 1)I_a⁰]₂（下标1、2 表示受热面前、后）","对**承压受热面（过热器、省煤器）**，漏风的焓取**冷空气焓**","**管式空气预热器**（漏风焓按进出口空气平均温度计算）：Q_c^re = φ[I′ − I″ + (Δα/2)(I_a⁰′ + I_a⁰″)]  kJ/kg","**回转式空气预热器**（分冷、热段）：Q_c^re = φ(I′ − I″ + Δα_h·I_a⁰″ + Δα_c·I_a⁰′)  kJ/kg","采用**烟气挡板**时平行烟道内受热面：Q_c^re = φ(I′ − I″ + Δα·I₁⁰)_g  kJ/kg"]},{"id":"p-ch10b-12","title":"本章小结与作业","key":false,"source":"课件 p035、课件 p036","items":["本章小结：1. 对流换热计算的三个基本公式；2. 空气预热器的放热、吸热公式和漏风的影响；3. 传热温压的计算及其条件；4. 传热系数的定义和各主要受热面计算时传热系数公式的具体形式；5. 对流放热系数和烟气辐射放热系数的计算；6. 污染系数、热有效系数和利用系数的意义和应用；7. 各种对流受热面面积的计算；8. 扩展受热面的传热计算及其特点","作业1：写出对流受热面所在烟道烟气放热量公式，并说明式中各符号的意义？","作业2：对于过热器和省煤器受热面，写出工质吸热量公式以及各符号的意义。"]}],"questions":[{"id":"bq-ch10a-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p006（1 分）","keyPoints":["设计计算","校核计算"],"stem":"对流传热计算的基本任务中，“校核计算”是指","options":[{"k":"A","t":"已知受热面吸热量，求结构尺寸"},{"k":"B","t":"已知结构尺寸，校核进出口参数"},{"k":"C","t":"已知烟气温度，求传热系数"},{"k":"D","t":"已知工质流量，求受热面积"}],"answer":"B","why":["A ✗ 这是**设计计算**的定义，课件 p004 原文：「设计计算：已知对流受热面的吸热量，求该受热面的结构尺寸」，与「校核计算」相反。","B ✓ 课件 p004 原文：「校核计算：已知受热面的结构尺寸，校核该受热面的进出口参数」，与题干完全对应。","C ✗ 课件未把「已知烟气温度求传热系数」列为基本任务；传热系数 K 由第三节各公式（如式10-18、10-19）计算，不属于基本任务的分类。","D ✗ 课件未把「已知工质流量求受热面积」列为基本任务；由式10-4、10-1 可知工质流量 D 是与吸热量 Q_c^ab 相关联的已知量，求受热面积 H 仍属于设计计算的范畴。"],"basis":"课件 p004（原文）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准"},{"id":"bq-ch10a-2","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p012（1 分）","keyPoints":["管式承压受热面传热系数","忽略金属管壁热阻","不计管内结垢","污染系数ε"],"stem":"管式承压受热面传热系数计算中，若忽略金属管壁热阻且不计管内结垢，传热系数可表示为","options":[{"k":"A","t":"K = 1/α₁ + 1/α₂"},{"k":"B","t":"K = 1 / (1/α₁ + ε + 1/α₂)"},{"k":"C","t":"K = ψK₀"},{"k":"D","t":"K = α₁ + α₂"}],"answer":"B","why":["A ✗ 选项把热阻之和当成了传热系数；课件 p008 中 1/α₁、1/α₂ 是分母上的**热阻项**，且该式漏掉了灰污层热阻 ε，故不正确。","B ✓ 课件 p008 原文：「忽略金属管壁的热阻和不计管内结垢」后 K = 1/(1/α₁ + ε + 1/α₂)（式10-19），其中 ε = δ_ash/λ_ash 为污染系数，与题干条件完全一致。","C ✗ K = ψK₀ 是课件 p009 的**热有效系数法**（适用于「其余情况」），而题干明确给出的是可计入灰污热阻 ε 的管式承压受热面情形，且 ψK₀ 展开后为 ψ/(1/α₁+1/α₂)，不含 ε。","D ✗ 课件中没有任何 K = α₁ + α₂ 的形式；放热系数是热阻的倒数，串联热阻不可能直接相加作为传热系数。"],"basis":"课件 p008（原文）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准"},{"id":"bq-ch10a-3","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p019（1 分）","keyPoints":["影响对流放热系数的因素","烟气流速","管子尺寸","管束布置方式"],"stem":"关于对流放热系数的影响因素，下列哪项不属于影响对流放热系数的主要因素","options":[{"k":"A","t":"烟气流速"},{"k":"B","t":"管子尺寸"},{"k":"C","t":"管束布置方式"},{"k":"D","t":"锅炉负荷变化率"}],"answer":"D","why":["A ✗ 「烟气流速」是课件 p013 ★影响对流放热系数的因素中的第 1 项，属于主要因素（Re 数中即含流速）。","B ✗ 「管子尺寸」是课件 p013 ★影响对流放热系数的因素中的第 3 项，属于主要因素（准则式中以管径作定性尺寸）。","C ✗ 「管束布置方式」是课件 p013 ★影响对流放热系数的因素中的第 5 项，属于主要因素（课件 p014 顺列、错列准则式不同即为佐证）。","D ✓ 课件 p013 列出的6项主要因素为：烟气流速、烟气温度、管子尺寸、管束冲刷状况、管束布置方式、冲刷介质的物性；「锅炉负荷变化率」**不在其中**，故不属于主要因素。"],"basis":"课件 p013（原文）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准"},{"id":"bq-ch10b-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p026（1 分）","keyPoints":["表示受热面灰污程度的三种系数","污染系数","热有效系数","利用系数"],"stem":"在对流受热面传热计算中，用来表示受热面灰污程度的系数不包括","options":[{"k":"A","t":"污染系数"},{"k":"B","t":"热有效系数"},{"k":"C","t":"利用系数"},{"k":"D","t":"流量系数"}],"answer":"D","why":["A ✗ 属于。课件 p020 原文列出「用来表示受热面的灰污程度有三种系数：一、污染系数」，故污染系数被包括","B ✗ 属于。课件 p020 原文「二、热有效系数」，被包括","C ✗ 属于。课件 p020 原文「三、利用系数」，被包括","D ✓ 不属于。课件 p020 的列举为「一、污染系数；二、热有效系数；三、利用系数；四、鳍（肋）片效率」，全章课件未把「流量系数」列为表示灰污程度的系数（p020 之后的 p021~p025 也只讲 ε、ψ、ξ 与鳍片效率），故「不包括」的是流量系数"],"basis":"课件 p020（原文）：在对流受热面的传热计算中，用来表示受热面的灰污程度有三种系数：一、污染系数；二、热有效系数；三、利用系数；四、鳍（肋）片效率","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准"},{"id":"bq-ch10b-2","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p034（1 分）","keyPoints":["对流受热面传热计算的基本步骤","第一步：由结构尺寸求 H、F、f、S"],"stem":"对流受热面传热计算的基本步骤中，第一步通常是","options":[{"k":"A","t":"假定烟气出口温度"},{"k":"B","t":"求计算受热面积、流通截面和有效辐射层厚度"},{"k":"C","t":"求传热系数"},{"k":"D","t":"校核传热量误差"}],"answer":"B","why":["A ✗ 为第2步。课件 p032 原文「2. 假定烟气的出口温度 ϑ″，求出出口烟气焓 I″」","B ✓ 为第1步。课件 p032 原文「1. 由基本的结构尺寸求计算受热面积 H，烟气的流通截面 F，工质的流通截面 f，有效辐射层厚度 S」","C ✗ 为第13步。课件 p033 原文「13. 求传热系数 K」","D ✗ 为第15步。课件 p033 原文「15. 校核」，并按 ΔQ = |Q_c^tr − Q_c^re|/Q_c^re × 100 判断是否重算"],"basis":"课件 p032（原文第1步）：由基本的结构尺寸求计算受热面积 H，烟气的流通截面 F，工质的流通截面 f，有效辐射层厚度 S","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准"}],"images":{"2":{"w":"img/boiler-ch10/p002.webp","j":"img/boiler-ch10/p002.jpg"},"3":{"w":"img/boiler-ch10/p003.webp","j":"img/boiler-ch10/p003.jpg"},"4":{"w":"img/boiler-ch10/p004.webp","j":"img/boiler-ch10/p004.jpg"},"5":{"w":"img/boiler-ch10/p005.webp","j":"img/boiler-ch10/p005.jpg"},"6":{"w":"img/boiler-ch10/p006.webp","j":"img/boiler-ch10/p006.jpg"},"7":{"w":"img/boiler-ch10/p007.webp","j":"img/boiler-ch10/p007.jpg"},"8":{"w":"img/boiler-ch10/p008.webp","j":"img/boiler-ch10/p008.jpg"},"9":{"w":"img/boiler-ch10/p009.webp","j":"img/boiler-ch10/p009.jpg"},"10":{"w":"img/boiler-ch10/p010.webp","j":"img/boiler-ch10/p010.jpg"},"11":{"w":"img/boiler-ch10/p011.webp","j":"img/boiler-ch10/p011.jpg"},"12":{"w":"img/boiler-ch10/p012.webp","j":"img/boiler-ch10/p012.jpg"},"13":{"w":"img/boiler-ch10/p013.webp","j":"img/boiler-ch10/p013.jpg"},"14":{"w":"img/boiler-ch10/p014.webp","j":"img/boiler-ch10/p014.jpg"},"15":{"w":"img/boiler-ch10/p015.webp","j":"img/boiler-ch10/p015.jpg"},"16":{"w":"img/boiler-ch10/p016.webp","j":"img/boiler-ch10/p016.jpg"},"17":{"w":"img/boiler-ch10/p017.webp","j":"img/boiler-ch10/p017.jpg"},"18":{"w":"img/boiler-ch10/p018.webp","j":"img/boiler-ch10/p018.jpg"},"19":{"w":"img/boiler-ch10/p019.webp","j":"img/boiler-ch10/p019.jpg"},"20":{"w":"img/boiler-ch10/p020.webp","j":"img/boiler-ch10/p020.jpg"},"21":{"w":"img/boiler-ch10/p021.webp","j":"img/boiler-ch10/p021.jpg"},"22":{"w":"img/boiler-ch10/p022.webp","j":"img/boiler-ch10/p022.jpg"},"23":{"w":"img/boiler-ch10/p023.webp","j":"img/boiler-ch10/p023.jpg"},"24":{"w":"img/boiler-ch10/p024.webp","j":"img/boiler-ch10/p024.jpg"},"25":{"w":"img/boiler-ch10/p025.webp","j":"img/boiler-ch10/p025.jpg"},"26":{"w":"img/boiler-ch10/p026.webp","j":"img/boiler-ch10/p026.jpg"},"27":{"w":"img/boiler-ch10/p027.webp","j":"img/boiler-ch10/p027.jpg"},"28":{"w":"img/boiler-ch10/p028.webp","j":"img/boiler-ch10/p028.jpg"},"29":{"w":"img/boiler-ch10/p029.webp","j":"img/boiler-ch10/p029.jpg"},"30":{"w":"img/boiler-ch10/p030.webp","j":"img/boiler-ch10/p030.jpg"},"31":{"w":"img/boiler-ch10/p031.webp","j":"img/boiler-ch10/p031.jpg"},"32":{"w":"img/boiler-ch10/p032.webp","j":"img/boiler-ch10/p032.jpg"},"33":{"w":"img/boiler-ch10/p033.webp","j":"img/boiler-ch10/p033.jpg"},"34":{"w":"img/boiler-ch10/p034.webp","j":"img/boiler-ch10/p034.jpg"},"35":{"w":"img/boiler-ch10/p035.webp","j":"img/boiler-ch10/p035.jpg"},"36":{"w":"img/boiler-ch10/p036.webp","j":"img/boiler-ch10/p036.jpg"},"37":{"w":"img/boiler-ch10/p037.webp","j":"img/boiler-ch10/p037.jpg"}}},{"id":"boiler-ch11","name":"第十一章 半辐射受热面的计算","subtitle":"屏式受热面传热特点 · 传热系数 · 屏间辐射 · 穿透辐射 · 转向室","status":"在读","overview":"本章讲半辐射（屏式）受热面的传热计算：先讲半辐射受热面及其传热特点；再讲屏式受热面传热系数公式、烟气放热系数与屏间空间烟气辐射放热系数；随后讲屏空间透过屏区出口的穿透辐射、半辐射受热面吸收的炉内直接辐射（含穿透屏区角系数）；最后讲半辐射受热面工质侧与烟气侧热平衡方程、转向室空间辐射计算。","mindmap":{"label":"第十一章 半辐射受热面的计算","children":[{"label":"第一节 半辐射受热面的计算及其传热特点","children":[]},{"label":"第二节 半辐射受热面传热系数的计算","children":[{"label":"一、屏式受热面传热系数 K"},{"label":"二、屏式受热面烟气放热系数 α₁"},{"label":"三、屏式受热面烟气对流放热系数（单排管子）"},{"label":"四、屏间空间烟气辐射放热系数 αr"}]},{"label":"第三节 屏空间透过屏区出口的穿透辐射","children":[]},{"label":"第四节 半辐射受热面吸收的炉内直接辐射","children":[{"label":"一、屏布置在炉膛出口烟窗时来自炉内的直接辐射"},{"label":"二、在炉膛上部布置前屏和后屏时来自炉内的直接辐射"},{"label":"三、穿透屏区角系数的计算"}]},{"label":"第五节 半辐射受热面工质侧和烟气侧热平衡","children":[]},{"label":"第六节 转向室空间辐射传热","children":[{"label":"本章小结"},{"label":"作业"}]}]},"points":[{"id":"p-ch11-1","title":"半辐射受热面的定义与结构特点","key":true,"source":"课件 p002","items":["**辐射受热面（炉膛内）**：火焰温度高、炉膛容积大，辐射传热能力强，但烟气流速不高，对流传热比例小 → 按**辐射传热计算**。","**对流受热面**：接触烟气的对流 + 密集管束的空间辐射，将辐射**折算到对流换热方式中**。","**半辐射受热面**：布置在**炉膛上部或炉膛出口**的屏式受热面（如**前屏或大屏、分隔屏、后屏**）。","三项吸热来源：**炉内直接辐射 + 烟气辐射（空间辐射）+ 接触烟气纯对流换热**。","结构特点：**横向节距很大 s₁/d ≫ 4，纵向节距小 s₂/d ≈ 1**。"]},{"id":"p-ch11-2","title":"半辐射受热面的传热特点与计算受热面积","key":true,"source":"课件 p003","items":["（1）**受热面吸热**：包括炉内直接辐射热、屏间烟气辐射热和烟气对流热。","（2）**辐射能分配**：炉内直接辐射只有部分照射在屏区受热面上（**角系数小于 1**），其余则透射过去落到其后的受热面上。","（3）**工质（蒸汽）温升**：是炉内直接辐射热、屏间烟气辐射热和烟气对流热**共同加热**的结果。","（4）**烟气焓降**：应与所在空间辐射热 + 纯对流热 + 该区空间向后穿透至下一级受热面的辐射热的**总和相平衡**。","（5）高温烟气与受热面直接接触（冲刷），受热面积灰状况一般比炉内水冷壁**严重一些**；热有效系数和有关黑度中**不考虑焦炭项**。","（6）**计算受热面积 Hp = 2xpFp**；屏风面积 **Fp** 由屏最外圈管子的外轮廓线所围成的平面面积。","（7）**传热计算**：将屏空间辐射与烟气纯对流**合并**，按对流传热方式计算；壁温偏高使传热能力下降，需对传热系数修正；αc 要折算到按屏的计算受热面积计算：**α₁ = αr + αc**。"]},{"id":"p-ch11-3","title":"屏式受热面传热系数 K（第二节）","key":true,"source":"课件 p004","items":["**K = 1 / [ 1/α₁ + (1 + Qr/Qc)(Rf + 1/α₂) ]**，单位 **kW/(m²·℃)**。","α₁ —— 烟气对管壁放热系数；α₂ —— 管壁对工质（管内）放热系数；**Rf —— 管外灰污层热阻**。","**1 + Qr/Qc** 是考虑**屏间辐射和炉内直接辐射**导致的**灰污表面、金属表面温度升高**的影响。","**Qc** 为屏式受热面吸收的对流热（**含屏间辐射热**）。","**Qr**（后文符号为 **Qpr**）为屏式受热面吸收的**炉内直接辐射热**。"]},{"id":"p-ch11-4","title":"屏式受热面烟气放热系数 α₁ 与对流放热系数","key":true,"source":"课件 p005","items":["烟气对屏管的放热系数包括**对流放热系数 αc** 和**屏间空间辐射放热系数 αr**；以计算受热面积计算传热时要对 αc 进行折算。","**α₁ = ξ( πd/(2s₂xp) · αc + αr )** （11-2）；**πd/(2s₂xp)** 为屏片内管间节距，**xp** 为屏片角系数。","**ξ** 为对烟气冲刷不均匀的利用系数：**前屏 ξ ≈ 0.6；后屏 ξ ≈ 0.85**。","当 **Red ≤ 10³**：**Nu = αc d/λ = 0.51 Red^0.5 Pr^0.37** （11-3）。","当 **Red > 10³**：**Nu = αc d/λ = 0.51 Red^0.6 Pr^0.37** （11-4）。"]},{"id":"p-ch11-5","title":"屏间空间烟气辐射放热系数 αr 及其黑度","key":true,"source":"课件 p006（配合 p018）","items":["屏间空间烟气对屏式受热面的辐射传热热流：**q_R^p = C_syn σ₀ (T₁⁴ − T₂⁴)** （11-8）。","辐射热交换综合系数：**C_syn = 1 / ( 1/ε_syn^p + 1/ε₂ − 1 )**，其中 **ε₂ 为屏式受热面黑度**。","屏间空间辐射放热系数：**αr = q_R^p / (T₁ − T₂)**，**kW/(m²·℃)** （11-11）。","屏区烟气的综合黑度：**ε_syn^p = 1 / ( 0.48 ka s₁ + 1/εp )** （11-7），**s₁ 为屏的横向节距**。","屏空间烟气黑度：**εp = 1 − e^(−ka Sp)** （11-9）。","吸收减弱系数：**ka = kg r + kash μash** （11-10）。","p018 补充：介质充满时 **qR = σ₀(T₁⁴ − T₂⁴) / [ (3/4)kd + 1/ε₁ + 1/ε₂ + 1 ]** （11-5）；对屏取假想火焰辐射面在屏空间横截面**对称中心线**上（**d = s₁/2**）得 **qR = σ₀(T₁⁴−T₂⁴)/[ (3/8)ks₁ + 1/ε₁ + 1/ε₂ + 1 ] = σ₀(T₁⁴−T₂⁴)/[ 0.48ka s₁ + 1/εp + 1/ε₂ + 1 ] = σ₀(T₁⁴−T₂⁴)/[ 1/ε_syn^p + 1/ε₂ + 1 ]** （11-6）。","p018 结论：考虑散射作用后介质总减弱系数 **k = 1.28 ka**，屏间烟气黑度 **εp = ε₁**（1—辐射高温平面或火焰辐射平面，温度 T₁；2—吸热低温平面，温度 T₂）。"]},{"id":"p-ch11-6","title":"第三节 屏间穿透辐射的计算","key":true,"source":"课件 p008","items":["屏区烟气的有效辐射热流：**Jp = ε_(p,S)^syn · Eb,S = ε_(p,S)^syn σ₀ Tp⁴** （11-12）。","**ε_(p,S)^syn = ε_syn^p / [ ε_syn^p + (1 − ε_syn^p) ψ_(p,S) ]** （11-13），式中 **ε_syn^p 为屏区烟气综合黑度**。","屏空间穿透辐射热流：**q″_(p,S) = ψ″_(p,S) J″p = ψ″_(p,S) ε_(p,S)^syn σ₀ Tp″⁴** （11-14）；**J″p 为出口截面有效热流**，**ψ″_(p,S) 为下一级获取该级屏空间辐射热有效系数**。","屏空间穿透辐射热：**Q″_(p,S) = q″_(p,S) F_ou / B_cal**，**kJ/kg** （11-15）。","符号：**Tp —— 屏区烟气平均温度；Tp″ —— 屏区出口烟温；F_ou —— 屏区出口截面积**。"]},{"id":"p-ch11-7","title":"第四节 半辐射受热面吸收的炉内直接辐射（屏在炉膛出口烟窗）","key":true,"source":"课件 p009、p010","items":["简化方法：当具有炉膛水冷壁热负荷沿炉膛高度分布的可靠数据时，可按第九章第八节方法求出。","区域热负荷：**q_f″ = η_f″ q_av** （9-62），**η_f″ 为区域热负荷不均匀系数**。","进入屏区辐射热：**Q′p = Q″_(p,f) = q_f″ F_abc / B_cal** （11-18），**F_abc 为炉膛出口烟窗面积**。","炉膛出口区域有效热流：**J₁″ = ε_f^syn σ₀ T_f″⁴** （11-16）。","进入屏区的来自炉膛的直接辐射热流：**q_f″ = ψ_(p,f) J₁″ = ψ_(p,f) ε_f^syn σ₀ T_f″⁴** （11-17）。","炉膛出口辐射穿透屏区的热量：**Q″p = Q′p φ_p^p** （11-19），**φ_p^p 为穿透角系数**。","屏区受热面（包括屏和附加受热面）从炉膛出口辐射中获得的直接辐射热：**Qp = Q′p − Q″p = Q″_(p,f)(1 − φ_p^p)** （11-20）。","屏后受热面的总辐射热（总穿透辐射热）= 炉膛直接辐射的穿透辐射 + 屏空间辐射的穿透辐射：**ΣQ″p = Q″_(p,f) φ_p^p + Q″_(p,S)** （11-22）。"]},{"id":"p-ch11-8","title":"炉膛上部布置前屏和后屏时来自炉内的直接辐射","key":true,"source":"课件 p011、p019","items":["进入屏区的来自炉膛的直接辐射热流：**Q″_(p1,f) = q_f″ F_ab / B_cal** （11-23）；**Q″_(p2,f) = q_f″ F_bc / B_cal** （11-24）。","（一）**前屏的计算**：与屏布置在炉膛出口烟窗时的计算**相似**。","（二）**后屏**：进入后屏区域的辐射热，除来自**前屏的穿透辐射**外，还有**直接来自炉膛出口**的炉内直接辐射热。","透过后屏出口截面进入下一级受热面（如高温对流过热器）的穿透辐射能，包括来自炉膛出口的直接辐射和来自前屏区的辐射的穿透辐射；**前者穿透角系数为两个相互垂直平面的角系数，后者则是两个平行平面的角系数**。","p019 图11-3 屏式受热面布置及炉膛出口分界面：**(a)** 屏式过热器布置在炉膛出口；**(b)** 在炉膛上部布置前屏和后屏（图中有前一级入射穿透辐射热、屏空间烟气穿透辐射热及 g1、g2 烟气份额）。"]},{"id":"p-ch11-9","title":"穿透屏区角系数的计算","key":true,"source":"课件 p012","items":["涉及**两个相互垂直平面**和**两个平行平面**的角系数的计算。","两个平行平面的穿透角系数，当 **L/D → ∞** 时：**φp = √[ (D/s₁)² + 1 ] − D/s₁** （11-32）。","其他条件下两个平行平面穿透角系数可通过**曲线图11-4**查得。","两个垂直平面角穿透角系数计算表达式很复杂，一般也通过**曲线图11-5**查得。"]},{"id":"p-ch11-10","title":"第五节 半辐射受热面工质侧和烟气侧热平衡","key":true,"source":"课件 p013","items":["蒸汽在屏管中从进口焓加热至出口焓所需热量包括获得的**炉膛直接辐射热**和吸收的**烟气对流热**。","屏式过热器吸收的对流热量：**Qp^c = D/B_cal (i″ − i′) − Qp^r**，**kJ/kg** （11-33），D 为蒸汽流量。","烟气放热量与屏区对流吸热量（包括屏式受热面及附加受热面的对流吸热量）与屏区空间向下一级受热面的穿透辐射热的总和相平衡：**φ(I′ − I″) = Qp^c + Qc_(p,add) + Q″_(p,S)**，**kJ/kg** （11-34）。","前屏计算时考虑流经前屏的烟气份额，烟气放热量 **φ(I₁′ − I₁″)** （11-35）。","后屏计算时烟气进口焓按从前屏进入和从炉膛直接进入后屏的烟气焓的**加权平均**：**I₂′ = g₁ I₁″ + g₂ I_f′** （11-37）。"]},{"id":"p-ch11-11","title":"第六节 转向室空间辐射传热","key":true,"source":"课件 p014","items":["**空间不大时**：把该烟气空间**一分为二**地归入上下级受热面中，用**加大辐射层有效厚度 S** 的方法加以处理。","**很大空间转向室**：以**进口截面为底面、体积与转向室相同的半球体**来处理。","辐射热流：**qR = σ₀(T₁⁴ − T₂⁴) / [ (1/4)ka R + 1/ε₁ + 1/ε₂ + 1 ] = σ₀(T₁⁴ − T₂⁴) / [ 1/ε_syn + 1/ε₂ + 1 ]** （11-40/42）。","**ε_syn = ε₁ / ( 0.25 ka R ε₁ + 1 )** （10-41）。","**R —— 转向室作为半球体时的当量半径，m**：**R = ( 3V / 8π )^(1/3)**。","辐射传热量：**Qr = qR F / B_cal**，**kJ/kg** （11-43）。"]},{"id":"p-ch11-12","title":"本章小结与作业","key":true,"source":"课件 p016、p017","items":["小结 1：半辐射受热面及其传热特点；2：屏的传热面积；3：半辐射受热面的传热系数及其内涵。","小结 4：屏区烟气辐射放热系数及其计算；5：屏区烟气辐射穿透辐射的计算。","小结 6：炉内直接辐射在屏区的吸收和穿透及其计算（**两种布置形式的屏**）。","小结 7：屏的热平衡及其基本计算公式；8：转向室的辐射。","作业 1：什么叫半辐射式受热面，它有哪些吸热和传热特点？","作业 2：屏式受热面的传热系数公式，以及式中各符号的意义？"]}],"questions":[{"id":"bq-ch11-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p007（1 分）","keyPoints":["半辐射受热面结构特点","横向节距 s₁/d ≫ 4、纵向节距 s₂/d ≈ 1"],"stem":"半辐射受热面的结构特点是","options":[{"k":"A","t":"横向节距很小，纵向节距很大"},{"k":"B","t":"横向节距很大，纵向节距很小"},{"k":"C","t":"横向、纵向节距都很大"},{"k":"D","t":"横向、纵向节距都很小"}],"answer":"B","why":["A ✗ 与课件 p002 原文相反，课件为「横向节距很大，纵向节距小」。","B ✓ 课件 p002 原文：「半辐射受热面结构特点：横向节距很大(s₁/d>>4)，纵向节距小(s₂/d≈1)。」横向很大、纵向很小，完全对应。","C ✗ 课件只讲横向节距很大，纵向节距是「小」，不是都很大。","D ✗ 课件明确横向节距「很大」（s₁/d ≫ 4），不是很小。"],"basis":"课件 p002（原文）：半辐射受热面结构特点：横向节距很大(s₁/d>>4)，纵向节距小(s₂/d≈1)","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准"},{"id":"bq-ch11-2","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p015（1 分）","keyPoints":["屏式过热器对流吸热量公式（11-33）","工质侧热平衡"],"stem":"屏式过热器吸收的对流热量，应等于","options":[{"k":"A","t":"蒸汽在屏管中从进口焓加热至出口焓所需热量加上炉膛直接辐射热"},{"k":"B","t":"蒸汽在屏管中从进口焓加热至出口焓所需热量减去炉膛直接辐射热"},{"k":"C","t":"蒸汽在屏管中从进口焓加热至出口焓所需热量"},{"k":"D","t":"炉膛直接辐射热减去蒸汽在屏管中从进口焓加热至出口焓所需热量"}],"answer":"B","why":["A ✗ 课件 p013 式(11-33)为 Qp^c = D/B_cal (i″−i′) − Qp^r，是**减去**炉膛直接辐射热，不是加上。","B ✓ 课件 p013 原文：「蒸汽在屏管中从进口焓加热至出口焓所需热量包括：获得的炉膛直接辐射热和吸收的烟气对流热。因此，屏式过热器吸收的对流热为 Qp^c = D/B_cal (i″−i′) − Qp^r」，即等于该所需热量（D(i″−i′)/B_cal）**减去**炉膛直接辐射热 Qp^r，与选项 B 一致。","C ✗ 该所需热量由炉膛直接辐射热与对流热两部分组成，不能全部算作对流热量，故需扣除炉膛直接辐射热。","D ✗ 课件中被减数为「从进口焓加热至出口焓所需热量」，减数为炉膛直接辐射热，选项 D 把两者位置颠倒了。"],"basis":"课件 p013（原文）：屏式过热器吸收的对流热为 Qp^c = D/B_cal (i″−i′) − Qp^r，kJ/kg（11-33）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准"},{"id":"bq-ch11-3","kind":"简答","priority":1,"source":"课件作业","sourceDetail":"课件 p017（作业 1）","keyPoints":["半辐射受热面的定义","吸热与传热特点"],"stem":"什么叫半辐射式受热面，它有哪些吸热和传热特点？","why":["定义见课件 p002：「半辐射受热面：布置在炉膛上部或炉膛出口的屏式受热面（如前屏或称大屏、分隔屏，和后屏等）。」","吸热特点见课件 p003（1）（2）（4）（5）条。","传热特点见课件 p003（7）条：「将屏空间辐射与烟气纯对流合并，按对流换热方式进行计算。半辐射受热面壁温偏高，致使传热能力有所下降，需对传热系数进行必要修正。」"],"basis":"课件 p002、p003（原文）","answerNote":"课件未给标准答案，本答案由课件原文归纳，请以老师公布为准","steps":["**定义**：半辐射式受热面是布置在**炉膛上部或炉膛出口**的**屏式受热面**（如前屏或称大屏、分隔屏和后屏等）。","**吸热特点①**：受热面吸热包括**炉内直接辐射热、屏间烟气辐射热和烟气对流热**；而炉内直接辐射**只有部分**照射在屏区受热面上（**角系数小于 1**），其余则**透射过去**落到其后的受热面上。","**吸热特点②**：**烟气焓降**应与所在**空间辐射热和纯对流热**以及该区空间**向后穿透至下一级受热面的辐射热**的总和相平衡。","**吸热特点③**：受热面**积灰状况**一般比炉内水冷壁**严重一些**，热有效系数和有关黑度中**不考虑焦炭项**。","**传热特点**：将**屏空间辐射与烟气纯对流合并，按对流换热方式**进行计算；半辐射受热面**壁温偏高**致使**传热能力有所下降**，需对**传热系数进行必要修正**。"],"result":"定义＝炉膛上部/出口的屏式受热面；吸热＝炉内直接辐射（部分，角系数<1）＋屏间辐射＋对流；传热＝按对流换热计算并修正"},{"id":"bq-ch11-4","kind":"简答","priority":1,"source":"课件作业","sourceDetail":"课件 p017（作业 2）","keyPoints":["屏式受热面传热系数公式","各符号意义"],"stem":"屏式受热面的传热系数公式，以及式中各符号的意义？","why":["公式见课件 p004：K = 1 / [ 1/α₁ + (1 + Qr/Qc)(Rf + 1/α₂) ]，单位 kW/(m²·℃)。","符号意义见课件 p004 标注与说明：「烟气对管壁放热系数」（α₁）、「管外灰污层热阻」（Rf）、「其中 1+Qr/Qc 是考虑屏间辐射和炉内直接辐射导致的灰污表面、金属表面温度升高的影响」「Qc为屏式受热面吸收的对流热（含屏间辐射热）」「Qr[后文中符号为Qpr]为屏式受热面吸收的炉内直接辐射热」。"],"basis":"课件 p004（原文）","answerNote":"课件未给标准答案，本答案由课件原文归纳，请以老师公布为准","steps":["**公式**：`K = 1 / [ 1/α₁ + (1 + Qr/Qc)(Rf + 1/α₂) ]`，单位 **kW/(m²·℃)**","**α₁** —— **烟气对管壁放热系数**","**α₂** —— **管壁对管内工质的放热系数**","**Rf** —— **管外灰污层热阻**","**Qc** —— 屏式受热面吸收的**对流热**（含屏间辐射热）","**Qr**（后文符号为 **Qpr**）—— 屏式受热面吸收的**炉内直接辐射热**","**1 + Qr/Qc** —— 考虑**屏间辐射和炉内直接辐射**导致的**灰污表面、金属表面温度升高**的影响"],"result":"K = 1/[1/α₁ + (1+Qr/Qc)(Rf + 1/α₂)] kW/(m²·℃)"}],"images":{"2":{"w":"img/boiler-ch11/p002.webp","j":"img/boiler-ch11/p002.jpg"},"3":{"w":"img/boiler-ch11/p003.webp","j":"img/boiler-ch11/p003.jpg"},"4":{"w":"img/boiler-ch11/p004.webp","j":"img/boiler-ch11/p004.jpg"},"5":{"w":"img/boiler-ch11/p005.webp","j":"img/boiler-ch11/p005.jpg"},"6":{"w":"img/boiler-ch11/p006.webp","j":"img/boiler-ch11/p006.jpg"},"7":{"w":"img/boiler-ch11/p007.webp","j":"img/boiler-ch11/p007.jpg"},"8":{"w":"img/boiler-ch11/p008.webp","j":"img/boiler-ch11/p008.jpg"},"9":{"w":"img/boiler-ch11/p009.webp","j":"img/boiler-ch11/p009.jpg"},"10":{"w":"img/boiler-ch11/p010.webp","j":"img/boiler-ch11/p010.jpg"},"11":{"w":"img/boiler-ch11/p011.webp","j":"img/boiler-ch11/p011.jpg"},"12":{"w":"img/boiler-ch11/p012.webp","j":"img/boiler-ch11/p012.jpg"},"13":{"w":"img/boiler-ch11/p013.webp","j":"img/boiler-ch11/p013.jpg"},"14":{"w":"img/boiler-ch11/p014.webp","j":"img/boiler-ch11/p014.jpg"},"15":{"w":"img/boiler-ch11/p015.webp","j":"img/boiler-ch11/p015.jpg"},"16":{"w":"img/boiler-ch11/p016.webp","j":"img/boiler-ch11/p016.jpg"},"17":{"w":"img/boiler-ch11/p017.webp","j":"img/boiler-ch11/p017.jpg"},"18":{"w":"img/boiler-ch11/p018.webp","j":"img/boiler-ch11/p018.jpg"},"19":{"w":"img/boiler-ch11/p019.webp","j":"img/boiler-ch11/p019.jpg"}}}]},{"id":"heat","name":"传热学","short":"传热学","meta":"专业基础课 · 导热 / 对流换热","color":"#1971c2","chapters":[]},{"id":"elec","name":"电工学","short":"电工学","meta":"电类基础 · 放大电路 / 运放 / 电源 / 逻辑","color":"#2f9e44","chapters":[]},{"id":"control","name":"机械工程控制基础","short":"控制基础","meta":"控制理论 · 建模 / 时域 / 频域","color":"#7048e8","chapters":[]}]}</script>

    '|_([A-Za-z0-9\\u0370-\\u03ff\\u2032-\\u2037,\\.\\u2212'+SUBCLS+']+)' +  // _xx（不含上标字符，避免 T_i⁴ 被并吞）
    '|(['+SUPCLS+']+)' +                                      // 连续上标
    '|(['+SUBCLS+']+)', 'g');                                 // 连续下标
  function fmtInline(t){
    return t.replace(FMT, function(m, pcaret, careted, subed, sup, sub){
      if(pcaret)  return '<sup>'+fmtInline(pcaret)+'</sup>';
      if(careted) return '<sup>'+careted+'</sup>';
      if(subed)   return '<sub>'+toSub(toSup(subed))+'</sub>';
      if(sup)     return '<sup>'+toSup(sup)+'</sup>';
      if(sub)     return '<sub>'+toSub(sub)+'</sub>';
      return m;
    });
  }
  function rich(s){
    // 顺序：转义 → 排公式（无标签时不会误伤）→ 先 `代码` → 再 **加粗**
    // 先处理代码，可让「**加粗里含 `公式`**」这种嵌套也被正确包住
    var x = fmtInline(esc(s));
    x = x.replace(/`([^`]+)`/g, '<code>$1</code>');
    x = x.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return x;
  }
  function el(tag, cls, html){ var d=document.createElement(tag); if(cls)d.className=cls; if(html!=null)d.innerHTML=html; return d; }
  /* 主题色：按当前科目注入 CSS 变量（未选科目时回落锅炉橙） */
  var DEFAULT_ACCENT = '#e8590c';
  function setAccent(color){
    var c = (color && /^#[0-9a-fA-F]{6}$/.test(color)) ? color : DEFAULT_ACCENT;
    var st = document.documentElement.style;
    st.setProperty('--accent', c);
    st.setProperty('--accent-bg', c + '1f');
    st.setProperty('--accent-soft', c + '14');
    st.setProperty('--accent-line', c + '40');
  }
  function $(id){ return document.getElementById(id); }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

  // 「重点题」= 带考点标签，或本身就是例题/计算题（例题永远入选，不受非重点限额）
  function isKey(q){
    return (q.keyPoints && q.keyPoints.length) || q.kind === '例题' || q.kind === '计算' || q.kind === '简答';
  }
  function stats(ch){
    var qs=(ch&&ch.questions)||[], by={};
    qs.forEach(function(q){ by[q.priority]=(by[q.priority]||0)+1; });
    return { total:qs.length, key:qs.filter(isKey).length, nonKey:qs.filter(function(q){return !isKey(q);}).length, by:by };
  }
  /* ---------- 出题引擎：课件题优先 + 非重点限额 + 错题加权 ---------- */
  function buildQuiz(ch, count){
    var all=(ch.questions||[]).slice(); if(!all.length) return [];
    function score(q){
      var s = q.priority*100;                       // 优先级主导：1 课件题最优先
      if(isKey(q)) s -= 40;                          // 重点题提权
      s -= Math.min(state.wrong[q.id]||0,3)*35;      // 错过的题提权
      s += Math.min(state.right[q.id]||0,2)*30;      // 连对的题降权
      return s;
    }
    var key=all.filter(isKey).sort(function(a,b){return score(a)-score(b);});
    var non=all.filter(function(q){return !isKey(q);}).sort(function(a,b){return score(a)-score(b);});
    var maxNon=Math.floor(count*MAX_NONKEY), out=[];
    key.forEach(function(q){ if(out.length<count) out.push(q); });
    var used=0;
    non.forEach(function(q){ if(out.length<count && used<maxNon){ out.push(q); used++; } });
    non.forEach(function(q){ if(out.length<count && out.indexOf(q)<0) out.push(q); });
    return out.sort(function(a,b){ return a.priority-b.priority; });
  }
  function judge(q, resp){
    if(q.kind==='填空'){
      var norm=function(s){ return String(s==null?'':s).replace(/\s/g,'').replace(/[，,。.；;]/g,''); };
      var a=norm(q.answer), g=norm(resp); if(!g) return false;
      return a.split(/；|;/).filter(Boolean).every(function(p){ return g.indexOf(p)>=0; });
    }
    var x=String(q.answer||'').split('').sort().join('');
    var y=String(resp||'').split('').sort().join('');
    return x.length>0 && x===y;
  }

      tree.innerHTML='';

      (ch.mindmap.children||[]).forEach(function(n,i){ node(n,'0.'+i,1,tree); });
    }
    function node(n,path,depth,parent){
      var kids=n.children||[], open=!!openSet[path];
      var box=el('div','tnode'); parent.appendChild(box);
      var row=el('div','trow');
      var dot=el('div', kids.length?('dot'+(open?' open':'')):'dot leaf', kids.length?(open?'−':'+'):'');
      var lb=el('div','lb '+(depth===1?'lv1':'lv2'), rich(n.label));
      row.appendChild(dot); row.appendChild(lb); box.appendChild(row);
      if(kids.length){
        row.onclick=function(){ if(open) delete openSet[path]; else openSet[path]=1; render(); };
        if(open) kids.forEach(function(k,j){ node(k,path+'.'+j,depth+1,box); });
      }
    }
    function collect(n,path,out){ out.push(path); (n.children||[]).forEach(function(c,i){ collect(c,path+'.'+i,out); }); return out; }
    b1.onclick=function(){ openSet={}; collect(ch.mindmap,'r',[]).forEach(function(p){ if(p!=='r') openSet[p]=1; }); render(); };
    b2.onclick=function(){ openSet={}; render(); };
    // 默认展开第一层

    render();
    card.appendChild(tree); wrap.appendChild(card); root.appendChild(wrap);
  }

  /* --- 课件配图 --- */
  // 从 source 文本里抽出被引用的页码
  function srcPages(txt){
    var out=[];
    String(txt||'').replace(/(?:课件\s*)?(?:p|slide\s*)(\d{1,3})/g,function(m,n){
      var v=parseInt(n,10); if(v>=1&&v<=400&&out.indexOf(v)<0) out.push(v); return m;
    });
    return out.sort(function(a,b){return a-b;});
  }
  // 图片基路径（构建时注入：PWA 版为 img/，单文件版为 ../docs/img/）
  var IMGBASE = 'img/';

  var MMBASE = 'mindmap/';
  function imgURL(p){ return IMGBASE + String(p).replace(/^img\//, ''); }
  // 该章节有哪些图（值形如 {w:'...webp', j:'...jpg'}，兼容旧的纯字符串）
  function imgOf(ch){ return (ch&&ch.images)||{}; }
  function pickImg(v){
    if(!v) return null;
    if(typeof v === 'string') return { w: v, j: null };
    return { w: v.w || null, j: v.j || null };
  }
  // 生成配图条：用 <a href> 原生打开图片（新标签/系统看图器），不依赖覆盖层
  function thumbsHTML(ch, srcText, extraPages){
    var im=imgOf(ch); if(!im) return '';
    var pages=srcPages(srcText);
    (extraPages||[]).forEach(function(p){ if(pages.indexOf(p)<0) pages.push(p); });
    pages.sort(function(a,b){return a-b;});
    var use=pages.map(function(p){ return [p, pickImg(im[String(p)])]; })
                 .filter(function(x){ return x[1] && (x[1].w||x[1].j); });
    if(!use.length) return '';
    var h='<div class="thumbs">';
    use.forEach(function(x){
      var p=x[0], v=x[1];
      var w=v.w?imgURL(v.w):null, j=v.j?imgURL(v.j):null;
      var inner='<img loading="lazy" src="'+esc(j||w)+'" alt="课件 p'+p+'">';
      var media=(w && j)
        ? '<picture><source srcset="'+esc(w)+'" type="image/webp">'+inner+'</picture>'
        : inner;
      h+='<a class="thumb" href="'+esc(j||w)+'" target="_blank" rel="noopener" title="点击查看原图 p'+p+'">'+
         media+'<div class="pg">p'+p+'</div><div class="zoom">查看</div></a>';
    });
    return h+'</div>';
  }

        '<span class="chip">'+esc(q.kind)+'</span>'+

        (q.sourceDetail?'<span class="small muted">'+esc(q.sourceDetail)+'</span>':'')));
