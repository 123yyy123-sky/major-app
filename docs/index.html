":"img/test-ch3/p117.webp","j":"img/test-ch3/p117.jpg"},"119":{"w":"img/test-ch3/p119.webp","j":"img/test-ch3/p119.jpg"},"120":{"w":"img/test-ch3/p120.webp","j":"img/test-ch3/p120.jpg"},"121":{"w":"img/test-ch3/p121.webp","j":"img/test-ch3/p121.jpg"},"122":{"w":"img/test-ch3/p122.webp","j":"img/test-ch3/p122.jpg"},"123":{"w":"img/test-ch3/p123.webp","j":"img/test-ch3/p123.jpg"},"124":{"w":"img/test-ch3/p124.webp","j":"img/test-ch3/p124.jpg"},"125":{"w":"img/test-ch3/p125.webp","j":"img/test-ch3/p125.jpg"},"126":{"w":"img/test-ch3/p126.webp","j":"img/test-ch3/p126.jpg"}}},{"id":"test-ch4","name":"第四章 测试系统的特性","subtitle":"线性系统 · 静态与动态特性 · 不失真测量 · 负载效应","status":"在读","overview":"讲测试系统自身的特性，也就是「量出来的数可不可信」。先给测试系统的基本要求与线性系统的四条主要性质，再分静态和动态两块：静态响应特性讲灵敏度、非线性度、回程误差等指标；动态特性讲传递函数、频率响应函数（幅频、相频、实频、虚频特性与 Bode 图、Nyquist 图）、脉冲响应函数，以及环节的串联并联与高阶系统分解为一阶二阶环节。重点讨论一阶系统（时间常数）与二阶系统（K、ω_n、ζ）的频率特性与阶跃响应，给出不失真测量的时域条件与频域条件。然后讲动态特性参数的实验测定（时间常数、阻尼比、固有频率）与动态响应特性测试，最后讲负载效应、测量系统的抗干扰，并以课堂讨论收尾。","mindmap":{"label":"第四章 测试系统的特性","children":[{"label":"测试系统概论","children":[{"label":"测试系统是传感器、仪器和设备的总称"},{"label":"问题简化为输入x(t)、h(t)、输出y(t)的关系"},{"label":"复杂系统也可作为系统来看待"},{"label":"简单测试系统示例：光电池"},{"label":"复杂测试系统示例：轴承缺陷检测"},{"label":"三类问题之一：系统辨识"},{"label":"三类问题之二：反求输入量"},{"label":"三类问题之三：预测输出量"}]},{"label":"测试系统基本要求","children":[{"label":"应具有单值、确定的输入-输出关系"},{"label":"每一输入量只有单一输出量与之对应"},{"label":"知道其中一个量就可确定另一个量"},{"label":"以输出和输入成线性关系最佳"}]},{"label":"4.1 线性系统及其主要性质","children":[{"label":"1 时不变（定常）线性系统的微分方程"},{"label":"系数a_i、b_j为常数且n≥m"},{"label":"输出与输入加入的时间无关"},{"label":"2 线性系统性质之a)叠加性"},{"label":"b)比例性：常数倍输入得常数倍输出"},{"label":"c)微分性：输入微分对应输出微分"},{"label":"d)积分性：零初始条件下积分对应积分"},{"label":"e)频率保持性：稳态输出与输入同频率"},{"label":"叠加原理与频率保持性在测量中很重要"}]},{"label":"4.2 测试系统静态响应特性","children":[{"label":"输入输出不随时间变化即为静态测量"},{"label":"A 灵敏度：S=Δy/Δx"},{"label":"B 非线性度：B_max/A×100%"},{"label":"C 回程误差：(h_max/A)×100%"},{"label":"D 其他描述共六个指标"},{"label":"精度：与测量误差大小有关"},{"label":"灵敏阀：又称死区"},{"label":"分辨力：引起输出变化的最小输入变化量"},{"label":"测量范围：最小与最大输入量之间"},{"label":"稳定性：输入不变时输出随时间变化的程度"},{"label":"可靠性：与无故障工作时间长短有关"}]},{"label":"4.3 测试系统的动态特性","children":[{"label":"动态特性是输入随时间变化时的输出关系"},{"label":"测量范围内可认为系统是线性的"},{"label":"四个部分：传递特性描述、典型激励响应"},{"label":"任意输入响应、特性参数实验测定"},{"label":"传递函数用拉普拉斯变换"},{"label":"频率响应函数用傅里叶变换"},{"label":"拉氏变换：F(s)=∫_0^{+∞}f(t)e^{-st}dt"},{"label":"f(t)为像原函数，F(s)为像函数"},{"label":"δ函数拉氏变换为1"},{"label":"延时δ(t-t_0)的变换为e^{-st_0}"},{"label":"微分性质：L[f′(t)]=sF(s)-f(0)"},{"label":"传递函数是零初始条件下输出与输入的拉氏变换之比"},{"label":"传递函数与输入及初始状态无关"},{"label":"只反映传输特性，与物理结构无关"},{"label":"2 频率响应函数","children":[{"label":"用 s=jω 替换传递函数中的 s 得到"},{"label":"定义为稳态输出与输入傅里叶变换之比"},{"label":"反映各频率正弦激励下的稳态响应"},{"label":"H(ω)=P(ω)+jQ(ω)=A(ω)e^{jφ(ω)}"},{"label":"幅频特性为 H(ω) 的模 A(ω)"},{"label":"相频特性为幅角 φ(ω)"},{"label":"实频特性 P(ω)、虚频特性 Q(ω)"},{"label":"图像描述：幅相曲线、Bode 图、Nyquist 图"}]},{"label":"3 脉冲响应函数","children":[{"label":"输入 x(t)=δ(t) 时 X(s)=1"},{"label":"输出 Y(s)=H(s)X(s)=H(s)"},{"label":"h(t)=L^{-1}[H(s)] 为脉冲响应函数"},{"label":"h(t) 又称系统的权函数"}]},{"label":"4 环节的串联和并联","children":[{"label":"串联总传递函数为各环节传递函数之积"},{"label":"串联时幅频相乘、相频相加"},{"label":"并联总传递函数为各环节传递函数之和"},{"label":"高阶系统分母分解为一次和二次因式"},{"label":"高阶系统可看成若干一、二阶系统串并联"}]}]},{"label":"4.5 一阶和二阶系统的特性","children":[{"label":"一阶系统微分方程与传递函数"},{"label":"K=b₀/a₀ 为系统静态灵敏度"},{"label":"τ=a₁/a₀ 为系统时间常数"},{"label":"液柱式温度计为一阶惯性系统"},{"label":"一阶系统幅频与相频特性曲线"},{"label":"二阶系统参数 K、ω_n、ζ"},{"label":"二阶系统频率响应与脉冲响应函数"},{"label":"二阶系统 Nyquist 图与 Bode 图"},{"label":"ω=ω_n 时共振且 A(ω)=1/(2ζ)"},{"label":"Bode 图可用 0dB 线与 -40dB/dec 近似"}]},{"label":"不失真测量条件","children":[{"label":"二阶系统相频特性随频率变化规律"},{"label":"一般取 ω ≤ (0.6~0.8)ω_n、ξ = 0.65~0.7"},{"label":"不失真测量的时域条件 y(t)=A₀x(t-t₀)"},{"label":"频域条件 A(ω)=A₀=常数、φ(ω)=-t₀ω"},{"label":"幅频图为水平直线、相频图为过原点直线"},{"label":"频率响应法优点简单、缺点效率低"}]},{"label":"测试系统的动态响应特性测试","children":[{"label":"1 脉冲响应函数 y(t)=F^{-1}[H(S)]"},{"label":"2 阶跃响应函数 y(t)=L^{-1}[H(s)/s]"},{"label":"3. 一阶系统与时间常数 τ"},{"label":"4. 二阶系统与 ω_n、ξ、M、M₁、M₂"},{"label":"时域波形参数识别、直观但只宜识别简单系统"},{"label":"脉冲响应函数测量案例：桥梁固有频率测量"}]},{"label":"测试系统特性参数的实验测定","children":[{"label":"1 一阶系统动态特性参数测定"},{"label":"静态灵敏度 K 由静态标定得到"},{"label":"达到最终稳定值 63.2% 的时间即时间常数 τ"},{"label":"由 Z=ln[1-y(t)] 直线求 τ=-Δt/ΔZ"},{"label":"2 二阶系统动态特性参数测定"},{"label":"脉冲响应/阶跃响应函数法与传递函数法"}]},{"label":"负载效应","children":[{"label":"接入的测量装置构成被测对象的负载"},{"label":"前后环节存在能量交换与相互影响"},{"label":"未接入时 U₀=ER₂/(R₂+R₁)"},{"label":"接入后 U₁=ER₂R_m/[R₁(R_m+R₂)+R_mR₂]"},{"label":"实例误差 28.6%，负载加大到 1M 后降为 5.76%"}]},{"label":"测量系统的抗干扰","children":[{"label":"一、测量装置的干扰源"},{"label":"电磁干扰、信道干扰、电源干扰"},{"label":"屏蔽与正确接地去除电磁波干扰"},{"label":"交流稳压器、隔离稳压器抑制电源干扰"},{"label":"印刷电路板元件合理排放增强信道抗扰性"},{"label":"案例：音响系统性能评定"}]},{"label":"课堂讨论题","children":[{"label":"发动机振动测试非线性误差 0.8%"},{"label":"固有频率 500Hz 导致实测数据失真"},{"label":"静态特性（非线性误差）对结果的影响"},{"label":"动态特性（固有频率）对结果的影响"}]}]},"points":[{"id":"p-c4a-1","title":"目录与本章学习要求","key":true,"source":"课件 p001–p003","items":["课件目录（Contents）共 6 项：1 绪论、2 常用传感器原理、3 信号的描述方法、4 测试系统的特性、5 信号的调理方法、6 信号分析与处理；p002 为同一目录页，第 4 项「测试系统的特性」被标绿，表示进入本章。","章内页眉与封面章名均为「测试系统的特性」，故本章标题为：测试系统的特性。","本章学习要求 4 条：1.建立测试系统的概念；2.掌握测试系统的动态特性；3.了解测试系统特性对测量结果的影响；4.了解测试系统特性的测量方法。","课件标明：重点为「测试系统的动态特性」，难点为「测试系统的频率响应特性」，预备知识为「拉普拉斯变换」。"]},{"id":"p-c4a-2","title":"测试系统概论","key":true,"source":"课件 p004","items":["小标题「测试系统概论」；定义：测试系统是执行测试任务的传感器、仪器和设备的总称。","简单测试系统（光电池）：光电池把光信号变为电信号，用电压表读数，课件在信号线上标注「失真」，说明简单系统会带来失真。","复杂测试系统（轴承缺陷检测）：由轴承座上的传感器依次经过多级环节（含滤波、放大等框图）最终输出波形，环节用方框与信号波形示意。"]},{"id":"p-c4a-3","title":"系统分析中的三类问题","key":true,"source":"课件 p005","items":["无论复杂度如何，把测量装置作为一个系统来看待。问题简化为处理输入量 x(t)、系统传输特性 h(t)和输出 y(t)三者之间的关系。","框图中系统用 h(t) / H(s) 表示，左端输入写作 x(t) / X(s)，右端输出写作 y(t) / Y(s)，即把问题放在时域与复频域两个域中描述。","1) 当输入、输出是可测量的(已知)，可以通过它们推断系统的传输特性。（系统辨识）","2) 当系统特性已知，输出可测量，可以通过它们推断导致该输出的输入量。（反求）","3) 如果输入和系统特性已知，则可以推断和估计系统的输出量。（预测）"]},{"id":"p-c4a-4","title":"测试系统基本要求","key":true,"source":"课件 p006","items":["小标题「测试系统基本要求」。","理想的测试系统应该具有单值的、确定的输入 - 输出关系。对于每一输入量都应该只有单一的输出量与之对应。","知道其中一个量就可以确定另一个量。其中以输出和输入成线性关系最佳（课件中「线性关系」标红）。","配图三幅散点图：正相关线性、负相关线性、非线性，用于对照输入输出的关系类型。"]},{"id":"p-c4a-5","title":"时不变（定常）线性系统","key":true,"source":"课件 p008","items":["小节标题「4.1 线性系统及其主要性质」，其下第 1 点为「1 时不变（定常）线性系统」。","系统用常系数微分方程描述：`a_n d^n y(t)/dt^n + a_{n-1} d^{n-1}y(t)/dt^{n-1} + … + a_1 dy(t)/dt + a_0 y(t) = b_m d^m x(t)/dt^m + b_{m-1} d^{m-1}x(t)/dt^{m-1} + … + b_1 dx(t)/dt + b_0 x(t)`。","其中，`a_i (i=0,1,…,n)`、`b_j (j=0,1,…,m)` 为常数，`n≥m`。","时不变线性系统输出与输入加入的时间无关。"]},{"id":"p-c4a-6","title":"线性系统性质：叠加比例微分","key":true,"source":"课件 p009","items":["小标题「2 线性系统性质」。","a) 叠加性：系统对各输入之和的输出等于各个单个输入输出之和，即 若 `x1(t)→y1(t)`，`x2(t)→y2(t)`，则 `x1(t)±x2(t)→y1(t)±y2(t)`。","b) 比例性：常数倍输入所得的输出等于原输入所得输出的常数倍，即：若 `x(t)→y(t)`，则 `kx(t)→ky(t)`。","c) 微分性：系统对原输入信号的微分等于原输出信号的微分，即 若 `x(t)→y(t)`，则 `x'(t)→y'(t)`。"]},{"id":"p-c4a-7","title":"积分性与频率保持性","key":true,"source":"课件 p010","items":["d) 积分性：当初始条件为零时，系统对原输入信号的积分等于原输出信号的积分，即 若 `x(t)→y(t)`，则 `∫x(t)dt→∫y(t)dt`。","e) 频率保持性：若系统的输入为某一频率的谐波信号，则系统的稳态输出将为同一频率的谐波信号，即 若 `x(t)=Acos(ωt+φx)`，则 `y(t)=Bcos(ωt+φy)`。","课件结论：线性系统的这些主要特性，特别是符合叠加原理和频率保持性，在测量工作中具有重要作用。"]},{"id":"p-c4a-8","title":"静态响应特性与三个指标","key":true,"source":"课件 p011–p012","items":["小节标题「4.2 测试系统静态响应特性」。定义：如果测量时，测试装置的输入、输出信号不随时间而变化，则称为静态测量；静态测量时，测试装置表现出的响应特性称为静态响应特性。","A 灵敏度：当测试装置的输入 x 有一增量 Δx，引起输出 y 发生相应的变化 Δy 时，则定义 `S=Δy/Δx`，图中以定标直线上的 Δy 与 Δx 之比表示。","B 非线性度：标定曲线与拟合直线的偏离程度就是非线性度，`非线性度=B_max/A×100%`，图中标注标定曲线、拟合直线、最大偏差 B 与满量程输出 A。","C 回程误差：测试装置在输入量由小增大和由大减小的测试过程中，对于同一个输入量所得到的两个数值不同的输出量之间差值最大者为 `h_max`，则定义回程误差为 `回程误差=(h_max/A)×100%`。"]},{"id":"p-c4a-9","title":"静态响应特性的其他描述","key":true,"source":"课件 p013","items":["小标题「D 静态响应特性的其他描述」，逐条给出 6 个指标的定义。","精度：是与评价测试装置产生的测量误差大小有关的指标。","灵敏阀：又称为死区，用来衡量测量起始点不灵敏的程度。","分辨力：指能引起输出量发生变化时输入量的最小变化量，表明测试装置分辨输入量微小变化的能力。","测量范围：是指测试装置能正常测量最小输入量和最大输入量之间的范围。","稳定性：是指在一定工作条件下，当输入量不变时，输出量随时间变化的程度。","可靠性：是与测试装置无故障工作时间长短有关的一种描述。"]},{"id":"p-c4a-10","title":"动态特性与两种基本方法","key":true,"source":"课件 p014–p015","items":["小节标题「4.3 测试系统的动态特性」，内容分 4 部分：(一) 用传递函数或频率响应函数描述系统的传递特性；(二) 测试系统对典型激励的响应函数；(三) 测试系统对任意输入的响应；(四) 测试系统特性参数的实验测定。","测试系统的动态特性是指输入量随时间变化时，其输出随输入而变化的关系。","一般地，在所考虑的测量范围内，测试系统可以认为是线性系统。","基本方法：传递函数——拉普拉斯变换（Laplace transform）；频率响应函数——傅里叶变换（Fourier transform）。"]},{"id":"p-c4a-11","title":"拉普拉斯变换的定义","key":true,"source":"课件 p016","items":["小标题「2 拉普拉斯变换」。定义 2.2：设 `f(t)` 为定义在 `(0, +∞)` 上的实值(或复值)函数，其收敛的拉普拉斯积分 `F(s)=∫_0^{+∞} f(t)e^{-st}dt`（`s` 为复参量）（式 2.3）。","建立的从 `f(t)` 到 `F(s)` 的对应称作拉普拉斯变换（简称拉氏变换）。用字母 `L` 表达，即 `F(s)=L[f(t)]`（式 2.4）。","称 `f(t)` 为 L 变换的像原函数，`F(s)` 为 L 变换的像函数。"]},{"id":"p-c4a-12","title":"δ函数与微分性质","key":true,"source":"课件 p017–p018","items":["求 δ 函数的拉普拉斯变换：`L[δ(t)]=∫_{0^-}^{+∞} δ(t)e^{-st}dt = ∫_{-∞}^{+∞} δ(t)e^{-st}dt = 1`。","如果脉冲出现在 `t=t_0` 时刻(`t_0>0`)，有 `L[δ(t-t_0)]=∫_{0^-}^{+∞} δ(t-t_0)e^{-st}dt = ∫_{-∞}^{+∞} δ(t-t_0)e^{-st}dt = e^{-st_0}`。","微分性质（1）像原函数的微分性质：`L[f'(t)]=sF(s)-f(0)`（式 2.13）；`L[f^{(n)}(t)]=s^n F(s)-s^{n-1}f(0)-s^{n-2}f'(0)-…-f^{n-1}(0)`（`Re(s)>c_0`）（式 2.14）。","（2）像函数的微分性质：`F'(s)=L[-tf(t)]`、`F^{(n)}(s)=L[(-t)^n f(t)]`（`Re(s)>c_0`）（式 2.15、2.16）。","证明思路（1）：由 `L[f'(t)]=∫_0^{+∞} f(t)e^{-st}dt = f(t)e^{-st}|_0^{+∞} + s∫_0^{+∞} f(t)e^{-st}dt = sL[f(t)]-f(0)`，得 `L[f'(t)]=sF(s)-f(0)`。"]},{"id":"p-c4a-13","title":"传递函数的概念","key":true,"source":"课件 p019","items":["小标题「1 传递函数」→「1）传递函数的概念」。","传递函数：是指零初始条件下，定常线性系统输出量的拉普拉斯变换与引起该输出的输入量拉普拉斯变换之比。","考虑定常线性系统(`n≥m`)，其微分方程同 4.1 节所述形式。","当系统初始条件全为零时，对上式进行拉普拉斯变换可得系统传递函数为：`H(s)=Y(s)/X(s)=(b_m s^m + b_{m-1}s^{m-1} + … + b_1 s + b_0)/(a_n s^n + a_{n-1}s^{n-1} + … + a_1 s + a_0)`（`n≥m`）。"]},{"id":"p-c4a-14","title":"传递函数的特点","key":true,"source":"课件 p020","items":["小标题「2）传递函数的特点」。","`H(s)` 与输入 `x(t)` 及系统的初始状态无关。如果 `x(t)` 给定，则系统输出的特性完全由 `H(s)` 决定，即传递函数表征了系统内在的固有动态特性。","`H(s)` 只反映系统传输特性，而和系统具体物理结构无关。即同一形式的传递函数可表征具有相同传输特性的不同物理系统。","实际物理系统中，输入与输出间的量纲变换关系在传递函数中通过系数 `a_i (i=0,1,…,n)` 和 `b_j (j=0,1,…,m)` 来反映，`a_i` 和 `b_j` 的量纲由具体物理系统决定。","`H(s)` 的分母取决于系统的结构，分子则和系统与外界之间的关系，如输入（激励）点的位置、输入方式、被测量及测点布置情况有关。"]},{"id":"p-c4b-1","title":"频率响应函数的概念","key":true,"source":"课件 p022–p023","items":["利用 `s=jω` 替换传递函数中的 s 可得**频率响应函数**。","频率响应函数是指零初始条件下，定常线性系统稳态输出量的傅里叶变换与引起该输出的输入量傅里叶变换之比。","频率响应函数反映了测试系统在各个频率正弦信号激励下的稳态响应特性。","频率响应函数的表达式为 `H(ω)=(b_m (jω)^m+b_{m-1}(jω)^{m-1}+…+b_1 (jω)+b_0)/(a_n (jω)^n+a_{n-1}(jω)^{n-1}+…+a_1 (jω)+a_0)`。"]},{"id":"p-c4b-2","title":"频率特性的复数表示","key":true,"source":"课件 p023","items":["频率特性 `H(ω)=H(s)|_{s=jω}` 为复数，可以表示为 `H(ω)=P(ω)+jQ(ω)=A(ω)e^{jφ(ω)}`。","幅值 `A(ω)=|H(jω)|=√(P^2 (ω)+Q^2 (ω))`。","相角 `φ(ω)=∠H(jω)=arctan(Q(ω)/P(ω))`。"]},{"id":"p-c4b-3","title":"幅频相频实频虚频特性","key":true,"source":"课件 p024","items":["**幅频特性**：`H(ω)` 的模 `A(ω)` 反映了定常线性系统在正弦信号激励下，其稳态输出信号与输入信号的幅值比。","**相频特性**：幅角 `φ(ω)` 反映了稳态输出信号与输入信号的相位差（即延时）。","**频率特性**：是指幅频特性与相频特性统称，即系统在正弦信号激励下，其稳态输出与输入的幅值比及相位差随激励频率 ω 变化的特性。","**实频特性**：`H(ω)` 的实部 `P(ω)`。","**虚频特性**：`H(ω)` 的虚部 `Q(ω)`。"]},{"id":"p-c4b-4","title":"幅相频率特性的图像描述","key":true,"source":"课件 p025–p026","items":["幅频特性及相频特性曲线：幅频特性曲线为 `A(ω)` - `ω`，相频特性曲线为 `φ(ω)` - `ω`。","**Bode 图（对数频率特性图）**：对数幅频特性曲线为 `20lgA(ω)`（dB）- `logω`，对数相频特性曲线为 `φ(ω)` - `logω`。","实频特性及虚频特性曲线：实频特性曲线为 `P(ω)` - `ω`，虚频特性曲线为 `Q(ω)` - `ω`。","**Nyquist 图（奈奎斯特图、极坐标图）**：以 `Q(ω)` - `P(ω)` 作图。","课件给出一阶系统的伯德图与乃奎斯特图：伯德图纵轴为 `20lgA(ω)`（dB）与 `φ(ω)`，横轴为 `1/10τ`、`1/τ`、`10/τ`；Nyquist 图上有 `ω=0`、`ω=∞`、`ω=ω_n` 与 `2ζ` 的标注。"]},{"id":"p-c4b-5","title":"脉冲响应函数与权函数","key":true,"source":"课件 p028","items":["若系统输入 `x(t)=δ(t)`，则 `X(s)=1`，相应输出为 `Y(s)=H(s)X(s)=H(s)`。","`y(t)=L^{-1}[H(s)]=h(t)`，则 `h(t)` 称为系统的**脉冲响应函数**或**权函数**。"]},{"id":"p-c4b-6","title":"环节的串联","key":true,"source":"课件 p029","items":["串联系统由 `H_1(s)`、`H_2(s)`…`H_n(s)` 依次连接，输入为 `X(s)`，输出为 `Y(s)`。","总传递函数为 `H(s)=∏_{i=1}^{n} H_i (s)`。","相应系统的频率响应函数为 `H(ω)=∏_{i=1}^{n} H_i (ω)`。","其幅频、相频特性为 `A(ω)=∏_{i=1}^{n} A_i (ω)`，`φ(ω)=∑_{i=1}^{n} φ_i (ω)`。"]},{"id":"p-c4b-7","title":"环节的并联与高阶分解","key":true,"source":"课件 p030","items":["并联系统总传递函数为 `H(s)=∑_{i=1}^{n} H_i (s)`，相应系统的频率响应函数为 `H(ω)=∑_{i=1}^{n} H_i (ω)`。","高阶系统的传递函数的分母部可以分解成 s 的一次和二次实系数因式，即 `a_n s^n+a_{n-1}s^{n-1}+…+a_1 s+a_0=a_n ∏_{i=1}^{r}(s+p_i) ∏_{i=1}^{(n-r)/2}(s^2+2ζ_i ω_{ni} s+ω_{ni}^2)`。","故系统的传递函数可改写为 `H(s)=∑_{i=1}^{r} q_i/(s+p_i)+∑_{i=1}^{(n-r)/2} (α_i s+β)/(s^2+2ζ_i ω_{ni} s+ω_{ni}^2)`。","上式表明：任何一个高阶系统，总可以看成是由若干个一阶、二阶系统串、并联而成。"]},{"id":"p-c4b-8","title":"一阶系统特性","key":true,"source":"课件 p031","items":["若系统满足 `a_1 (dy(t))/dt+a_0 y(t)=b_0 x(t)`，则称该系统为一阶测试系统或一阶惯性系统。","`K=b_0/a_0` 为系统静态灵敏度；`τ=a_1/a_0` 为系统时间常数。","作拉氏变换，有 `(τs+1)Y(s)=KX(s)`。","故系统的传递函数为 `H(s)=Y(s)/X(s)=K/(τs+1)`。"]},{"id":"p-c4b-9","title":"一阶系统例题与幅相特性","key":true,"source":"课件 p032–p033","items":["例：液柱式温度计的输入与输出间有下述关系 `(T_o (t)-T_i (t))/R=C dT_o (t)/dt`，其中 `R` 为传导介质的热阻，`C` 为温度计的热容量。","两边作拉普拉斯变换，并令 `τ=RC`（τ 为温度计时间常数），则有 `τsT_o (s)+T_o (s)=T_i (s)`。","系统的传递函数为 `H(s)=T_o (s)/T_i (s)=1/(τs+1)`，系统的频率响应函数为 `H(jω)=1/(jτω+1)`。","系统的幅频特性为 `A(ω)=|H(jω)|=1/√(1+(τω)^2)`，相频特性为 `φ(ω)=∠H(jω)=-arctan ωτ`。","课件给出的一阶系统幅频与相频特性图中，横坐标为 `ωτ`，幅频图纵坐标为 `A(ω)`，相频图纵坐标为 `φ(ω)`（0 到 -90°）。"]},{"id":"p-c4b-10","title":"二阶系统参数与传递函数","key":true,"source":"课件 p035–p036","items":["二阶系统的微分方程为 `a_2 (d^2 y(t))/dt^2+a_1 (dy(t))/dt+a_0 y(t)=b_0 x(t)`。","`K=b_0/a_0` 为系统静态灵敏度；`ω_n=√(a_0/a_2)` 为系统无阻尼固有频率（rad/s）；`ζ=a_1/(2√(a_0 a_2))` 为系统阻尼比。","并微分方程两边作拉普拉斯变换得 `(s^2/ω_n^2+2ζs/ω_n+1)Y(s)=KX(s)`。","系统的传递函数为 `H(s)=Y(s)/X(s)=K/(s^2/ω_n^2+2ζs/ω_n+1)`。","系统的频率响应函数则为 `H(jω)=Y(ω)/X(ω)=K/((jω/ω_n)^2+2jζω/ω_n+1)=K/((1-ω^2/ω_n^2)+2jζω/ω_n)`。"]},{"id":"p-c4b-11","title":"例题：测力弹簧秤","key":true,"source":"课件 p037–p038","items":["图2.64 示出一个测力弹簧秤，它是一个二阶系统；设系统初始状态为零，即 `x_o=0`，`f_i=0`。","由牛顿第二定律得 `f_i-B dx_o/dt-K_s x_o=M d^2 x_o/dt^2`。","式中 `f_i` 为施加的力（N）；`x_o` 为指针移动距离（m）；`B` 为系统阻尼常数（N/m/s）；`K_s` 为弹簧系数（N/m）。","作拉普拉斯变换有 `(Ms^2+Bs+K_s)X(s)=F(s)`。","令 `ω_n=√(K_s/M)`（rad/s）、`ζ=B/(2√(K_s M))`、`K=1/K_s`（m/N），上式变为 `(s^2/ω_n^2+2ζs/ω_n+1)X(s)=F(s)`。","于是弹簧秤系统的传递函数为 `H(s)=X(s)/F(s)=K/(s^2/ω_n^2+2ζs/ω_n+1)`。"]},{"id":"p-c4b-12","title":"二阶系统的频率与脉冲特性","key":true,"source":"课件 p039","items":["频率特性 `H(ω)=ω_n^2/((jω)^2+2ζω_n (jω)+ω_n^2)=1/(1-(ω/ω_n)^2+j2ζω/ω_n)`。","幅频特性 `A(ω)=|H(ω)|=1/√([1-(ω/ω_n)^2]^2+4ζ^2 (ω/ω_n)^2)`。","相频特性 `φ(ω)=-arctan(2ζω/ω_n/(1-(ω/ω_n)^2))`。","脉冲响应函数 `h(t)=(ω_n/√(1-ζ^2))e^{-ζω_n t} sin(√(1-ζ^2) ω_n t)`，（t≥0，0≤ζ≤1）。"]},{"id":"p-c4b-13","title":"二阶系统图像与特点","key":true,"source":"课件 p040–p042","items":["课件给出二阶系统（0<ζ<1）的 Nyquist 图，图上取 `ζ=0.8`、`ζ=0.6`、`ζ=0.4` 三条曲线，并标注 `ω=0`、`ω=∞`、`ω=ω_n` 与 `-1/(2ζ)`。","课件给出二阶系统的 Bode 图，对数幅频曲线纵轴为 `L(ω)/dB`、横轴为 `ω/ω_n`；对数相频曲线纵轴为 `φ(ω)/°`、横轴为 `ω/ω_n`，并画出 `ζ=0.05、0.1、0.2、0.3、0.5、0.7、1.0` 各条曲线及渐近线。","`ω<<ω_n` 时，`H(ω)≈1`；`ω>>ω_n` 时，`H(ω)→0`。","`ω_n` 和 `ζ` 的大小影响二阶系统的动态特性，且在通常使用的频率范围内，`ω_n` 的影响最为重要；`ω=ω_n` 时，`A(ω)=1/(2ζ)`，`φ(ω)=90°`，且在 `ω=ω_n` 附近，系统发生共振，可利用此特性测量系统本身的参数。","`ω<0.5ω_n` 时，二阶系统 Bode 图可用 0dB 线近似；`ω>2ω_n` 时，可用斜率为 -40dB/dec 的直线近似；`ω=(0.5~2)ω_n` 时，因共振，近似线误差较大，在 `ω≈ω_n` 处误差最大（误差大小与 ζ 有关）。"]},{"id":"p-c4c-1","title":"二阶系统相频特性规律","key":true,"source":"课件 p043","items":["`ω<<ω_n` 时，`φ(ω)` 很小，且和频率近似成正比增加；`ω>>ω_n` 时，`φ(ω)→-180°`。","`ω` 靠近 `ω_n` 时，`φ(ω)` 变化剧烈，且 `ξ` 越小，变化越剧烈。","二阶系统是振荡环节，对测试系统而言，为了减少频率特性不理想所引起的误差，一般取 `ω ≤ (0.6 ~ 0.8)ω_n`，`ξ = 0.65 ~ 0.7`。","此时，`φ(ω)` 与 `ω/ω_n` 近似成线性关系，系统响应速度较快且误差较小。"]},{"id":"p-c4c-2","title":"不失真测量的时域条件","key":true,"source":"课件 p045","items":["节标题为「4.5 不失真测量条件」。","设测试系统的输出 y(t) 与输入 x(t) 满足关系 `y(t) = A₀x(t-t₀)`，图上用红箭头标注这就是「时域条件」。","该测试系统的输出波形与输入信号的波形精确地一致，只是幅值放大了 A₀ 倍，在时间上延迟了 t₀ 而已。","这种情况下，认为测试系统具有不失真的特性。","图中画出输入 `x(t)`、同相放大波形 `y(t)=A₀x(t)` 与延迟波形 `y(t)=A₀x(t-t₀)`，横轴为 t，并标出延迟时间 t₀。"]},{"id":"p-c4c-3","title":"不失真条件的频域定义","key":true,"source":"课件 p046","items":["对 `y(t)=A₀x(t-t₀)` 做傅立叶变换，得 `Y(ω)=A₀e^{-jωt₀}X(ω)`。","不失真测试系统条件的幅频特性和相频特性应分别满足：`A(ω)=A₀=常数`、`φ(ω)=-t₀ω`。","图上用红箭头标注该组条件为「频域定义」。","幅频图（纵轴 A 从 0.1 到 2.0，横轴 ω 从 0.1 到 10）中 A(ω) 是一条水平直线；相频图（纵轴从 -80° 到 0°，横轴 ω 从 0.1 到 10）中 φ(ω) 是一条由原点向下倾斜的直线，末端约到 -80°。"]},{"id":"p-c4c-4","title":"频率响应测量的优缺点","key":true,"source":"课件 p047","items":["优点：简单，信号发生器，双踪示波器就可以。","缺点：效率低。","图中给出测试装置在时域与频域的对应关系：输入 `x(t)` 与 `X(ω)`、装置 `h(t)` 与 `H(ω)`、输出 `y(t)` 与 `Y(ω)`，并画出幅频 `A(ω)`、相频 `φ(ω)` 曲线。"]},{"id":"p-c4c-5","title":"脉冲响应函数","key":true,"source":"课件 p048","items":["节标题为「4.6 测试系统的动态响应特性测试」，其下第 1 点为「脉冲响应函数」。","若装置的输入为单位脉冲 `δ(t)`，因 `δ(t)` 的傅立叶变换为 1，因此装置输出 `y(t)` 的傅立叶变换必将是 `H(f)`，即 `Y(f)=H(f)`。","或 `y(t)=F^{-1}[H(S)]`，并可以记为 `h(t)`，常称它为装置的脉冲响应函数或权函数。","该方法为「时域波形参数识别」，优点：直观；缺点：简单系统识别。","图中输入信号为一窄脉冲，经测试系统后输出为一衰减振荡波形。"]},{"id":"p-c4c-6","title":"阶跃响应函数","key":true,"source":"课件 p049","items":["第 2 点为「阶跃响应函数」。","若系统的输入信号为单位阶跃信号，即 `x(t)=u(t)`，则 `X(s)=1/s`，此时 `Y(s)=H(s)/s`，固有 `y(t)=L^{-1}[H(s)/s]`。","图中输入信号为单位阶跃，输出信号为衰减振荡曲线。","该方法为「时域波形参数识别」，优点：直观；缺点：简单系统识别。"]},{"id":"p-c4c-7","title":"脉冲响应函数测量与应用","key":true,"source":"课件 p050","items":["脉冲响应函数测量：实验求脉冲响应函数简单明了，产生一个冲击信号，再测量系统输出就可以了。","案例：桥梁固有频率测量。","原理：在桥中设置一三角形障碍物，利用汽车过碍时的冲击对桥梁进行激励，再通过应变片测量桥梁动态变形，得到桥梁固有频率。","图中桥面编号 1~7 为测点，示波器画面显示冲击后幅值逐步衰减的振荡波形。"]},{"id":"p-c4c-8","title":"一阶系统与时间常数","key":true,"source":"课件 p051","items":["第 3 点为「一阶系统」，其微分方程为 `τ dy(t)/dt + y(t) = x(t)`。","一阶系统频率响应函数 `H(jω) = 1/(jωτ+1) = 1/(1+(ωτ)^2) - j ωτ/(1+(ωτ)^2)`。","幅频特性 `A(ω) = 1/√(1+(ωτ)^2)`。","传递函数图中幅频曲线随 ω/τ 增大而下降、相频曲线由 0° 降到约 -80°；阶跃响应图为单调上升曲线，图上用红色标尺标出时间常数 τ。","结论：一阶系统主要的动态特性参数是时间常数。"]},{"id":"p-c4c-9","title":"二阶系统参数识别公式","key":true,"source":"课件 p052","items":["第 4 点为「二阶系统」。","传递函数法：在幅频曲线上标出共振峰处的 `ω_n`，以及幅值 `A=0.707` 处对应的 `ω₁` 与 `ω₂`，由此 `ξ = (ω₂ - ω₁)/ω_n`。","阶跃响应函数法：由响应曲线的周期得 `f_n=1/t_b`。","阶跃响应函数法：由相邻两个峰值 `M` 与 `M₁` 得 `ξ = ln(M/M₁)/2π`。"]},{"id":"p-c4c-10","title":"一阶系统参数实验测定","key":true,"source":"课件 p053–p054","items":["节标题为「4.5 测试系统特性参数的实验测定」，其下第 1 点为「一阶系统动态特性参数测定」。","静态灵敏度 K 可通过静态标定来得到。","求 τ 方法一：对系统施加一阶跃信号，然后求取系统达到最终稳定值的 63.2% 所需时间作为系统的时间常数 τ。","方法二为阶跃试验：由一阶系统的阶跃响应函数 `y(t)=1-e^{-t/τ}`，得 `1-y(t)=e^{-t/τ}`。","两边取对数得 `-t/τ = ln[1-y(t)]`；再令 `Z = ln[1-y(t)]`，则 `Z = -t/τ`，且 `dZ/dt = -1/τ`。","由 y(t) 的实验记录在 Z–t 图上作直线，即可求得 `τ = - Δt/ΔZ`。"]},{"id":"p-c4c-11","title":"二阶系统参数实验测定","key":true,"source":"课件 p055–p056","items":["第 2 点为「二阶系统动态特性参数测定」。","脉冲响应/阶跃响应函数法：在响应曲线上量出相邻两个峰值 `M₁` 与 `M₂`，由 `ξ = ln(M₁/M₂)/2π` 求阻尼比；由标出的时间 `t_b` 得 `f_n=1/t_b`。","传递函数法：由幅频曲线的共振峰确定 `ω_n`，由幅值 `A=0.707` 的水平线确定 `ω₁`、`ω₂`，则 `ξ = (ω₂-ω₁)/ω_n`。"]},{"id":"p-c4c-12","title":"4.6 负载效应","key":true,"source":"课件 p057","items":["在实际测量工作中，测量系统和被测对象之间、测量系统内部各环节相互连接会产生相互作用。接入的测量装置，构成被测对象的负载；后接环节成为前面环节的负载。","彼此间存在能量交换和相互影响，以致系统的传递函数不再是各组成环节传递函数的叠加(并联)或连乘(串联)。","未接入测量电路时，R2 上的电压降为：`U₀=ER₂/(R₂+R₁)`。","接入测量电路后，R2 上的电压降为：`U₁=ER₂R_m/[R₁(R_m+R₂)+R_mR₂]`。","令 R1=100K，R2=150K，Rm=150K，E=150V，得：U0=90V，U1=64.3V，误差达 28.6%。若负载电阻加大到 1M，则 U1=84.9V，误差减小为 5.76%。"]},{"id":"p-c4c-13","title":"测量系统的干扰源与抗干扰","key":true,"source":"课件 p058–p059","items":["节标题为「测量系统的抗干扰」，其下「一、测量装置的干扰源」。","在测量过程中，除了待测量信号外，各种不可见的、随机的信号可能出现在测量系统中。这些信号与有用信号叠加在一起，严重扭曲测量结果。","干扰源包括信道干扰、电磁场干扰、电源干扰，三者均送入测量系统。","电磁干扰：干扰以电磁波辐射方式经空间串入测量系统。","信道干扰：信号在传输过程中，通道中各元件产生的噪声或非线性畸变所造成的干扰。","电源干扰：这是由于供电电源波动对测量电路引起的干扰。","一般说来，良好的屏蔽及正确的接地可去除大部分的电磁波干扰。使用交流稳压器、隔离稳压器可减小供电电源波动的影响。信道干扰是测量装置内部的干扰，印刷电路板设计时元件合理排放等方式来增强信道的抗干扰性。"]},{"id":"p-c4c-14","title":"案例音响系统性能评定","key":true,"source":"课件 p060","items":["案例：音响系统性能评定。","改进：脉冲输入白噪声输入，测量输出，再求输出频谱。","图上给出信号关系 `y(t)=x(t)*h(t)` 与 `Y(f)=X(f)H(f)`。","测量链路为白噪声信号输入音响系统，经 HP 35670A 动态信号分析仪得到输出频谱，横轴频率从 40Hz 到 5KHz，并在 63Hz 附近出现最高谱峰。"]},{"id":"p-c4c-15","title":"静态特性对测试结果的影响","key":true,"source":"课件 p062","items":["1. 幅值失真：振动信号的实际幅值与测试系统输出幅值存在固定或随输入变化的偏差。例如，发动机正常工作时的振动幅值为 100μm，非线性误差可能导致输出幅值显示为 99.2μm 或 100.8μm，若振动信号存在多频率分量叠加，不同幅值的谐波分量会产生不同程度的失真，破坏信号的幅值比例关系。","2. 基线偏移与零点漂移：非线性特性可能导致系统在小信号输入时（如发动机怠速振动）误差占比显著增大，甚至出现零点偏移，使得低幅值振动的测量结果可信度下降，无法准确反映发动机的平稳运行状态。","3. 数据解读偏差：对于发动机振动测试中的故障诊断场景（如通过振动幅值判断轴承磨损、转子不平衡等），非线性误差可能导致误判——例如将正常振动幅值误判为超标，或遗漏因故障导致的小幅振动异常。"]},{"id":"p-c4c-16","title":"动态特性对测试结果的影响","key":true,"source":"课件 p063","items":["1. 动态响应失真的核心机制：测试系统的固有频率（本题中 500Hz）决定了其对动态信号的跟随能力，其影响主要体现在频率失真、相位滞后与转速波动的耦合影响三方面。","频率失真：发动机振动信号包含多阶谐波分量，通常包括基频（与转速成正比，如转速 3000r/min 时基频为 50Hz）、2 倍频（100Hz）、高阶谐波（如叶片通过频率、轴承特征频率等），部分高频分量可能接近或超过测试系统的固有频率。当信号频率接近固有频率时，系统会产生共振，导致该频率分量的幅值被放大；当信号频率超过固有频率时，系统输出幅值会快速衰减（幅频特性衰减段），最终导致振动信号的频率成分比例失真。","相位滞后：动态特性中的相位特性会导致不同频率分量的相位差发生变化，例如高频分量的相位滞后大于低频分量，使得振动信号的波形发生畸变，无法准确反映发动机振动的实际时域特征（如冲击信号的上升沿变缓、峰值出现时间延迟）。","与转速波动的耦合影响：发动机转速波动会导致振动信号的频率随时间变化（非平稳信号），若测试系统固有频率偏低，其动态响应速度无法跟上频率的快速变化，会进一步加剧信号失真，表现为实测数据的“毛刺”增多、峰值不稳定。","2. 固有频率的工程适配性分析：动力机械（如发动机、汽轮机）的振动高频分量通常可达 1000Hz 以上（如高速发动机的活塞敲击频率、汽轮机叶片的振动频率），测试系统固有频率 500Hz 未满足“固有频率≥信号最高频率 3~5 倍”的工程设计原则，导致高频分量无法被准确捕获，是实测数据失真的主要动态原因。"]}],"questions":[{"id":"q-c4a-1","kind":"填空","priority":1,"source":"课件题目","sourceDetail":"课件 p007 填空题（1 分）","keyPoints":["理想测试装置的输入输出关系","线性关系最佳"],"stem":"一个理想的测试装置，其输入和输出之间应该具有 [填空1] 关系最佳。","answer":"线性","basis":"课件 p006（原文）：理想的测试系统应该具有单值的、确定的输入 - 输出关系……其中以输出和输入成线性关系最佳；课件 p007 答题页面","answerNote":"课件 p007 页面显示「此题未设置答案」，此处答案由课件 p006 原文推出，请以老师公布为准"},{"id":"q-c4a-2","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p021 单选题（1 分）","keyPoints":["传递函数的定义与特点","同一传递函数可表征不同物理系统","传递函数与输入及初始状态无关"],"stem":"下列关于传递函数的叙述正确的是（　）。","options":[{"k":"A","t":"输出与输入信号之比的拉氏变换"},{"k":"B","t":"其表达式由输出和输入信号决定"},{"k":"C","t":"同一传递函数可表示不同的物理系统"},{"k":"D","t":"物理系统不同则传递函数也不同"}],"answer":"C","why":["A ✗ 课件 p019 原文：传递函数是指零初始条件下，定常线性系统输出量的拉普拉斯变换与引起该输出的输入量拉普拉斯变换之比，不是信号本身直接相比，该说法缺少零初始条件且表述不准确","B ✓ 与 D ✗ 课件 p020 原文：H(s)只反映系统传输特性，而和系统具体物理结构无关。即同一形式的传递函数可表征具有相同传输特性的不同物理系统。H(s) 与输入 x(t) 及系统的初始状态无关，故 B、D 均错误，C 正确","C ✓ 课件 p020 原文：同一形式的传递函数可表征具有相同传输特性的不同物理系统","D ✗ 物理系统不同，只要传输特性相同，传递函数形式可以相同"],"basis":"课件 p020（原文）","answerNote":"课件 p021 页面未显示答案，此处答案由课件 p020 原文推出，请以老师公布为准"},{"id":"q-c4b-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p027 单选题（1分），课件未标答案，答案由课件 p022–p024 原文推出，请以老师公布为准","keyPoints":["频率响应函数建立于频域","s=jω 代入传递函数得到 H(ω)","H(ω) 反映正弦激励下稳态输出与输入的幅值比和相位差"],"stem":"测试装置的频响函数是装置动态特性在（　）中的描述。","options":[{"k":"A","t":"幅值域"},{"k":"B","t":"频域"},{"k":"C","t":"复数域"},{"k":"D","t":"时域"}],"answer":"B","why":["A ✗ 幅值域只描述幅值的大小，课件 p023 指出频率响应函数是稳态输出量与输入量的傅里叶变换之比，属频域描述","B ✓ 课件 p022 原文：利用 `s=jω` 替换传递函数中的 s 可得频率响应函数，即装置动态特性在频域中的描述","C ✗ 复数域只说明 `H(ω)` 是复数，课件 p023 原文 `H(ω)=P(ω)+jQ(ω)=A(ω)e^{jφ(ω)}`，并非该题问的描述域","D ✗ 时域描述对应脉冲响应函数，课件 p028 原文：`y(t)=L^{-1}[H(s)]=h(t)`"],"basis":"课件 p027（原文）"},{"id":"q-c4b-2","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p034 单选题（1分），课件未标答案，答案由课件 p032–p033 原文推出，请以老师公布为准","keyPoints":["τ 是一阶系统的时间常数","τ 越小系统响应越快、工作频带越宽","一阶系统频率响应函数 H(jω)=1/(jτω+1)"],"stem":"用一阶系统作测试装置，为了获得最佳的工作性能，其时间常数 τ（　）。","options":[{"k":"A","t":"越小越好"},{"k":"B","t":"越大越好"},{"k":"C","t":"0.6～0.7 之间最好"},{"k":"D","t":"负值最好"}],"answer":"A","why":["A ✓ 课件 p032 原文：一阶系统频率响应函数 `H(jω)=1/(jτω+1)`，τ 越小其动态滞后越小、工作频带越宽，工作性能越好","B ✗ 增大 τ 使一阶系统惯性变大、响应变慢，不是最佳工作性能","C ✗ 0.6～0.7 是二阶系统阻尼比 ζ 的取值，τ 在课件 p031 中原文定义为 `τ=a_1/a_0` 为系统时间常数","D ✗ 课件 p031 原文：`τ=a_1/a_0` 为系统时间常数，取负值没有物理意义"],"basis":"课件 p034（原文）"},{"id":"q-c4b-3","kind":"例题","priority":1,"source":"课件例题","sourceDetail":"课件 p032–p033 液柱式温度计例题","keyPoints":["一阶系统的输入输出微分方程","τ=RC 为温度计时间常数","一阶系统传递函数与频率响应函数","一阶系统幅频、相频特性"],"stem":"液柱式温度计的输入与输出间有下述关系 `(T_o (t)-T_i (t))/R=C dT_o (t)/dt`，其中 `R` 为传导介质的热阻、`C` 为温度计的热容量。求系统的传递函数与频率响应函数，并写出其幅频特性与相频特性。","given":["输入与输出间的关系式为 `(T_o (t)-T_i (t))/R=C dT_o (t)/dt`","`R` 为传导介质的热阻，`C` 为温度计的热容量","两边作拉普拉斯变换，并令 `τ=RC`（τ 为温度计时间常数）"],"ask":["求系统的传递函数 `H(s)`","求系统的频率响应函数 `H(jω)`","写出系统的幅频特性 `A(ω)` 与相频特性 `φ(ω)`"],"steps":["第一步：由 `(T_o (t)-T_i (t))/R=C dT_o (t)/dt` 两边作拉普拉斯变换，得 `τsT_o (s)+T_o (s)=T_i (s)`","第二步：整理得系统的传递函数 `H(s)=T_o (s)/T_i (s)=1/(τs+1)`","第三步：以 `s=jω` 替换得系统的频率响应函数 `H(jω)=1/(jτω+1)`","第四步：由幅频、相频定义得 `A(ω)=|H(jω)|=1/√(1+(τω)^2)`，`φ(ω)=∠H(jω)=-arctan ωτ`"],"result":"`H(s)=1/(τs+1)`，`H(jω)=1/(jτω+1)`，`A(ω)=1/√(1+(τω)^2)`，`φ(ω)=-arctan ωτ`，其中 `τ=RC`","basis":"课件 p032–p033（原文）"},{"id":"q-c4b-4","kind":"例题","priority":1,"source":"课件例题","sourceDetail":"课件 p037–p038 测力弹簧秤例题","keyPoints":["测力弹簧秤是二阶系统","二阶系统参数 K、ω_n、ζ 的表达式","传递函数分母为 s^2/ω_n^2+2ζs/ω_n+1"],"stem":"图2.64 示出一个测力弹簧秤，它是一个二阶系统。设系统初始状态为零，即 `x_o=0`，`f_i=0`。由牛顿第二定律建立运动方程，并求该弹簧秤系统的传递函数。","given":["系统初始状态为零：`x_o=0`，`f_i=0`","由牛顿第二定律得 `f_i-B dx_o/dt-K_s x_o=M d^2 x_o/dt^2`","`f_i` 为施加的力（N）；`x_o` 为指针移动距离（m）；`B` 为系统阻尼常数（N/m/s）；`K_s` 为弹簧系数（N/m）"],"ask":["作拉普拉斯变换写出系统的方程","确定无阻尼固有频率 `ω_n`、阻尼比 `ζ` 与静态灵敏度 `K`","求弹簧秤系统的传递函数 `H(s)`"],"steps":["第一步：对 `f_i-B dx_o/dt-K_s x_o=M d^2 x_o/dt^2` 作拉普拉斯变换，得 `(Ms^2+Bs+K_s)X(s)=F(s)`","第二步：令 `ω_n=√(K_s/M)`（rad/s）、`ζ=B/(2√(K_s M))`、`K=1/K_s`（m/N）","第三步：上式变为 `(s^2/ω_n^2+2ζs/ω_n+1)X(s)=F(s)`","第四步：得弹簧秤系统的传递函数 `H(s)=X(s)/F(s)=K/(s^2/ω_n^2+2ζs/ω_n+1)`"],"result":"`H(s)=X(s)/F(s)=K/(s^2/ω_n^2+2ζs/ω_n+1)`，其中 `ω_n=√(K_s/M)`、`ζ=B/(2√(K_s M))`、`K=1/K_s`","basis":"课件 p037–p038（原文）"},{"id":"q-c4c-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p044 单选题（1 分）","keyPoints":["固有频率是测试系统（机械结构）自身的固有参数","加大激振力只改变振动幅值，不改变固有频率"],"stem":"在机械结构动态特性测试中，若加大系统的激振力，则测得系统的固有频率（　）。","options":[{"k":"A","t":"增大"},{"k":"B","t":"不变"},{"k":"C","t":"减小"},{"k":"D","t":"可能增大，也可能减小"}],"answer":"B","why":["A ✗ 课件 p043 中二阶系统的 ω_n 与 ξ 均为系统自身的特性参数，题干只加大了激振力，未说明系统质量或刚度改变，故 ω_n 不会增大","B ✓ 固有频率由系统自身的固有特性决定，课件 p052 的「二阶系统」与 p043 的相频规律均在讨论 ω_n 这一固有参数，激振力大小不改变它","C ✗ 加大激振力不会使固有频率减小，课件全篇未出现激振力改变 ω_n 的表述","D ✗ 课件 p043 与 p052 中 ω_n 均由系统参数确定，并非随激振力可增可减的量"],"answerNote":"课件 p044 只印出题干与选项、未标注答案，答案由课件 p043 与 p052 关于 ω_n 属系统固有参数的原文推出，请以老师公布为准","basis":"课件 p044（原文），并据课件 p043 / p052 推出答案"},{"id":"q-c4c-2","kind":"计算","priority":1,"source":"课件例题","sourceDetail":"课件 p057 负载效应算例","keyPoints":["负载效应使系统传递函数不再是各环节传递函数的叠加或连乘","接入测量电路后 R2 上的电压降减小，形成测量误差"],"stem":"测量电路取 R1=100K、R2=150K、E=150V。求未接入测量电路时 R2 上的电压降 U0、接入 Rm=150K 的电压表后 R2 上的电压降 U1 及误差；若负载电阻加大到 1M，误差又为多少。","given":["R1=100K","R2=150K","Rm=150K","E=150V","负载电阻加大到 1M"],"ask":["未接入测量电路时 R2 上的电压降 U0","接入测量电路后 R2 上的电压降 U1","两种情况下的误差","负载电阻加大到 1M 时的 U1 与误差"],"steps":["第一步 按课件 p057 公式，未接入测量电路时 R2 上的电压降为 `U₀=ER₂/(R₂+R₁)`，代入 E=150V、R2=150K、R1=100K，得 U0=90V","第二步 按课件 p057 公式，接入测量电路后 R2 上的电压降为 `U₁=ER₂R_m/[R₁(R_m+R₂)+R_mR₂]`，代入 Rm=150K，得 U1=64.3V","第三步 比较 U0 与 U1，误差达 28.6%","第四步 若负载电阻加大到 1M，则 U1=84.9V，误差减小为 5.76%"],"result":"未接入时 U0=90V；接入 Rm=150K 后 U1=64.3V，误差达 28.6%；负载电阻加大到 1M 后 U1=84.9V，误差减小为 5.76%。","basis":"课件 p057（原文）"},{"id":"q-c4c-3","kind":"简答","priority":1,"source":"课件 p061","sourceDetail":"课件 p061 课堂讨论题","keyPoints":["静态特性（非线性误差）引起幅值失真、基线偏移与零点漂移、数据解读偏差","动态特性（固有频率）引起频率失真、相位滞后与转速波动耦合影响","固有频率 500Hz 未满足固有频率≥信号最高频率 3~5 倍的原则"],"stem":"某发动机振动测试中，测试系统非线性误差 0.8%、固有频率 500Hz，实测转速波动数据失真。请分析：1) 静态特性（非线性误差）对测试结果的影响；2) 动态特性（固有频率）对测试结果的影响。","given":["测试系统非线性误差 0.8%","测试系统固有频率 500Hz","实测转速波动数据失真"],"ask":["分析静态特性（非线性误差）对测试结果的影响","分析动态特性（固有频率）对测试结果的影响"],"steps":["第一步 静态特性之幅值失真：课件 p062 指出发动机正常工作振动幅值为 100μm，非线性误差可能使输出显示为 99.2μm 或 100.8μm，多频率分量叠加时不同幅值谐波的失真程度不同，破坏信号的幅值比例关系","第二步 静态特性之基线偏移与零点漂移：非线性特性使系统在小信号输入（如怠速振动）时误差占比显著增大，甚至出现零点偏移，低幅值振动测量结果可信度下降","第三步 静态特性之数据解读偏差：对故障诊断场景（如由振动幅值判断轴承磨损、转子不平衡）可能误判，例如把正常幅值误判为超标，或遗漏故障导致的小幅振动异常","第四步 动态特性之频率失真：课件 p063 指出固有频率决定系统对动态信号的跟随能力；信号频率接近固有频率时系统共振使该分量幅值被放大，信号频率超过固有频率时输出幅值快速衰减，导致频率成分比例失真","第五步 动态特性之相位滞后：相位特性使不同频率分量产生相位差，高频分量相位滞后大于低频分量，波形发生畸变，冲击信号上升沿变缓、峰值出现时间延迟","第六步 转速波动耦合与工程适配性：转速波动使振动信号频率随时间变化（非平稳信号），固有频率偏低时响应跟不上频率快速变化，实测数据“毛刺”增多、峰值不稳定；且 500Hz 未满足固有频率≥信号最高频率 3~5 倍的工程设计原则，高频分量无法被准确捕获"],"result":"静态上，非线性误差 0.8% 造成幅值失真、小信号时误差占比增大并出现零点漂移，还可能引起故障诊断误判；动态上，固有频率 500Hz 使接近固有频率的高频谐波被共振放大、超过固有频率的分量快速衰减，加上相位滞后使波形畸变并与转速波动耦合，实测数据毛刺增多、峰值不稳定，是数据失真的主要动态原因。","basis":"课件 p061–p063（原文）"}],"images":{"1":{"w":"img/test-ch4/p001.webp","j":"img/test-ch4/p001.jpg"},"2":{"w":"img/test-ch4/p002.webp","j":"img/test-ch4/p002.jpg"},"3":{"w":"img/test-ch4/p003.webp","j":"img/test-ch4/p003.jpg"},"4":{"w":"img/test-ch4/p004.webp","j":"img/test-ch4/p004.jpg"},"5":{"w":"img/test-ch4/p005.webp","j":"img/test-ch4/p005.jpg"},"6":{"w":"img/test-ch4/p006.webp","j":"img/test-ch4/p006.jpg"},"7":{"w":"img/test-ch4/p007.webp","j":"img/test-ch4/p007.jpg"},"8":{"w":"img/test-ch4/p008.webp","j":"img/test-ch4/p008.jpg"},"9":{"w":"img/test-ch4/p009.webp","j":"img/test-ch4/p009.jpg"},"10":{"w":"img/test-ch4/p010.webp","j":"img/test-ch4/p010.jpg"},"11":{"w":"img/test-ch4/p011.webp","j":"img/test-ch4/p011.jpg"},"12":{"w":"img/test-ch4/p012.webp","j":"img/test-ch4/p012.jpg"},"13":{"w":"img/test-ch4/p013.webp","j":"img/test-ch4/p013.jpg"},"14":{"w":"img/test-ch4/p014.webp","j":"img/test-ch4/p014.jpg"},"15":{"w":"img/test-ch4/p015.webp","j":"img/test-ch4/p015.jpg"},"16":{"w":"img/test-ch4/p016.webp","j":"img/test-ch4/p016.jpg"},"17":{"w":"img/test-ch4/p017.webp","j":"img/test-ch4/p017.jpg"},"18":{"w":"img/test-ch4/p018.webp","j":"img/test-ch4/p018.jpg"},"19" <script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById('payload').textContent);
  // 题源标签：内容层只有课件一个源（教材/视频 2026-10-16 起不进内容层）
  var PS = { 1:{l:'课件题目',c:'var(--accent)',b:'var(--accent-bg)'}, 2:{l:'课件考点',c:'#1971c2',b:'#e7f1fb'} };
  // 3 档＝课件未覆盖、教材补充（诚实标注，不把教材当题源）
  var PSD = {l:'补充',c:'#868e96',b:'#f1f3f5'};
  var MAX_NONKEY = 0.25;

  /* ---------- 进度/错题本（localStorage） ---------- */
  var LS_KEY = 'majorapp.v1';
  function loadState() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveState(st) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(st)); } catch (e) {}
  }
  var state = loadState();
  state.wrong = state.wrong || {};      // qid -> 错误次数
  state.right = state.right || {};      // qid -> 连续答对次数
  function markRight(id){ state.right[id]=(state.right[id]||0)+1; state.wrong[id]=0; saveState(state); }
  function markWrong(id){ state.wrong[id]=(state.wrong[id]||0)+1; state.right[id]=0; saveState(state); }

  /* ---------- 工具 ---------- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  // 公式排版：`代码`、**加粗**、_下标、^上标、Unicode 上下标 → 真正的 sub/sup
  var SUPMAP = {'\u2070':'0','\u00b9':'1','\u00b2':'2','\u00b3':'3','\u2074':'4','\u2075':'5','\u2076':'6','\u2077':'7','\u2078':'8','\u2079':'9','\u207f':'n'};
  var SUPCLS = '\\u2070\\u00b9\\u00b2\\u00b3\\u2074-\\u2079\\u207f';
  var SUBCLS = '\\u2080-\\u2089';
  // 上下标的「附加字符」：∞、℃、°、·、中文
  //   ★ 2026-10-17 补：传热学正文大量写 `t_∞`、`u_∞`、`Q_导热`、`λ_纯金属`、`{t̄}_℃`，
  //     老的 ^xx/_xx 字符类只认「字母数字 + 希腊 + 撇号 + 逗号点」，这些字符落不进正则，
  //     于是下划线**原样显示**在页面上。加进字符类即可，数据不用改。
  //     中文写成下标是热工教材的常规写法（Q_导热），不是笔误。
  var EXCLS = '\\u221e\\u2103\\u00b0\\u00b7\\u4e00-\\u9fff';
  function toSup(t){ return t.replace(new RegExp('['+SUPCLS+']','g'), function(c){ return SUPMAP[c]||c; }); }
  function toSub(t){ return t.replace(new RegExp('['+SUBCLS+']','g'), function(c){ return String.fromCharCode(c.charCodeAt(0)-0x2080+48); }); }
  // 一次扫描：^{上标} | ^(上标) | ^上标 | _{下标} | _(下标) | _下标 | 上标字符 | 下标字符
  //   ★ 2026-10-16 补 {…} 花括号写法：子代理写公式时习惯用 `e^{-st}`、`x_o^{(n-1)}`，
  //     老规则只认 `^(xx)` 和裸 `^xx`，于是花括号**原样显示**在页面上（384 处）。
  //     现在四种写法都收，数据不用改。
  var FMT = new RegExp(
    '\\^\\{([^{}]+)\\}' +                                    // ^{xx} 花括号上标
    '|\\^\\(([^)]+)\\)' +                                    // ^(xx) 括号上标
    '|\\^([A-Za-z0-9\\.\\+\\-\\/\\u2212\\*'+EXCLS+']+)' +    // ^xx（* 让 s_i^* 的共轭号也变上标）
    '|_\\{([^{}]+)\\}' +                                     // _{xx} 花括号下标
    '|_\\(([^)]+)\\)' +                                      // _(xx) 括号下标
    '|_([A-Za-z0-9\\u0370-\\u03ff\\u2032-\\u2037,\\.\\u2212'+SUBCLS+EXCLS+']+)' +  // _xx（不含上标字符，避免 T_i⁴ 被并吞）
    '|(['+SUPCLS+']+)' +                                      // 连续上标
    '|(['+SUBCLS+']+)', 'g');                                 // 连续下标
  function fmtInline(t){
    return t.replace(FMT, function(m, bsup, psup, careted, bsub, psub, subed, sup, sub){
      if(bsup)    return '<sup>'+fmtInline(bsup)+'</sup>';
      if(psup)    return '<sup>'+fmtInline(psup)+'</sup>';
      if(careted) return '<sup>'+careted+'</sup>';
      if(bsub)    return '<sub>'+fmtInline(bsub)+'</sub>';
      if(psub)    return '<sub>'+fmtInline(psub)+'</sub>';
      if(subed)   return '<sub>'+toSub(toSup(subed))+'</sub>';
      if(sup)     return '<sup>'+toSup(sup)+'</sup>';
      if(sub)     return '<sub>'+toSub(sub)+'</sub>';
      return m;
    });
  }
  function rich(s){
    // 顺序：转义 → 排公式（无标签时不会误伤）→ 先 `代码` → 再 **加粗**
    // 先处理代码，可让「**加粗里含 `公式`**」这种嵌套也被正确包住
    var x = fmtInline(esc(s));
    x = x.replace(/`([^`]+)`/g, '<code>$1</code>');
    x = x.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return x;
  }
  function el(tag, cls, html){ var d=document.createElement(tag); if(cls)d.className=cls; if(html!=null)d.innerHTML=html; return d; }
  // 字段容错：字符串按单元素数组处理（子代理可能给字符串而非数组）
  function asList(v){ return v==null ? [] : (Array.isArray(v) ? v : [v]); }
  /* 主题色：按当前科目注入 CSS 变量（未选科目时回落锅炉橙） */
  var DEFAULT_ACCENT = '#e8590c';
  function setAccent(color){
    var c = (color && /^#[0-9a-fA-F]{6}$/.test(color)) ? color : DEFAULT_ACCENT;
    var st = document.documentElement.style;
    st.setProperty('--accent', c);
    st.setProperty('--accent-bg', c + '1f');
    st.setProperty('--accent-soft', c + '14');
    st.setProperty('--accent-line', c + '40');
  }
  function $(id){ return document.getElementById(id); }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

  // 「重点题」= 带考点标签，或本身就是例题/计算题（例题永远入选，不受非重点限额）
  function isKey(q){
    return (q.keyPoints && q.keyPoints.length) || q.kind === '例题' || q.kind === '计算' || q.kind === '简答';
  }
  function stats(ch){
    var qs=(ch&&ch.questions)||[], by={};
    qs.forEach(function(q){ by[q.priority]=(by[q.priority]||0)+1; });
    return { total:qs.length, key:qs.filter(isKey).length, nonKey:qs.filter(function(q){return !isKey(q);}).length, by:by };
  }
  /* ---------- 出题引擎：课件题优先 + 非重点限额 + 错题加权 ---------- */
  function buildQuiz(ch, count){
    var all=(ch.questions||[]).slice(); if(!all.length) return [];
    function score(q){
      var s = q.priority*100;                       // 优先级主导：1 课件题最优先
      if(isKey(q)) s -= 40;                          // 重点题提权
      s -= Math.min(state.wrong[q.id]||0,3)*35;      // 错过的题提权
      s += Math.min(state.right[q.id]||0,2)*30;      // 连对的题降权
      return s;
    }
    var key=all.filter(isKey).sort(function(a,b){return score(a)-score(b);});
    var non=all.filter(function(q){return !isKey(q);}).sort(function(a,b){return score(a)-score(b);});
    var maxNon=Math.floor(count*MAX_NONKEY), out=[];
    key.forEach(function(q){ if(out.length<count) out.push(q); });
    var used=0;
    non.forEach(function(q){ if(out.length<count && used<maxNon){ out.push(q); used++; } });
    non.forEach(function(q){ if(out.length<count && out.indexOf(q)<0) out.push(q); });
    return out.sort(function(a,b){ return a.priority-b.priority; });
  }
  function judge(q, resp){
    if(q.kind==='填空'){
      var norm=function(s){ return String(s==null?'':s).replace(/\s/g,'').replace(/[，,。.；;]/g,''); };
      var a=norm(q.answer), g=norm(resp); if(!g) return false;
      return a.split(/；|;/).filter(Boolean).every(function(p){ return g.indexOf(p)>=0; });
    }
    var x=String(q.answer||'').split('').sort().join('');
    var y=String(resp||'').split('').sort().join('');
    return x.length>0 && x===y;
  }

  /* ---------- 路由状态 ---------- */
  var R = { sub:null, ch:null, tab:'mind' };

  function curSub(){ return DATA.subjects.filter(function(s){return s.id===R.sub;})[0]; }
  function curCh(){ var s=curSub(); if(!s) return null; return (s.chapters||[]).filter(function(c){return c.id===R.ch;})[0]; }

  /* ---------- 渲染：科目切换器 ---------- */
  function renderSubjects(){
    var box=$('subjects'); box.innerHTML='';
    DATA.subjects.forEach(function(s){
      var has=(s.chapters||[]).length>0;
      var b=el('button','subj'+(R.sub===s.id?' on':''), esc(s.name));
      if(R.sub===s.id) b.style.background=s.color;
      b.onclick=function(){ if(!has && R.sub!==s.id) return; R.sub=s.id; R.ch=null; R.tab='mind'; render(); };
      box.appendChild(b);
    });
  }

  /* ---------- 渲染：首页 ---------- */
  function renderHome(){
    var m=$('main'); m.innerHTML='';
    m.appendChild(el('div','h1','专业课'));
    m.appendChild(el('div','sub','内容源：雨课堂课件（唯一）· 课件题优先 · 考点标清'));
    DATA.subjects.forEach(function(s){
      var n=(s.chapters||[]).length;
      var qn=(s.chapters||[]).reduce(function(a,c){return a+(c.questions||[]).length;},0);
      var btn=el('button','scard'+(n?'':' off'));
      btn.innerHTML =
        '<div class="bar" style="background:'+s.color+'"></div>'+
        '<div class="body"><div class="nm">'+esc(s.name)+'</div>'+
        '<div class="mt">'+esc(s.meta)+'</div>'+
        '<div class="chips">'+(n
            ? '<span class="chip" style="background:'+s.color+'1a;color:'+s.color+'">'+n+' 章</span><span class="chip">'+qn+' 题</span>'
            : '<span class="chip">内容建设中</span>')+
        '</div></div>'+(n?'<div class="arrow">›</div>':'');
      if(n) btn.onclick=function(){ R.sub=s.id; R.ch=null; R.tab='mind'; render(); };
      m.appendChild(btn);
    });
    m.appendChild(el('div','sub center','内容来源：雨课堂课件（唯一内容源）'));
    m.appendChild(el('div','buildver','构建 0b662639a7'));
  }

  /* ---------- 渲染：章节列表 ---------- */
  function renderChapters(){
    var s=curSub(), m=$('main'); m.innerHTML='';
    m.appendChild(el('div','sub',esc(s.meta)));
    (s.chapters||[]).forEach(function(c){
      var st=stats(c);
      var b=el('button','ccard');
      b.innerHTML='<div class="between"><div class="nm">'+esc(c.name)+'</div><div class="muted" style="font-size:20px">›</div></div>'+
        (c.subtitle?'<div class="small muted" style="margin-top:2px">'+esc(c.subtitle)+'</div>':'')+
        '<div class="chips row" style="margin-top:10px">'+
          '<span class="chip" style="background:'+s.color+'1a;color:'+s.color+'">'+esc(c.status||'未学')+'</span>'+
          '<span class="chip">重点 '+st.key+'</span><span class="chip">题 '+st.total+'</span>'+
          (st.by[1]?'<span class="chip" style="background:var(--accent-bg);color:var(--accent)">课件题 '+st.by[1]+'</span>':'')+
        '</div>';
      b.onclick=function(){ R.ch=c.id; R.tab='mind'; render(); };
      m.appendChild(b);
    });
  }

  /* ---------- 渲染：章节详情 ---------- */
  function renderDetail(){
    var s=curSub(), c=curCh(), m=$('main');
    m.innerHTML='';
    // tabs
    var tabs=el('div','tabs');
    var tabDefs=[['mind','思维导图'],['points','重点'],['bank','题目'],['quiz','练习'],['kp','考点清单']];
    tabDefs.forEach(function(t){
      var b=el('button','tab'+(R.tab===t[0]?' on':''), t[1]);
      if(R.tab===t[0]) b.style.color=s.color;
      b.onclick=function(){ R.tab=t[0]; render(); };
      tabs.appendChild(b);
    });
    // 错题本（有错题时显示，带角标）
    var wl=wrongList();
    var wb=el('button','tab'+(R.tab==='wrong'?' on':''), '错题本'+(wl.length?' ('+wl.length+')':''));
    if(R.tab==='wrong') wb.style.color='#e03131';
    wb.onclick=function(){ R.tab='wrong'; render(); };
    tabs.appendChild(wb);
    m.appendChild(tabs);
    var pane=el('div'); m.appendChild(pane);
    if(R.tab==='mind') paneMind(pane,c,s);
    else if(R.tab==='points') panePoints(pane,c,s);
    else if(R.tab==='bank') paneBank(pane,c,s);
    else if(R.tab==='kp') paneKP(pane,c,s);
    else if(R.tab==='wrong') paneWrong(pane);

  /* --- 思维导图（折叠树） --- */
  function paneMind(root,ch,s){
    var wrap=el('div');

    bar.style.cssText='justify-content:space-between;margin-bottom:10px';
    // 图片版：与折叠树同源生成的独立 SVG，点开看全图（知识库里是同一份文件）
    var a=el('a','tbtn','图片版（看全图）↗');

    a.target='_blank'; a.rel='noopener';
    bar.appendChild(a);
    var rb=el('div','row','');
    var b1=el('button','tbtn','全部展开'), b2=el('button','tbtn','全部收起');
    rb.appendChild(b1); rb.appendChild(b2); bar.appendChild(rb); wrap.appendChild(bar);
    var card=el('div','card'); card.appendChild(el('div','small muted','点 ＋ / − 逐层展开（手机上比缩放巨图好用）'));
    var tree=el('div','tree'); tree.style.marginTop='8px';
    var openSet={}; // path -> true
    function render(){
      tree.innerHTML='';
      tree.appendChild(el('div','troot', rich(ch.mindmap.label)));
      (ch.mindmap.children||[]).forEach(function(n,i){ node(n,'0.'+i,1,tree); });
    }
    function node(n,path,depth,parent){
      var kids=n.children||[], open=!!openSet[path];
      var box=el('div','tnode'); parent.appendChild(box);
      var row=el('div','trow');
      var dot=el('div', kids.length?('dot'+(open?' open':'')):'dot leaf', kids.length?(open?'−':'+'):'');
      var lb=el('div','lb '+(depth===1?'lv1':'lv2'), rich(n.label));
      row.appendChild(dot); row.appendChild(lb); box.appendChild(row);
      if(kids.length){
        row.onclick=function(){ if(open) delete openSet[path]; else openSet[path]=1; render(); };
        if(open) kids.forEach(function(k,j){ node(k,path+'.'+j,depth+1,box); });
      }
    }
    function collect(n,path,out){ out.push(path); (n.children||[]).forEach(function(c,i){ collect(c,path+'.'+i,out); }); return out; }
    b1.onclick=function(){ openSet={}; collect(ch.mindmap,'r',[]).forEach(function(p){ if(p!=='r') openSet[p]=1; }); render(); };
    b2.onclick=function(){ openSet={}; render(); };
    // 默认展开第一层
    (ch.mindmap.children||[]).forEach(function(n,i){ openSet['0.'+i]=1; });
    render();
    card.appendChild(tree); wrap.appendChild(card); root.appendChild(wrap);
  }

  /* --- 课件配图 --- */
  // 从 source 文本里抽出被引用的页码
  function srcPages(txt){
    var out=[];
    String(txt||'').replace(/(?:课件\s*)?(?:p|slide\s*)(\d{1,3})/g,function(m,n){
      var v=parseInt(n,10); if(v>=1&&v<=400&&out.indexOf(v)<0) out.push(v); return m;
    });
    return out.sort(function(a,b){return a-b;});
  }
  // 图片基路径（构建时注入：PWA 版为 img/，单文件版为 ../docs/img/）
  var IMGBASE = 'img/';
  // 思维导图 SVG 基路径（构建时注入，与 IMGBASE 同理）
  var MMBASE = 'mindmap/';
  function imgURL(p){ return IMGBASE + String(p).replace(/^img\//, ''); }
  // 该章节有哪些图（值形如 {w:'...webp', j:'...jpg'}，兼容旧的纯字符串）
  function imgOf(ch){ return (ch&&ch.images)||{}; }
  function pickImg(v){
    if(!v) return null;
    if(typeof v === 'string') return { w: v, j: null };
    return { w: v.w || null, j: v.j || null };
  }
  // 生成配图条：用 <a href> 原生打开图片（新标签/系统看图器），不依赖覆盖层
  function thumbsHTML(ch, srcText, extraPages){
    var im=imgOf(ch); if(!im) return '';
    var pages=srcPages(srcText);
    (extraPages||[]).forEach(function(p){ if(pages.indexOf(p)<0) pages.push(p); });
    pages.sort(function(a,b){return a-b;});
    var use=pages.map(function(p){ return [p, pickImg(im[String(p)])]; })
                 .filter(function(x){ return x[1] && (x[1].w||x[1].j); });
    if(!use.length) return '';
    var h='<div class="thumbs">';
    use.forEach(function(x){
      var p=x[0], v=x[1];
      var w=v.w?imgURL(v.w):null, j=v.j?imgURL(v.j):null;
      var inner='<img loading="lazy" src="'+esc(j||w)+'" alt="课件 p'+p+'">';
      var media=(w && j)
        ? '<picture><source srcset="'+esc(w)+'" type="image/webp">'+inner+'</picture>'
        : inner;
      h+='<a class="thumb" href="'+esc(j||w)+'" target="_blank" rel="noopener" title="点击查看原图 p'+p+'">'+
         media+'<div class="pg">p'+p+'</div><div class="zoom">查看</div></a>';
    });
    return h+'</div>';
  }

  /* --- 题目（只读浏览：本章题目 + 答案一次看全，不用一题一题答） --- */
  var QA={ all:true, open:{}, kind:null, kp:null };
  var KIND_ORDER=['单选','多选','判断','填空','简答','例题','计算'];
  function bul(t){ return '<div class="bul"><div class="d">·</div><div class="t">'+rich(t)+'</div></div>'; }
  // 答案解析块（只读，不依赖练习状态 Q）
  function answerHTML(q){
    var isEx=(q.kind==='例题'||q.kind==='计算'||q.kind==='简答');
    var h='';
    if(isEx){

    }

    asList(q.why).forEach(function(w){ h+='<div class="bul"><div class="d">›</div><div class="t">'+rich(w)+'</div></div>'; });
    if(q.basis) h+='<div class="basis">依据：'+esc(q.basis)+'</div>';

  function paneBank(root,ch,s){
    var qs=(ch.questions||[]);
    if(!qs.length){ root.appendChild(el('div','empty','本章暂无题目。')); return; }

    var cnt={}, kinds=[];

      if(kinds.indexOf(q.kind)<0) kinds.push(q.kind);
    });
    kinds.sort(function(a,b){
      var ia=KIND_ORDER.indexOf(a), ib=KIND_ORDER.indexOf(b);
      return (ia<0?99:ia)-(ib<0?99:ib);
    });
    var shown=qs.filter(function(q){
      if(QA.kind && q.kind!==QA.kind) return false;
      if(QA.kp && asList(q.keyPoints).indexOf(QA.kp)<0) return false;

    });

    // 顶部：统计 + 展开/收起

      '<div class="small muted" style="margin-top:6px">'+kinds.map(function(k){ return k+' '+cnt[k]; }).join(' · ')+'</div>'+

    bar.appendChild(tb);

    // 题型筛选

        '<span class="chip">'+esc(q.kind)+'</span>'+
        (state.wrong[q.id]?'<span class="chip" style="background:#fff0f0;color:#e03131">错过 '+state.wrong[q.id]+' 次</span>':'')+
        (q.sourceDetail?'<span class="small muted">'+esc(q.sourceDetail)+'</span>':'')));
      if(isKey(q)){

        asList(q.keyPoints).forEach(function(k){ kp.appendChild(el('span','k',rich(k))); });

  /* --- 练习 --- */
  var Q=null;
  function paneQuiz(root,ch,s){
    var st=stats(ch);
    // Q.chId==='__wrong__' 表示「只练错题」模式，不按本章重置
    if(!Q || (Q.chId!==ch.id && Q.chId!=='__wrong__')){
      var c=el('div','card');
      c.innerHTML='<div style="font-size:18px;font-weight:800">本章练习</div>'+
        '<div class="small muted" style="margin:8px 0 0">共 '+st.total+' 题 ｜ 重点 '+st.key+' ｜ 非重点 '+st.nonKey+'</div>'+
        '<div class="small muted" style="margin-top:4px">出题规则：<b>课件题目优先</b>，非重点题占比 ≤ '+Math.round(MAX_NONKEY*100)+'%，错题加权</div><hr>';
      [5,10,st.total].filter(function(v,i,a){return v>0&&a.indexOf(v)===i;}).forEach(function(n){
        var b=el('button','btn','开始 '+n+' 题'); b.style.background=s.color;
        b.onclick=function(){ startQuiz(ch,n); };
        c.appendChild(b);
      });
      var wl=wrongList();
      if(wl.length){
        var wb=el('button','btn ghost','只练错题（'+wl.length+' 题）');
        wb.onclick=function(){ startWrongQuiz(wl.map(function(x){return x.q;})); };
        c.appendChild(wb);
      }
      var vb=el('button','btn ghost','先看本章题目（不开始练习）');
      vb.onclick=function(){ R.tab='bank'; render(); };
      c.appendChild(vb);
      root.appendChild(c); return;
    }
    if(Q.i>=Q.list.length){ return quizDone(root,ch,s); }
    var q=Q.list[Q.i], ps=PS[q.priority]||PSD, isFill=q.kind==='填空', isSimple=q.kind==='简答', isExample=(q.kind==='例题'||q.kind==='计算'||isSimple);
    // 进度
    var pr=el('div','row'); pr.style.marginBottom='12px';
    pr.appendChild(el('div','small',''+(Q.i+1)+' / '+Q.list.length));
    var bar=el('div','bar2'); bar.innerHTML='<i style="width:'+(((Q.i+(Q.done?1:0))/Q.list.length)*100)+'%;background:'+s.color+'"></i>';
    pr.appendChild(bar); root.appendChild(pr);

    var c=el('div','card');
    c.appendChild(el('div','row',
      '<span class="tag" style="background:'+ps.b+';color:'+ps.c+'">'+ps.l+'</span>'+
      '<span class="chip">'+esc(q.kind)+'</span>'+
      '<span class="small muted">'+esc(q.basis||'')+'</span>'));
    if(isKey(q)){
      var kp=el('div','kp');
      kp.appendChild(el('span','lab','考点'));
      q.keyPoints.forEach(function(k){ kp.appendChild(el('span','k',rich(k))); });
      c.appendChild(kp);
    }
    c.appendChild(el('div','stem', rich(q.stem)));

    if(isExample){
      /* ---- 例题：已知 → 求解 →（点开）解答过程 → 结果 ---- */
      if(asList(q.given).length){
        c.appendChild(el('div','exlabel','已知'));
        c.appendChild(el('div','exbox', asList(q.given).map(function(g){
          return '<div class="bul"><div class="d">·</div><div class="t">'+rich(g)+'</div></div>';
        }).join('')));
      }
      if(asList(q.ask).length){
        c.appendChild(el('div','exlabel','求解'));
        c.appendChild(el('div','exbox', asList(q.ask).map(function(g){
          return '<div class="bul"><div class="d">·</div><div class="t">'+rich(g)+'</div></div>';
        }).join('')));
      }
      var showSol = !!Q.done || !!Q.solOpen;
      if(showSol){
        if(asList(q.steps).length){
          c.appendChild(el('div','exlabel', isSimple?'参考答案':'解答过程'));
          c.appendChild(el('div','exbox steps', asList(q.steps).map(function(s, i){
            return '<div class="bul"><div class="d">'+(isSimple?'·':(i+1))+'</div><div class="t">'+rich(s)+'</div></div>';
          }).join('')));
        }
        if(q.result) c.appendChild(el('div','exres',(isSimple?'要点：':'结果：')+rich(q.result)));
      }
      var rb0=el('div','res');
      asList(q.why).forEach(function(w){ rb0.appendChild(el('div','bul','<div class="d">›</div><div class="t">'+rich(w)+'</div>')); });
      if(q.basis) rb0.appendChild(el('div','basis','依据：'+esc(q.basis)));
      if(q.answerNote) rb0.appendChild(el('div','note','⚠️ '+esc(q.answerNote)));
      if(rb0.innerHTML) c.appendChild(rb0);
    } else if(isFill){
      var inp=el('input','fill'); inp.placeholder='输入答案'; inp.value=Q.text||'';
      inp.disabled=!!Q.done;
      inp.oninput=function(){ Q.text=inp.value; var b=$('qsubmit'); if(b) b.disabled=!inp.value.trim(); };
      if(Q.done) inp.style.background = (Q.lastOk===null) ? '#f1f3f5' : (Q.lastOk ? '#e8f6ec' : '#fff0f0');
      c.appendChild(inp);
    } else {
      asList(q.options).forEach(function(op){
        var sel = q.kind==='多选' ? String(Q.pick||'').indexOf(op.k)>=0 : Q.pick===op.k;
        var isAns = String(q.answer).indexOf(op.k)>=0;
        var cls='opt', mark='';
        if(Q.done){
          if(isAns){ cls+=' ok'; mark='✓'; }
          else if(sel){ cls+=' no'; mark='✗'; }
        } else if(sel) cls+=' sel';
        var d=el('div',cls,'<div class="k">'+esc(op.k)+'</div><div class="t">'+rich(op.t)+'</div>'+(mark?'<div class="m">'+mark+'</div>':''));
        if(!Q.done) d.onclick=function(){
          if(q.kind==='多选'){
            var cur=String(Q.pick||'').split(''), i=cur.indexOf(op.k);
            if(i>=0) cur.splice(i,1); else cur.push(op.k);
            Q.pick=cur.sort().join('');
          } else Q.pick=op.k;
          render();
        };
        c.appendChild(d);
      });
    }

    if(Q.done){
      var ok=Q.lastOk;
      var rb=el('div','res');
      if(isExample){
        /* 例题 / 简答：不判对错，只给依据与解析 */
      } else if(ok===null||ok===undefined){
        rb.appendChild(el('div','small','<span style="color:#6b7280;font-weight:800">已看答案（本题未作答，不计入错题）</span>'));
      } else {
        rb.appendChild(el('h4',null,'<span style="color:'+(ok?'#2f9e44':'#e03131')+'">'+(ok?'✓ 回答正确':'✗ 回答错误　正确答案：'+esc(q.answer))+'</span>'));
      }
      asList(q.why).forEach(function(w){ rb.appendChild(el('div','bul','<div class="d">›</div><div class="t">'+rich(w)+'</div>')); });
      if(q.basis) rb.appendChild(el('div','basis','依据：'+esc(q.basis)));
      if(q.answerNote) rb.appendChild(el('div','note','⚠️ '+esc(q.answerNote)));
      // 答完给出课件原页，便于核对
      var th=thumbsHTML(ch, (q.sourceDetail||'')+' '+(q.basis||''));
      if(th) rb.appendChild(el('div','small muted','课件原页：'));
      if(th) rb.insertAdjacentHTML('beforeend', th);
      c.appendChild(rb);
    }

    var act=el('div'); act.style.marginTop='12px';
    if(isExample){
      /* 例题 / 简答：先自己做，再点开看答案 */
      if(!Q.done){
        var sb=el('button','btn', isSimple?'看参考答案':'看解答'); sb.style.background=s.color;
        sb.onclick=function(){ Q.solOpen=true; Q.done=true; render(); };
        act.appendChild(sb);
      } else {
        var nb2=el('button','btn', (Q.i+1>=Q.list.length?'看结果':'下一题')); nb2.style.background=s.color;
        nb2.onclick=function(){ Q.i++; Q.pick=''; Q.text=''; Q.done=false; Q.solOpen=false; render(); };
        act.appendChild(nb2);
      }
    } else if(!Q.done){
      var b=el('button','btn'+(isFill?'':'')+'','提交'); b.id='qsubmit'; b.style.background=s.color;
      if(isFill && !(Q.text||'').trim()) b.disabled=true;
      if(!isFill && !Q.pick) b.disabled=true;
      b.onclick=function(){
        Q.lastOk=judge(q, isFill?Q.text:Q.pick);
        if(Q.lastOk) markRight(q.id); else markWrong(q.id);
        Q.done=true; render();
      };
      act.appendChild(b);
      /* 允许直接看答案：不判对错、不计入错题本 */
      var pk=el('button','btn ghost','看答案（本题不计作答）');
      pk.onclick=function(){ Q.lastOk=null; Q.solOpen=true; Q.done=true; render(); };
      act.appendChild(pk);
    } else {
      var nb=el('button','btn', (Q.i+1>=Q.list.length?'看结果':'下一题')); nb.style.background=s.color;
      nb.onclick=function(){ Q.i++; Q.pick=''; Q.text=''; Q.done=false; render(); };
      act.appendChild(nb);
    }
    c.appendChild(act);
    root.appendChild(c);
    var ex=el('button','btn ghost','退出练习');
    ex.onclick=function(){ Q=null; render(); };
    root.appendChild(ex);
  }
  function startQuiz(ch,n){
    Q={ chId:ch.id, list:buildQuiz(ch,n), i:0, pick:'', text:'', done:false, wrong:[] };
    render();
  }
  function quizDone(root,ch,s){
    var right=Q.list.length-Q.wrong.length;
    var n=Q.list.length||1;                 // 防 0 题时正确率算出 NaN
    var kps={}; Q.wrong.forEach(function(q){ asList(q.keyPoints).forEach(function(k){ kps[k]=1; }); });
    var c=el('div','card center');
    c.innerHTML='<div style="font-size:18px;font-weight:800">完成</div>'+
      '<div class="big">'+right+' / '+Q.list.length+'</div>'+
      '<div class="small muted">正确率 '+Math.round(right/n*100)+'%</div>'+
      (Q.wrong.length
        ? '<div class="small" style="margin-top:10px">错题考点：'+esc(Object.keys(kps).join(' · ')||'（无考点标签）')+'</div>'
        : '<div class="small" style="margin-top:10px">全对，很棒</div>')+'<hr>';
    var b=el('button','btn','再来一组'); b.style.background=s.color;
    b.onclick=function(){ startQuiz(ch, Q.list.length); }; c.appendChild(b);
    var b2=el('button','btn ghost','返回练习设置'); b2.onclick=function(){ Q=null; render(); }; c.appendChild(b2);
    root.appendChild(c);
  }

  /* --- 错题本（跨章累计） --- */
  function allQuestions(){
    var out=[];
    DATA.subjects.forEach(function(s){
      (s.chapters||[]).forEach(function(c){
        (c.questions||[]).forEach(function(q){ out.push({q:q, sub:s, ch:c}); });
      });
    });
    return out;
  }
  function wrongList(){
    return allQuestions().filter(function(it){ return (state.wrong[it.q.id]||0) > 0; })
      .sort(function(a,b){ return (state.wrong[b.q.id]||0)-(state.wrong[a.q.id]||0); });
  }
  function paneWrong(root){
    var list=wrongList();
    if(!list.length){
      root.appendChild(el('div','empty','还没有错题。<br>去「练习」做几题吧 —— 做错的题会自动收进这里。'));
      return;
    }
    var stat=el('div','card');
    stat.innerHTML='<div class="between"><div style="font-size:17px;font-weight:800">错题本</div>'+
      '<span class="chip" style="background:#fff0f0;color:#e03131">'+list.length+' 题</span></div>'+
      '<div class="small muted" style="margin-top:6px">按错误次数排序 · 累计记录在本机</div>';
    var b=el('button','btn','只练错题（'+list.length+' 题）');
    b.onclick=function(){ startWrongQuiz(list.map(function(x){return x.q;})); };
    stat.appendChild(el('hr')); stat.appendChild(b);
    root.appendChild(stat);

    list.forEach(function(it){
      var q=it.q, ps=PS[q.priority]||PSD;
      var c=el('div','card');
      var kp=asList(q.keyPoints).map(function(k){ return '<span class="k">'+rich(k)+'</span>'; }).join('');
      c.innerHTML='<div class="row"><span class="tag" style="background:'+ps.b+';color:'+ps.c+'">'+ps.l+'</span>'+
        '<span class="chip" style="background:#fff0f0;color:#e03131">错 '+(state.wrong[q.id]||0)+' 次</span>'+
        '<span class="small muted">'+esc(it.sub.name+' · '+it.ch.name)+'</span></div>'+
        (kp?'<div class="kp"><span class="lab">考点</span>'+kp+'</div>':'')+
        '<div class="stem" style="margin:10px 0 8px">'+rich(q.stem)+'</div>'+
        '<div class="basis">正确答案：<b>'+esc(q.answer)+'</b>　依据：'+esc(q.basis||'')+'</div>';
      root.appendChild(c);
    });
    var clr=el('button','btn ghost','清空错题本');
    clr.onclick=function(){ if(confirm('确定清空所有错题记录？')){ state.wrong={}; saveState(state); render(); } };
    root.appendChild(clr);
  }
  function startWrongQuiz(qs){
    Q={ chId:'__wrong__', list:qs, i:0, pick:'', text:'', done:false, wrong:[] };
    R.tab='quiz'; render();
  }

  /* ---------- 总渲染 ---------- */
  function render(){
    renderSubjects();
    var t=$('ttl'), back=$('back');
    if(!R.sub){
      t.textContent='专业课'; back.style.display='none';
      setAccent(DEFAULT_ACCENT); renderHome(); return;
    }
    var s=curSub();
    if(!s){ R.sub=null; t.textContent='专业课'; back.style.display='none';
      setAccent(DEFAULT_ACCENT); renderHome(); return; }
    setAccent(s.color);
    if(!R.ch){ t.textContent=s.name; back.style.display='block'; renderChapters(); return; }
    // 深链可能带来「科目的章节 id 不匹配」（如 ?subject=heat&chapter=boiler-ch1）
    //   旧代码直接 curCh().name 会 TypeError 白屏，这里回落章节列表
    var c=curCh();
    if(!c){ R.ch=null; t.textContent=s.name; back.style.display='block'; renderChapters(); return; }
    t.textContent=c.name; back.style.display='block'; renderDetail();
  }
  $('back').onclick=function(){
    if(R.ch){ R.ch=null; Q=null; render(); }
    else if(R.sub){ R.sub=null; render(); }
  };

  /* 记录本次练习错题（供结果页用）；例题不算错题 */
  var _oldRender = render;
  render = function(){
    var cur = Q && Q.list[Q.i];
    if(Q && Q.done && cur && Q.lastOk===false
       && cur.kind!=='例题' && cur.kind!=='计算'
       && Q.wrong.indexOf(cur)<0){
      Q.wrong.push(cur);
    }
    _oldRender();
  };

  /* 深链：?subject=boiler&chapter=boiler-intro&tab=points */
  try{
    var p=new URLSearchParams(location.search);
    if(p.get('subject')) R.sub=p.get('subject');
    if(p.get('chapter')) R.ch=p.get('chapter');
    if(p.get('tab')) R.tab=p.get('tab');
  }catch(e){}

  /* 注册 Service Worker（离线可用）。file:// 下会失败，忽略即可。 */
  /* 更新策略：新版本接管后自动重载一次 —— 部署完不用手动清缓存 */
  if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    // 只有「已经被 SW 接管过」的页面才监听切换，避免首次安装多一次重载
    if(navigator.serviceWorker.controller){
      var __swRefreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(__swRefreshing) return;
        __swRefreshing = true;
        location.reload();
      });
    }
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
        .then(function(reg){
          reg.update();                       // 每次打开都主动查新版本
          // 从后台切回时再查一次（已装成 PWA 的情况）
          document.addEventListener('visibilitychange', function(){
            if(!document.hidden) reg.update();
          });
        })
        .catch(function(){});
    });
  }

  render();
})();
</script>
</body>
</html>
