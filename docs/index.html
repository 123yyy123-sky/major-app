7 年傅里叶提出分离变量法","children":[]},{"label":"1822 年《热的解析理论》提出傅里叶定律","children":[]},{"label":"傅里叶成为导热理论的奠基人","children":[]}]},{"label":"对流发展简史","children":[{"label":"1823 年纳维提出不可压缩流体流动方程","children":[]},{"label":"1845 年斯托克斯形成纳维-斯托克斯方程","children":[]},{"label":"1880 年雷诺提出无量纲雷诺数","children":[]},{"label":"1904 年普朗特提出边界层概念","children":[]},{"label":"1921 年波尔豪森引进热边界层概念","children":[]},{"label":"湍流计算模型随认识深化而蓬勃发展","children":[]}]},{"label":"热辐射发展简史","children":[{"label":"1889 年卢默等测得黑体辐射光谱能量分布","children":[]},{"label":"斯忒藩—玻耳兹曼定律确立四次方律","children":[]},{"label":"维恩公式短波段符合，瑞利—金斯公式出现紫外灾难","children":[]},{"label":"1900 年普朗克公式在整个光谱段完全符合","children":[]},{"label":"基尔霍夫解答发射率与吸收比的关系问题","children":[]},{"label":"净辐射法、交换因子法与模拟网络法","children":[]}]}]},{"label":"1-1 热量传递的三种基本方式","children":[{"label":"热传导、热对流、热辐射是三种基本方式","children":[]},{"label":"导热依靠微观粒子热运动，必须有温差","children":[]},{"label":"导热机理随气体、固体、液体而不同","children":[]},{"label":"大平壁一维稳态导热给出热流量公式","children":[]},{"label":"傅里叶定律用热流密度表示","children":[]},{"label":"热对流与对流换热是两个不同概念","children":[]},{"label":"对流换热必然伴随热传导，只能发生在流体中","children":[]},{"label":"对流换热按是否相变与流动原因分类","children":[]},{"label":"牛顿冷却公式引入表面传热系数 h","children":[]},{"label":"h 反映对流强弱并受五类因素影响","children":[]},{"label":"辐射与热辐射的定义","children":[]},{"label":"电磁理论与量子理论两种解释","children":[]},{"label":"电磁波描述式 c=λν","children":[]},{"label":"电磁波谱与热射线波段","children":[]},{"label":"热辐射的四个主要特点","children":[]},{"label":"辐射换热与能量形式的变化","children":[]},{"label":"辐射换热的两类影响因素","children":[]},{"label":"辐射力与黑体的定义","children":[]},{"label":"黑体辐射力 Eb=σbT^4","children":[]},{"label":"实际物体 E=εσbT^4 与发射率 ε","children":[]}]},{"label":"1-2 传热过程与传热系数","children":[{"label":"传热过程的定义与组成","children":[]},{"label":"三个相互串联的传热环节","children":[]},{"label":"通过平壁的稳态传热过程","children":[]},{"label":"平壁传热的三个环节公式","children":[]},{"label":"用电阻类比引出热阻概念","children":[]},{"label":"平壁导热热阻 Rλ=δ/(Aλ)","children":[]},{"label":"对流换热热阻 Rh=1/(Ah)","children":[]},{"label":"传热热阻 Rk=Rh1+Rλ+Rh2","children":[]},{"label":"传热系数 k 与热流密度 q","children":[]},{"label":"串联热阻网络的图示","children":[]},{"label":"例题：铝壶底外壁温度 t1","children":[]}]},{"label":"本章小结","children":[{"label":"四种热量传递的速率方程","children":[]},{"label":"速率方程的系数与注意事项","children":[]},{"label":"例题1-5 冬夏人体散热量对比","children":[]},{"label":"暖水瓶保温与树叶结霜例子","children":[]}]}]},"points":[{"id":"p-h1a-1","title":"课程信息与课时安排","key":true,"source":"课件 p001–p003","items":["课程名称：传热学（Heat Transfer），授课教师：廖雷，地点 M2509，邮箱：liaolei@ctgu.edu.cn。","课时安排共九个单元：单元1 绪论 4学时；单元2 稳态热传导的规律及计算 6学时；单元3 非稳态热传导的计算 6学时；单元4 对流传热的理论分析与试验研究基础 6学时；单元5 单相对流传热的实验关联式 6学时。","课时安排续：单元6 相变对流换热的计算 6学时；单元7 热辐射基本定律和物体的辐射特性 6学时；单元8 辐射传热计算 4学时；单元9 换热器 4学时。","课件列出的首选用书：《传热学》（第五版）. 陶文铨. 高等教育出版社，2018。","课件列出的其他书目：[1]《传热学重点难点及典型题精解》. 王秋旺编. 西安交通大学出版社，2001；[2]《Heat Transfer》. Holman J P. 10th ed. McGraw-Hill, 2002；[3]《传热学》（第三版）. 杨世铭. 高等教育出版社，1998；[4]《传热学》（第一版）. 程尚模. 高等教育出版社，1990；[5] 相关网址 http://abook.hep.com.cn/1228848。"]},{"id":"p-h1a-2","title":"热与传热的基本概念","key":true,"source":"课件 p005","items":["物体所具有的能量可分为两部分：一部分是**宏观运动动能、势能**；另一部分称为**热力学能**，由物质的 `p`、`v`、`T` 决定。","**热**：因温差而传递的热力学能。","**传热**：热力学能的传递。课件原文强调传热在我们的生活中可以说「到处都有，随处可见」。"]},{"id":"p-h1a-3","title":"人体冷暖与风冷指数","key":true,"source":"课件 p006–p007","items":["日常生活例子之一：人体冷暖程度——同样室温 `25℃` 下，冬天人体散热量大而感到冷，夏天人体散热量小而觉得热（课件以「冬天」「夏天」两幅对照图说明）。","**风冷指数（wind chill index）**用「人的皮肤散热的热流密度」来度量冷暖感受。","人的皮肤散热的热流密度取值：热 `58W/m²`；舒服 `232W/m²`；凉快 `696W/m²`；冷 `928W/m²`。","该系列数值说明散热量越大，人的主观感受越冷；散热量越小则觉得越热。"]},{"id":"p-h1a-4","title":"伯格曼法则与动物体型","key":true,"source":"课件 p008–p009","items":["自然界的**伯格曼法则**：对于同一种温血动物，越冷的地方其个体越大，而且越接近于圆形（球形）。","体型例证一：西伯利亚北极旅鼠的平均长度为 `10~11` 厘米，往南一点、分散在北极边缘地区的旅鼠身长只有 `8` 厘米。","体型例证二：北极兔子的长度为 `90` 厘米，在苏格兰，同一种兔子其身长平均只有 `70` 厘米。","体型例证三：北极狐狸比沙漠地区的狐狸大；北极狼比生活在温暖地区的狼要大，而且肥得多。"]},{"id":"p-h1a-5","title":"日常生活中其他传热现象","key":true,"source":"课件 p010–p012","items":["日常生活例子之三：衣服颜色——课件以黄、棕、红、深棕、黑五块不同颜色布料的照片直观对比颜色对传热的影响。","日常生活例子之四：北方窗户双层玻璃——课件给出双层玻璃窗的实物与断面照片，说明用双层玻璃减少散热。","日常生活例子之五：泰坦尼克号，Jack and Rose——课件以电影《泰坦尼克号》海报为引例，提示低温海水中的传热问题。"]},{"id":"p-h1a-6","title":"隧道火灾事故案例","key":true,"source":"课件 p013","items":["2000年11月11日，奥地利滑雪胜地基茨斯泰因霍恩峰隧道大火隧道火灾，两节车厢的列车由一条钢缆牵引，沿着一个 `45` 度倾斜角的铁轨行驶，`155` 人死亡。","该次事故中 `18` 名游客得以逃生，其中 `12` 人是在缆车着火后立即打破车窗从隧道下部出口脱险的。","课件用该火灾案例说明传热与流动在灾害逃生中的作用。"]},{"id":"p-h1a-7","title":"建筑节能与温室效应","key":true,"source":"课件 p014–p016","items":["节能环保之建筑环境：课件以建筑外墙与各类空心、多孔保温砌块（红色砖块制品）的图片说明建筑围护结构的保温隔热。","青岛：新建房须达节能 `50%` 标准；新建住宅要求外穿「棉袄」、里贴铝箔。","穿「棉袄」：在住宅的外墙内侧加装轻质高效保温的**隔热层**，或在外墙外表面涂刷**白色或浅色涂料**，以提高外墙的保温隔热性能。","贴铝箔：在屋顶（或顶棚）内表面加贴铝箔等**低辐射系数材料**，以降低屋顶内表面与人体之间的**辐射换热**。","大气环境（温室效应）：课件给出温室效应示意图，标注「入射的短波辐射」「反射辐射」等过程。","温室效应例证：太平洋的图瓦卢岛国举国移民（`26` 平方千米）。","人类 `1` 年使用全部能源折合 `80` 亿吨石油，`33×10¹⁶kJ` 热量，全部加热海洋，海水温升 `6×10⁻⁵℃`，加热 `1` 万年，上升 `1℃`。"]},{"id":"p-h1a-8","title":"能源动力中的换热设备","key":true,"source":"课件 p017","items":["一般工业技术之能源动力：课件以燃煤电厂系统图说明锅炉、汽轮机、凝汽器与冷却塔之间的热量传递与流动。","图中标注的关键设备与流向：「凝汽器」位于汽轮机排汽侧；红色箭头标注「热水去冷却塔」，蓝色箭头标注「凉水来自冷却塔」。","冷却水在凝汽器中吸热后去冷却塔放热，再回到凝汽器，构成循环冷却系统。"]},{"id":"p-h1a-9","title":"制冷空调中的换热器与翅片","key":true,"source":"课件 p018–p019","items":["制冷空调（冰箱/空调）：课件给出 Refrigerator/Air-Conditioner 制冷循环原理图，标注 Compressor、Condenser、Exp. Valve、Evaporator 四个部件以及 `1`、`2`、`3`、`4` 四个状态点。","冰箱原理示意图标注：Freezer compartment（`-18℃`）、Kitchen air `25℃`、Evaporator coils、Capillary tube、Condenser coils、`Q_H`、`Q_L`、`3℃`。","空调机形式对比：由「窗式空调器」发展到「分体空调」。","家用空调中制冷剂与空气之间发生热量交换的设备，称为「**换热器**」。换热器的**空气侧**采用多种能增大所传递热量的**翅片（Fin）**。","课件给出的翅片形式依次为：平直翅片、波纹翅片、平开缝翅片、X型开缝翅片（图上并标注「制冷剂」与「空气」的流动方向）。"]},{"id":"p-h1a-10","title":"低肋片管与管径小型化","key":true,"source":"课件 p020","items":["管内（制冷剂）侧采用多种能强化传热的**低肋片管**。","课件以「单螺旋内肋管剖面图」与「三维内肋管剖面图」展示管内肋片的强化传热结构，并标注「空气流动」方向。","管径变化趋势：管径从 `9.52mm` → `7mm` → `5mm`。","课件实物照片标注实测管径 `φ=9.52mm` 与 `φ=7.0mm`。"]},{"id":"p-h1a-11","title":"石油化工中的换热器","key":true,"source":"课件 p021","items":["一般工业技术之石油化工：课件标题明确写出「石油化工（化工厂 `40%` 设备是换热器）」。","课件以抽油机（采油）照片与化工厂大型冷却塔/换热设备群照片作为该领域的图示。"]},{"id":"p-h1a-12","title":"航空航天中的冷却与隔热","key":true,"source":"课件 p022–p023","items":["航空航天之航空发动机：课件给出涡轮叶片冷却结构图，标注「气膜冷却」「内冷通道」「粗糙元」「针肋」「冲击冷却」「压力面」「吸力面」「高温燃气」「冷空气」「冷却气体排入主流」。","航空发动机冷却方式包含：叶片表面的**气膜冷却**、内部的**冲击冷却**，以及通道内设置**粗糙元**与**针肋**强化换热。","航空航天之航天飞机：课件给出航天飞机照片，标注「外燃料箱」「固体燃料火箭助推器」「轨道飞行器」三大部分。","航天飞机热防护：课件展示「隔热瓦」实物照片，用于承受再入大气层的高温。","课件标注事故时间：`2003.2.1`：Space Shuttle Columbia disaster。"]},{"id":"p-h1b-1","title":"航天飞机的热防护问题","key":true,"source":"课件 p024","items":["**航天飞机的热防护**：航天飞机重返地球时，以当地音速20倍的极高速度进入大气层，在气体粘性的作用下产生大量的摩擦热使飞行器表面剧烈地受热，飞行器表面温度可达几千K。","必须采用隔热性能良好的材料对表面进行热防护，才能使其安全返回。","课件配图为 (a)美国的航天飞机 与 (b)回收的神州5号航天器外壳。"]},{"id":"p-h1b-2","title":"哥伦比亚号隔热瓦事故","key":true,"source":"课件 p025","items":["美国“哥伦比亚号”航天飞机在2003年2月1日重返大气层时由于机体表面**隔热瓦**的缺陷造成超高温气体侵入，导致机毁人亡的悲惨事故。","总损失达到130亿美元。","2005年8月“发现号”返回前美国宇航局专门在太空中对防护瓦进行了检查，确认没有问题后才让其返回！"]},{"id":"p-h1b-3","title":"电子器件的冷却技术","key":true,"source":"课件 p026","items":["5：电子器件的冷却技术：随着CPU功率的迅速增加，芯片的冷却要求越来越高，从一般空气冷却的整体翅片散热器，到开缝翅片散热器，到热管以及微细通道的水冷却器。","Figure 1: Junction Life Statistics 给出结温与失效率关系：横轴 Junction Temperature °C，纵轴 Failure rate (percent per 100,000 hrs)，资料来源：GEC研究院。","右上图给出失效因子 f_T = failure rate at T / failure rate at 75°C，横轴 Temperature °C 从 20 到 140，并在 75 处画虚线。"]},{"id":"p-h1b-4","title":"电子失效主因统计","key":true,"source":"课件 p026","items":["Figure 2: Major Causes of Electronics Failures 给出电子器件失效的主要原因及占比：温度 55%、震动 20%、潮湿 19%、粉尘 6%。","资料来源：美国空军航空电子整体研究项目。","课件 p027 用“点燃火柴？”“烤红薯？”“煎鸡蛋？”三张图展示计算机散热不良的后果。"]},{"id":"p-h1b-5","title":"冷却技术演进途径","key":true,"source":"课件 p028","items":["冷却技术按箭头依次演进：从整体翅片到开缝，再从空气强制对流冷却到热管冷却，再从热管冷却到微细通道的水冷却。","整体翅片方案中**芯片置于翅片的底板下**（置于底板下的芯片、金属翅片）。","热管冷却方案标注：冷却芯片的热管蒸发段、芯片、冷却器外壳。","微细通道水冷却方案标注：微细通道。"]},{"id":"p-h1b-6","title":"微纳米传热学的对象","key":true,"source":"课件 p029–p030","items":["6. 微纳米传热学（Micro-Nano Heat Transfer）。","①微型换热器：课件给出小型换热器实物图，尺寸仅与手掌相当。","②微反应器与微泵：课件给出微反应器实物（与干电池对比大小）以及微泵与钢笔对比的实物图。"]},{"id":"p-h1b-7","title":"人体散热的途径与占比","key":true,"source":"课件 p031","items":["7. 生物传热学 ①人体的散热。","正常情况下人体的散热：辐射 40%、单相对流 27%、出汗（相变）30%、导热 3%。","课件配图英文对照：Radiation 40%、Convection 27%、Evaporation 30%、Conduction 3%，并标出 Air motion（空气流动）与 Floor（地面）。"]},{"id":"p-h1b-8","title":"生物界的翅片与艾伦推论","key":true,"source":"课件 p032–p034","items":["②所有生物都运用传热学原理来调节体内的温度。","翅片并非人类的发明：古代动物身上早就用上了；夏天犬类都伸出舌头散热。","**翅片(fin)**：人与动物的舌头、手指、耳朵，手脚；并引出“寒从脚起”“生冻疮”。","**艾伦推论**：同一种动物，在愈冷的地方，其四肢和附器（耳朵和尾巴等）也就愈短或愈小。","北极熊身体称流线型，而不是圆球形，为了潜水捕捉海豹和鱼。","“艾伦推论”在狐狸身上的体现：北极狐狸（上）耳朵最小，生活美国南方沙漠中的敏狐（下）耳朵最大，生活在美国中部的红狐（中）耳朵大小居中。"]},{"id":"p-h1b-9","title":"人的肺是热质交换设备","key":true,"source":"课件 p035","items":["③人的肺是一个高度紧凑的热、质交换设备。","呼吸过程中冷的环境空气以 Cool ambient air 20°C 吸入，经气管（Trachea）进入肺，肺体温度标为 37°C。","呼出的是 Warm and moist exhaled air 35°C，肺内完成 Lungs Heat and moisture 的加热与加湿。"]},{"id":"p-h1b-10","title":"分布式能源与燃料电池","key":true,"source":"课件 p036–p038","items":["8. 其它：分布式能源技术（**DES**）包括 1）地源热泵 2）微型燃气轮机 3）燃料电池（**Fuel Cells**）。","燃料电池原理图：Hydrogen (H₂) in 与 Oxygen (O₂) in 进入，经 FLOW FIELD 与 MEMBRANE 反应，输出 Water (H₂O) out，同时放出 Heat。","应用实例：上：人造卫星；中：燃料电池电动汽车；下：德国新世纪的水中霸王--U212/U214潜艇。","大：加拿大Ballard公司，250kW，柏林；小：燃料电池电源手机（以色列特拉维夫大学在2002年4月26日研制出待机642个小时，通话时间可达13小时的手机燃料电池）；小：氢燃料电池充电器(2015)。"]},{"id":"p-h1b-11","title":"什么是传热学","key":true,"source":"课件 p039","items":["第一个问题：什么是传热学？传热学是研究什么内容的？","传热学是研究热量传递规律的一门学科。","热量的传递是在温差作用下发生的！","因此传热学是研究在温差作用下热量传递规律的一门学科。","课件用 Hot coffee 70°C 与 25°C 环境的杯子示意热量由高温传向低温。"]},{"id":"p-h1b-12","title":"与工程热力学的关系","key":true,"source":"课件 p040–p041","items":["1. 工程热力学 1) 都是物理学热学一部分，热力学第一定律是研究一切热传递现象的基本依据。","两种介质分界面上的能量平衡（热平衡）：`q_0⁺ = q_0⁻`，就是热力学第一定律的应用。","热力学研究平衡态，不讲究热量传递的速率，时间不出现在热力学各物理量单位的分母中（单位 J/kg）。","传热学研究非平衡态，着重研究热量传递的速率（q: J/(m²s) = W/m²）。","课件举例（铁块 M₁ 1000℃ 落入油 M₂ 100℃、假设油的热容量很大）：热力学研究每公斤钢从1000℃冷到100℃所散失的热量；传热学研究钢块中某点（如中心）冷却到某个温度所需要的时间。"]},{"id":"p-h1b-13","title":"与流体力学的关系","key":true,"source":"课件 p042","items":["1) 流体力学研究流体（包括液体和气体）这样一种连续介质的宏观运动规律以及它与固体之间相互作用的力；一般地说，它不涉及流体与固体之间的热量传递。","2) 对流换热与流体的流动密不可分，流体力学是传热学的先修课程。","流体力学：一般研究等温流动，研究流动的阻力（图中标注来流速度 u_∞）。","传热学：研究有温差的流动，研究流体与固体间热量的交换（图中标注 t_∞ 与 t_w）。"]},{"id":"p-h1b-14","title":"特点、研究对象与研究方法","key":true,"source":"课件 p043–p045","items":["1、特点 1）理论性、应用性强：在热量传递的理论分析中涉及到很深的数学理论和方法，在生产技术领域应用十分广泛。","2）有利于创造性思维能力的培养：具有很强的启发性，留有一定的思维空间，对综合性、应用性强的传热问题都有详细地分析讨论。","3）教育思想发生了本质性的变化：从实际工程问题中、科学研究中提炼出综合分析题，重点培养解决分析综合问题的能力。","2、研究对象：传热学研究的对象是热量传递规律。","3、研究方法：研究的是由微观粒子热运动所决定的宏观物理现象，而且主要用经验的方法寻求热量传递的规律，认为研究对象是个连续体，即各点的温度、密度、速度是坐标的连续函数，即将微观粒子的微观物理过程作为宏观现象处理。","具体可利用数学分析法、积分近似解法、比拟法、数值计算和实验研究进行分析计算，各种方法相辅相成，互为补充。"]},{"id":"p-h1c-1","title":"传热学的学习目的","key":true,"source":"课件 p046","items":["本页标题为「传热学的特点、研究对象及研究方法」，其中第 4 条为**学习目的**。","学习目的：通过学习能熟练掌握传热过程的基本规律、实验测试技术及分析计算方法，从而达到认识、控制、优化传热过程的目的。"]},{"id":"p-h1c-2","title":"传热学发展简史概述","key":true,"source":"课件 p047","items":["传热学这一门学科是在 18 世纪 30 年代英国开始的工业革命使生产力空前发展的条件下发展起来的。","传热学的发展史实际就是：**导热、对流、热辐射三种传方式的发展史**。","一、导热：确认热是一种运动的过程中，科学史上有两个著名的实验起着关键作用，其一是 1798 年伦福特钻炮筒大量发热实验；其二是 1799 年戴维两块冰块摩擦生热化成水的实验。"]},{"id":"p-h1c-3","title":"导热发展简史","key":true,"source":"课件 p048","items":["19 世纪初，兰贝特、毕渥、傅里叶等都从固体一维导热的试验入手研究。","1804 年毕渥根据试验提出：单位时间通过单位面积的导热量正比于两侧表面温差，反比于壁厚，比例系数是材料的物理性质；其作用是这一规律提高对导热规律的认识，只是粗糙些。","1807 年傅里叶把实验与理论结合起来，提出求解微分方程的分离变量法和可以将解表示成一系列任意函数的概念。","1822 年论著《热的解析理论》完成了导热理论的任务，提出的导热基本定律「傅里叶定律」。","导热微分方程、傅里叶级数正确地概括了导热实验的结果，使他成为导热理论的奠基人。"]},{"id":"p-h1c-4","title":"对流发展简史","key":true,"source":"课件 p049–p050","items":["二、对流：1823 年纳维提出不可压缩流体流动方程；1845 年英国斯托克斯将其修改为纳维-斯托克斯方程，形成流体流动基本方程。","1880 年雷诺提出无量纲雷诺数；在雷诺的基础上，1881 年洛仑兹自然对流解。","1885 年格雷茨和 1910 年努塞尔获得管内换热的理论解；1916 年努塞尔又获得凝结换热理论解。","1909 年和 1915 年努塞尔的论文对强制对流和自然对流的基本微分方程及边界条件进行量纲分析，获得了有关无量纲数之间的准则关系。","在微分方程的理论求解上，其一是普朗特于 1904 年提出的边界层概念；1921 年波尔豪森又引进了热边界层的概念；1930 年波尔豪森与数学家施密特、贝克曼合作，成功地求解了竖壁附近空气的自然对流换热。","其二是湍流计算模型的发展：1925 年的普朗特比拟、1939 年的卡门比拟以及 1947 年马丁纳利的引伸记录着早期发展的轨迹，湍流计算模型的研究逐渐发展成为传热学研究中的一个令人瞩目的热点。"]},{"id":"p-h1c-5","title":"热辐射发展简史","key":true,"source":"课件 p051–p052","items":["1889 年卢默等人测得了黑体辐射光谱能量分布的实验数据。","19 世纪末斯忒藩根据实验确立了四次方律，后在理论上被玻耳兹曼所证实，这个规律被称为斯忒藩—玻耳兹曼定律。","1896 年维恩通过半理论半经验的方法推导出一个公式，该公式在短波段与实验结果符合较好。","瑞利—金斯公式在长波段与实验结果比较符合而在短波段则与实验差距很大，在高频部分即紫外部分遇到了无法克服的困难，被称为「紫外灾难」。","1900 年普朗克提出了一个公式，后经实验证实与实际情况在整个光谱段完全符合；1905 年爱因斯坦的光量子研究得到公认后，普朗克公式才为人们所接受，普朗克定律正确地揭示了黑体辐射能量光谱分布的规律，奠定了热辐射理论的基础。","在辐射热量交换方面有两个重要的理论问题：其一是物体的发射率与吸收比之间的关系问题，1859 和 1860 年基尔霍夫的两篇论文提供了解答；其二是物体间辐射换热的计算方法，1935 年波略克提出净辐射法，1954 年霍特尔提出、1967 年又加以改进的交换因子法以及 1956 年奥本亥姆提出的模拟网络法，是三种受到重视的计算方法。"]},{"id":"p-h1c-6","title":"传热学的新发展与挑战","key":true,"source":"课件 p053","items":["测量新技术、计算机、激光技术等新技术引入实验研究，对传热学的发展也发挥了重要作用。","由于计算机的迅速发展，用数值方法对传热问题的分析研究取得了重大进展，在 20 世纪 70 年代已经形成一个新兴分支——**数值传热学**。","当前，能源技术、环境技术、材料科学、微电子技术、空间技术等新兴科学技术的发展，向传热学提出了新的课题和新的挑战。"]},{"id":"p-h1c-7","title":"热量传递的三种基本方式","key":true,"source":"课件 p055","items":["本页为节标题页「1-1 热量传递的三种基本方式」。","热量传递基本方式：**热传导、热对流、热辐射**。","配图为电磁炉加热示意图，图上标注有铁质锅、陶瓷玻璃板、涡电流、磁力线、诱导加热线圈。"]},{"id":"p-h1c-8","title":"导热的定义与特点","key":true,"source":"课件 p056","items":["（1）**定义**：指温度不同的物体各部分或温度不同的两物体间直接接触时，依靠分子、原子及自由电子等微观粒子热运动而进行的**热量传递现象**。","导热可以在固体、液体、气体中发生。","（2）导热的特点：a 必须有温差；b 物体直接接触；c 依靠分子、原子及自由电子等微观粒子热运动而传递热量；d 在引力场下单纯的导热只发生在密实固体中。"]},{"id":"p-h1c-9","title":"导热的机理","key":true,"source":"课件 p057","items":["（3）导热的机理 a 气体：气体分子不规则运动时相互碰撞的结果；","b 导电固体：自由电子运动；","c 非导电固体：晶格结构振动；","d 液体：兼有气体和固体导热的机理。"]},{"id":"p-h1c-10","title":"大平壁一维稳态导热与热流量","key":true,"source":"课件 p058–p059","items":["（4）导热的基本定律以「大平壁的一维稳态导热」为例，特点为：①平壁两表面维持均匀恒定不变温度；②平壁温度只沿垂直于壁面的方向发生变化；③平壁温度不随时间改变；④热量只沿着垂直于壁面的方向传递。","**热流量 Φ**：单位时间通过某一给定面积的热量称为热流量。","`Φ=λA(t_w1-t_w2)/δ=λA(Δt/δ)`，单位 W。","`λ` 为材料的热导率（导热系数）thermal conductivity，表明材料的导热能力；如常温下，铜棒为 398 W/(m·K)，松木为 0.35 W/(m·K)。","**热流密度** `q=Φ/A=λ(Δt/δ)`，单位 W/m²。"]},{"id":"p-h1c-11","title":"傅里叶定律与热流密度","key":true,"source":"课件 p060","items":["单位时间传递的热量称为热流量 Φ，单位为 W。","热流密度(heat flux)：`q=Φ/A=-λ(dt/dx)`。","其物理含义为单位时间通过单位面积的热流量（W/m²）。","`q=Φ/A=-λ(dt/dx)=-λ(t_w2-t_w1)/δ`。"]},{"id":"p-h1c-12","title":"热对流与对流换热","key":true,"source":"课件 p062–p063","items":["**热对流**：由于流体的宏观运动而引起的流体各部分之间发生相对位移，使不同温度的流体互相掺混所产生的热量传递过程。","**对流换热** convective heat transfer：流体与相互接触的固体表面之间的热量传递现象，是导热和热对流两种基本传热方式共同作用的结果。","对流换热的特点：必须有流体的宏观运动，同时必须存在温差；必然同时伴随着热传导，自然界不存在单一的热对流；只能发生在流体中；由于流体的粘性和受壁面摩擦阻力的影响，紧贴壁面处会形成速度梯度很大的边界层。"]},{"id":"p-h1c-13","title":"对流换热的分类","key":true,"source":"课件 p064","items":["对流换热按照不同的原因可分为多种类型。","按**是否相变**，分为：有相变的对流换热和无相变的对流换热。","按**流动原因**，分为：强迫对流换热和自然对流换热。"]},{"id":"p-h1c-14","title":"牛顿冷却公式与表面传热系数","key":true,"source":"课件 p065–p066","items":["**牛顿冷却公式**：`Φ=hA(t_w-t_f)` [W]；`q=Φ/A=h(t_w-t_f)` [W/m²]。","`A` — 与流体接触的壁面面积；`t_w` — 固体壁表面温度[℃]；`t_f` — 流体温度[℃]。","`h` — 表面传热系数，是表征对流换热过程强弱的物理量，[W/(m²·K)]。","h 的大小反映对流换热的强弱，与以下因素有关：(1)流体的物性（热导率、粘度、密度、比热容等）；(2)流体流动的形态（层流、紊流）；(3)流动的成因（自然对流或受迫对流）；(4)物体表面的形状、尺寸；(5)换热时流体有无相变（沸腾或凝结）。","表面传热系数 h 的数值范围 W/(m²·K)：空气自然对流换热 1~10；空气强迫对流换热 10~100；水自然对流换热 100~1000；水强迫对流换热 100~15000；水沸腾 2500~35000；水蒸气凝结 5000~25000。"]},{"id":"p-h1d-1","title":"热辐射的定义与两种理论","key":true,"source":"课件 p068","items":["**辐射**（radiation）：指物体受某种因素的激发而向外发射辐射能的现象。","**热辐射**：由于物体内部微观粒子的**热运动**而使物体向外发射辐射能的现象。","解释辐射现象的两种理论：**电磁理论**认为辐射能是由电磁波传输的能量；**量子理论**认为辐射能是由不连续的微观粒子（光子）所携带的能量。","电磁波的数学描述：`c=λν`。其中 `c` — 某介质中的光速，单位 m/s；`λ` — 波长，常用 μm 为单位；`ν` — 频率，单位 1/s。"]},{"id":"p-h1d-2","title":"电磁波谱与热射线波段","key":true,"source":"课件 p069","items":["电磁波的数学描述给出波谱（单位微米）：γ 射线、X 射线、紫外线、可见光、红外线、无线电波依次排列。","横坐标波长刻度为 0、0.000001、0.00001、0.0001、0.001、0.1、1、10、100、1000、10000（微米）。","图中用双箭头标出**热射线**，其区间覆盖紫外线、可见光与红外线所在的波段。","波谱下方给出各波段的应用举例：γ 射线探测、X 射线仪、紫外线探伤灯、太阳的可见光、红外线探测仪、微波炉。"]},{"id":"p-h1d-3","title":"热辐射的四个主要特点","key":true,"source":"课件 p070","items":["(1) 所有温度大于 0K 的物体都具有发射热辐射的能力，温度愈高，发射热辐射的能力愈强；发射热辐射时：内热能 → 辐射能。","(2) 所有实际物体都具有吸收热辐射的能力；吸收热辐射时：辐射能 → 内热能。","(3) 热辐射不依靠中间媒介，可以在**真空**中传播。","(4) 物体间以热辐射的方式进行的**热量传递是双向的**；热辐射是热量传递的基本方式之一。"]},{"id":"p-h1d-4","title":"辐射换热及其影响因素","key":true,"source":"课件 p071","items":["**辐射换热**：物体间靠热辐射进行的**热量传递**。","辐射换热不仅有能量转移，还有**能量形式的变化**：热能 —发射→ 辐射能 —吸收→ 热能。","发射辐射能是物质的**固有属性**。","辐射换热的主要影响因素：(1) 物体本身的温度、表面辐射特性；(2) 物体的大小、几何形状及相对位置。"]},{"id":"p-h1d-5","title":"辐射力与黑体的定义","key":true,"source":"课件 p072","items":["**辐射力**：物体单位表面积向外辐射的总能量可用 `E` 表示，其单位是 `[W/m²]`。","物体的温度越高、辐射能力越强；若物体的种类不同、表面状况不同，其辐射能力不同。","**黑体**是一种理想物体，是指能吸收投入到其表面上的所有热辐射能量，它的辐射能力只与温度有关。","黑体表面的辐射力可表示为 `E_b = σ_b T^4` `[W/m²]`。"]},{"id":"p-h1d-6","title":"斯蒂芬-玻尔兹曼定律与发射率","key":true,"source":"课件 p073","items":["`E_b` — 绝对黑体辐射力；`T` — 黑体表面的绝对温度（热力学温度）`[K]`。","`σ_b` — 斯蒂芬-玻尔兹曼常数，`5.67×10^-8 W/(m²K^4)`。","实际物体表面的辐射力可与黑体相比较而得到，表示为 `E = εσ_b T^4` `[W/m²]`。","`ε` — 实际物体表面的**发射率（黑度）**，取值 0-1；与物体的种类、表面状况和温度有关。"]},{"id":"p-h1d-7","title":"传热过程的定义与组成","key":true,"source":"课件 p075","items":["节标题为 **1-2 传热过程与传热系数**，其下第一项为「一、传热过程」。","**传热过程**（Heat transfer process）：指热量从固体壁面一侧的流体通过固体壁面传递到另一侧流体的过程。","传热过程通常由**导热、热对流、热辐射组合**形成。","图中换热器示意标出热流体进、热流体出、冷流体进、冷流体出，以及管外与空气的辐射换热。"]},{"id":"p-h1d-8","title":"传热过程的三个串联环节","key":true,"source":"课件 p076","items":["传热过程由**三个相互串联**的热量传递环节组成。","(1) 热量从高温流体 —对流换热（或对流＋辐射）→ 壁面。","(2) 热量从壁面一侧 —导热→ 壁面另侧。","(3) 热量从低温流体侧壁面 —对流换热（或对流＋辐射）→ 低温流体。","图中示意高温流体、固体壁、低温流体依次排列，热流由高温流体经固体壁流向低温流体。"]},{"id":"p-h1d-9","title":"通过平壁的稳态传热过程","key":true,"source":"课件 p077","items":["**假设**：`t_f1`、`t_f2`、`h_1`、`h_2` 不随时间变化；`λ` 为常数。","(1) 左侧的对流换热：`Φ = Ah_1(t_f1 - t_w1)`。","(2) 平壁的导热：`Φ = Aλ(t_w1 - t_w2)/δ`。","(3) 右侧的对流换热：`Φ = Ah_2(t_w2 - t_f2)`。","图中画出平壁内温度 `t` 沿 `x` 的分布曲线，坐标原点为 0、右端为 `δ`，并标出 `t_f1`、`t_w1`、`t_w2`、`t_f2`、`h_1`、`h_2`。"]},{"id":"p-h1d-10","title":"热阻概念与平壁导热热阻","key":true,"source":"课件 p078","items":["借鉴**电阻**的概念，提出**热阻**的概念：`电流 = 电位差/电阻`，`热流 = 温度差/热阻`。","`Φ = Aλ(t_w1 - t_w2)/δ = (t_w1 - t_w2)/(δ/(Aλ)) = (t_w1 - t_w2)/R_λ`。","`R_λ = δ/(Aλ)` 称为平壁的**导热热阻**（thermal resistance），表示物体对导热的阻力，单位为 **K/W**。","热阻网络：`t_w1` — `R_λ` — `t_w2`，热流 `Φ` 由 `t_w1` 流向 `t_w2`。"]},{"id":"p-h1d-11","title":"对流换热热阻","key":true,"source":"课件 p079","items":["**对流换热热阻**：牛顿冷却公式也可以写成欧姆定律表达式的形式。","`Φ = Ah(t_w - t_f) = (t_w - t_f)/(1/(Ah)) = (t_w - t_f)/R_h`。","`R_h = 1/(Ah)` 称为**对流换热热阻**，单位为 **K/W**。","对流换热热阻网络：`t_w` — `R_h` — `t_f`，热流 `Φ` 由 `t_w` 流向 `t_f`。"]},{"id":"p-h1d-12","title":"传热热阻与传热系数","key":true,"source":"课件 p080–p081","items":["三个环节写成热阻形式：`Φ = Ah_1(t_f1 - t_w1) = (t_f1 - t_w1)/R_h1`；`Φ = Aλ(t_w1 - t_w2)/δ = (t_w1 - t_w2)/R_λ`；`Φ = Ah_2(t_w2 - t_f2) = (t_f2 - t_w2)/R_h2`。","在稳态情况下，以上三式的热流量相同，可得 `Φ = (t_f1 - t_f2)/(1/(Ah_1) + δ/(Aλ) + 1/(Ah_2)) = (t_f1 - t_f2)/(R_h1 + R_λ + R_h2) = (t_f1 - t_f2)/R_k`。","式中 `R_k = R_h1 + R_λ + R_h2`，`R_k` 称为**传热热阻**；传热热阻网络为 `t_f1`—`R_h1`—`t_w1`—`R_λ`—`t_w2`—`R_h2`—`t_f2`。","将传热热流量的计算公式写成 `Φ = Ak(t_f1 - t_f2) = AkΔt`，式中 `k = 1/(1/h_1 + δ/λ + 1/h_2)`，`k` 称为**传热系数**（heat transfer coefficient），单位为 `W/(m²·K)`，`Δt` 为传热温差。","通过单位面积平壁的热流密度为 `q = k(t_f1 - t_f2) = (t_f1 - t_f2)/(1/h_1 + δ/λ + 1/h_2)`。","利用上述公式，可以很容易求得通过平壁的热流量 `Φ`、热流密度 `q` 及壁面温度 `t_w1`、`t_w2`。"]},{"id":"p-h1d-13","title":"例题：平底铝壶外壁温度求解","key":true,"source":"课件 p083–p084","items":["题目：有一平底铝制水壶，壶底直径 `D` 为 24cm，底厚 `δ`=2mm，内装 `t_f2`=20°C 的冷水，置于电炉上。","已知铝的导热系数 `λ` 为 200W/(m·K)，传热热流量 `Φ`=400W，壶内壁对冷水的换热系数 `h` 为 200W/(m²·K)，求壶底外壁的温度 `t_1`。","按热阻串联列式：`Φ = (t_1 - t_f2)/(δ/(λA) + 1/(hA))`。","`t_1 = t_f2 + (Φ/A)(δ/λ + 1/h) = (Φ/((1/4)πD²))(δ/λ + 1/h) = 64.3°C`。","另列：`Φ = (t_1 - t_2)/(δ/(λA)) = (t_2 - t_f2)/(1/(hA))`，`t_2 = t_1 - (Φ/A)(δ/λ) = t_f2 + (Φ/A)(1/h)`。"]},{"id":"p-h1d-14","title":"本章小结：热量传递速率方程","key":true,"source":"课件 p085","items":["**本章小结**第 1 项为热量传递的速率方程，表中列出序号、传递方式、速率方程、有关系数、注意事项。","1 导热：`φ = -λA(dt/dx)`，`λ` 是物性参数，单位 `W/(m·K)`，注意事项为**负号的意义**。","2 对流换热：`φ = hAΔt`，`h` 不是物性参数，单位 `W/(m²·K)`，与流体及过程有关。","3 辐射换热：`φ = ε_1σA_1(T_1^4 - T_2^4)`，`ε` 是无量纲量，`σ` 单位 `W/(m²·K^4)`，物体 1 被包围在大物体 2 中。","4 传热过程：`φ = kAΔt`，`k` 单位 `W/(m²·K)`，与两侧流体及过程有关。"]},{"id":"p-h1d-15","title":"例题1-5 人体冬夏散热量对比","key":true,"source":"课件 p086–p088","items":["例题 **1-5**：室温 25°C，人体与空气的对流换热系数取为 2.6 W/(m²·K)，人体表面温度为 30°C，表面发射率 0.95，四周墙壁夏天 26°C、冬天 10°C。","分析：人体冷暖的感觉是由于其散热量不同所致；假定 (1) 不计人体与地板之间的热传递；(2) 过程是稳态的。","人体的总散热量是对流与辐射换热的总和，人体与四周墙体的辐射符合大空间中一个小物体的模型：`φ = hA(t_w1 - t_f) + εAσ(T_w1^4 - T_w2^4)`。","将人体的散热面积简化为直径 25 厘米、高 175 厘米的圆柱体，得 `φ_summer = 18.5W + 33.4W = 51.9W`，`φ_winter = 18.5W + 154W = 172.5W`。","结论：冬天的散热量是夏天的三倍多，导致冬感觉「冷」而夏则感觉「热」（热量散出去不多）。","日常生活中的例子：暖水瓶胆为镀银真空夹层玻璃，暖水瓶的保温原理是什么；深秋晴朗的夜晚容易结霜，为什么，树叶上的霜在上面还是下面。"]}],"questions":[{"id":"q-h1a-1","kind":"单选","priority":2,"source":"课件 p007","sourceDetail":"课件 p007（依据正文自拟）","keyPoints":["风冷指数用人的皮肤散热的热流密度度量","热 `58W/m²`、舒服 `232W/m²`、凉快 `696W/m²`、冷 `928W/m²`"],"stem":"风冷指数（wind chill index）用人的皮肤散热的热流密度来度量冷暖感受。按课件给出的数据，人感觉「热」时对应的皮肤散热热流密度是：","options":[{"k":"A","t":"`58W/m²`"},{"k":"B","t":"`232W/m²`"},{"k":"C","t":"`696W/m²`"},{"k":"D","t":"`928W/m²`"}],"answer":"A","why":["A ✓ 课件 p007 原文：热：`58W/m²`。","B ✗ 课件 p007 中 `232W/m²` 对应的是「舒服」。","C ✗ 课件 p007 中 `696W/m²` 对应的是「凉快」。","D ✗ 课件 p007 中 `928W/m²` 对应的是「冷」。"],"basis":"课件 p007（原文）","answerNote":"答案由课件 p007 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h1a-2","kind":"单选","priority":2,"source":"课件 p005","sourceDetail":"课件 p005（依据正文自拟）","keyPoints":["热：因温差而传递的热力学能","热力学能由物质的 `p`、`v`、`T` 决定"],"stem":"按课件对基本概念的表述，「热」的定义是：","options":[{"k":"A","t":"物体所具有的宏观运动动能与势能"},{"k":"B","t":"因温差而传递的热力学能"},{"k":"C","t":"由物质的 `p`、`v`、`T` 决定的热力学能本身"},{"k":"D","t":"物体温度的高低程度"}],"answer":"B","why":["A ✗ 课件 p005 中「宏观运动动能、势能」是物体能量中与热力学能并列的另一部分，不是热的定义。","B ✓ 课件 p005 原文：热：因温差而传递的热力学能。","C ✗ 课件 p005 说「热力学能：由物质的 `p`、`v`、`T` 决定」，这是热力学能的定义而非热的定义。","D ✗ 课件 p005 未给出该表述。"],"basis":"课件 p005（原文）","answerNote":"答案由课件 p005 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h1a-3","kind":"单选","priority":2,"source":"课件 p008","sourceDetail":"课件 p008（依据正文自拟）","keyPoints":["伯格曼法则：同一种温血动物，越冷的地方个体越大且越接近圆形"],"stem":"课件引述的「自然界的伯格曼法则」指出，对于同一种温血动物：","options":[{"k":"A","t":"越冷的地方其个体越小，且越细长"},{"k":"B","t":"越冷的地方其个体越大，而且越接近于圆形（球形）"},{"k":"C","t":"个体大小与环境温度无关"},{"k":"D","t":"越热的地方其个体越大，而且越接近于圆形（球形）"}],"answer":"B","why":["A ✗ 与课件 p008 表述相反。","B ✓ 课件 p008 原文：对于同一种温血动物，越冷的地方其个体越大，而且越接近于圆形（球形）。","C ✗ 课件 p008 明确把体型与环境冷暖联系起来。","D ✗ 课件 p008 说的是「越冷的地方」，不是越热的地方。"],"basis":"课件 p008（原文）","answerNote":"答案由课件 p008 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h1b-1","kind":"单选","priority":2,"source":"课件 p031","sourceDetail":"课件 p031（依据正文自拟）","keyPoints":["人体散热的四条途径","辐射散热占40%为最大项"],"stem":"课件给出正常情况下人体的散热比例，其中占比最大的是哪一项？","options":[{"k":"A","t":"单相对流 27%"},{"k":"B","t":"辐射 40%"},{"k":"C","t":"出汗（相变）30%"},{"k":"D","t":"导热 3%"}],"answer":"B","why":["A ✗ 课件 p031 原文为单相对流 27%，小于辐射的 40%","B ✓ 课件 p031 原文：辐射 40%，为四项中占比最大者","C ✗ 课件 p031 原文为出汗（相变）30%，小于 40%","D ✗ 课件 p031 原文为导热 3%，是四项中占比最小的"],"basis":"课件 p031（原文）","answerNote":"答案由课件 p031 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h1b-2","kind":"单选","priority":2,"source":"课件 p041","sourceDetail":"课件 p041（依据正文自拟）","keyPoints":["热力学研究平衡态不讲速率","传热学研究非平衡态、研究速率"],"stem":"关于工程热力学与传热学研究内容的差别，下列说法与课件一致的是？","options":[{"k":"A","t":"热力学研究非平衡态，着重研究热量传递的速率"},{"k":"B","t":"时间会出现在热力学各物理量单位的分母中"},{"k":"C","t":"传热学着重研究热量传递的速率，单位可写为 J/(m²s) = W/m²"},{"k":"D","t":"传热学研究平衡态，但不讲究热量传递的速率"}],"answer":"C","why":["A ✗ 课件 p041 原文：热力学研究平衡态，不讲究热量传递的速率","B ✗ 课件 p041 原文：时间不出现在热力学各物理量单位的分母中（单位 J/kg）","C ✓ 课件 p041 原文：传热学研究非平衡态，着重研究热量传递的速率（q: J/(m²s) = W/m²）","D ✗ 课件 p041 原文：传热学研究非平衡态，而非平衡态"],"basis":"课件 p041（原文）","answerNote":"答案由课件 p041 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h1b-3","kind":"单选","priority":2,"source":"课件 p042","sourceDetail":"课件 p042（依据正文自拟）","keyPoints":["流体力学研究等温流动与流动阻力","流体力学是传热学的先修课程"],"stem":"课件对流体力学与传热学的比较中，下列说法正确的是？","options":[{"k":"A","t":"流体力学一般研究有温差的流动，研究流体与固体间热量的交换"},{"k":"B","t":"流体力学一般研究等温流动，研究流动的阻力"},{"k":"C","t":"流体力学是传热学的后续课程"},{"k":"D","t":"传热学不涉及流体与固体之间的热量传递"}],"answer":"B","why":["A ✗ 课件 p042 原文：研究有温差的流动、研究流体与固体间热量的交换的是传热学","B ✓ 课件 p042 原文：流体力学一般研究等温流动，研究流动的阻力","C ✗ 课件 p042 原文：流体力学是传热学的先修课程","D ✗ 课件 p042 原文：不涉及流体与固体之间热量传递的是流体力学，传热学研究流体与固体间热量的交换"],"basis":"课件 p042（原文）","answerNote":"答案由课件 p042 原文推出，课件未标答案，请以老师公布为准"},{"id":"q-h1c-1","kind":"多选","priority":1,"source":"课件题目","sourceDetail":"课件 p054（原文）","keyPoints":["传热发生的前提","温差"],"stem":"物质之间发生传热的前提是","options":[{"k":"A","t":"彼此接触"},{"k":"B","t":"存在温差"},{"k":"C","t":"发生热传导"},{"k":"D","t":"发生对流"}],"answer":"B","why":["A ✗ 课件 p055 把热辐射列为三种基本方式之一，热辐射无需两物体接触即可传热，故接触不是前提","B ✓ 课件 p056 导热特点写明「a 必须有温差」，课件 p063 对流换热也「必须存在温差」，存在温差才是发生传热的前提","C ✗ 热传导（导热）只是三种基本传热方式之一，不是发生传热的前提","D ✗ 对流同样只是一种传热方式，不是发生传热的前提"],"basis":"课件 p054（原文）"},{"id":"q-h1c-2","kind":"多选","priority":1,"source":"课件题目","sourceDetail":"课件 p061（原文）","keyPoints":["导热的定义","导热的特点","导热的机理"],"stem":"下面对导热的描述，正确的是","options":[{"k":"A","t":"热传导必须相互接触"},{"k":"B","t":"热传导必须要有温差"},{"k":"C","t":"热传导可以发生在流体中"},{"k":"D","t":"金属固体热传导发生了晶格振动"}],"answer":"ABC","why":["A ✓ 课件 p056 原文：导热特点「b 物体直接接触」","B ✓ 课件 p056 原文：导热特点「a 必须有温差」","C ✓ 课件 p056 原文：「导热可以在固体、液体、气体中发生」","D ✗ 课件 p057 原文：导电固体（金属）导热的机理是「自由电子运动」，而「晶格结构振动」是非导电固体的机理"],"basis":"课件 p061（原文）"},{"id":"q-h1c-3","kind":"多选","priority":1,"source":"课件题目","sourceDetail":"课件 p067（原文）","keyPoints":["表面传热系数 h","牛顿冷却公式","影响 h 的因素"],"stem":"下面关于h的说法正确的是","options":[{"k":"A","t":"单位为W/m2K"},{"k":"B","t":"可以通过q/△t计算得出"},{"k":"C","t":"受到流体物性、流速、固体表面状况的影响"},{"k":"D","t":"叫导热系数"}],"answer":"ABC","why":["A ✓ 课件 p065 原文：`h` — 表面传热系数，[W/(m²·K)]，即 W/m²K","B ✓ 课件 p065 原文：牛顿冷却公式 `q=Φ/A=h(t_w-t_f)`，故 h 可由 q 与温差 △t 相除得到","C ✓ 课件 p066 原文：h 与流体的物性、流体流动的形态、流动的成因、物体表面的形状尺寸等因素有关","D ✗ 课件 p059 中导热系数（热导率）用 `λ` 表示，h 是表面传热系数，两者不是同一物理量"],"basis":"课件 p067（原文）"},{"id":"q-h1c-4","kind":"单选","priority":2,"source":"课件 p060","sourceDetail":"课件 p060（依据正文自拟）","keyPoints":["傅里叶定律","热流密度"],"stem":"单位时间通过单位面积的热流量称为热流密度，其表达式为","options":[{"k":"A","t":"q=Φ/A=-λ(dt/dx)"},{"k":"B","t":"q=Φ/A=λ(dt/dx)"},{"k":"C","t":"Φ=λA(t_w1-t_w2)/δ"},{"k":"D","t":"q=ΦA=-λ(dt/dx)"}],"answer":"A","why":["A ✓ 课件 p060 原文：`q=Φ/A=-λ(dt/dx)`","B ✗ 漏掉负号，课件 p060 原文的热流密度表达式带负号，表示热流方向与温度梯度方向相反","C ✗ 这是热流量 `Φ` 的表达式（课件 p059 原文 `Φ=λA(t_w1-t_w2)/δ`），不是热流密度","D ✗ 课件 p060 原文为 `q=Φ/A`，不是 `q=ΦA`"],"answerNote":"答案由课件 p060 原文推出，课件未标答案，请以老师公布为准","basis":"课件 p060（原文）"},{"id":"q-h1d-1","kind":"多选","priority":1,"source":"课件题目","sourceDetail":"课件 p074（原文）","keyPoints":["热辐射能否在真空中传播","辐射换热是否存在能量形式变化","斯蒂芬-玻尔兹曼常数的数值"],"stem":"下列关于辐射的说法，正确的是","options":[{"k":"A","t":"玻尔兹曼常数为5.6*10^-7"},{"k":"B","t":"热辐射可以在真空传传播"},{"k":"C","t":"热辐射方式存在能量形式的变化"},{"k":"D","t":"任何高于0K都发射热辐射"},{"k":"E","t":"任何物体都吸收热辐射"}],"answer":"BCDE","why":["A ✗ 课件 p073 原文：斯蒂芬-玻尔兹曼常数 `σ_b` 为 `5.67×10^-8 W/(m²K^4)`，不是 5.6*10^-7","B ✓ 课件 p070 原文：热辐射不依靠中间媒介，可以在真空中传播","C ✓ 课件 p071 原文：辐射换热不仅有能量转移，还有能量形式的变化","D ✓ 课件 p070 原文：所有温度大于 0K 的物体都具有发射热辐射的能力，温度愈高，发射热辐射的能力愈强","E ✓ 课件 p070 原文：所有实际物体都具有吸收热辐射的能力"],"basis":"课件 p070 / p071 / p073（原文）"},{"id":"q-h1d-2","kind":"多选","priority":1,"source":"课件题目","sourceDetail":"课件 p082（原文）","keyPoints":["传热过程的定义","传热热阻的串联关系","总传热系数 k 的计算式"],"stem":"下面关于传热过程说法正确的是","options":[{"k":"A","t":"传热过程通常是中间一层固体隔绝两侧流体"},{"k":"B","t":"一维导热对流条件下，总热阻可以分拆为各个热阻的和"},{"k":"C","t":"以k表示总传热系数，则1/(kA)=1/(h1A)+δ/(Aλ)+ 1/(h2A)"},{"k":"D","t":"总传热系数的定义公式来自牛顿冷却公式"}],"answer":"ABC","why":["A ✓ 课件 p075 原文：传热过程指热量从固体壁面一侧的流体通过固体壁面传递到另一侧流体的过程","B ✓ 课件 p080 原文：`R_k = R_h1 + R_λ + R_h2`，传热热阻等于各串联热阻之和","C ✓ 课件 p081 原文：`k = 1/(1/h_1 + δ/λ + 1/h_2)`，两边同除以面积 `A` 即得 `1/(kA)=1/(h_1A)+δ/(Aλ)+1/(h_2A)`","D ✗ 课件 p081 原文：`k` 由平壁稳态传热三个串联环节（热阻串联）导出；牛顿冷却公式 `Φ=Ah(t_w - t_f)` 只是其中对流换热环节的表达式"],"basis":"课件 p075 / p080 / p081（原文）"},{"id":"q-h1d-3","kind":"计算","priority":1,"source":"课件例题","sourceDetail":"课件 p083–p084（原文）","keyPoints":["平壁导热热阻 δ/(λA)","对流换热热阻 1/(hA)","利用热阻串联求壁面温度"],"stem":"有一平底铝制水壶，壶底直径 D 为24cm，底厚 δ=2mm，内装 t_f2=20°C 的冷水，置于电炉上。已知铝的导热系数 λ 为200W/(m·K)，传热热流量Φ=400W，壶内壁对冷水的换热系数 h 为200W/(m²·K)，求壶底外壁的温度 t_1。","given":["壶底直径 `D` 为 24cm","底厚 `δ`=2mm","冷水温度 `t_f2`=20°C","铝的导热系数 `λ` 为 200W/(m·K)","传热热流量 `Φ`=400W","壶内壁对冷水的换热系数 `h` 为 200W/(m²·K)"],"ask":["求壶底外壁的温度 `t_1`"],"steps":["第一步 画热阻串联网络：壶底外壁温度 `t_1` 经平壁导热热阻 `δ/(λA)` 到内壁 `t_2`，再经对流换热热阻 `1/(hA)` 到冷水温度 `t_f2`。","第二步 列传热方程：`Φ = (t_1 - t_f2)/(δ/(λA) + 1/(hA))`。","第三步 反解外壁温度：`t_1 = t_f2 + (Φ/A)(δ/λ + 1/h)`，其中壶底面积 `A = (1/4)πD²`。","第四步 代入数据计算：`t_1 = (Φ/((1/4)πD²))(δ/λ + 1/h) = 64.3°C`。","第五步 还可由 `Φ = (t_1 - t_2)/(δ/(λA)) = (t_2 - t_f2)/(1/(hA))` 求内壁温度，`t_2 = t_1 - (Φ/A)(δ/λ) = t_f2 + (Φ/A)(1/h)`。"],"result":"壶底外壁温度 `t_1 = 64.3°C`","basis":"课件 p083–p084（原文）"},{"id":"q-h1d-4","kind":"例题","priority":1,"source":"课件例题","sourceDetail":"课件 p086–p087（原文）","keyPoints":["对流与辐射共同散热","大空间中一个小物体的辐射模型","冬夏散热量对比"],"stem":"同样的室温人体冬夏的感觉为何不同？（例题 1-5）室温 25°C，人体与空气的对流换热系数取为 2.6 W/(m²·K)，人体表面温度为 30°C，表面发射率 0.95，四周墙壁夏天 26°C、冬天 10°C，求人体散热量。","given":["室温 25°C","人体与空气的对流换热系数 2.6 W/(m²·K)","人体表面温度 30°C","人体表面发射率 0.95","四周墙壁温度：夏天 26°C，冬天 10°C","人体散热面积简化为直径 25 厘米、高 175 厘米的圆柱体"],"ask":["计算人体在夏天的散热量 `φ_summer` 与冬天的散热量 `φ_winter`","说明同样的室温下人体冬夏感觉为何不同"],"steps":["第一步 分析：人体冷暖的感觉是由于其散热量不同所致；假定 (1) 不计人体与地板之间的热传递，(2) 过程是稳态的。","第二步 人体总散热量是对流与辐射换热的总和，人体与四周墙体的辐射符合大空间中一个小物体的模型：`φ = hA(t_w1 - t_f) + εAσ(T_w1^4 - T_w2^4)`。","第三步 式中对流项 `hA(t_w1 - t_f)` 标注「冬夏不变」，辐射项中墙壁温度夏天取 26°C、冬天取 10°C。","第四步 代入圆柱体散热面积计算，得 `φ_summer = 18.5W + 33.4W = 51.9W`，`φ_winter = 18.5W + 154W = 172.5W`。","第五步 得出结论：冬天的散热量是夏天的三倍多，导致冬感觉「冷」而夏则感觉「热」（热量散出去不多）。"],"result":"`φ_summer = 51.9W`，`φ_winter = 172.5W`；冬天的散热量是夏天的三倍多，故冬感觉「冷」、夏感觉「热」","basis":"课件 p086–p087（原文）"}],"images":{"1":{"w":"img/heat-ch1/p001.webp","j":"img/heat-ch1/p001.jpg"},"2":{"w":"img/heat-ch1/p002.webp","j":"img/heat-ch1/p002.jpg"},"3":{"w":"img/heat-ch1/p003.webp","j":"img/heat-ch1/p003.jpg"},"5":{"w":"img/heat-ch1/p005.webp","j":"img/heat-ch1/p005.jpg"},"6":{"w":"img/heat-ch1/p006.webp","j":"img/heat-ch1/p006.jpg"},"7":{"w":"img/heat-ch1/p007.webp","j":"img/heat-ch1/p007.jpg"},"8":{"w":"img/heat-ch1/p008.webp","j":"img/heat-ch1/p008.jpg"},"9":{"w":"img/heat-ch1/p009.webp","j":"img/heat-ch1/p009.jpg"},"10":{"w":"img/heat-ch1/p010.webp","j":"img/heat-ch1/p010.jpg"},"11":{"w":"img/heat-ch1/p011.webp","j":"img/heat-ch1/p011.jpg"},"12":{"w":"img/heat-ch1/p012.webp","j":"img/heat-ch1/p012.jpg"},"13":{"w":"img/heat-ch1/p013.webp","j":"img/heat-ch1/p013.jpg"},"14":{"w":"img/heat-ch1/p014.webp","j":"img/heat-ch1/p014.jpg"},"15":{"w":"img/heat-ch1/p015.webp","j":"img/heat-ch1/p015.jpg"},"16":{"w":"img/heat-ch1/p016.webp","j":"img/heat-ch1/p016.jpg"},"17":{"w":"img/heat-ch1/p017.webp","j":"img/heat-ch1/p017.jpg"},"18":{"w":"img/heat-ch1/p018.webp","j":"img/heat-ch1/p018.jpg"},"19":{"w":"img/heat-ch1/p019.webp","j":"img/heat-ch1/p019.jpg"},"20":{"w":"img/heat-ch1/p020.webp","j":"img/heat-ch1/p020.jpg"},"21":{"w":"img/heat-ch1/p021.webp","j":"img/heat-ch1/p021.jpg"},"22":{"w":"img/heat-ch1/p022.webp","j":"img/heat-ch1/p022.jpg"},"23":{"w":"img/heat-ch1/p023.webp","j":"img/heat-ch1/p023.jpg"},"24":{"w":"img/heat-ch1/p024.webp","j":"img/heat-ch1/p024.jpg"},"25":{"w":"img/hea h1/p088.jpg"}}},{"id":"heat-ch2","name":"第二章 稳态热传导的规律及计算","subtitle":"傅里叶定律 · 导热微分方程 · 一维分析解 · 肋片","status":"在读","overview":"本章解决「温度不随时间变化时，如何求温度分布与热流量」。2-1 给出导热基本定律——傅里叶定律：温度场、温度梯度、等温面，定律的文字与数学表达、负号含义，以及导热系数的物理意义与各类材料的数量级。2-2 用微元体能量平衡推导三维非稳态导热微分方程，逐项解释非稳态项、扩散项与内热源项，简化出 Poisson 方程、Laplace 方程与柱、球坐标形式，并给出初始条件与三类边界条件。2-3 是一维稳态导热分析解：单层与多层平壁、单层与多层圆筒壁、球壳，统一用热阻串联法求热流量再逆推层间温度；含变导热系数的迭代、保温层厚度反算等例题。2-4 讲肋片的导热：等截面直肋的微分方程与温度分布、肋效率与肋面总效率、接触热阻。2-5 讲具有内热源的一维稳态导热（导线发热、核燃料元件）。2-6 多维稳态导热问题的求解课件未覆盖。","mindmap":{"label":"第二章 稳态热传导的规律及计算","children":[{"label":"2-1 导热基本定律---傅里叶定律","children":[{"label":"导热机理：气体分子热运动与晶格振动","children":[]},{"label":"λ 大小规律：金属 > 非金属，固相 > 液相 > 气相","children":[]},{"label":"温度场 t=f(x,y,z,τ) 与稳态、非稳态之分","children":[]},{"label":"等温线与等温面不能相交、只能中断或封闭","children":[]},{"label":"热流密度与等温线垂直，界面绝热判据","children":[]},{"label":"温度梯度 grad(t) 指向温度升高方向","children":[]},{"label":"傅里叶定律 q=-λ∂t/∂n 与负号含义","children":[]},{"label":"热流线表示热流密度矢量的走向","children":[]},{"label":"导热系数 λ=|q|/|grad t|，单位 W/(m·K)","children":[]},{"label":"七大类材料导热系数数值范围","children":[]},{"label":"λ=λ₀(1+bt) 线性温度关系与常用值","children":[]},{"label":"思考题：棉被保暖与双层玻璃夹层","children":[]},{"label":"导热的定义、本质和特点","children":[]},{"label":"温度场及其分类","children":[]},{"label":"等温面(线)及其特点、温度梯度","children":[]},{"label":"傅里叶定律反映热流密度与温度场的联系","children":[]},{"label":"傅里叶定律的矢量式与标量式","children":[]},{"label":"导热系数的定义、意义与影响因素","children":[]},{"label":"λ纯金属>λ合金>λ非金属>λ绝热材料>λ气体","children":[]},{"label":"导热系数随温度按线性关系处理","children":[]}]},{"label":"2-2 导热问题的数学描写","children":[{"label":"数学描写 = 导热微分方程 + 定解条件","children":[]},{"label":"实质是获得温度场的解析表达式","children":[]},{"label":"推导依据：能量守恒原理与傅立叶定律","children":[]},{"label":"推导方法：对微元体做热平衡","children":[]},{"label":"假设：各向同性、与外界无功的交换","children":[]},{"label":"内热源单位 W/m³，如化学反应能","children":[]},{"label":"建立坐标系取微元体做能量平衡分析","children":[]},{"label":"沿三方向导入微元体的净热量","children":[]},{"label":"内热源生成热与热力学能增量","children":[]},{"label":"三维非稳态导热微分方程基本形式","children":[]},{"label":"非稳态项、导热项与内热源项","children":[]},{"label":"热扩散率 a = λ/
