label":"按时变情况：定常系统、时变系统"},{"label":"按被控量：位移控制系统、温度控制系统、速度控制系统等"}]},{"label":"六、机械制造的发展与控制理论的应用","children":[{"label":"原始制造工艺过程的类似闭环系统"},{"label":"人操作机器加工的类似闭环系统"},{"label":"检测加入后的类似闭环系统"},{"label":"自动化装置加入后的类似闭环系统"},{"label":"计算机控制的闭环系统"}]},{"label":"七、机械工程控制未来的发展","children":[{"label":"发展方向：人工智能、传感器集成、计算机视觉、CAD/CAM编程、PLC"},{"label":"控制理论发展史（Watt、Maxwell、Routh、Wiener、钱学森）"}]},{"label":"六、对控制系统的基本要求","children":[{"label":"稳定性（正常工作的首要条件）"},{"label":"快速性"},{"label":"准确性"}]}]},"points":[{"id":"p-ctrl1a-1","title":"课程目标1、2","key":true,"source":"课件 p002","items":["**课程目标1**：了解控制工程的发展史，熟悉机械工程控制论的研究对象与任务，掌握控制系统的基本概念、工作原理及基本组成。","掌握控制系统的分类、对控制系统基本性能要求等基本概念。","能将数学、物理、力学等专业知识应用于机械工程控制领域复杂工程问题的规范化描述。","**课程目标2**：掌握线性控制系统数学建模的基本方法，具有对典型机、电线性系统进行数学建模的能力。","具有对已有数学模型进行分析的能力，能够从时域、复数域或实验模态等多种视角，将数学模型综合运用于机械产品设计、制造及自动化等工程问题的识别和表述中。"]},{"id":"p-ctrl1a-2","title":"课程目标3、4","key":true,"source":"课件 p003","items":["**课程目标3**：学会应用时域分析、频域分析和稳定性判据等多个方面，对已知系统的稳定性、快速性和准确性问题进行分析和表达。","对不稳定系统，提出时域、频域等方面的解决方案。","**课程目标4**：从系统数学模型、系统仿真和系统综合实验设计与实施等方面开展自动控制原理实验。","初步具有利用 MATLAB 对控制系统进行仿真分析的能力，能有效采集实验数据和结果，并能正确分析系统参数与系统性能之间的相互关系。","对复杂控制工程问题能够从微分、积分、惯性等不同控制环节提出多个校正方案。"]},{"id":"p-ctrl1a-3","title":"课程说明：成绩构成","key":false,"source":"课件 p004","items":["总成绩 = 平时学习成绩（50%）+ 期末考试成绩（50%）。","平时学习成绩考核包括三个方面：平时作业和理论课考勤（20%）、智慧课堂仿真实验（20%）、研究报告（含国内外典型工程案例）专题（10%）。","以上三项合计占总成绩的 **50%**。","期末为闭卷考试，占总成绩的 **50%**。"]},{"id":"p-ctrl1a-4","title":"教材与参考文献","key":false,"source":"课件 p005","items":["**教材**：杨叔子等，机械工程控制基础，华中科技大学出版社，（第八版，新形态教材），2023。","参考文献1：胡寿松等，自动控制原理，国防工业出版社，（第三版），1994。","参考文献2：李友善，自动控制原理，国防工业出版社，1980。","参考文献3：陈康宁，机械工程控制基础，西安交通大学出版社，1997。","参考文献4：Matlab 使用手册。"]},{"id":"p-ctrl1a-5","title":"为什么要学控制论（一）：机电一体化产品的出现与普及","key":false,"source":"课件 p006","items":["机电一体化产品的出现与逐渐普及。","机电一体化即“机”+“电”，核心是“信息传递与交换”。","它是控制论、系统论、信息论、微电子技术（计算机技术）相结合的产品。"]},{"id":"p-ctrl1a-6","title":"为什么要学控制论（二）：机械系统的发展方向","key":false,"source":"课件 p007","items":["机械系统朝 **高速、高负载、超精密、超大型或超微型** 等方向发展，贯穿设计、制造、使用、维护全过程的“动态”问题。","**设计**：考虑动态特性的优化设计。","**制造**：关注制造过程的动态特性。","**使用**：系统的动态特性（安全、性能）。","**维护**：监测与故障预测、诊断。"]},{"id":"p-ctrl1a-7","title":"为什么要学控制论（三）：动态测试、信号处理与生产组织管理","key":false,"source":"课件 p008","items":["**动态测试、信号处理（信号与系统）**：涉及传感器的选择、信号预处理器的设计、数字信号的处理、特征提取。","应用示例：加工状态监控、喷气发动机性能监控。","**生产组织管理**：即过程的优化。"]},{"id":"p-ctrl1a-8","title":"为什么要学控制论（四）：其他工程应用、日常生活与方法论","key":false,"source":"课件 p009","items":["**其他工程应用**：军事、航天领域（火炮、雷达、跟踪系统、人造卫星、宇宙飞船等）。","**流程工业**：轧钢过程、工业窑炉、石油化工、水泥建材、玻璃、造纸等。","**现代农业生产**：自动灌溉、农产品质量检测、疫情检测等。","**其他领域**：通信、交通、医学、环境保护、经济管理等。","**个人日常生活和工作**：电冰箱、电饭煲、空调器、音响、收音机等等。","**方法论**：“反馈控制的思想”。"]},{"id":"p-ctrl1a-9","title":"控制的定义","key":true,"source":"课件 p010","items":["**控制**：施加某种操作于对象，使其产生所期望的行为。","课件以 **图1.1 蒸汽机离心调速器** 作为典型控制装置的示例。"]},{"id":"p-ctrl1a-10","title":"自动控制的定义","key":true,"source":"课件 p011","items":["**自动控制**：由控制装置自动完成，无需人的参与。","**图1.2 液位人工控制**：人观察液位计读数，操作阀门调节流量。","**图1.3 液位自动控制**：由浮子等装置自动感受液位高低并调节阀门。"]},{"id":"p-ctrl1a-11","title":"人工控制与自动控制的区别（控制器）","key":true,"source":"课件 p012","items":["人工控制通路：希望液位 → 头脑 → 肌肉和阀门 → 水箱 → 实际液位，并由 **眼睛** 反馈。","自动控制通路：希望液位 → 控制器 → 气动阀门 → 水箱 → 实际液位，并由 **浮子** 反馈。","在自动控制系统中，某些装置被有机地组合在一起，代替了人工控制系统中人的功能。","由于这些装置担负着控制的功能，通常称之为 **控制器**。"]},{"id":"p-ctrl1a-12","title":"自动控制相比人工控制的优势","key":true,"source":"课件 p013","items":["自动控制可以快速准确进行控制，相比人工控制效果更好。","在恶劣环境或人们无法到达的环境进行控制。","可以长时间不疲劳地进行工作，提高工作效率。"]},{"id":"p-ctrl1a-13","title":"控制的三要素、可控性与能控性、控制论的方法论","key":true,"source":"课件 p014","items":["**控制的三要素**：控制对象、控制目标、控制手段（装置、算法等）。","**可控性**：控制对象有多种运动状态的可能性。","**能控性**：能够通过控制手段使控制对象的状态达到控制目标。","**控制论的方法论**：明确事物发展的多种可能性；确定其中一种可能性为控制目标；实施控制实现控制目标。"]},{"id":"p-ctrl1a-14","title":"控制论的分支学科","key":false,"source":"课件 p015","items":["控制论与其它学科结合，形成众多的分支学科。","控制论 + 经济学 → 经济控制论；控制论 + 社会学 → 社会控制论；控制论 + 生物学 → 生物控制论。","控制论 + 工程技术 → 工程控制论；工程控制论 + 机械工程 → **机械工程控制论**。","共同的本质特点：**通过信息传递、处理与反馈进行控制**。"]},{"id":"p-ctrl1a-15","title":"控制论的中心思想","key":true,"source":"课件 p016","items":["系统普遍存在信息的传递、交互与反馈是 **控制论的中心思想**。","控制论：技术学科、技术哲学、科学方法论。","控制论强调：对象是一个“系统”。","系统不断“运动”（经历动态历程，包括内部状态和外部行为）。","“外因”（输入、干扰）是运动的条件。","“内因”（系统的固有特性）是运动的根据。"]},{"id":"p-ctrl1a-16","title":"系统的定义与要素","key":true,"source":"课件 p017","items":["机械工程控制论研究机械工程技术中的 **广义系统动力学问题**。","**系统**：按一定规律联系在一起的元素的集合。","系统的要素：元素、元素之间的联系；系统的特性不仅与构成系统的元素有关，而且与系统的结构有关。","系统与外界的交互作用：外界对系统的作用（输入、干扰）；系统对外界响应（输出）。","输入是“外界的作用”，输出是“系统的响应”，其中的本质是 **信息的传递与交互**。"]},{"id":"p-ctrl1a-17","title":"系统的层次性与相对性、广义系统","key":false,"source":"课件 p018","items":["**系统的层次性与相对性**：系统的组成元素可以是子系统；又可是更上一层系统的组成元素。","**广义系统**：具备系统要素的一切事物或对象。","广义系统的例子：机器系统、生产系统、生命系统、思维、学习、工作，社会、经济系统等。","机械工程中的广义系统：元件、部件、仪器、设备、加工过程、操作设备、测量、车间、部门、工厂、企业、企业集团、全球制造业。"]},{"id":"p-ctrl1a-18","title":"系统的动力学问题","key":true,"source":"课件 p019","items":["系统的动力学问题研究的是机械工程广义系统在一定的外界条件（即输入或激励、干扰）作用下，从系统的一定的初始状态出发，所经历的整个动态历程。","该动态历程由其内部的固有特性（即由系统的结构与参数所决定的特性）所决定。","研究系统及其输入、输出三者之间的动态关系。"]},{"id":"p-ctrl1a-19","title":"决定系统响应的四大因素（弹簧-质量-阻尼单自由度系统）","key":true,"source":"课件 p021","items":["以弹簧-质量-阻尼单自由度系统为例：初始状态 `y(0)=y_0`，`ẏ(0)=ẏ_0`。","系统固有特性：`mp^2+cp+k`；外界作用：`f(t)`、`x(t)`；与外界的关系：`1`、`cp+k`；系统的输出：`y(t)`。","**初始状态、系统固有特性、外界作用、与外界的关系** 等四大因素决定系统响应。"]},{"id":"p-ctrl1a-20","title":"机械工程控制论的研究任务","key":true,"source":"课件 p022","items":["**系统分析问题**：已知系统和输入，求输出（或响应），并通过响应来研究系统本身的问题。","**最优控制问题**：已知系统和理想输出，求最优输入，使实际输出满足要求。","**最优设计问题**：已知输入，设计系统，使输出满足要求。","**滤波与预测问题**：设计或选择合适的系统，以便由输出识别输入或输入中的有关信息。","**系统辨识问题**：已知输入和输出，要识别系统的结构和参数，建立系统的数学模型。"]},{"id":"p-ctrl1a-21","title":"信息（三种定义）","key":true,"source":"课件 p023","items":["**定义1**：一切能表达一定意义的信号、符号和密码等。如：报纸，烽火，电报，记号、手势等等。","**定义2**：能够用来消除不确定性的东西。如：报纸（过时、适时），情报（过时、适时），足球比赛（势均力敌、势力悬殊），书籍（好、差）等。","**定义3**：事物运动的状态和方式。如：体温——人体状态。","设备的振动、噪声、温度等——设备的状态；设计图纸——产品状态（产品信息）；工艺卡——制造过程状态（工艺信息）。"]},{"id":"p-ctrl1a-22","title":"反馈的定义与例1：离心调速器控制原理","key":true,"source":"课件 p024","items":["**反馈**：系统的输出不断地、直接或间接地、全部或部分地返回，并作用于系统。","例1控制过程：负载减小，使 `ω` 增加 → 离心机构滑套上移。","液压滑阀上移，动力活塞下移 → 油门关小，`ω` 减小。","离心滑套下移，滑阀回复中位，`ω` 回到设定值。","即 `ω` 反过来对系统产生作用。"]},{"id":"p-ctrl1a-23","title":"例2：静压轴承薄膜反馈控制系统","key":false,"source":"课件 p025","items":["系统组成：静压轴承 + 薄膜反馈机构。","载荷 `W` 作用于静压轴承，产生偏移 `e`。","偏移 `e` 经薄膜反馈机构返回，与载荷 `W` 相减后再作用于静压轴承。","框图：`W`（载荷）→ 比较点 → 静压轴承 → `e`（偏移）→ 薄膜反馈机构 → 返回比较点。"]},{"id":"p-ctrl1b-1","title":"内反馈与例4：弹簧-质量-阻尼系统","key":true,"source":"课件 p026","items":["例4 系统运动方程：`m·d²y/dt² + c·dy/dt + k·y = f(t)`","改写为：`m·d²y/dt² = f(t) − c·dy/dt − k·y(t)`","f(t) 作用在滑块上，产生加速度，进而产生速度及位移","一旦产生速度，产生了速度反馈 `c·dy/dt`；有了位移，产生位移反馈 `k·y(t)`","速度反馈与位移反馈共同作用形成稳定，都是系统内部的信息反馈"]},{"id":"p-ctrl1b-2","title":"外反馈与内反馈","key":true,"source":"课件 p027","items":["**外反馈（反馈控制）**：相对于被控对象而言，由附加装置引起信息交互","**内反馈**：系统内部信息交互，反映系统内部元素之间互为因果的联系关系"]},{"id":"p-ctrl1b-3","title":"负反馈与正反馈","key":true,"source":"课件 p028","items":["**负反馈**：输出（被控量）偏离设定值（目标值）时，反馈作用使输出偏离程度减小，并力图达到设定值","负反馈的作用：消除偏离（检测偏差 → 实施控制 → 纠正偏差）；例：离心调速系统、液面控制、动物捕食、火炮自动瞄准","**正反馈**：输出偏离初始值（或稳定值）时，反馈作用使输出偏离程度加剧","正反馈的作用：加剧偏离；例：三极管、倒立摆、疾病、火药爆炸、热核反应"]},{"id":"p-ctrl1b-4","title":"反馈控制系统的组成实例——发动机离心调速系统","key":true,"source":"课件 p029","items":["被控对象：发动机；被控量：转速 `ω`；被控量目标值设定：预紧弹簧","控制信息传递与反馈：转速 `ω` → 离心机构（检测或感知）→ 偏差 → 杠杆 → 液压比例控制器 → 油门","控制方框图：给定（调节弹簧）→ 比较 → 放大（杠杆机构）→ 执行（液压比例控制器、活塞油缸）→ 油门 → 控制对象（发动机）→ 实际转速；离心机构测量后反馈","系统分为控制部分（给定、比较、放大、执行）与被控部分（发动机）"]},{"id":"p-ctrl1b-5","title":"反馈控制系统的组成与基本物理量","key":true,"source":"课件 p030","items":["组成环节：给定环节 → 比较环节 → 放大运算环节 → 执行环节 → 被控对象 → `x_o`；测量环节把 `x_b` 反馈到比较环节","特点：利用偏差控制系统的输出","**被控量**：即系统的输出量，表征被控对象运动规律 `x_o`","**给定量**：系统的输入量或被控对象的理想状态（控制目标）`x_i`","**控制量**：直接作用于被控对象的物理量，即被控对象的输入量","**扰动量**：所有使被控对象状态偏离给定值的量"]},{"id":"p-ctrl1b-6","title":"给定环节","key":false,"source":"课件 p031","items":["给定环节是给出输入信号的环节，用于确定被控对象的目标值（给定值，系统的输入量）","希望被控对象按照给定的输入信号而有规律运动"]},{"id":"p-ctrl1b-7","title":"测量环节（反馈环节）","key":false,"source":"课件 p032","items":["用于测量被控变量，并将被控变量转换为便于传送的另一个物理量（一般为电量），也称反馈环节","功能：测量被控制的物理量，并将其反馈到系统输入端","在闭环控制系统中，检测元件及相关的元器件构成系统的反馈装置","被测量的物理量为电量时，一般用电阻、电位器、电流互感器和电压互感器等来测量","被测量的物理量为非电量时，通常检测元件应将其转换为电量，以便于处理"]},{"id":"p-ctrl1b-8","title":"比较环节","key":false,"source":"课件 p033","items":["功能：将检测元件测量到的被控量实际值，与给定装置提供的给定值进行比较，求出两者之间的偏差","输入信号 `x_i` 与测量环节送来的反馈量 `x_b` 相比较，得到一个小功率的偏差信号 `ε = x_i − x_b`","偏差信号是比较环节的输出","课件 p034 补充：为啥有比较环节？得到偏差需要计算；为啥得到偏差？反馈的目的：纠正偏差"]},{"id":"p-ctrl1b-9","title":"放大及运算环节与执行环节","key":false,"source":"课件 p035","items":["**放大及运算环节**：为实现控制，要将偏差信号作必要的校正，然后进行功率放大，以便于推动执行环节；如电流放大、电器—液压放大等","**执行环节**：接收放大环节送来的控制信号，驱动被控对象按照预期的规律运行"]},{"id":"p-ctrl1b-10","title":"开环控制系统","key":true,"source":"课件 p036","items":["定义：系统没有反馈回路，输出对系统无控制作用","例：步进驱动的数控机床、普通洗衣机、家用电烤箱、微波炉、普通电风扇","典型方框图（数控机床）：指令（输入）→ 输入装置 → 控制装置 → 伺服驱动装置 → 工作台 → 工作台位置（输出）"]},{"id":"p-ctrl1b-11","title":"开环控制系统的特点与应用场合","key":false,"source":"课件 p037","items":["特点一：结构简单，造价低","特点二：控制的精度取决于给定信号的标定精度，及控制器与被控对象参数的稳定性","特点三：没有抗干扰的能力，精度较低","应用场合：控制量的变化规律可以预知；可能出现的干扰能够抑制；被控量很难测量"]},{"id":"p-ctrl1b-12","title":"闭环控制系统","key":true,"source":"课件 p038","items":["定义：有反馈回路，输出对系统有控制作用","例：前例中的离心调速系统、伺服驱动的数控机床、恒温箱（冰箱、空调）、人骑自行车","典型方框图：指令 → 输入装置 → 控制装置 → 驱动装置 → 工作台（被控对象）→ 工作台位置；检测装置反馈到控制装置"]},{"id":"p-ctrl1b-13","title":"闭环系统的特点","key":false,"source":"课件 p039","items":["系统对外部或内部干扰（如内部件参数变动）的影响不敏感，抑制扰动","由于采用反馈装置，导致设备增多，线路复杂","存在稳定性问题：存在反馈回路时，对惯性较大的系统，如参数配置不当，控制性能会变得很差，甚至出现震荡及发散现象","实质是采用负反馈作用减小系统的误差"]},{"id":"p-ctrl1b-14","title":"按输出量的变化规律分类","key":true,"source":"课件 p040","items":["**自动调节系统（恒值系统）**：系统的输出保持常量；如离心调速系统、恒温箱、液面控制等，为闭环系统","**随动系统**：系统的输出相应于输入按任意规律变化；如炮瞄雷达系统、仿形加工、动物捕食等，多为闭环系统","**程序控制系统**：系统的输出按预定程序变化；如数控机床、全自动洗衣机等，开环或闭环系统"]},{"id":"p-ctrl1b-15","title":"控制系统的其他分类方式","key":false,"source":"课件 p041","items":["按信号类型分：连续控制系统、离散控制系统","按线性性质分：线性控制系统、非线性控制系统","按时变情况分：定常系统、时变系统","按被控量分：位移控制系统、温度控制系统、速度控制系统等"]},{"id":"p-ctrl1b-16","title":"机械制造的发展与控制理论的应用（一）","key":false,"source":"课件 p042","items":["原始制造工艺过程的类似闭环系统：人脑 → 人体（手、足）→ 加工对象 → 成品，人的感官反馈，有干扰","人操作机器加工的类似闭环系统：人脑 → 机构、机器 → 加工对象 → 成品，体力，人的感官反馈","检测加入后的类似闭环系统：人脑 → 加工设备 → 加工对象 → 成品，动力源，检测工具反馈"]},{"id":"p-ctrl1b-17","title":"机械制造的发展与控制理论的应用（二）","key":false,"source":"课件 p043","items":["自动化装置加入后的类似闭环系统：控制器 → 自动化加工设备 → 加工对象 → 成品，动力源，自动检测装置反馈","计算机控制的闭环系统：计算机 → 自动化加工设备 → 加工对象 → 成品，动力源，监测系统反馈"]},{"id":"p-ctrl1b-18","title":"控制理论的发展历程与未来方向","key":true,"source":"课件 p044","items":["经典控制理论肇端于1788年J.Watt的蒸汽机离心调速器所带来的离心调速问题","1868年J.C.Maxwell在伦敦皇家协会论文集发表的《论调速器》是首次论述自动控制的论文","我国古代成就突出：1027年宋代燕肃所造的指南车；东汉张衡所研制的候风地动仪比J.Watt早700年","19世纪欧洲的工业革命促进了自动控制技术的发展，也促进了经典控制理论的逐步形成","E.J.Routh分别于1877年与1884年提出了线性系统稳定性；1948年N.Wiener《控制论》；1954年钱学森《工程控制论》","未来发展集中在人工智能、传感器集成、计算机视觉、CAD/CAM编程、PLC"]},{"id":"p-ctrl1b-19","title":"对控制系统的基本要求","key":true,"source":"课件 p045","items":["**系统的稳定性**：系统正常工作的首要条件；指系统恢复平衡状态的能力，稳定性好则系统恢复平衡状态的能力强","**系统的快速性**：快速性好，则消除偏差快，或调整时间短","**系统的准确性**：准确性好，则调整过程结束后，输出值与期望值偏差小"]}],"questions":[{"id":"q-ctrl1a-1","kind":"例题","priority":1,"source":"课件例题","sourceDetail":"课件 p020–p021","keyPoints":["系统的动力学问题","弹簧-质量-阻尼单自由度系统","决定系统响应的因素"],"stem":"例：弹簧-质量-阻尼单自由度系统。图 (a)、(b) 为同一系统、不同的外界作用，写出两种情形下的系统运动方程，并指出决定系统响应的因素。","given":["弹簧-质量-阻尼单自由度系统，参数为质量 `m`、刚度 `k`、阻尼 `c`。图 (a)：外界作用为力 `f(t)`，输出位移 `y(t)`；图 (b)：外界作用为位移 `x(t)`，输出位移 `y(t)`。"],"ask":["① 写出 (a)、(b) 两种外界作用下的系统运动方程；② 指出决定系统响应的因素。"],"steps":["图 (a)：外界作用为力 `f(t)`，课件的运动方程为 `(mp^2+cp+k)y(t)=f(t)`。","图 (b)：外界作用为位移 `x(t)`，课件的运动方程为 `(mp^2+cp+k)y(t)=(cp+k)x(t)`。","初始状态：`y(0)=y_0`，`ẏ(0)=ẏ_0`。","系统固有特性：`mp^2+cp+k`。","外界作用：`f(t)`、`x(t)`。","与外界的关系：`1`、`cp+k`。","系统的输出：`y(t)`。"],"result":"两条运动方程分别为 `(mp^2+cp+k)y(t)=f(t)` 与 `(mp^2+cp+k)y(t)=(cp+k)x(t)`；初始状态、系统固有特性、外界作用、与外界的关系等四大因素决定系统响应。"},{"id":"q-ctrl1a-2","kind":"简答","priority":1,"source":"课件问题","sourceDetail":"课件 p013","keyPoints":["自动控制的优势","自动控制与人工控制对比"],"stem":"自动控制相比人工控制有何优势？","given":["人工控制由人观察、判断并操作；自动控制由控制装置自动完成，无需人的参与。"],"ask":["说明自动控制相比人工控制的优势。"],"steps":["自动控制可以快速准确进行控制，相比人工控制效果更好。","可以在恶劣环境或人们无法到达的环境进行控制。","可以长时间不疲劳地进行工作，提高工作效率。"],"result":"自动控制在控制精度与速度、适用环境、持续工作能力三方面均优于人工控制。","answerNote":"本条为课件 p013 原文所列，非老师公布的评分标准，请以老师要求为准"},{"id":"q-ctrl1b-1","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p046（例题1）","keyPoints":["恒温箱温度控制系统","输出量/输入量/控制量/扰动量","自动调温过程"],"stem":"如图所示为一恒温箱的温度控制系统，试分析这个系统的自动调温过程。这个系统的输出量、输入量、控制量和扰动量各是什么？","given":["恒温箱温度控制系统：电位器给定电压信号 u₁，热电偶测箱内温度输出 u₂，两者比较后经电压放大器、功率放大器驱动执行电机，经减速器带动调压器改变加热电阻丝的电流，电源~220V。"],"ask":["分析该系统的自动调温过程，并指出其输出量、输入量、控制量和扰动量。"],"steps":["确定被控对象：恒温箱内的温度需要被控制，故恒温箱为被控对象。","恒温箱的实际温度为被控制量（系统的输出量），设为 `T₀`；希望的恒温箱温度为系统的输入量（给定值），设为 `T_i`。","加热电阻丝的输出功率为控制量；恒温箱散热量为系统的扰动量。","恒温箱的温度由给定电压信号 `u₁` 和热电偶输出电压信号 `u₂` 之间的偏差 `u₁ − u₂` 控制。","当 `T₀ = T_i` 时，`u₁ − u₂ = 0`，即偏差为零，此时系统不工作，恒温箱温度保持在希望的温度上。","当外界因素引起箱内温度变化时，偏差信号 `u₁ − u₂ ≠ 0`，偏差经电压和功率放大后，使电机的转速和转向发生改变，通过传动装置拖动调压器的动触头作直线运动。","当温度偏高时，动触头向着减小电流的方向移动，使加热电阻丝的电流与功率减小，直到温度达到给定值为止；反之亦然。"],"result":"输出量：恒温箱实际温度 `T₀`；输入量：给定温度 `T_i`；控制量：加热电阻丝的输出功率；扰动量：恒温箱的散热量。控制方框图：`T_i` → 电位器 → 比较 → 电压及功率放大器 → 控制电机 → 减速器 → 调压器 → 恒温箱 → `T₀`，热电偶反馈 `u₂`。","basis":"课件 p047（原文）"},{"id":"q-ctrl1b-2","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p048（例题2）","keyPoints":["函数记录仪","工作原理","控制方框图"],"stem":"如图所示为函数记录仪的示意图，它通过记录笔记录缓变电压信号 u_i 的波形，试分析这个系统的工作原理，绘制其控制方框图。","given":["函数记录仪由放大器、伺服电动机、电位器、丝杠副、笔、记录纸（匀速走纸，走纸速度 v 为常值）等组成，输入为缓变电压信号 `u_i`。"],"ask":["分析该函数记录仪系统的工作原理，并绘制其控制方框图。"],"steps":["为了记录电压信号，记录笔的位移需要进行控制，因此记录笔为被控对象；记录笔的实际位移 `x₀` 为输出。","与电压信号 `u` 对应的理想位移 `x_i = K·u_i`，为输入；通过设定比例系数 `1/K`，将输入信号 `x_i` 与需要记录的电压 `u` 对应起来。","记录笔的实际位移 `x₀` 通过带动电位器的滑块移动而输出电压 `u₀`，进行测量。","在放大器两端形成偏差电压信号 `u_e = u_i − u₀`，利用 `u_e` 的大小和正负对记录笔的位置进行控制。","当 `u_i > u₀` 时，偏差 `u_e` 为正，该信号经放大驱动电动机带动齿轮机构，使记录笔及滑块正向移动，此时偏差 `u_e` 逐渐减小，直至 `u_e` 为零；反之，当 `u_i < u₀` 时，偏差 `u_e` 为负，记录笔及滑块负向移动直至 `u_e` 为零。","再配合匀速走纸机构，就能在纸上记录出电压信号 `u` 的波形。"],"result":"控制方框图：`u_i` → 比较 → 放大器 → 控制电动机 → 传动机构 → 记录笔 → `x₀`，电位器反馈 `u₀`（偏差 `u_e = u_i − u₀`）。","basis":"课件 p049（原文）"},{"id":"q-ctrl1b-3","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p026（例题4）","keyPoints":["弹簧-质量-阻尼系统","运动方程","内反馈"],"stem":"例4. 图示为弹簧-质量-阻尼机械系统（质量 m、弹簧 k、阻尼器 c，外力 f(t) 作用，输出位移 y(t)），试列写其运动方程，并说明系统内部的信息反馈关系。","given":["弹簧-质量-阻尼系统：质量块 m 与弹簧 k、阻尼器 c 相连，外力 `f(t)` 作用在质量块上，输出为该块的位移 `y(t)`。"],"ask":["列写系统的运动方程，并说明系统内部的信息反馈关系。"],"steps":["由牛顿第二定律列写系统运动方程：`m·d²y/dt² + c·dy/dt + k·y = f(t)`。","将方程改写为：`m·d²y/dt² = f(t) − c·dy/dt − k·y(t)`。","此时 `f(t)` 作用在滑块上，产生加速度，进而产生速度及位移。","一旦产生速度，就产生了速度反馈 `c·dy/dt`；有了位移，就产生了位移反馈 `k·y(t)`。","速度反馈与位移反馈共同作用形成稳定，它们都是系统内部的信息反馈。"],"result":"运动方程 `m·d²y/dt² + c·dy/dt + k·y = f(t)`；速度反馈 `c·dy/dt` 与位移反馈 `k·y(t)` 共同作用形成稳定，均为系统内部的信息反馈。","basis":"课件 p026（原文）"},{"id":"q-ctrl1b-4","kind":"单选","priority":1,"source":"课件 p036","sourceDetail":"课件 p036","keyPoints":["按反馈情况分类","开环控制系统"],"stem":"按反馈情况分类，系统没有反馈回路、输出对系统无控制作用的控制系统属于：","options":[{"k":"A","t":"闭环控制系统"},{"k":"B","t":"开环控制系统"},{"k":"C","t":"随动系统"},{"k":"D","t":"程序控制系统"}],"answer":"B","why":["A ✗ 闭环控制系统有反馈回路，输出对系统有控制作用","B ✓ 课件 p036 原文：“开环控制系统：系统没有反馈回路，输出对系统无控制作用”","C ✗ 随动系统属按输出量变化规律的分类，不是“无反馈回路”的定义","D ✗ 程序控制系统同样属按输出量变化规律的分类"],"basis":"课件 p036（原文）","answerNote":"答案直接取自课件 p036 原文，课件未标选项答案，请以老师公布为准"},{"id":"q-ctrl1b-5","kind":"单选","priority":1,"source":"课件 p040","sourceDetail":"课件 p040","keyPoints":["按输出量的变化规律分类","恒值系统"],"stem":"按输出量的变化规律分类，系统的输出保持常量的系统称为：","options":[{"k":"A","t":"随动系统"},{"k":"B","t":"程序控制系统"},{"k":"C","t":"自动调节系统（恒值系统）"},{"k":"D","t":"离散控制系统"}],"answer":"C","why":["A ✗ 随动系统的输出相应于输入按任意规律变化","B ✗ 程序控制系统的输出按预定程序变化","C ✓ 课件 p040 原文：“自动调节系统(恒值系统)：系统的输出保持常量”","D ✗ 离散控制系统是按信号类型分类的概念"],"basis":"课件 p040（原文）","answerNote":"答案直接取自课件 p040 原文，课件未标选项答案，请以老师公布为准"},{"id":"q-ctrl1b-6","kind":"单选","priority":1,"source":"课件 p030","sourceDetail":"课件 p030","keyPoints":["基本物理量","扰动量"],"stem":"在反馈控制系统中，所有使被控对象状态偏离给定值的量称为：","options":[{"k":"A","t":"被控量"},{"k":"B","t":"给定量"},{"k":"C","t":"控制量"},{"k":"D","t":"扰动量"}],"answer":"D","why":["A ✗ 被控量是系统的输出量，表征被控对象运动规律","B ✗ 给定量是系统的输入量或被控对象的理想状态","C ✗ 控制量是直接作用于被控对象的物理量","D ✓ 课件 p030 原文：“扰动量：所有使被控对象状态偏离给定值的量”"],"basis":"课件 p030（原文）","answerNote":"答案直接取自课件 p030 原文，课件未标选项答案，请以老师公布为准"},{"id":"q-ctrl1b-7","kind":"单选","priority":1,"source":"课件 p045","sourceDetail":"课件 p045","keyPoints":["对控制系统的基本要求","稳定性"],"stem":"对控制系统的基本要求中，被看作系统正常工作的首要条件、指系统恢复平衡状态能力的是：","options":[{"k":"A","t":"快速性"},{"k":"B","t":"准确性"},{"k":"C","t":"稳定性"},{"k":"D","t":"经济性"}],"answer":"C","why":["A ✗ 快速性指消除偏差快、调整时间短","B ✗ 准确性指调整结束后输出值与期望值偏差小","C ✓ 课件 p045 原文：“系统的稳定性——系统正常工作的首要条件”，且指系统恢复平衡状态的能力","D ✗ 课件未把经济性列为对控制系统的基本要求"],"basis":"课件 p045（原文）","answerNote":"答案直接取自课件 p045 原文，课件未标选项答案，请以老师公布为准"},{"id":"q-ctrl1b-8","kind":"单选","priority":1,"source":"课件 p033","sourceDetail":"课件 p033","keyPoints":["比较环节","偏差信号"],"stem":"比较环节将输入信号 x_i 与反馈量 x_b 相比较，得到小功率的偏差信号 ε，其表达式为：","options":[{"k":"A","t":"ε = x_i + x_b"},{"k":"B","t":"ε = x_i − x_b"},{"k":"C","t":"ε = x_b − x_i"},{"k":"D","t":"ε = x_i · x_b"}],"answer":"B","why":["A ✗ 相加不能得到输入与反馈之间的偏差","B ✓ 课件 p033 原文：“得到一个小功率的偏差信号 ε=x_i−x_b”","C ✗ 相减顺序与课件相反","D ✗ 相乘不是偏差信号的定义"],"basis":"课件 p033（原文）","answerNote":"答案直接取自课件 p033 原文，课件未标选项答案，请以老师公布为准"},{"id":"q-ctrl1b-9","kind":"单选","priority":1,"source":"课件 p028","sourceDetail":"课件 p028","keyPoints":["负反馈"],"stem":"当输出（被控量）偏离设定值时，反馈作用使输出偏离程度减小，并力图达到设定值，这种反馈称为：","options":[{"k":"A","t":"正反馈"},{"k":"B","t":"负反馈"},{"k":"C","t":"内反馈"},{"k":"D","t":"外反馈"}],"answer":"B","why":["A ✗ 正反馈使输出偏离程度加剧","B ✓ 课件 p028 原文：“负反馈：输出(被控量)偏离设定值(目标值)时，反馈作用使输出偏离程度减小，并力图达到设定值”","C ✗ 内反馈指系统内部信息交互，不描述偏离减小","D ✗ 外反馈指由附加装置引起的信息交互，不描述偏离减小"],"basis":"课件 p028（原文）","answerNote":"答案直接取自课件 p028 原文，课件未标选项答案，请以老师公布为准"}],"images":{"2":{"w":"img/control-ch1/p002.webp","j":"img/control-ch1/p002.jpg"},"3":{"w":"img/control-ch1/p003.webp","j":"img/control-ch1/p003.jpg"},"4":{"w":"img/control-ch1/p004.webp","j":"img/control-ch1/p004.jpg"},"5":{"w":"img/control-ch1/p005.webp","j":"img/control-ch1/p005.jpg"},"6":{"w":"img/control-ch1/p006.webp","j":"img/control-ch1/p006.jpg"},"7":{"w":"img/control-ch1/p007.webp","j":"img/control-ch1/p007.jpg"},"8":{"w":"img/control-ch1/p008.webp","j":"img/control-ch1/p008.jpg"},"9":{"w":"img/control-ch1/p009.webp","j":"img/control-ch1/p009.jpg"},"10":{"w":"img/control-ch1/p010.webp","j":"img/control-ch1/p010.jpg"},"11":{"w":"img/control-ch1/p011.webp","j":"img/control-ch1/p011.jpg"},"12":{"w":"img/control-ch1/p012.webp","j":"img/control-ch1/p012.jpg"},"13":{"w":"img/control-ch1/p013.webp","j":"img/control-ch1/p013.jpg"},"14":{"w": trol-ch1/p043.jpg"},"44":{"w":"img/control-ch1/p044.webp","j":"img/control-ch1/p044.jpg"},"45":{"w":"img/control-ch1/p045.webp","j":"img/control-ch1/p045.jpg"},"46":{"w":"img/control-ch1/p046.webp","j":"img/control-ch1/p046.jpg"},"48":{"w":"img/control-ch1/p048.webp","j":"img/control-ch1/p048.jpg"}}},{"id":"control-ch2","name":"第二章 系统数学模型","subtitle":"微分方程 · 传递函数 · 系统方框图","status":"在读","overview":"讲怎么把一个机械系统写成数学。先说明什么是数学模型、为什么要建模，给出数学模型的分类与建模的一般方法；接着按力学定律建立系统微分方程，引入相似系统的概念。重点在传递函数：定义、性质，以及比例、惯性、积分、微分、振荡、延迟等典型环节的传递函数。然后讲系统传递函数方框图及其等效简化（环节串联并联反馈、相加点与分支点的移动规则），再推广到考虑扰动的反馈控制系统传递函数，最后简介状态空间模型。","mindmap":{"label":"第二章 系统数学模型","children":[{"label":"什么是数学模型","children":[]},{"label":"为什么要建立系统的数学模型","children":[]},{"label":"一、数学模型的分类","children":[{"label":"时域数学模型（微分方程、差分方程、状态方程）"},{"label":"复域数学模型（传递函数、Z传递函数）"},{"label":"频域数学模型（频率特性）"}]},{"label":"数学建模的一般方法","children":[{"label":"分析法"},{"label":"实验法"}]},{"label":"二、系统微分方程","children":[{"label":"列写微分方程的一般方法（四步）"},{"label":"机械系统元件（质量、阻尼、弹簧）"},{"label":"电网络元件（电感、电阻、电容）"},{"label":"典型例题（例1～例6）"},{"label":"非线性方程的线性化"},{"label":"线性化特点"}]},{"label":"三、相似系统","children":[{"label":"相似系统的定义"},{"label":"相似量（质量↔电感、阻尼↔电阻、弹簧↔电容）"}]},{"label":"四、系统传递函数","children":[{"label":"拉氏变换求传递函数（零初始条件）"},{"label":"传递函数的定义与形式"}]},{"label":"传递函数","children":[{"label":"传递函数定义与特点"},{"label":"零极点模型"}]},{"label":"五、典型环节传递函数","children":[{"label":"比例环节"},{"label":"惯性环节"},{"label":"微分环节"},{"label":"积分环节"},{"label":"振荡环节"},{"label":"延时环节"},{"label":"典型环节传递函数小结"}]},{"label":"六、系统传递函数方框图","children":[{"label":"方框图三要素"},{"label":"建立方框图的步骤"}]},{"label":"七、传递函数方框图的等效简化","children":[{"label":"串联等效规则"},{"label":"并联等效规则"},{"label":"反馈连接及其等效规则"},{"label":"分支点的移动规则"},{"label":"5. 相加点的移动规则","children":[{"label":"相加点由方框输入端移到输出端：各支路串联 G(s)"},{"label":"相加点由方框输出端移到输入端：移出支路串联 1/G(s)"}]},{"label":"6. 相邻相加点的移动规则","children":[{"label":"相邻两相加点可互换位置，运算结果不变"}]},{"label":"7. 相邻分支点的移动规则","children":[{"label":"相邻两分支点可互换位置，各引出支路信号不变"}]}]},{"label":"八、考虑扰动的反馈控制系统的传递函数","children":[{"label":"只考虑给定输入：G_xB = G1G2/(1+G1G2H)"},{"label":"只考虑干扰输入：G_NB = G2/(1+G1G2H)"},{"label":"线性系统总的输出量表达式"},{"label":"闭环系统可抑制干扰的幅度"},{"label":"传函分母不变，反映系统固有特性"}]},{"label":"九、状态空间模型","children":[{"label":"状态变量与状态方程"},{"label":"状态方程的一阶导形式与矩阵形式"},{"label":"状态空间的定义"},{"label":"输出方程 Y = C^T X"},{"label":"系统矩阵、控制矩阵、输出矩阵、传递矩阵"},{"label":"三种数学模型的内在一致性与相互转换"}]}]},"points":[{"id":"p-ctrl2a-1","title":"什么是数学模型","key":false,"source":"课件 p002","items":["数学模型是**针对参照某种事物系统的特征或数量依存关系**，采用数学语言，概括地或近似地表述出的一种**数学结构**","这种数学结构是借助于数学符号刻划出来的某种系统的**纯关系结构**","**广义理解**：数学模型包括数学中的各种概念、各种公式和各种理论，它们都是由现实世界的原型抽象出来的","**狭义理解**：数学模型只指那些反映了特定问题或特定的具体事物系统的数学关系结构，也可理解为联系一个系统中各变量间关系的数学表达"]},{"id":"p-ctrl2a-2","title":"为什么要建立系统的数学模型","key":false,"source":"课件 p003","items":["研究和分析一个系统，不仅要**定性地**了解系统的工作原理及其特性，更要**定量地**描述系统的动态性能","揭示系统的**结构、参数与动态性能之间的关系**","建立数学模型是**定量研究**的基础","建立数学模型是**研究系统运行规律**的基础","建立数学模型是**对系统行为进行控制**的基础","建立数学模型是**对系统未来进行预测**的基础"]},{"id":"p-ctrl2a-3","title":"一、数学模型的分类","key":true,"source":"课件 p004","items":["**时域数学模型**：微分方程（连续系统）、差分方程（离散系统）、状态方程","**复域数学模型**：传递函数（连续系统）、Z传递函数（离散系统）","**频域数学模型**：频率特性"]},{"id":"p-ctrl2a-4","title":"数学建模的一般方法","key":false,"source":"课件 p005","items":["**分析法**：根据系统或元件所遵循的有关定律来建模","**实验法**：根据实验数据整理拟合建模","分析法适用于**简单、典型、常见**的系统，实验法适用于**复杂、非常见**的系统","通常把两种方法**结合**建立系统的数学模型更加有效"]},{"id":"p-ctrl2a-5","title":"连续系统微分方程的一般形式与系统分类","key":true,"source":"课件 p006","items":["一般形式：`a_n x_o^{(n)}(t)+a_{n-1}x_o^{(n-1)}(t)+…+a_1x′_o(t)+a_0x_o(t)=b_m x_i^{(m)}(t)+b_{m-1}x_i^{(m-1)}(t)+…+b_1x′_i(t)+b_0x_i(t)`","`x_o(t)`、`x_i(t)` 分别为系统输出和输入；`a_i (i=0,1,2,…,n)`、`b_j (j=0,1,2,…,m)` 为微分方程系数","若所有系数都**不是**输入、输出及其各阶导数的函数，则微分方程表示的系统为**线性系统**；否则为**非线性系统**","线性系统中若系数为**常数**则为**线性定常系统**，否则为线性时变系统","例：`x″_o+3x′_o+7x_o=4x′_i+5x_i` 为线性定常系统；`x″_o+3x′_o+7x_o=4t^2x′_i+5x_i` 为线性时变系统；`x″_o+3x_ox′_o+7x_o=4t^2x′_i+5x_i` 为非线性系统"]},{"id":"p-ctrl2a-6","title":"线性系统的叠加原理","key":false,"source":"课件 p007","items":["若输入 `x_{i1}` 产生输出 `x_{o1}`，输入 `x_{i2}` 产生输出 `x_{o2}`","则对任意常数 `α`、`β`，输入 `αx_{i1}+βx_{i2}` 产生的输出为 `αx_{o1}+βx_{o2}`","即线性系统满足**叠加原理**：多个输入同时作用的效果等于各输入单独作用效果的叠加"]},{"id":"p-ctrl2a-7","title":"二、系统微分方程——列写微分方程的一般方法","key":true,"source":"课件 p008","items":["1. **确定系统的输入量和输出量**（注意：输入量包括**给定输入量和扰动量**）","2. 按信息传递顺序，从系统输入端出发，根据各变量所遵循的物理定律，**列写系统中各环节的动态微分方程**（注意：**负载效应、非线性项的线性化**）","3. **消除中间变量**，得到只包含输入量和输出量的微分方程","4. **整理微分方程**：输出有关项放在方程左侧，输入有关项放在方程右侧，各阶导数项降阶排列","整理后的标准形式：`a_n x_o^{(n)}(t)+a_{n-1}x_o^{(n-1)}(t)+…+a_1x′_o(t)+a_0x_o(t)=b_m x_i^{(m)}(t)+b_{m-1}x_i^{(m-1)}(t)+…+b_1x′_i(t)+b_0x_i(t)`"]},{"id":"p-ctrl2a-8","title":"机械系统与电网络的基本元件方程","key":true,"source":"课件 p009","items":["**机械系统**（以两端相对速度 `v_{21}` 为变量）：质量元件 `F=m·dv_{21}/dt`；阻尼元件 `F=bv_{21}`；弹簧元件 `F=k∫v_{21}dt`","**电网络**（以电路元件两端电位差 `v_{21}` 为变量）：电感元件 `v_{21}=L·di/dt`；电阻元件 `v_{21}=Ri`；电容元件 `v_{21}=(1/C)∫i dt`","两类元件的方程形式一一对应，是相似系统的元件基础"]},{"id":"p-ctrl2a-9","title":"非线性方程的线性化——问题的提出","key":false,"source":"课件 p016","items":["实际的物理元件都存在一定程度的**非线性**，而**求解非线性微分方程时很困难**","非线性系统的理论和分析方法**还不是很成熟**","因此提出：**如何利用线性系统的理论研究非线性系统？**","非线性微分方程**在一定条件下可以线性化**（即非线性系统分析在一定条件下可以转化成线性系统进行分析）"]},{"id":"p-ctrl2a-10","title":"非线性方程线性化的条件与方法","key":true,"source":"课件 p017","items":["**线性化的条件** 1：非线性函数是**连续函数**（即不是本质非线性）","**线性化的条件** 2：系统在**预定工作点**附近作**小偏差运动**","**线性化的方法** 1：确定预定工作点","**线性化的方法** 2：在工作点附近将非线性方程展开成 **Taylor 级数形式**","**线性化的方法** 3：**忽略高阶小项**","**线性化的方法** 4：表示成**增量方程**的形式"]},{"id":"p-ctrl2a-11","title":"线性化特点","key":false,"source":"课件 p020","items":["非线性项线性化后，微分方程是**增量形式**的微分方程","线性化的结果与系统的**预定工作点有关**（如本例中，不同预定点的 `k_q`、`k_c` 不同）","非线性项线性化必须满足**连续性**和**小偏差**条件"]},{"id":"p-ctrl2a-12","title":"三、相似系统","key":true,"source":"课件 p021","items":["电网络 `Lq″+Rq′+(1/C)q=u` 与机械系统 `mx″+cx′+kx=f`：组成系统的**物理元件不同**，但**数学模型形式相同**","**相似系统**的定义：具有**相同形式数学模型**的不同物理构成的系统","相似量对照——质量元件 `F=m·dv_{21}/dt` ↔ 电感元件 `v_{21}=L·di/dt`","相似量对照——阻尼元件 `F=bv_{21}` ↔ 电阻元件 `v_{21}=Ri`","相似量对照——弹簧元件 `F=k∫v_{21}dt` ↔ 电容元件 `v_{21}=(1/C)∫i dt`"]},{"id":"p-ctrl2a-13","title":"四、系统传递函数","key":true,"source":"课件 p022","items":["连续系统的微分方程一般形式（`n ≥ m`）：`a_n x_o^{(n)}(t)+…+a_1x′_o(t)+a_0x_o(t)=b_m x_i^{(m)}(t)+…+b_1x′_i(t)+b_0x_i(t)`","在**零初始条件**下，对方程两边拉氏变换，得 `(a_n s^n+…+a_1 s+a_0)X_o(s)=(b_m s^m+…+b_1 s+b_0)X_i(s)`","`X_o(s)/X_i(s)=(b_m s^m+…+b_1 s+b_0)/(a_n s^n+…+a_1 s+a_0)`（`n ≥ m`）：**分子**反映系统与外界联系，**分母**反映系统固有特性","传递函数 `G(s)=X_o(s)/X_i(s)=(b_m s^m+…+b_1 s+b_0)/(a_n s^n+…+a_1 s+a_0)`（`n ≥ m`）","**传递函数定义**：零初始条件下，线性定常系统输出的拉氏变换与输入的拉氏变换之比"]},{"id":"p-ctrl2b-1","title":"传递函数的定义与特点","key":true,"source":"课件 p023","items":["传递函数定义：`G(s)=X_o(s)/X_i(s)=(b_m s^m+…+b_1 s+b_0)/(a_n s^n+…+a_1 s+a_0)`，且 `n≥m`","零初始条件下 `X_o(s)=G(s)X_i(s)`；方框图为 `X_i(s)→[ G(s) ]→X_o(s)`（传递函数方框）","特点1：传递函数是关于复变量 `s` 的复变函数，为**复域数学模型**","特点2：分母反映系统本身与外界无关的固有特性，分子反映系统与外界的联系","特点3：在零初始条件下，输入确定时输出完全取决于传递函数 `x_o(t)=L^{-1}[X_o(s)]=L^{-1}[G(s)X_i(s)]`","特点4：物理性质不同的系统，可以具有相同的传递函数（相似系统）"]},{"id":"p-ctrl2b-2","title":"传递函数的零极点模型","key":true,"source":"课件 p024","items":["零极点形式：`G(s)=K(s-z_1)(s-z_2)…(s-z_m)/((s-p_1)(s-p_2)…(s-p_n))`","极点 `p_1,p_2,…,p_n` 是**微分方程的特征根**，决定系统瞬态响应的收敛性、决定稳定性","零点 `z_1,z_2,…,z_m` 影响瞬态响应曲线的形状，不影响稳定性","放大系数（增益）`G(0)=K(-z_1)(-z_2)…(-z_m)/((-p_1)(-p_2)…(-p_n))=b_0/a_0`","设阶跃输入 `x_i(t)=k`，`X_i(s)=k/s`，则系统稳态输出 `lim(t→∞)x_o(t)=lim(s→0)sG(s)X_i(s)=lim(s→0)sG(s)k/s=G(0)·k`","结论：对系统的研究可以转化为对系统传递函数**零点、极点、放大系数**的研究"]},{"id":"p-ctrl2b-3","title":"典型环节—比例环节","key":true,"source":"课件 p027","items":["系统传递函数往往是高阶的，可化为比例、惯性、积分、微分、振荡等低阶典型环节传递函数的组合","比例环节：输出正比于输入","动力学方程 `x_o(t)=Kx_i(t)`；传递函数 `G(s)=K`","特点：输出量与输入量成正比；不失真，不延迟","例：反相比例运算电路、齿轮传动"]},{"id":"p-ctrl2b-4","title":"典型环节—惯性环节","key":true,"source":"课件 p028","items":["动力学方程 `T·dx_o(t)/dt+x_o(t)=Kx_i(t)`；传递函数 `G(s)=K/(Ts+1)`（方框 `1/(Ts+1)`）","例1 RC 电路：`G(s)=1/(RCs+1)`","例2 弹簧-阻尼系统：`k(x_i-x_o)=cẋ_o` → `cẋ_o+kx_o=kx_i` → `G(s)=X_o/X_i=k/(cs+k)=1/((c/k)s+1)=1/(Ts+1)`","特点：存在储能元件和耗能元件","阶跃输入时，输出经过一段时间才达到稳态值"]},{"id":"p-ctrl2b-5","title":"典型环节—微分环节","key":true,"source":"课件 p029","items":["微分环节：输出正比于输入的变化率","动力学方程 `x_o(t)=T·ẋ_i(t)`；传递函数 `G(s)=Ts`","特点：一般不能单独存在，常与比例、积分共同作用；增加系统的阻尼；强化噪声（输出是输入的导数）","例1 微分运算电路：`i=C·du_i/dt=(0-u_o)/R_1`，`u_o=-R_1C·u_i`（导数），`G(s)=U_o(s)/U_i(s)=-R_1Cs`"]},{"id":"p-ctrl2b-6","title":"典型环节—积分环节","key":true,"source":"课件 p031","items":["积分环节：输出正比于输入的累积量","动力学方程 `x_o(t)=(1/T)∫x_i(t)dt`；传递函数 `G(s)=1/(Ts)`","若输入单位阶跃信号 `x_i(t)=1`，`X_i(s)=1/s`，则 `X_o(s)=1/(Ts)·1/s=1/(Ts^2)`，`x_o(t)=L^{-1}[X_o(s)]=(1/T)t`","特点：输出反映输入量的累积；输出滞后于输入，经过时间 `T` 输出才等于输入；输出具有记忆功能，经过一段时间后输入变为 0，输出稳定不变"]},{"id":"p-ctrl2b-7","title":"典型环节—振荡环节","key":true,"source":"课件 p032","items":["传递函数 `G(s)=ω_n^2/(s^2+2ξω_n s+ω_n^2)`（`0≤ξ<1`）","或 `G(s)=1/(T^2 s^2+2ξTs+1)`；其中 `ω_n` 为无阻尼固有频率，时间常数 `T=1/ω_n`，`ξ` 为阻尼比","特点(1)：`0≤ξ<1` 时输出振荡，且 `ξ` 越小振荡越剧烈","特点(2)：`ξ≥1` 时输出无振荡，不是振荡环节","特点(3)：振荡环节一般含有两个储能元件和一个耗能元件","例1 机械系统：`mẍ+cẋ+kx=f`，`G(s)=1/(ms^2+cs+k)=ω_n^2/(s^2+2ξω_n s+ω_n^2)`，`ω_n=√(k/m)`，`ξ=c/(2√(mk))`"]},{"id":"p-ctrl2b-8","title":"典型环节—延时环节","key":true,"source":"课件 p034","items":["动力学方程 `x_o(t)=x_i(t-τ)`；传递函数 `G(s)=e^{-τs}`","特点：输出滞后于输入，但不失真；延时环节与惯性环节和比例环节有区别","例：轧钢厂钢板厚度检测 `Δh_2=Δh_1(t-τ)`，`G(s)=e^{-τs}`","对比：惯性环节输出渐近上升、比例环节输出立即成比例、延时环节输出延迟 τ 后突变"]},{"id":"p-ctrl2b-9","title":"典型环节传递函数小结","key":true,"source":"课件 p035","items":["物理元件个数不一定等于系统的环节个数：一个元件可起几种环节作用，几个元件也可能只起一个环节的作用","物理框图：说明物理过程和原理，框图中为元器件或零部件","传递函数框图：表示信息传递关系，框图中为各环节传递函数","同一物理元件在不同系统中，可能作用不同，其传递函数也不同，可能充当不同典型环节"]},{"id":"p-ctrl2b-10","title":"系统传递函数方框图","key":true,"source":"课件 p036","items":["传递函数方框图将组成系统的各环节用传递函数方框表示，并将相应的变量按信息流动方向连接起来构成","三要素：传递函数方框 `G(s)`、相加点（如 `A-B+C`，带 +/− 号）、分支点","建立步骤(1)：列写各元件微分方程","建立步骤(2)：在零初始条件下，对上述微分方程进行拉氏变换","建立步骤(3)：按因果关系，绘制各环节框图","建立步骤(4)：按信号流向，依次连接各环节框图；左边输入、右边输出，反馈则“倒流”"]},{"id":"p-ctrl2b-11","title":"方框图等效简化—串联与并联","key":true,"source":"课件 p040","items":["等效变换：变换前后输入输出间的数学关系保持不变","串联环节等效规则：`X_i(s)→[G_1(s)]→[G_2(s)]→X_o(s)` 等效为 `X_i(s)→[G_1(s)G_2(s)]→X_o(s)`，即 `G(s)=G_1(s)G_2(s)`","并联环节等效规则：`G_1(s)` 与 `G_2(s)` 并联后经相加点（±）合并，等效为 `G_1(s)±G_2(s)`"]},{"id":"p-ctrl2b-12","title":"反馈连接及其等效规则","key":true,"source":"课件 p041","items":["前向通道传递函数 `G(s)=X_o(s)/E(s)`","反馈通道传递函数 `H(s)=B(s)/X_o(s)`","以反馈量 `B(s)` 为输出的开环传递函数 `G_k(s)=G(s)H(s)=B(s)/E(s)`","反馈回路闭合后 `E(s)=X_i(s)-B(s)=X_i(s)-X_o(s)H(s)`，`X_o(s)=G(s)E(s)=G(s)[X_i(s)-X_o(s)H(s)]`","闭环传递函数 `G_B(s)=X_o(s)/X_i(s)=G(s)/(1+G(s)H(s))`"]},{"id":"p-ctrl2b-13","title":"单位反馈与局部/系统传递函数","key":true,"source":"课件 p042","items":["反馈连接可等效为 `G(s)/(1±G(s)H(s))`（负反馈取“+”）","特别地，若 `H(s)=1`，则为单位反馈，等效为 `G(s)/(1+G(s))`","注意：前向通道传递函数、反馈通道传递函数、开环传递函数均为**局部传递函数**；只有闭环传递函数才是**系统传递函数**"]},{"id":"p-ctrl2b-14","title":"分支点的移动规则","key":true,"source":"课件 p043","items":["分支点由方框输出端移到输入端时，需在分支支路中串入 `G(s)`，使 `X_3=X_2` 保持不变","分支点由方框输入端移到输出端时，需在分支支路中串入 `1/G(s)`，使 `X_3=X_1` 保持不变"]},{"id":"p-ctrl2c-1","title":"相加点的移动规则","key":true,"source":"课件 p045","items":["相加点（比较点）跨过方框移动时，**移动前后各信号的运算关系必须保持不变**。","相加点由方框**输入端移到输出端**：各输入支路均需串联 `G(s)`，等效为各支路分别经 `G(s)` 后再相加。","相加点由方框**输出端移到输入端**：被移出的支路须串联 `1/G(s)` 后再加入相加点。","例如 `X3 = G(s)(X1 − X2)` 与 `X3 = G(s)X1 − X2` 两种结构完全等效。"]},{"id":"p-ctrl2c-2","title":"相邻相加点与相邻分支点的移动规则","key":true,"source":"课件 p046","items":["**相邻相加点的移动规则**：两个相邻的相加点可以互换位置，运算结果 `X4(s) = X1(s) ± X2(s) ± X3(s)` 不变。","**相邻分支点的移动规则**：两个相邻的分支点（引出点）可以互换位置，各引出支路上的信号 `X(s)` 均不变。","移动/互换的目的是把交叉的反馈支路理顺，以便按嵌套回路从里到外逐步化简。"]},{"id":"p-ctrl2c-3","title":"方框图简化的一般条件与简算公式","key":true,"source":"课件 p052","items":["一般地，当一个系统传递函数方框图满足如下两个条件：1）**只有一条前向通道**；2）**各局部反馈回路中包含公共传递函数方框**。","则系统传递函数可简化为：`G_B(s) = 前向通道的传递函数之积 / [1 + Σ(每一反馈回路开环传递函数)]`。","分母中的 Σ 是对各反馈回路的开环传递函数求和，反馈的极性决定各项的符号。","该公式把复杂的嵌套回路化简归结为“前向通道之积”与“各回路开环传函之代数和”。"]},{"id":"p-ctrl2c-4","title":"考虑扰动的反馈控制系统的传递函数","key":true,"source":"课件 p054","items":["**只考虑给定输入时**（令扰动 `N = 0`）：`G_xB = G1G2 / (1 + G1G2H)`。","**只考虑干扰输入时**（令给定输入为 0）：`G_NB = G2 / (1 + G1G2H)`。","线性系统满足叠加原理，系统总的输出量：`X_o = G1G2/(1+G1G2H)·X_i + G2/(1+G1G2H)·N`。","两种情况所得传递函数的**分子不同、分母相同**，分母均为 `1 + G1G2H`。"]},{"id":"p-ctrl2c-5","title":"闭环系统抑制干扰与传函分母不变的结论","key":true,"source":"课件 p055","items":["当 `|G1G2H| >> 1` 时：`X_o ≈ (1/H)·X_i + (1/(G1H))·N`。","当 `|G1G2H| >> 1` 且 `|G1H| >> 1` 时：`X_o ≈ (1/H)·X_i + δN`，其中 δ 为**极小值**。","结论 1：**闭环系统可抑制干扰的幅度**。","结论 2：闭环系统输入、输出取法不同，则传函不同，但**传函分母不变**——反映系统本身固有特性；而开环系统却不然。"]},{"id":"p-ctrl2c-6","title":"状态空间模型与输出方程","key":true,"source":"课件 p057","items":["状态方程的矩阵形式：`Ẋ = AX + Bu`，其中状态向量 `X = [x1; x2]^T`。","**状态空间**：由 `x1` 轴、`x2` 轴……`xn` 轴组成的 n 维空间；系统任一时刻的状态可用状态空间中的一点表示。","**输出方程**：由输出 `y = x2` 写成矩阵形式 `y = [0 1][x1; x2]^T`，即 `Y = C^T X`。","状态方程与输出方程共同构成系统的**状态空间表达式**。"]},{"id":"p-ctrl2c-7","title":"状态空间表达式各矩阵的含义","key":true,"source":"课件 p058","items":["状态方程 `Ẋ = AX + Bu`：`X` 为 n 维状态向量，`A` 为**系统矩阵**（`n×n`），`B` 为**控制矩阵**（`n×1`），`u` 为输入量。","输出方程 `Y = C^T X + Du`：`Y` 为输出向量，`C` 为**输出矩阵**（`1×n`），`D` 为**传递矩阵**（`1×1`）。","状态方程描述系统内部状态的演化规律，输出方程描述输出与状态、输入之间的关系。"]},{"id":"p-ctrl2c-8","title":"系统数学模型的三种形式及其相互转换","key":true,"source":"课件 p059","items":["描述系统的数学模型有**微分方程、传递函数、状态空间**三种形式。","三种模型之间**必有内在的一致性，必可相互转换**。","由状态空间表达式求传递函数：`G(s) = Y(s)/U(s) = C^T (sI − A)^{-1} B + D`。","式中 `I` 为单位矩阵。"]}],"questions":[{"id":"q-ctrl2a-1","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p010（例题）","keyPoints":["牛顿第二定律","机械系统微分方程"],"stem":"例1：图示机械系统 m-c-k，列写微分方程。","given":["机械平移系统，质量 `m`、阻尼系数 `c`、弹簧刚度 `k`；输入为外力 `f(t)`，输出为质量块的位移 `x(t)`。"],"ask":["列写该系统以位移 `x` 为输出的运动微分方程。"],"steps":["第一步 明确：系统输入为 `f(t)`，系统输出为 `x(t)`","第二步 由牛顿第二定律列写原始微分方程：`f-kx-cx′=mx″`","第三步 整理：输出有关项放在方程左侧，得 `mx″+cx′+kx=f`"],"result":"`mx″+cx′+kx=f`","basis":"课件 p010（原文）"},{"id":"q-ctrl2a-2","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p011（例题）","keyPoints":["基尔霍夫定律","电网络微分方程"],"stem":"例2：图示电网络，列写微分方程。","given":["RLC 串联电网络，电感 `L`、电阻 `R`、电容 `C`；输入电压 `u(t)`，输出为电量 `q`。"],"ask":["列写该电网络以电量 `q` 为输出的微分方程。"],"steps":["第一步 明确系统的输入与输出：输入 `u(t)`，输出电量 `q`","第二步 列写原始微分方程：`u=L·di/dt+iR+(1/C)∫i dt`，且 `i=dq/dt`","第三步 消除中间变量 `i`，并整理得 `Lq″+Rq′+(1/C)q=u`"],"result":"`Lq″+Rq′+(1/C)q=u`","basis":"课件 p011（原文）"},{"id":"q-ctrl2a-3","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p012（例题）","keyPoints":["多环节系统","消除中间变量"],"stem":"例3：列写微分方程。","given":["齿轮—丝杠—工作台机械系统：输入转矩 `T`，输出位移 `x(t)`；丝杠半径 `r`，转动惯量 `J`，轴刚度 `k_1`，两端转角 `θ_0`、`θ`，阻尼 `B_1`；工作台质量 `m`，阻尼 `B_2`，刚度 `k_2`。"],"ask":["列写以位移 `x` 为输出的系统微分方程。"],"steps":["第一步 明确：输入 `T`，输出 `x(t)`","第二步 列写各环节微分方程：`T=k_1(θ_0-θ)`；`f=mx″+B_2x′+k_2x`；`k_1(θ_0-θ)=Jθ″+B_1θ′+rf`；`x=θr`","第三步 消除中间变量 `f`、`θ`、`θ_0`，并整理"],"result":"`(J+mr^2)x″+(B_1+B_2r^2)x′+k_2r^2x=rT`","basis":"课件 p012（原文）"},{"id":"q-ctrl2a-4","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p013（例题）","keyPoints":["无源电网络","消去中间电流变量"],"stem":"例4：图示电网络，列写微分方程。","given":["两级 RC 电网络：电阻 `R_1`、`R_2`，电容 `C_1`、`C_2`，输入 `u_1`，输出 `u_2`，支路电流 `i_1`、`i_2`。"],"ask":["列写以 `u_2` 为输出的微分方程。"],"steps":["第一步 明确系统的输入与输出：输入 `u_1`，输出 `u_2`","第二步 列写微分方程：`i_1R_1+(1/C_1)∫(i_1-i_2)dt=u_1`；`i_2R_2+(1/C_2)∫i_2dt=(1/C_1)∫(i_1-i_2)dt`；`(1/C_2)∫i_2dt=u_2`","第三步 消除中间变量 `i_1`、`i_2`，并整理"],"result":"`R_1C_1R_2C_2·d^2u_2/dt^2+(R_1C_1+R_2C_2+R_1C_2)·du_2/dt+u_2=u_1`","basis":"课件 p013（原文）"},{"id":"q-ctrl2a-5","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p014、p015（例题）","keyPoints":["直流电动机建模","时间常数","增量方程"],"stem":"例5：直流电动机，列写微分方程并作增量分析（静特性与增量方程）。","given":["电枢回路电感 `L`、电阻 `R`；输入电压 `u_a` 和负载力矩 `M_L`，输出角速度 `ω`；反电势 `e_d=k_dω`，电磁力矩 `M=k_mi_a`，转动惯量 `J`，励磁电流 `i_2=const`。"],"ask":["列写电动机的微分方程，并求静特性与偏离平衡点时的增量方程。"],"steps":["第一步 明确输入与输出：输入 `u_a` 和 `M_L`，输出 `ω`","第二步 列写原始微分方程：`L·di_a/dt+i_aR+e_d=u_a`；`e_d=k_dω`；`J·dω/dt=M-M_L`；`M=k_mi_a`","第三步 消除中间变量并整理，令 `T_a=L/R`、`T_m=RJ/(k_dk_m)`、`C_d=1/k_d`、`C_m=T_m/J`，得 `T_aT_m·d^2ω/dt^2+T_m·dω/dt+ω=C_du_a-C_mT_a·dM_L/dt-C_mM_L`","第四步 设电动机处于平衡态（变量各阶导数为零），得**静特性** `ω=C_du_a-C_mM_L`；设平衡点 `(u_{a0}, M_{L0}, ω_0)`，则 `ω_0=C_du_{a0}-C_mM_{L0}`","第五步 当偏离平衡点时 `u_a=u_{a0}+Δu_a`、`M_L=M_{L0}+ΔM_L`、`ω=ω_0+Δω`，代入并整理得增量方程 `T_aT_m(Δω)''+T_m(Δω)'+Δω=C_dΔu_a-C_mT_a(ΔM_L)'-C_mΔM_L`"],"result":"一般方程 `T_aT_m·d^2ω/dt^2+T_m·dω/dt+ω=C_du_a-C_mT_a·dM_L/dt-C_mM_L`；增量方程 `T_aT_m(Δω)''+T_m(Δω)'+Δω=C_dΔu_a-C_mT_a(ΔM_L)'-C_mΔM_L`","basis":"课件 p014、p015（原文）"},{"id":"q-ctrl2a-6","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p018、p019（例题）","keyPoints":["液压伺服机构","二元泰勒展开","非线性线性化"],"stem":"例6：液压伺服机构，列写微分方程（含非线性项线性化）。","given":["滑阀—液压缸—负载系统：输入滑阀位移 `x`，输出液压缸位移 `y`；负载质量 `m`、阻尼 `c`，油缸有效面积 `A`，压差 `p=p_1-p_2`，液压油流量 `q=Ay'`，滑阀特性 `q=q(x,p)=c_d·ẋ·√(p/ρ)`。"],"ask":["列写该系统的微分方程，并对非线性流量方程作线性化处理。"],"steps":["第一步 明确输入 `x`，输出 `y`","第二步 列写原始微分方程：`my''+cy'=Ap`；`q=Ay'`；滑阀特性 `q=q(x,p)=c_d·ẋ·√(p/ρ)`","第三步 非线性函数线性化：(1) 确定系统预定工作点 `q_0=q(x_0,p_0)`；(2) 二元泰勒公式展开 `q(x,p)≈q(x_0,p_0)+(∂q/∂x)|_{x_0,p_0}·Δx+(∂q/∂p)|_{x_0,p_0}·Δp`（已略去高阶小量）","第四步 得增量方程 `p=(1/K_c)(K_qx-q)=(K_q/K_c)x-(A/K_c)y'`","第五步 代入原方程 `my''+cy'=Ap`，整理得 `my''+(c+A^2/K_c)y'=(AK_q/K_c)x`"],"result":"`my''+(c+A^2/K_c)y'=(AK_q/K_c)x`","basis":"课件 p018、p019（原文）"},{"id":"q-ctrl2b-1","kind":"计算","priority":1,"source":"课件题目","sourceDetail":"课件 p025（例1）","keyPoints":["微分方程建模","拉氏变换","传递函数"],"stem":"例1：求图示系统的传递函数（RC 双级网络，输入为 u_1，输出为 u_2）","given":["电路由 R_1、C_1、R_2、C_2 组成：u_1 经 R_1 到中间节点，中间节点对地接 C_1，再经 R_2 到输出节点，输出节点对地接 C_2，输出为 u_2；支路电流分别为 i_1、i_2"],"ask":["求系统传递函数 G(s)=U_2(s)/U_1(s)"],"steps":["第一步 确定系统输入与输出：输入 u_1，输出 u_2","第二步 列写原始微分方程：`i_1R_1+(1/C_1)∫(i_1-i_2)dt=u_1`；`i_2R_2+(1/C_2)∫i_2dt=(1/C_1)∫(i_1-i_2)dt`；`(1/C_2)∫i_2dt=u_2`","第三步 在零初始条件下进行拉氏变换：`R_1I_1+(I_1-I_2)/(C_1s)=U_1`；`R_2I_2+I_2/(C_2s)=(I_1-I_2)/(C_1s)`；`I_2/(C_2s)=U_2`","第四步 消除中间变量 I_1、I_2，并整理得：`[R_1C_1R_2C_2s^2+(R_1C_1+R_2C_2+R_1C_2)s+1]U_2=U_1`","第五步 写出传递函数"],"result":"`G(s)=1/(R_1C_1R_2C_2s^2+(R_1C_1+R_2C_2+R_1C_2)s+1)`","basis":"课件 p025、p026（原文）"},{"id":"q-ctrl2b-2","kind":"计算","priority":1,"source":"课件题目","sourceDetail":"课件 p028（惯性环节例1）","keyPoints":["惯性环节","RC 电路"],"stem":"例1：求图示 RC 电路的传递函数（输入 u_i，输出 u_o）","given":["电阻 R 与电容 C 串联，输入为 u_i，输出 u_o 取电容两端电压"],"ask":["求 G(s)=U_o(s)/U_i(s)"],"steps":["第一步 由电路关系：`u_i=Ri+u_o`，且电容电流 `i=C·du_o/dt`","第二步 代入得 `u_i=RC·du_o/dt+u_o`，符合惯性环节形式 `T·dx_o/dt+x_o=Kx_i`（取 K=1，T=RC）","第三步 零初始条件下拉氏变换：`U_i(s)=(RCs+1)U_o(s)`","第四步 求传递函数"],"result":"`G(s)=1/(RCs+1)`","basis":"课件 p028（原文）"},{"id":"q-ctrl2b-3","kind":"计算","priority":1,"source":"课件题目","sourceDetail":"课件 p028（惯性环节例2）","keyPoints":["惯性环节","弹簧-阻尼系统"],"stem":"例2：求图示弹簧-阻尼系统的传递函数（输入位移 x_i，输出位移 x_o）","given":["弹簧刚度 k 与阻尼器阻尼系数 c 关联，输入位移 x_i，输出位移 x_o"],"ask":["求 G(s)=X_o(s)/X_i(s)"],"steps":["第一步 力平衡：`k(x_i-x_o)=cẋ_o`","第二步 整理为 `cẋ_o+kx_o=kx_i`","第三步 拉氏变换：`(cs+k)X_o(s)=kX_i(s)`","第四步 `G(s)=k/(cs+k)=1/((c/k)s+1)`，为标准惯性环节"],"result":"`G(s)=k/(cs+k)=1/(Ts+1)`，式中 `T=c/k`","basis":"课件 p028（原文）"},{"id":"q-ctrl2b-4","kind":"计算","priority":1,"source":"课件题目","sourceDetail":"课件 p029（微分环节例1）","keyPoints":["微分环节","微分运算电路"],"stem":"例1：求图示微分运算电路的传递函数（输入 u_i，输出 u_o）","given":["输入回路串接电容 C，反馈回路为电阻 R_1，运算放大器反相输入，输入 u_i，输出 u_o"],"ask":["求 G(s)=U_o(s)/U_i(s)"],"steps":["第一步 由虚地及电容电流关系：`i=C·du_i/dt=(0-u_o)/R_1`","第二步 得 `u_o=-R_1C·du_i/dt`","第三步 拉氏变换：`U_o(s)=-R_1Cs·U_i(s)`","第四步 求传递函数"],"result":"`G(s)=U_o(s)/U_i(s)=-R_1Cs`","basis":"课件 p029（原文）"},{"id":"q-ctrl2b-5","kind":"计算","priority":1,"source":"课件题目","sourceDetail":"课件 p030（例2）","keyPoints":["微分环节近似","液压阻尼器"],"stem":"例2：求机械液压阻尼器（缓冲，减小偏移幅度）的传递函数","given":["油缸活塞面积 A，节流阀液阻 R，左、右腔压力 p_1、p_2，输入位移 x_i、输出位移 x_o，弹簧刚度 k"],"ask":["求 G(s)=X_o(s)/X_i(s)，并在 |Ts|<<1 时化简"],"steps":["第一步 油缸力平衡：`A(p_2-p_1)=kx_o`","第二步 节流阀流量：`q=A(ẋ_i-ẋ_o)=(p_2-p_1)/R`","第三步 联立得 `ẋ_i-ẋ_o=(k/(A^2R))x_o`","第四步 拉氏变换：`(k/(A^2R))X_o(s)+sX_o(s)=sX_i(s)`","第五步 整理：`G(s)=s/(s+k/(A^2R))=s/(s+1/T)=Ts/(Ts+1)=(1/(Ts+1))·Ts`","第六步 若 `|Ts|<<1`，则 `G(s)≈Ts`"],"result":"`G(s)=Ts/(Ts+1)`；当 `|Ts|<<1` 时 `G(s)≈Ts`（式中 `T=A^2R/k`）","basis":"课件 p030（原文）"},{"id":"q-ctrl2b-6","kind":"计算","priority":1,"source":"课件题目","sourceDetail":"课件 p031（积分环节例1）","keyPoints":["积分环节","水箱水位系统"],"stem":"例1：求图示水位系统的传递函数（输入流量 Q，输出水位 h）","given":["控制阀流量 Q_1(t)，负载阀流量 Q_2(t)，净流量 Q(t)=Q_1(t)-Q_2(t)，水箱截面积 A，水位 h(t)"],"ask":["求 G(s)=H(s)/Q(s)"],"steps":["第一步 流量平衡：`Q(t)=Q_1(t)-Q_2(t)`","第二步 累积关系：`∫Q(t)dt=Ah(t)`","第三步 零初始条件下拉氏变换：`Q(s)=A s H(s)`","第四步 求传递函数"],"result":"`G(s)=H(s)/Q(s)=1/(As)`","basis":"课件 p031（原文）"},{"id":"q-ctrl2b-7","kind":"计算","priority":1,"source":"课件题目","sourceDetail":"课件 p031（积分环节例2）","keyPoints":["积分环节","积分运算电路"],"stem":"例2：求图示积分运算电路的传递函数（输入 u_i，输出 u_o）","given":["输入回路为电阻 R，反馈回路为电容 C，运算放大器反相输入"],"ask":["求 G(s)=U_o(s)/U_i(s)"],"steps":["第一步 由虚地：`u_i/R=-C·du_o/dt`","第二步 拉氏变换：`U_i(s)/R=-Cs·U_o(s)`","第三步 `G(s)=U_o(s)/U_i(s)=-1/(RCs)=1/(Ts)`"],"result":"`G(s)=-1/(RCs)=1/(Ts)`，式中 `T=-RC`","basis":"课件 p031（原文）"},{"id":"q-ctrl2b-8","kind":"计算","priority":1,"source":"课件题目","sourceDetail":"课件 p032（振荡环节例1）","keyPoints":["振荡环节","ω_n 与 ξ"],"stem":"例1：求图示机械系统（质量-弹簧-阻尼）的传递函数，并化为标准振荡环节形式","given":["运动方程 `mẍ+cẋ+kx=f`，m 为质量、c 为阻尼、k 为弹簧刚度，输入力 f，输出位移 x"],"ask":["求 G(s)=X(s)/F(s)，并求 ω_n 与 ξ"],"steps":["第一步 动力学方程 `mẍ+cẋ+kx=f`","第二步 拉氏变换：`(ms^2+cs+k)X(s)=F(s)`","第三步 `G(s)=1/(ms^2+cs+k)`","第四步 化为标准形式 `G(s)=ω_n^2/(s^2+2ξω_n s+ω_n^2)`，对应得 `ω_n=√(k/m)`、`ξ=c/(2√(mk))`"],"result":"`G(s)=ω_n^2/(s^2+2ξω_n s+ω_n^2)`，其中 `ω_n=√(k/m)`，`ξ=c/(2√(mk))`","basis":"课件 p032（原文）"},{"id":"q-ctrl2b-9","kind":"计算","priority":1,"source":"课件题目","sourceDetail":"课件 p033（例2）","keyPoints":["旋转运动系统","传递函数"],"stem":"例2：求旋转运动的 J-c-k 系统的传递函数","given":["转动惯量 J、阻尼 c、扭转弹簧 k，输入转矩 M，输出转角 θ"],"ask":["求 G(s)=Θ(s)/M(s)"],"steps":["第一步 列写转动微分方程：`Jθ̈+cθ̇+kθ=M`","第二步 零初始条件下拉氏变换：`(Js^2+cs+k)Θ(s)=M(s)`","第三步 求传递函数"],"result":"`G(s)=Θ(s)/M(s)=1/(Js^2+cs+k)`","basis":"课件 p033（原文）"},{"id":"q-ctrl2b-10","kind":"计算","priority":1,"source":"课件题目","sourceDetail":"课件 p033（例3）","keyPoints":["L-R-C 电路","传递函数"],"stem":"例3：求 L-R-C 电路的传递函数","given":["电感 L 串联，负载为电阻 R 与电容 C 并联，输入电压 u_i，输出电压 u_o 取电容两端电压"],"ask":["求 G(s)=U_o(s)/U_i(s)"],"steps":["第一步 电路的信号流向：输入 u_i 经电感 L，L 后接 R 与 C 的并联负载，输出取电容两端 u_o","第二步 依电路阻抗关系列写方程，并进行拉氏变换（`Ls`、`R`、`1/(Cs)`）","第三步 消去中间变量并整理"],"result":"`G(s)=1/(LCs^2+(L/R)s+1)`","basis":"课件 p033（原文）"},{"id":"q-ctrl2b-11","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p037（例1）","keyPoints":["建模","局部传递函数框图","系统方框图"],"stem":"例1：图示阀控液压（位置控制）系统，列写微分方程、进行拉氏变换、建立局部传递函数框图与系统传递函数框图","given":["负载质量 m、阻尼 c、负载位移 y、油缸压力 p、阀芯位移 x、流量 q；参数 K_c、K_q、活塞面积 A"],"ask":["建立该系统各局部传递函数框图，并连接成系统传递函数方框图"],"steps":["第一步 列写微分方程：`mÿ+cẏ=Ap`；`q=Aẏ`；`p=(1/K_c)(K_q x-q)`","第二步 Laplace 变换：`(ms^2+cs)Y=AP`；`Q=AsY`；`P=(1/K_c)(K_qX-Q)`","第三步 局部传递函数框图：`P(s)→[A/(ms^2+cs)]→Y(s)`；`Y(s)→[As]→Q(s)`；`X(s)→[K_q]→⊕→[1/K_c]→P(s)`，其中 ⊕ 的反向输入为 −Q(s)","第四步 系统传递函数框图：`X(s)→[K_q]→⊕→[1/K_c]→P(s)→[A/(ms^2+cs)]→Y(s)`，由 Y(s) 经 [As] 反馈至相加点（负反馈）"],"result":"系统传递函数框图由上述局部环节按信号流向连接而成，其中 As 支路构成负反馈","basis":"课件 p037（原文）"},{"id":"q-ctrl2b-12","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p038~p039（例2）","keyPoints":["电动机建模","局部传递函数框图","系统方框图"],"stem":"例2：图示直流电动机系统，列写微分方程、进行拉氏变换、建立局部传递函数框图与系统传递函数框图","given":["电枢电感 L、电阻 R、电枢电流 i_a、反电动势 e_d；转动惯量 J、角速度 ω、负载力矩 M_L；输入电枢电压 u_a；参数 k_d、k_m"],"ask":["建立电动机系统各局部传递函数框图，并连接成系统传递函数方框图"],"steps":["第一步 列写微分方程：`L di_a/dt+i_aR+e_d=u_a`；`e_d=k_dω`；`J dω/dt=M-M_L`；`M=k_m i_a`","第二步 Laplace 变换：`(Ls+R)I_a+E_d=U_a`；`E_d=k_dΩ`；`JsΩ=M-M_L`；`M=k_mI_a`","第三步 局部传递函数框图：`U_a(s)` 与 `−E_d(s)` 经相加点 → `[1/(Ls+R)]` → `I_a(s)`；`Ω(s)→[k_d]→E_d(s)`；`M(s)` 与 `−M_L(s)` 经相加点 → `[1/(Js)]` → `Ω(s)`；`I_a(s)→[k_m]→M(s)`","第四步 系统传递函数框图：`U_a(s)→⊕→[1/(Ls+R)]→I_a(s)→[k_m]→M(s)→⊕→[1/(Js)]→Ω(s)`，其中前一个 ⊕ 减去 `E_d(s)`（由 Ω(s) 经 [k_d] 反馈），后一个 ⊕ 减去 `M_L(s)`"],"result":"系统传递函数框图由上述四个局部环节按信号流向连接而成，k_d 支路构成反电动势负反馈","basis":"课件 p038、p039（原文）"},{"id":"q-ctrl2c-1","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p047—p048（例1）","keyPoints":["方框图简化","相加点移动","嵌套回路化简"],"stem":"例1：求如图所示系统方框图的传递函数 `C(s)/R(s)`。","given":["方框图：`R(s)` 经相加点 → `G1(s)` → 相加点 → `G2(s)` → 相加点 → `G3(s)` → `C(s)`；其中 `H1(s)` 由 `G1(s)` 输出回引到第一个相加点（“−”）；`H2(s)` 由 `G2(s)` 输出侧交叉引到第二个相加点（“−”）；`H3(s)` 由 `G3(s)` 输出回引到第三个相加点（“−”）。"],"ask":["求闭环传递函数 `C(s)/R(s)`。"],"steps":["简化步骤：先消除交叉回路，对嵌套回路从里到外逐步化简。","第一步：移动相加点，把交叉的 `H2(s)` 反馈支路移到回路外侧，在 `G1(s)`、`G3(s)` 引出处分别串入 `1/G1(s)`、`1/G3(s)` 方框，使结构变为无交叉回路。","第二步：化简局部闭环，`G1(s)` 支路化为 `G1(s)/(1 + G1(s)H1(s))`，`G3(s)` 支路化为 `G3(s)/(1 + G3(s)H2(s))`。","第三步：合并后的主反馈支路为 `H2(s)/(G1(s)G3(s))`，再对整个嵌套回路从里到外逐步化简。","第四步：整理得到总传递函数。"],"result":"`G(s) = C(s)/R(s) = G1(s)G2(s)G3(s) / [1 + G1(s)H1(s) + G2(s)H2(s) + G3(s)H3(s) + G1(s)H1(s)G3(s)H3(s)]`","basis":"课件 p047—p048（原文）"},{"id":"q-ctrl2c-2","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p049—p051（例2）","keyPoints":["方框图简化","反馈回路分析","公共传递函数方框"],"stem":"例2：求如图所示系统的传递函数 `Xo/Xi`。","given":["方框图：`Xi` 经相加点 → 相加点 → `G1` → 相加点（与 `H2` 的“−”信号相加）→ `G2` → `G3` → `Xo`；`Xo` 经 `B(s)` 反馈到第一个相加点（“−”）；`H1` 由 `G2` 输出回引到第二个相加点（“+”）；`H2` 由输出侧反馈到 `G2` 前的相加点（“−”）。"],"ask":["求系统传递函数 `Xo/Xi`。"],"steps":["第一步：把 `H2` 反馈支路移到 `G1` 之前（相加点前移），所串方框变为 `H2/G1`，从而消除交叉回路。","第二步：化简 `G1`、`G2` 的局部闭环，得等效方框 `G1G2/(1 − G1G2H1)`。","第三步：对化简后的回路作反馈回路分析：只有**一条前向通道** `G1G2G3`；反馈回路 `L1: G1、G2、G3`（相加点“−”）、`L2: G1、G2、H1`（相加点“+”）、`L3: G2、G3、H2`（相加点“−”）；各反馈回路含**公共传递函数方框** `G2`，此时等效为 `G1G2G3/(1 − G1G2H1 + G2G3H2)`。","第四步：再与最外层主反馈回路（`B(s)`）按公式 `G_B(s) = 前向通道传递函数之积 / [1 + Σ(每一反馈回路开环传递函数)]` 化简。"],"result":"`Xo/Xi = G1G2G3 / (1 − G1G2H1 + G2G3H2 + G1G2G3)`","basis":"课件 p049—p051（原文）"},{"id":"q-ctrl2c-3","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p053（例3）","keyPoints":["方框图简化","前向通道之积","反馈回路求和"],"stem":"例3：求如图所示系统的传递函数 `G_B(s) = Xo/Xi`。","given":["方框图：`Xi` 经相加点 → `G1` → 相加点 → `G2` → `G3` → `G4` → 相加点 → `G5` → `Xo`；`H1` 由 `G4` 输出经相加点后回引（一路引到 `G1` 前的相加点“−”，一路引到 `G4` 后的相加点“+”）；`H2` 由 `G3` 输出反馈到 `G2` 后的相加点；另有一路 `H1` 由 `Xo` 反馈到输入端相加点（“−”）。"],"ask":["求系统传递函数 `G_B(s)`。"],"steps":["第一步：把 `G3`、`G4` 支路合并为等效方框 `(1 + G3G4)`。","第二步：`H2` 支路与 `G3` 串联，形成局部反馈 `H2G3`。","第三步：化简后只剩**一条前向通道** `G1G2G5(1 + G3G4)`，公共传递函数方框为 `G2`，按简化公式 `G_B(s) = 前向通道传递函数之积 / [1 + Σ(每一反馈回路开环传递函数)]` 写出结果。"],"result":"`G_B(s) = G1G2G5(1 + G3G4) / [1 + G1G2H1 + (1 + G3G4)G1G2G5 − G2G3H2]`","basis":"课件 p053（原文）"},{"id":"q-ctrl2c-4","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p056—p057（九、状态空间模型 例1）","keyPoints":["状态变量选取","状态方程","输出方程","状态空间表达式"],"stem":"例1 已知 RLC 电路，确定电路的状态变量和状态方程（并写出输出方程）。","given":["RLC 串联电路：输入为电压 `u`，元件为电阻 `R`、电感 `L`、电容 `C` 串联，电容两端电压为 `u_c`，回路电流为 `i`。"],"ask":["确定状态变量、状态方程与输出方程。"],"steps":["第一步：列微分方程模型 `L·di/dt + Ri + (1/C)∫i dt = u`。","第二步：选 `i` 和 `u_c` 为状态变量，取 `x1 = i = C·du_c/dt`，`x2 = u_c`；代入得 `L·ẋ1 + Rx1 + x2 = u`。","第三步：化为状态方程的一阶导形式：`ẋ1 = −(R/L)x1 − (1/L)x2 + (1/L)u`，`ẋ2 = (1/C)x1`。","第四步：写成矩阵形式 `[ẋ1; ẋ2]^T = [[−R/L, −1/L], [−1/C, 0]]·[x1; x2]^T + [1/L; 0]^T·u`，即 `Ẋ = AX + Bu`。","第五步：输出方程为 `y = x2`，其矩阵形式 `y = [0 1]·[x1; x2]^T`，即 `Y = C^T X`。"],"result":"状态方程 `Ẋ = AX + Bu`，其中 `A = [[−R/L, −1/L], [−1/C, 0]]`，`B = [1/L; 0]^T`；输出方程 `Y = C^T X`，其中 `C^T = [0 1]`。","basis":"课件 p056—p057（原文）"},{"id":"q-ctrl2c-5","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p060—p062（例1 倒立摆）","keyPoints":["Newton 第二定律","非线性方程线性化","小偏差法"],"stem":"例1 设有一个倒立摆。该倒立摆装在只能沿 x 方向移动的小车上，如图所示。图中 M 为小车质量，m 为摆的质量，l 为摆长。当小车受到外力 u(t) 作用时，如果摆的角位移 φ(t) 较小，试求以 φ(t) 为输出、u(t) 为输入的系统动力学方程。","given":["小车质量 `M`，摆质量 `m`，摆长 `l`；外力 `u(t)`，小车位移 `x(t)`，摆的角位移 `φ(t)`（较小）。"],"ask":["求以 `φ(t)` 为输出、`u(t)` 为输入的系统动力学方程。"],"steps":["第一步：当小车在外力 `u(t)` 作用下产生位移 `x(t)` 时，摆心位置为 `x(t) + l·sinφ(t)`。以整个系统为研究对象，根据 Newton 第二定律，水平方向上的动力学方程为 `u(t) = M·d²x/dt² + m·d²/dt²[x(t) + l·sinφ(t)]`。","第二步：以摆为研究对象，摆在垂直于摆杆方向上的动力学方程为 `mg·sinφ(t) = ml·d²φ/dt² + m·d²x/dt²·cosφ(t)`。","第三步：展开整理得非线性微分方程组：`u(t) = (M+m)ẍ + mlφ̈cosφ − mlφ̇²sinφ` 与 `mg·sinφ = mlφ̈ + mẍcosφ`。","第四步：当 `φ(t)` 较小时取 `sinφ(t) ≈ φ(t)`、`cosφ(t) ≈ 1`，并略去 `φ̇(t)` 的高次项，得线性运动微分方程组：`u(t) = (M+m)ẍ + mlφ̈` 与 `mgφ = mlφ̈ + mẍ`。","第五步：联立求解，消去 `ẍ`。"],"result":"`Mlφ̈(t) − (M+m)gφ(t) = −u(t)`","basis":"课件 p060—p062（原文）"},{"id":"q-ctrl2c-6","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p063—p064（例2）","keyPoints":["机械系统动力学分析","消去中间变量","机电系统建模"],"stem":"例2 求图所示机械系统的微分方程。图中 M 为输入转矩，Cm 为圆周阻尼，J 为转动惯量。","given":["圆盘（转动惯量 `J`、半径 `R`、圆周阻尼 `Cm`）经弹簧 `k` 与质量块 `m` 相连，质量块接阻尼器 `c`；输入为转矩 `M(t)`，圆盘转角为 `θ(t)`，质量块位移为 `x(t)`。"],"ask":["求系统的微分方程（输入 `M(t)`、输出 `θ(t)`）。"],"steps":["第一步：设系统输入为 `M(t)`，输出为 `θ(t)`，分别对圆盘和质块进行动力学分析，列出动力学方程。","第二步：圆盘 `M = Jθ̈ + Cmθ̇ + Rk(Rθ − x)`；质块 `k(Rθ − x) = mẍ + cẋ`。","第三步：消除中间变量 `x`，即可得到系统动力学方程。"],"result":"`mJθ⁽⁴⁾ + (mCm + cJ)θ⃛ + (R²km + Cmc + kJ)θ̈ + k(cR² + Cm)θ̇ = m·M̈ + c·Ṁ + kM`","basis":"课件 p063—p064（原文）"},{"id":"q-ctrl2c-7","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p065—p066（例3）","keyPoints":["折算转动惯量","动能不变原理","齿轮系运动方程"],"stem":"例3 一齿轮系如图所示。图中，z1，z2，z3 和 z4 分别为各齿轮的齿数；J1，J2 和 J3 表示各种传动轴上的转动惯量，θ1，θ2 和 θ3 为各轴的角位移；Mm 是电动机输出转矩。试列写折算到电动机轴上的齿轮系的运动方程。","given":["各齿轮齿数 `z1、z2、z3、z4`；各传动轴上的转动惯量 `J1、J2、J3`；各轴角位移 `θ1、θ2、θ3`；电动机输出转矩 `Mm`。"],"ask":["列写折算到电动机轴上的齿轮系的运动方程。"],"steps":["第一步：设将系统的转动惯量全部转化到输入轴上的等价转动惯量为 `J`，根据转化前后系统总动能不变原理，有 `(1/2)Jθ̇1² = (1/2)J1θ̇1² + (1/2)J2θ̇2² + (1/2)J3θ̇3²`。","第二步：由传动比关系 `θ̇2 = (z1/z2)θ̇1`，`θ̇3 = (z3/z4)θ̇2 = (z3/z4)(z1/z2)θ̇1 = (z3z1)/(z2z4)·θ̇1`。","第三步：代入动能关系，得 `J = J1 + J2(z1/z2)² + J3(z3z1/(z2z4))²`。","第四步：依动力学原理，有 `Mm = Jθ̈1 = [J1 + J2(z1/z2)² + J3(z3z1/(z2z4))²]·θ̈1`。"],"result":"`Mm = [J1 + J2(z1/z2)² + J3(z3z1/(z2z4))²]·θ̈1`","basis":"课件 p065—p066（原文）"}],"images":{"2":{"w":"img/control-ch2/p002.webp","j":"img/control-ch2/p002.jpg"},"3":{"w":"img/control-ch2/p003.webp","j":"img/control-ch2/p003.jpg"},"4":{"w":"img/control-ch2/p004.webp","j":"img/control-ch2/p004.jpg"},"5":{"w":"img/control-ch2/p005.webp","j":"img/control-ch2/p005.jpg"},"6":{"w":"img/control-ch2/p006.webp","j":"img/control-ch2/p006.jpg"},"7":{"w":"img/control-ch2/p007.webp","j":"img/control-ch2/p007.jpg"},"8":{"w":"img/control-ch2/p008.webp","j":"img/control-ch2/p008.jpg"},"9":{"w":"img/control-ch2/p009.webp","j":"img/control-ch2/p009.jpg"},"10":{"w":"img/control-ch2/p010.webp","j":"img/control-ch2/p010.jpg"},"11":{"w":"img/control-ch2/p011.webp","j":"img/control-ch2/p011.jpg"},"12":{"w":"img/control-ch2/p012.webp","j":"img/control-ch2/p012.jpg"},"13":{"w":"img/control-ch2/p013.webp","j":"img/control-ch2/p013.jpg"},"14":{"w":"img/control-ch2/p014.webp","j":"img/control-ch2/p014.jpg"},"15":{"w":"img/control-ch2/p015.webp","j":"img/control-ch2/p015.jpg"},"16":{"w":"img/control-ch2/p016.webp","j":"img/control-ch2/p016.jpg"},"17":{"w":"img/control-ch2/p017.webp","j":"img/control-ch2/p017.jpg"},"18":{"w":"img/control-ch2/p018.webp","j":"img/control-ch2/p018.jpg"},"19":{"w":"img/control-ch2/p019.webp","j":"img/control-ch2/p019.jpg"},"20":{"w":"img/control-ch2/p020.webp","j":"img ontrol-ch2/p051.webp","j":"img/control-ch2/p051.jpg"},"52":{"w":"img/control-ch2/p052.webp","j":"img/control-ch2/p052.jpg"},"53":{"w":"img/control-ch2/p053.webp","j":"img/control-ch2/p053.jpg"},"54":{"w":"img/control-ch2/p054.webp","j":"img/control-ch2/p054.jpg"},"55":{"w":"img/control-ch2/p055.webp","j":"img/control-ch2/p055.jpg"},"56":{"w":"img/control-ch2/p056.webp","j":"img/control-ch2/p056.jpg"},"57":{"w":"img/control-ch2/p057.webp","j":"img/control-ch2/p057.jpg"},"58":{"w":"img/control-ch2/p058.webp","j":"img/control-ch2/p058.jpg"},"59":{"w":"img/control-ch2/p059.webp","j":"img/control-ch2/p059.jpg"},"60":{"w":"img/control-ch2/p060.webp","j":"img/control-ch2/p060.jpg"},"61":{"w":"img/control-ch2/p061.webp","j":"img/control-ch2/p061.jpg"},"62":{"w":"img/control-ch2/p062.webp","j":"img/control-ch2/p062.jpg"},"63":{"w":"img/control-ch2/p063.webp","j":"img/control-ch2/p063.jpg"},"64":{"w":"img/control-ch2/p064.webp","j":"img/control-ch2/p064.jpg"},"65":{"w":"img/control-ch2/p065.webp","j":"img/control-ch2/p065.jpg"},"66":{"w":"img/control-ch2/p066.webp","j":"img/control-ch2/p066.jpg"}}},{"id":"control-ch3","name":"第三章 系统时域响应","subtitle":"时间响应 · 稳定性 · 稳态误差","status":"在读","overview":"在 s 域模型基础上看系统在时间上的行为。先讲时间响应及其组成、典型的输入信号；再逐个分析一阶系统、二阶系统的时间响应，给出二阶系统的瞬态性能指标（上升时间、峰值时间、最大超调量、调整时间）。随后简述高阶系统的时间响应，用误差传递函数做系统误差分析与计算，并说明单位脉冲响应函数在时间响应中的作用，最后附本章英文术语。","mindmap":{"label":"第三章 系统时域响应","children":[{"label":"一、时间响应及其组成","children":[{"label":"1.时间响应"},{"label":"2.时间响应的组成"},{"label":"3.系统特征根与自由响应的关系"}]},{"label":"二、典型的输入信号","children":[]},{"label":"三、一阶系统的时间响应","children":[{"label":"1.一阶系统单位脉冲响应"},{"label":"2.一阶系统单位阶跃响应"},{"label":"3.一阶系统单位斜坡响应"},{"label":"4.时间常数对时间响应的影响"},{"label":"5.一阶系统性能指标——调整时间t_s"}]},{"label":"四、二阶系统的时间响应","children":[{"label":"1.二阶系统的单位脉冲响应"},{"label":"2.二阶系统的单位阶跃响应"}]},{"label":"五、二阶系统的性能指标","children":[{"label":"1.上升时间t_r"},{"label":"2.峰值时间t_p"},{"label":"3.最大超调量M_p"}]},{"label":"二阶系统瞬态性能指标与例题","children":[{"label":"调整时间 ts"},{"label":"振荡次数 N"},{"label":"Mp、ts 与 ξ、ωn 的关系"},{"label":"例1 求瞬态性能指标"},{"label":"例2 机械系统参数辨识"},{"label":"例3 位置随动系统微分负反馈"}]},{"label":"六、高阶系统的时间响应","children":[{"label":"传递函数分解与响应叠加"},{"label":"主导极点"}]},{"label":"七、系统误差分析与计算","children":[{"label":"误差与偏差"},{"label":"稳态误差与稳态偏差"},{"label":"与输入有关的稳态偏差"},{"label":"系统的型次（0/I/II 型）"},{"label":"0、I、II 型系统稳态偏差表"},{"label":"干扰作用下的偏差和误差"},{"label":"稳态偏差分析结论"},{"label":"例1 两系统稳态误差"},{"label":"例2 速度控制系统"}]},{"label":"八、单位脉冲响应函数在时间响应中的作用","children":[]},{"label":"本章英文术语","children":[{"label":"Canonical form / Diagonal / Jordan canonical form"},{"label":"Input feedforward canonical form / Matrix exponential function / Output equation"},{"label":"Phase variable canonical form / Phase variables / Physical variables / State differential equation"},{"label":"State of a system / State-space representation / State variables / State vector / Time domain"},{"label":"Time-varying system / Transition matrix φ(t)"}]}]},"points":[{"id":"p-ctrl3a-1","title":"时间响应的定义与研究目的","key":true,"source":"课件 p002","items":["**时间响应**：系统的响应（输出）在时域上的表现形式，即系统微分方程在一定初始条件下的解。","系统在外界（输入或扰动）的作用下，从一定的**初始状态**出发，所经历的由其固有特性所决定的**动态历程**。","研究时间响应的**目的**在于分析系统的**稳定性、响应的快速性与响应的准确性**等系统的动态性能。"]},{"id":"p-ctrl3a-2","title":"时间响应的组成：零状态响应与零输入响应","key":true,"source":"课件 p003","items":["以 `y''+7y'+12y=6r'+12r` 为例，在初始条件 `r(0_-),y(0_-),y'(0_-)` 下，对微分方程两边取 Laplace 变换求解。","解可写成 `Y(s)=6(s+2)/(s^2+7s+12)·R(s)+[(s+7)y(0_-)+y'(0_-)-6r(0_-)]/(s^2+7s+12)`。","**零状态响应**：零初始状态下，完全由输入所引起的响应。","**零输入响应**：系统无输入（输入为零），完全由初始状态所决定的响应。"]},{"id":"p-ctrl3a-3","title":"零状态、零输入、强迫、自由四种响应","key":true,"source":"课件 p004","items":["零状态响应项：`B(t)+Σ A_{1i}e^{s_i t}`；零输入响应项：`Σ A_{2i}e^{s_i t}`。","系统总响应 `y(t)=B(t)+Σ A_{1i}e^{s_i t}+Σ A_{2i}e^{s_i t}`。","取 `r(t)=u(t), r(0_-)=0, y(0_-)=1, y'(0_-)=1` 时，`y(t)=u(t)+7e^{-3t}-7e^{-4t}`。","其中 `1+2e^{-3t}-3e^{-4t}` 为零状态响应，`5e^{-3t}-4e^{-4t}` 为零输入响应；`u(t)` 为强迫响应，`7e^{-3t}-7e^{-4t}` 为自由响应。","`-3、-4` 是系统传递函数的极点（特征根）。"]},{"id":"p-ctrl3a-4","title":"n阶系统时间响应的一般形式与零状态约定","source":"课件 p005","items":["n阶系统微分方程：`a_n y^{(n)}+a_{n-1}y^{(n-1)}+...+a_1 y'+a_0 y=b_m x^{(m)}+b_{m-1}x^{(m-1)}+...+b_1 x'+b_0 x`。","零状态响应项：`B(t)+Σ_{i=1}^{n} A_{1i}e^{s_i t}`；零输入响应项：`Σ_{i=1}^{n} A_{2i}e^{s_i t}`。","总响应 `y(t)=B(t)+Σ_{i=1}^{n} A_{1i}e^{s_i t}+Σ_{i=1}^{n} A_{2i}e^{s_i t}`。","若无特殊说明，通常所述时间响应仅指**零状态响应**（即不考虑初始条件，或初始条件为零状态）。"],"key":true},{"id":"p-ctrl3a-5","title":"系统特征根与自由响应的关系","source":"课件 p006","items":["自由响应由特征根 `s_i` 决定：`y(t)=Σ_{i=1}^{n} A_{1i}e^{s_i t}+Σ_{i=1}^{n} A_{2i}e^{s_i t}`。","`e^{s_i t}=e^{Re[s_i]t}·e^{jIm[s_i]t}`，共轭根合并 `e^{s_i t}+e^{s_i^* t}=2cos(Im[s_i]t)·e^{Re[s_i]t}`。","特征根在 `[s]` 平面上的位置（左半平面、右半平面、虚轴）分别对应自由响应衰减收敛、发散、等幅振荡。"],"key":true},{"id":"p-ctrl3a-6","title":"特征根实部与虚部对自由响应的影响","key":true,"source":"课件 p007","items":["特征根实部 `Re[s_i]` 的正负决定自由响应的收敛性。","`Re[s_i]<0`，自由响应收敛，绝对值越大收敛越快。","`Re[s_i]>0`，自由响应发散，绝对值越大发散越快。","特征根虚部 `Im[s_i]` 的大小决定自由响应的**振荡频率**。"]},{"id":"p-ctrl3a-7","title":"特征根分布与系统稳定性","source":"课件 p008","items":["若所有特征根具有负实部：自由响应收敛，系统稳定。","此时自由响应称为**瞬态响应**，强迫响应称为**稳态响应**。","若存在特征根实部大于零：自由响应发散，系统不稳定。","若有一对特征根实部为零、其余特征根实部均小于零：系统自由响应最终为等幅振荡，系统**临界稳定**。"],"key":true},{"id":"p-ctrl3a-8","title":"结论：系统稳定性判据（特征根分布）","key":true,"source":"课件 p009","items":["所有特征根实部均为负值（所有极点均位于 `[s]` 平面左半平面）→ 系统自由响应收敛，系统稳定。","存在特征根有正实部（`[s]` 平面右半平面存在极点）→ 系统自由响应发散，系统不稳定。","存在一对特征根实部为零、其余特征根实部均为负（`[s]` 平面虚轴上存在一对极点，其余极点位于左半平面）→ 系统自由响应最终为等幅振荡，系统临界稳定。","特征根虚部 `Im[s_i]` 的大小决定自由响应的振荡频率。"]},{"id":"p-ctrl3a-9","title":"结论：时间响应的分类与性能含义","key":true,"source":"课件 p010","items":["时间响应是指系统的输出在时域的表现形式，或系统的动力学方程在一定初始条件下的解。","按响应来源分：零状态响应（系统初始状态为零时由输入引起）与零输入响应（系统输入为零时由初始状态引起）。","按响应性质（振动性质）分：自由响应（由系统输入和初始状态引起、由系统特征根决定）与强迫响应（由系统输入引起、与输入频率相同）。","对稳定系统，时间响应可分为瞬态响应和稳态响应：自由响应又称瞬态响应，强迫响应又称稳态响应。","瞬态响应反映**稳定性和快速性**，稳态响应反映**准确性**。"]},{"id":"p-ctrl3a-10","title":"典型的输入信号及其拉氏变换","key":true,"source":"课件 p011","items":["单位脉冲：`x_i(t)=δ(t)`，`X_i(s)=1`。","单位阶跃：`x_i(t)=u(t)=1`，`X_i(s)=1/s`。","单位斜坡：`x_i(t)=r(t)=t`，`X_i(s)=1/s^2`。","抛物线：`x_i(t)=t^2/2`，`X_i(s)=1/s^3`。","正弦：`x_i(t)=sinωt`，`X_i(s)=ω/(s^2+ω^2)`。"]},{"id":"p-ctrl3a-11","title":"一阶系统的数学模型与单位脉冲响应","key":true,"source":"课件 p012","items":["微分方程 `T·dx_o(t)/dt+x_o(t)=x_i(t)`，传递函数 `G(s)=1/(Ts+1)`，`T` 为时间常数。","单位脉冲响应：`X_o(s)=G(s)X_i(s)=1/(Ts+1)`，`w(t)=L^{-1}[1/(Ts+1)]=(1/T)e^{-t/T}`。","脉冲响应在 `t=0` 处为 `1/T`，在 `t=T` 处衰减到 `0.368/T`。","瞬态响应 `(1/T)e^{-t/T}`，稳态响应 `0`。"]},{"id":"p-ctrl3a-12","title":"一阶系统单位阶跃响应","key":true,"source":"课件 p013","items":["输入 `x_i(t)=u(t)=1`，`X_i(s)=1/s`。","`X_o(s)=G(s)X_i(s)=1/(Ts+1)·1/s`，`x_o(t)=1-e^{-t/T}`。","曲线在 `t=0` 处切线斜率为 `1/T`，在 `t=T` 处达到稳态值的 `0.632`。","瞬态响应 `-e^{-t/T}`，稳态响应 `1`。"]},{"id":"p-ctrl3a-13","title":"一阶系统单位斜坡响应","source":"课件 p014","items":["输入 `x_i(t)=r(t)=t`，`X_i(s)=1/s^2`。","`X_o(s)=G(s)·1/s^2`，`x_o(t)=L^{-1}[1/s^2-T/s+T/(s+1/T)]=t-T+Te^{-t/T}`（`t≥0`）。","输出与输入之间存在 `T` 的稳态误差。","瞬态响应 `Te^{-t/T}`，稳态响应 `t-T`。"],"key":true},{"id":"p-ctrl3a-14","title":"结论：输入导数关系与一阶系统响应对照","source":"课件 p015","items":["如果输入函数等于某个函数的导数，则该输入函数所引起的输出等于这个函数所引起的输出的导函数。","对照表：输入 `δ(t)` → 输出 `(1/T)e^{-t/T}`；输入 `1` → 输出 `1-e^{-t/T}`；输入 `t` → 输出 `t-T+Te^{-t/T}`。","例：已知 `x_i(t)=t`、`x_{or}(t)=t-0.85(1-e^{-t/0.85})`，则 `w(t)=x_{or}''(t)=1/0.85·e^{-t/0.85}`。"],"key":true},{"id":"p-ctrl3a-15","title":"时间常数对时间响应的影响","source":"课件 p016","items":["分别给出 `T=1、2、4` 时的单位脉冲响应、单位阶跃响应、单位斜坡响应曲线。","时间常数 `T` 越小，系统惯性越小，系统响应越快。","时间常数 `T` 越大，系统惯性越大，系统响应越慢。"],"key":true},{"id":"p-ctrl3a-16","title":"一阶系统性能指标——调整时间","key":true,"source":"课件 p017","items":["调整时间 `t_s`：单位阶跃输入作用下，其响应与稳态值相差等于容许误差所需要的时间。","设相对容许误差 `Δ`，由 `x_{ou}(t_s)=1-e^{-t_s/T}` 得 `1-(1-e^{-t_s/T})=Δ`，即 `e^{-t_s/T}=Δ`，故 `t_s=-T·lnΔ`。","`Δ=2%` 时 `t_s=4T`；`Δ=5%` 时 `t_s=3T`。","`Δ` 越小精度要求越高、调整时间 `t_s` 越长；`T` 越大系统惯性越大、调整时间 `t_s` 越长。","调整时间反映系统响应的**快速性**。"]},{"id":"p-ctrl3a-17","title":"二阶系统的传递函数、特征方程与四种阻尼","key":true,"source":"课件 p018","items":["传递函数 `G(s)=X_o(s)/X_i(s)=ω_n^2/(s^2+2ξω_n s+ω_n^2)`，`ω_n` 为无阻尼固有频率，`ξ` 为阻尼比。","特征方程 `s^2+2ξω_n s+ω_n^2=0`，特征根 `s_{1,2}=-ξω_n±ω_n√(ξ^2-1)`。","`0<ξ<1` 欠阻尼系统；`ξ=0` 无阻尼系统；`ξ=1` 临界阻尼系统；`ξ>1` 过阻尼系统。"]},{"id":"p-ctrl3a-18","title":"二阶系统的单位脉冲响应（0<ξ<1）","key":true,"source":"课件 p019","items":["`w(t)=L^{-1}[G(s)]=L^{-1}[ω_n^2/((s+ξω_n)^2+(ω_n√(1-ξ^2))^2)]`。","`w(t)=ω_n/√(1-ξ^2)·e^{-ξω_n t}·sin ω_d t`。","`ω_d=ω_n√(1-ξ^2)` 为**有阻尼固有频率**。","响应为角频率等于有阻尼固有频率的**减幅振荡**。"]},{"id":"p-ctrl3a-19","title":"二阶系统的单位脉冲响应（ξ=0、1、>1）","source":"课件 p020","items":["`ξ=0`：`w(t)=ω_n sin ω_n t`，角频率为无阻尼固有频率的**等幅振荡**。","`ξ=1`：`w(t)=ω_n^2·t·e^{-ω_n t}`，**无振荡**，先上升后急速衰减。","`ξ>1`：`w(t)=ω_n/(2√(ξ^2-1))·[e^{-(ξ-√(ξ^2-1))ω_n t}-e^{-(ξ+√(ξ^2-1))ω_n t}]`，**无振荡**。"],"key":true},{"id":"p-ctrl3a-20","title":"二阶系统的单位阶跃响应（0<ξ<1）","key":true,"source":"课件 p021","items":["输入 `x_i(t)=u(t)`，`L[u(t)]=1/s`，`X_o(s)=G(s)·1/s=1/s-(s+2ξω_n)/[(s+ξω_n+jω_d)(s+ξω_n-jω_d)]`。","`x_o(t)=1-e^{-ξω_n t}(cos ω_d t+ξ/√(1-ξ^2)·sin ω_d t)`。","也可写为 `x_o(t)=1-e^{-ξω_n t}/√(1-ξ^2)·sin(ω_d t+arctan(√(1-ξ^2)/ξ))`。","响应为角频率等于有阻尼固有频率的**减幅振荡**。"]},{"id":"p-ctrl3a-21","title":"二阶系统的单位阶跃响应（ξ=0、1、>1）","source":"课件 p022","items":["`ξ=0`：`X_o(s)=1/s-s/(s^2+ω_n^2)`，`x_o(t)=1-cos ω_n t`，角频率为无阻尼固有频率的**等幅振荡**。","`ξ=1`：`x_o(t)=1-(1+ω_n t)e^{-ω_n t}`，**无振荡**。","`ξ>1`：`x_{ou}(t)=1+ω_n/(2√(ξ^2-1))·{exp[-(ξ+√(ξ^2-1))ω_n t]/((ξ+√(ξ^2-1))ω_n)-exp[-(ξ-√(ξ^2-1))ω_n t]/((ξ-√(ξ^2-1))ω_n)}`（`t≥0`），**无振荡**。"],"key":true},{"id":"p-ctrl3a-22","title":"二阶响应随阻尼比变化的规律","key":true,"source":"课件 p023","items":["`0<ξ<1` 时，`ξ` 越小，振荡衰减越慢，振荡越剧烈。","`ξ=0` 时，振荡无衰减，为等幅振荡。","`ξ=1` 时，无振荡；`ξ>1` 时，无振荡。"]},{"id":"p-ctrl3a-23","title":"二阶系统的性能指标与上升时间","key":true,"source":"课件 p024","items":["二阶欠阻尼系统单位阶跃响应 `x_o(t)=1-e^{-ξω_n t}/√(1-ξ^2)·sin(ω_d t+arctan(√(1-ξ^2)/ξ))`。","性能指标包括：上升时间 `t_r`、峰值时间 `t_p`、最大超调量 `M_p`、调整时间 `t_s`、振荡次数 `N`。","上升时间 `t_r`：由 `sin(ω_d t_r+arctan(√(1-ξ^2)/ξ))=0` 得 `t_r=[π-arctan(√(1-ξ^2)/ξ)]/ω_d`。","`ξ` 一定增大 `ω_n`，或 `ω_n` 一定减小 `ξ`，上升时间减小。"]},{"id":"p-ctrl3a-24","title":"峰值时间与最大超调量","key":true,"source":"课件 p025","items":["峰值时间 `t_p`：由 `dx_{ou}(t)/dt|_{t=t_p}=0` 得 `sin(ω_d t_p)=0`，`ω_d t_p=π`，故 `t_p=π/ω_d`，峰值时间为振荡周期之半。","`ξ` 一定增大 `ω_n`，或 `ω_n` 一定减小 `ξ`，峰值时间减小。","最大超调量 `M_p=[x_o(t_p)-x_o(∞)]/x_o(∞)×100%=e^{-ξπ/√(1-ξ^2)}×100%`。","`M_p` 只与 `ξ` 有关，与 `ω_n` 无关；增大 `ξ`，最大超调量减小。"]},{"id":"p-ctrl3b-1","title":"调整时间 ts","key":true,"source":"课件 p026","items":["调整时间定义：`|x_o(t)-1|≤Δ   (t≥t_s)`，即响应曲线进入并保持在稳态值 ±Δ 误差带内所需的时间","误差带 `Δ=2%` 或 `5%`","精确式：`t_s ≥ (1/(ξω_n))ln(1/(Δ√(1-ξ^2)))`","当 `0<ξ<0.7` 时的近似式：`t_s≈4/(ξω_n)`（Δ=2%）；`t_s≈3/(ξω_n)`（Δ=5%）","Δ、ωn 一定，增大 ξ，t_s 减小","Δ、ξ 一定，增大 ωn，t_s 减小"]},{"id":"p-ctrl3b-2","title":"振荡次数 N","key":false,"source":"课件 p026","items":["振荡次数定义：`N=t_s/T=t_s/(2π/ω_d)`","其中 T 为阻尼振荡周期，`ω_d` 为阻尼振荡角频率"]},{"id":"p-ctrl3b-3","title":"Mp、ts 与 ξ、ωn 的关系（讨论）","key":true,"source":"课件 p027","items":["`M_p=e^{-ξπ/√(1-ξ^2)}×100%`：ξ 大，则 Mp 小","`t_s≥(1/(ξω_n))ln(1/(Δ√(1-ξ^2)))`：ξ≈0.7 时 t_s 较小；ωn 大，则 t_s 小","要使二阶系统动态特性好，选择**合适的** ωn 和 ξ（≈0.7）","通常根据允许的超调量 Mp 来选择阻尼比 ξ"]},{"id":"p-ctrl3b-4","title":"六、高阶系统的时间响应","key":true,"source":"课件 p031","items":["一般形式 `G(s)=(b_m s^m+b_{m-1}s^{m-1}+…+b_0)/(a_n s^n+a_{n-1}s^{n-1}+…+a_0)` 可化为零极点形式 `G(s)=K∏(s+z_i)/[∏(s+p_j)∏(s^2+2ξ_kω_nk s+ω_nk^2)]`","单位阶跃作用下 `X_o(s)=G(s)·1/s`，展开为 `X_o(s)=A_0/s+ΣA_j/(s+p_j)+Σ(B_k s+C_k)/(s^2+2ξ_kω_nk s+ω_nk^2)`","时间响应 `x_o(t)=A_0+ΣA_j e^{-p_j t}+ΣD_k e^{-ξ_kω_nk t}sin(ω_dk t+β_k)`","高阶系统的响应 = **多个一阶环节响应和二阶环节响应的叠加**"]},{"id":"p-ctrl3b-5","title":"主导极点","key":true,"source":"课件 p032","items":["稳定系统中，**离虚轴越远的极点对应的自由响应衰减越快**","记离虚轴最近的极点 `s_n=α_n+jβ_n`，其它极点 `s_i=α_i+jβ_i`","若 `|α_i|≥5|α_n|`，则 s_n 称为**主导极点**","系统的响应特性主要由主导极点决定","高阶系统可近似为由主导极点所对应的**低阶系统**"]},{"id":"p-ctrl3b-6","title":"七、系统误差分析与计算（一）：误差与偏差","key":true,"source":"课件 p033","items":["**误差 e**：`e(t)=x_or(t)-x_o(t)`，定义在**输出端**；x_or 为理想输出，x_o 为实际输出","**偏差 ε**：`ε(t)=x_i(t)-b(t)`，定义在**输入端**","拉氏式：`E_1(s)=X_or(s)-X_o(s)`，`E(s)=X_i(s)-B(s)`","当 `X_or(s)=X_o(s)` 时 `E(s)=0`；而 `E(s)=X_i(s)-X_o(s)H(s)=0` 给出 `X_or(s)=(1/H(s))X_i(s)`","`E_1(s)=X_or(s)-X_o(s)=(1/H(s))[X_i(s)-H(s)X_o(s)]=(1/H(s))E(s)`","**只有单位反馈系统，偏差才等于误差**；当 H(s)=1 时 `E(s)=E_1(s)`"]},{"id":"p-ctrl3b-7","title":"稳态误差与稳态偏差","key":true,"source":"课件 p034","items":["稳态误差：`e_ss=lim_{t→∞}e(t)=lim_{s→0}sE_1(s)`","稳态偏差：`ε_ss=lim_{t→∞}ε(t)=lim_{s→0}sE(s)`","由 `E(s)=X_i(s)-H(s)X_o(s)=X_i(s)-H(s)G(s)E(s)` 得 `E(s)=X_i(s)/(1+G(s)H(s))`","`ε_ss=lim_{s→0}sE(s)=lim_{s→0}(sX_i(s))/(1+G(s)H(s))`"]},{"id":"p-ctrl3b-8","title":"与输入有关的稳态偏差","key":true,"source":"课件 p035","items":["**1. 单位阶跃输入** `X_i(s)=1/s`：`ε_ss=lim_{s→0}sX_i(s)/(1+G(s)H(s))=lim_{s→0}1/(1+G(s)H(s))=1/(1+K_p)`，K_p 为**位置无偏系数**","**2. 单位斜坡信号输入** `X_i(s)=1/s^2`：`ε_ss=lim_{s→0}1/(s+sG(s)H(s))=lim_{s→0}1/(sG(s)H(s))=1/K_v`，K_v 为**速度无偏系数**","**3. 单位加速度信号输入** `X_i(s)=1/s^3`：`ε_ss=lim_{s→0}1/(s^2+s^2G(s)H(s))=lim_{s→0}1/(s^2G(s)H(s))=1/K_a`，K_a 为**加速度无偏系数**"]},{"id":"p-ctrl3b-9","title":"系统的型次","key":true,"source":"课件 p036","items":["`ε_ss=lim_{t→∞}ε(t)=lim_{s→0}sE(s)=lim_{s→0}(s/(1+G(s)H(s)))X_i(s)`","设系统开环传递函数 `G(s)H(s)=K∏(T_i s+1)/[s^ν∏(T_j s+1)]`","则 ν=0、1、2 时，分别称为 **0型、I 型、II 型系统**","ν=0 无积分环节；ν=1 一个积分环节；ν=2 两个积分环节","K 为**开环增益**"]},{"id":"p-ctrl3b-10","title":"不同输入下 0、I、II 型系统的稳态偏差表","key":true,"source":"课件 p037","items":["0型：单位阶跃 `1/(1+K)`；单位速度 `∞`；单位加速度 `∞`","I型：单位阶跃 `0`；单位速度 `1/K`；单位加速度 `∞`","II型：单位阶跃 `0`；单位速度 `0`；单位加速度 `1/K`","（表的列分别对应 `lim_{s→0}1/(1+G(s)H(s))`、`lim_{s→0}1/(sG(s)H(s))`、`lim_{s→0}1/(s^2G(s)H(s))`）","**系统型次越高，稳态偏差越小**","**开环增益越大，稳态偏差越小**"]},{"id":"p-ctrl3b-11","title":"干扰作用下的偏差和误差","key":true,"source":"课件 p038","items":["`X_o(s)=G_1(s)G_2(s)/(1+G_1(s)G_2(s)H(s))X_i(s)+G_2(s)/(1+G_1(s)G_2(s)H(s))N(s)=G_Xi(s)X_i(s)+G_N(s)N(s)`","**增加 G1 增益，抗干扰**","`E_1(s)=X_or(s)-X_o(s)=(1/H(s))X_i(s)-[G_Xi(s)X_i(s)+G_N(s)N(s)]=[1/H(s)-G_Xi(s)]X_i(s)+[-G_N(s)]N(s)`","`E_1(s)=(1/H(s))E(s)`"]},{"id":"p-ctrl3b-12","title":"稳态偏差分析结论","key":true,"source":"课件 p039","items":["稳态偏差 ε(t) 与**输入信号 x_i(t)** 有关","稳态偏差 ε(t) 与**系统型次 ν** 有关；型次 ν 越高，稳态偏差 ε(t) 越小","稳态偏差 ε(t) 与**系统开环增益 K** 有关；开环增益 K 越大，稳态偏差 ε(t) 越小","多输入作用或有干扰作用时，**按叠加原理计算**","单位反馈系统的稳态误差 e(t) 与稳态偏差 ε(t) **相同**（单位反馈系统 H(s)=1）"]},{"id":"p-ctrl3b-13","title":"八、单位脉冲响应函数在时间响应中的作用","key":true,"source":"课件 p040","items":["`δ(t) → w(t)`，`k·δ(t-τ) → k·w(t-τ)`","把输入分成脉冲之和：`x_i(τ)·Δτ·δ(t-τ) → x_i(τ)·Δτ·w(t-τ)`","`x_o(t)=Σ_{τ=0}^{t-Δτ}x_i(τ)·Δτ·w(t-τ)`；当 `Δτ→0` 时 `x_o(t)=∫_0^t x_i(τ)w(t-τ)dτ`","即 `x_o(t)=x_i(t)*w(t)`（**卷积**）","时域：`x_i(t) →[w(t) 或 g(t)]→ x_o(t)=x_i(t)*w(t)`；复域：`X_i(s) →[W(s) 或 G(s)]→ X_o(s)=X_i(s)·G(s)`"]},{"id":"p-ctrl3b-14","title":"本章英文术语（一）","key":false,"source":"课件 p045","items":["**Canonical form（标准型）**：状态变量模型表示的一种基本形式，包括相位变量标准型、输入前馈标准型、对角标准型、约当标准型","**Diagonal canonical form（对角标准型）**：将 n 个互异系统极点显示在状态变量表示 A 矩阵对角线上的解耦标准型","**Fundamental matrix（基本矩阵）**：见 Transition matrix（转移矩阵）","**Jordan canonical form（约当标准型）**：适用于不具有互异系统极点的系统的块对角标准型"]},{"id":"p-ctrl3b-15","title":"本章英文术语（二）","key":false,"source":"课件 p046","items":["**Input feedforward canonical form（输入前馈标准型）**：由 n 个反馈回路（含传递函数 n 阶分母多项式系数 a_n）和输入信号前馈得到的回路所描述的标准型","**Matrix exponential function（矩阵指数函数）**：`e^{At}=I+At+(At)^2/2!+…+(At)^k/k!+…`，在线性常系数微分方程求解中有重要作用","**Output equation（输出方程）**：通过 `y=Cx+Du` 联系状态向量 x、输入 u 与输出 y 的代数方程"]},{"id":"p-ctrl3b-16","title":"本章英文术语（三）","key":false,"source":"课件 p047","items":["**Phase variable canonical form（相位变量标准型）**：由 n 个反馈回路（含 n 阶分母多项式系数 a_n）和 m 个前馈回路（含 m 阶分子多项式系数 b_m）描述的标准型","**Phase variables（相位变量）**：与相位变量标准型相联系的状态变量","**Physical variables（物理变量）**：代表系统物理变量的状态变量","**State differential equation（状态微分方程）**：状态向量的微分方程 `ẋ=Ax+Bu`"]},{"id":"p-ctrl3b-17","title":"本章英文术语（四）","key":false,"source":"课件 p048","items":["**State of a system（系统状态）**：一组数，已知这组数与输入函数，结合描述动力学的方程，即可提供系统的未来状态","**State-space representation（状态空间表示）**：由状态微分方程 `ẋ=Ax+Bu` 与输出方程 `y=Cx+Du` 构成的时域模型","**State variables（状态变量）**：描述系统的一组变量","**State vector（状态向量）**：包含全部 n 个状态变量的向量 `x_1,x_2,…,x_n`","**Time domain（时域）**：包含时间响应、以时间 t 描述系统的数学域"]},{"id":"p-ctrl3b-18","title":"本章英文术语（五）","key":false,"source":"课件 p049","items":["**Time-varying system（时变系统）**：一个或多个参数随时间变化的系统","**Transition matrix φ(t)（转移矩阵）**：描述系统无强制（自由）响应的矩阵指数函数"]}],"questions":[{"id":"q-ctrl3a-1","kind":"例题","priority":1,"source":"课件 p003","sourceDetail":"课件 p003（例题）","keyPoints":["时间响应的组成","零状态响应","零输入响应"],"stem":"求 `y''+7y'+12y=6r'+12r`（其中 `r(t), y(t)` 分别为系统的输入和输出）在 `r(0_-), y(0_-), y'(0_-)` 时的解。","given":["系统微分方程 `y''+7y'+12y=6r'+12r`，初始条件为 `r(0_-), y(0_-), y'(0_-)`。"],"ask":["求系统输出 `y(t)`，并将其分解为零状态响应与零输入响应。"],"steps":["在初始条件下对微分方程两边分别进行 Laplace 变换：`[s^2Y(s)-sy(0_-)-y'(0_-)]+7[sY(s)-y(0_-)]+12Y(s)=6[sR(s)-r(0_-)]+12R(s)`。","整理求解 `Y(s)`：`Y(s)=6(s+2)/(s^2+7s+12)·R(s)+[(s+7)y(0_-)+y'(0_-)-6r(0_-)]/(s^2+7s+12)`。","取拉氏逆变换：`y(t)=L^{-1}[G(s)R(s)]+L^{-1}{[(s+7)y(0_-)+y'(0_-)-6r(0_-)]/(s^2+7s+12)}`。","第一项为零状态响应（零初始状态下完全由输入引起），第二项为零输入响应（系统无输入、完全由初始状态决定）。"],"result":"`y(t)=L^{-1}[G(s)R(s)]+L^{-1}{[(s+7)y(0_-)+y'(0_-)-6r(0_-)]/(s^2+7s+12)}`，即零状态响应与零输入响应之和。","basis":"课件 p003（原文）"},{"id":"q-ctrl3a-2","kind":"例题","priority":1,"source":"课件 p004","sourceDetail":"课件 p004（例题）","keyPoints":["零状态响应","零输入响应","强迫响应","自由响应"],"stem":"承上题，若 `r(t)=u(t), r(0_-)=0, y(0_-)=1, y'(0_-)=1`，求系统输出 `y(t)`。","given":["`y''+7y'+12y=6r'+12r`；`r(t)=u(t), r(0_-)=0, y(0_-)=1, y'(0_-)=1`，此时 `R(s)=1/s`。"],"ask":["求 `y(t)`，并指出零状态响应、零输入响应以及强迫响应、自由响应。"],"steps":["代入初始条件：`y(t)=L^{-1}[6(s+2)/(s^2+7s+12)·1/s]+L^{-1}[(s+7)+1]/(s^2+7s+12)`。","部分分式展开：`=L^{-1}[1/s+2/(s+3)-3/(s+4)]+L^{-1}[5/(s+3)-4/(s+4)]`。","取逆变换：`=(1+2e^{-3t}-3e^{-4t})+(5e^{-3t}-4e^{-4t})`。","合并同类项得 `y(t)=u(t)+7e^{-3t}-7e^{-4t}`。"],"result":"`y(t)=u(t)+7e^{-3t}-7e^{-4t}`；其中 `1+2e^{-3t}-3e^{-4t}` 为零状态响应，`5e^{-3t}-4e^{-4t}` 为零输入响应；`u(t)` 为强迫响应，`7e^{-3t}-7e^{-4t}` 为自由响应。`-3、-4` 是系统传递函数的极点（特征根）。","basis":"课件 p004（原文）"},{"id":"q-ctrl3a-3","kind":"例题","priority":1,"source":"课件 p015","sourceDetail":"课件 p015（例题）","keyPoints":["输入导数关系","脉冲响应函数"],"stem":"已知 `x_i(t)=t`，`x_{or}(t)=t-0.85(1-e^{-t/0.85})`，求其脉冲响应函数。","given":["一阶系统输入 `x_i(t)=t`（单位斜坡输入），其单位斜坡响应 `x_{or}(t)=t-0.85(1-e^{-t/0.85})`。"],"ask":["求该系统的脉冲响应函数 `w(t)`。"],"steps":["依据结论1：输入函数等于某个函数的导数时，该输入引起的输出等于该函数所引起的输出的导函数；此处 `δ(t)=t''`。","`w(t)=x_{or}''(t)=[t-0.85(1-e^{-t/0.85})]''=(1-e^{-t/0.85})'`。","求导得 `w(t)=1/0.85·e^{-t/0.85}`。"],"result":"`w(t)=(1/0.85)e^{-t/0.85}`。","basis":"课件 p015（原文）"},{"id":"q-ctrl3b-1","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p028（例题1）","keyPoints":["二阶系统瞬态性能指标","上升时间","峰值时间","超调量","调整时间","振荡次数"],"stem":"例1 如图所示系统中，ξ=0.6，ωn=5/sec，求其瞬态性能指标。","given":["系统传递函数 `G(s)=ω_n^2/(s^2+2ξω_n s+ω_n^2)`；ξ=0.6，ωn=5/sec，故 `ω_d=ω_n√(1-ξ^2)=4/sec`"],"ask":["求瞬态性能指标：上升时间 tr、峰值时间 tp、超调量 Mp、调整时间 ts、振荡次数 N"],"steps":["① 上升时间：`t_r=(π-tg^{-1}(√(1-ξ^2)/ξ))/ω_d`=0.55 sec","② 峰值时间：`t_p=π/ω_d`=0.785 sec","③ 超调量：`M_p=exp(-πξ/√(1-ξ^2))×100%`=9.5%","④ 调整时间：`t_s=4/(ξω_n)`=1.33 sec（Δ=2%）；`t_s=3/(ξω_n)`=1 sec（Δ=5%）","⑤ 振荡次数：`N=t_s/(2π/ω_d)`=0.85≈1（Δ=2%）；N=0.63≈1（Δ=5%）"],"result":"tr=0.55 sec；tp=0.785 sec；Mp=9.5%；ts=1.33 sec（Δ=2%）、1 sec（Δ=5%）；N≈1","basis":"课件 p026（ts、N 公式）、课件 p028（原解）"},{"id":"q-ctrl3b-2","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p029（例题2）","keyPoints":["由阶跃响应辨识系统参数","稳态值求刚度","超调量求阻尼比","峰值时间求固有频率"],"stem":"例2 图示机械系统，在质块 m 上施加 xi(t)=8.9N 阶跃力后，质块的时间响应 xo(t) 如图所示，求 m、k、c。","given":["输入 `x_i(t)=8.9N` 阶跃力；稳态位移 `x_o(∞)=0.03m`；第一个峰值超调量 `x_o(t_p)-x_o(∞)=0.0029m`；峰值时间 `t_p=2sec`"],"ask":["求系统的质量 m、弹簧刚度 k、阻尼系数 c"],"steps":["系统模型 `G(s)=X_o(s)/X_i(s)=1/(ms^2+cs+k)`，输入 `X_i(s)=8.9/s` N","1) 求 k：`x_o(∞)=lim_{t→∞}x_o(t)=lim_{s→0}s·X_o(s)=lim_{s→0}s·(1/(ms^2+cs+k))·(8.9/s)=8.9/k` N，故 k=8.9/0.03=297 N/m","2) 求 m：由超调量 `M_p=e^{-πξ/√(1-ξ^2)}=0.0029/0.03=9.6%` 得 ξ=0.6；由 `t_p=π/ω_d=π/(ω_n√(1-ξ^2))=2` 得 ω_n=1.96/sec；再由 `ω_n^2=k/m` 得 m=k/ω_n^2=77.3 kg","3) 求 c：由 `2ξω_n=c/m` 得 c=181.8 N·s/m"],"result":"k=297 N/m，m=77.3 kg，c=181.8 N·s/m","basis":"课件 p029（原解）"},{"id":"q-ctrl3b-3","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p030（例题3）","keyPoints":["二阶系统阻尼比计算","超调量指标校核","微分负反馈设计"],"stem":"例3 图a所示位置随动系统，单位阶跃输入时，要求 Mp<5%。1）系统是否满足要求？2）增加微分负反馈，如图b所示，求满足要求时的 τ 值。","given":["系统 a：开环 `50/(s(0.05s+1))`，单位负反馈；系统 b：在反馈通道中加入比例—微分环节 `(1+τs)`（微分负反馈）"],"ask":["1）判断系统 a 是否满足 Mp<5%；2）求系统 b 满足要求时的 τ 值"],"steps":["系统 a：闭环 `G_B(s)=50/(0.05s^2+s+50)`，与标准式对比知 ξ=0.316，ω_n=31.62","系统 a 超调量：`M_p=e^{-πξ/√(1-ξ^2)}`=0.35=35%>5%，**不满足要求**","系统 b：闭环 `G_B(s)=50/(0.05s^2+(1+50τ)s+50)`，仍知 ω_n=31.62，`ξ=(20(1+50τ))/(2ω_n)`","欲满足要求，须使 `M_p=e^{-πξ/√(1-ξ^2)}=0.05`，解得 ξ=0.69","由 ξ=0.69 代入解得 τ=0.0236 sec"],"result":"系统 a 不满足要求（Mp=35%）；系统 b 取 τ=0.0236 sec 时满足 Mp<5%","basis":"课件 p027（Mp 与 ξ 关系）、课件 p030（原解）"},{"id":"q-ctrl3b-4","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p041～p042（例题1）","keyPoints":["稳态误差计算","系统型次","无偏系数","单位反馈系统误差等于偏差"],"stem":"例1 已知两个系统如图所示，当系统输入信号为 xi(t)=4+6t+3t^2 时，试分别求出两个系统的稳态误差。","given":["系统(a)开环 `10/(s(s+4))`；系统(b)开环 `10(s+4)/(s^2(s+4))`；两者均为单位反馈系统；输入 `x_i(t)=4+6t+3t^2`"],"ask":["分别求出两个系统的稳态误差"],"steps":["(1) 先将系统开环传递函数写成标准形式。图(a)：`G_k(s)=(10/4)/(s(s/4+1))`；图(b)：`G_k(s)=(10/4)(s+1)/(s^2(s/4+1))`","(2) 计算稳态误差。因两系统均为单位反馈系统，其稳态误差分别与其稳态偏差相等","输入含阶跃(A0=4)、斜坡(A1=6)、加速度(A2=6，来自 3t^2)三部分，按 `e_ss=4/(1+k_p)+6/k_v+6/k_a` 计算","图(a) 为 I 型系统：k_p=∞，k_v=K=10/4，k_a=0，即 `e_ss=4/(1+∞)+6/(10/4)+6/0=∞`，故图(a) 稳态误差为无穷大","图(b) 为 II 型系统：k_p=∞，k_v=∞，k_a=K=10/4，即 `e_ss=4/(1+∞)+6/∞+6/(10/4)=2.4`，故图(b) 稳态误差为 2.4"],"result":"图(a) 稳态误差为无穷大；图(b) 稳态误差为 2.4","basis":"课件 p037（稳态偏差表）、课件 p042（原解）"},{"id":"q-ctrl3b-5","kind":"例题","priority":1,"source":"课件题目","sourceDetail":"课件 p043～p044（例题2）","keyPoints":["斜坡输入稳态误差","附加微分元件补偿","误差为零的条件"],"stem":"例2 速度控制系统如图所示。输入信号 r(t) 是单位斜坡函数。为了消除系统在输出端的稳态误差，使斜坡输入信号通过比例—微分元件后再进入系统。1）试计算 kd=0 时系统的稳态误差。2）欲使系统对斜坡输入的响应的稳态误差为零，kd 值应为何值？","given":["输入 r(t) 为单位斜坡函数；前向通道 `K/(s(Ts+1))`；输入端串联比例—微分元件 `1+K_d s`；系统为单位反馈"],"ask":["1）kd=0 时的稳态误差；2）使稳态误差为零时的 kd 值"],"steps":["系统实际输出 `Y(s)=K/(s(Ts+1)+K)·(1+K_d s)R(s)`","依题意，未加比例微分元件时输入信号直接作用于左端相加点，且系统为单位反馈系统，故理想输出 `x_or=r(t)`，即 `X_or(s)=R(s)`","系统误差 `E_r(s)=X_or(s)-Y(s)=R(s)-K/(s(Ts+1)+K)·(1+K_d s)R(s)=(s(Ts+1)-KK_d s)/(s(Ts+1)+K)·R(s)`","单位斜坡输入 `R(s)=1/s^2`，稳态误差 `e_ssr=lim_{s→0}sE_r(s)=lim_{s→0}[(s(Ts+1)-KK_d s)/(s(Ts+1)+K)]·(1/s^2)=(1-KK_d)/K`","1）当 kd=0 时，`e_ssr=1/K`","2）欲使稳态误差为零，须 `1-KK_d=0`，即 kd=1/K"],"result":"1）kd=0 时稳态误差 e_ssr=1/K；2）kd=1/K 时系统对斜坡输入的稳态误差为零","basis":"课件 p044（原解）"}],"images":{"2":{"w":"img/control-ch3/p002.webp","j":"img/control-ch3/p002.jpg"},"3":{"w":"img/control-
