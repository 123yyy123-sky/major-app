K=4~10**（完全依靠汽-水密度差）· 控制循环 **K=2~5**（主要依靠炉水循环泵）· 直流 **K=1**（一次通过，无循环）· 复合循环（低负荷多次循环、高负荷纯直流）。","⚠️ **自然循环、控制循环只能用于临界压力以下**；直流、复合循环适用于任何压力。","**水的临界参数**：t_c＝**374.15 ℃** · p_c＝**22.1 MPa** · ρ_c＝322 kg/m³ · h_c＝2095.2 kJ/kg。","临界压力下：**汽化潜热＝0** · **汽水密度差＝0** · **无汽水共存两相**。"]},{"id":"p-loop","title":"三种循环锅炉的特点（记忆锚点＝有汽包 / 无汽包）","key":true,"source":"视频 1.4 @ 26:55–28:55","items":["**自然循环**：汽包大 → 金属耗量大；热应力 → 启停受限、时间长；流动特性简单 → 可靠。","**控制循环**（强制流动代表）：汽包直径、壁厚减小；升降负荷快、启停时间缩短；水循环更可靠；循环泵高温高压 → 昂贵。","**直流**：**无汽包**；对负荷变化敏感、需防膜态沸腾 → 控制要求高；**启停快**（冷炉点火约 **40 分钟**供额定参数蒸汽，自然循环约 **2–4 小时**）；给水品质要求高。"]},{"id":"p-model","title":"1.5 锅炉型号（课件没有，好考点）","key":true,"source":"视频 1.5 @ 29:30–30:15","items":["例 `HG1952/25.4-YM1`：**HG**＝哈尔滨锅炉厂｜**1952**＝最大连续蒸发量 BMCR（t/h）｜**25.4**＝BMCR 过热蒸汽压力（**表压**，MPa）｜**YM**＝设计燃料为**烟煤**｜**1**＝设计序号。","例 `SG-1910/25.4-M951`：**SG**＝上海锅炉厂｜**M**＝燃煤。","**燃料代号**：**M 燃煤 · Y 燃油 · Q 燃气 · T 其它**。"]},{"id":"p-indicator","title":"1.6 主要特征指标与公式","key":false,"source":"视频 1.6 @ 31:05–32:20","items":["三方面：**安全性**（安全可靠）· **经济性**（经济节能）· **环保性能**（低污染）。","**事故率 ＝ 事故停运小时数 ÷（总运行小时数 ＋ 事故停运小时数）**；**可用率 ＝（运行总时数＋备用时数）÷ 统计期间总时数 ×100%**（电站可用率>90%）。","**锅炉效率 ＝ 有效利用热 Q₁ ÷ 输入热量 Q_r ×100%**；输入热量(MW)＝输入煤量(kg/s)×煤发热量(MJ/kg)。","排放（GB13223-2011，基准氧含量 6%）：烟尘 **20**／SO₂ **50**／NOx **100** mg/m³；**超低排放 10/35/50**。"]},{"id":"p-rest","title":"其余（一句话）","key":false,"source":"课件 slide 8 / 28 / 32–38","items":["**重要性**：供热系统热源设备 · 工矿企业动力及供热设备 · **火电站三大主机之一** · 节能环保。","**基本结构**：锅炉本体＝汽锅（汽水系统）＋炉子（燃烧设备）＋安全附件（水位计·压力表·安全阀）；另有钢架平台。","**要求**：①数量 ②质量 ③经济性（现代锅炉 90~92%，超临界 93~94%）④安全（连续运行≥5000h、可用率 90~95%）⑤适应性 ⑥环保。","**发展概况**：1949 装机 1849MW、煤耗 727g/(kW·h) → 四阶段 → 2011 首超美国、2012 世界最大、2010 煤耗 335g/(kW·h)。","**课程体系**：运行过程 → 所需设备 → 影响因素。"]}],"questions":[{"id":"bq-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 slide 9（1 分）","keyPoints":["基本参数","额定蒸发量","受热面蒸发率","锅炉热效率","表压"],"stem":"关于锅炉的基本参数，下列说法正确的是（　）","options":[{"k":"A","t":"锅炉的额定蒸发量是指锅炉在任意压力、温度下每小时产生的蒸汽量"},{"k":"B","t":"受热面蒸发率的单位是 kg/(m²·h)，表示每平方米蒸发受热面每小时产生的蒸汽量"},{"k":"C","t":"锅炉热效率 η 是指送进锅炉的燃料化学能全部转化为蒸汽内能的百分比"},{"k":"D","t":"蒸汽参数中的压力是指锅炉出口处蒸汽的绝对压力"}],"answer":"B","why":["A ✗ 额定蒸发量须在**额定参数（压力、温度）**下，不是「任意压力、温度」。","B ✓ 与课件 slide 7 原文完全一致。","C ✗ 热效率比的是**有效利用热 ÷ 输入热量**，不是「化学能全部转化」。","D ✗ 课件 slide 6 原文写「额定压力（**表压**）」，不是绝对压力。"],"basis":"课件 slide 6–7","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准"},{"id":"bq-2","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 slide 27（1 分）","keyPoints":["锅炉分类","工质流动方式","三种循环"],"stem":"下列哪一项属于按锅炉蒸发受热面内工质流动方式进行的分类？（　）","options":[{"k":"A","t":"层燃炉和室燃炉"},{"k":"B","t":"电站锅炉和工业锅炉"},{"k":"C","t":"自然循环锅炉和直流锅炉"},{"k":"D","t":"超临界锅炉和超超临界锅炉"}],"answer":"C","why":["A ✗ 层燃炉/室燃炉 → 按**燃烧方式**。","B ✗ 电站/工业锅炉 → 按**用途**。","C ✓ 按**蒸发受热面内工质的流动方式**。","D ✗ 超临界/超超临界 → 按**蒸汽压力**。"],"basis":"课件 slide 21、24","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准"},{"id":"bq-3","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频 1.4 @ 24:40","keyPoints":["循环倍率K"],"stem":"循环倍率 K 的定义式是（　）","options":[{"k":"A","t":"K ＝ 蒸发管出口蒸汽流量 D₀ ÷ 蒸发管内工质总流量 G"},{"k":"B","t":"K ＝ 蒸发管内工质总流量 G ÷ 蒸发管出口蒸汽流量 D₀"},{"k":"C","t":"K ＝ 给水量 ÷ 蒸发量"},{"k":"D","t":"K ＝ 循环水量 × 蒸汽量"}],"answer":"B","why":["K ＝ 蒸发管内工质总流量 **G** ÷ 蒸发管出口蒸汽流量 **D₀**（不要记反）。"],"basis":"视频 1.4 @ 24:40"},{"id":"bq-4","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频 1.4 @ 24:40","keyPoints":["循环倍率K","三种循环"],"stem":"自然循环锅炉的循环倍率 K 一般为（　）","options":[{"k":"A","t":"1"},{"k":"B","t":"2 ~ 5"},{"k":"C","t":"4 ~ 10"},{"k":"D","t":"10 ~ 20"}],"answer":"C","why":["自然循环 **4~10**；控制循环 **2~5**；直流 **=1**。"],"basis":"视频 1.4 @ 24:40"},{"id":"bq-5","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频 1.4 @ 26:35（老师整行大红圈）","keyPoints":["循环倍率K","临界压力","适用范围"],"stem":"关于自然循环与控制循环锅炉的适用范围，正确的是（　）","options":[{"k":"A","t":"适用于任何压力"},{"k":"B","t":"只能适用于临界压力以下"},{"k":"C","t":"只能适用于超临界压力以上"},{"k":"D","t":"与压力无关"}],"answer":"B","why":["**自然循环、控制循环只能用于临界压力以下**；直流、复合循环适用于任何压力。","原因：压力提高后汽-水密度差减小，自然循环推动力下降。"],"basis":"视频 1.4 @ 26:35"},{"id":"bq-6","kind":"填空","priority":2,"source":"视频考点","sourceDetail":"视频 1.4 @ 24:10","keyPoints":["水的临界参数"],"stem":"水的临界温度 t_c ＝ ____ ℃，临界压力 p_c ＝ ____ MPa。（填数值）","answer":"374.15 ℃ ； 22.1 MPa","why":["另记：ρ_c＝322 kg/m³，h_c＝2095.2 kJ/kg。"],"basis":"视频 1.4 @ 24:10"},{"id":"bq-7","kind":"多选","priority":2,"source":"视频考点","sourceDetail":"视频 1.4 @ 24:10","keyPoints":["水的临界参数","临界状态"],"stem":"在临界压力下，下列说法正确的有（　）","options":[{"k":"A","t":"汽化潜热 = 0"},{"k":"B","t":"汽水密度差 = 0"},{"k":"C","t":"存在明显的汽水共存两相"},{"k":"D","t":"没有汽水共存的两相"}],"answer":"ABD","why":["临界压力下汽化潜热与汽水密度差都归零，**不存在汽水共存两相**，故 C 错。"],"basis":"视频 1.4 @ 24:10"},{"id":"bq-8","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频 1.5 @ 30:15","keyPoints":["锅炉型号","表压"],"stem":"锅炉型号 HG1952/25.4-YM1 中，「25.4」表示（　）","options":[{"k":"A","t":"最大连续蒸发量，单位 t/h"},{"k":"B","t":"BMCR 过热蒸汽压力（表压），单位 MPa"},{"k":"C","t":"过热蒸汽温度，单位 ℃"},{"k":"D","t":"设计序号"}],"answer":"B","why":["1952＝BMCR（t/h）；**25.4＝BMCR 过热蒸汽压力（表压，MPa）**；YM＝设计燃料为烟煤；1＝设计序号。"],"basis":"视频 1.5 @ 30:15"},{"id":"bq-9","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频 1.5 @ 29:30","keyPoints":["锅炉型号","燃料代号"],"stem":"锅炉型号中，燃料代号 Y 表示（　）","options":[{"k":"A","t":"燃煤"},{"k":"B","t":"燃油"},{"k":"C","t":"燃气"},{"k":"D","t":"其它"}],"answer":"B","why":["**M 燃煤 · Y 燃油 · Q 燃气 · T 其它**。"],"basis":"视频 1.5 @ 29:30"},{"id":"bq-10","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频 1.3 @ 13:50","keyPoints":["除渣除灰","灰量比例"],"stem":"燃煤锅炉中，除渣与除灰分别约占总灰量的（　）","options":[{"k":"A","t":"除渣 5–10%，除灰 90–95%"},{"k":"B","t":"除渣 90–95%，除灰 5–10%"},{"k":"C","t":"各占 50%"},{"k":"D","t":"除渣 30%，除灰 70%"}],"answer":"A","why":["**除渣**＝大块熔渣，约占 **5–10%**，水冷壁冷却成固态渣由炉底排放；**除灰**＝烟气携带细灰，约占 **90–95%**，除尘器分离后送灰场。"],"basis":"视频 1.3 @ 13:50"},{"id":"bq-11","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频 1.3 @ 14:35","keyPoints":["烟气排放","FGD","SCR"],"stem":"烟气排放系统中，FGD 与 SCR 分别用于脱除（　）","options":[{"k":"A","t":"FGD 脱硝 NOx，SCR 脱硫 SO₂"},{"k":"B","t":"FGD 脱硫 SO₂，SCR 脱硝 NOx"},{"k":"C","t":"两者都脱硫"},{"k":"D","t":"两者都脱硝"}],"answer":"B","why":["**FGD**＝Flue Gas Desulfurization，湿法烟气**脱硫 SO₂**；**SCR**＝Selective Catalytic Reduction，烟气**脱硝 NOx**。"],"basis":"视频 1.3 @ 14:35"},{"id":"bq-12","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频 1.4 @ 28:00","keyPoints":["直流锅炉","启停"],"stem":"关于直流锅炉的特点，下列错误的是（　）","options":[{"k":"A","t":"无汽包"},{"k":"B","t":"对负荷变化敏感，控制要求高"},{"k":"C","t":"启停慢，冷炉点火需 2–4 小时"},{"k":"D","t":"对给水品质要求高"}],"answer":"C","why":["直流锅炉**启停快**：冷炉点火约 **40 分钟**即可供额定参数蒸汽；需 2–4 小时的是**自然循环**锅炉。"],"basis":"视频 1.4 @ 28:00"},{"id":"bq-13","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频 1.4 @ 29:20","keyPoints":["燃烧方式","流化床"],"stem":"流化床燃烧的主要特点不包括（　）","options":[{"k":"A","t":"燃烧温度低，约 850℃"},{"k":"B","t":"煤种适应性好"},{"k":"C","t":"床内可脱硫"},{"k":"D","t":"NOx 排放很高，无温室气体问题"}],"answer":"D","why":["流化床**温度低故 NOx 低**，但会产生另一种温室气体 **N₂O**，故 D 错。床内脱硫反应：CaCO₃=CaO+CO₂；CaO+SO₂+½O₂=CaSO₄。"],"basis":"视频 1.4 @ 19:50"},{"id":"bq-14","kind":"单选","priority":3,"source":"教材考点","sourceDetail":"教材绪论 复习思考题 1","keyPoints":["三大主机","火电厂"],"stem":"火力发电厂的三大主要设备（三大主机）是（　）","options":[{"k":"A","t":"锅炉、汽轮机、发电机"},{"k":"B","t":"锅炉、磨煤机、送风机"},{"k":"C","t":"汽轮机、凝汽器、给水泵"},{"k":"D","t":"锅炉、除尘器、烟囱"}],"answer":"A","why":["燃料化学能 → 锅炉热能 → 汽轮机机械能 → 发电机电能；**三大主机＝锅炉·汽轮机·发电机**。"],"basis":"教材绪论第一节"},{"id":"bq-15","kind":"单选","priority":4,"source":"补充练习","sourceDetail":"据课件 slide 28","keyPoints":[],"stem":"锅炉本体由哪三部分组成（　）","options":[{"k":"A","t":"汽锅、炉子、安全附件"},{"k":"B","t":"炉膛、烟道、烟囱"},{"k":"C","t":"过热器、省煤器、空预器"},{"k":"D","t":"给水泵、送风机、引风机"}],"answer":"A","why":["本体＝**汽锅**（汽水系统）＋**炉子**（燃烧设备）＋**安全附件**（水位计·压力表·安全阀）。"],"basis":"课件 slide 28"},{"id":"bq-16","kind":"单选","priority":4,"source":"补充练习","sourceDetail":"据视频 1.7","keyPoints":[],"stem":"世界上最早建成燃煤发电厂的国家与年份是（　）","options":[{"k":"A","t":"1875 年，法国"},{"k":"B","t":"1879 年，美国"},{"k":"C","t":"1882 年，中国"},{"k":"D","t":"1890 年，英国"}],"answer":"A","why":["1875 年**法国**建成世界最早煤电厂（巴黎火车站照明）；1879 年美国旧金山为最早**售电**电厂；1882 年上海电光公司为我国最早燃煤电厂。"],"basis":"视频 1.7 @ 32:30"}]},{"id":"boiler-ch1","name":"第一章 燃料及燃烧计算","subtitle":"燃料 · 煤的成分 · 燃料特性 · 煤的分类 · 液气燃料 · 燃烧计算","status":"在读","overview":"本章六节：燃料种类 → 煤的成分（元素/工业分析、基准换算）→ 燃料特性（发热量、折算成分、灰的性质）→ 煤的分类 → 液体和气体燃料 → 燃烧计算（空气量、过量空气系数、烟气量、焓）。教材另有第七节「烟气分析」。","mindmap":{"label":"第一章 燃料及燃烧计算","children":[{"label":"第一节 锅炉用燃料","children":[{"label":"按状态：固体（煤·炭·木材）· 液体（汽油·煤油·石油）· 气体（天然气·煤气·沼气）"},{"label":"按类型：化石燃料 · 生物燃料 · 核燃料"},{"label":"注意：部分气体燃料可压缩为液体（如液化石油气）"}]},{"label":"第二节 煤的成分","children":[{"label":"一、元素分析与工业分析"},{"label":"二、煤的成分 C H O N S M A"},{"label":"三、煤中成分对锅炉工作的影响 ★"},{"label":"四、成分基准及其换算 ★★"}]},{"label":"第三节 燃料的某些特性","children":[{"label":"一、发热量 Q_gr / Q_net ★"},{"label":"二、燃料的折算成分（基准 4187 kJ/kg）"},{"label":"三、灰的性质 DT / ST / FT ★"}]},{"label":"第四节 煤的分类","children":[{"label":"一、分类方法（按煤化程度三大类）"},{"label":"二、动力煤：无烟煤 · 贫煤 · 烟煤 · 褐煤"},{"label":"成煤（煤化）过程：泥炭→褐煤→亚烟煤→烟煤→无烟煤"}]},{"label":"第五节 液体和气体燃料","children":[{"label":"液体燃料：粘度 · 凝固点 · 闪点 · 含硫量 · 灰分"},{"label":"气体燃料：成分、种类与优点"}]},{"label":"第六节 燃料的燃烧计算 ★★","children":[{"label":"一、所需空气量与过量空气系数"},{"label":"　理论氧气量 V⁰_O₂ · 理论空气量 V⁰ · 过量空气系数 α · 漏风系数"},{"label":"二、燃烧产物计算（理论 / 实际）"},{"label":"三、空气与燃烧产物的焓计算"}]},{"label":"（教材另有）第七节 烟气分析"}]},"points":[{"id":"p-ch1-fuel","title":"第一节 燃料的分类","key":false,"source":"课件 p002","items":["**按状态分**：固体燃料（煤、炭、木材）· 液体燃料（汽油、煤油、石油）· 气体燃料（天然气、煤气、沼气）。","**按类型分**：化石燃料（石油、煤、油页岩、甲烷、油砂）· 生物燃料 · 核燃料。","注意：一些气体燃料可压缩为液体，如**液化石油气**。"]},{"id":"p-ch1-analysis","title":"煤的两种分析","key":true,"source":"课件 p003","items":["**元素分析**：测定煤中有机物里 **碳、氢、氧、氮、硫**的质量百分比 —— 是**燃烧计算的依据**。","**工业分析（电厂）**：按规定条件把煤样**干燥、加热、燃烧**，测定 **水分、挥发分、固定碳、灰分** —— 了解煤在燃烧时的特性。","记住两组：元素分析＝**C H O N S**；工业分析＝**M V FC A**。"]},{"id":"p-ch1-compo","title":"煤的成分与对锅炉工作的影响 ★（选择题考点）","key":true,"source":"课件 p004–p005；单选题 p006","items":["**碳 C**：含量最多的可燃元素（无烟煤 >70%），发热量主要来源，**1 kg 碳完全燃烧约放 32700 kJ**。","**氢 H**：含量 3~6%，发热量很高，**1 kg 氢燃烧约放 120000 kJ**。","**氧 O、氮 N**：不可燃成分；年代浅的煤含氧可达 40%，氮一般 0.5%~2.0%。","**硫 S**：**有害成分**，约占可燃成分 8%，三种形态（有机硫、黄铁矿硫、硫酸盐硫），前两种可燃，燃烧热 9040 kJ/kg。","**水分 M**：102~110 ℃ 干燥到恒重失去的重量；含量约 2~60%。","**灰分 A**：(815±25) ℃ 灼烧 2 小时后的剩余物；含量 10%~50%。","⚠️ **它们对锅炉工作的影响（p005，单选原题就在这）**：","　· **硫分**：SO₂ → 硫酸蒸汽腐蚀受热面；缺氧生成 H₂S 腐蚀高温区水冷壁；污染大气；硫化铁加剧磨煤机磨损。","　· **灰分**：妨碍可燃质与空气接触、燃烧困难、热损失增加；炉膛结渣、受热面积灰磨损；污染环境。","　· **水分**：**降低燃烧温度、不利燃烧**；降低锅炉效率；引风机耗能增加；**为低温受热面腐蚀提供环境**；造成堵煤、磨煤机出力下降。","　· **挥发分**：失去水分的煤样隔绝空气加热至 (900±10) ℃ 析出的气体产物；**含量高 → 煤易着火、燃尽、燃烧稳定**；也是**煤分类**的重要依据。"]},{"id":"p-ch1-basis","title":"成分基准及其换算 ★★（选择题考点）","key":true,"source":"课件 p007；单选题 p008；教材第一章第二节四","items":["煤中水分、灰分会随外界条件变化，其他成分百分含量随之改变 → **说明成分必须注明基准**。","**收到基（应用基）ar**：以**进入锅炉房的原煤**为基准 —— C+H+O+N+S+A+M = 100%。","**空气干燥基 ad**：经**自然干燥、除去外部水分** —— C+H+O+N+S+A+M = 100%。","**干燥基 d**：**除去全部水分** —— C+H+O+N+S+A = 100%；**常用来表示灰分**。","**干燥无灰基 daf**：**除去全部水分和灰分** —— C+H+O+N+S = 100%；常表示煤中有机物的元素成分和**挥发分**。","🔑 **换算口诀**：分母里**去掉谁**，就是哪个基准。收到基啥都不去；空气干燥基去外部水；干燥基去全水；干燥无灰基再额外去灰。","热力计算一律用**收到基**；灰分含量常用**干燥基**；挥发分/元素成分常用**干燥无灰基**。"]},{"id":"p-ch1-cv","title":"发热量：高位 vs 低位 ★★","key":true,"source":"课件 p009；教材第一章第三节一","items":["**发热量 Q**：单位质量固体/液体燃料完全燃烧放出的热量（kJ/kg）；气体燃料按单位容积（kJ/m³）。","**高位发热量 Q_gr**：完全燃烧放出的热量，**含**生成水蒸汽的汽化潜热。","**低位发热量 Q_net**：完全燃烧放出的热量，**扣除**随烟气带走的水蒸汽汽化潜热 —— **锅炉一律用 Q_net,ar**。","两者关系：`Q_net,ar = Q_gr,ar − r(9H_ar/100 + M_ar/100)`，其中 r 为水的汽化潜热。","**经验估算公式**（课件蓝色标注）：`Q_gr,ar = 339C_ar + 1256H_ar + 109S_ar − 109O_ar`。"]},{"id":"p-ch1-red","title":"燃料的折算成分与标准煤","key":false,"source":"课件 p010；教材第一章第三节二","items":["把各成分**折算到统一发热量 4187 kJ/kg** 下表示含量，下标 **red**：","`M_ar,red = 4187·M_ar / Q_net,ar`；`S_ar,red`、`A_ar,red` 同理。","判据：折算水分 **>8%** → 高水分；折算硫分 **>0.2%** → 高硫分；折算灰分 **>4%** → 高灰分。","**标准煤**：规定 `Q_net,ar = 29310 kJ/kg`（即 7000 kcal/kg）的煤。"]},{"id":"p-ch1-ash","title":"灰的性质：DT / ST / FT ★","key":true,"source":"课件 p011；教材第一章第三节三","items":["灰锥加热的三个特征温度：**DT 变形温度**（锥顶变圆或开始倾斜）→ **ST 软化温度**（锥顶弯至锥底或萎缩成球形）→ **FT 流化温度**（呈流体状态能沿平面流动）。","**固态排渣炉要求灰的软化温度 ST > 1350 ℃**（不易结渣）；**炉膛出口温度至少低于 ST 50~100 ℃**。","**烧结性**：影响对流受热面（尤其过热器）的积灰特性，**与熔融性无直接关系**。","影响因素：煤灰成分（碱性物质越多烧结性越强）、SO₂ 含量、温度、烧结时间。"]},{"id":"p-ch1-coal","title":"煤的分类与四种动力煤 ★（选择题考点）","key":true,"source":"课件 p012–p016；单选题 p017","items":["按**煤化程度**分三大类：**褐煤 → 烟煤 → 无烟煤**；分类指标含干燥无灰基挥发分、黏结指数等（GB 5751-86）。","**无烟煤**（白煤）：煤化程度最高，挥发分低，**着火和燃尽都比较困难**，发热量高（可达 21000~25000 kJ/kg 量级）。","**贫煤**：变质程度最高的烟煤，性质在无烟煤与烟煤之间，**挥发分 10%~20%**。","**烟煤**：煤化程度高于褐煤、低于无烟煤，**挥发分 20%~40%**，发热量较高，**燃烧时火焰高而有烟**。","**褐煤**：富含挥发分（**>37%**）易燃烧并冒烟，水分大、**空气中易风化碎裂**、燃点低（约 270 ℃）、**储存超两个月易自燃**，堆放不应超过两米。","🔑 记忆锚点：**挥发分**高低顺序 褐煤 > 烟煤 > 贫煤 > 无烟煤；**着火难易**则相反。"]},{"id":"p-ch1-liq","title":"液体燃料与气体燃料","key":false,"source":"课件 p018–p019；教材第一章第五节","items":["锅炉液体燃料主要是**重油和渣油**（原油炼制后的残油）。特性指标：**粘度、凝固点、闪点、含硫量、灰分**。","**粘度**：温度↑粘度↓，压力↑粘度↑；重油粘度过大，**输送前必须加热**。","**闪点**：燃油挥发气体与空气混合达到一定浓度、可被火星点燃时的油温。","**灰分**：量少但常含**钒和钠**，燃烧生成熔点低的**钒酸钠** → 受热面**高温腐蚀**。","**气体燃料**：含低分子碳氢化合物、氢、一氧化碳等可燃气体；天然的有沼气、天然气；加工的有焦炉气、水煤气、发生炉煤气、石油气、高炉气。","优点：可管道远距离输送、不含灰分、着火温度低易控制、可调氧化/还原气氛、可预热、可利用低级固体燃料。"]},{"id":"p-ch1-air","title":"燃烧计算：空气量与过量空气系数 ★★","key":true,"source":"课件 p020–p023；例题 p023；教材第一章第六节","items":["**燃烧化学式**：C+O₂=CO₂；2C+O₂=2CO（不完全燃烧）；2H₂+O₂=2H₂O；S+O₂=SO₂。","**理论氧气量**（1 kg 燃料完全燃烧）：`V⁰_O₂ = 1.866(C_ar/100) + 5.56(H_ar/100) + 0.7(S_ar/100) − 0.7(O_ar/100)` m³/kg","**理论空气量**：`V⁰ = V⁰_O₂/0.21 = 0.0889(C_ar + 0.375S_ar) + 0.265H_ar − 0.0333O_ar` m³/kg","　　（烟气分析时**硫和碳的燃烧产物一起测定**；所算空气量是**不含水蒸气的理论干空气量**。）","**过量空气系数 α**：实际空气量与理论空气量之比。","**推荐值**（固态排渣煤粉炉）：无烟煤/贫煤/劣质烟煤 **α″_f = 1.20~1.25**；烟煤/褐煤 **α″_f = 1.15~1.20**。","**漏风系数**：漏入的空气量与理论空气量之比 —— 使换热变差、排烟热损失和引风机能耗增加、**降低锅炉经济性**。","**实际空气量**：`V = αV⁰`。"]},{"id":"p-ch1-gas","title":"燃烧计算：烟气量与焓 ★★","key":true,"source":"课件 p024–p026；教材第一章第六节","items":["**理论烟气（1 kg 燃料）**：","　`V_CO₂ = 1.866(C_ar/100)`；`V_SO₂ = 0.7(S_ar/100)` m³/kg","　`V⁰_N₂ = 0.79V⁰ + 0.8(N_ar/100)` m³/kg","　`V⁰_H₂O = 11.1(H_ar/100) + 1.24(M_ar/100) + 0.0161V⁰` m³/kg","　`V⁰_g = V_RO₂ + V⁰_N₂ + V⁰_H₂O` m³/kg","**实际烟气容积**：`V_g = V⁰_g + (α−1)V⁰ + 0.0161(α−1)V⁰` m³/kg","　不完全燃烧时：`V_g = V_CO + V_CO₂ + V_SO₂ + V_O₂ + V_N₂ + V_H₂O`","**烟气质量**：`G_g = 1 − (A_ar/100) + 1.306αV⁰` kg/kg","**焓计算**：`I⁰_a = V⁰(cθ)_a`；`I_a = βV⁰(cθ)_a = βI⁰_a`；`I_g = I⁰_g + (α−1)I⁰_a + I_fa`；`I_fa = (α_fa·A_ar/100)(cθ)_ash`"]}],"questions":[{"id":"bq-ch1-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p006（1 分）","keyPoints":["煤中成分的影响","硫分","灰分","水分","挥发分"],"stem":"关于煤中成分对锅炉工作的影响，下列说法正确的是","options":[{"k":"A","t":"煤中硫分含量越高越好，因为硫燃烧能释放较多热量，有助于提高锅炉效率"},{"k":"B","t":"灰分含量高有利于燃烧，因为灰分可以形成炉渣保护受热面，减少磨损"},{"k":"C","t":"水分含量高会降低燃烧温度，不利于燃烧，并可能增加低温受热面腐蚀风险"},{"k":"D","t":"挥发分含量越低，煤越容易着火和燃尽，燃烧越稳定"}],"answer":"C","why":["A ✗ 硫是**有害成分**：SO₂ 腐蚀受热面、H₂S 腐蚀水冷壁、硫化铁加剧磨煤机磨损 —— 绝非「越高越好」。","B ✗ 灰分**妨碍燃烧**、造成结渣积灰与磨损 —— 没有「保护受热面」的作用。","C ✓ 与课件 p005 原文一致：「水分：降低燃烧温度，不利于燃烧……低温受热面腐蚀提供环境」。","D ✗ 课件 p005 原文：「挥发分含量**高**，煤易于着火、燃尽、燃烧稳定」—— 说反了。"],"basis":"课件 p004–p005（原文）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准"},{"id":"bq-ch1-2","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p008（1 分）","keyPoints":["成分基准","收到基","空气干燥基","干燥基","干燥无灰基"],"stem":"关于煤的成分基准，以下表述正确的是","options":[{"k":"A","t":"收到基（ar）是指除去全部水分后的煤作为基准"},{"k":"B","t":"空气干燥基（ad）是在隔绝空气条件下干燥后得到的基准"},{"k":"C","t":"干燥无灰基（daf）常用于表示煤中有机物的元素成分和挥发分含量"},{"k":"D","t":"干燥基（d）是除去全部水分和灰分后的基准"}],"answer":"C","why":["A ✗ 收到基是**以进入锅炉房的原煤为基准**，不除水分。","B ✗ 空气干燥基是**经自然干燥、除去外部水分**，不是「隔绝空气」。","C ✓ 与课件 p007 原文一致。","D ✗ 干燥基只**除去全部水分**；「除去水分和灰分」的是**干燥无灰基 daf**。"],"basis":"课件 p007（原文）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准"},{"id":"bq-ch1-3","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p017（1 分）","keyPoints":["煤的分类","挥发分","无烟煤","烟煤","褐煤","贫煤"],"stem":"根据煤化程度和挥发分含量，我国将煤分为三大类。以下关于煤的分类及其特征描述，正确的是","options":[{"k":"A","t":"无烟煤挥发分高，着火容易，燃烧时火焰长且有烟"},{"k":"B","t":"褐煤挥发分高，易于燃烧，但水分大，易风化自燃"},{"k":"C","t":"烟煤挥发分低于10%，含碳量高，燃烧时无烟"},{"k":"D","t":"贫煤挥发分高于40%，属于典型的烟煤，适合炼焦"}],"answer":"B","why":["A ✗ 无烟煤煤化程度**最高、挥发分低**，着火和燃尽**都比较困难**。","B ✓ 与课件 p015 原文一致：褐煤挥发成分高（>37%）、水分大、空气中易风化碎裂、易自燃。","C ✗ 烟煤挥发分是 **20%~40%**（不是低于 10%），且「燃烧时火焰高而**有烟**」。","D ✗ 贫煤挥发分是 **10%~20%**（不是高于 40%），它是变质程度最高的**烟煤**，但并非「高于40%」。"],"basis":"课件 p013–p015（原文）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准"},{"id":"bq-ch1-ex1","kind":"例题","priority":1,"source":"课件例题","sourceDetail":"课件 p023（有完整解答）","keyPoints":["理论空气量","实际空气量","过量空气系数"],"stem":"已知某电厂燃用烟煤，其收到基元素分析数据为：碳 C_ar=58.0%，氢 H_ar=4.0%，氧 O_ar=6.0%，硫 S_ar=0.8%，灰分 A_ar=20.0%，水分 M_ar=11.2%，锅炉为固态排渣煤粉炉，燃用烟煤时炉膛出口过量空气系数取 α=1.18。试求 1 kg 该煤完全燃烧所需的理论空气量 V⁰ 以及在实际过量空气系数 α=1.18 下所需的实际空气量 V（标准状态，m³/kg）。","given":["收到基碳 C_ar = 58.0%","收到基氢 H_ar = 4.0%","收到基氧 O_ar = 6.0%","收到基硫 S_ar = 0.8%","收到基灰分 A_ar = 20.0%","收到基水分 M_ar = 11.2%","锅炉型式：固态排渣煤粉炉；炉膛出口过量空气系数 α = 1.18"],"ask":["1 kg 该煤完全燃烧所需的理论空气量 V⁰（标准状态，m³/kg）","实际过量空气系数 α = 1.18 下所需的实际空气量 V（标准状态，m³/kg）"],"steps":["写出理论空气量计算公式：`V⁰ = 0.0889(C_ar + 0.375S_ar) + 0.265H_ar − 0.0333O_ar`","代入数据：`V⁰ = 0.0889×(58.0 + 0.375×0.8) + 0.265×4.0 − 0.0333×6.0`","　　`= 5.1829 + 1.06 − 0.1998 = 6.0431` m³/kg","取两位小数：**V⁰ ≈ 6.04 m³/kg**","实际空气量按 `V = αV⁰` 计算","`V = 1.18 × 6.0431 = 7.1309` m³/kg"],"result":"V⁰ ≈ **6.04 m³/kg**；V = **7.1309 m³/kg**（标准状态）","why":["🔑 先算 **理论空气量**（用收到基元素成分），再乘 **过量空气系数** 得实际空气量。","⚠️ 代入时注意系数：碳项 0.0889、硫项要乘 0.375 后并入碳项、氢项 0.265、氧项 **减** 0.0333。","⚠️ 元素成分给的是**百分数**，公式中直接代数值（如 C_ar 代 58.0），不要再多除一次 100。"],"basis":"课件 p021（公式）+ p023（例题解答）"},{"id":"bq-ch1-hw1","kind":"计算","priority":1,"source":"课件作业","sourceDetail":"课件 p027 课后作业第 1 题","keyPoints":["成分基准换算","收到基"],"stem":"某种煤收到基含碳量为 41%。由于受外界条件的影响，其收到基水分由 15% 减少到 10%，收到基灰分由 25% 增加到 35%，试求其水分和灰分变化后的收到基含碳量（要求先推导换算公式，后计算）。","given":["原收到基含碳量 C_ar = 41%","水分 M_ar：15% → 10%","灰分 A_ar：25% → 35%"],"ask":["水分和灰分变化后的收到基含碳量"],"steps":["关键认识：水分、灰分变化时，**可燃质（碳等）的绝对量不变**，只是基准的分母变了。","取 100 kg 原煤：其中碳 = 41 kg，水分 = 15 kg，灰分 = 25 kg，其余（氢氧氮硫）= 100 − 41 − 15 − 25 = 19 kg。","水分析出后：水分减少 5 kg，煤的总质量变为 100 − 5 = **95 kg**（碳、灰分、其余成分绝对量不变）。","再考虑灰分增加：题目说灰分由 25% 增到 35%——这一条需按「**折算到同一基准**」的思路处理，通常理解为干燥基灰分变化，须用基准换算公式计算。","⚠️ 本题核心是**基准换算**：`X_ar = X_d × (100 − M_ar)/100` 一类公式，先把原煤换算到不受水分影响的基准，再换回新的收到基。","标准解法：`C_ar,新 = C_ar,原 × (100 − M_ar,新)/(100 − M_ar,原)` 处理**只变水分**的情形；若灰分也变，则换算到**干燥无灰基**或**干燥基**再折回。"],"result":"需先推导换算公式再代入（课件只给题干，未给答案）","why":["🔑 基准换算的本质：**绝对质量不变，分母（总量）变**。","⚠️ 只变水分 → 用「收到基 ↔ 干燥基」换算；水分和灰分同时变 → 先换到**干燥无灰基（daf）**，该基准下可燃质比例恒定，再折回新收到基。","⚠️ 这是课件留的**手写作业题**，没有标准答案。建议算完对照 [[燃料成分基准换算法]]。"],"basis":"课件 p027（作业）；方法见 [[燃料成分基准换算法]]","answerNote":"课件未给答案；本题为标准基准换算题型，最终数值请自行演算后与同学/老师核对"},{"id":"bq-ch1-hw2","kind":"计算","priority":1,"source":"课件作业","sourceDetail":"课件 p027 课后作业第 2 题","keyPoints":["空气干燥基","收到基","成分基准换算"],"stem":"已知煤的空气干燥基成分：C_ad = 50.5%，H_ad = 4.2%，S_ad = 0.8%，A_ad = 15.5%，M_ad = 21%，和风干水分 M_ar^f = 3.5%，计算上述各种成分的收到基含量。","given":["C_ad = 50.5%","H_ad = 4.2%","S_ad = 0.8%","A_ad = 15.5%","M_ad = 21%","风干水分 M_ar^f = 3.5%"],"ask":["上述各成分的**收到基**含量"],"steps":["空气干燥基 → 收到基的换算系数：`k = (100 − M_ar)/(100 − M_ad)`","其中 `M_ar = M_ad + M_ar^f`（空气干燥基水分 + 风干水分）","本题：`M_ar = 21 + 3.5 = 24.5%`","换算系数 `k = (100 − 24.5)/(100 − 21) = 75.5/79 = 0.9557`","逐项换算：`C_ar = 50.5 × 0.9557 ≈ 48.26%`","　`H_ar = 4.2 × 0.9557 ≈ 4.01%`；`S_ar = 0.8 × 0.9557 ≈ 0.76%`；`A_ar = 15.5 × 0.9557 ≈ 14.81%`","校验：C+H+O+N+S+A+M = 100%（氧由差减求得）"],"result":"M_ar = 24.5%；换算系数 k ≈ 0.956；C_ar ≈ 48.3%，H_ar ≈ 4.0%，S_ar ≈ 0.76%，A_ar ≈ 14.8%","why":["🔑 记住方向：**空气干燥基 → 收到基，水分变多，所以数值要变小**（系数 <1）。","⚠️ 关键点是 **M_ar = M_ad + M_ar^f**：空气干燥基本身含 21% 水分，风干水分 3.5% 要加上去。","⚠️ 换算后要**校验总和 = 100%**，这是查错的好办法。"],"basis":"课件 p027（作业）；方法见 [[燃料成分基准换算法]]","answerNote":"课件未给答案；换算系数与结果按标准基准换算公式推得，请核对"}]}]},{"id":"heat","name":"传热学","short":"传热学","meta":"陶文铨 第六版 · 待拆（正文扫描件需 OCR）","color":"#1971c2","chapters":[]},{"id":"elec","name":"电工学","short":"电工学","meta":"秦曾煌 第七版（下册）· 待拆（PDF 加密待解密）","color":"#2f9e44","chapters":[]},{"id":"control","name":"机械工程控制基础","short":"控制基础","meta":"杨叔子 等 第7版 · 待拆（扫描件书签无章节名）","color":"#7048e8","chapters":[]}]}</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById('payload').textContent);
  var PS = { 1:{l:'课件题目',c:'#e8590c',b:'#fff0e6'}, 2:{l:'视频考点',c:'#1971c2',b:'#e7f1fb'},
             3:{l:'教材考点',c:'#2f9e44',b:'#e8f6ec'}, 4:{l:'补充练习',c:'#868e96',b:'#f1f3f5'} };
  var MAX_NONKEY = 0.25;

  /* ---------- 进度/错题本（localStorage） ---------- */
  var LS_KEY = 'majorapp.v1';
  function loadState() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveState(st) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(st)); } catch (e) {}
  }
  var state = loadState();
  state.wrong = state.wrong || {};      // qid -> 错误次数
  state.right = state.right || {};      // qid -> 连续答对次数
  function markRight(id){ state.right[id]=(state.right[id]||0)+1; state.wrong[id]=0; saveState(state); }
  function markWrong(id){ state.wrong[id]=(state.wrong[id]||0)+1; state.right[id]=0; saveState(state); }

  /* ---------- 工具 ---------- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  // 支持 **加粗**
  function rich(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); }
  function el(tag, cls, html){ var d=document.createElement(tag); if(cls)d.className=cls; if(html!=null)d.innerHTML=html; return d; }
  function $(id){ return document.getElementById(id); }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

  // 「重点题」= 带考点标签，或本身就是例题/计算题（例题永远入选，不受非重点限额）
  function isKey(q){
    return (q.keyPoints && q.keyPoints.length) || q.kind === '例题' || q.kind === '计算';
  }
  function stats(ch){
    var qs=(ch&&ch.questions)||[], by={};
    qs.forEach(function(q){ by[q.priority]=(by[q.priority]||0)+1; });
    return { total:qs.length, key:qs.filter(isKey).length, nonKey:qs.filter(function(q){return !isKey(q);}).length, by:by };
  }
  /* ---------- 出题引擎：课件题优先 + 非重点限额 + 错题加权 ---------- */
  function buildQuiz(ch, count){
    var all=(ch.questions||[]).slice(); if(!all.length) return [];
    function score(q){
      var s = q.priority*100;                       // 优先级主导：1 课件题最优先
      if(isKey(q)) s -= 40;                          // 重点题提权
      s -= Math.min(state.wrong[q.id]||0,3)*35;      // 错过的题提权
      s += Math.min(state.right[q.id]||0,2)*30;      // 连对的题降权
      return s;
    }
    var key=all.filter(isKey).sort(function(a,b){return score(a)-score(b);});
    var non=all.filter(function(q){return !isKey(q);}).sort(function(a,b){return score(a)-score(b);});
    var maxNon=Math.floor(count*MAX_NONKEY), out=[];
    key.forEach(function(q){ if(out.length<count) out.push(q); });
    var used=0;
    non.forEach(function(q){ if(out.length<count && used<maxNon){ out.push(q); used++; } });
    non.forEach(function(q){ if(out.length<count && out.indexOf(q)<0) out.push(q); });
    return out.sort(function(a,b){ return a.priority-b.priority; });
  }
  function judge(q, resp){
    if(q.kind==='填空'){
      var norm=function(s){ return String(s==null?'':s).replace(/\s/g,'').replace(/[，,。.；;]/g,''); };
      var a=norm(q.answer), g=norm(resp); if(!g) return false;
      return a.split(/；|;/).filter(Boolean).every(function(p){ return g.indexOf(p)>=0; });
    }
    var x=String(q.answer||'').split('').sort().join('');
    var y=String(resp||'').split('').sort().join('');
    return x.length>0 && x===y;
  }

  /* ---------- 路由状态 ---------- */
  var R = { sub:null, ch:null, tab:'mind' };

  function curSub(){ return DATA.subjects.filter(function(s){return s.id===R.sub;})[0]; }
  function curCh(){ var s=curSub(); if(!s) return null; return (s.chapters||[]).filter(function(c){return c.id===R.ch;})[0]; }

  /* ---------- 渲染：科目切换器 ---------- */
  function renderSubjects(){
    var box=$('subjects'); box.innerHTML='';
    DATA.subjects.forEach(function(s){
      var has=(s.chapters||[]).length>0;
      var b=el('button','subj'+(R.sub===s.id?' on':''), esc(s.name));
      if(R.sub===s.id) b.style.background=s.color;
      b.onclick=function(){ if(!has && R.sub!==s.id) return; R.sub=s.id; R.ch=null; R.tab='mind'; render(); };
      box.appendChild(b);
    });
  }

  /* ---------- 渲染：首页 ---------- */
  function renderHome(){
    var m=$('main'); m.innerHTML='';
    m.appendChild(el('div','h1','专业课'));
    m.appendChild(el('div','sub','课件 ＞ 视频 ＞ 课本 · 课件题优先 · 考点标清'));
    DATA.subjects.forEach(function(s){
      var n=(s.chapters||[]).length;
      var qn=(s.chapters||[]).reduce(function(a,c){return a+(c.questions||[]).length;},0);
      var btn=el('button','scard'+(n?'':' off'));
      btn.innerHTML =
        '<div class="bar" style="background:'+s.color+'"></div>'+
        '<div class="body"><div class="nm">'+esc(s.name)+'</div>'+
        '<div class="mt">'+esc(s.meta)+'</div>'+
        '<div class="chips">'+(n
            ? '<span class="chip" style="background:'+s.color+'1a;color:'+s.color+'">'+n+' 章</span><span class="chip">'+qn+' 题</span>'
            : '<span class="chip">内容建设中</span>')+
        '</div></div>'+(n?'<div class="arrow">›</div>':'');
      if(n) btn.onclick=function(){ R.sub=s.id; R.ch=null; R.tab='mind'; render(); };
      m.appendChild(btn);
    });
    m.appendChild(el('div','sub center','来源优先级：雨课堂课件 ▸ 视频 ▸ 课本'));
  }

  /* ---------- 渲染：章节列表 ---------- */
  function renderChapters(){
    var s=curSub(), m=$('main'); m.innerHTML='';
    m.appendChild(el('div','sub',esc(s.meta)));
    (s.chapters||[]).forEach(function(c){
      var st=stats(c);
      var b=el('button','ccard');
      b.innerHTML='<div class="between"><div class="nm">'+esc(c.name)+'</div><div class="muted" style="font-size:20px">›</div></div>'+
        (c.subtitle?'<div class="small muted" style="margin-top:2px">'+esc(c.subtitle)+'</div>':'')+
        '<div class="chips row" style="margin-top:10px">'+
          '<span class="chip" style="background:'+s.color+'1a;color:'+s.color+'">'+esc(c.status||'未学')+'</span>'+
          '<span class="chip">重点 '+st.key+'</span><span class="chip">题 '+st.total+'</span>'+
          (st.by[1]?'<span class="chip" style="background:#fff0e6;color:#e8590c">课件题 '+st.by[1]+'</span>':'')+
        '</div>';
      b.onclick=function(){ R.ch=c.id; R.tab='mind'; render(); };
      m.appendChild(b);
    });
  }

  /* ---------- 渲染：章节详情 ---------- */
  function renderDetail(){
    var s=curSub(), c=curCh(), m=$('main');
    m.innerHTML='';
    // tabs
    var tabs=el('div','tabs');
    var tabDefs=[['mind','思维导图'],['points','重点'],['quiz','练习'],['kp','考点清单']];
    tabDefs.forEach(function(t){
      var b=el('button','tab'+(R.tab===t[0]?' on':''), t[1]);
      if(R.tab===t[0]) b.style.color=s.color;
      b.onclick=function(){ R.tab=t[0]; render(); };
      tabs.appendChild(b);
    });
    // 错题本（有错题时显示，带角标）
    var wl=wrongList();
    var wb=el('button','tab'+(R.tab==='wrong'?' on':''), '错题本'+(wl.length?' ('+wl.length+')':''));
    if(R.tab==='wrong') wb.style.color='#e03131';
    wb.onclick=function(){ R.tab='wrong'; render(); };
    tabs.appendChild(wb);
    m.appendChild(tabs);
    var pane=el('div'); m.appendChild(pane);
    if(R.tab==='mind') paneMind(pane,c,s);
    else if(R.tab==='points') panePoints(pane,c,s);
    else if(R.tab==='kp') paneKP(pane,c,s);
    else if(R.tab==='wrong') paneWrong(pane);
    else paneQuiz(pane,c,s);
  }

  /* --- 思维导图（折叠树） --- */
  function paneMind(root,ch,s){
    var wrap=el('div');
    var bar=el('div','row','');
    bar.style.cssText='justify-content:flex-end;margin-bottom:10px';
    var b1=el('button','tbtn','全部展开'), b2=el('button','tbtn','全部收起');
    bar.appendChild(b1); bar.appendChild(b2); wrap.appendChild(bar);
    var card=el('div','card'); card.appendChild(el('div','small muted','点 ＋ / − 逐层展开（手机上比缩放巨图好用）'));
    var tree=el('div','tree'); tree.style.marginTop='8px';
    var openSet={}; // path -> true
    function render(){
      tree.innerHTML='';
      tree.appendChild(el('div','troot', esc(ch.mindmap.label)));
      (ch.mindmap.children||[]).forEach(function(n,i){ node(n,'0.'+i,1,tree); });
    }
    function node(n,path,depth,parent){
      var kids=n.children||[], open=!!openSet[path];
      var box=el('div','tnode'); parent.appendChild(box);
      var row=el('div','trow');
      var dot=el('div', kids.length?('dot'+(open?' open':'')):'dot leaf', kids.length?(open?'−':'+'):'');
      var lb=el('div','lb '+(depth===1?'lv1':'lv2'), rich(n.label));
      row.appendChild(dot); row.appendChild(lb); box.appendChild(row);
      if(kids.length){
        row.onclick=function(){ if(open) delete openSet[path]; else openSet[path]=1; render(); };
        if(open) kids.forEach(function(k,j){ node(k,path+'.'+j,depth+1,box); });
      }
    }
    function collect(n,path,out){ out.push(path); (n.children||[]).forEach(function(c,i){ collect(c,path+'.'+i,out); }); return out; }
    b1.onclick=function(){ openSet={}; collect(ch.mindmap,'r',[]).forEach(function(p){ if(p!=='r') openSet[p]=1; }); render(); };
    b2.onclick=function(){ openSet={}; render(); };
    // 默认展开第一层
    (ch.mindmap.children||[]).forEach(function(n,i){ openSet['0.'+i]=1; });
    render();
    card.appendChild(tree); wrap.appendChild(card); root.appendChild(wrap);
  }

  /* --- 重点 --- */
  function panePoints(root,ch,s){
    (ch.points||[]).forEach(function(p){
      var c=el('div','card');
      c.innerHTML='<div class="between"><div class="ptitle">'+esc(p.title)+'</div>'+
        (p.key?'<span class="chip" style="background:#fff0e6;color:#e8590c">★ 重点</span>':'')+'</div>'+
        '<div class="psrc">'+esc(p.source||'')+'</div><hr>'+
        (p.items||[]).map(function(it){ return '<div class="bul"><div class="d">·</div><div class="t">'+rich(it)+'</div></div>'; }).join('');
      root.appendChild(c);
    });
  }

  /* --- 考点清单 --- */
  function paneKP(root,ch,s){
    var map={};
    (ch.questions||[]).forEach(function(q){
      (q.keyPoints||[]).forEach(function(k){
        map[k]=map[k]||{n:0,src:{},wrong:0};
        map[k].n++;
        var src=(q.sourceDetail||q.basis||q.source||'');
        map[k].src[src]=(map[k].src[src]||0)+1;
        if(state.wrong[q.id]) map[k].wrong++;
      });
    });
    var keys=Object.keys(map);
    if(!keys.length){ root.appendChild(el('div','empty','本章暂无考点标签')); return; }
    root.appendChild(el('div','small muted','本章共 '+keys.length+' 个考点 · 按错题数排序'));
    keys.sort(function(a,b){ return (map[b].wrong-map[a].wrong)||(map[b].n-map[a].n); });
    keys.forEach(function(k){
      var v=map[k];
      var c=el('div','card');
      c.innerHTML='<div class="between"><div style="font-size:16px;font-weight:800">'+esc(k)+'</div>'+
        (v.wrong?'<span class="chip" style="background:#fff0f0;color:#e03131">错 '+v.wrong+'</span>':'')+'</div>'+
        '<div class="small muted" style="margin-top:6px">关联 '+v.n+' 题</div>'+
        '<div class="small muted" style="margin-top:4px">出处：'+esc(Object.keys(v.src).join(' · '))+'</div>';
      root.appendChild(c);
    });
  }

  /* --- 练习 --- */
  var Q=null;
  function paneQuiz(root,ch,s){
    var st=stats(ch);
    // Q.chId==='__wrong__' 表示「只练错题」模式，不按本章重置
    if(!Q || (Q.chId!==ch.id && Q.chId!=='__wrong__')){
      var c=el('div','card');
      c.innerHTML='<div style="font-size:18px;font-weight:800">本章练习</div>'+
        '<div class="small muted" style="margin:8px 0 0">共 '+st.total+' 题 ｜ 重点 '+st.key+' ｜ 非重点 '+st.nonKey+'</div>'+
        '<div class="small muted" style="margin-top:4px">出题规则：<b>课件题目优先</b>，非重点题占比 ≤ '+Math.round(MAX_NONKEY*100)+'%，错题加权</div><hr>';
      [5,10,st.total].filter(function(v,i,a){return v>0&&a.indexOf(v)===i;}).forEach(function(n){
        var b=el('button','btn','开始 '+n+' 题'); b.style.background=s.color;
        b.onclick=function(){ startQuiz(ch,n); };
        c.appendChild(b);
      });
      var wl=wrongList();
      if(wl.length){
        var wb=el('button','btn ghost','只练错题（'+wl.length+' 题）');
        wb.onclick=function(){ startWrongQuiz(wl.map(function(x){return x.q;})); };
        c.appendChild(wb);
      }
      root.appendChild(c); return;
    }
    if(Q.i>=Q.list.length){ return quizDone(root,ch,s); }
    var q=Q.list[Q.i], ps=PS[q.priority]||PS[4], isFill=q.kind==='填空', isExample=(q.kind==='例题'||q.kind==='计算');
    // 进度
    var pr=el('div','row'); pr.style.marginBottom='12px';
    pr.appendChild(el('div','small',''+(Q.i+1)+' / '+Q.list.length));
    var bar=el('div','bar2'); bar.innerHTML='<i style="width:'+(((Q.i+(Q.done?1:0))/Q.list.length)*100)+'%;background:'+s.color+'"></i>';
    pr.appendChild(bar); root.appendChild(pr);

    var c=el('div','card');
    c.appendChild(el('div','row',
      '<span class="tag" style="background:'+ps.b+';color:'+ps.c+'">'+ps.l+'</span>'+
      '<span class="chip">'+esc(q.kind)+'</span>'+
      '<span class="small muted">'+esc(q.basis||'')+'</span>'));
    if(isKey(q)){
      var kp=el('div','kp');
      kp.appendChild(el('span','lab','考点'));
      q.keyPoints.forEach(function(k){ kp.appendChild(el('span','k',esc(k))); });
      c.appendChild(kp);
    }
    c.appendChild(el('div','stem', rich(q.stem)));

    if(isExample){
      /* ---- 例题：已知 → 求解 →（点开）解答过程 → 结果 ---- */
      if((q.given||[]).length){
        c.appendChild(el('div','exlabel','已知'));
        c.appendChild(el('div','exbox', q.given.map(function(g){
          return '<div class="bul"><div class="d">·</div><div class="t">'+rich(g)+'</div></div>';
        }).join('')));
      }
      if((q.ask||[]).length){
        c.appendChild(el('div','exlabel','求解'));
        c.appendChild(el('div','exbox', q.ask.map(function(g){
          return '<div class="bul"><div class="d">·</div><div class="t">'+rich(g)+'</div></div>';
        }).join('')));
      }
      var showSol = !!Q.done || !!Q.solOpen;
      if(showSol){
        if((q.steps||[]).length){
          c.appendChild(el('div','exlabel','解答过程'));
          c.appendChild(el('div','exbox steps', q.steps.map(function(s, i){
            return '<div class="bul"><div class="d">'+(i+1)+'</div><div class="t">'+rich(s)+'</div></div>';
          }).join('')));
        }
        if(q.result) c.appendChild(el('div','exres','结果：'+rich(q.result)));
      }
      var rb0=el('div','res');
      (q.why||[]).forEach(function(w){ rb0.appendChild(el('div','bul','<div class="d">›</div><div class="t">'+rich(w)+'</div>')); });
      if(q.basis) rb0.appendChild(el('div','basis','依据：'+esc(q.basis)));
      if(q.answerNote) rb0.appendChild(el('div','note','⚠️ '+esc(q.answerNote)));
      if(rb0.innerHTML) c.appendChild(rb0);
    } else if(isFill){
      var inp=el('input','fill'); inp.placeholder='输入答案'; inp.value=Q.text||'';
      inp.disabled=!!Q.done;
      inp.oninput=function(){ Q.text=inp.value; var b=$('qsubmit'); if(b) b.disabled=!inp.value.trim(); };
      if(Q.done) inp.style.background = Q.lastOk ? '#e8f6ec' : '#fff0f0';
      c.appendChild(inp);
    } else {
      (q.options||[]).forEach(function(op){
        var sel = q.kind==='多选' ? String(Q.pick||'').indexOf(op.k)>=0 : Q.pick===op.k;
        var isAns = String(q.answer).indexOf(op.k)>=0;
        var cls='opt', mark='';
        if(Q.done){
          if(isAns){ cls+=' ok'; mark='✓'; }
          else if(sel){ cls+=' no'; mark='✗'; }
        } else if(sel) cls+=' sel';
        var d=el('div',cls,'<div class="k">'+esc(op.k)+'</div><div class="t">'+rich(op.t)+'</div>'+(mark?'<div class="m">'+mark+'</div>':''));
        if(!Q.done) d.onclick=function(){
          if(q.kind==='多选'){
            var cur=String(Q.pick||'').split(''), i=cur.indexOf(op.k);
            if(i>=0) cur.splice(i,1); else cur.push(op.k);
            Q.pick=cur.sort().join('');
          } else Q.pick=op.k;
          render();
        };
        c.appendChild(d);
      });
    }

    if(Q.done){
      var ok=Q.lastOk;
      var rb=el('div','res');
      rb.appendChild(el('h4',null,'<span style="color:'+(ok?'#2f9e44':'#e03131')+'">'+(ok?'✓ 回答正确':'✗ 回答错误　正确答案：'+esc(q.answer))+'</span>'));
      (q.why||[]).forEach(function(w){ rb.appendChild(el('div','bul','<div class="d">›</div><div class="t">'+rich(w)+'</div>')); });
      if(q.basis) rb.appendChild(el('div','basis','依据：'+esc(q.basis)));
      if(q.answerNote) rb.appendChild(el('div','note','⚠️ '+esc(q.answerNote)));
      c.appendChild(rb);
    }

    var act=el('div'); act.style.marginTop='12px';
    if(isExample){
      /* 例题：先自己算，再点开看解答 */
      if(!Q.done){
        var sb=el('button','btn','看解答'); sb.style.background=s.color;
        sb.onclick=function(){ Q.solOpen=true; Q.done=true; render(); };
        act.appendChild(sb);
      } else {
        var nb2=el('button','btn', (Q.i+1>=Q.list.length?'看结果':'下一题')); nb2.style.background=s.color;
        nb2.onclick=function(){ Q.i++; Q.pick=''; Q.text=''; Q.done=false; Q.solOpen=false; render(); };
        act.appendChild(nb2);
      }
    } else if(!Q.done){
      var b=el('button','btn'+(isFill?'':'')+'','提交'); b.id='qsubmit'; b.style.background=s.color;
      if(isFill && !(Q.text||'').trim()) b.disabled=true;
      if(!isFill && !Q.pick) b.disabled=true;
      b.onclick=function(){
        Q.lastOk=judge(q, isFill?Q.text:Q.pick);
        if(Q.lastOk) markRight(q.id); else markWrong(q.id);
        Q.done=true; render();
      };
      act.appendChild(b);
    } else {
      var nb=el('button','btn', (Q.i+1>=Q.list.length?'看结果':'下一题')); nb.style.background=s.color;
      nb.onclick=function(){ Q.i++; Q.pick=''; Q.text=''; Q.done=false; render(); };
      act.appendChild(nb);
    }
    c.appendChild(act);
    root.appendChild(c);
    var ex=el('button','btn ghost','退出练习');
    ex.onclick=function(){ Q=null; render(); };
    root.appendChild(ex);
  }
  function startQuiz(ch,n){
    Q={ chId:ch.id, list:buildQuiz(ch,n), i:0, pick:'', text:'', done:false, wrong:[] };
    render();
  }
  function quizDone(root,ch,s){
    var right=Q.list.length-Q.wrong.length;
    var kps={}; Q.wrong.forEach(function(q){ (q.keyPoints||[]).forEach(function(k){ kps[k]=1; }); });
    var c=el('div','card center');
    c.innerHTML='<div style="font-size:18px;font-weight:800">完成</div>'+
      '<div class="big">'+right+' / '+Q.list.length+'</div>'+
      '<div class="small muted">正确率 '+Math.round(right/Q.list.length*100)+'%</div>'+
      (Q.wrong.length
        ? '<div class="small" style="margin-top:10px">错题考点：'+esc(Object.keys(kps).join(' · ')||'（无考点标签）')+'</div>'
        : '<div class="small" style="margin-top:10px">全对，很棒</div>')+'<hr>';
    var b=el('button','btn','再来一组'); b.style.background=s.color;
    b.onclick=function(){ startQuiz(ch, Q.list.length); }; c.appendChild(b);
    var b2=el('button','btn ghost','返回练习设置'); b2.onclick=function(){ Q=null; render(); }; c.appendChild(b2);
    root.appendChild(c);
  }

  /* --- 错题本（跨章累计） --- */
  function allQuestions(){
    var out=[];
    DATA.subjects.forEach(function(s){
      (s.chapters||[]).forEach(function(c){
        (c.questions||[]).forEach(function(q){ out.push({q:q, sub:s, ch:c}); });
      });
    });
    return out;
  }
  function wrongList(){
    return allQuestions().filter(function(it){ return (state.wrong[it.q.id]||0) > 0; })
      .sort(function(a,b){ return (state.wrong[b.q.id]||0)-(state.wrong[a.q.id]||0); });
  }
  function paneWrong(root){
    var list=wrongList();
    if(!list.length){
      root.appendChild(el('div','empty','还没有错题。<br>去「练习」做几题吧 —— 做错的题会自动收进这里。'));
      return;
    }
    var stat=el('div','card');
    stat.innerHTML='<div class="between"><div style="font-size:17px;font-weight:800">错题本</div>'+
      '<span class="chip" style="background:#fff0f0;color:#e03131">'+list.length+' 题</span></div>'+
      '<div class="small muted" style="margin-top:6px">按错误次数排序 · 累计记录在本机</div>';
    var b=el('button','btn','只练错题（'+list.length+' 题）');
    b.onclick=function(){ startWrongQuiz(list.map(function(x){return x.q;})); };
    stat.appendChild(el('hr')); stat.appendChild(b);
    root.appendChild(stat);

    list.forEach(function(it){
      var q=it.q, ps=PS[q.priority]||PS[4];
      var c=el('div','card');
      var kp=(q.keyPoints||[]).map(function(k){ return '<span class="k">'+esc(k)+'</span>'; }).join('');
      c.innerHTML='<div class="row"><span class="tag" style="background:'+ps.b+';color:'+ps.c+'">'+ps.l+'</span>'+
        '<span class="chip" style="background:#fff0f0;color:#e03131">错 '+(state.wrong[q.id]||0)+' 次</span>'+
        '<span class="small muted">'+esc(it.sub.name+' · '+it.ch.name)+'</span></div>'+
        (kp?'<div class="kp"><span class="lab">考点</span>'+kp+'</div>':'')+
        '<div class="stem" style="margin:10px 0 8px">'+rich(q.stem)+'</div>'+
        '<div class="basis">正确答案：<b>'+esc(q.answer)+'</b>　依据：'+esc(q.basis||'')+'</div>';
      root.appendChild(c);
    });
    var clr=el('button','btn ghost','清空错题本');
    clr.onclick=function(){ if(confirm('确定清空所有错题记录？')){ state.wrong={}; saveState(state); render(); } };
    root.appendChild(clr);
  }
  function startWrongQuiz(qs){
    Q={ chId:'__wrong__', list:qs, i:0, pick:'', text:'', done:false, wrong:[] };
    R.tab='quiz'; render();
  }

  /* ---------- 总渲染 ---------- */
  function render(){
    renderSubjects();
    var t=$('ttl'), back=$('back');
    if(!R.sub){ t.textContent='专业课'; back.style.display='none'; renderHome(); return; }
    var s=curSub();
    if(!R.ch){ t.textContent=s.name; back.style.display='block'; renderChapters(); return; }
    t.textContent=curCh().name; back.style.display='block'; renderDetail();
  }
  $('back').onclick=function(){
    if(R.ch){ R.ch=null; Q=null; render(); }
    else if(R.sub){ R.sub=null; render(); }
  };

  /* 记录本次练习错题（供结果页用）；例题不算错题 */
  var _oldRender = render;
  render = function(){
    var cur = Q && Q.list[Q.i];
    if(Q && Q.done && cur && Q.lastOk===false
       && cur.kind!=='例题' && cur.kind!=='计算'
       && Q.wrong.indexOf(cur)<0){
      Q.wrong.push(cur);
    }
    _oldRender();
  };

  /* 深链：?subject=boiler&chapter=boiler-intro&tab=points */
  try{
    var p=new URLSearchParams(location.search);
    if(p.get('subject')) R.sub=p.get('subject');
    if(p.get('chapter')) R.ch=p.get('chapter');
    if(p.get('tab')) R.tab=p.get('tab');
  }catch(e){}

  /* 注册 Service Worker（离线可用）。file:// 下会失败，忽略即可。 */
  if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }

  render();
})();
</script>
</body>
</html>
