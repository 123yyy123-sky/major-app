K=4~10**（完全依靠汽-水密度差）· 控制循环 **K=2~5**（主要依靠炉水循环泵）· 直流 **K=1**（一次通过，无循环）· 复合循环（低负荷多次循环、高负荷纯直流）。","⚠️ **自然循环、控制循环只能用于临界压力以下**；直流、复合循环适用于任何压力。","**水的临界参数**：t_c＝**374.15 ℃** · p_c＝**22.1 MPa** · ρ_c＝322 kg/m³ · h_c＝2095.2 kJ/kg。","临界压力下：**汽化潜热＝0** · **汽水密度差＝0** · **无汽水共存两相**。"]},{"id":"p-loop","title":"三种循环锅炉的特点（记忆锚点＝有汽包 / 无汽包）","key":true,"source":"视频 1.4 @ 26:55–28:55","items":["**自然循环**：汽包大 → 金属耗量大；热应力 → 启停受限、时间长；流动特性简单 → 可靠。","**控制循环**（强制流动代表）：汽包直径、壁厚减小；升降负荷快、启停时间缩短；水循环更可靠；循环泵高温高压 → 昂贵。","**直流**：**无汽包**；对负荷变化敏感、需防膜态沸腾 → 控制要求高；**启停快**（冷炉点火约 **40 分钟**供额定参数蒸汽，自然循环约 **2–4 小时**）；给水品质要求高。"]},{"id":"p-model","title":"1.5 锅炉型号（课件没有，好考点）","key":true,"source":"视频 1.5 @ 29:30–30:15","items":["例 `HG1952/25.4-YM1`：**HG**＝哈尔滨锅炉厂｜**1952**＝最大连续蒸发量 BMCR（t/h）｜**25.4**＝BMCR 过热蒸汽压力（**表压**，MPa）｜**YM**＝设计燃料为**烟煤**｜**1**＝设计序号。","例 `SG-1910/25.4-M951`：**SG**＝上海锅炉厂｜**M**＝燃煤。","**燃料代号**：**M 燃煤 · Y 燃油 · Q 燃气 · T 其它**。"]},{"id":"p-indicator","title":"1.6 主要特征指标与公式","key":false,"source":"视频 1.6 @ 31:05–32:20","items":["三方面：**安全性**（安全可靠）· **经济性**（经济节能）· **环保性能**（低污染）。","**事故率 ＝ 事故停运小时数 ÷（总运行小时数 ＋ 事故停运小时数）**；**可用率 ＝（运行总时数＋备用时数）÷ 统计期间总时数 ×100%**（电站可用率>90%）。","**锅炉效率 ＝ 有效利用热 Q₁ ÷ 输入热量 Q_r ×100%**；输入热量(MW)＝输入煤量(kg/s)×煤发热量(MJ/kg)。","排放（GB13223-2011，基准氧含量 6%）：烟尘 **20**／SO₂ **50**／NOx **100** mg/m³；**超低排放 10/35/50**。"]},{"id":"p-rest","title":"其余（一句话）","key":false,"source":"课件 slide 8 / 28 / 32–38","items":["**重要性**：供热系统热源设备 · 工矿企业动力及供热设备 · **火电站三大主机之一** · 节能环保。","**基本结构**：锅炉本体＝汽锅（汽水系统）＋炉子（燃烧设备）＋安全附件（水位计·压力表·安全阀）；另有钢架平台。","**要求**：①数量 ②质量 ③经济性（现代锅炉 90~92%，超临界 93~94%）④安全（连续运行≥5000h、可用率 90~95%）⑤适应性 ⑥环保。","**发展概况**：1949 装机 1849MW、煤耗 727g/(kW·h) → 四阶段 → 2011 首超美国、2012 世界最大、2010 煤耗 335g/(kW·h)。","**课程体系**：运行过程 → 所需设备 → 影响因素。"]}],"questions":[{"id":"bq-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 slide 9（1 分）","keyPoints":["基本参数","额定蒸发量","受热面蒸发率","锅炉热效率","表压"],"stem":"关于锅炉的基本参数，下列说法正确的是（　）","options":[{"k":"A","t":"锅炉的额定蒸发量是指锅炉在任意压力、温度下每小时产生的蒸汽量"},{"k":"B","t":"受热面蒸发率的单位是 kg/(m²·h)，表示每平方米蒸发受热面每小时产生的蒸汽量"},{"k":"C","t":"锅炉热效率 η 是指送进锅炉的燃料化学能全部转化为蒸汽内能的百分比"},{"k":"D","t":"蒸汽参数中的压力是指锅炉出口处蒸汽的绝对压力"}],"answer":"B","why":["A ✗ 额定蒸发量须在**额定参数（压力、温度）**下，不是「任意压力、温度」。","B ✓ 与课件 slide 7 原文完全一致。","C ✗ 热效率比的是**有效利用热 ÷ 输入热量**，不是「化学能全部转化」。","D ✗ 课件 slide 6 原文写「额定压力（**表压**）」，不是绝对压力。"],"basis":"课件 slide 6–7","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准"},{"id":"bq-2","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 slide 27（1 分）","keyPoints":["锅炉分类","工质流动方式","三种循环"],"stem":"下列哪一项属于按锅炉蒸发受热面内工质流动方式进行的分类？（　）","options":[{"k":"A","t":"层燃炉和室燃炉"},{"k":"B","t":"电站锅炉和工业锅炉"},{"k":"C","t":"自然循环锅炉和直流锅炉"},{"k":"D","t":"超临界锅炉和超超临界锅炉"}],"answer":"C","why":["A ✗ 层燃炉/室燃炉 → 按**燃烧方式**。","B ✗ 电站/工业锅炉 → 按**用途**。","C ✓ 按**蒸发受热面内工质的流动方式**。","D ✗ 超临界/超超临界 → 按**蒸汽压力**。"],"basis":"课件 slide 21、24","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准"},{"id":"bq-3","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频 1.4 @ 24:40","keyPoints":["循环倍率K"],"stem":"循环倍率 K 的定义式是（　）","options":[{"k":"A","t":"K ＝ 蒸发管出口蒸汽流量 D₀ ÷ 蒸发管内工质总流量 G"},{"k":"B","t":"K ＝ 蒸发管内工质总流量 G ÷ 蒸发管出口蒸汽流量 D₀"},{"k":"C","t":"K ＝ 给水量 ÷ 蒸发量"},{"k":"D","t":"K ＝ 循环水量 × 蒸汽量"}],"answer":"B","why":["K ＝ 蒸发管内工质总流量 **G** ÷ 蒸发管出口蒸汽流量 **D₀**（不要记反）。"],"basis":"视频 1.4 @ 24:40"},{"id":"bq-4","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频 1.4 @ 24:40","keyPoints":["循环倍率K","三种循环"],"stem":"自然循环锅炉的循环倍率 K 一般为（　）","options":[{"k":"A","t":"1"},{"k":"B","t":"2 ~ 5"},{"k":"C","t":"4 ~ 10"},{"k":"D","t":"10 ~ 20"}],"answer":"C","why":["自然循环 **4~10**；控制循环 **2~5**；直流 **=1**。"],"basis":"视频 1.4 @ 24:40"},{"id":"bq-5","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频 1.4 @ 26:35（老师整行大红圈）","keyPoints":["循环倍率K","临界压力","适用范围"],"stem":"关于自然循环与控制循环锅炉的适用范围，正确的是（　）","options":[{"k":"A","t":"适用于任何压力"},{"k":"B","t":"只能适用于临界压力以下"},{"k":"C","t":"只能适用于超临界压力以上"},{"k":"D","t":"与压力无关"}],"answer":"B","why":["**自然循环、控制循环只能用于临界压力以下**；直流、复合循环适用于任何压力。","原因：压力提高后汽-水密度差减小，自然循环推动力下降。"],"basis":"视频 1.4 @ 26:35"},{"id":"bq-6","kind":"填空","priority":2,"source":"视频考点","sourceDetail":"视频 1.4 @ 24:10","keyPoints":["水的临界参数"],"stem":"水的临界温度 t_c ＝ ____ ℃，临界压力 p_c ＝ ____ MPa。（填数值）","answer":"374.15 ℃ ； 22.1 MPa","why":["另记：ρ_c＝322 kg/m³，h_c＝2095.2 kJ/kg。"],"basis":"视频 1.4 @ 24:10"},{"id":"bq-7","kind":"多选","priority":2,"source":"视频考点","sourceDetail":"视频 1.4 @ 24:10","keyPoints":["水的临界参数","临界状态"],"stem":"在临界压力下，下列说法正确的有（　）","options":[{"k":"A","t":"汽化潜热 = 0"},{"k":"B","t":"汽水密度差 = 0"},{"k":"C","t":"存在明显的汽水共存两相"},{"k":"D","t":"没有汽水共存的两相"}],"answer":"ABD","why":["临界压力下汽化潜热与汽水密度差都归零，**不存在汽水共存两相**，故 C 错。"],"basis":"视频 1.4 @ 24:10"},{"id":"bq-8","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频 1.5 @ 30:15","keyPoints":["锅炉型号","表压"],"stem":"锅炉型号 HG1952/25.4-YM1 中，「25.4」表示（　）","options":[{"k":"A","t":"最大连续蒸发量，单位 t/h"},{"k":"B","t":"BMCR 过热蒸汽压力（表压），单位 MPa"},{"k":"C","t":"过热蒸汽温度，单位 ℃"},{"k":"D","t":"设计序号"}],"answer":"B","why":["1952＝BMCR（t/h）；**25.4＝BMCR 过热蒸汽压力（表压，MPa）**；YM＝设计燃料为烟煤；1＝设计序号。"],"basis":"视频 1.5 @ 30:15"},{"id":"bq-9","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频 1.5 @ 29:30","keyPoints":["锅炉型号","燃料代号"],"stem":"锅炉型号中，燃料代号 Y 表示（　）","options":[{"k":"A","t":"燃煤"},{"k":"B","t":"燃油"},{"k":"C","t":"燃气"},{"k":"D","t":"其它"}],"answer":"B","why":["**M 燃煤 · Y 燃油 · Q 燃气 · T 其它**。"],"basis":"视频 1.5 @ 29:30"},{"id":"bq-10","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频 1.3 @ 13:50","keyPoints":["除渣除灰","灰量比例"],"stem":"燃煤锅炉中，除渣与除灰分别约占总灰量的（　）","options":[{"k":"A","t":"除渣 5–10%，除灰 90–95%"},{"k":"B","t":"除渣 90–95%，除灰 5–10%"},{"k":"C","t":"各占 50%"},{"k":"D","t":"除渣 30%，除灰 70%"}],"answer":"A","why":["**除渣**＝大块熔渣，约占 **5–10%**，水冷壁冷却成固态渣由炉底排放；**除灰**＝烟气携带细灰，约占 **90–95%**，除尘器分离后送灰场。"],"basis":"视频 1.3 @ 13:50"},{"id":"bq-11","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频 1.3 @ 14:35","keyPoints":["烟气排放","FGD","SCR"],"stem":"烟气排放系统中，FGD 与 SCR 分别用于脱除（　）","options":[{"k":"A","t":"FGD 脱硝 NOx，SCR 脱硫 SO₂"},{"k":"B","t":"FGD 脱硫 SO₂，SCR 脱硝 NOx"},{"k":"C","t":"两者都脱硫"},{"k":"D","t":"两者都脱硝"}],"answer":"B","why":["**FGD**＝Flue Gas Desulfurization，湿法烟气**脱硫 SO₂**；**SCR**＝Selective Catalytic Reduction，烟气**脱硝 NOx**。"],"basis":"视频 1.3 @ 14:35"},{"id":"bq-12","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频 1.4 @ 28:00","keyPoints":["直流锅炉","启停"],"stem":"关于直流锅炉的特点，下列错误的是（　）","options":[{"k":"A","t":"无汽包"},{"k":"B","t":"对负荷变化敏感，控制要求高"},{"k":"C","t":"启停慢，冷炉点火需 2–4 小时"},{"k":"D","t":"对给水品质要求高"}],"answer":"C","why":["直流锅炉**启停快**：冷炉点火约 **40 分钟**即可供额定参数蒸汽；需 2–4 小时的是**自然循环**锅炉。"],"basis":"视频 1.4 @ 28:00"},{"id":"bq-13","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频 1.4 @ 29:20","keyPoints":["燃烧方式","流化床"],"stem":"流化床燃烧的主要特点不包括（　）","options":[{"k":"A","t":"燃烧温度低，约 850℃"},{"k":"B","t":"煤种适应性好"},{"k":"C","t":"床内可脱硫"},{"k":"D","t":"NOx 排放很高，无温室气体问题"}],"answer":"D","why":["流化床**温度低故 NOx 低**，但会产生另一种温室气体 **N₂O**，故 D 错。床内脱硫反应：CaCO₃=CaO+CO₂；CaO+SO₂+½O₂=CaSO₄。"],"basis":"视频 1.4 @ 19:50"},{"id":"bq-14","kind":"单选","priority":3,"source":"教材考点","sourceDetail":"教材绪论 复习思考题 1","keyPoints":["三大主机","火电厂"],"stem":"火力发电厂的三大主要设备（三大主机）是（　）","options":[{"k":"A","t":"锅炉、汽轮机、发电机"},{"k":"B","t":"锅炉、磨煤机、送风机"},{"k":"C","t":"汽轮机、凝汽器、给水泵"},{"k":"D","t":"锅炉、除尘器、烟囱"}],"answer":"A","why":["燃料化学能 → 锅炉热能 → 汽轮机机械能 → 发电机电能；**三大主机＝锅炉·汽轮机·发电机**。"],"basis":"教材绪论第一节"},{"id":"bq-15","kind":"单选","priority":4,"source":"补充练习","sourceDetail":"据课件 slide 28","keyPoints":[],"stem":"锅炉本体由哪三部分组成（　）","options":[{"k":"A","t":"汽锅、炉子、安全附件"},{"k":"B","t":"炉膛、烟道、烟囱"},{"k":"C","t":"过热器、省煤器、空预器"},{"k":"D","t":"给水泵、送风机、引风机"}],"answer":"A","why":["本体＝**汽锅**（汽水系统）＋**炉子**（燃烧设备）＋**安全附件**（水位计·压力表·安全阀）。"],"basis":"课件 slide 28"},{"id":"bq-16","kind":"单选","priority":4,"source":"补充练习","sourceDetail":"据视频 1.7","keyPoints":[],"stem":"世界上最早建成燃煤发电厂的国家与年份是（　）","options":[{"k":"A","t":"1875 年，法国"},{"k":"B","t":"1879 年，美国"},{"k":"C","t":"1882 年，中国"},{"k":"D","t":"1890 年，英国"}],"answer":"A","why":["1875 年**法国**建成世界最早煤电厂（巴黎火车站照明）；1879 年美国旧金山为最早**售电**电厂；1882 年上海电光公司为我国最早燃煤电厂。"],"basis":"视频 1.7 @ 32:30"}]},{"id":"boiler-ch1","name":"第一章 燃料及燃烧计算","subtitle":"燃料 · 煤的成分 · 燃料特性 · 煤的分类 · 液气燃料 · 燃烧计算","status":"在读","overview":"本章六节：燃料种类 → 煤的成分（元素/工业分析、基准换算）→ 燃料特性（发热量、折算成分、灰的性质）→ 煤的分类 → 液体和气体燃料 → 燃烧计算（空气量、过量空气系数、烟气量、焓）。教材另有第七节「烟气分析」。","mindmap":{"label":"第一章 燃料及燃烧计算","children":[{"label":"第一节 锅炉用燃料","children":[{"label":"按状态：固体（煤·炭·木材）· 液体（汽油·煤油·石油）· 气体（天然气·煤气·沼气）"},{"label":"按类型：化石燃料 · 生物燃料 · 核燃料"},{"label":"注意：部分气体燃料可压缩为液体（如液化石油气）"}]},{"label":"第二节 煤的成分","children":[{"label":"一、元素分析与工业分析"},{"label":"二、煤的成分 C H O N S M A"},{"label":"三、煤中成分对锅炉工作的影响 ★"},{"label":"四、成分基准及其换算 ★★"}]},{"label":"第三节 燃料的某些特性","children":[{"label":"一、发热量 Q_gr / Q_net ★"},{"label":"二、燃料的折算成分（基准 4187 kJ/kg）"},{"label":"三、灰的性质 DT / ST / FT ★"},{"label":"视频补充：弹筒发热量 Q_b · 基准换算 4×4 表 ★"},{"label":"视频补充：结渣性准则（ST 1390/1260，课件为 1350）· 长渣/短渣 · 积灰vs结渣"}]},{"label":"第四节 煤的分类","children":[{"label":"一、分类方法（按煤化程度三大类）"},{"label":"二、动力煤：无烟煤 · 贫煤 · 烟煤 · 褐煤"},{"label":"成煤（煤化）过程：泥炭→褐煤→亚烟煤→烟煤→无烟煤"},{"label":"视频补充：GB 5751-2009 分界 V_daf <10% / 10~20% / 20~37% / >37%"},{"label":"视频补充：全球存量占比（低阶煤47%·烟煤52%·无烟煤1%）与用途"}]},{"label":"第五节 液体和气体燃料","children":[{"label":"液体燃料：粘度 · 凝固点 · 闪点 · 含硫量 · 灰分"},{"label":"气体燃料：成分、种类与优点"},{"label":"视频补充：恩氏粘度·闪点(油库低于闪点10℃)·燃点(≥5s)·静电接地·钒酸钠600℃"},{"label":"视频补充：气体燃料低位热值比（液化石油气 113000 → 高炉煤气 3780 kJ/Nm³）"}]},{"label":"第六节 燃料的燃烧计算 ★★","children":[{"label":"一、所需空气量与过量空气系数"},{"label":"　理论氧气量 V⁰_O₂ · 理论空气量 V⁰ · 过量空气系数 α · 漏风系数"},{"label":"二、燃烧产物计算（理论 / 实际）"},{"label":"三、空气与燃烧产物的焓计算"}]},{"label":"（教材另有）第七节 烟气分析"},{"label":"★ 视频「知识点总结」26 问自测（考前清单）"}]},"points":[{"id":"p-ch1-fuel","title":"第一节 燃料的分类","key":false,"source":"课件 p002","items":["**按状态分**：固体燃料（煤、炭、木材）· 液体燃料（汽油、煤油、石油）· 气体燃料（天然气、煤气、沼气）。","**按类型分**：化石燃料（石油、煤、油页岩、甲烷、油砂）· 生物燃料 · 核燃料。","注意：一些气体燃料可压缩为液体，如**液化石油气**。"]},{"id":"p-ch1-analysis","title":"煤的两种分析","key":true,"source":"课件 p003","items":["**元素分析**：测定煤中有机物里 **碳、氢、氧、氮、硫**的质量百分比 —— 是**燃烧计算的依据**。","**工业分析（电厂）**：按规定条件把煤样**干燥、加热、燃烧**，测定 **水分、挥发分、固定碳、灰分** —— 了解煤在燃烧时的特性。","记住两组：元素分析＝**C H O N S**；工业分析＝**M V FC A**。"]},{"id":"p-ch1-compo","title":"煤的成分与对锅炉工作的影响 ★（选择题考点）","key":true,"source":"课件 p004–p005；单选题 p006","items":["**碳 C**：含量最多的可燃元素（无烟煤 >70%），发热量主要来源，**1 kg 碳完全燃烧约放 32700 kJ**。","**氢 H**：含量 3~6%，发热量很高，**1 kg 氢燃烧约放 120000 kJ**。","**氧 O、氮 N**：不可燃成分；年代浅的煤含氧可达 40%，氮一般 0.5%~2.0%。","**硫 S**：**有害成分**，约占可燃成分 8%，三种形态（有机硫、黄铁矿硫、硫酸盐硫），前两种可燃，燃烧热 9040 kJ/kg。","**水分 M**：102~110 ℃ 干燥到恒重失去的重量；含量约 2~60%。","**灰分 A**：(815±25) ℃ 灼烧 2 小时后的剩余物；含量 10%~50%。","⚠️ **它们对锅炉工作的影响（p005，单选原题就在这）**：","　· **硫分**：SO₂ → 硫酸蒸汽腐蚀受热面；缺氧生成 H₂S 腐蚀高温区水冷壁；污染大气；硫化铁加剧磨煤机磨损。","　· **灰分**：妨碍可燃质与空气接触、燃烧困难、热损失增加；炉膛结渣、受热面积灰磨损；污染环境。","　· **水分**：**降低燃烧温度、不利燃烧**；降低锅炉效率；引风机耗能增加；**为低温受热面腐蚀提供环境**；造成堵煤、磨煤机出力下降。","　· **挥发分**：失去水分的煤样隔绝空气加热至 (900±10) ℃ 析出的气体产物；**含量高 → 煤易着火、燃尽、燃烧稳定**；也是**煤分类**的重要依据。"]},{"id":"p-ch1-basis","title":"成分基准及其换算 ★★（选择题考点）","key":true,"source":"课件 p007；单选题 p008；教材第一章第二节四","items":["煤中水分、灰分会随外界条件变化，其他成分百分含量随之改变 → **说明成分必须注明基准**。","**收到基（应用基）ar**：以**进入锅炉房的原煤**为基准 —— C+H+O+N+S+A+M = 100%。","**空气干燥基 ad**：经**自然干燥、除去外部水分** —— C+H+O+N+S+A+M = 100%。","**干燥基 d**：**除去全部水分** —— C+H+O+N+S+A = 100%；**常用来表示灰分**。","**干燥无灰基 daf**：**除去全部水分和灰分** —— C+H+O+N+S = 100%；常表示煤中有机物的元素成分和**挥发分**。","🔑 **换算口诀**：分母里**去掉谁**，就是哪个基准。收到基啥都不去；空气干燥基去外部水；干燥基去全水；干燥无灰基再额外去灰。","热力计算一律用**收到基**；灰分含量常用**干燥基**；挥发分/元素成分常用**干燥无灰基**。"]},{"id":"p-ch1-cv","title":"发热量：高位 vs 低位 ★★","key":true,"source":"课件 p009；教材第一章第三节一","items":["**发热量 Q**：单位质量固体/液体燃料完全燃烧放出的热量（kJ/kg）；气体燃料按单位容积（kJ/m³）。","**高位发热量 Q_gr**：完全燃烧放出的热量，**含**生成水蒸汽的汽化潜热。","**低位发热量 Q_net**：完全燃烧放出的热量，**扣除**随烟气带走的水蒸汽汽化潜热 —— **锅炉一律用 Q_net,ar**。","两者关系：`Q_net,ar = Q_gr,ar − r(9H_ar/100 + M_ar/100)`，其中 r 为水的汽化潜热。","**经验估算公式**（课件蓝色标注）：`Q_gr,ar = 339C_ar + 1256H_ar + 109S_ar − 109O_ar`。"]},{"id":"p-ch1-red","title":"燃料的折算成分与标准煤","key":false,"source":"课件 p010；教材第一章第三节二","items":["把各成分**折算到统一发热量 4187 kJ/kg** 下表示含量，下标 **red**：","`M_ar,red = 4187·M_ar / Q_net,ar`；`S_ar,red`、`A_ar,red` 同理。","判据：折算水分 **>8%** → 高水分；折算硫分 **>0.2%** → 高硫分；折算灰分 **>4%** → 高灰分。","**标准煤**：规定 `Q_net,ar = 29310 kJ/kg`（即 7000 kcal/kg）的煤。"]},{"id":"p-ch1-ash","title":"灰的性质：DT / ST / FT ★","key":true,"source":"课件 p011；教材第一章第三节三","items":["灰锥加热的三个特征温度：**DT 变形温度**（锥顶变圆或开始倾斜）→ **ST 软化温度**（锥顶弯至锥底或萎缩成球形）→ **FT 流化温度**（呈流体状态能沿平面流动）。","**固态排渣炉要求灰的软化温度 ST > 1350 ℃**（不易结渣）；**炉膛出口温度至少低于 ST 50~100 ℃**。","**烧结性**：影响对流受热面（尤其过热器）的积灰特性，**与熔融性无直接关系**。","影响因素：煤灰成分（碱性物质越多烧结性越强）、SO₂ 含量、温度、烧结时间。"]},{"id":"p-ch1-coal","title":"煤的分类与四种动力煤 ★（选择题考点）","key":true,"source":"课件 p012–p016；单选题 p017","items":["按**煤化程度**分三大类：**褐煤 → 烟煤 → 无烟煤**；分类指标含干燥无灰基挥发分、黏结指数等（GB 5751-86）。","**无烟煤**（白煤）：煤化程度最高，挥发分低，**着火和燃尽都比较困难**，发热量高（可达 21000~25000 kJ/kg 量级）。","**贫煤**：变质程度最高的烟煤，性质在无烟煤与烟煤之间，**挥发分 10%~20%**。","**烟煤**：煤化程度高于褐煤、低于无烟煤，**挥发分 20%~40%**，发热量较高，**燃烧时火焰高而有烟**。","**褐煤**：富含挥发分（**>37%**）易燃烧并冒烟，水分大、**空气中易风化碎裂**、燃点低（约 270 ℃）、**储存超两个月易自燃**，堆放不应超过两米。","🔑 记忆锚点：**挥发分**高低顺序 褐煤 > 烟煤 > 贫煤 > 无烟煤；**着火难易**则相反。"]},{"id":"p-ch1-liq","title":"液体燃料与气体燃料","key":false,"source":"课件 p018–p019；教材第一章第五节","items":["锅炉液体燃料主要是**重油和渣油**（原油炼制后的残油）。特性指标：**粘度、凝固点、闪点、含硫量、灰分**。","**粘度**：温度↑粘度↓，压力↑粘度↑；重油粘度过大，**输送前必须加热**。","**闪点**：燃油挥发气体与空气混合达到一定浓度、可被火星点燃时的油温。","**灰分**：量少但常含**钒和钠**，燃烧生成熔点低的**钒酸钠** → 受热面**高温腐蚀**。","**气体燃料**：含低分子碳氢化合物、氢、一氧化碳等可燃气体；天然的有沼气、天然气；加工的有焦炉气、水煤气、发生炉煤气、石油气、高炉气。","优点：可管道远距离输送、不含灰分、着火温度低易控制、可调氧化/还原气氛、可预热、可利用低级固体燃料。"]},{"id":"p-ch1-air","title":"燃烧计算：空气量与过量空气系数 ★★","key":true,"source":"课件 p020–p023；例题 p023；教材第一章第六节","items":["**燃烧化学式**：C+O₂=CO₂；2C+O₂=2CO（不完全燃烧）；2H₂+O₂=2H₂O；S+O₂=SO₂。","**理论氧气量**（1 kg 燃料完全燃烧）：`V⁰_O₂ = 1.866(C_ar/100) + 5.56(H_ar/100) + 0.7(S_ar/100) − 0.7(O_ar/100)` m³/kg","**理论空气量**：`V⁰ = V⁰_O₂/0.21 = 0.0889(C_ar + 0.375S_ar) + 0.265H_ar − 0.0333O_ar` m³/kg","　　（烟气分析时**硫和碳的燃烧产物一起测定**；所算空气量是**不含水蒸气的理论干空气量**。）","**过量空气系数 α**：实际空气量与理论空气量之比。","**推荐值**（固态排渣煤粉炉）：无烟煤/贫煤/劣质烟煤 **α″_f = 1.20~1.25**；烟煤/褐煤 **α″_f = 1.15~1.20**。","**漏风系数**：漏入的空气量与理论空气量之比 —— 使换热变差、排烟热损失和引风机能耗增加、**降低锅炉经济性**。","**实际空气量**：`V = αV⁰`。"]},{"id":"p-ch1-gas","title":"燃烧计算：烟气量与焓 ★★","key":true,"source":"课件 p024–p026；教材第一章第六节","items":["**理论烟气（1 kg 燃料）**：","　`V_CO₂ = 1.866(C_ar/100)`；`V_SO₂ = 0.7(S_ar/100)` m³/kg","　`V⁰_N₂ = 0.79V⁰ + 0.8(N_ar/100)` m³/kg","　`V⁰_H₂O = 11.1(H_ar/100) + 1.24(M_ar/100) + 0.0161V⁰` m³/kg","　`V⁰_g = V_RO₂ + V⁰_N₂ + V⁰_H₂O` m³/kg","**实际烟气容积**：`V_g = V⁰_g + (α−1)V⁰ + 0.0161(α−1)V⁰` m³/kg","　不完全燃烧时：`V_g = V_CO + V_CO₂ + V_SO₂ + V_O₂ + V_N₂ + V_H₂O`","**烟气质量**：`G_g = 1 − (A_ar/100) + 1.306αV⁰` kg/kg","**焓计算**：`I⁰_a = V⁰(cθ)_a`；`I_a = βV⁰(cθ)_a = βI⁰_a`；`I_g = I⁰_g + (α−1)I⁰_a + I_fa`；`I_fa = (α_fa·A_ar/100)(cθ)_ash`"]},{"id":"p-ch1-v-water","title":"工业分析详解：水分与四种成分（视频补充）","key":true,"source":"视频 第2集 @ 10:55–13:10","items":["**工业分析定义**：按煤在着火、燃烧过程中各成分的变化，分析 **水分、挥发分、固定碳、灰分**四种成分的质量百分数。","恒等式：`水分 + 灰分 + 挥发分 + 固定碳 = 100%`","测定流程：自然干燥 → 外部水分；加热干燥至 **145±5 ℃** → 内部水分；隔绝空气加热至 **920 ℃** → 有机物分解析出气体＝**挥发分**；剩余焦炭在 **(815±10) ℃** 燃烧 → 余下**灰分**、烧掉的是**固定碳**。","**水分三分类**（视频展开）：","　· **外部水分**（free moisture）：表面水、颗粒间水、直径 >0.1 μm 的毛细水；前两者合称**体相水**，解吸热 **2.43 MJ/kg**；**与外界环境和煤的粒度有关，与煤种无关**，常温下可失去。","　· **内部水分**（interior adsorption water）：吸附/凝聚在 <0.1 μm 微孔中，与羧基(-COOH)、羟基(-OH)形成**氢键**；解吸热 **>3.0 MJ/kg**；**与煤种有关**，需加热（烟煤/无烟煤 110 ℃，褐煤 145 ℃）。","　· **化合水**（结晶水）：有确定数量关系（高岭土、石膏），需 **200 ℃ 以上**才析出。","⚠️ **煤的工业分析不考虑结晶水**，也不计 200~300 ℃ 下 -COOH 分解产生的那部分水。","**挥发分 V**：失去水分的煤隔绝空气加热至 920 ℃ 析出的气体。主要成分 **CₘHₙ、H₂、CO、H₂S 等可燃气体** + O₂、CO₂、N₂ 等不可燃气体。一般用**干燥无灰基 V_daf** 表示。煤化程度越低，释放挥发分温度越低（褐煤 <200 ℃，贫煤/无烟煤 400 ℃）。","**灰分 A**：燃料完全燃烧后形成的固体残余物。来源于成煤植物本身的矿物质（**内在灰分**）+ 开采运输掺入的杂质（**外在灰分**）。多数煤 **7%~40%**，个别少至 4~5%、多至 60~70%。","**灰分成分**：SiO₂ 20~60% · Al₂O₃ 10~35% · Fe₂O₃ 5~35% · CaO 1~20% · MgO 0.3~4% · TiO₂ 0.5~2.5% · Na₂O+K₂O 1~4% · CaSO₄ 等 0.1~12%"]},{"id":"p-ch1-v-basistable","title":"基准换算系数表（视频给出完整 4×4 表）★★","key":true,"source":"视频 第2集 @ 20:55 表格","items":["记法：**「已知」在左列，「所求」在首行**，交叉格即换算系数 `x = K·x₀`。","**收到基 →** 空气干燥基 `(100−M_ad)/(100−M_ar)`｜干燥基 `100/(100−M_ar)`｜干燥无灰基 `100/(100−M_ar−A_ar)`","**空气干燥基 →** 收到基 `(100−M_ar)/(100−M_ad)`｜干燥基 `100/(100−M_ad)`｜干燥无灰基 `100/(100−M_ad−A_ad)`","**干燥基 →** 收到基 `(100−M_ar)/100`｜空气干燥基 `(100−M_ad)/100`｜干燥无灰基 `100/(100−A_d)`","**干燥无灰基 →** 收到基 `(100−M_ar−A_ar)/100`｜空气干燥基 `(100−M_ad−A_ad)/100`｜干燥基 `(100−A_d)/100`","对角线均为 **1**（自己换自己）。","🔑 **推导依据只有一条：质量平衡**。视频给的推导（收到基→干燥无灰基）：","　取收到基煤 100，则干燥无灰基质量 = `100 − M_ar − A_ar`；","　碳的绝对质量相等：`100 × C_ar/100 = (100 − M_ar − A_ar) × C_daf/100`","　∴ `C_daf = [100/(100 − M_ar − A_ar)] × C_ar`","**工业分析的质量守恒**（各基准）：`V_ar + FC_ar + A_ar + M_ar = 100%`；干燥基 `V_d + FC_d + A_d = 100%`；干燥无灰基 `V_daf + FC_daf = 100%`。"]},{"id":"p-ch1-v-bomb","title":"发热量的实验测定：弹筒发热量（视频补充，课件没有）","key":false,"source":"视频 第2集 @ 25:25–26:50","items":["**弹筒发热量 Q_b**：实验室用**氧弹量热仪**实测（1 g 煤样）。条件：正压氧气 **2.6~3 MPa** 充分反应，再冷却回原始温度。","为什么 Q_b **高于**实际燃烧？C 燃烧、水凝结放热；而 **S 和 N 瞬时氧化温度达 1500 ℃**，与过量氧反应并溶于弹筒内水，**生成硫酸、硝酸**，把生成酸的反应热也算了进去。","**换算**：`Q_gr,ad = Q_ad,b − (95·S_ad,b + α·Q_ad,b)`","　`S_ad,b`＝弹筒洗液测得的含硫量(%)；`α`＝硝酸生成热的比例系数，按 `Q_ad,b` 取值：","　**<16700 kJ/kg → α=0.001**｜**16700~25100 → 0.0012**｜**>25100 → 0.0016**","**高低位热值的国际差异**（视频补充）：**日本、北美**习惯用**高位**热值；**中国、前苏联、德国、OECD**按**低位**换算；有的国家两者都用。煤与石油的高低热值差 **约 5%**，天然气和煤气约 **10%**。"]},{"id":"p-ch1-v-slag","title":"灰的结渣性与积灰（视频补充，重点）","key":true,"source":"视频 第2集 @ 35:55–40:20","items":["⚠️ **口径冲突必看**：视频给「**ST > 1390 ℃** 结渣可能性不大；ST 1260~1390 中等；ST < 1260 严重结渣」；**课件给的是 ST > 1350 ℃ 不易结渣**。按本库规则 **以课件为准**，视频数值并列参考。","**影响灰熔融性的因素**：","　· **内因（灰的化学组成）**：酸性氧化物 SiO₂、Al₂O₃ → **灰熔点上升**；碱性氧化物 Fe₂O₃、CaO、MgO → **灰熔点降低**。适当加酸性氧化物可提高灰熔点。","　· **外因（气氛）**：**还原性气氛**下 FeO 与 SiO₂ 生成 **2FeO·SiO₂（熔点 1065 ℃）**→ 灰熔点**降低**；氧化性气氛则不会。","**长渣 vs 短渣**：**长渣** DT-ST 差 **200~400 ℃**，固液共存区间大、冷却时粘度长时间大 → **易结渣**；**短渣**差 **100~200 ℃**，凝固快 → 不易结渣。","**结渣**：炉内软化或熔化的灰粒碰撞水冷壁/受热面被冷却凝固形成渣层，主要出现在**辐射受热面**（温度高）。","**积灰** = 温度低于灰熔点的灰粒在受热面沉积；分**高温积灰（沾污）**与**低温积灰**。高温积灰主要在屏式过热器、对流过热器；低温积灰在低于酸露点的壁面（空预器）。","**危害**：影响传热 —— **下降 30~60%**，炉膛出口温度升高，只能低负荷运行甚至停炉清渣；**热偏差** → 管壁超温、**爆管**、落渣熄火。","**煤灰形态**：**粉煤灰/飞灰 75~85%**（颗粒小，含 SiO₂、Al₂O₃ 及未燃碳，除尘器收集）；**底灰/炉渣 15~25%**（较粗，冷灰斗排出）。"]},{"id":"p-ch1-v-burn","title":"燃烧特性：热分解与热重分析（视频补充）","key":false,"source":"视频 第2集 @ 40:35–41:35","items":["**煤的热分解机理（不通氧）**：T≤105 ℃ 析出水蒸汽与部分气体；105~300 ℃ 水分完全析出，伴 CO、CO₂ 及少量焦油；300~500 ℃ 煤焦油和气体析出；500~700 ℃ 半焦分解，含氢较多的物质析出；**759~1000 ℃ 半焦继续热解，形成焦炭（char）**。","**热重分析 TGA（可通空气）**：仅用元素分析、工业分析还不能完全反映煤在**着火和燃尽**两大环节的表现；用热天平测**重量随温度的变化**，得到 TG 曲线与失重速率曲线，不同温升率结果不同。"]},{"id":"p-ch1-v-liqgas","title":"液体与气体燃料详解（视频补充）","key":false,"source":"视频 第2集 @ 50:45–52:45","items":["锅炉液体燃料主要是**重油、渣油**，以及**轻柴油**（广泛用于锅炉点火和稳定燃烧）。重油/渣油＝原油提取汽油柴油后的残油。","**凝固点**：混合物无固定值。石油工业规定：试样油在试管内冷却，**试管倾斜 45°、油面 1 min 内保持不变**时的油温。","**粘度**：国内电厂用**恩氏粘度 °E**；压力↑粘度↑，温度↑粘度↓。重油输送前应加热；**为保证雾化质量，油喷嘴前粘度应 <4 °E，油温应在 100 ℃ 以上**。","**闪点**：油面油气达一定浓度、遇火源发出短暂闪光时的油温，是**安全防火的重要指标**。**油库油温至少应比闪点低 10 ℃**（压力容器和管道内无自由液面则不受此限）。","**燃点**：油气与空气混合物遇明火能连续燃烧、**持续不少于 5 s** 时的最低油温。","**静电特性**：油是不良导体，与空气、钢铁、布摩擦易产生静电，放电火花可致燃烧爆炸；产生强弱与**流速、管道材料与粗糙度、空气湿度、油中杂质**有关 → **输油贮油设备及管线必须良好接地**。","**含硫量**：石油中硫以硫化氢、单质硫、各种硫化物存在；含硫量大时注意**低温受热面腐蚀**。","**灰分**：很少，但含钒、钠、钾、钙化合物。钒与钠燃烧生成**钒酸钠，熔点约 600 ℃**；在**壁温高于 610 ℃** 的过热器上形成液膜 → **高温腐蚀**。","**典型气体燃料低位热值**（kJ/Nm³，1 atm 0 ℃）：液化石油气（丙烷乙烷）**113000**｜天然气（甲烷）**36500**｜焦炉煤气（H₂、CH₄）**17000**（可用城市供气）｜发生炉煤气（N₂、CO、H₂）**5950**｜高炉煤气（N₂、CO、H₂、CO₂）**3780**","单一可燃气热值：CH₄ **35807** · CO **12640** · H₂ **10779** · C₂H₆ **64350** · C₃H₈ **93180** kJ/Nm³"]},{"id":"p-ch1-v-summary","title":"★ 视频「知识点总结」26 问自测（等于考试大纲）","key":true,"source":"视频 第2集 @ 52:45–54:10（老师逐条列出的复习提纲）","items":["1. 元素分析的定义","2. 五种元素各自在煤中的作用","3. 工业分析的定义及分析方法","4. 挥发分的主要成分（主要可燃，CO₂、N₂ 等不可燃）","5. 四个煤的成分计算基准之间的区别","6. 煤的三个发热量概念之间的区别","7. 低位发热量的定义","8. 灰熔点高容易结渣吗？","9. 区分灰熔点的变形、软化、流动三个温度","10. 结渣的简单机理","11.（原帧未拍到，应在前一帧）","12. 炉内哪些区域容易结渣 —— 水冷壁、炉膛上部辐射受热面","13. 灰的成分对灰熔点的影响：酸性氧化物**升高**，碱性**降低**","14. 炉内烟气气氛对灰熔点的影响：氧化、还原","15. 我国动力用煤的分类及分类方法","16. 各类动力用煤的燃烧特性","17. 挥发分含量对燃烧的重要影响 → 易着火、易燃尽","18. 水分对锅炉工作的影响有哪些？","19. 灰分对锅炉工作的影响有哪些？","20. 为防止结渣，炉膛出口烟温应如何控制 —— **小于 ST 50~100 ℃**","21. 灰熔点多高时不容易结渣？ **1390 ℃**（⚠️ 课件口径为 **1350 ℃**，以课件为准）","22.（原帧未拍到）","23. 由于燃料中含硫而造成的锅炉问题有哪些？","24. 煤质变差时对锅炉机组的经济、安全运行有哪些影响？","25. 燃煤锅炉在何种情况下燃用燃油？—— **启动和稳燃**","26. 锅炉常见事故「**四管爆漏**」：水冷壁、过热器、再热器、省煤器 —— 可用性问题，主因**磨损、腐蚀、超温**","💡 **用法**：把这 26 条当**考前自测清单**，逐条能答出来就算过关；答不出的回「重点」页对应卡片。"]}],"questions":[{"id":"bq-ch1-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p006（1 分）","keyPoints":["煤中成分的影响","硫分","灰分","水分","挥发分"],"stem":"关于煤中成分对锅炉工作的影响，下列说法正确的是","options":[{"k":"A","t":"煤中硫分含量越高越好，因为硫燃烧能释放较多热量，有助于提高锅炉效率"},{"k":"B","t":"灰分含量高有利于燃烧，因为灰分可以形成炉渣保护受热面，减少磨损"},{"k":"C","t":"水分含量高会降低燃烧温度，不利于燃烧，并可能增加低温受热面腐蚀风险"},{"k":"D","t":"挥发分含量越低，煤越容易着火和燃尽，燃烧越稳定"}],"answer":"C","why":["A ✗ 硫是**有害成分**：SO₂ 腐蚀受热面、H₂S 腐蚀水冷壁、硫化铁加剧磨煤机磨损 —— 绝非「越高越好」。","B ✗ 灰分**妨碍燃烧**、造成结渣积灰与磨损 —— 没有「保护受热面」的作用。","C ✓ 与课件 p005 原文一致：「水分：降低燃烧温度，不利于燃烧……低温受热面腐蚀提供环境」。","D ✗ 课件 p005 原文：「挥发分含量**高**，煤易于着火、燃尽、燃烧稳定」—— 说反了。"],"basis":"课件 p004–p005（原文）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准"},{"id":"bq-ch1-2","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p008（1 分）","keyPoints":["成分基准","收到基","空气干燥基","干燥基","干燥无灰基"],"stem":"关于煤的成分基准，以下表述正确的是","options":[{"k":"A","t":"收到基（ar）是指除去全部水分后的煤作为基准"},{"k":"B","t":"空气干燥基（ad）是在隔绝空气条件下干燥后得到的基准"},{"k":"C","t":"干燥无灰基（daf）常用于表示煤中有机物的元素成分和挥发分含量"},{"k":"D","t":"干燥基（d）是除去全部水分和灰分后的基准"}],"answer":"C","why":["A ✗ 收到基是**以进入锅炉房的原煤为基准**，不除水分。","B ✗ 空气干燥基是**经自然干燥、除去外部水分**，不是「隔绝空气」。","C ✓ 与课件 p007 原文一致。","D ✗ 干燥基只**除去全部水分**；「除去水分和灰分」的是**干燥无灰基 daf**。"],"basis":"课件 p007（原文）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准"},{"id":"bq-ch1-3","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p017（1 分）","keyPoints":["煤的分类","挥发分","无烟煤","烟煤","褐煤","贫煤"],"stem":"根据煤化程度和挥发分含量，我国将煤分为三大类。以下关于煤的分类及其特征描述，正确的是","options":[{"k":"A","t":"无烟煤挥发分高，着火容易，燃烧时火焰长且有烟"},{"k":"B","t":"褐煤挥发分高，易于燃烧，但水分大，易风化自燃"},{"k":"C","t":"烟煤挥发分低于10%，含碳量高，燃烧时无烟"},{"k":"D","t":"贫煤挥发分高于40%，属于典型的烟煤，适合炼焦"}],"answer":"B","why":["A ✗ 无烟煤煤化程度**最高、挥发分低**，着火和燃尽**都比较困难**。","B ✓ 与课件 p015 原文一致：褐煤挥发成分高（>37%）、水分大、空气中易风化碎裂、易自燃。","C ✗ 烟煤挥发分是 **20%~40%**（不是低于 10%），且「燃烧时火焰高而**有烟**」。","D ✗ 贫煤挥发分是 **10%~20%**（不是高于 40%），它是变质程度最高的**烟煤**，但并非「高于40%」。"],"basis":"课件 p013–p015（原文）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准"},{"id":"bq-ch1-ex1","kind":"例题","priority":1,"source":"课件例题","sourceDetail":"课件 p023（有完整解答）","keyPoints":["理论空气量","实际空气量","过量空气系数"],"stem":"已知某电厂燃用烟煤，其收到基元素分析数据为：碳 C_ar=58.0%，氢 H_ar=4.0%，氧 O_ar=6.0%，硫 S_ar=0.8%，灰分 A_ar=20.0%，水分 M_ar=11.2%，锅炉为固态排渣煤粉炉，燃用烟煤时炉膛出口过量空气系数取 α=1.18。试求 1 kg 该煤完全燃烧所需的理论空气量 V⁰ 以及在实际过量空气系数 α=1.18 下所需的实际空气量 V（标准状态，m³/kg）。","given":["收到基碳 C_ar = 58.0%","收到基氢 H_ar = 4.0%","收到基氧 O_ar = 6.0%","收到基硫 S_ar = 0.8%","收到基灰分 A_ar = 20.0%","收到基水分 M_ar = 11.2%","锅炉型式：固态排渣煤粉炉；炉膛出口过量空气系数 α = 1.18"],"ask":["1 kg 该煤完全燃烧所需的理论空气量 V⁰（标准状态，m³/kg）","实际过量空气系数 α = 1.18 下所需的实际空气量 V（标准状态，m³/kg）"],"steps":["写出理论空气量计算公式：`V⁰ = 0.0889(C_ar + 0.375S_ar) + 0.265H_ar − 0.0333O_ar`","代入数据：`V⁰ = 0.0889×(58.0 + 0.375×0.8) + 0.265×4.0 − 0.0333×6.0`","　　`= 5.1829 + 1.06 − 0.1998 = 6.0431` m³/kg","取两位小数：**V⁰ ≈ 6.04 m³/kg**","实际空气量按 `V = αV⁰` 计算","`V = 1.18 × 6.0431 = 7.1309` m³/kg"],"result":"V⁰ ≈ **6.04 m³/kg**；V = **7.1309 m³/kg**（标准状态）","why":["🔑 先算 **理论空气量**（用收到基元素成分），再乘 **过量空气系数** 得实际空气量。","⚠️ 代入时注意系数：碳项 0.0889、硫项要乘 0.375 后并入碳项、氢项 0.265、氧项 **减** 0.0333。","⚠️ 元素成分给的是**百分数**，公式中直接代数值（如 C_ar 代 58.0），不要再多除一次 100。"],"basis":"课件 p021（公式）+ p023（例题解答）"},{"id":"bq-ch1-hw1","kind":"计算","priority":1,"source":"课件作业","sourceDetail":"课件 p027 课后作业第 1 题","keyPoints":["成分基准换算","收到基"],"stem":"某种煤收到基含碳量为 41%。由于受外界条件的影响，其收到基水分由 15% 减少到 10%，收到基灰分由 25% 增加到 35%，试求其水分和灰分变化后的收到基含碳量（要求先推导换算公式，后计算）。","given":["原收到基含碳量 C_ar = 41%","水分 M_ar：15% → 10%","灰分 A_ar：25% → 35%"],"ask":["水分和灰分变化后的收到基含碳量"],"steps":["关键认识：水分、灰分变化时，**可燃质（碳等）的绝对量不变**，只是基准的分母变了。","取 100 kg 原煤：其中碳 = 41 kg，水分 = 15 kg，灰分 = 25 kg，其余（氢氧氮硫）= 100 − 41 − 15 − 25 = 19 kg。","水分析出后：水分减少 5 kg，煤的总质量变为 100 − 5 = **95 kg**（碳、灰分、其余成分绝对量不变）。","再考虑灰分增加：题目说灰分由 25% 增到 35%——这一条需按「**折算到同一基准**」的思路处理，通常理解为干燥基灰分变化，须用基准换算公式计算。","⚠️ 本题核心是**基准换算**：`X_ar = X_d × (100 − M_ar)/100` 一类公式，先把原煤换算到不受水分影响的基准，再换回新的收到基。","标准解法：`C_ar,新 = C_ar,原 × (100 − M_ar,新)/(100 − M_ar,原)` 处理**只变水分**的情形；若灰分也变，则换算到**干燥无灰基**或**干燥基**再折回。"],"result":"需先推导换算公式再代入（课件只给题干，未给答案）","why":["🔑 基准换算的本质：**绝对质量不变，分母（总量）变**。","⚠️ 只变水分 → 用「收到基 ↔ 干燥基」换算；水分和灰分同时变 → 先换到**干燥无灰基（daf）**，该基准下可燃质比例恒定，再折回新收到基。","⚠️ 这是课件留的**手写作业题**，没有标准答案。建议算完对照 [[燃料成分基准换算法]]。"],"basis":"课件 p027（作业）；方法见 [[燃料成分基准换算法]]","answerNote":"课件未给答案；本题为标准基准换算题型，最终数值请自行演算后与同学/老师核对"},{"id":"bq-ch1-hw2","kind":"计算","priority":1,"source":"课件作业","sourceDetail":"课件 p027 课后作业第 2 题","keyPoints":["空气干燥基","收到基","成分基准换算"],"stem":"已知煤的空气干燥基成分：C_ad = 50.5%，H_ad = 4.2%，S_ad = 0.8%，A_ad = 15.5%，M_ad = 21%，和风干水分 M_ar^f = 3.5%，计算上述各种成分的收到基含量。","given":["C_ad = 50.5%","H_ad = 4.2%","S_ad = 0.8%","A_ad = 15.5%","M_ad = 21%","风干水分 M_ar^f = 3.5%"],"ask":["上述各成分的**收到基**含量"],"steps":["空气干燥基 → 收到基的换算系数：`k = (100 − M_ar)/(100 − M_ad)`","其中 `M_ar = M_ad + M_ar^f`（空气干燥基水分 + 风干水分）","本题：`M_ar = 21 + 3.5 = 24.5%`","换算系数 `k = (100 − 24.5)/(100 − 21) = 75.5/79 = 0.9557`","逐项换算：`C_ar = 50.5 × 0.9557 ≈ 48.26%`","　`H_ar = 4.2 × 0.9557 ≈ 4.01%`；`S_ar = 0.8 × 0.9557 ≈ 0.76%`；`A_ar = 15.5 × 0.9557 ≈ 14.81%`","校验：C+H+O+N+S+A+M = 100%（氧由差减求得）"],"result":"M_ar = 24.5%；换算系数 k ≈ 0.956；C_ar ≈ 48.3%，H_ar ≈ 4.0%，S_ar ≈ 0.76%，A_ar ≈ 14.8%","why":["🔑 记住方向：**空气干燥基 → 收到基，水分变多，所以数值要变小**（系数 <1）。","⚠️ 关键点是 **M_ar = M_ad + M_ar^f**：空气干燥基本身含 21% 水分，风干水分 3.5% 要加上去。","⚠️ 换算后要**校验总和 = 100%**，这是查错的好办法。"],"basis":"课件 p027（作业）；方法见 [[燃料成分基准换算法]]","answerNote":"课件未给答案；换算系数与结果按标准基准换算公式推得，请核对"},{"id":"bq-ch1-ex2","kind":"例题","priority":1,"source":"视频例题","sourceDetail":"视频 第2集 @ 21:10","keyPoints":["成分基准换算","空气干燥基","收到基"],"stem":"锅炉应用煤燃烧前，已知水分含量 10%，实验室分析试样的成分为：C_ad = 61.04%，H_ad = 4.14%，O_ad = 11.40%，N_ad = 1.08%，S_ad = 1.09%，A_ad = 20.25%，M_ad = 1.00%。求收到基成分。","given":["水分含量 M_ar = 10%","C_ad = 61.04%｜H_ad = 4.14%｜O_ad = 11.40%｜N_ad = 1.08%｜S_ad = 1.09%","A_ad = 20.25%｜M_ad = 1.00%"],"ask":["各成分的收到基含量"],"steps":["确定换算方向：**空气干燥基 → 收到基**，换算系数 `k = (100 − M_ar)/(100 − M_ad)`","代入：`k = (100 − 10)/(100 − 1.00) = 90/99 = 0.9091`","逐项乘以 k（收到基水分直接用题给值）：","　`C_ar = 61.04 × 0.9091 ≈ 55.49%`","　`H_ar = 4.14 × 0.9091 ≈ 3.76%`","　`O_ar = 11.40 × 0.9091 ≈ 10.36%`","　`N_ar = 1.08 × 0.9091 ≈ 0.98%`","　`S_ar = 1.09 × 0.9091 ≈ 0.99%`","　`A_ar = 20.25 × 0.9091 ≈ 18.41%`","　`M_ar = 10.00%`","**校验**：各项之和应为 100%"],"result":"k = 0.9091；C_ar≈55.49%、H_ar≈3.76%、O_ar≈10.36%、N_ar≈0.98%、S_ar≈0.99%、A_ar≈18.41%、M_ar=10.00%","why":["🔑 方向判断：**从空气干燥基换到收到基，水分变多 → 各成分百分比变小 → k 必小于 1**（本题 0.909）。这是最快的自检方法。","⚠️ 视频只算到 `k = 0.9091` 这一步就翻页了，上面各项数值是按同一公式逐项乘出来的，**请自行核对**。","⚠️ 换算后务必**校验总和 = 100%**。"],"basis":"视频 第2集 @ 21:10（换算系数表见 @ 20:55）","answerNote":"视频仅演示了换算系数这一步，逐项结果由该系数推出，请核对"}]},{"id":"boiler-ch2","name":"第二章 煤粉制备","subtitle":"煤粉性质 · 细度 · 可磨性 · 磨煤机 · 制粉系统 · 分离器 · 选型","status":"在读","overview":"本章按教材四节：煤粉的性质（一般特性/细度/可磨性/磨损性/水分）→ 磨煤机（筒式钢球磨、中速磨、出力和功率）→ 制粉系统（中间储仓式、直吹式、煤粉分离器）→ 磨煤机及制粉系统选型。课件覆盖前三节。","mindmap":{"label":"第二章 煤粉制备","children":[{"label":"第一节 煤粉的性质","children":[{"label":"一、一般特性：流动性 · 自燃与爆炸性 · 堆积特性"},{"label":"　爆炸最危险浓度 1.2~2.0 kg/m³"},{"label":"二、煤粉细度及颗粒特性 ★"},{"label":"　R_x = a/(a+b)×100% · 破碎公式 R_x = 100e^(−bxⁿ)"},{"label":"　均匀性指数 n（0.8~1.2）· 经济细度 R₉₀^opt"},{"label":"三、煤的可磨性（HGI / K_gr）"},{"label":"四、煤的磨损特性（冲刷磨损指数 K_e）"},{"label":"五、煤粉水分（教材/视频补充）"}]},{"label":"第二节 磨煤机","children":[{"label":"按转速分类：低速 / 中速 / 高速"},{"label":"一、筒式钢球磨煤机 ★★"},{"label":"　单进单出 · 双进双出（带/不带热风空心管）"},{"label":"　影响因素：转速 n_cj · 护甲 · 钢球充满系数 ψ · 通风量 · 水分 · 钢球直径 · 存煤量"},{"label":"二、中速磨煤机 ★★"},{"label":"　碗式(HP) · 轮式(MPS/ZGM) · 球环式(E型)"},{"label":"　影响因素：转速 · 通风量 · 风环气流速度 · 研磨压力 · 燃料性质"},{"label":"三、磨煤机出力和功率（磨煤出力 B_m / 干燥出力 B_g）"}]},{"label":"第三节 制粉系统","children":[{"label":"一、中间储仓式（乏气送粉 / 热风送粉）"},{"label":"二、直吹式（正压：热一次风机 / 冷一次风机）"},{"label":"三、煤粉分离器：粗粉分离器 · 细粉分离器（旋风）"},{"label":"辅助设备：给煤机 · 给粉机"}]},{"label":"第四节 磨煤机及制粉系统选型（教材）"},{"label":"★ 视频补充：3D 动画讲解中速磨工作过程"}]},"points":[{"id":"p-ch2-prop","title":"煤粉的一般特性（选择题考点）","key":true,"source":"课件 p002–p005；单选题 p005","items":["**流动性**：刚磨制的煤粉干燥疏松，与空气混合物流动性好、便于管道输送；但设备不严密时容易泄漏污染环境。","**自燃与爆炸性**：煤粉沉积在管道中时间较长 → 积粉层内逐渐升温 → 达着火温度发生**自燃**；挥发分高的煤粉浓度达一定值时遇火源可能**爆炸**。","**堆积特性**：煤粉仓中自然压紧的堆积密度 **0.7 t/m³**；吸附水分后易结块。","⭐ **影响煤粉爆炸的因素**（课件 p003）：","　· **干燥无灰基挥发分**：含量**越高**越容易着火、爆炸；","　· **煤粉浓度**：**最危险浓度 1.2~2.0 kg/m³**；","　· **水分、颗粒细度、工质温度**：水分**越小**、颗粒**越细**，越容易着火爆炸。","**实践证明**（课件 p004）：","　· 挥发分 **<10%** 或粒径 **>100 μm** 时，煤粉**几乎不会爆炸**；","　· 温度低于 100 ℃、含氧浓度 **<15%~16%** 的煤粉气流基本不存在爆炸危险；","　· 水分太高流动性差、易搭桥；水分太低易自燃和爆炸。"]},{"id":"p-ch2-fineness","title":"煤粉细度与颗粒特性 ★★","key":true,"source":"课件 p006–p011；视频第6集 @ 04:15–14:35","items":["**煤粉细度 R_x**：一定质量煤粉用一定尺寸筛孔筛分时，**筛子上剩余量占筛分总量的百分比**。`R_x = a/(a+b) × 100%`（a 筛上余量、b 过筛量）。**R_x 越大煤粉越粗**。","我国电厂常用 **30 号筛（R₂₀₀）和 70 号筛（R₉₀）** 表示煤粉细度。","**破碎公式（Rosin-Rammler）**：`R_x = 100·e^(−b·xⁿ)`","　· `b` 为煤粉细度系数，`b↑ → R₉₀↓ → 煤粉越细`；","　· `n` 为**煤粉均匀性指数**，`n = [lg ln(100/R₂₀₀) − lg ln(100/R₉₀)] / lg(200/90)`；","　· 不同粒径换算：`R_x2 = 100·(R_x1/100)^((x₂/x₁)ⁿ)`；`b = (1/90ⁿ)·lg(100/R₉₀)`。","⚠️ **口径冲突**：课件 p008 分母写作 `lg(100/90)`，视频给的是 `lg(200/90)`。**按规则以课件为准**，视频数值并列参考。","**n 的意义**：n 越大 → 过粗和过细的煤粉**都少** → 粒度分布**越均匀**。n 取决于磨煤机和粗粉分离器型式，一般取 **n = 0.8~1.2**（视频给 0.8~1.3）。","**最佳（经济）煤粉细度**：使**不完全燃烧热损失 q₄** 与**制粉能耗 E_m** 之**和最小**时的煤粉细度。","　经验公式：`R₉₀^opt = a + 0.5·n·V_daf`（a 取决于煤种，视频给：**无烟煤 0、贫煤 2、烟煤 4**）。","**表2-1 常用筛子**：筛号 6/8/12/30/40/60/70/80 对应孔径 1000/750/500/200/150/100/90/75 μm，细度符号 R₁₀₀₀/R₇₅₀/R₅₀₀/R₂₀₀/R₁₅₀/R₁₀₀/R₉₀/R₇₅。"]},{"id":"p-ch2-grind","title":"煤的可磨性与磨损特性","key":true,"source":"课件 p012–p013；视频第6集 @ 16:55–18:15","items":["**可磨性系数 K_gr（可磨性指数）**：煤磨成一定细度煤粉的**难易程度**。","**哈氏可磨性指数 HGI**（Hardgrove 法）：`HGI = 13 + 6.93·D₇₅`，D₇₅ 为通过 75 μm 筛的煤粉量。","　（视频另给：`K_gr = E₁/E₂`，`K_gr = 0.0034·(HGI)^1.25 + 0.61`；**HGI 范围 25~129**，**>80 易磨、<60 难磨**。）","**煤的磨损指数 K_e**：表征该煤种对磨煤机研磨部件**磨损的强烈程度**。按电力行业标准 **DL465-92**《煤的冲刷磨损指数试验方法》，用冲刷式磨损试验确定。","　按 K_e 大小分：**轻微 / 不强 / 较强 / 很强 / 极强**（视频给分级：<1.0 轻微、1~1.9 不强、2~3.5 较强、3.5~5 很强、>5 极强）。","　（视频另给表达式 `K_ε = δ/(Aτ)`，δ 磨损深度、A 试片面积、τ 时间；老师用红笔圈出。）"]},{"id":"p-ch2-moisture","title":"煤粉水分（教材 + 视频补充）","key":false,"source":"视频第6集 @ 14:35–15:55；教材第二章第一节五","items":["**水分过大的危害**：煤粉结块、着火推迟、排烟量增加、加剧低温腐蚀。","**煤粉磨制后的合理水分 M_pc**：","　· **无烟煤**：`M_pc ≤ M_ad`","　· **烟煤**：`0.5·M_ad ≤ M_pc ≤ M_ad`","　· **褐煤**：`M_ad ≤ M_pc ≤ M_ad + 8`"]},{"id":"p-ch2-mill-class","title":"磨煤机分类与工作原理","key":true,"source":"课件 p014；视频第7集 @ 00:00","items":["**磨煤机的作用**：**制粉**和**干燥**。","**工作原理**：**撞击、压碎、研磨**。","⚠️ **口径冲突（转速分级，务必看）**：","　· **课件 p014**：低速 **15~25** r/min（筒式钢球磨）· 中速 **25~100**（碗式、轮式）· 高速 **425~1000**（风扇式）","　· **视频第7集**：低速 **15~25** · 中速 **50~300**（碗式、轮式、E型）· 高速 **750~1500**（风扇磨）","　**按规则以课件为准**；考场上如遇视频口径，可按题目给定值判断。","国内电厂采用较多的是**筒式钢球磨煤机**和**中速磨煤机**。"]},{"id":"p-ch2-ball","title":"筒式钢球磨煤机 ★★（选择题考点）","key":true,"source":"课件 p015–p034；单选题 p022；视频第7集","items":["**单进单出**：圆筒由齿轮带动低速转动，燃料和热空气从**一端**进入，磨好后由**另一端**带出。","**双进双出**：两端空心轴既是热风和原煤进口、又是煤粉气流出口，形成**两个对称独立的磨煤回路**。分**带热风空心管**（空心轴进风进煤）与**不带热风空心管**（两端各设隔开的进出口料斗）两种。","⭐ **（1）筒体转速 —— 三个工况**（课件 p019–p021，单选原题）：","　`n_c = 42.3/√D`（临界转速，D 为筒体直径 m）","　· **n ≪ n_c**：钢球提不到应有高度，磨煤作用很小、煤粉难分离 → **出力很小**；","　· **n ≥ n_c**：钢球和原煤**随筒体一同转动而不落下** → **磨煤出力几乎为零**；","　· **n < n_c**：钢球被提升到一定高度后落下，热风穿过筒体干燥并带出煤粉 → **出力最大、分离效果最好**。","　**最佳工作转速**：`n_zj / n_c = 0.74 ~ 0.8`。","**（2）钢球充满系数 ψ**：`ψ = G/(ρ_gq·V) × 100%`，G 钢球装载量(t)、V 筒体容积(m³)、ρ_gq 钢球堆积密度 **4.9 t/m³**。","　ψ = **10%~35%** 范围内：`B_m ∝ ψ^0.6`、`P_m ∝ ψ^0.9`、**单位电耗 `E_m ∝ ψ^0.3`**；最佳充满系数 `ψ_zj = 0.12/(n/n_c)^1.75`。","**（3）钢球直径 d**：一般 **30~40 mm**；磨硬煤用 **50~60 mm**。直径小 → 撞击次数多、作用面积大 → 出力↑但磨损↑；直径大 → 撞击力大但接触面积小。","**（4）护甲**：形状影响钢球提升高度。三种：**阶梯式 / 波浪式 / 齿式**（**齿形最佳**）。","**（5）通风量**：太小 → 煤粉集中进口端、筒内风速低 → 出力↓；太大 → 带出粗粉、回粉量↑、通风电耗↑。有**最佳通风量**。","**（6）筒内载煤量 G_m**：太少 → 无效碰撞多、出力↓；太多 → 钢球落差减小、甚至堵塞。**运行时通过磨煤机进出口压差和电流控制**。","**（7）水分 M_ar**：水分多 → 不好磨 → B_m 小。","**单进单出的优缺点**：优点＝煤种适应性强、单机容量大、对杂质不敏感、可靠性高；缺点＝金属消耗量大、电耗大、噪音大、煤粉均匀性差。","　⚠️ **关键结论**：球磨机**磨煤功率与磨煤出力几乎无关**，出力↓ → **单位电耗↑** → **满负荷运行最经济**，只适合带基本负荷。","**双进双出优点**：保持钢球磨煤种适应性广等优点，同时**体积大大缩小、能耗降低、适应负荷变化能力强**（响应快、储粉量大、运行灵活）；出力靠**一次风量**控制而非给煤机。"]},{"id":"p-ch2-medium","title":"中速磨煤机 ★★（选择题考点）","key":true,"source":"课件 p035–p045；单选题 p045；视频第7集 @ 14:45–19:15","items":["**三类中速磨**：**碗式（HP/RP/MBF）** · **轮式（MPS/ZGM）** · **球环式（E 型）**。","**结构沿高度分四部分**：① 驱动装置 ② 研磨部件 ③ 干燥分离空间 ④ 煤粉分离和分配装置。","**工作原理**：原煤经落煤管落到磨盘（或磨环）上，电机驱动磨盘转动，磨辊在弹簧/液压压力下**挤压、研磨**煤；热风经**风环**高速吹入，把磨好的煤粉**干燥并带起**进入分离器；粗粉返回重磨，合格煤粉送往炉膛；难磨杂质落入**石子煤箱**定期排出。","**碗式（HP）特点**：磨辊外表面与磨碗内表面接触面**呈直线状**，受力均匀、均处最大正压力；磨碗有**倾斜角**，煤块重力部分抵消离心力，**延长煤在研磨面上的停留时间**；维修方便，磨辊可直接翻出。","**轮式（MPS/ZGM）特点**：接触面**呈凹弧形**，相同压力下只有很小范围处于最大正压；磨轮尺寸大、研磨表面积大；**三个磨轮呈三点受力**，机体不受力、不影响密封；辊胎**对称**，一侧磨损严重可**翻身继续用**。","⭐ **影响中速磨工作的主要因素**（课件 p040–p044，★重点，单选原题）：","　· **（1）转速**：过高 → 煤离心力大，未磨碎就通过研磨件，大颗粒造成通风阻力、粗粉量、通风电耗增加；过低 → 磨好的煤粉不能及时带走，细粉量增加，电耗与金属磨耗增加。大容量磨有**降低转速**趋势。","　· **（2）通风量**：直接影响**煤粉细度、磨煤出力和石子煤排出量**；运行中允许在最低（不发生煤粉沉积）至最大之间随出力改变，**始终维持风煤比不变**，风煤比与磨煤出力成**线性关系**。","　· **（3）风环气流速度**：原则是**能把大部分煤粒托起，但只将少量煤粉带入分离器**，其余返回研磨区形成循环煤层。过高 → 煤粉变粗、阻力大、通风电耗↑；过低 → 煤粉变细、出力↓、石子煤排放量↑。可通过**风环间隙**控制。","　· **（4）研磨压力**：过小 → 出力↓、煤粉变粗；过大 → **研磨件磨损加剧**。随研磨件磨损承载减小，需**随时调整**维持压力不变。","　· **（5）燃料性质**：水分**较大** → 容易压成**煤饼** → 出力↓；水分**较低** → 发生**滑动** → 出力也下降。","**中速磨的优缺点（与筒式钢球磨相比）**：优点＝占地小、投资少、噪音与电耗小、煤粉粒度均匀、空载功率小、运行灵活更适合变负荷；缺点＝**结构复杂、检修要求高**、**对煤种变化适应能力较差**（适合烟煤）、干燥作用小、**受水分影响大**（水分大会压成饼状，一般要求 **M_ar<40%**、**HGI>50**）。","**高速磨（风扇磨）**：转速 >400 r/min，结构简单尺寸小、与粗粉分离器连成一体；原理为**撞击、磨擦**，干燥作用强；**本身即排粉机**，采用直吹式；适用**高水分褐煤**；缺点是**叶轮磨损严重、维护工作量大**。"]},{"id":"p-ch2-output","title":"磨煤出力与干燥出力","key":false,"source":"课件 p030；视频第7集 @ 01:20","items":["**磨煤出力 B_m**：磨煤机在消耗一定能量的条件下，**单位时间内能磨制符合煤粉细度要求的原煤量**。","**干燥出力 B_g**：磨煤系统单位时间内，能把多少原煤从原有（收到基）水分 **M_ar** 干燥到要求的煤粉水分 **M_mf**。","**球磨机工作时应同时满足这两个出力。**"]},{"id":"p-ch2-system","title":"制粉系统：中间储仓式 vs 直吹式 ★","key":true,"source":"课件 p046–p047；教材第二章第三节","items":["**制粉系统的任务**：安全可靠、经济地制造和运送锅炉所需的合格煤粉。","**中间储仓式**：磨好的合格煤粉**先存入煤粉仓**，再经给粉机按锅炉负荷送入炉膛。","　流程：原煤→给煤机→（下行干燥管预热）→磨煤机→**粗粉分离器**（粗粉返回重磨）→**细粉分离器**（约 90% 煤粉分离下来）→**煤粉仓**；分离后的**乏气**（带约 10% 煤粉）经**排粉机**提升压力。","　**两种送粉方式**：**乏气送粉**（乏气携煤粉作一次风）· **热风送粉**（用热风作一次风输送煤粉，乏气作三次风）——后者用于无烟煤、贫煤等着火温度高的煤。","　**特点**：磨煤机与锅炉相对独立，**低负荷时磨煤机仍可保持高负荷运行**；但系统复杂、初投资大、**制粉电耗高**、负压运行**漏风量大**（磨煤机入口约维持 200 Pa 负压，到排粉机入口负压可达 6000~8000 Pa），使排烟温度升高。","**直吹式**：**不设煤粉仓**，磨好的合格煤粉**直接送入炉膛**，磨煤量随锅炉负荷同步调节。","　**分负压系统与正压系统**：负压系统（磨煤机出口设排粉机）因高浓度煤粉严重磨损排粉机叶轮，**已很少采用**；现多用**正压直吹式**（磨煤机及其后设备处正压，须用**密封空气/密封风机**防漏粉）。","　**正压直吹式又分两种**：","　· **热一次风机系统**：热一次风机在空预器与磨煤机之间，抽取一次风送入磨煤机。缺点＝空气温度高、比容大 → 风机体积大、**电耗高**、易高温侵蚀、效率与可靠性低。","　· **冷一次风机系统**（大容量电站锅炉多采用）：一、二次风各由独立风机输送，风机在空预器**之前**，输送干净冷空气。**优点**：① 冷空气比容小 → 风机体积小、**电耗低、效率高**；② 高压头冷一次风机可**兼作密封风机**，简化系统；③ 热风温度不受一次风机限制，**可满足较高水分煤种**的要求；④ 负荷变化对独立一次风系统影响小。"]},{"id":"p-ch2-sep","title":"煤粉分离器","key":false,"source":"课件 p046–p047；视频第7集 @ 19:35–20:40；教材第二章第三节三","items":["**粗粉分离器**：把气粉混合物中的**粗粉分离出来送回磨煤机**。工作原理：**重力、离心力（主要）、惯性力**。","　三种分离：**重力分离**（截面扩大、流速从 15~20 m/s 降至 4~6 m/s）· **离心力分离**（折向挡板或旋转式）· **惯性力分离**（气流拐弯）。","　调节煤粉细度：**挡板开度**、**圆锥帽拉杆（套环）**，旋转式则调**转速**。","　布置：低速单进单出磨——高位分开布置；双进双出磨——一体或分开（**分开更好**）；中速磨——**与磨煤机一体**。","**细粉分离器（旋风分离器）**：把气粉混合物中的**煤粉分离出来送到煤粉仓**，**仅中间储仓式才需要**。工作原理：**重力、离心力**。","　含粉气流**切向引入**：**外旋**——固体粒子靠离心力甩向外筒壁向下运动，由下部口排出；**内旋**——净化后的气流由顶部排气口排出。","**辅助设备**：**给煤机**（控制进入磨煤机的**原煤量**，大型机组多用刮板式和皮带式）· **给粉机**（控制进入炉膛的**煤粉量**，仅中间储仓式有）。","　⚠️ 炉膛燃烧稳定性在很大程度上取决于**给粉机给粉量的均匀性**及其**适应锅炉负荷变化的调节性能**。"]},{"id":"p-ch2-select","title":"磨煤机及制粉系统选型（教材第四节）","key":false,"source":"教材第二章第四节（课件未讲）","items":["选型影响机组运行的**经济性和可靠性**，受多种因素制约。","**首先是煤种及其挥发分含量 V_daf 和着火温度 IT**；其次是**对煤粉细度 R₉₀ 的要求**；其他因素有**煤的可磨性、磨损性和水分含量**等，应综合考虑。","教材表 2-3 给出各类磨煤机及制粉系统的适用范围（参考）。","注：煤的外在水分 `M_f = (M_ar − M_ad)/(100 − M_ad)`。"]}],"questions":[{"id":"bq-ch2-1","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p005（1 分）","keyPoints":["煤粉爆炸","挥发分","煤粉浓度","水分与细度"],"stem":"关于煤粉爆炸的影响因素，下列说法正确的是？","options":[{"k":"A","t":"干燥无灰基挥发分含量越低，越容易引起着火、爆炸"},{"k":"B","t":"煤粉最危险的爆炸浓度范围是 1.2 ～ 2.0 Kg/m³"},{"k":"C","t":"煤粉水分越小、颗粒越细，越不容易引起着火和爆炸"},{"k":"D","t":"当煤粉的挥发分 >10% 或粒径 >100μm 时，煤粉几乎不会发生爆炸"}],"answer":"B","why":["A ✗ 课件 p003 原文：干燥无灰基挥发分含量**越高**，越容易引起着火、爆炸 —— 说反了。","B ✓ 与课件 p003 原文完全一致：「煤粉浓度——最危险浓度：1.2～2.0 Kg/m³」。","C ✗ 课件 p003 原文：煤粉水分**越小**、颗粒**越细**，**越容易**引起着火、爆炸 —— 说反了。","D ✗ 课件 p004 原文：当挥发分 **<10%** 或粒径 **>100 μm** 时几乎不会爆炸；选项写成「挥发分 >10%」正好相反。"],"basis":"课件 p003–p004（原文）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准"},{"id":"bq-ch2-2","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p022（1 分）","keyPoints":["钢球磨","临界转速","最佳工作转速"],"stem":"关于钢球筒式磨煤机的工作转速，下列说法正确的是？","options":[{"k":"A","t":"当工作转速 n 远小于临界转速 nc 时，磨煤出力最大"},{"k":"B","t":"当工作转速 n 大于等于临界转速 nc 时，钢球和原煤随筒体一同转动，磨煤出力几乎为零"},{"k":"C","t":"筒体的最佳工作转速与临界转速 nc 的比值通常为 0.5 ～ 0.6"},{"k":"D","t":"工作转速越高，磨煤出力越大，因此应尽量提高转速"}],"answer":"B","why":["A ✗ 课件 p020：n ≪ n_c 时钢球提不到应有高度，磨煤作用很小、出力**很小**（不是最大）。","B ✓ 与课件 p021 原文一致：「当磨煤机的工作转速 n≥n_c 时，钢球和原煤与筒体一同转动而不会落下，磨煤出力几乎为零」。","C ✗ 课件 p021 给出的是 `n_zj/n_c = 0.74 ~ 0.8`，不是 0.5~0.6。","D ✗ 转速达到临界转速后出力反而归零，绝非「越高越好」。"],"basis":"课件 p019–p021（原文）","answerNote":"课件未标答案，本答案由课件原文推出，请以老师公布为准"},{"id":"bq-ch2-3","kind":"单选","priority":1,"source":"课件题目","sourceDetail":"课件 p045（1 分，问「错误的是」）","keyPoints":["中速磨","通风量","风环气流速度","研磨压力","燃料水分"],"stem":"关于中速磨煤机的运行因素，下列说法错误的是？","options":[{"k":"A","t":"通风量过大，会导致煤粉变粗，通风电耗增加"},{"k":"B","t":"研磨压力过小，会导致磨煤出力降低，煤粉变粗"},{"k":"C","t":"燃料水分较大时，容易压成煤饼，造成磨煤出力降低"},{"k":"D","t":"风环气流速度越高越好，可以保证将大部分煤粉带入分离器"}],"answer":"D","why":["A ✓ 课件 p042 原文：风环流速（通风）过高 → 煤粉变粗、阻力变大、通风电耗增加。","B ✓ 课件 p043 原文：研磨压力过小 → 磨煤出力降低、煤粉变粗。","C ✓ 课件 p044 原文：燃料水分较大 → 容易压成煤饼 → 磨煤出力降低。","D ✗ **错在「越高越好」**。课件 p042 原则是：「应能将**大部分煤粒托起**，但**只将少量煤粉**带入分离器，其余大部分煤粒返回研磨区形成循环煤层」；速度过高反而煤粉变粗、阻力变大、通风电耗增加。"],"basis":"课件 p041–p044（原文）","answerNote":"课件未标答案；本题问「错误的是」，故答案为 D。请以老师公布为准"},{"id":"bq-ch2-4","kind":"计算","priority":1,"source":"教材考点","sourceDetail":"教材第二章复习思考题 3","keyPoints":["煤粉细度换算","R90","R75","均匀性指数n"],"stem":"若已知 R₉₀ = 13%，试计算 R₇₅ 的值（假设 n = 1.1）。","given":["R₉₀ = 13%","均匀性指数 n = 1.1","要求换算到 x = 75 μm"],"ask":["R₇₅ 的值"],"steps":["用不同粒径煤粉细度的换算公式：`R_x2 = 100·(R_x1/100)^((x₂/x₁)ⁿ)`","这里 x₁ = 90 μm，R_x1 = R₉₀ = 13%；x₂ = 75 μm，求 R₇₅","代入：`R₇₅ = 100 × (13/100)^((75/90)^1.1)`","计算指数：`(75/90)^1.1 = (0.8333)^1.1 ≈ 0.8185`","计算幂：`0.13^0.8185 ≈ e^(0.8185 × ln0.13) = e^(0.8185 × (−2.0402)) = e^(−1.6699) ≈ 0.1881`","`R₇₅ ≈ 100 × 0.1881 ≈ 18.8%`"],"result":"R₇₅ ≈ **18.8%**","why":["🔑 关键是换算公式 `R_x2 = 100·(R_x1/100)^((x₂/x₁)ⁿ)`：**粒径变小 → 细度值变大**（75 μm 的筛上余量比 90 μm 多），结果 18.8% > 13% 符合直觉。","⚠️ 指数是 `(x₂/x₁)^n`，注意 n 作用在比值上，不是乘在外面。","⚠️ 教材原题（复习思考题第 3 题），教材未给答案，以上为按公式推导的结果。"],"basis":"教材第二章复习思考题 3；公式见课件 p007（破碎公式换算）","answerNote":"教材未给答案，本解答按课件给出的换算公式推得，请核对"},{"id":"bq-ch2-5","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频第6集 @ 09:05","keyPoints":["经济细度","q4","制粉电耗"],"stem":"煤粉的经济细度（最佳煤粉细度）是指（　）","options":[{"k":"A","t":"煤粉越细越好时的细度"},{"k":"B","t":"使不完全燃烧热损失 q₄ 与制粉能耗 E_m 之和最小时的煤粉细度"},{"k":"C","t":"使磨煤机出力最大时的煤粉细度"},{"k":"D","t":"使制粉电耗最小时的煤粉细度"}],"answer":"B","why":["A ✗ 煤粉越细，制粉电耗和金属磨损越大，不是越细越好。","B ✓ 课件 p010 原文：「应选择使**燃烧不完全热损失 q₄ 和制粉能耗 E_m 之和最小**时的煤粉细度」。","C ✗ 出力最大不等于总成本最低。","D ✗ 只看制粉电耗会漏掉燃烧损失，是片面理解。"],"basis":"课件 p010；视频第6集 @ 09:05"},{"id":"bq-ch2-6","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频第6集 @ 14:25","keyPoints":["均匀性指数n","颗粒分布"],"stem":"关于煤粉均匀性指数 n，下列说法正确的是（　）","options":[{"k":"A","t":"n 越大，煤粉中过粗颗粒越多"},{"k":"B","t":"n 越大，煤粉中过细颗粒越多"},{"k":"C","t":"n 越大，煤粉中过粗和过细的颗粒都较少，粒度分布越均匀"},{"k":"D","t":"n 与煤粉粒度分布无关"}],"answer":"C","why":["A ✗ B ✗ 课件 p008 明确：R₉₀ 一定时 n 越大则 R₂₀₀ 越小（过粗少）；R₂₀₀ 一定时 n 越大则 R₉₀ 越大（过细少）。","C ✓ 与课件 p008 原文一致：「n 值越大，煤粉中过粗和过细的煤粉均较少，即煤粉粒度分布较均匀」。","D ✗ n 正是表征粒度分布均匀程度的参数，一般取 0.8~1.2。"],"basis":"课件 p008；视频第6集 @ 12:35"},{"id":"bq-ch2-7","kind":"填空","priority":2,"source":"视频考点","sourceDetail":"视频第7集 @ 00:00","keyPoints":["磨煤机分类","转速"],"stem":"按磨煤部件的工作转速，磨煤机分为低速、中速、高速三类。按课件口径：低速为 ____ r/min，中速为 ____ r/min，高速为 ____ r/min。（填数值范围）","answer":"15~25 ； 25~100 ； 425~1000","why":["课件 p014 原文：低速 **15~25 r/min**（筒式钢球磨）· 中速 **25~100**（碗式、轮式）· 高速 **425~1000**（风扇式）。","⚠️ **视频第7集给的数值不同**（低速 15~25 · 中速 50~300 · 高速 750~1500），按本库规则**以课件为准**。"],"basis":"课件 p014（原文）","answerNote":"视频与课件数值不一致，此处按课件口径；答题时请以老师给的教材/课件为准"},{"id":"bq-ch2-8","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频第7集 @ 19:35","keyPoints":["粗粉分离器","细粉分离器","中间储仓式"],"stem":"关于煤粉分离器，下列说法正确的是（　）","options":[{"k":"A","t":"粗粉分离器的作用是把合格细粉分离出来送往煤粉仓"},{"k":"B","t":"细粉分离器只有中间储仓式制粉系统才需要"},{"k":"C","t":"直吹式制粉系统必须同时装设粗粉分离器和细粉分离器"},{"k":"D","t":"粗粉分离器只靠重力分离，不用离心力"}],"answer":"B","why":["A ✗ 粗粉分离器是把**粗粉**分离出来**送回磨煤机重磨**。","B ✓ 教材第二章第三节三：直吹式「无需装置细粉分离器」；细粉分离器**仅在中间储仓式**中用于把煤粉送进煤粉仓。","C ✗ 直吹式（双进双出磨、中速磨）**无需细粉分离器**，只配控制细度的粗粉分离器。","D ✗ 粗粉分离器靠**重力、离心力（主要）、惯性力**共同作用，离心力起主要作用。"],"basis":"教材第二章第三节三；视频第7集 @ 19:35–19:55"},{"id":"bq-ch2-9","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频第7集 @ 18:30","keyPoints":["中速磨","低速磨","比较"],"stem":"与中速磨煤机相比，低速磨煤机（筒式钢球磨）的特点是（　）","options":[{"k":"A","t":"煤种适应性强，但电耗大、投资大"},{"k":"B","t":"煤种适应性弱，但电耗小"},{"k":"C","t":"维护困难，占地面积大"},{"k":"D","t":"只适用于直吹式制粉系统"}],"answer":"A","why":["A ✓ 视频第7集对比表：低速磨**煤种适应性「强」**、**电耗「大」**、**投资「大」**、维护简单、可用中间储仓式（单进单出）或直吹式（双进双出）。","B ✗ 颠倒：低速磨适应性强、电耗大。","C ✗ 低速磨**维护简单**（视频表：维护「简单」）。","D ✗ 单进单出配**中间储仓式**，双进双出配直吹式 —— 不是「只适用直吹式」。"],"basis":"视频第7集 @ 18:30（低速磨与中速磨比较表）"},{"id":"bq-ch2-10","kind":"单选","priority":2,"source":"视频考点","sourceDetail":"视频第7集 @ 17:25 / 17:30","keyPoints":["碗式磨HP","轮式磨MPS","结构特点"],"stem":"关于中速磨煤机的结构特点，下列说法正确的是（　）","options":[{"k":"A","t":"碗式磨（HP）的磨辊与磨碗接触面呈凹弧形，只有很小范围处于最大正压力"},{"k":"B","t":"轮式磨（MPS）有三个磨轮，呈三点受力，机体不受力"},{"k":"C","t":"轮式磨的磨辊不能翻身使用"},{"k":"D","t":"碗式磨的磨碗是水平的，没有任何倾斜角"}],"answer":"B","why":["A ✗ **凹弧形**是**轮式（MPS）**的特点；碗式（HP）的接触面是**直线状**，受力均匀、均处最大正压。","B ✓ 视频第7集：MPS 轮式磨「**三个磨轮，呈三点受力状况，磨煤机的机体不受力，不影响密封**」。","C ✗ MPS「磨轮辊胎**对称**，一侧磨损严重时可**翻身继续使用**」。","D ✗ 碗式磨「磨碗具一定**倾斜角**」，使煤块重力部分抵消离心力、延长停留时间。"],"basis":"视频第7集 @ 17:25–17:30"}]}]},{"id":"heat","name":"传热学","short":"传热学","meta":"陶文铨 第六版 · 待拆（正文扫描件需 OCR）","color":"#1971c2","chapters":[]},{"id":"elec","name":"电工学","short":"电工学","meta":"秦曾煌 第七版（下册）· 待拆（PDF 加密待解密）","color":"#2f9e44","chapters":[]},{"id":"control","name":"机械工程控制基础","short":"控制基础","meta":"杨叔子 等 第7版 · 待拆（扫描件书签无章节名）","color":"#7048e8","chapters":[]}]}</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById('payload').textContent);
  var PS = { 1:{l:'课件题目',c:'#e8590c',b:'#fff0e6'}, 2:{l:'视频考点',c:'#1971c2',b:'#e7f1fb'},
             3:{l:'教材考点',c:'#2f9e44',b:'#e8f6ec'}, 4:{l:'补充练习',c:'#868e96',b:'#f1f3f5'} };
  var MAX_NONKEY = 0.25;

  /* ---------- 进度/错题本（localStorage） ---------- */
  var LS_KEY = 'majorapp.v1';
  function loadState() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveState(st) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(st)); } catch (e) {}
  }
  var state = loadState();
  state.wrong = state.wrong || {};      // qid -> 错误次数
  state.right = state.right || {};      // qid -> 连续答对次数
  function markRight(id){ state.right[id]=(state.right[id]||0)+1; state.wrong[id]=0; saveState(state); }
  function markWrong(id){ state.wrong[id]=(state.wrong[id]||0)+1; state.right[id]=0; saveState(state); }

  /* ---------- 工具 ---------- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  // 支持 **加粗**
  function rich(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); }
  function el(tag, cls, html){ var d=document.createElement(tag); if(cls)d.className=cls; if(html!=null)d.innerHTML=html; return d; }
  function $(id){ return document.getElementById(id); }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

  // 「重点题」= 带考点标签，或本身就是例题/计算题（例题永远入选，不受非重点限额）
  function isKey(q){
    return (q.keyPoints && q.keyPoints.length) || q.kind === '例题' || q.kind === '计算';
  }
  function stats(ch){
    var qs=(ch&&ch.questions)||[], by={};
    qs.forEach(function(q){ by[q.priority]=(by[q.priority]||0)+1; });
    return { total:qs.length, key:qs.filter(isKey).length, nonKey:qs.filter(function(q){return !isKey(q);}).length, by:by };
  }
  /* ---------- 出题引擎：课件题优先 + 非重点限额 + 错题加权 ---------- */
  function buildQuiz(ch, count){
    var all=(ch.questions||[]).slice(); if(!all.length) return [];
    function score(q){
      var s = q.priority*100;                       // 优先级主导：1 课件题最优先
      if(isKey(q)) s -= 40;                          // 重点题提权
      s -= Math.min(state.wrong[q.id]||0,3)*35;      // 错过的题提权
      s += Math.min(state.right[q.id]||0,2)*30;      // 连对的题降权
      return s;
    }
    var key=all.filter(isKey).sort(function(a,b){return score(a)-score(b);});
    var non=all.filter(function(q){return !isKey(q);}).sort(function(a,b){return score(a)-score(b);});
    var maxNon=Math.floor(count*MAX_NONKEY), out=[];
    key.forEach(function(q){ if(out.length<count) out.push(q); });
    var used=0;
    non.forEach(function(q){ if(out.length<count && used<maxNon){ out.push(q); used++; } });
    non.forEach(function(q){ if(out.length<count && out.indexOf(q)<0) out.push(q); });
    return out.sort(function(a,b){ return a.priority-b.priority; });
  }
  function judge(q, resp){
    if(q.kind==='填空'){
      var norm=function(s){ return String(s==null?'':s).replace(/\s/g,'').replace(/[，,。.；;]/g,''); };
      var a=norm(q.answer), g=norm(resp); if(!g) return false;
      return a.split(/；|;/).filter(Boolean).every(function(p){ return g.indexOf(p)>=0; });
    }
    var x=String(q.answer||'').split('').sort().join('');
    var y=String(resp||'').split('').sort().join('');
    return x.length>0 && x===y;
  }

  /* ---------- 路由状态 ---------- */
  var R = { sub:null, ch:null, tab:'mind' };

  function curSub(){ return DATA.subjects.filter(function(s){return s.id===R.sub;})[0]; }
  function curCh(){ var s=curSub(); if(!s) return null; return (s.chapters||[]).filter(function(c){return c.id===R.ch;})[0]; }

  /* ---------- 渲染：科目切换器 ---------- */
  function renderSubjects(){
    var box=$('subjects'); box.innerHTML='';
    DATA.subjects.forEach(function(s){
      var has=(s.chapters||[]).length>0;
      var b=el('button','subj'+(R.sub===s.id?' on':''), esc(s.name));
      if(R.sub===s.id) b.style.background=s.color;
      b.onclick=function(){ if(!has && R.sub!==s.id) return; R.sub=s.id; R.ch=null; R.tab='mind'; render(); };
      box.appendChild(b);
    });
  }

  /* ---------- 渲染：首页 ---------- */
  function renderHome(){
    var m=$('main'); m.innerHTML='';
    m.appendChild(el('div','h1','专业课'));
    m.appendChild(el('div','sub','课件 ＞ 视频 ＞ 课本 · 课件题优先 · 考点标清'));
    DATA.subjects.forEach(function(s){
      var n=(s.chapters||[]).length;
      var qn=(s.chapters||[]).reduce(function(a,c){return a+(c.questions||[]).length;},0);
      var btn=el('button','scard'+(n?'':' off'));
      btn.innerHTML =
        '<div class="bar" style="background:'+s.color+'"></div>'+
        '<div class="body"><div class="nm">'+esc(s.name)+'</div>'+
        '<div class="mt">'+esc(s.meta)+'</div>'+
        '<div class="chips">'+(n
            ? '<span class="chip" style="background:'+s.color+'1a;color:'+s.color+'">'+n+' 章</span><span class="chip">'+qn+' 题</span>'
            : '<span class="chip">内容建设中</span>')+
        '</div></div>'+(n?'<div class="arrow">›</div>':'');
      if(n) btn.onclick=function(){ R.sub=s.id; R.ch=null; R.tab='mind'; render(); };
      m.appendChild(btn);
    });
    m.appendChild(el('div','sub center','来源优先级：雨课堂课件 ▸ 视频 ▸ 课本'));
  }

  /* ---------- 渲染：章节列表 ---------- */
  function renderChapters(){
    var s=curSub(), m=$('main'); m.innerHTML='';
    m.appendChild(el('div','sub',esc(s.meta)));
    (s.chapters||[]).forEach(function(c){
      var st=stats(c);
      var b=el('button','ccard');
      b.innerHTML='<div class="between"><div class="nm">'+esc(c.name)+'</div><div class="muted" style="font-size:20px">›</div></div>'+
        (c.subtitle?'<div class="small muted" style="margin-top:2px">'+esc(c.subtitle)+'</div>':'')+
        '<div class="chips row" style="margin-top:10px">'+
          '<span class="chip" style="background:'+s.color+'1a;color:'+s.color+'">'+esc(c.status||'未学')+'</span>'+
          '<span class="chip">重点 '+st.key+'</span><span class="chip">题 '+st.total+'</span>'+
          (st.by[1]?'<span class="chip" style="background:#fff0e6;color:#e8590c">课件题 '+st.by[1]+'</span>':'')+
        '</div>';
      b.onclick=function(){ R.ch=c.id; R.tab='mind'; render(); };
      m.appendChild(b);
    });
  }

  /* ---------- 渲染：章节详情 ---------- */
  function renderDetail(){
    var s=curSub(), c=curCh(), m=$('main');
    m.innerHTML='';
    // tabs
    var tabs=el('div','tabs');
    var tabDefs=[['mind','思维导图'],['points','重点'],['quiz','练习'],['kp','考点清单']];
    tabDefs.forEach(function(t){
      var b=el('button','tab'+(R.tab===t[0]?' on':''), t[1]);
      if(R.tab===t[0]) b.style.color=s.color;
      b.onclick=function(){ R.tab=t[0]; render(); };
      tabs.appendChild(b);
    });
    // 错题本（有错题时显示，带角标）
    var wl=wrongList();
    var wb=el('button','tab'+(R.tab==='wrong'?' on':''), '错题本'+(wl.length?' ('+wl.length+')':''));
    if(R.tab==='wrong') wb.style.color='#e03131';
    wb.onclick=function(){ R.tab='wrong'; render(); };
    tabs.appendChild(wb);
    m.appendChild(tabs);
    var pane=el('div'); m.appendChild(pane);
    if(R.tab==='mind') paneMind(pane,c,s);
    else if(R.tab==='points') panePoints(pane,c,s);
    else if(R.tab==='kp') paneKP(pane,c,s);
    else if(R.tab==='wrong') paneWrong(pane);
    else paneQuiz(pane,c,s);
  }

  /* --- 思维导图（折叠树） --- */
  function paneMind(root,ch,s){
    var wrap=el('div');
    var bar=el('div','row','');
    bar.style.cssText='justify-content:flex-end;margin-bottom:10px';
    var b1=el('button','tbtn','全部展开'), b2=el('button','tbtn','全部收起');
    bar.appendChild(b1); bar.appendChild(b2); wrap.appendChild(bar);
    var card=el('div','card'); card.appendChild(el('div','small muted','点 ＋ / − 逐层展开（手机上比缩放巨图好用）'));
    var tree=el('div','tree'); tree.style.marginTop='8px';
    var openSet={}; // path -> true
    function render(){
      tree.innerHTML='';
      tree.appendChild(el('div','troot', esc(ch.mindmap.label)));
      (ch.mindmap.children||[]).forEach(function(n,i){ node(n,'0.'+i,1,tree); });
    }
    function node(n,path,depth,parent){
      var kids=n.children||[], open=!!openSet[path];
      var box=el('div','tnode'); parent.appendChild(box);
      var row=el('div','trow');
      var dot=el('div', kids.length?('dot'+(open?' open':'')):'dot leaf', kids.length?(open?'−':'+'):'');
      var lb=el('div','lb '+(depth===1?'lv1':'lv2'), rich(n.label));
      row.appendChild(dot); row.appendChild(lb); box.appendChild(row);
      if(kids.length){
        row.onclick=function(){ if(open) delete openSet[path]; else openSet[path]=1; render(); };
        if(open) kids.forEach(function(k,j){ node(k,path+'.'+j,depth+1,box); });
      }
    }
    function collect(n,path,out){ out.push(path); (n.children||[]).forEach(function(c,i){ collect(c,path+'.'+i,out); }); return out; }
    b1.onclick=function(){ openSet={}; collect(ch.mindmap,'r',[]).forEach(function(p){ if(p!=='r') openSet[p]=1; }); render(); };
    b2.onclick=function(){ openSet={}; render(); };
    // 默认展开第一层
    (ch.mindmap.children||[]).forEach(function(n,i){ openSet['0.'+i]=1; });
    render();
    card.appendChild(tree); wrap.appendChild(card); root.appendChild(wrap);
  }

  /* --- 重点 --- */
  function panePoints(root,ch,s){
    (ch.points||[]).forEach(function(p){
      var c=el('div','card');
      c.innerHTML='<div class="between"><div class="ptitle">'+esc(p.title)+'</div>'+
        (p.key?'<span class="chip" style="background:#fff0e6;color:#e8590c">★ 重点</span>':'')+'</div>'+
        '<div class="psrc">'+esc(p.source||'')+'</div><hr>'+
        (p.items||[]).map(function(it){ return '<div class="bul"><div class="d">·</div><div class="t">'+rich(it)+'</div></div>'; }).join('');
      root.appendChild(c);
    });
  }

  /* --- 考点清单 --- */
  function paneKP(root,ch,s){
    var map={};
    (ch.questions||[]).forEach(function(q){
      (q.keyPoints||[]).forEach(function(k){
        map[k]=map[k]||{n:0,src:{},wrong:0};
        map[k].n++;
        var src=(q.sourceDetail||q.basis||q.source||'');
        map[k].src[src]=(map[k].src[src]||0)+1;
        if(state.wrong[q.id]) map[k].wrong++;
      });
    });
    var keys=Object.keys(map);
    if(!keys.length){ root.appendChild(el('div','empty','本章暂无考点标签')); return; }
    root.appendChild(el('div','small muted','本章共 '+keys.length+' 个考点 · 按错题数排序'));
    keys.sort(function(a,b){ return (map[b].wrong-map[a].wrong)||(map[b].n-map[a].n); });
    keys.forEach(function(k){
      var v=map[k];
      var c=el('div','card');
      c.innerHTML='<div class="between"><div style="font-size:16px;font-weight:800">'+esc(k)+'</div>'+
        (v.wrong?'<span class="chip" style="background:#fff0f0;color:#e03131">错 '+v.wrong+'</span>':'')+'</div>'+
        '<div class="small muted" style="margin-top:6px">关联 '+v.n+' 题</div>'+
        '<div class="small muted" style="margin-top:4px">出处：'+esc(Object.keys(v.src).join(' · '))+'</div>';
      root.appendChild(c);
    });
  }

  /* --- 练习 --- */
  var Q=null;
  function paneQuiz(root,ch,s){
    var st=stats(ch);
    // Q.chId==='__wrong__' 表示「只练错题」模式，不按本章重置
    if(!Q || (Q.chId!==ch.id && Q.chId!=='__wrong__')){
      var c=el('div','card');
      c.innerHTML='<div style="font-size:18px;font-weight:800">本章练习</div>'+
        '<div class="small muted" style="margin:8px 0 0">共 '+st.total+' 题 ｜ 重点 '+st.key+' ｜ 非重点 '+st.nonKey+'</div>'+
        '<div class="small muted" style="margin-top:4px">出题规则：<b>课件题目优先</b>，非重点题占比 ≤ '+Math.round(MAX_NONKEY*100)+'%，错题加权</div><hr>';
      [5,10,st.total].filter(function(v,i,a){return v>0&&a.indexOf(v)===i;}).forEach(function(n){
        var b=el('button','btn','开始 '+n+' 题'); b.style.background=s.color;
        b.onclick=function(){ startQuiz(ch,n); };
        c.appendChild(b);
      });
      var wl=wrongList();
      if(wl.length){
        var wb=el('button','btn ghost','只练错题（'+wl.length+' 题）');
        wb.onclick=function(){ startWrongQuiz(wl.map(function(x){return x.q;})); };
        c.appendChild(wb);
      }
      root.appendChild(c); return;
    }
    if(Q.i>=Q.list.length){ return quizDone(root,ch,s); }
    var q=Q.list[Q.i], ps=PS[q.priority]||PS[4], isFill=q.kind==='填空', isExample=(q.kind==='例题'||q.kind==='计算');
    // 进度
    var pr=el('div','row'); pr.style.marginBottom='12px';
    pr.appendChild(el('div','small',''+(Q.i+1)+' / '+Q.list.length));
    var bar=el('div','bar2'); bar.innerHTML='<i style="width:'+(((Q.i+(Q.done?1:0))/Q.list.length)*100)+'%;background:'+s.color+'"></i>';
    pr.appendChild(bar); root.appendChild(pr);

    var c=el('div','card');
    c.appendChild(el('div','row',
      '<span class="tag" style="background:'+ps.b+';color:'+ps.c+'">'+ps.l+'</span>'+
      '<span class="chip">'+esc(q.kind)+'</span>'+
      '<span class="small muted">'+esc(q.basis||'')+'</span>'));
    if(isKey(q)){
      var kp=el('div','kp');
      kp.appendChild(el('span','lab','考点'));
      q.keyPoints.forEach(function(k){ kp.appendChild(el('span','k',esc(k))); });
      c.appendChild(kp);
    }
    c.appendChild(el('div','stem', rich(q.stem)));

    if(isExample){
      /* ---- 例题：已知 → 求解 →（点开）解答过程 → 结果 ---- */
      if((q.given||[]).length){
        c.appendChild(el('div','exlabel','已知'));
        c.appendChild(el('div','exbox', q.given.map(function(g){
          return '<div class="bul"><div class="d">·</div><div class="t">'+rich(g)+'</div></div>';
        }).join('')));
      }
      if((q.ask||[]).length){
        c.appendChild(el('div','exlabel','求解'));
        c.appendChild(el('div','exbox', q.ask.map(function(g){
          return '<div class="bul"><div class="d">·</div><div class="t">'+rich(g)+'</div></div>';
        }).join('')));
      }
      var showSol = !!Q.done || !!Q.solOpen;
      if(showSol){
        if((q.steps||[]).length){
          c.appendChild(el('div','exlabel','解答过程'));
          c.appendChild(el('div','exbox steps', q.steps.map(function(s, i){
            return '<div class="bul"><div class="d">'+(i+1)+'</div><div class="t">'+rich(s)+'</div></div>';
          }).join('')));
        }
        if(q.result) c.appendChild(el('div','exres','结果：'+rich(q.result)));
      }
      var rb0=el('div','res');
      (q.why||[]).forEach(function(w){ rb0.appendChild(el('div','bul','<div class="d">›</div><div class="t">'+rich(w)+'</div>')); });
      if(q.basis) rb0.appendChild(el('div','basis','依据：'+esc(q.basis)));
      if(q.answerNote) rb0.appendChild(el('div','note','⚠️ '+esc(q.answerNote)));
      if(rb0.innerHTML) c.appendChild(rb0);
    } else if(isFill){
      var inp=el('input','fill'); inp.placeholder='输入答案'; inp.value=Q.text||'';
      inp.disabled=!!Q.done;
      inp.oninput=function(){ Q.text=inp.value; var b=$('qsubmit'); if(b) b.disabled=!inp.value.trim(); };
      if(Q.done) inp.style.background = Q.lastOk ? '#e8f6ec' : '#fff0f0';
      c.appendChild(inp);
    } else {
      (q.options||[]).forEach(function(op){
        var sel = q.kind==='多选' ? String(Q.pick||'').indexOf(op.k)>=0 : Q.pick===op.k;
        var isAns = String(q.answer).indexOf(op.k)>=0;
        var cls='opt', mark='';
        if(Q.done){
          if(isAns){ cls+=' ok'; mark='✓'; }
          else if(sel){ cls+=' no'; mark='✗'; }
        } else if(sel) cls+=' sel';
        var d=el('div',cls,'<div class="k">'+esc(op.k)+'</div><div class="t">'+rich(op.t)+'</div>'+(mark?'<div class="m">'+mark+'</div>':''));
        if(!Q.done) d.onclick=function(){
          if(q.kind==='多选'){
            var cur=String(Q.pick||'').split(''), i=cur.indexOf(op.k);
            if(i>=0) cur.splice(i,1); else cur.push(op.k);
            Q.pick=cur.sort().join('');
          } else Q.pick=op.k;
          render();
        };
        c.appendChild(d);
      });
    }

    if(Q.done){
      var ok=Q.lastOk;
      var rb=el('div','res');
      rb.appendChild(el('h4',null,'<span style="color:'+(ok?'#2f9e44':'#e03131')+'">'+(ok?'✓ 回答正确':'✗ 回答错误　正确答案：'+esc(q.answer))+'</span>'));
      (q.why||[]).forEach(function(w){ rb.appendChild(el('div','bul','<div class="d">›</div><div class="t">'+rich(w)+'</div>')); });
      if(q.basis) rb.appendChild(el('div','basis','依据：'+esc(q.basis)));
      if(q.answerNote) rb.appendChild(el('div','note','⚠️ '+esc(q.answerNote)));
      c.appendChild(rb);
    }

    var act=el('div'); act.style.marginTop='12px';
    if(isExample){
      /* 例题：先自己算，再点开看解答 */
      if(!Q.done){
        var sb=el('button','btn','看解答'); sb.style.background=s.color;
        sb.onclick=function(){ Q.solOpen=true; Q.done=true; render(); };
        act.appendChild(sb);
      } else {
        var nb2=el('button','btn', (Q.i+1>=Q.list.length?'看结果':'下一题')); nb2.style.background=s.color;
        nb2.onclick=function(){ Q.i++; Q.pick=''; Q.text=''; Q.done=false; Q.solOpen=false; render(); };
        act.appendChild(nb2);
      }
    } else if(!Q.done){
      var b=el('button','btn'+(isFill?'':'')+'','提交'); b.id='qsubmit'; b.style.background=s.color;
      if(isFill && !(Q.text||'').trim()) b.disabled=true;
      if(!isFill && !Q.pick) b.disabled=true;
      b.onclick=function(){
        Q.lastOk=judge(q, isFill?Q.text:Q.pick);
        if(Q.lastOk) markRight(q.id); else markWrong(q.id);
        Q.done=true; render();
      };
      act.appendChild(b);
    } else {
      var nb=el('button','btn', (Q.i+1>=Q.list.length?'看结果':'下一题')); nb.style.background=s.color;
      nb.onclick=function(){ Q.i++; Q.pick=''; Q.text=''; Q.done=false; render(); };
      act.appendChild(nb);
    }
    c.appendChild(act);
    root.appendChild(c);
    var ex=el('button','btn ghost','退出练习');
    ex.onclick=function(){ Q=null; render(); };
    root.appendChild(ex);
  }
  function startQuiz(ch,n){
    Q={ chId:ch.id, list:buildQuiz(ch,n), i:0, pick:'', text:'', done:false, wrong:[] };
    render();
  }
  function quizDone(root,ch,s){
    var right=Q.list.length-Q.wrong.length;
    var kps={}; Q.wrong.forEach(function(q){ (q.keyPoints||[]).forEach(function(k){ kps[k]=1; }); });
    var c=el('div','card center');
    c.innerHTML='<div style="font-size:18px;font-weight:800">完成</div>'+
      '<div class="big">'+right+' / '+Q.list.length+'</div>'+
      '<div class="small muted">正确率 '+Math.round(right/Q.list.length*100)+'%</div>'+
      (Q.wrong.length
        ? '<div class="small" style="margin-top:10px">错题考点：'+esc(Object.keys(kps).join(' · ')||'（无考点标签）')+'</div>'
        : '<div class="small" style="margin-top:10px">全对，很棒</div>')+'<hr>';
    var b=el('button','btn','再来一组'); b.style.background=s.color;
    b.onclick=function(){ startQuiz(ch, Q.list.length); }; c.appendChild(b);
    var b2=el('button','btn ghost','返回练习设置'); b2.onclick=function(){ Q=null; render(); }; c.appendChild(b2);
    root.appendChild(c);
  }

  /* --- 错题本（跨章累计） --- */
  function allQuestions(){
    var out=[];
    DATA.subjects.forEach(function(s){
      (s.chapters||[]).forEach(function(c){
        (c.questions||[]).forEach(function(q){ out.push({q:q, sub:s, ch:c}); });
      });
    });
    return out;
  }
  function wrongList(){
    return allQuestions().filter(function(it){ return (state.wrong[it.q.id]||0) > 0; })
      .sort(function(a,b){ return (state.wrong[b.q.id]||0)-(state.wrong[a.q.id]||0); });
  }
  function paneWrong(root){
    var list=wrongList();
    if(!list.length){
      root.appendChild(el('div','empty','还没有错题。<br>去「练习」做几题吧 —— 做错的题会自动收进这里。'));
      return;
    }
    var stat=el('div','card');
    stat.innerHTML='<div class="between"><div style="font-size:17px;font-weight:800">错题本</div>'+
      '<span class="chip" style="background:#fff0f0;color:#e03131">'+list.length+' 题</span></div>'+
      '<div class="small muted" style="margin-top:6px">按错误次数排序 · 累计记录在本机</div>';
    var b=el('button','btn','只练错题（'+list.length+' 题）');
    b.onclick=function(){ startWrongQuiz(list.map(function(x){return x.q;})); };
    stat.appendChild(el('hr')); stat.appendChild(b);
    root.appendChild(stat);

    list.forEach(function(it){
      var q=it.q, ps=PS[q.priority]||PS[4];
      var c=el('div','card');
      var kp=(q.keyPoints||[]).map(function(k){ return '<span class="k">'+esc(k)+'</span>'; }).join('');
      c.innerHTML='<div class="row"><span class="tag" style="background:'+ps.b+';color:'+ps.c+'">'+ps.l+'</span>'+
        '<span class="chip" style="background:#fff0f0;color:#e03131">错 '+(state.wrong[q.id]||0)+' 次</span>'+
        '<span class="small muted">'+esc(it.sub.name+' · '+it.ch.name)+'</span></div>'+
        (kp?'<div class="kp"><span class="lab">考点</span>'+kp+'</div>':'')+
        '<div class="stem" style="margin:10px 0 8px">'+rich(q.stem)+'</div>'+
        '<div class="basis">正确答案：<b>'+esc(q.answer)+'</b>　依据：'+esc(q.basis||'')+'</div>';
      root.appendChild(c);
    });
    var clr=el('button','btn ghost','清空错题本');
    clr.onclick=function(){ if(confirm('确定清空所有错题记录？')){ state.wrong={}; saveState(state); render(); } };
    root.appendChild(clr);
  }
  function startWrongQuiz(qs){
    Q={ chId:'__wrong__', list:qs, i:0, pick:'', text:'', done:false, wrong:[] };
    R.tab='quiz'; render();
  }

  /* ---------- 总渲染 ---------- */
  function render(){
    renderSubjects();
    var t=$('ttl'), back=$('back');
    if(!R.sub){ t.textContent='专业课'; back.style.display='none'; renderHome(); return; }
    var s=curSub();
    if(!R.ch){ t.textContent=s.name; back.style.display='block'; renderChapters(); return; }
    t.textContent=curCh().name; back.style.display='block'; renderDetail();
  }
  $('back').onclick=function(){
    if(R.ch){ R.ch=null; Q=null; render(); }
    else if(R.sub){ R.sub=null; render(); }
  };

  /* 记录本次练习错题（供结果页用）；例题不算错题 */
  var _oldRender = render;
  render = function(){
    var cur = Q && Q.list[Q.i];
    if(Q && Q.done && cur && Q.lastOk===false
       && cur.kind!=='例题' && cur.kind!=='计算'
       && Q.wrong.indexOf(cur)<0){
      Q.wrong.push(cur);
    }
    _oldRender();
  };

  /* 深链：?subject=boiler&chapter=boiler-intro&tab=points */
  try{
    var p=new URLSearchParams(location.search);
    if(p.get('subject')) R.sub=p.get('subject');
    if(p.get('chapter')) R.ch=p.get('chapter');
    if(p.get('tab')) R.tab=p.get('tab');
  }catch(e){}

  /* 注册 Service Worker（离线可用）。file:// 下会失败，忽略即可。 */
  if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }

  render();
})();
</script>
</body>
</html>
