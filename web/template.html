<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="专业课">
<meta name="description" content="按专业课分科，每章含思维导图、重点、依据重点出题；课件题优先、考点标清。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>专业课</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
  body{
    background:#f7f8fa;color:#1f2933;
    font:15px/1.62 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  /* ---------- 顶栏 ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;background:#fff;
    border-bottom:1px solid #e8ebef;padding-top:env(safe-area-inset-top);
  }
  .topbar .inner{display:flex;align-items:center;gap:8px;padding:10px 14px}
  .back{font-size:15px;color:#6b7280;font-weight:600;background:none;border:0;padding:6px 2px;cursor:pointer}
  .title{flex:1;text-align:center;font-size:17px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .spacer{width:52px}
  .subjects{display:flex;gap:8px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
  .subjects::-webkit-scrollbar{display:none}
  .subj{
    flex:0 0 auto;border:1px solid #e8ebef;background:#fff;color:#6b7280;
    padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .subj.on{color:#fff;border-color:transparent}
  /* ---------- tab ---------- */
  .tabs{display:flex;background:#fff;border-bottom:1px solid #e8ebef;position:sticky;top:0;z-index:15}
  .tab{flex:1;text-align:center;padding:12px 0;font-size:14px;font-weight:600;color:#6b7280;
       background:none;border:0;position:relative;cursor:pointer}
  .tab.on{font-weight:800}
  .tab.on::after{content:"";position:absolute;left:22%;right:22%;bottom:0;height:2.5px;border-radius:2px;background:currentColor}
  /* ---------- 通用 ---------- */
  main{flex:1;padding:14px;padding-bottom:48px}
  .card{background:#fff;border:1px solid #e8ebef;border-radius:12px;padding:16px;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .between{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:#f1f3f5;color:#6b7280}
  .h1{font-size:26px;font-weight:800;margin:8px 0 2px}
  .sub{font-size:12.5px;color:#9aa5b1;margin-bottom:16px}
  .muted{color:#9aa5b1}
  .small{font-size:12px}
  b,strong{font-weight:800;color:#111827}
  /* ---------- 科目卡 ---------- */
  .scard{display:flex;background:#fff;border:1px solid #e8ebef;border-radius:16px;overflow:hidden;margin-bottom:12px;cursor:pointer;width:100%;text-align:left;padding:0}
  .scard .bar{width:5px;flex:0 0 5px}
  .scard .body{flex:1;padding:16px;min-width:0}
  .scard .nm{font-size:18px;font-weight:800}
  .scard .mt{font-size:12.5px;color:#6b7280;margin-top:4px}
  .scard .chips{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  .scard .arrow{align-self:center;font-size:24px;color:#cbd2d9;padding-right:14px}
  .scard.off{opacity:.55;cursor:default}
  /* ---------- 章节卡 ---------- */
  .ccard{background:#fff;border:1px solid #e8ebef;border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer;width:100%;text-align:left}
  .ccard .nm{font-size:17px;font-weight:800}
  /* ---------- 折叠树 ---------- */
  .tree{font-size:14px}
  .tnode{padding-left:14px;border-left:1.5px solid #ffe0cc;margin-left:4px}
  .trow{display:flex;align-items:flex-start;gap:8px;padding:4px 0;cursor:pointer}
  .trow .dot{
    flex:0 0 18px;width:18px;height:18px;border-radius:9px;border:1.5px solid #e8590c;background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#e8590c;margin-top:2px;
  }
  .trow .dot.open{background:#e8590c;color:#fff}
  .trow .dot.leaf{width:6px;height:6px;border:0;background:#e8590c;border-radius:3px;flex:0 0 6px;margin:8px 6px 0 6px}
  .trow .lb{flex:1;min-width:0;word-break:break-word}
  .trow .lb.lv1{font-size:14.5px;font-weight:800;padding-left:6px;border-left:3px solid #e8590c;margin:3px 0}
  .trow .lb.lv2{font-size:13.5px;color:#4b5563}
  .troot{display:inline-block;background:#e8590c;color:#fff;font-weight:800;font-size:15px;padding:6px 14px;border-radius:999px;margin-bottom:6px}
  .tbtn{border:0;background:#f1f3f5;color:#6b7280;font-weight:700;font-size:12px;padding:5px 10px;border-radius:999px;cursor:pointer}
  /* ---------- 重点 ---------- */
  .ptitle{font-size:16px;font-weight:800;margin:0 0 2px}
  .psrc{font-size:11.5px;color:#9aa5b1;margin-bottom:10px}
  .bul{display:flex;gap:8px;margin-bottom:6px}
  .bul .d{color:#e8590c;font-weight:800;flex:0 0 14px}
  .bul .t{flex:1;min-width:0;word-break:break-word}
  hr{border:0;border-top:1px solid #e8ebef;margin:12px 0}
  /* ---------- 练习 ---------- */
  .bar2{height:5px;background:#e8ebef;border-radius:3px;overflow:hidden;flex:1}
  .bar2 i{display:block;height:100%;background:#e8590c}
  .stem{font-size:16px;font-weight:600;line-height:1.6;margin:12px 0 14px;word-break:break-word}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid #e8ebef;border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;background:#fff}
  .opt.sel{border-color:#e8590c;background:#fff8f3}
  .opt.ok{border-color:#2f9e44;background:#e8f6ec}
  .opt.no{border-color:#e03131;background:#fff0f0}
  .opt .k{font-weight:800;flex:0 0 18px}
  .opt .t{flex:1;min-width:0;word-break:break-word}
  .opt .m{font-weight:800}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:15.5px;font-weight:800;color:#fff;background:#e8590c;cursor:pointer;margin-bottom:10px}
  .btn:disabled{background:#ced4da}
  .btn.ghost{background:none;color:#6b7280;font-weight:700}
  .res{margin-top:12px;padding-top:12px;border-top:1px solid #e8ebef}
  /* 公式：等宽 + 下标/上标 */
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
       background:#f1f4f8;border:1px solid #e3e8ee;border-radius:5px;
       padding:1px 5px;font-size:.93em;color:#0b5cad;overflow-wrap:anywhere;line-height:1.9}
  sub,sup{font-size:.7em;line-height:0;position:relative}
  sub{bottom:-.28em}
  sup{top:-.5em}
  /* 课件配图 */
  .thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .thumb{flex:0 0 auto;position:relative;border:1px solid #dfe5ec;border-radius:8px;overflow:hidden;background:#fff}
  .thumb picture{display:block}
  .thumb img{display:block;width:230px;height:auto;cursor:zoom-in}
  .thumb .pg{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;
             font-size:11px;font-weight:700;padding:2px 6px;border-top-right-radius:6px;z-index:1}
  .lb{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;
      background:rgba(12,16,22,.94);z-index:99;display:flex;display:-webkit-flex;
      align-items:center;justify-content:center;padding:12px;flex-direction:column;gap:10px;
      -webkit-overflow-scrolling:touch;overflow:auto}
  .lb>div{flex:0 0 auto}
  .lb img{max-width:100%;max-height:82vh;width:auto;height:auto;border-radius:8px;background:#fff;display:block}
  .lb .cap{color:#e9eef5;font-size:13px;font-weight:700;text-align:center;padding:0 8px}
  .lb .hint{color:#9fb0c4;font-size:12px}
  .lb .err{color:#ffd8a8;font-size:13px;text-align:center;padding:14px;line-height:1.7}
  .lb .spin{color:#9fb0c4;font-size:13px}
  /* 例题 */
  .exlabel{font-size:12px;font-weight:800;color:#e8590c;letter-spacing:.06em;margin:12px 0 5px}
  .exbox{background:#fafbfc;border:1px solid #eef1f4;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.75}
  .exbox .bul{margin-bottom:4px}
  .exbox .bul:last-child{margin-bottom:0}
  .exbox.steps .d{flex:0 0 20px;color:#1971c2;font-weight:800}
  .exres{margin-top:12px;padding:10px 12px;background:#e8f6ec;border:1px solid #bfe3c9;border-radius:10px;font-size:14.5px;font-weight:700;color:#1b6b2f}
  .res h4{margin:0 0 10px;font-size:15px;font-weight:800}
  .kp{margin:10px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .kp .lab{font-size:11.5px;color:#9aa5b1;font-weight:700}
  .kp .k{background:#fff7ed;color:#b45309;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
  .basis{font-size:12px;color:#6b7280;margin-top:8px}
  .note{font-size:11.5px;color:#b45309;margin-top:6px;line-height:1.5}
  input.fill{width:100%;border:1.5px solid #e8ebef;border-radius:12px;padding:12px;font-size:15px;font-family:inherit}
  input.fill:focus{outline:none;border-color:#e8590c}
  .center{text-align:center}
  .big{font-size:38px;font-weight:800;margin:8px 0}
  .tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800}
  .empty{padding:28px;text-align:center;color:#9aa5b1;background:#fff;border:1px solid #e8ebef;border-radius:12px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="inner">
      <button class="back" id="back" style="display:none">‹ 返回</button>
      <div class="title" id="ttl">专业课</div>
      <div class="spacer"></div>
    </div>
    <div class="subjects" id="subjects"></div>
  </div>
  <main id="main"></main>
</div>

<script id="payload" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById('payload').textContent);
  var PS = { 1:{l:'课件题目',c:'#e8590c',b:'#fff0e6'}, 2:{l:'视频考点',c:'#1971c2',b:'#e7f1fb'},
             3:{l:'教材考点',c:'#2f9e44',b:'#e8f6ec'}, 4:{l:'补充练习',c:'#868e96',b:'#f1f3f5'} };
  var MAX_NONKEY = 0.25;

  /* ---------- 进度/错题本（localStorage） ---------- */
  var LS_KEY = 'majorapp.v1';
  function loadState() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveState(st) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(st)); } catch (e) {}
  }
  var state = loadState();
  state.wrong = state.wrong || {};      // qid -> 错误次数
  state.right = state.right || {};      // qid -> 连续答对次数
  function markRight(id){ state.right[id]=(state.right[id]||0)+1; state.wrong[id]=0; saveState(state); }
  function markWrong(id){ state.wrong[id]=(state.wrong[id]||0)+1; state.right[id]=0; saveState(state); }

  /* ---------- 工具 ---------- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  // 公式排版：`代码`、**加粗**、_下标、^上标、Unicode 上下标 → 真正的 sub/sup
  var SUPMAP = {'\u2070':'0','\u00b9':'1','\u00b2':'2','\u00b3':'3','\u2074':'4','\u2075':'5','\u2076':'6','\u2077':'7','\u2078':'8','\u2079':'9','\u207f':'n'};
  var SUPCLS = '\\u2070\\u00b9\\u00b2\\u00b3\\u2074-\\u2079\\u207f';
  var SUBCLS = '\\u2080-\\u2089';
  function toSup(t){ return t.replace(new RegExp('['+SUPCLS+']','g'), function(c){ return SUPMAP[c]||c; }); }
  function toSub(t){ return t.replace(new RegExp('['+SUBCLS+']','g'), function(c){ return String.fromCharCode(c.charCodeAt(0)-0x2080+48); }); }
  // 一次扫描：^上标 | ^(上标) | _下标 | 上标字符 | 下标字符
  var FMT = new RegExp(
    '\\^\\(([^)]+)\\)' +                                     // ^(xx) 括号上标
    '|\\^([A-Za-z0-9\\.\\+\\-\\/\\u2212]+)' +                // ^xx
    '|_([A-Za-z0-9\\u0370-\\u03ff\\u2032-\\u2037,\\.\\u2212'+SUBCLS+']+)' +  // _xx（不含上标字符，避免 T_i⁴ 被并吞）
    '|(['+SUPCLS+']+)' +                                      // 连续上标
    '|(['+SUBCLS+']+)', 'g');                                 // 连续下标
  function fmtInline(t){
    return t.replace(FMT, function(m, pcaret, careted, subed, sup, sub){
      if(pcaret)  return '<sup>'+fmtInline(pcaret)+'</sup>';
      if(careted) return '<sup>'+careted+'</sup>';
      if(subed)   return '<sub>'+toSub(toSup(subed))+'</sub>';
      if(sup)     return '<sup>'+toSup(sup)+'</sup>';
      if(sub)     return '<sub>'+toSub(sub)+'</sub>';
      return m;
    });
  }
  function rich(s){
    // 顺序：转义 → 排公式（无标签时不会误伤）→ 先 `代码` → 再 **加粗**
    // 先处理代码，可让「**加粗里含 `公式`**」这种嵌套也被正确包住
    var x = fmtInline(esc(s));
    x = x.replace(/`([^`]+)`/g, '<code>$1</code>');
    x = x.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return x;
  }
  function el(tag, cls, html){ var d=document.createElement(tag); if(cls)d.className=cls; if(html!=null)d.innerHTML=html; return d; }
  function $(id){ return document.getElementById(id); }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

  // 「重点题」= 带考点标签，或本身就是例题/计算题（例题永远入选，不受非重点限额）
  function isKey(q){
    return (q.keyPoints && q.keyPoints.length) || q.kind === '例题' || q.kind === '计算';
  }
  function stats(ch){
    var qs=(ch&&ch.questions)||[], by={};
    qs.forEach(function(q){ by[q.priority]=(by[q.priority]||0)+1; });
    return { total:qs.length, key:qs.filter(isKey).length, nonKey:qs.filter(function(q){return !isKey(q);}).length, by:by };
  }
  /* ---------- 出题引擎：课件题优先 + 非重点限额 + 错题加权 ---------- */
  function buildQuiz(ch, count){
    var all=(ch.questions||[]).slice(); if(!all.length) return [];
    function score(q){
      var s = q.priority*100;                       // 优先级主导：1 课件题最优先
      if(isKey(q)) s -= 40;                          // 重点题提权
      s -= Math.min(state.wrong[q.id]||0,3)*35;      // 错过的题提权
      s += Math.min(state.right[q.id]||0,2)*30;      // 连对的题降权
      return s;
    }
    var key=all.filter(isKey).sort(function(a,b){return score(a)-score(b);});
    var non=all.filter(function(q){return !isKey(q);}).sort(function(a,b){return score(a)-score(b);});
    var maxNon=Math.floor(count*MAX_NONKEY), out=[];
    key.forEach(function(q){ if(out.length<count) out.push(q); });
    var used=0;
    non.forEach(function(q){ if(out.length<count && used<maxNon){ out.push(q); used++; } });
    non.forEach(function(q){ if(out.length<count && out.indexOf(q)<0) out.push(q); });
    return out.sort(function(a,b){ return a.priority-b.priority; });
  }
  function judge(q, resp){
    if(q.kind==='填空'){
      var norm=function(s){ return String(s==null?'':s).replace(/\s/g,'').replace(/[，,。.；;]/g,''); };
      var a=norm(q.answer), g=norm(resp); if(!g) return false;
      return a.split(/；|;/).filter(Boolean).every(function(p){ return g.indexOf(p)>=0; });
    }
    var x=String(q.answer||'').split('').sort().join('');
    var y=String(resp||'').split('').sort().join('');
    return x.length>0 && x===y;
  }

  /* ---------- 路由状态 ---------- */
  var R = { sub:null, ch:null, tab:'mind' };

  function curSub(){ return DATA.subjects.filter(function(s){return s.id===R.sub;})[0]; }
  function curCh(){ var s=curSub(); if(!s) return null; return (s.chapters||[]).filter(function(c){return c.id===R.ch;})[0]; }

  /* ---------- 渲染：科目切换器 ---------- */
  function renderSubjects(){
    var box=$('subjects'); box.innerHTML='';
    DATA.subjects.forEach(function(s){
      var has=(s.chapters||[]).length>0;
      var b=el('button','subj'+(R.sub===s.id?' on':''), esc(s.name));
      if(R.sub===s.id) b.style.background=s.color;
      b.onclick=function(){ if(!has && R.sub!==s.id) return; R.sub=s.id; R.ch=null; R.tab='mind'; render(); };
      box.appendChild(b);
    });
  }

  /* ---------- 渲染：首页 ---------- */
  function renderHome(){
    var m=$('main'); m.innerHTML='';
    m.appendChild(el('div','h1','专业课'));
    m.appendChild(el('div','sub','课件 ＞ 视频 ＞ 课本 · 课件题优先 · 考点标清'));
    DATA.subjects.forEach(function(s){
      var n=(s.chapters||[]).length;
      var qn=(s.chapters||[]).reduce(function(a,c){return a+(c.questions||[]).length;},0);
      var btn=el('button','scard'+(n?'':' off'));
      btn.innerHTML =
        '<div class="bar" style="background:'+s.color+'"></div>'+
        '<div class="body"><div class="nm">'+esc(s.name)+'</div>'+
        '<div class="mt">'+esc(s.meta)+'</div>'+
        '<div class="chips">'+(n
            ? '<span class="chip" style="background:'+s.color+'1a;color:'+s.color+'">'+n+' 章</span><span class="chip">'+qn+' 题</span>'
            : '<span class="chip">内容建设中</span>')+
        '</div></div>'+(n?'<div class="arrow">›</div>':'');
      if(n) btn.onclick=function(){ R.sub=s.id; R.ch=null; R.tab='mind'; render(); };
      m.appendChild(btn);
    });
    m.appendChild(el('div','sub center','来源优先级：雨课堂课件 ▸ 视频 ▸ 课本'));
  }

  /* ---------- 渲染：章节列表 ---------- */
  function renderChapters(){
    var s=curSub(), m=$('main'); m.innerHTML='';
    m.appendChild(el('div','sub',esc(s.meta)));
    (s.chapters||[]).forEach(function(c){
      var st=stats(c);
      var b=el('button','ccard');
      b.innerHTML='<div class="between"><div class="nm">'+esc(c.name)+'</div><div class="muted" style="font-size:20px">›</div></div>'+
        (c.subtitle?'<div class="small muted" style="margin-top:2px">'+esc(c.subtitle)+'</div>':'')+
        '<div class="chips row" style="margin-top:10px">'+
          '<span class="chip" style="background:'+s.color+'1a;color:'+s.color+'">'+esc(c.status||'未学')+'</span>'+
          '<span class="chip">重点 '+st.key+'</span><span class="chip">题 '+st.total+'</span>'+
          (st.by[1]?'<span class="chip" style="background:#fff0e6;color:#e8590c">课件题 '+st.by[1]+'</span>':'')+
        '</div>';
      b.onclick=function(){ R.ch=c.id; R.tab='mind'; render(); };
      m.appendChild(b);
    });
  }

  /* ---------- 渲染：章节详情 ---------- */
  function renderDetail(){
    var s=curSub(), c=curCh(), m=$('main');
    m.innerHTML='';
    // tabs
    var tabs=el('div','tabs');
    var tabDefs=[['mind','思维导图'],['points','重点'],['quiz','练习'],['kp','考点清单']];
    tabDefs.forEach(function(t){
      var b=el('button','tab'+(R.tab===t[0]?' on':''), t[1]);
      if(R.tab===t[0]) b.style.color=s.color;
      b.onclick=function(){ R.tab=t[0]; render(); };
      tabs.appendChild(b);
    });
    // 错题本（有错题时显示，带角标）
    var wl=wrongList();
    var wb=el('button','tab'+(R.tab==='wrong'?' on':''), '错题本'+(wl.length?' ('+wl.length+')':''));
    if(R.tab==='wrong') wb.style.color='#e03131';
    wb.onclick=function(){ R.tab='wrong'; render(); };
    tabs.appendChild(wb);
    m.appendChild(tabs);
    var pane=el('div'); m.appendChild(pane);
    if(R.tab==='mind') paneMind(pane,c,s);
    else if(R.tab==='points') panePoints(pane,c,s);
    else if(R.tab==='kp') paneKP(pane,c,s);
    else if(R.tab==='wrong') paneWrong(pane);
    else paneQuiz(pane,c,s);
  }

  /* --- 思维导图（折叠树） --- */
  function paneMind(root,ch,s){
    var wrap=el('div');
    var bar=el('div','row','');
    bar.style.cssText='justify-content:flex-end;margin-bottom:10px';
    var b1=el('button','tbtn','全部展开'), b2=el('button','tbtn','全部收起');
    bar.appendChild(b1); bar.appendChild(b2); wrap.appendChild(bar);
    var card=el('div','card'); card.appendChild(el('div','small muted','点 ＋ / − 逐层展开（手机上比缩放巨图好用）'));
    var tree=el('div','tree'); tree.style.marginTop='8px';
    var openSet={}; // path -> true
    function render(){
      tree.innerHTML='';
      tree.appendChild(el('div','troot', esc(ch.mindmap.label)));
      (ch.mindmap.children||[]).forEach(function(n,i){ node(n,'0.'+i,1,tree); });
    }
    function node(n,path,depth,parent){
      var kids=n.children||[], open=!!openSet[path];
      var box=el('div','tnode'); parent.appendChild(box);
      var row=el('div','trow');
      var dot=el('div', kids.length?('dot'+(open?' open':'')):'dot leaf', kids.length?(open?'−':'+'):'');
      var lb=el('div','lb '+(depth===1?'lv1':'lv2'), rich(n.label));
      row.appendChild(dot); row.appendChild(lb); box.appendChild(row);
      if(kids.length){
        row.onclick=function(){ if(open) delete openSet[path]; else openSet[path]=1; render(); };
        if(open) kids.forEach(function(k,j){ node(k,path+'.'+j,depth+1,box); });
      }
    }
    function collect(n,path,out){ out.push(path); (n.children||[]).forEach(function(c,i){ collect(c,path+'.'+i,out); }); return out; }
    b1.onclick=function(){ openSet={}; collect(ch.mindmap,'r',[]).forEach(function(p){ if(p!=='r') openSet[p]=1; }); render(); };
    b2.onclick=function(){ openSet={}; render(); };
    // 默认展开第一层
    (ch.mindmap.children||[]).forEach(function(n,i){ openSet['0.'+i]=1; });
    render();
    card.appendChild(tree); wrap.appendChild(card); root.appendChild(wrap);
  }

  /* --- 课件配图 --- */
  // 从 source 文本里抽出被引用的页码
  function srcPages(txt){
    var out=[];
    String(txt||'').replace(/(?:课件\s*)?(?:p|slide\s*)(\d{1,3})/g,function(m,n){
      var v=parseInt(n,10); if(v>=1&&v<=400&&out.indexOf(v)<0) out.push(v); return m;
    });
    return out.sort(function(a,b){return a-b;});
  }
  // 图片基路径（构建时注入：PWA 版为 img/，单文件版为 ../docs/img/）
  var IMGBASE = '__IMGBASE__';
  function imgURL(p){ return IMGBASE + String(p).replace(/^img\//, ''); }
  // 该章节有哪些图（值形如 {w:'...webp', j:'...jpg'}，兼容旧的纯字符串）
  function imgOf(ch){ return (ch&&ch.images)||{}; }
  function pickImg(v){
    if(!v) return null;
    if(typeof v === 'string') return { w: v, j: null };
    return { w: v.w || null, j: v.j || null };
  }
  // 生成配图条（只显示该卡 source 里点到、且确实有图的页）
  function thumbsHTML(ch, srcText, extraPages){
    var im=imgOf(ch); if(!im) return '';
    var pages=srcPages(srcText);
    (extraPages||[]).forEach(function(p){ if(pages.indexOf(p)<0) pages.push(p); });
    pages.sort(function(a,b){return a-b;});
    var use=pages.map(function(p){ return [p, pickImg(im[String(p)])]; })
                 .filter(function(x){ return x[1] && (x[1].w||x[1].j); });
    if(!use.length) return '';
    var h='<div class="thumbs">';
    use.forEach(function(x){
      var p=x[0], v=x[1];
      var w=v.w?imgURL(v.w):null, j=v.j?imgURL(v.j):null;
      // 用 <picture>：支持 WebP 的用 WebP，老的（如 iOS<14）自动回退 JPEG
      var inner='<img loading="lazy" src="'+esc(j||w)+'" alt="课件 p'+p+'"'+
                ' data-pg="'+p+'" data-src="'+esc(j||w)+'" data-webp="'+esc(w||'')+'" data-jpg="'+esc(j||'')+'">';
      var media = (w && j)
        ? '<picture><source srcset="'+esc(w)+'" type="image/webp">'+inner+'</picture>'
        : inner;
      h+='<div class="thumb">'+media+'<div class="pg">p'+p+'</div></div>';
    });
    return h+'</div>';
  }
  // 灯箱
  function openLB(webp, jpg, cap){
    var d=el('div','lb');
    // 优先 WebP，失败回退 JPEG（老设备不支持 WebP 时靠这个）
    var order=[];
    if(webp) order.push(webp);
    if(jpg && jpg!==webp) order.push(jpg);
    if(!order.length){ return; }
    d.innerHTML='<img alt="'+esc(cap)+'"><div class="cap">'+esc(cap)+'</div>'+
      '<div class="hint">点击任意处关闭</div>';
    document.body.appendChild(d);
    var img=d.querySelector('img'), i=0;
    function tryNext(){
      if(i>=order.length){
        d.innerHTML='<div class="err">图片加载失败<br>可能是浏览器不支持 WebP 格式<br><span style="font-size:12px;opacity:.8">'+esc(order[0])+'</span></div>';
        return;
      }
      img.src=order[i++];
    }
    img.onerror=tryNext;
    tryNext();
    d.onclick=function(){ d.remove(); };
  }
  // 事件委托：点缩略图开灯箱
  document.addEventListener('click', function(e){
    var t=e.target;
    if(!t) return;
    if(t.tagName==='SOURCE') t=t.parentNode;
    if(t && t.tagName==='PICTURE') t=t.querySelector('img');
    if(t && t.tagName==='IMG' && t.dataset && t.dataset.pg){
      openLB(t.dataset.webp||'', t.dataset.jpg||t.dataset.src||'', '课件第 '+t.dataset.pg+' 页');
    }
  });

  /* --- 重点 --- */
  function panePoints(root,ch,s){
    var im=imgOf(ch);
    if(im && Object.keys(im).length){
      root.appendChild(el('div','small muted','本章可查看 '+Object.keys(im).length+' 张课件原图（点图片放大）'));
    }
    (ch.points||[]).forEach(function(p){
      var c=el('div','card');
      c.innerHTML='<div class="between"><div class="ptitle">'+esc(p.title)+'</div>'+
        (p.key?'<span class="chip" style="background:#fff0e6;color:#e8590c">★ 重点</span>':'')+'</div>'+
        '<div class="psrc">'+esc(p.source||'')+'</div><hr>'+
        (p.items||[]).map(function(it){ return '<div class="bul"><div class="d">·</div><div class="t">'+rich(it)+'</div></div>'; }).join('')+
        thumbsHTML(ch, p.source);
      root.appendChild(c);
    });
  }

  /* --- 考点清单 --- */
  function paneKP(root,ch,s){
    var map={};
    (ch.questions||[]).forEach(function(q){
      (q.keyPoints||[]).forEach(function(k){
        map[k]=map[k]||{n:0,src:{},wrong:0};
        map[k].n++;
        var src=(q.sourceDetail||q.basis||q.source||'');
        map[k].src[src]=(map[k].src[src]||0)+1;
        if(state.wrong[q.id]) map[k].wrong++;
      });
    });
    var keys=Object.keys(map);
    if(!keys.length){ root.appendChild(el('div','empty','本章暂无考点标签')); return; }
    root.appendChild(el('div','small muted','本章共 '+keys.length+' 个考点 · 按错题数排序'));
    keys.sort(function(a,b){ return (map[b].wrong-map[a].wrong)||(map[b].n-map[a].n); });
    keys.forEach(function(k){
      var v=map[k];
      var c=el('div','card');
      c.innerHTML='<div class="between"><div style="font-size:16px;font-weight:800">'+esc(k)+'</div>'+
        (v.wrong?'<span class="chip" style="background:#fff0f0;color:#e03131">错 '+v.wrong+'</span>':'')+'</div>'+
        '<div class="small muted" style="margin-top:6px">关联 '+v.n+' 题</div>'+
        '<div class="small muted" style="margin-top:4px">出处：'+esc(Object.keys(v.src).join(' · '))+'</div>';
      root.appendChild(c);
    });
  }

  /* --- 练习 --- */
  var Q=null;
  function paneQuiz(root,ch,s){
    var st=stats(ch);
    // Q.chId==='__wrong__' 表示「只练错题」模式，不按本章重置
    if(!Q || (Q.chId!==ch.id && Q.chId!=='__wrong__')){
      var c=el('div','card');
      c.innerHTML='<div style="font-size:18px;font-weight:800">本章练习</div>'+
        '<div class="small muted" style="margin:8px 0 0">共 '+st.total+' 题 ｜ 重点 '+st.key+' ｜ 非重点 '+st.nonKey+'</div>'+
        '<div class="small muted" style="margin-top:4px">出题规则：<b>课件题目优先</b>，非重点题占比 ≤ '+Math.round(MAX_NONKEY*100)+'%，错题加权</div><hr>';
      [5,10,st.total].filter(function(v,i,a){return v>0&&a.indexOf(v)===i;}).forEach(function(n){
        var b=el('button','btn','开始 '+n+' 题'); b.style.background=s.color;
        b.onclick=function(){ startQuiz(ch,n); };
        c.appendChild(b);
      });
      var wl=wrongList();
      if(wl.length){
        var wb=el('button','btn ghost','只练错题（'+wl.length+' 题）');
        wb.onclick=function(){ startWrongQuiz(wl.map(function(x){return x.q;})); };
        c.appendChild(wb);
      }
      root.appendChild(c); return;
    }
    if(Q.i>=Q.list.length){ return quizDone(root,ch,s); }
    var q=Q.list[Q.i], ps=PS[q.priority]||PS[4], isFill=q.kind==='填空', isExample=(q.kind==='例题'||q.kind==='计算');
    // 进度
    var pr=el('div','row'); pr.style.marginBottom='12px';
    pr.appendChild(el('div','small',''+(Q.i+1)+' / '+Q.list.length));
    var bar=el('div','bar2'); bar.innerHTML='<i style="width:'+(((Q.i+(Q.done?1:0))/Q.list.length)*100)+'%;background:'+s.color+'"></i>';
    pr.appendChild(bar); root.appendChild(pr);

    var c=el('div','card');
    c.appendChild(el('div','row',
      '<span class="tag" style="background:'+ps.b+';color:'+ps.c+'">'+ps.l+'</span>'+
      '<span class="chip">'+esc(q.kind)+'</span>'+
      '<span class="small muted">'+esc(q.basis||'')+'</span>'));
    if(isKey(q)){
      var kp=el('div','kp');
      kp.appendChild(el('span','lab','考点'));
      q.keyPoints.forEach(function(k){ kp.appendChild(el('span','k',esc(k))); });
      c.appendChild(kp);
    }
    c.appendChild(el('div','stem', rich(q.stem)));

    if(isExample){
      /* ---- 例题：已知 → 求解 →（点开）解答过程 → 结果 ---- */
      if((q.given||[]).length){
        c.appendChild(el('div','exlabel','已知'));
        c.appendChild(el('div','exbox', q.given.map(function(g){
          return '<div class="bul"><div class="d">·</div><div class="t">'+rich(g)+'</div></div>';
        }).join('')));
      }
      if((q.ask||[]).length){
        c.appendChild(el('div','exlabel','求解'));
        c.appendChild(el('div','exbox', q.ask.map(function(g){
          return '<div class="bul"><div class="d">·</div><div class="t">'+rich(g)+'</div></div>';
        }).join('')));
      }
      var showSol = !!Q.done || !!Q.solOpen;
      if(showSol){
        if((q.steps||[]).length){
          c.appendChild(el('div','exlabel','解答过程'));
          c.appendChild(el('div','exbox steps', q.steps.map(function(s, i){
            return '<div class="bul"><div class="d">'+(i+1)+'</div><div class="t">'+rich(s)+'</div></div>';
          }).join('')));
        }
        if(q.result) c.appendChild(el('div','exres','结果：'+rich(q.result)));
      }
      var rb0=el('div','res');
      (q.why||[]).forEach(function(w){ rb0.appendChild(el('div','bul','<div class="d">›</div><div class="t">'+rich(w)+'</div>')); });
      if(q.basis) rb0.appendChild(el('div','basis','依据：'+esc(q.basis)));
      if(q.answerNote) rb0.appendChild(el('div','note','⚠️ '+esc(q.answerNote)));
      if(rb0.innerHTML) c.appendChild(rb0);
    } else if(isFill){
      var inp=el('input','fill'); inp.placeholder='输入答案'; inp.value=Q.text||'';
      inp.disabled=!!Q.done;
      inp.oninput=function(){ Q.text=inp.value; var b=$('qsubmit'); if(b) b.disabled=!inp.value.trim(); };
      if(Q.done) inp.style.background = Q.lastOk ? '#e8f6ec' : '#fff0f0';
      c.appendChild(inp);
    } else {
      (q.options||[]).forEach(function(op){
        var sel = q.kind==='多选' ? String(Q.pick||'').indexOf(op.k)>=0 : Q.pick===op.k;
        var isAns = String(q.answer).indexOf(op.k)>=0;
        var cls='opt', mark='';
        if(Q.done){
          if(isAns){ cls+=' ok'; mark='✓'; }
          else if(sel){ cls+=' no'; mark='✗'; }
        } else if(sel) cls+=' sel';
        var d=el('div',cls,'<div class="k">'+esc(op.k)+'</div><div class="t">'+rich(op.t)+'</div>'+(mark?'<div class="m">'+mark+'</div>':''));
        if(!Q.done) d.onclick=function(){
          if(q.kind==='多选'){
            var cur=String(Q.pick||'').split(''), i=cur.indexOf(op.k);
            if(i>=0) cur.splice(i,1); else cur.push(op.k);
            Q.pick=cur.sort().join('');
          } else Q.pick=op.k;
          render();
        };
        c.appendChild(d);
      });
    }

    if(Q.done){
      var ok=Q.lastOk;
      var rb=el('div','res');
      rb.appendChild(el('h4',null,'<span style="color:'+(ok?'#2f9e44':'#e03131')+'">'+(ok?'✓ 回答正确':'✗ 回答错误　正确答案：'+esc(q.answer))+'</span>'));
      (q.why||[]).forEach(function(w){ rb.appendChild(el('div','bul','<div class="d">›</div><div class="t">'+rich(w)+'</div>')); });
      if(q.basis) rb.appendChild(el('div','basis','依据：'+esc(q.basis)));
      if(q.answerNote) rb.appendChild(el('div','note','⚠️ '+esc(q.answerNote)));
      // 答完给出课件原页，便于核对
      var th=thumbsHTML(ch, (q.sourceDetail||'')+' '+(q.basis||''));
      if(th) rb.appendChild(el('div','small muted','课件原页：'));
      if(th) rb.insertAdjacentHTML('beforeend', th);
      c.appendChild(rb);
    }

    var act=el('div'); act.style.marginTop='12px';
    if(isExample){
      /* 例题：先自己算，再点开看解答 */
      if(!Q.done){
        var sb=el('button','btn','看解答'); sb.style.background=s.color;
        sb.onclick=function(){ Q.solOpen=true; Q.done=true; render(); };
        act.appendChild(sb);
      } else {
        var nb2=el('button','btn', (Q.i+1>=Q.list.length?'看结果':'下一题')); nb2.style.background=s.color;
        nb2.onclick=function(){ Q.i++; Q.pick=''; Q.text=''; Q.done=false; Q.solOpen=false; render(); };
        act.appendChild(nb2);
      }
    } else if(!Q.done){
      var b=el('button','btn'+(isFill?'':'')+'','提交'); b.id='qsubmit'; b.style.background=s.color;
      if(isFill && !(Q.text||'').trim()) b.disabled=true;
      if(!isFill && !Q.pick) b.disabled=true;
      b.onclick=function(){
        Q.lastOk=judge(q, isFill?Q.text:Q.pick);
        if(Q.lastOk) markRight(q.id); else markWrong(q.id);
        Q.done=true; render();
      };
      act.appendChild(b);
    } else {
      var nb=el('button','btn', (Q.i+1>=Q.list.length?'看结果':'下一题')); nb.style.background=s.color;
      nb.onclick=function(){ Q.i++; Q.pick=''; Q.text=''; Q.done=false; render(); };
      act.appendChild(nb);
    }
    c.appendChild(act);
    root.appendChild(c);
    var ex=el('button','btn ghost','退出练习');
    ex.onclick=function(){ Q=null; render(); };
    root.appendChild(ex);
  }
  function startQuiz(ch,n){
    Q={ chId:ch.id, list:buildQuiz(ch,n), i:0, pick:'', text:'', done:false, wrong:[] };
    render();
  }
  function quizDone(root,ch,s){
    var right=Q.list.length-Q.wrong.length;
    var kps={}; Q.wrong.forEach(function(q){ (q.keyPoints||[]).forEach(function(k){ kps[k]=1; }); });
    var c=el('div','card center');
    c.innerHTML='<div style="font-size:18px;font-weight:800">完成</div>'+
      '<div class="big">'+right+' / '+Q.list.length+'</div>'+
      '<div class="small muted">正确率 '+Math.round(right/Q.list.length*100)+'%</div>'+
      (Q.wrong.length
        ? '<div class="small" style="margin-top:10px">错题考点：'+esc(Object.keys(kps).join(' · ')||'（无考点标签）')+'</div>'
        : '<div class="small" style="margin-top:10px">全对，很棒</div>')+'<hr>';
    var b=el('button','btn','再来一组'); b.style.background=s.color;
    b.onclick=function(){ startQuiz(ch, Q.list.length); }; c.appendChild(b);
    var b2=el('button','btn ghost','返回练习设置'); b2.onclick=function(){ Q=null; render(); }; c.appendChild(b2);
    root.appendChild(c);
  }

  /* --- 错题本（跨章累计） --- */
  function allQuestions(){
    var out=[];
    DATA.subjects.forEach(function(s){
      (s.chapters||[]).forEach(function(c){
        (c.questions||[]).forEach(function(q){ out.push({q:q, sub:s, ch:c}); });
      });
    });
    return out;
  }
  function wrongList(){
    return allQuestions().filter(function(it){ return (state.wrong[it.q.id]||0) > 0; })
      .sort(function(a,b){ return (state.wrong[b.q.id]||0)-(state.wrong[a.q.id]||0); });
  }
  function paneWrong(root){
    var list=wrongList();
    if(!list.length){
      root.appendChild(el('div','empty','还没有错题。<br>去「练习」做几题吧 —— 做错的题会自动收进这里。'));
      return;
    }
    var stat=el('div','card');
    stat.innerHTML='<div class="between"><div style="font-size:17px;font-weight:800">错题本</div>'+
      '<span class="chip" style="background:#fff0f0;color:#e03131">'+list.length+' 题</span></div>'+
      '<div class="small muted" style="margin-top:6px">按错误次数排序 · 累计记录在本机</div>';
    var b=el('button','btn','只练错题（'+list.length+' 题）');
    b.onclick=function(){ startWrongQuiz(list.map(function(x){return x.q;})); };
    stat.appendChild(el('hr')); stat.appendChild(b);
    root.appendChild(stat);

    list.forEach(function(it){
      var q=it.q, ps=PS[q.priority]||PS[4];
      var c=el('div','card');
      var kp=(q.keyPoints||[]).map(function(k){ return '<span class="k">'+esc(k)+'</span>'; }).join('');
      c.innerHTML='<div class="row"><span class="tag" style="background:'+ps.b+';color:'+ps.c+'">'+ps.l+'</span>'+
        '<span class="chip" style="background:#fff0f0;color:#e03131">错 '+(state.wrong[q.id]||0)+' 次</span>'+
        '<span class="small muted">'+esc(it.sub.name+' · '+it.ch.name)+'</span></div>'+
        (kp?'<div class="kp"><span class="lab">考点</span>'+kp+'</div>':'')+
        '<div class="stem" style="margin:10px 0 8px">'+rich(q.stem)+'</div>'+
        '<div class="basis">正确答案：<b>'+esc(q.answer)+'</b>　依据：'+esc(q.basis||'')+'</div>';
      root.appendChild(c);
    });
    var clr=el('button','btn ghost','清空错题本');
    clr.onclick=function(){ if(confirm('确定清空所有错题记录？')){ state.wrong={}; saveState(state); render(); } };
    root.appendChild(clr);
  }
  function startWrongQuiz(qs){
    Q={ chId:'__wrong__', list:qs, i:0, pick:'', text:'', done:false, wrong:[] };
    R.tab='quiz'; render();
  }

  /* ---------- 总渲染 ---------- */
  function render(){
    renderSubjects();
    var t=$('ttl'), back=$('back');
    if(!R.sub){ t.textContent='专业课'; back.style.display='none'; renderHome(); return; }
    var s=curSub();
    if(!R.ch){ t.textContent=s.name; back.style.display='block'; renderChapters(); return; }
    t.textContent=curCh().name; back.style.display='block'; renderDetail();
  }
  $('back').onclick=function(){
    if(R.ch){ R.ch=null; Q=null; render(); }
    else if(R.sub){ R.sub=null; render(); }
  };

  /* 记录本次练习错题（供结果页用）；例题不算错题 */
  var _oldRender = render;
  render = function(){
    var cur = Q && Q.list[Q.i];
    if(Q && Q.done && cur && Q.lastOk===false
       && cur.kind!=='例题' && cur.kind!=='计算'
       && Q.wrong.indexOf(cur)<0){
      Q.wrong.push(cur);
    }
    _oldRender();
  };

  /* 深链：?subject=boiler&chapter=boiler-intro&tab=points */
  try{
    var p=new URLSearchParams(location.search);
    if(p.get('subject')) R.sub=p.get('subject');
    if(p.get('chapter')) R.ch=p.get('chapter');
    if(p.get('tab')) R.tab=p.get('tab');
  }catch(e){}

  /* 注册 Service Worker（离线可用）。file:// 下会失败，忽略即可。 */
  if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }

  render();
})();
</script>
</body>
</html>
